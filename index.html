%左右，是绝对最常见的组织学类型。其好发于膀胱侧壁和三角区，临床常表现为无痛性肉眼血尿。\n选项分析：\nA. 错误：肉瘤样癌属于尿路上皮癌的罕见特殊亚型，侵袭性强、预后差，但发生率很低，不是膀胱癌最常见类型。\nB. 错误：鳞状细胞癌在膀胱癌中较少见，常与慢性刺激有关，如膀胱结石、长期留置导尿管、慢性膀胱炎或血吸虫病等，并非最常见类型。\nC. 错误：未分化癌恶性程度高、分化差，但发病率低，不能作为膀胱癌最常见组织学类型。\nD. 错误：腺癌较少见，可来源于脐尿管残余（常位于膀胱顶部）或腺性膀胱炎、肠上皮化生等，不是最常见类型。\nE. 正确：移行细胞癌即尿路上皮癌，起源于膀胱移行上皮，占膀胱癌绝大多数，是膀胱癌最常见的组织学类型。\n易混点：移行细胞癌与尿路上皮癌是同一类肿瘤的不同名称，考试中看到“膀胱癌最常见类型”应优先选移行细胞癌/尿路上皮癌。鳞状细胞癌要联想到慢性刺激和血吸虫，腺癌要联想到脐尿管残余或腺性膀胱炎，二者均属少见类型。","chapter":13,"chapterName":"泌尿系统疾病","chapterTitle":"第13章 泌尿系统疾病"},{"id":"pathology-a-single-0212","type":"single","typeLabel":"单选题","number":212,"question":"大叶性肺炎患者的铁锈色痰变成黏液脓痰是在","options":[{"key":"A","text":"充血水肿期"},{"key":"B","text":"红色肝样变期"},{"key":"C","text":"灰色肝样变期"},{"key":"D","text":"溶解消散期"},{"key":"E","text":"病变恢复期"}],"answerKeys":["C"],"answerText":["灰色肝样变期"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：大叶性肺炎各期肺泡渗出物成分变化与痰液性状的对应关系。\n解析：大叶性肺炎红色肝样变期肺泡内大量红细胞漏出并破坏，血红蛋白衍生物混入痰中，故咳铁锈色痰；进入灰色肝样变期后，肺泡壁毛细血管受压，充血减轻，红细胞减少并溶解，渗出物以纤维素和大量中性粒细胞为主，痰转为黏液脓痰。题眼是“铁锈色痰变为黏液脓痰”的转折点，即红色肝样变期向灰色肝样变期过渡。病变肉眼呈灰白色实变，镜下肺泡腔内充满纤维素网及中性粒细胞。\n选项分析：\nA. 错误：充血水肿期为病变早期，肺泡壁毛细血管扩张充血、浆液渗出，痰液多为少量浆液性泡沫痰，尚无典型铁锈色痰。\nB. 错误：红色肝样变期肺泡内大量红细胞漏出，是铁锈色痰的典型时期，不是转为黏液脓痰的时期。\nC. 正确：灰色肝样变期红细胞减少、中性粒细胞和纤维素大量渗出，故痰由铁锈色变为黏液脓痰，并伴灰白色肝样变。\nD. 错误：溶解消散期渗出物逐渐溶解吸收，痰可呈稀薄脓性，但“铁锈色痰转为黏液脓痰”的病理基础在灰色肝样变期已形成。\nE. 错误：病变恢复期不是大叶性肺炎的经典病理分期，不能准确对应痰液转变的形态学阶段。\n易混点：红色肝样变期记“红、实、铁锈色痰”；灰色肝样变期记“灰白、纤维素和中性粒细胞为主、黏液脓痰”。铁锈色痰不是全程持续，而是红色肝样变期的特征性表现。","chapter":10,"chapterName":"呼吸系统疾病","chapterTitle":"第10章 呼吸系统疾病"},{"id":"pathology-a-single-0213","type":"single","typeLabel":"单选题","number":213,"question":"急性重型肝炎的病变，哪项是不正确的","options":[{"key":"A","text":"肝细胞大片坏死"},{"key":"B","text":"肝窦扩张充血"},{"key":"C","text":"网状支架塌陷"},{"key":"D","text":"坏死灶及周围有炎细胞浸润"},{"key":"E","text":"肝细胞再生结节形成"}],"answerKeys":["E"],"answerText":["肝细胞再生结节形成"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n核心考点：急性重型肝炎的病理特点为肝细胞大片坏死、网状支架塌陷及炎症反应，但不形成肝细胞再生结节。\n解析：急性重型肝炎起病急、病情重，镜下以肝细胞大片坏死为突出表现，坏死区可出现充血、出血及炎细胞浸润，网状纤维支架塌陷。由于病程急重，肝细胞虽有再生反应，但来不及形成结节；肝细胞再生结节是肝硬化时假小叶内的再生肝细胞团，属于慢性肝病结构改建的表现。本题题眼是“急性重型肝炎”与“再生结节形成”的对应关系。\n\n选项分析：\nA. 正确：急性重型肝炎可见肝细胞大片坏死，常呈大块或亚大块坏死，导致肝功能严重障碍。\nB. 正确：坏死区肝窦扩张、充血甚至出血，是急性重型肝炎肝组织充血出血性改变的一部分。\nC. 正确：大片坏死可导致网状纤维支架塌陷，是日后可能发展为坏死后性肝硬化的结构基础。\nD. 正确：坏死灶及周围可见炎细胞浸润，属于坏死性炎症反应。\nE. 错误：肝细胞再生结节形成是肝硬化（尤其假小叶形成）的病变特点，急性重型肝炎病程急，不以再生结节形成为特征。\n\n易混点：急性重型肝炎要抓住“大片坏死、支架塌陷、无明显再生结节”；肝硬化要抓住“假小叶、纤维间隔、肝细胞再生结节”。若见到“再生结节”，应优先联想到肝硬化而不是急性重型肝炎。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-a-single-0214","type":"single","typeLabel":"单选题","number":214,"question":"对炎症病变痊愈来说，下列哪项是错误的","options":[{"key":"A","text":"致炎因子被清除"},{"key":"B","text":"坏死组织被溶解吸收"},{"key":"C","text":"由肉芽组织修复"},{"key":"D","text":"损伤的组织结构和功能完全恢复"},{"key":"E","text":"有肉芽肿形成"}],"answerKeys":["E"],"answerText":["有肉芽肿形成"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n核心考点：炎症的痊愈与修复过程，重点区分肉芽组织修复与肉芽肿形成。\n解析：炎症痊愈包括致炎因子消除、坏死组织溶解吸收以及组织缺损修复。组织缺损较大时可由肉芽组织增生填充，最终形成瘢痕，因此肉芽组织修复属于愈合过程；完全痊愈时损伤组织的结构和功能可完全恢复。肉芽肿则是慢性肉芽肿性炎的特征性病变，如结核、结节病、异物性炎症等，提示特殊类型慢性炎症，并不是炎症痊愈的必备条件或表现。本题题眼是“肉芽组织”与“肉芽肿”的概念区别。\n\n选项分析：\nA. 正确：致炎因子被清除是炎症痊愈的前提，病因去除后炎症可逐渐消退。\nB. 正确：坏死组织被溶解、吸收是炎症修复和痊愈的重要环节。\nC. 正确：组织缺损较大时，由肉芽组织增生填充并最终机化、瘢痕修复，属于愈合过程。\nD. 正确：完全痊愈时损伤组织的结构和功能可完全恢复；若缺损较大则为不完全痊愈，但D本身描述的是完全痊愈的结局。\nE. 错误：肉芽肿形成是慢性肉芽肿性炎的特征，如结核结节、异物肉芽肿等，不代表炎症痊愈，也不是痊愈的必要条件。\n\n易混点：肉芽组织是新生毛细血管和成纤维细胞等构成的修复性组织；肉芽肿是巨噬细胞及其衍生细胞局限性增生形成的结节。记忆要点：肉芽组织参与“修复愈合”，肉芽肿提示“慢性肉芽肿性炎”。","chapter":4,"chapterName":"炎症","chapterTitle":"第4章 炎症"},{"id":"pathology-a-single-0215","type":"single","typeLabel":"单选题","number":215,"question":"下列哪种激素具有抑制炎症的作用","options":[{"key":"A","text":"甲状腺素"},{"key":"B","text":"生长激素"},{"key":"C","text":"垂体促甲状腺素"},{"key":"D","text":"促肾上腺皮质激素"},{"key":"E","text":"肾上腺糖皮质激素"}],"answerKeys":["E"],"answerText":["肾上腺糖皮质激素"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n\n核心考点：肾上腺糖皮质激素是体内最重要的内源性抗炎激素，可多环节抑制炎症反应。\n\n解析：肾上腺糖皮质激素能抑制炎症早期及晚期反应：抑制磷脂酶A2，减少前列腺素、白三烯等炎症介质生成；抑制促炎细胞因子释放和黏附分子表达，降低毛细血管通透性，减少白细胞渗出；还可抑制成纤维细胞增生和胶原沉积。因此，炎症早期表现为红、肿、热、痛减轻，晚期可抑制纤维化。本题题眼是“抑制炎症的激素”，应选肾上腺糖皮质激素。\n\n选项分析：\nA. 错误：甲状腺素主要促进机体代谢、产热和生长发育，不具直接抑制炎症的作用，不能作为抗炎激素。\nB. 错误：生长激素促进骨骼和软组织生长，并可影响代谢，但不是抑制炎症的激素，不能选。\nC. 错误：垂体促甲状腺素促进甲状腺合成和释放甲状腺素，属于甲状腺轴调节激素，不直接抑制炎症。\nD. 错误：促肾上腺皮质激素可刺激肾上腺皮质分泌糖皮质激素，从而间接影响炎症，但其本身不是直接抑制炎症的激素；本题问具有抑制炎症作用的激素，标准答案为糖皮质激素。\nE. 正确：肾上腺糖皮质激素通过抑制炎症介质生成、白细胞渗出、血管通透性升高及纤维增生等多个环节，发挥强大抗炎作用，是正确答案。\n\n易混点：促肾上腺皮质激素与肾上腺糖皮质激素易混。前者作用于肾上腺皮质，促进后者分泌，间接抗炎；直接具有抗炎作用的是肾上腺糖皮质激素。记忆要点：ACTH是“促”激素，糖皮质激素才是“抗炎”激素。","chapter":4,"chapterName":"炎症","chapterTitle":"第4章 炎症"},{"id":"pathology-a-single-0216","type":"single","typeLabel":"单选题","number":216,"question":"胃癌切片，镜下可见癌细胞弥漫浸润于黏膜下层及肌层，癌细胞的细胞核偏于细胞一侧，胞浆内也可见淡蓝色无结构物质，应诊断为","options":[{"key":"A","text":"低分化腺癌"},{"key":"B","text":"髓样癌"},{"key":"C","text":"印戒细胞癌"},{"key":"D","text":"硬癌"},{"key":"E","text":"癌肉瘤"}],"answerKeys":["C"],"answerText":["印戒细胞癌"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：印戒细胞癌的镜下形态及黏液分泌特征。\n解析：胃癌细胞弥漫浸润黏膜下层和肌层，细胞核被胞浆内黏液推挤至一侧，胞浆内见淡蓝色无结构物质（黏液），形成典型的“印戒样”细胞，故诊断为印戒细胞癌。题眼是“核偏于细胞一侧”和“胞浆内淡蓝色无结构物质”，提示细胞内黏液积聚；黏液染色常阳性。印戒细胞癌易弥漫浸润胃壁，可导致胃壁增厚僵硬，临床需与低分化腺癌、硬癌等鉴别。\n\n选项分析：\nA. 错误：低分化腺癌腺管结构不明显、细胞异型性明显，但通常不以核偏位和胞浆内黏液空泡为诊断性特征；印戒细胞癌虽可属低分化癌范畴，但本题形态已够特异，应选更具体的印戒细胞癌。\nB. 错误：髓样癌表现为癌细胞呈实性片巢状生长，间质少、淋巴细胞浸润较多，质地较软、边界相对清楚；与本题弥漫浸润及印戒样细胞不符。\nC. 正确：癌细胞核偏位、胞浆内充满淡蓝色黏液，呈印戒样，并弥漫浸润胃壁，符合印戒细胞癌的典型组织学表现。\nD. 错误：硬癌以癌组织少、纤维间质大量增生为特点，质地坚硬，镜下突出的是丰富纤维组织而非胞浆内黏液和印戒样细胞。\nE. 错误：癌肉瘤需同时具有癌和肉瘤两种恶性成分，常见癌成分与梭形肉瘤样成分并存；本题为单一上皮性肿瘤的印戒细胞形态，无肉瘤成分。\n\n易混点：印戒细胞癌与低分化腺癌都可分化差，但前者关键在细胞内黏液将核挤向一侧；硬癌和印戒细胞癌都可弥漫浸润胃壁、形成“皮革胃”倾向，但硬癌的形态学核心是大量纤维间质，印戒细胞癌的核心是印戒样癌细胞。记忆要点：核偏位＋胞浆黏液空泡＝印戒细胞癌。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-a-single-0217","type":"single","typeLabel":"单选题","number":217,"question":"下列描述与浆液性囊腺瘤不相符的是","options":[{"key":"A","text":"多为单侧发生"},{"key":"B","text":"可有乳头状结构"},{"key":"C","text":"常为多房性生长"},{"key":"D","text":"囊壁为单层立方上皮"},{"key":"E","text":"恶变率高"}],"answerKeys":["C"],"answerText":["常为多房性生长"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：卵巢浆液性囊腺瘤与黏液性囊腺瘤的病理形态鉴别，尤其是囊房数目和上皮性质。\n解析：浆液性囊腺瘤是卵巢常见的良性上皮性肿瘤，多为单侧发生，常呈单房性，囊内为清亮浆液，囊壁衬覆单层立方或柱状上皮，可形成乳头状结构。题目问“不相符”的描述，C项“常为多房性生长”不符合浆液性囊腺瘤，多房性生长是黏液性囊腺瘤的典型特点。浆液性囊腺瘤尤其伴乳头状结构者有一定恶变倾向，故E作为相对描述可与本题答案体系相符，题眼在“多房”与“单房”的鉴别。\n选项分析：\nA. 正确（与浆液性囊腺瘤相符）：浆液性囊腺瘤多为单侧发生，而浆液性癌常双侧受累，单侧性是良性囊腺瘤的常考特点。\nB. 正确（与浆液性囊腺瘤相符）：良性浆液性囊腺瘤可形成乳头状结构，但乳头分支较简单、细胞无明显异型；出现复杂乳头和异型增生时应考虑交界性肿瘤。\nC. 错误（与浆液性囊腺瘤不相符，本题选C）：浆液性囊腺瘤常为单房性，多房性生长是黏液性囊腺瘤的典型形态，故C不是浆液性囊腺瘤的常见描述。\nD. 正确（与浆液性囊腺瘤相符）：囊壁被覆单层立方至柱状上皮，可伴纤毛，符合浆液性上皮的形态特点。\nE. 正确（与浆液性囊腺瘤相符）：教材中浆液性囊腺瘤尤其是乳头状者相对黏液性囊腺瘤恶变倾向较高，但良性者总体仍属良性肿瘤，不能等同于囊腺癌。\n易混点：浆液性囊腺瘤记忆为“多单侧、多单房、浆液清亮、单层立方/柱状上皮、可有乳头”；黏液性囊腺瘤记忆为“多单侧、多房、体积较大、囊内黏液、衬覆高柱状黏液上皮”。看到“多房”优先联想黏液性囊腺瘤，看到“乳头、浆液”优先联想浆液性肿瘤。","chapter":14,"chapterName":"生殖系统和乳腺疾病","chapterTitle":"第14章 生殖系统和乳腺疾病"},{"id":"pathology-a-single-0218","type":"single","typeLabel":"单选题","number":218,"question":"细动脉透明变性常见于下列哪项","options":[{"key":"A","text":"肾、心、脾、视网膜等处的细动脉"},{"key":"B","text":"肺、胰、肠系膜等处的细动脉"},{"key":"C","text":"肾、脑、肝、心等处的细动脉"},{"key":"D","text":"心、肺、脾、视网膜等处的细动脉"},{"key":"E","text":"肾、脑、脾、视网膜等处的细动脉"}],"answerKeys":["A"],"answerText":["肾、心、脾、视网膜等处的细动脉"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：A\n核心考点：细动脉透明变性（细动脉玻璃样变）的好发部位及良性高血压的血管病理改变。\n解析：细动脉透明变性常见于良性高血压和糖尿病。其机制是细动脉长期痉挛、内皮通透性增高，血浆蛋白渗入管壁，并伴平滑肌细胞产生基质，使管壁增厚、均质红染、管腔狭窄，导致所供组织缺血。考试中最典型的好发部位组合是肾、心、脾、视网膜等处的细动脉，其中肾入球小动脉和视网膜小动脉最常考；题眼是“细动脉透明变性”对应良性高血压的细动脉玻璃样变。\n选项分析：\nA. 正确：肾、心、脾、视网膜等处细动脉是细动脉透明变性的典型好发部位。肾入球小动脉玻璃样变可致肾小球缺血、肾实质萎缩；视网膜细动脉病变可引起眼底改变；心和脾细动脉也可受累。\nB. 错误：肺、胰、肠系膜等处的细动脉不是本题所依据的典型好发组合。肺循环细动脉并非良性高血压细动脉玻璃样变的代表部位，胰和肠系膜也不是考试常列部位；本项错在部位组合。\nC. 错误：肾、心虽可受累，但肝不是细动脉透明变性的典型好发部位。肝内血管病变常考门脉高压、肝窦等，不是本题所问的细动脉玻璃样变标准部位；本项错在加入肝。\nD. 错误：心、脾、视网膜可受累，但肺不是典型部位，且缺少最常考的肾。本项将肺错误加入组合，不能作为标准答案。\nE. 错误：肾、脾、视网膜可受累，但脑在高血压中更常考细小动脉痉挛、纤维素样坏死及微动脉瘤形成等改变；本项将脑替代心，并非本题标准组合。\n易混点：细动脉透明变性主要见于良性高血压和糖尿病，镜下为管壁均质红染、增厚、管腔狭窄；而纤维素样坏死多见于恶性高血压和免疫复合物相关病变，表现为管壁坏死、纤维蛋白样红染。记忆要点：良性高血压细动脉“肾心脾视网膜，透明变性管壁厚”；恶性高血压则重点想到纤维素样坏死和增生性小动脉硬化。","chapter":9,"chapterName":"心血管系统疾病","chapterTitle":"第9章 心血管系统疾病"},{"id":"pathology-a-single-0219","type":"single","typeLabel":"单选题","number":219,"question":"由肥大细胞释放的炎症介质有","options":[{"key":"A","text":"溶菌酶"},{"key":"B","text":"血管活性胺"},{"key":"C","text":"激肽"},{"key":"D","text":"补体"},{"key":"E","text":"缓激肽"}],"answerKeys":["B"],"answerText":["血管活性胺"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：肥大细胞释放的炎症介质主要是血管活性胺（以组胺为代表），可引起血管扩张和通透性增高。\n解析：肥大细胞受到刺激后发生脱颗粒，释放组胺等血管活性胺，使细动脉扩张、细静脉通透性增加，并可引起平滑肌收缩，是急性炎症血管反应的重要介质。本题题眼是“由肥大细胞释放”，应想到组胺及其所属的血管活性胺类。血管活性胺还包括5-羟色胺，但人类肥大细胞以组胺为主。\n选项分析：\nA. 错误：溶菌酶主要来自中性粒细胞、巨噬细胞等，属于抗菌物质，不是肥大细胞释放的典型炎症介质。\nB. 正确：血管活性胺中的组胺主要由肥大细胞释放，是急性炎症早期血管扩张和通透性增加的关键介质，符合题意。\nC. 错误：激肽是一类血浆蛋白衍生肽类，由激肽系统经激肽释放酶作用于激肽原生成，并非肥大细胞释放。\nD. 错误：补体是血浆中的一组蛋白质，主要由肝细胞等合成，通过级联反应发挥作用，不属于肥大细胞释放的介质。\nE. 错误：缓激肽是激肽系统中最重要的成员，由激肽原在激肽释放酶作用下生成，可引起血管扩张和疼痛，但不是肥大细胞释放。\n易混点：血管活性胺易与激肽系统混淆。记忆要点是：肥大细胞脱颗粒释放组胺，属于血管活性胺；缓激肽属于激肽系统，由血浆激肽原生成，不是肥大细胞直接释放。补体则是血浆级联蛋白，也不来自肥大细胞。","chapter":4,"chapterName":"炎症","chapterTitle":"第4章 炎症"},{"id":"pathology-a-single-0220","type":"single","typeLabel":"单选题","number":220,"question":"炎症时，引起白细胞渗出最重要的因素是","options":[{"key":"A","text":"血管壁通透性升高"},{"key":"B","text":"白细胞附壁"},{"key":"C","text":"炎症介质起作用"},{"key":"D","text":"白细胞的阿米巴运动"},{"key":"E","text":"血管内压力升高"}],"answerKeys":["C"],"answerText":["炎症介质起作用"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n\n核心考点：炎症介质是调控白细胞边集、黏附、游出和趋化全过程的最重要因素。\n\n解析：炎症时白细胞渗出的基本过程包括边集、黏附、游出和趋化，其中炎症介质通过增加黏附分子表达、改变白细胞骨架运动并形成趋化浓度梯度，发挥核心调控作用。白细胞能否从血管内向炎区聚集，关键取决于趋化因子等炎症介质的作用，因此“炎症介质起作用”是最重要因素。本题题眼是“最重要因素”，而不是单纯问白细胞游出的方式或血管通透性改变。\n\n选项分析：\nA. 错误：血管壁通透性升高主要使血浆蛋白和液体渗出，形成炎性水肿，属于渗出液形成的重要机制；它可造成血液浓缩、有利于边集，但不是引起白细胞渗出最重要的直接因素。\nB. 错误：白细胞附壁是白细胞渗出的一个步骤，指白细胞靠边并贴附于内皮，其发生依赖选择素、整合素等黏附分子，而这些分子的表达和功能受炎症介质调控，故附壁不是“最重要因素”。\nC. 正确：炎症介质如趋化因子、补体C5a、白三烯B4、细胞因子等可促进白细胞黏附、激活和趋化运动，是启动并协调白细胞渗出最重要的因素。\nD. 错误：白细胞的阿米巴运动是白细胞游出血管壁和向炎区移动的运动方式，属于执行环节；若没有趋化物质和炎症介质引导，单纯运动不能解释白细胞定向渗出。\nE. 错误：血管内压力升高主要引起漏出液增多，见于心源性水肿、静脉回流受阻等，蛋白含量低；炎症时白细胞渗出是主动的、介质依赖的过程，不能归因于压力升高。\n\n易混点：漏出液与渗出液的鉴别要点是前者蛋白少、细胞少、比重低，后者蛋白多、细胞多、比重高；白细胞渗出要抓住“黏附—游出—趋化”链条，其中炎症介质是总调控因素，阿米巴运动只是游出方式。","chapter":4,"chapterName":"炎症","chapterTitle":"第4章 炎症"},{"id":"pathology-a-single-0221","type":"single","typeLabel":"单选题","number":221,"question":"急性重型肝炎的病变性质是","options":[{"key":"A","text":"以肝细胞变性为主的炎症"},{"key":"B","text":"以肝细胞坏死为主的炎症"},{"key":"C","text":"以肝细胞增生为主的炎症"},{"key":"D","text":"以汇管区渗出为主的炎症"},{"key":"E","text":"以汇管区增生为主的炎症"}],"answerKeys":["B"],"answerText":["以肝细胞坏死为主的炎症"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：急性重型肝炎以肝细胞广泛而严重的坏死为基本病变，属于坏死性炎症。\n解析：急性重型肝炎又称急性大块性肝坏死，起病急、进展快，病毒等因素引起肝细胞广泛坏死，可累及多个小叶，残余肝细胞少，网状支架塌陷，伴炎细胞浸润和出血。肉眼见肝体积明显缩小、包膜皱缩、切面黄红色或暗红色；临床常出现重度黄疸、出血倾向、肝性脑病和肝肾综合征。题眼是“急性重型”，其病变核心不是一般变性，而是大片坏死。\n选项分析：\nA. 错误：以肝细胞变性为主见于急性普通型肝炎，表现为肝细胞胞质疏松化、气球样变及嗜酸性变，坏死较轻，不是重型肝炎的广泛坏死。\nB. 正确：急性重型肝炎以肝细胞大块或亚大块坏死为主，坏死范围广、程度重，是导致急性肝功能衰竭的病理基础。\nC. 错误：以肝细胞增生为主多见于慢性肝炎、肝硬化等，急性重型肝炎病程短，肝细胞再生常不明显，且大量坏死才是主要矛盾。\nD. 错误：汇管区渗出为主的描述不符合急性重型肝炎；病毒性肝炎虽可有汇管区炎细胞浸润，但重型肝炎的关键是实质广泛坏死，而非汇管区渗出。\nE. 错误：汇管区增生、纤维组织增生主要见于慢性肝炎和肝硬化，属于慢性修复性改变，不是急性重型肝炎的急性病变特征。\n易混点：急性普通型肝炎以肝细胞变性、点状坏死为主；急性重型肝炎以广泛大块坏死为主。记忆要点是“普通型看变性，重型看大片坏死，慢性看增生纤维化”。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-a-single-0222","type":"single","typeLabel":"单选题","number":222,"question":"下列哪型肝炎的肝脏重量减轻最明显","options":[{"key":"A","text":"急性普通型肝炎"},{"key":"B","text":"急性重型肝炎"},{"key":"C","text":"亚急性重型肝炎"},{"key":"D","text":"重度慢性肝炎"},{"key":"E","text":"轻度慢性肝炎"}],"answerKeys":["B"],"answerText":["急性重型肝炎"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：各型病毒性肝炎的肝细胞坏死范围与肝脏大体形态改变，尤其是急性重型肝炎所致“急性黄色肝萎缩”。\n解析：急性重型肝炎起病急骤，肝细胞发生广泛的大块坏死，肝实质迅速崩解减少，因此肝脏体积明显缩小、重量显著减轻，包膜皱缩，切面呈黄红色，临床上称急性黄色肝萎缩。本题题眼是“肝脏重量减轻最明显”，其病理基础是广泛大块坏死而肝细胞再生不明显。亚急性重型肝炎虽也有亚大块坏死，但常伴结节状肝细胞再生，重量减轻程度一般不及急性重型肝炎。\n选项分析：\nA. 错误：急性普通型肝炎以肝细胞广泛水肿、气球样变及点状坏死为主，肝脏体积常轻度增大，重量多增加或正常，不表现为明显减轻。\nB. 正确：急性重型肝炎因广泛大块坏死导致肝实质大量丧失，肝脏体积缩小、重量明显减轻，是各型肝炎中重量减轻最明显者。\nC. 错误：亚急性重型肝炎有亚大块坏死，同时可见肝细胞结节状再生，肝脏可缩小、重量可减轻，但通常不如急性重型肝炎显著。\nD. 错误：重度慢性肝炎以汇管区纤维化、界面炎及肝结构改建为主，可发展为肝硬化而肝体积缩小、质地变硬，但并非急性广泛坏死所致的最明显重量减轻。\nE. 错误：轻度慢性肝炎炎症及坏死轻微，肝体积多正常或轻度肿大，无明显肝脏重量减轻。\n易混点：急性重型肝炎与亚急性重型肝炎均可出现肝脏缩小，但前者坏死更急、更广，再生不明显，重量减轻最显著；后者坏死与再生并存，肝表面可呈结节状，重量减轻相对较轻。急性普通型肝炎则因肝细胞水肿常表现为肝肿大，不要与重型肝炎的肝萎缩混淆。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-a-single-0223","type":"single","typeLabel":"单选题","number":223,"question":"淋病属于","options":[{"key":"A","text":"化脓性炎症"},{"key":"B","text":"假膜性炎症"},{"key":"C","text":"浆液性炎症"},{"key":"D","text":"变质性炎症"},{"key":"E","text":"肉芽肿性炎症"}],"answerKeys":["A"],"answerText":["化脓性炎症"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：A\n核心考点：淋病是由淋病奈瑟菌引起的泌尿生殖道黏膜急性化脓性炎症，渗出物以中性粒细胞为主。\n解析：淋病奈瑟菌主要侵犯尿道、宫颈等柱状上皮及移行上皮，引起黏膜充血、水肿和大量中性粒细胞浸润，形成脓性分泌物，故属于化脓性炎症。镜下可见中性粒细胞聚集，分泌物涂片有时可见中性粒细胞内革兰阴性双球菌。\n选项分析：\nA. 正确：淋病的基本病理变化为化脓性炎，好发于泌尿生殖道黏膜，临床常见尿痛、尿道口或宫颈脓性分泌物。\nB. 错误：假膜性炎症属于纤维素性炎，常见于白喉、细菌性痢疾等，以纤维素渗出并形成假膜为特点，不是淋病的典型病变。\nC. 错误：浆液性炎症以浆液渗出为主，常见于感冒早期、结核性胸膜炎等，淋病典型表现为脓性而非单纯浆液性渗出。\nD. 错误：变质性炎症以实质细胞变性、坏死为主，渗出和增生较轻，常见于病毒性肝炎、乙型脑炎等，不符合淋病的中性粒细胞化脓性渗出。\nE. 错误：肉芽肿性炎症是慢性炎症的特殊类型，以巨噬细胞增生形成肉芽肿为特征，常见于结核、麻风、梅毒等，淋病不形成典型肉芽肿。\n易混点：化脓性炎以中性粒细胞渗出和脓液形成为核心；假膜性炎是纤维素性炎，虽可有中性粒细胞参与，但关键是纤维素性假膜形成。记忆时抓住“淋病—淋球菌—脓性分泌物—化脓性炎”。","chapter":4,"chapterName":"炎症","chapterTitle":"第4章 炎症"},{"id":"pathology-a-single-0224","type":"single","typeLabel":"单选题","number":224,"question":"Krukenberg瘤指的是转移的","options":[{"key":"A","text":"肝细胞癌"},{"key":"B","text":"胃黏液腺癌"},{"key":"C","text":"乳腺癌"},{"key":"D","text":"卵巢癌"},{"key":"E","text":"肺小细胞癌"}],"answerKeys":["B"],"answerText":["胃黏液腺癌"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：Krukenberg瘤是卵巢的转移性黏液腺癌，最常来源于胃的印戒细胞癌/黏液腺癌。\n解析：Krukenberg瘤的本质是癌细胞经种植或淋巴道等途径转移至卵巢，形成双侧或单侧卵巢肿块，镜下可见含黏液的印戒样细胞弥漫浸润，伴明显纤维组织增生。胃黏液腺癌（尤其印戒细胞癌）是最经典、最常见的原发灶，因此本题题眼是“卵巢转移性黏液癌的来源”。临床可表现为卵巢肿块，有时原发胃部症状不明显，易误诊为卵巢原发肿瘤。\n选项分析：\nA. 错误：肝细胞癌可发生卵巢转移，但不符合Krukenberg瘤的典型定义；Krukenberg瘤特指来源于胃肠道、以胃黏液腺癌/印戒细胞癌最典型的卵巢转移性黏液癌。\nB. 正确：胃黏液腺癌（包括印戒细胞癌）是Krukenberg瘤最经典来源，转移至卵巢后形成富含黏液、印戒样细胞及纤维增生的转移性癌。\nC. 错误：乳腺癌可转移至卵巢，但乳腺癌不是Krukenberg瘤的典型来源；其形态多为乳腺浸润性癌，而非典型卵巢黏液印戒细胞性转移。\nD. 错误：卵巢癌是原发于卵巢的肿瘤，而Krukenberg瘤是“转移至卵巢”的肿瘤；将卵巢原发癌当作Krukenberg瘤是概念错误。\nE. 错误：肺小细胞癌可转移至卵巢，但属于小细胞癌转移，不是Krukenberg瘤所特指的胃肠道黏液腺癌来源。\n易混点：Krukenberg瘤不是卵巢原发癌，而是卵巢转移性癌，最常来自胃；记忆要点是“胃黏液/印戒细胞癌→卵巢间质纤维增生+印戒细胞”。卵巢原发黏液癌和乳腺癌卵巢转移均需与Krukenberg瘤鉴别，关键看原发灶及典型印戒细胞、黏液背景。","chapter":14,"chapterName":"生殖系统和乳腺疾病","chapterTitle":"第14章 生殖系统和乳腺疾病"},{"id":"pathology-a-single-0225","type":"single","typeLabel":"单选题","number":225,"question":"诊断肉瘤的主要依据是","options":[{"key":"A","text":"青年人"},{"key":"B","text":"无包膜"},{"key":"C","text":"肺部转移"},{"key":"D","text":"异型性大，分裂象"},{"key":"E","text":"瘤细胞弥漫分布，与间质分界不清"}],"answerKeys":["E"],"answerText":["瘤细胞弥漫分布，与间质分界不清"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n核心考点：癌与肉瘤的组织学鉴别，肉瘤起源于间叶组织，瘤细胞多弥漫分布、与间质分界不清。\n解析：肉瘤由间叶组织来源的恶性肿瘤细胞构成，瘤细胞常呈弥漫性分布，间质血管较丰富，瘤细胞与间质之间缺乏清楚界限；而癌起源于上皮组织，癌细胞多呈巢状、索状或腺管状排列，癌巢与间质分界较清楚。判断肉瘤不能仅凭年龄、有无包膜或转移部位，而应抓住其组织结构和细胞排列方式这一病理诊断依据。题眼是“诊断肉瘤的主要依据”，即肉瘤的组织学排列特点。\n\n选项分析：\nA. 错误：青年人是某些肉瘤（如骨肉瘤、横纹肌肉瘤等）的相对好发年龄，但年龄只能提供临床线索，不能作为诊断肉瘤的主要病理依据。\nB. 错误：无包膜并非肉瘤特有，许多恶性肿瘤甚至部分良性肿瘤也可无包膜；有无包膜不能可靠区分癌与肉瘤。\nC. 错误：肉瘤易沿血道转移，肺是常见转移部位，但癌也可发生肺转移；转移部位属于临床和生物学行为，不是诊断肉瘤的主要组织学依据。\nD. 错误：异型性大、核分裂象多提示恶性肿瘤，是癌和肉瘤共有的恶性特征，不能据此单独诊断肉瘤或区分癌与肉瘤。\nE. 正确：肉瘤细胞起源于间叶组织，常弥漫分布，瘤细胞与间质分界不清，间质血管丰富；癌细胞则多呈巢状排列，癌巢与间质分界清楚，因此这是诊断肉瘤的主要组织学依据。\n\n易混点：癌与肉瘤的核心鉴别是组织学结构：癌为上皮来源，癌细胞成巢、成索，与间质分界清楚；肉瘤为间叶来源，瘤细胞弥漫分布，与间质分界不清。异型性、核分裂象和转移途径只提示恶性或生物学行为，不能替代组织结构判断。","chapter":6,"chapterName":"肿瘤","chapterTitle":"第6章 肿瘤"},{"id":"pathology-a-single-0226","type":"single","typeLabel":"单选题","number":226,"question":"大叶性肺炎患者，明显的发绀症状常出现在哪一期","options":[{"key":"A","text":"充血水肿期"},{"key":"B","text":"红色肝样变期"},{"key":"C","text":"灰色肝样变期"},{"key":"D","text":"溶解消散期"},{"key":"E","text":"病变恢复期"}],"answerKeys":["B"],"answerText":["红色肝样变期"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：大叶性肺炎各期病理变化与缺氧、发绀症状的关系，红色肝样变期肺泡换气功能障碍最突出。\n解析：大叶性肺炎红色肝样变期肺泡腔内充满大量红细胞、纤维素和中性粒细胞，肺组织实变，肺泡通气/血流比例失调，动脉血氧分压下降，故可出现明显发绀。此期肺泡壁毛细血管仍扩张充血，红细胞渗出显著，是题眼“红色”和“明显发绀”的对应点。充血水肿期病变较轻，灰色肝样变期充血减轻、红细胞溶解，发绀常较前减轻；溶解消散期和恢复期症状逐渐缓解。\n\n选项分析：\nA. 错误：充血水肿期为早期，肺泡壁毛细血管扩张充血、肺泡腔浆液渗出，可有轻度缺氧，但通常不出现明显发绀。\nB. 正确：红色肝样变期肺泡腔大量红细胞、纤维素和中性粒细胞渗出，肺实变明显，换气功能障碍，低氧血症导致明显发绀。\nC. 错误：灰色肝样变期肺泡腔仍实变，但毛细血管受压贫血、红细胞溶解，充血较红色肝样变期减轻，发绀通常减轻而非最明显。\nD. 错误：溶解消散期渗出物逐渐溶解吸收，肺泡通气逐步恢复，缺氧和发绀应减轻。\nE. 错误：病变恢复期不是大叶性肺炎经典病理分期，指临床恢复阶段，发绀应缓解，不会作为明显发绀期。\n\n易混点：红色肝样变期与灰色肝样变期均属实变期，但红色肝样变期以充血和大量红细胞渗出为特点，临床缺氧、发绀明显；灰色肝样变期以贫血性实变、纤维素和中性粒细胞为主，发绀减轻。记忆要点：红肝期“红、充血、缺氧重”，灰肝期“灰白、贫血、缺氧轻”。","chapter":10,"chapterName":"呼吸系统疾病","chapterTitle":"第10章 呼吸系统疾病"},{"id":"pathology-a-single-0227","type":"single","typeLabel":"单选题","number":227,"question":"子宫颈早期浸润癌是指","options":[{"key":"A","text":"癌细胞未突破基膜"},{"key":"B","text":"癌细胞突破基膜，浸润深度不超过基膜下5mm"},{"key":"C","text":"癌细胞突破基膜，浸润深度不超过基膜下7mm"},{"key":"D","text":"癌细胞未突破基膜，但已累及腺体"},{"key":"E","text":"癌细胞突破基底膜，但未累及腺体"}],"answerKeys":["B"],"answerText":["癌细胞突破基膜，浸润深度不超过基膜下5mm"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：子宫颈早期浸润癌（微小浸润癌）的定义为癌细胞突破基底膜，向间质浸润深度不超过5mm。\n解析：子宫颈原位癌的异型细胞累及上皮全层，但基底膜完整；当癌细胞突破基底膜进入间质，且浸润深度不超过基膜下5mm时，称早期浸润癌。其题眼是“突破基底膜”加“浸润深度≤5mm”。临床可无明显症状，或出现接触性出血，筛查和病理活检是诊断关键。部分教材/分期还强调宽度不超过7mm，但本题核心在深度5mm。\n\n选项分析：\nA. 错误：癌细胞未突破基膜属于原位癌，不是早期浸润癌。\nB. 正确：癌细胞已突破基膜进入间质，但浸润深度不超过5mm，符合早期浸润癌定义。\nC. 错误：7mm常为微浸润癌宽度界值，不是本题所指的浸润深度界值；深度超过5mm一般不按早期浸润癌处理。\nD. 错误：未突破基膜但累及腺体为“原位癌累及腺体”，仍属原位癌范畴，基底膜完整。\nE. 错误：突破基底膜已属浸润，但“未累及腺体”不是早期浸润癌的判断标准；是否累及腺体不能替代浸润深度标准。\n\n易混点：记住“未破膜为原位癌，破膜且深度≤5mm为早期浸润癌，深度>5mm为浸润癌”。原位癌累及腺体仍属原位癌，不要因“累及腺体”误判为浸润癌；7mm记作宽度界值，不要与深度5mm混淆。","chapter":14,"chapterName":"生殖系统和乳腺疾病","chapterTitle":"第14章 生殖系统和乳腺疾病"},{"id":"pathology-a-single-0228","type":"single","typeLabel":"单选题","number":228,"question":"下列哪一种细胞器对缺氧最敏感","options":[{"key":"A","text":"线粒体"},{"key":"B","text":"溶酶体"},{"key":"C","text":"滑面内质网"},{"key":"D","text":"高尔基体"},{"key":"E","text":"粗面内质网"}],"answerKeys":["A"],"answerText":["线粒体"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：A\n核心考点：缺氧时线粒体对缺血缺氧性损伤最敏感，是细胞损伤最早受累的细胞器。\n解析：缺氧首先导致线粒体氧化磷酸化障碍，ATP生成迅速减少，钠泵功能下降，引起细胞水肿；线粒体本身出现肿胀、嵴断裂或消失、基质致密等形态改变，膜通透性增高还可释放细胞色素c等促凋亡因子。因此“对缺氧最敏感”的题眼是能量代谢核心细胞器——线粒体。溶酶体、内质网和高尔基体也可在损伤中受累，但通常不是缺氧最早、最敏感的靶点。\n选项分析：\nA. 正确：线粒体是有氧呼吸和ATP生成的主要场所，对缺氧最敏感，缺氧早期即可出现线粒体肿胀、嵴减少等改变。\nB. 错误：溶酶体主要含水解酶，其膜破裂和酶释放多见于细胞损伤加重或不可逆阶段，不是对缺氧最敏感的细胞器。\nC. 错误：滑面内质网参与脂质代谢、解毒和钙储存，缺氧时可发生扩张或功能紊乱，但敏感性不及线粒体。\nD. 错误：高尔基体参与蛋白质加工、包装和分泌，损伤时可出现萎缩、扩张或分泌功能障碍，但不是缺氧最敏感细胞器。\nE. 错误：粗面内质网参与蛋白质合成，损伤时可见扩张、核糖体脱颗粒，属于细胞损伤的表现之一，但缺氧最敏感的首选仍是线粒体。\n易混点：线粒体对缺氧最敏感，常作为“最早受损细胞器”记忆；溶酶体膜破裂是细胞不可逆损伤的重要标志，不要混淆为“最敏感”。内质网损伤可致细胞水肿、脂肪变和核糖体脱颗粒，属于后续或伴随改变。","chapter":1,"chapterName":"细胞和组织的适应与损伤","chapterTitle":"第1章 细胞和组织的适应与损伤"},{"id":"pathology-a-single-0229","type":"single","typeLabel":"单选题","number":229,"question":"慢性风湿性心瓣膜病最常见的联合瓣膜病变是","options":[{"key":"A","text":"主动脉瓣和肺动脉瓣"},{"key":"B","text":"二尖瓣和三尖瓣"},{"key":"C","text":"三尖瓣和肺动脉瓣"},{"key":"D","text":"二尖瓣和主动脉瓣"},{"key":"E","text":"三尖瓣和主动脉瓣"}],"answerKeys":["D"],"answerText":["二尖瓣和主动脉瓣"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：慢性风湿性心瓣膜病最常累及二尖瓣，联合瓣膜病变以二尖瓣合并主动脉瓣最常见。\n解析：风湿性心内膜炎反复发作后，瓣膜发生纤维化、增厚、变硬、粘连和挛缩，形成慢性风湿性心瓣膜病。各瓣膜受累频率依次为二尖瓣最常见，其次为主动脉瓣，三尖瓣和肺动脉瓣很少受累，因此最常见的联合瓣膜病变是二尖瓣和主动脉瓣。本题题眼是“慢性风湿性”加“最常见联合瓣膜病变”，应与单纯最常受累瓣膜为二尖瓣相区别。\n选项分析：\nA. 错误：主动脉瓣和肺动脉瓣联合受累并非慢性风湿性心瓣膜病最常见组合；肺动脉瓣风湿性病变极少见，不能作为常见联合病变。\nB. 错误：二尖瓣虽最常受累，但三尖瓣风湿性病变少见，三尖瓣关闭不全更多见于右心室扩大所致的功能性关闭不全，不是最常见的风湿性联合瓣膜病变。\nC. 错误：三尖瓣和肺动脉瓣均属风湿性心瓣膜病中较少受累的瓣膜，二者联合更少见。\nD. 正确：二尖瓣最常受累，主动脉瓣次之，故慢性风湿性心瓣膜病最常见的联合瓣膜病变为二尖瓣和主动脉瓣，可导致相应杂音、心功能不全和血流动力学改变。\nE. 错误：三尖瓣和主动脉瓣联合受累不是最常见组合；三尖瓣风湿性病变发生率低，常继发于二尖瓣病变和右心功能不全。\n易混点：记忆要点是“风湿性瓣膜病最爱二尖瓣，其次主动脉瓣；联合病变最常见二尖瓣+主动脉瓣”。不要把“最常受累的单个瓣膜是二尖瓣”误记为“最常见联合病变只有二尖瓣”；三尖瓣和肺动脉瓣风湿受累均少见。","chapter":9,"chapterName":"心血管系统疾病","chapterTitle":"第9章 心血管系统疾病"},{"id":"pathology-a-single-0230","type":"single","typeLabel":"单选题","number":230,"question":"下列哪项不符合凝固性坏死的特点","options":[{"key":"A","text":"坏死灶的质地较坚实"},{"key":"B","text":"坏死灶体积可明显肿胀"},{"key":"C","text":"坏死灶色泽灰白或黄白"},{"key":"D","text":"坏死灶的水分含量减少"},{"key":"E","text":"坏死灶的结构轮廓可保存"}],"answerKeys":["B"],"answerText":["坏死灶体积可明显肿胀"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：凝固性坏死的病理特点及与液化性坏死的鉴别。\n解析：凝固性坏死以蛋白质变性、凝固为主，坏死组织水分减少，因而质地较坚实，切面呈灰白或黄白色，且原有组织结构的轮廓可保存。本题题眼在于“不符合”，即寻找与凝固性坏死干燥、坚实、结构轮廓保存相反的表现。坏死灶体积明显肿胀更符合液化性坏死或伴明显炎症水肿的病变，不是凝固性坏死的典型特点。\n选项分析：\nA. 正确：凝固性坏死因蛋白质凝固、水分减少，坏死灶质地较坚实，符合其特点。\nB. 错误：凝固性坏死组织常干燥、坚实，体积一般不发生明显肿胀；明显肿胀多见于液化性坏死或炎症水肿，故该项不符合凝固性坏死。\nC. 正确：凝固性坏死切面常呈灰白或黄白色，符合其肉眼形态特点。\nD. 正确：凝固性坏死以蛋白质变性凝固为主，坏死灶水分含量减少，故组织干燥坚实。\nE. 正确：凝固性坏死早期可保存原有组织结构的轮廓，如肾、脾、心梗死时仍可辨认组织架构。\n易混点：凝固性坏死“结构轮廓保存、水分少、质地实”；液化性坏死“坏死组织被酶解液化、结构消失、质地软”。干酪样坏死属特殊凝固性坏死，但结构轮廓常破坏并呈奶酪样，需与普通凝固性坏死区分。","chapter":1,"chapterName":"细胞和组织的适应与损伤","chapterTitle":"第1章 细胞和组织的适应与损伤"},{"id":"pathology-a-single-0231","type":"single","typeLabel":"单选题","number":231,"question":"下列哪项不是肝细胞癌镜下表现的主要特点","options":[{"key":"A","text":"癌巢间有大量纤维组织分割，状似假小叶"},{"key":"B","text":"癌细胞呈小梁状排列"},{"key":"C","text":"癌组织间富于血窦"},{"key":"D","text":"癌组织呈腺泡样，内可含胆汁"},{"key":"E","text":"癌细胞与肝细胞较相似"}],"answerKeys":["D"],"answerText":["癌组织呈腺泡样，内可含胆汁"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：肝细胞癌的镜下组织学特点及其与胆管细胞癌的鉴别。\n解析：肝细胞癌镜下最突出的特点是癌细胞与肝细胞较相似，分化较好者呈小梁状、索状排列，梁间富于血窦，间质相对少；在肝硬化背景或纤维组织分割下，癌巢可呈假小叶样。D项所述腺泡样/腺管样结构并非肝细胞癌的主要镜下特点，典型腺管样排列更应考虑肝内胆管细胞癌或转移性腺癌；肝细胞癌偶可出现假腺管样结构，甚至腔内见胆汁，但属于次要或偶见表现，不能作为“主要特点”。本题题眼是“不是主要特点”，应选D。\n选项分析：\nA. 正确：肝细胞癌尤其伴肝硬化时，癌巢可被纤维组织分隔，形成类似假小叶的结构，属于可出现的镜下表现。\nB. 正确：癌细胞呈小梁状、索状排列是肝细胞癌的典型排列方式，梁间常见血窦。\nC. 正确：肝细胞癌间质血窦丰富，癌细胞梁索之间可见血窦，这是其重要组织学特点。\nD. 错误：腺泡样/腺管样排列并伴腔内成分更支持胆管细胞癌或转移性腺癌；肝细胞癌虽偶见假腺管及胆汁，但不是主要镜下特点。\nE. 正确：分化较好的肝细胞癌细胞形态与正常肝细胞较相似，胞质丰富、嗜酸性，是其重要诊断线索。\n易混点：肝细胞癌与肝内胆管细胞癌鉴别：前者癌细胞似肝细胞，呈小梁状、索状，血窦丰富，可分泌胆汁；后者多呈腺管状/腺泡状，纤维间质较丰富，常含黏液而不含胆汁。记忆要点是“肝细胞癌梁状血窦似肝细胞，胆管细胞癌腺管黏液纤维多”。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-a-single-0232","type":"single","typeLabel":"单选题","number":232,"question":"黏液变性是指","options":[{"key":"A","text":"组织间质内出现大量的类黏液"},{"key":"B","text":"黏液腺分泌过多"},{"key":"C","text":"胃印戒细胞癌的癌细胞中有大量黏液"},{"key":"D","text":"浆液腺发生黏液化而分泌大量黏液"},{"key":"E","text":"支气管黏膜上皮中的杯状细胞分泌黏液"}],"answerKeys":["A"],"answerText":["组织间质内出现大量的类黏液"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：A\n\n核心考点：黏液样变性（黏液变性）是指组织间质内黏多糖等类黏液物质积聚，而非上皮细胞分泌黏液增多。\n\n解析：黏液变性又称黏液样变性，本质是结缔组织基质内黏多糖蛋白复合物积聚，形成淡蓝色、均质的“类黏液”，并非真正的黏液。常见于间叶组织肿瘤、动脉粥样硬化斑块、风湿病及甲状腺功能低下等。题眼在于“组织间质内”和“类黏液”，即病变位于间质而非腺体分泌或细胞胞质内。\n\n选项分析：\nA. 正确：组织间质内出现大量类黏液是黏液样变性的定义性改变，类黏液为间质内黏多糖积聚，HE染色呈淡蓝色均质状。\nB. 错误：黏液腺分泌过多属于腺体分泌亢进或黏液分泌增多，如慢性炎症时腺体反应，病变在腺体分泌功能，不是间质内类黏液积聚。\nC. 错误：胃印戒细胞癌的癌细胞胞质内有大量黏液，将核挤向一侧，属于癌细胞分泌黏液形成的细胞内黏液，不是组织间质黏液变性。\nD. 错误：浆液腺发生黏液化属于腺体化生性改变，常见于慢性炎症刺激，是腺体类型转变，不是间质黏液变性。\nE. 错误：支气管黏膜杯状细胞分泌黏液属于正常生理现象或慢性支气管炎时的杯状细胞增生、分泌增多，不是组织间质内类黏液积聚。\n\n易混点：记忆要点是“间质类黏液为黏液样变性，上皮细胞内黏液见于黏液癌/印戒细胞癌，腺体分泌增多是分泌改变，腺体类型转变为化生”。黏液样变性还需与甲状腺功能低下时的黏液性水肿及肿瘤性黏液样基质鉴别，后者均以间质黏多糖积聚为共同形态基础。","chapter":1,"chapterName":"细胞和组织的适应与损伤","chapterTitle":"第1章 细胞和组织的适应与损伤"},{"id":"pathology-a-single-0233","type":"single","typeLabel":"单选题","number":233,"question":"有关溃疡的并发症，下列哪项错误","options":[{"key":"A","text":"恶变"},{"key":"B","text":"出血"},{"key":"C","text":"幽门狭窄"},{"key":"D","text":"穿孔"},{"key":"E","text":"中风"}],"answerKeys":["E"],"answerText":["中风"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n核心考点：消化性溃疡的并发症包括出血、穿孔、幽门梗阻和癌变，中风不属于其并发症。\n解析：消化性溃疡病变深达黏膜下层甚至肌层，可侵蚀血管引起出血，穿透浆膜引起穿孔，位于幽门附近者因瘢痕收缩或水肿痉挛导致幽门狭窄，胃溃疡还有一定癌变风险。中风是脑血管意外，常见于高血压、动脉粥样硬化等，与消化性溃疡无直接病理联系。本题题眼是“溃疡的并发症”，应区分消化系统局部并发症与脑血管疾病。\n\n选项分析：\nA. 正确：恶变是胃溃疡的并发症之一，尤其需与溃疡型胃癌鉴别；十二指肠溃疡几乎不癌变。\nB. 正确：出血是消化性溃疡最常见并发症，因溃疡底部血管被侵蚀破裂所致，可表现为呕血、黑便。\nC. 正确：幽门狭窄/幽门梗阻是幽门管或幽门附近溃疡的并发症，由瘢痕收缩、水肿及痉挛引起，可致胃内容物潴留。\nD. 正确：穿孔是溃疡穿透浆膜层，胃肠内容物进入腹腔引起急性弥漫性腹膜炎，是严重并发症。\nE. 错误：中风即脑血管意外，属于高血压、动脉粥样硬化等脑血管病变，不是消化性溃疡的并发症。\n\n易混点：出血最常见，穿孔最危险，幽门梗阻多位于幽门附近，癌变主要见于胃溃疡；十二指肠溃疡一般不癌变。记忆“出血、穿孔、梗阻、癌变”四大并发症，中风不在其列。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-a-single-0234","type":"single","typeLabel":"单选题","number":234,"question":"下列疾病不可能发生纤维结缔组织玻璃样变的是","options":[{"key":"A","text":"结核性纤维素性胸膜炎"},{"key":"B","text":"硅肺"},{"key":"C","text":"慢性表浅性胃炎"},{"key":"D","text":"肝硬化"},{"key":"E","text":"心肌梗死"}],"answerKeys":["C"],"answerText":["慢性表浅性胃炎"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：纤维结缔组织玻璃样变的发生机制及常见疾病。\n解析：纤维结缔组织玻璃样变是指增生的胶原纤维及其间质发生变性，HE染色下呈均匀红染、无结构的玻璃样物质，常见于瘢痕组织、纤维化病灶和机化性病变。其本质是纤维结缔组织增生并发生玻璃样变性，而不是单纯黏膜浅层炎症。本题题眼是“不可能发生”，慢性表浅性胃炎以胃黏膜浅层慢性炎症细胞浸润、充血水肿为主，一般不引起明显纤维结缔组织增生和玻璃样变。\n\n选项分析：\nA. 错误：结核性纤维素性胸膜炎可发生纤维素性渗出，若机化则胸膜纤维结缔组织增生、增厚粘连，并可发生玻璃样变。\nB. 错误：硅肺的基本病变是硅结节形成和肺纤维化，硅结节内胶原纤维可发生玻璃样变，故可以发生。\nC. 正确：慢性表浅性胃炎病变主要在黏膜浅层，以炎症细胞浸润为主，无明显纤维结缔组织增生，因此不可能发生纤维结缔组织玻璃样变。\nD. 错误：肝硬化时纤维结缔组织大量增生，形成假小叶周围的纤维间隔，增生的胶原纤维可发生玻璃样变。\nE. 错误：心肌梗死后陈旧性病灶由纤维结缔组织修复形成瘢痕，瘢痕组织中的胶原纤维可发生玻璃样变。\n\n易混点：玻璃样变可分为细胞内玻璃样变、血管壁玻璃样变和纤维结缔组织玻璃样变，本题限定为“纤维结缔组织玻璃样变”。慢性萎缩性胃炎可伴腺体萎缩和间质纤维化，但慢性表浅性胃炎不形成明显纤维化，这是本题关键区别。","chapter":1,"chapterName":"细胞和组织的适应与损伤","chapterTitle":"第1章 细胞和组织的适应与损伤"},{"id":"pathology-a-single-0235","type":"single","typeLabel":"单选题","number":235,"question":"下述炎症改变中，最有防御意义的是","options":[{"key":"A","text":"渗出液的产生"},{"key":"B","text":"氧自由基释放"},{"key":"C","text":"白细胞渗出"},{"key":"D","text":"血液停滞"},{"key":"E","text":"炎症介质形成"}],"answerKeys":["C"],"answerText":["白细胞渗出"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：炎症渗出性改变中以白细胞渗出最具防御意义，是机体清除病原微生物和坏死组织的核心环节。\n解析：炎症的基本病理变化包括变质、渗出和增生，其中渗出对机体具有重要防御作用。白细胞在趋化因子作用下从血管内游出并聚集于炎区，经吞噬和杀菌作用清除病原体、坏死组织及异物，同时参与免疫反应和组织修复。因此“最有防御意义”的题眼是白细胞的主动游出和吞噬功能，而不是单纯液体渗出或血流动力学改变。\n选项分析：\nA. 错误：渗出液的产生可稀释毒素、携带抗体和补体、形成纤维素网限制病原扩散，确有防御作用，但其防御效力不如白细胞直接吞噬和杀菌，不是本题“最有防御意义”的最佳答案。\nB. 错误：氧自由基释放可由中性粒细胞产生，具有一定杀菌作用，但同时可引起组织损伤和炎症放大，属于双刃剑，不是最有防御意义的炎症改变。\nC. 正确：白细胞渗出包括边集、附壁、游出、趋化及吞噬等过程，能直接清除病原微生物和坏死组织，是炎症防御反应的核心，故为正确答案。\nD. 错误：血液停滞属于炎症时血流动力学改变，表现为血管扩张、血流加快后逐渐变慢及淤滞，主要有利于白细胞边集和附壁，本身不是直接防御机制。\nE. 错误：炎症介质形成参与血管扩张、通透性增高、趋化和疼痛等反应，是炎症反应的调控和介导环节，但并非直接执行防御的效应过程。\n易混点：渗出液产生和白细胞渗出都属于渗出性改变，前者以稀释毒素、带来抗体补体为主，后者以吞噬杀菌为主；考试中问“最有防御意义”通常选白细胞渗出。炎症介质是“介导者”，白细胞是“执行者”，注意区分。","chapter":4,"chapterName":"炎症","chapterTitle":"第4章 炎症"},{"id":"pathology-a-single-0236","type":"single","typeLabel":"单选题","number":236,"question":"乳头溢液或溢血多发生于","options":[{"key":"A","text":"乳腺纤维腺瘤"},{"key":"B","text":"乳腺导管癌"},{"key":"C","text":"乳腺小叶癌"},{"key":"D","text":"乳腺导管内乳头状瘤"},{"key":"E","text":"乳腺腺病"}],"answerKeys":["D"],"answerText":["乳腺导管内乳头状瘤"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：乳腺导管内乳头状瘤好发于乳晕下大导管，因瘤体血管丰富且易破裂而出现乳头溢液或溢血。\n解析：乳腺导管内乳头状瘤是乳头溢液的常见良性原因，多位于乳晕下大导管，靠近乳头开口，故分泌物容易经乳头排出。肿瘤呈乳头状突入扩张的导管腔，表面被覆双层上皮，轴心含丰富薄壁血管，轻微损伤即可出血，因此临床常表现为浆液性或血性乳头溢液，部分患者可触及乳晕区小结节。题眼是“乳头溢液或溢血”与“导管内乳头状病变”的联系。\n\n选项分析：\nA. 错误：乳腺纤维腺瘤多见于青年女性，典型表现为边界清楚、活动度好的无痛性乳腺肿块，由增生的腺管和纤维组织构成，一般不以乳头溢液或溢血为主要表现。\nB. 错误：乳腺导管癌可因导管内肿瘤坏死、出血而出现乳头溢液，但本题问“多发生于”的典型病变，导管癌更常表现为质硬肿块、皮肤或乳头改变；其溢液缺乏导管内乳头状瘤那样典型的大导管乳头状瘤出血机制。\nC. 错误：乳腺小叶癌起源于小叶终末导管及腺泡，常表现为浸润性肿块或弥漫性乳腺组织增厚，较少引起乳头溢液或溢血，且不如导管内乳头状瘤典型。\nD. 正确：乳腺导管内乳头状瘤位于大导管内，呈乳头状生长，轴心血管丰富，易出血，故常引起浆液性、血性乳头溢液，是本题标准答案。\nE. 错误：乳腺腺病属于乳腺良性增生性病变，常表现为乳腺胀痛、结节感，与月经周期相关，通常不以乳头溢血为主要特征。\n\n易混点：导管内乳头状瘤是良性病变，常单发、位于乳晕下大导管，镜下乳头轴心可见纤维血管束，表面上皮为双层；导管内乳头状癌则细胞异型明显、肌上皮减少或消失，可为多发或周围型。记忆要点：乳晕区血性溢液首先想到大导管内乳头状瘤，但确诊仍靠病理组织学。","chapter":14,"chapterName":"生殖系统和乳腺疾病","chapterTitle":"第14章 生殖系统和乳腺疾病"},{"id":"pathology-a-single-0237","type":"single","typeLabel":"单选题","number":237,"question":"葡萄胎与侵蚀性葡萄胎的相同点，在于","options":[{"key":"A","text":"可见胎盘绒毛组织"},{"key":"B","text":"明显的出血坏死"},{"key":"C","text":"侵犯肌层"},{"key":"D","text":"发生阴道结节"},{"key":"E","text":"可有远隔脏器转移"}],"answerKeys":["A"],"answerText":["可见胎盘绒毛组织"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：A\n核心考点：葡萄胎与侵蚀性葡萄胎均起源于胎盘绒毛，镜下均可见绒毛结构，这是与绒毛膜癌鉴别的关键。\n解析：葡萄胎的基本病变是胎盘绒毛高度水肿，形成水泡状绒毛，绒毛间质水肿、血管消失，滋养细胞增生；侵蚀性葡萄胎是葡萄胎组织侵入子宫肌层，但侵入肌层的水泡状组织中仍可见完整胎盘绒毛结构。因此两者相同点是均可见胎盘绒毛组织。本题题眼是“相同点”，并与绒毛膜癌鉴别：绒癌无绒毛结构，而侵蚀性葡萄胎有绒毛。\n选项分析：\nA. 正确：葡萄胎和侵蚀性葡萄胎均可见水肿的胎盘绒毛组织；侵蚀性葡萄胎虽侵入肌层，但镜下仍保留绒毛结构，这是与绒癌鉴别的重要依据。\nB. 错误：明显出血坏死更常见于侵蚀性葡萄胎及绒毛膜癌，尤其绒癌出血坏死显著；普通葡萄胎虽有出血，但“明显出血坏死”不是两者并列的共同特征。\nC. 错误：侵犯肌层是侵蚀性葡萄胎的特点，良性葡萄胎病变局限于宫腔，不侵入子宫肌层，故不是共同点。\nD. 错误：发生阴道结节提示滋养细胞肿瘤发生血道转移，主要见于侵蚀性葡萄胎或绒癌，良性葡萄胎不发生转移性阴道结节。\nE. 错误：远隔脏器转移主要见于绒毛膜癌，侵蚀性葡萄胎可发生转移但较少，良性葡萄胎无远隔转移，故不是二者共同点。\n易混点：葡萄胎与侵蚀性葡萄胎的区别在于是否侵入子宫肌层；侵蚀性葡萄胎与绒癌的关键鉴别在于有无绒毛结构——侵蚀性葡萄胎有绒毛，绒癌无绒毛。记忆要点：有绒毛、侵肌层为侵蚀性葡萄胎；无绒毛、出血坏死显著且易转移为绒癌。","chapter":14,"chapterName":"生殖系统和乳腺疾病","chapterTitle":"第14章 生殖系统和乳腺疾病"},{"id":"pathology-a-single-0238","type":"single","typeLabel":"单选题","number":238,"question":"下列哪种慢性风湿性心瓣膜病中不引起肺淤血","options":[{"key":"A","text":"二尖瓣狭窄"},{"key":"B","text":"二尖瓣关闭不全"},{"key":"C","text":"三尖瓣狭窄"},{"key":"D","text":"主动脉瓣狭窄"},{"key":"E","text":"主动脉瓣关闭不全"}],"answerKeys":["C"],"answerText":["三尖瓣狭窄"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：慢性风湿性心瓣膜病中，肺淤血主要由左心系统瓣膜病变引起；三尖瓣狭窄导致体循环淤血而不引起肺淤血。\n解析：肺淤血的本质是肺静脉回流受阻、肺毛细血管流体静压升高。二尖瓣狭窄时左房排血受阻，左房压升高并逆传至肺静脉，是慢性风湿性心瓣膜病引起肺淤血最典型的病变。三尖瓣狭窄时舒张期右房血液流入右室受阻，右房压升高，导致体循环静脉淤血；同时进入肺循环的血量减少，故不引起肺淤血。本题题眼是“不引起肺淤血”，应选择位于右心、造成肺循环血量减少的三尖瓣狭窄。\n\n选项分析：\nA. 错误（非本题答案）：二尖瓣狭窄使左房压升高，肺静脉和肺毛细血管压升高，引起肺淤血，并可出现肺水肿、左房扩大等。\nB. 错误（非本题答案）：二尖瓣关闭不全时收缩期左室血液反流左房，左房容量负荷和压力升高，晚期可导致肺淤血。\nC. 正确：三尖瓣狭窄使右房到右室血流受阻，表现为右房扩大和体循环淤血，肺循环血量减少，不引起肺淤血。\nD. 错误（非本题答案）：主动脉瓣狭窄致左室压力负荷增加、向心性肥厚，舒张末压升高，继而左房压升高，晚期可引起肺淤血。\nE. 错误（非本题答案）：主动脉瓣关闭不全致舒张期血液反流，左室容量负荷增加，晚期左心衰竭时可出现肺淤血。\n\n易混点：二尖瓣狭窄引起“肺淤血”，三尖瓣狭窄引起“体循环淤血”；记忆要点为“左心病变看肺，右心病变看体”。风湿性心瓣膜病最常累及二尖瓣，其次主动脉瓣，三尖瓣狭窄较少见。","chapter":9,"chapterName":"心血管系统疾病","chapterTitle":"第9章 心血管系统疾病"},{"id":"pathology-a-single-0239","type":"single","typeLabel":"单选题","number":239,"question":"下列关于肾细胞癌的主要特点正确的是","options":[{"key":"A","text":"无血尿"},{"key":"B","text":"不发生出血"},{"key":"C","text":"肿瘤间质丰富，血管少"},{"key":"D","text":"肿瘤组织内可见软骨、肌肉"},{"key":"E","text":"侵犯肾静脉，有血管内生长倾向"}],"answerKeys":["E"],"answerText":["侵犯肾静脉，有血管内生长倾向"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n核心考点：肾细胞癌具有侵犯肾静脉并沿血管内生长的倾向，是其主要侵袭和播散特点之一。\n解析：肾细胞癌多见于中老年人，好发于肾上极，典型临床表现为无痛性肉眼血尿、腰痛和腹部包块。病理上常见透明细胞癌，癌细胞呈巢状或管状排列，间质少而毛细血管丰富；肿瘤切面常呈灰黄色，伴出血、坏死。题眼是“血管内生长倾向”：肾细胞癌易侵犯肾静脉形成癌栓，并可沿静脉延伸至下腔静脉甚至右心房，这是考试常考特点。\n\n选项分析：\nA. 错误：肾细胞癌常有无痛性肉眼血尿，是典型临床表现之一，并非无血尿。\nB. 错误：肾细胞癌常发生出血、坏死，肉眼可见肿瘤切面灰黄伴出血坏死，临床也可出现血尿。\nC. 错误：肾细胞癌特别是透明细胞癌间质较少、血管丰富，而不是间质丰富、血管少；丰富血供与其血行转移倾向有关。\nD. 错误：肿瘤组织内可见软骨、肌肉等异源性成分更符合肾母细胞瘤特点；肾细胞癌一般不以软骨、肌肉成分为主要组织学特征。\nE. 正确：肾细胞癌具有明显血管侵袭倾向，常侵犯肾静脉并在血管内生长形成癌栓，可向下腔静脉延伸，是本题正确答案。\n\n易混点：肾母细胞瘤多见于儿童，镜下可见幼稚肾组织及横纹肌、软骨等异源性成分；肾细胞癌多见于成人，透明细胞癌间质少、血管丰富，并易侵犯肾静脉形成癌栓。记忆要点：成人肾癌“血尿、腰痛、包块”，并有“肾静脉癌栓”倾向；儿童肾母细胞瘤则记“幼稚肾组织加异源性成分”。","chapter":13,"chapterName":"泌尿系统疾病","chapterTitle":"第13章 泌尿系统疾病"},{"id":"pathology-a-single-0240","type":"single","typeLabel":"单选题","number":240,"question":"慢性炎症病灶内浸润的炎细胞主要是","options":[{"key":"A","text":"中性粒细胞和单核细胞"},{"key":"B","text":"单核细胞和淋巴细胞"},{"key":"C","text":"浆细胞和嗜碱性粒细胞"},{"key":"D","text":"淋巴细胞和嗜酸性粒细胞"},{"key":"E","text":"嗜酸性粒细胞和嗜碱性粒细胞"}],"answerKeys":["B"],"answerText":["单核细胞和淋巴细胞"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：慢性炎症的炎细胞浸润以单核细胞和淋巴细胞为主。\n解析：慢性炎症病程较长，病灶内以单核细胞（巨噬细胞）和淋巴细胞浸润为主，浆细胞也常出现。单核细胞可吞噬病原体和坏死组织，并可转化为上皮样细胞或多核巨细胞；淋巴细胞参与免疫反应，浆细胞产生抗体。本题题眼是“慢性炎症”与“主要炎细胞”，应与急性炎症以中性粒细胞为主相区别。\n\n选项分析：\nA. 错误：中性粒细胞和单核细胞主要见于急性炎症早期或化脓性炎症，其中中性粒细胞是急性炎症的标志性炎细胞，不是慢性炎症的主要组合。\nB. 正确：单核细胞和淋巴细胞是慢性炎症病灶内最主要的浸润细胞；单核细胞即巨噬细胞的前身，淋巴细胞参与细胞免疫和体液免疫调节，符合慢性炎症的病理特点。\nC. 错误：浆细胞可见于慢性炎症，但嗜碱性粒细胞主要参与Ⅰ型超敏反应等，并非慢性炎症的主要浸润细胞，故该组合错误。\nD. 错误：淋巴细胞可见于慢性炎症，但嗜酸性粒细胞主要见于寄生虫感染、过敏性疾病及某些自身免疫病，不是慢性炎症的主要炎细胞。\nE. 错误：嗜酸性粒细胞和嗜碱性粒细胞均非慢性炎症的主要浸润细胞，前者与寄生虫感染和变态反应有关，后者与过敏反应有关。\n\n易混点：急性炎症以中性粒细胞为主，慢性炎症以单核细胞、淋巴细胞为主，并常伴浆细胞；肉芽肿性炎还可出现上皮样细胞和多核巨细胞。嗜酸性粒细胞增多应优先联想寄生虫感染或变态反应。","chapter":4,"chapterName":"炎症","chapterTitle":"第4章 炎症"},{"id":"pathology-a-single-0241","type":"single","typeLabel":"单选题","number":241,"question":"槟榔肝的特点不包括","options":[{"key":"A","text":"肝中央静脉扩张"},{"key":"B","text":"胆小管增生"},{"key":"C","text":"肝细胞萎缩"},{"key":"D","text":"肝细胞脂肪变性"},{"key":"E","text":"肝窦明显扩张充血"}],"answerKeys":["B"],"answerText":["胆小管增生"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：慢性肝淤血（槟榔肝）的病理形态学特点及其与肝硬化、胆汁淤积的鉴别。\n解析：槟榔肝是右心衰竭引起的慢性肝淤血。淤血使肝小叶中央静脉及中央区肝窦扩张充血，中央区肝细胞因缺氧而萎缩甚至坏死；周边区肝细胞相对缺氧较轻，常发生脂肪变性。肉眼观中央区暗红、周边区黄，红黄相间似槟榔切面，故称槟榔肝。题眼是“不包括”，胆小管增生并非慢性肝淤血的典型改变，故B为答案。\n选项分析：\nA. 正确：肝中央静脉扩张是慢性肝淤血的基本改变，中央静脉及周围肝窦淤血是槟榔肝形成的起点。\nB. 错误：胆小管增生不是槟榔肝的特点，多见于胆汁淤积、肝硬化等病变；槟榔肝的核心是中央区淤血和周边区脂肪变性。\nC. 正确：中央区肝细胞因淤血缺氧发生萎缩，严重时可坏死，属于槟榔肝镜下特点之一。\nD. 正确：周边区肝细胞常发生脂肪变性，与中央区淤血共同形成红黄相间的“槟榔”外观。\nE. 正确：肝窦明显扩张充血是慢性肝淤血的重要表现，尤其位于小叶中央区。\n易混点：槟榔肝需与肝硬化鉴别。槟榔肝以中央静脉和肝窦淤血、中央区肝细胞萎缩、周边区脂肪变性为主；肝硬化则以假小叶形成、纤维组织增生和胆小管增生为特征。记忆要点：右心衰→肝淤血→“红黄相间”；胆小管增生提示胆道/纤维化病变，不是槟榔肝。","chapter":3,"chapterName":"局部血液循环障碍","chapterTitle":"第3章 局部血液循环障碍"},{"id":"pathology-a-single-0242","type":"single","typeLabel":"单选题","number":242,"question":"动脉粥样硬化固缩肾表现为","options":[{"key":"A","text":"表面呈颗粒状"},{"key":"B","text":"两肾肿大，颜色苍白"},{"key":"C","text":"肾脏可见凹陷性瘢痕"},{"key":"D","text":"肾内形成多发性栓塞小脓肿"},{"key":"E","text":"两肾肿大充血，呈“大红肾”"}],"answerKeys":["C"],"answerText":["肾脏可见凹陷性瘢痕"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：动脉粥样硬化性固缩肾的形态学特点，即肾动脉粥样硬化引起肾缺血、萎缩和纤维瘢痕形成。\n解析：肾动脉粥样硬化使管腔狭窄，供血区肾组织缺血性萎缩、纤维化，形成较大而不规则的纤维瘢痕；瘢痕收缩后肾表面出现凹陷性瘢痕，故本题题眼是“动脉粥样硬化固缩肾”的凹陷性瘢痕。病变常使肾脏缩小、质地变硬，且因受累动脉分布不同，两肾常不对称。\n选项分析：\nA. 错误：表面呈颗粒状主要见于良性高血压引起的细颗粒性固缩肾，也可见于慢性肾小球肾炎的颗粒性固缩肾，不是动脉粥样硬化固缩肾的典型表现。\nB. 错误：两肾肿大、颜色苍白多见于肾病综合征、肾淀粉样变性等病变，属于肾脏体积增大、苍白，不符合动脉粥样硬化所致缺血性固缩肾。\nC. 正确：肾动脉粥样硬化导致局部肾组织缺血萎缩和纤维化，瘢痕收缩形成凹陷性瘢痕，是动脉粥样硬化性固缩肾的特征性肉眼表现。\nD. 错误：肾内多发性栓塞小脓肿提示脓毒血症或感染性栓子栓塞，属于感染性病变，与动脉粥样硬化性固缩肾无关。\nE. 错误：两肾肿大充血呈“大红肾”是急性弥漫性增生性肾小球肾炎的典型表现，不是动脉粥样硬化性固缩肾。\n易混点：动脉粥样硬化性固缩肾为较大、不规则、常不对称的凹陷性瘢痕；良性高血压性固缩肾为双肾对称缩小、表面细颗粒状。记忆要点：粥样硬化看“大瘢痕凹陷”，高血压看“细颗粒对称”。","chapter":9,"chapterName":"心血管系统疾病","chapterTitle":"第9章 心血管系统疾病"},{"id":"pathology-a-single-0243","type":"single","typeLabel":"单选题","number":243,"question":"关于凋亡叙述，下列错误的是","options":[{"key":"A","text":"凋亡的发生与基因调节有关"},{"key":"B","text":"活体内单个细胞或小团细胞的死亡"},{"key":"C","text":"又称程序性细胞死亡"},{"key":"D","text":"细胞质膜破裂，核也碎裂"},{"key":"E","text":"不引起急性炎症反应"}],"answerKeys":["D"],"answerText":["细胞质膜破裂，核也碎裂"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：凋亡的形态学特点及其与坏死的鉴别。\n解析：凋亡是由基因调控的程序性细胞死亡，常发生于活体内单个细胞或小团细胞，表现为细胞皱缩、染色质边集、核固缩和核碎裂，细胞质膜保持完整，胞质和细胞器被包裹形成凋亡小体，随后被巨噬细胞吞噬。由于细胞内容物不外泄，凋亡通常不引起急性炎症反应。D项中“细胞质膜破裂”是坏死的重要特征，而非凋亡，故D错误。本题题眼是“细胞质膜是否完整”以及“有无炎症反应”。\n\n选项分析：\nA. 正确：凋亡受基因调节，涉及Bcl-2、Bax、caspase等调控，属于主动的程序性死亡过程。\nB. 正确：凋亡多累及活体内单个细胞或小团细胞，不似坏死常累及成片组织。\nC. 正确：凋亡是程序性细胞死亡的重要形式，考试中常以“又称程序性细胞死亡”表述。\nD. 错误：凋亡时细胞质膜完整并形成凋亡小体；细胞质膜破裂、细胞内容物外泄是坏死的特点。凋亡虽可有核碎裂，但D整体描述的是坏死性改变。\nE. 正确：凋亡小体被吞噬清除，内容物不释放，因此一般不引起急性炎症反应。\n\n易混点：凋亡与坏死最常考的鉴别点是“膜完整、无炎症、单个细胞”对“膜破裂、有炎症、成片细胞”。记忆要点：凋亡是“缩、碎、包、吞、不炎”，坏死是“胀、破、泄、炎”。","chapter":1,"chapterName":"细胞和组织的适应与损伤","chapterTitle":"第1章 细胞和组织的适应与损伤"},{"id":"pathology-a-single-0244","type":"single","typeLabel":"单选题","number":244,"question":"关于梅毒疹，错误的叙述是","options":[{"key":"A","text":"可见于全身皮肤黏膜"},{"key":"B","text":"为斑丘疹"},{"key":"C","text":"可不治自愈"},{"key":"D","text":"见于第二期梅毒"},{"key":"E","text":"镜下为血管炎和肉芽肿性病变"}],"answerKeys":["E"],"answerText":["镜下为血管炎和肉芽肿性病变"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n核心考点：二期梅毒疹的临床表现及病理组织学特点，重点区分二期梅毒与三期梅毒的病变性质。\n解析：梅毒疹属于第二期梅毒，常累及全身皮肤和黏膜，表现为斑疹、丘疹或斑丘疹，可自行消退而进入潜伏梅毒，但并非真正痊愈。镜下主要是血管周围炎、闭塞性血管内膜炎及浆细胞浸润，肉芽肿性病变并非二期梅毒疹的典型表现。题眼在“错误”，E项把血管炎与肉芽肿性病变并列，其中“肉芽肿性病变”主要对应三期梅毒树胶肿，故错误。\n选项分析：\nA. 正确：二期梅毒疹可广泛分布于全身皮肤和黏膜，传染性较强，是二期梅毒的典型表现。\nB. 正确：梅毒疹形态多样，可呈斑疹、丘疹或斑丘疹，斑丘疹是考试中常见的描述。\nC. 正确：二期梅毒疹可不治而自行消退，但螺旋体仍可潜伏体内，日后可发展为三期梅毒，不能理解为彻底治愈。\nD. 正确：梅毒疹是第二期梅毒的主要皮肤黏膜表现，通常出现在硬下疳消退后。\nE. 错误：二期梅毒疹镜下以血管周围炎、闭塞性血管内膜炎和浆细胞浸润为主；肉芽肿性病变主要见于三期梅毒树胶肿，故本项叙述错误。\n易混点：记忆“一硬二疹三树胶”：一期为硬下疳，二期为梅毒疹，三期为树胶肿。二期梅毒疹可自愈但可潜伏，病理以血管炎和浆细胞浸润为要点；肉芽肿性病变、干酪样坏死要想到三期梅毒。","chapter":18,"chapterName":"传染病","chapterTitle":"第18章 传染病"},{"id":"pathology-a-single-0245","type":"single","typeLabel":"单选题","number":245,"question":"梅毒引起的心血管病变主要见于","options":[{"key":"A","text":"主动脉"},{"key":"B","text":"冠状动脉"},{"key":"C","text":"肾动脉"},{"key":"D","text":"颈总动脉"},{"key":"E","text":"肺动脉"}],"answerKeys":["A"],"answerText":["主动脉"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：A\n核心考点：梅毒性心血管病变主要累及主动脉，尤其是升主动脉，引起梅毒性主动脉炎及其并发症。\n解析：梅毒进入三期后，苍白密螺旋体可经血行或淋巴管到达主动脉外膜滋养血管，引起闭塞性动脉内膜炎，进而使中膜弹力纤维和肌纤维发生缺血性破坏，代之以瘢痕组织。病变好发于升主动脉，肉眼可见内膜呈“树皮样”皱褶，镜下以中膜弹力纤维断裂、炎细胞浸润和纤维化为特征。由于中膜支撑力下降，可形成梅毒性主动脉瘤；主动脉根部受累可致主动脉瓣环扩张、主动脉瓣关闭不全；冠状动脉口可因主动脉炎蔓延而狭窄，但冠状动脉本身不是主要病变部位。本题题眼是“梅毒引起的心血管病变主要见于”，应锁定主动脉。\n选项分析：\nA. 正确：梅毒性主动脉炎最常累及升主动脉，可导致主动脉瘤、主动脉瓣关闭不全和冠状动脉口狭窄，是梅毒心血管病变的主要部位。\nB. 错误：冠状动脉可因梅毒性主动脉炎累及冠脉口而出现开口狭窄，但冠状动脉本身不是梅毒心血管病变的主要部位；冠状动脉主要病变常见于动脉粥样硬化等。\nC. 错误：肾动脉不是梅毒心血管病变的主要累及部位；肾动脉病变常见于动脉粥样硬化、纤维肌性发育不良或结节性多动脉炎等。\nD. 错误：颈总动脉可发生动脉粥样硬化、大动脉炎等，但梅毒主要累及主动脉，尤其升主动脉，而非颈总动脉。\nE. 错误：肺动脉极少为梅毒主要累及部位；肺动脉病变常见于肺动脉栓塞、肺动脉高压等。\n易混点：梅毒性主动脉炎要与动脉粥样硬化、大动脉炎鉴别。记忆要点是：梅毒好发升主动脉，特征是中膜弹力纤维破坏、内膜“树皮样”皱褶，并常引起主动脉瘤或主动脉瓣关闭不全；冠状动脉口狭窄是主动脉根部病变的并发症，不要误认为主要累及冠状动脉。","chapter":18,"chapterName":"传染病","chapterTitle":"第18章 传染病"},{"id":"pathology-a-single-0246","type":"single","typeLabel":"单选题","number":246,"question":"肿瘤血道转移的确切证据是","options":[{"key":"A","text":"恶性肿瘤细胞侵入静脉"},{"key":"B","text":"恶性肿瘤细胞侵入动脉"},{"key":"C","text":"血液中查见肿瘤细胞"},{"key":"D","text":"肿瘤细胞栓塞于远隔器官"},{"key":"E","text":"在远隔器官形成同一类型的肿瘤"}],"answerKeys":["E"],"answerText":["在远隔器官形成同一类型的肿瘤"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n核心考点：血道转移的判定标准是远隔器官出现与原发瘤同类型的继发性肿瘤。\n解析：恶性肿瘤细胞侵入静脉后，可随血流形成瘤栓，栓塞于远隔器官的毛细血管床，进而穿出血管、增殖形成转移瘤。血道转移的确切证据不是血中查到瘤细胞或血管内发现瘤栓，而是远隔器官形成了与原发肿瘤组织学类型相同的肿瘤。题眼是“确切证据”，强调转移灶已形成。\n选项分析：\nA. 错误：恶性肿瘤细胞侵入静脉只是血道转移的可能前提，说明有进入血流的机会，但瘤细胞未必存活、栓塞和增殖，不能作为转移已发生的证据。\nB. 错误：肿瘤细胞侵入动脉较少见，且同样只是进入血流的步骤之一，不能证明远隔器官已形成转移瘤。\nC. 错误：血液中查见肿瘤细胞可见于循环肿瘤细胞，但多数会在血流中死亡，不能说明一定发生血道转移，也不能确定转移部位。\nD. 错误：肿瘤细胞栓塞于远隔器官只说明瘤栓停留，栓塞的瘤细胞可死亡或被清除，未证明形成转移灶。\nE. 正确：在远隔器官形成同一类型的肿瘤，说明肿瘤细胞已经血路到达并存活、增殖，形成继发瘤，是血道转移的确切证据。\n易混点：血管内瘤栓、血液中瘤细胞和远隔器官转移瘤不同。记忆要点：侵入血管是“入口”，栓塞是“途中”，远隔器官同型肿瘤才是“落地成灶”的确切证据。","chapter":6,"chapterName":"肿瘤","chapterTitle":"第6章 肿瘤"},{"id":"pathology-a-single-0247","type":"single","typeLabel":"单选题","number":247,"question":"肺静脉血栓脱落致脑动脉阻塞的现象称为","options":[{"key":"A","text":"血栓再通"},{"key":"B","text":"血栓机化"},{"key":"C","text":"血栓软化"},{"key":"D","text":"血栓钙化"},{"key":"E","text":"血栓栓塞"}],"answerKeys":["E"],"answerText":["血栓栓塞"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n核心考点：血栓脱落随血流运行并阻塞远处血管的过程称为血栓栓塞。\n解析：肺静脉血栓脱落后形成栓子，栓子可经肺静脉进入左心房、左心室，再随主动脉血流进入体循环，最终阻塞脑动脉，导致脑组织缺血性梗死。本题题眼是“血栓脱落”和“阻塞远处血管”，符合血栓栓塞的定义，而不是血栓本身的形态学转归。\n选项分析：\nA. 错误：血栓再通是血栓机化过程中血管壁长入毛细血管并重新建立部分血流，属于血栓的转归，不表现为血栓脱落阻塞脑动脉。\nB. 错误：血栓机化是肉芽组织自血管壁长入血栓并逐渐取代血栓的过程，最终可形成纤维化，不会造成题中所述栓子阻塞远端动脉。\nC. 错误：血栓软化是血栓内纤维蛋白溶解和白细胞释放溶酶体酶导致的液化过程，可使血栓变软甚至脱落，但“脱落并阻塞脑动脉”这一现象本身应称为栓塞。\nD. 错误：血栓钙化是血栓发生营养不良性钙盐沉积，可形成静脉石，属于陈旧血栓的转归，不引起急性脑动脉阻塞。\nE. 正确：血栓整体或部分脱落成为栓子，随血流运行并堵塞相应血管，称为血栓栓塞；肺静脉血栓经左心进入体循环阻塞脑动脉即属此类。\n易混点：血栓形成是在原位形成血凝块，血栓栓塞是血栓脱落后阻塞他处血管；血栓软化、机化、再通、钙化均是血栓的转归，只有脱落后阻塞远端血管才称为栓塞。","chapter":3,"chapterName":"局部血液循环障碍","chapterTitle":"第3章 局部血液循环障碍"},{"id":"pathology-a-single-0248","type":"single","typeLabel":"单选题","number":248,"question":"下列哪种细胞属于永久性细胞","options":[{"key":"A","text":"表皮细胞"},{"key":"B","text":"心肌细胞"},{"key":"C","text":"肾小管上皮细胞"},{"key":"D","text":"肝细胞"},{"key":"E","text":"造血细胞"}],"answerKeys":["B"],"answerText":["心肌细胞"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：按细胞再生能力分类，永久性细胞（非分裂细胞）主要包括神经细胞、骨骼肌细胞和心肌细胞，损伤后通常由纤维结缔组织增生修复。\n解析：永久性细胞在出生后基本丧失分裂增殖能力，损伤后不能靠同类细胞再生来修复，而由肉芽组织机化、纤维瘢痕形成。心肌细胞属于永久性细胞，故心肌梗死后坏死心肌被瘢痕组织替代，这是本题题眼。需注意“永久性”是传统病理学分类，指再生能力极低，并非绝对没有任何增殖潜能。\n\n选项分析：\nA. 错误：表皮细胞属于不稳定细胞，位于体表及腔道黏膜，不断增殖、分化、脱落更新，损伤后再生能力强。\nB. 正确：心肌细胞属于永久性细胞，出生后基本不能分裂增殖，心肌坏死后主要由纤维瘢痕修复。\nC. 错误：肾小管上皮细胞属于稳定细胞，平时增殖低下，但肾小管损伤后可活跃增生以修复上皮缺损。\nD. 错误：肝细胞属于稳定细胞，平时处于G0期，肝部分切除或肝损伤后可强烈代偿性增生。\nE. 错误：造血细胞属于不稳定细胞，骨髓造血干细胞及祖细胞持续分裂，不断产生血细胞，再生更新能力强。\n\n易混点：永久性细胞不要与稳定细胞混淆。肝细胞、肾小管上皮细胞虽平时分裂少，但损伤后有明显再生能力，属稳定细胞；心肌、骨骼肌、神经细胞损伤后再生能力极低，属永久性细胞，常以瘢痕修复为主。记忆要点：持续更新为不稳定，平时静息、损伤可增生为稳定，基本不能再生的为永久性。","chapter":2,"chapterName":"损伤的修复","chapterTitle":"第2章 损伤的修复"},{"id":"pathology-a-single-0249","type":"single","typeLabel":"单选题","number":249,"question":"痰涂片阳性检出率最高的肺癌是","options":[{"key":"A","text":"大细胞癌"},{"key":"B","text":"小细胞癌"},{"key":"C","text":"腺癌"},{"key":"D","text":"鳞状细胞癌"},{"key":"E","text":"细支气管肺泡癌"}],"answerKeys":["D"],"answerText":["鳞状细胞癌"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：肺癌痰脱落细胞学检查阳性率与组织学类型及发生部位的关系。\n解析：鳞状细胞癌多起源于段及段以上支气管，常为中央型肺癌，癌组织易向管腔内生长并脱落，且常伴坏死、空洞和痰中带血，因此痰涂片脱落细胞学阳性检出率最高，是本题题眼。中央型、支气管腔内外生性生长及癌组织脱落是鳞癌痰检阳性率高的病理基础。\n选项分析：\nA. 错误：大细胞癌多为周围型，常呈大肿块，痰中脱落癌细胞相对少，痰涂片阳性率低。\nB. 错误：小细胞癌虽多为中央型，痰检可阳性，但癌细胞小、易挤压变形，且本题标准答案为鳞癌，其痰检阳性率低于鳞状细胞癌。\nC. 错误：腺癌多为周围型，较少累及大支气管，痰脱落细胞检出率较低。\nD. 正确：鳞状细胞癌多为中央型，常沿支气管腔内生长并发生坏死脱落，痰涂片阳性检出率最高。\nE. 错误：细支气管肺泡癌为旧称，现多对应贴壁生长型腺癌等，常位于肺周围，痰涂片阳性率低。\n易混点：小细胞癌和鳞癌都好发于中央型，但考试中痰涂片阳性率最高选鳞状细胞癌；腺癌及细支气管肺泡癌多为周围型，痰检阳性率低。记忆要点：中央型、腔内生长、易脱落坏死→鳞癌痰检阳性率最高。","chapter":10,"chapterName":"呼吸系统疾病","chapterTitle":"第10章 呼吸系统疾病"},{"id":"pathology-a-single-0250","type":"single","typeLabel":"单选题","number":250,"question":"下列哪种肝硬化可出现肝细胞的羽毛状坏死","options":[{"key":"A","text":"坏死后性肝硬化"},{"key":"B","text":"血吸虫性肝硬化"},{"key":"C","text":"胆汁性肝硬化"},{"key":"D","text":"门脉性肝硬化"},{"key":"E","text":"淤血性肝硬化"}],"answerKeys":["C"],"answerText":["胆汁性肝硬化"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：胆汁长期淤积可导致肝细胞胞质疏松、淡染呈羽毛状，为胆汁性肝硬化的重要形态学改变。\n解析：胆汁性肝硬化时，持续胆汁淤积使胆盐在肝内蓄积，肝细胞受损后胞质内水分和胆色素代谢产物增多，细胞体积增大、胞质疏松淡染，呈羽毛状改变，可伴毛细胆管胆栓形成。病变以汇管区胆管周围纤维化、炎症及小胆管增生为特征，临床上可有黄疸、皮肤瘙痒、碱性磷酸酶升高等胆汁淤积表现。本题题眼是“羽毛状坏死”，其与胆汁淤积性损伤密切相关。\n选项分析：\nA. 错误：坏死后性肝硬化多由亚急性重型肝炎或广泛肝坏死发展而来，以大小不等的宽大纤维间隔和结节为特征，并非以羽毛状坏死为典型改变。\nB. 错误：血吸虫性肝硬化由虫卵肉芽肿及门管区纤维化引起，典型为“干线型”纤维化，肝细胞一般无明显羽毛状坏死。\nC. 正确：胆汁性肝硬化存在长期胆汁淤积，肝细胞可发生羽毛状变性坏死，伴胆栓和汇管区纤维化，符合题意。\nD. 错误：门脉性肝硬化多由病毒性肝炎、酒精等引起，典型为小结节性假小叶，肝细胞常见脂肪变、气球样变或灶状坏死，不以羽毛状坏死为特征。\nE. 错误：淤血性肝硬化由长期右心衰竭等致肝静脉回流受阻，表现为小叶中央区淤血、缺氧、坏死及纤维化，形成槟榔肝，不是羽毛状坏死。\n易混点：羽毛状坏死应与病毒性肝炎中的气球样变区分，前者强调胆汁淤积所致胞质疏松淡染，常见于胆汁性肝硬化；后者为水变性。还应与嗜酸性坏死（Councilman小体）区分，后者多见于病毒性肝炎等。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-a-single-0251","type":"single","typeLabel":"单选题","number":251,"question":"局灶性节段性肾小球硬化的临床特点是","options":[{"key":"A","text":"极少出现血尿和高血压"},{"key":"B","text":"激素治疗效果好"},{"key":"C","text":"多表现为肾病综合征"},{"key":"D","text":"多见于中、老年人"},{"key":"E","text":"少量蛋白尿"}],"answerKeys":["C"],"answerText":["多表现为肾病综合征"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：局灶性节段性肾小球硬化（FSGS）的临床特点及与微小病变性肾小球病的鉴别。\n解析：FSGS是原发性肾病综合征的常见病理类型之一，临床上多数患者表现为肾病综合征，即大量蛋白尿、低白蛋白血症、水肿和高脂血症。其蛋白尿多为非选择性蛋白尿，常伴血尿和高血压，部分患者可进展为慢性肾衰竭。本题题眼是“临床特点”：FSGS最典型、最常考的临床表现是肾病综合征，因此选C。\n选项分析：\nA. 错误：FSGS并非极少出现血尿和高血压，相反较常伴有血尿和高血压，尤其与微小病变性肾小球病相比更明显。\nB. 错误：FSGS对糖皮质激素治疗常不敏感，易出现激素抵抗，疗效差且易复发；激素治疗效果好是微小病变性肾小球病的典型特点。\nC. 正确：FSGS临床多表现为肾病综合征，出现大量蛋白尿、低白蛋白血症、水肿和高脂血症，是本题正确答案。\nD. 错误：FSGS可见于儿童和成人，并非主要见于中、老年人；原发性FSGS在儿童和成人均可发生，成人肾病综合征中较常见，但不能概括为“多见于中、老年人”。\nE. 错误：FSGS通常表现为大量蛋白尿，而非少量蛋白尿；少量蛋白尿更不符合其典型肾病综合征表现。\n易混点：FSGS与微小病变性肾小球病最易混淆。记忆要点：微小病变多见于儿童，起病急，选择性蛋白尿，激素敏感，光镜下肾小球基本正常；FSGS为局灶、节段性硬化，常伴血尿、高血压，激素抵抗，预后相对较差。","chapter":13,"chapterName":"泌尿系统疾病","chapterTitle":"第13章 泌尿系统疾病"},{"id":"pathology-a-single-0252","type":"single","typeLabel":"单选题","number":252,"question":"子宫颈鳞状上皮非典型增生是指","options":[{"key":"A","text":"上皮细胞有异型性，完全失去分化能力"},{"key":"B","text":"上皮细胞变成癌细胞，但基底膜完整"},{"key":"C","text":"上皮细胞呈不规则形增生，钉突延长，基底膜不完整"},{"key":"D","text":"上皮细胞既具有异型性，但又保持其分化能力"},{"key":"E","text":"子宫颈柱状上皮被鳞状上皮代替"}],"answerKeys":["D"],"answerText":["上皮细胞既具有异型性，但又保持其分化能力"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：子宫颈鳞状上皮非典型增生（异型增生）的本质是上皮细胞出现异型性，但仍保留一定的分化成熟能力，基底膜完整。\n解析：非典型增生属于癌前病变，镜下表现为鳞状上皮细胞大小、形态和核染色质异常，核分裂象增多，细胞极性紊乱，但病变仍局限于上皮层内，基底膜完整，且细胞未完全丧失分化能力。题眼是“非典型增生”，应与原位癌的“全层异型、无成熟分化”和浸润癌的“基底膜破坏”相区别。\n\n选项分析：\nA. 错误：上皮细胞有异型性但“完全失去分化能力”更接近原位癌或癌细胞的特征，不是非典型增生的定义。\nB. 错误：上皮细胞变成癌细胞但基底膜完整，描述的是子宫颈原位癌（CIS），不是非典型增生；其关键区别在于是否已成癌细胞及是否累及全层。\nC. 错误：上皮不规则增生、钉突延长且基底膜不完整，提示病变已突破基底膜，属于浸润性鳞状细胞癌的表现，不是非典型增生。\nD. 正确：非典型增生时细胞具有异型性，但仍保持一定分化能力，病变局限于上皮层内，基底膜完整，符合癌前病变特点。\nE. 错误：子宫颈柱状上皮被鳞状上皮代替是鳞状上皮化生，属于适应性改变，不等同于非典型增生；化生上皮可进一步发生异型增生。\n\n易混点：非典型增生、原位癌和浸润癌的根本区别在于异型程度、分化成熟能力及基底膜是否完整。记忆要点：非典型增生＝有异型但仍有分化、基底膜完整；原位癌＝全层异型、基底膜完整；浸润癌＝基底膜破坏。鳞状上皮化生则是柱状上皮被鳞状上皮取代，并非肿瘤性病变。","chapter":14,"chapterName":"生殖系统和乳腺疾病","chapterTitle":"第14章 生殖系统和乳腺疾病"},{"id":"pathology-a-single-0253","type":"single","typeLabel":"单选题","number":253,"question":"哪项描述符合瘢痕组织的特点","options":[{"key":"A","text":"细胞间有丰富的液体成分"},{"key":"B","text":"组织内有大量的毛细血管"},{"key":"C","text":"组织色泽鲜红、质地柔软"},{"key":"D","text":"组织质地较硬、缺乏弹性"},{"key":"E","text":"组织内有较多的炎性细胞"}],"answerKeys":["D"],"answerText":["组织质地较硬、缺乏弹性"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：瘢痕组织是肉芽组织经纤维化、改建后形成的纤维结缔组织，具有胶原纤维致密、血管和细胞少、质地硬韧缺乏弹性的特点。\n解析：瘢痕组织由肉芽组织逐渐转变而来，成纤维细胞产生大量胶原纤维，后期胶原纤维可发生玻璃样变，组织内血管和炎性细胞明显减少。因此瘢痕组织外观多呈灰白色或苍白，质地较硬、缺乏弹性，这是本题题眼。A、B、C、E所述更符合肉芽组织或炎症、水肿性病变的特点，而非成熟瘢痕组织。\n选项分析：\nA. 错误：细胞间有丰富液体成分多见于组织水肿、黏液样变或炎症渗出，瘢痕组织间质以致密胶原纤维为主，并非富含液体。\nB. 错误：组织内有大量毛细血管是肉芽组织的典型特点；瘢痕组织血管稀少，毛细血管数量明显减少。\nC. 错误：色泽鲜红、质地柔软、湿润呈颗粒状是肉芽组织的肉眼特点；瘢痕组织多苍白或灰白、质硬。\nD. 正确：瘢痕组织胶原纤维致密并发生玻璃样变，血管和细胞少，故质地较硬、缺乏弹性。\nE. 错误：组织内有较多炎性细胞提示炎症活动期或肉芽组织，成熟瘢痕组织炎性细胞明显减少。\n易混点：肉芽组织与瘢痕组织要对比记忆。肉芽组织由新生毛细血管、成纤维细胞和炎性细胞构成，鲜红、柔软、湿润、颗粒状；瘢痕组织胶原纤维致密、血管少、细胞少，灰白、硬韧、缺乏弹性。记忆要点：肉芽“红软湿多血管炎细胞”，瘢痕“白硬少血管少细胞”。","chapter":2,"chapterName":"损伤的修复","chapterTitle":"第2章 损伤的修复"},{"id":"pathology-a-single-0254","type":"single","typeLabel":"单选题","number":254,"question":"新月体主要由下列哪种细胞增生形成","options":[{"key":"A","text":"系膜细胞"},{"key":"B","text":"足细胞"},{"key":"C","text":"内皮细胞"},{"key":"D","text":"壁层上皮细胞/巨噬细胞"},{"key":"E","text":"中性粒细胞"}],"answerKeys":["D"],"answerText":["壁层上皮细胞/巨噬细胞"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：新月体性肾小球肾炎中新月体的细胞构成，主要由壁层上皮细胞和单核巨噬细胞增生形成。\n解析：新月体位于肾小球囊腔（鲍曼囊）内，属于毛细血管外增生性病变。其形成机制与肾小球毛细血管壁严重损伤、纤维素渗出有关，渗出的纤维素刺激壁层上皮细胞增生，并有单核巨噬细胞浸润，二者共同构成新月体，可压迫肾小球毛细血管丛，导致肾功能迅速恶化。题眼是“新月体”即毛细血管外增生，而不是毛细血管内增生。\n选项分析：\nA. 错误：系膜细胞增生主要见于系膜增生性肾小球肾炎、IgA肾病等，可导致系膜区增宽，但不是新月体的主要构成细胞。\nB. 错误：足细胞属于脏层上皮细胞，位于毛细血管基底膜外侧；足细胞损伤可导致蛋白尿和足突融合，但新月体主要由壁层上皮细胞和巨噬细胞构成。\nC. 错误：内皮细胞增生属于毛细血管内增生，常见于急性弥漫性增生性肾小球肾炎等，不是新月体的主要成分。\nD. 正确：新月体由壁层上皮细胞增生并伴单核巨噬细胞浸润形成，常含纤维素，位于鲍曼囊腔，是快速进行性肾小球肾炎的特征性病变。\nE. 错误：中性粒细胞渗出可见于急性感染后肾小球肾炎等急性炎症反应，但中性粒细胞不是新月体的主要构成细胞。\n易混点：急性弥漫性增生性肾小球肾炎以毛细血管内皮细胞和系膜细胞增生为主，为“毛细血管内增生”；新月体性肾小球肾炎以壁层上皮细胞和巨噬细胞在鲍曼囊内增生为主，为“毛细血管外增生”。记忆要点：新月体=壁层上皮细胞+巨噬细胞+纤维素。","chapter":13,"chapterName":"泌尿系统疾病","chapterTitle":"第13章 泌尿系统疾病"},{"id":"pathology-a-single-0255","type":"single","typeLabel":"单选题","number":255,"question":"脂性肾病在电镜下最主要的变化是","options":[{"key":"A","text":"肾小球壁层上皮细胞内见大量脂质沉积"},{"key":"B","text":"肾小球脏层上皮细胞足突广泛消失"},{"key":"C","text":"肾小球毛细血管内皮细胞和系膜细胞增生"},{"key":"D","text":"肾小球系膜基质增多"},{"key":"E","text":"肾小球毛细血管基底膜外驼峰状沉积物"}],"answerKeys":["B"],"answerText":["肾小球脏层上皮细胞足突广泛消失"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：脂性肾病（微小病变性肾病）的电镜特征性改变是肾小球脏层上皮细胞（足细胞）足突广泛融合、消失。\n解析：脂性肾病即微小病变性肾病，是儿童原发性肾病综合征最常见的病因。其肾小球光镜下基本正常，电镜下最主要改变为脏层上皮细胞足突广泛消失，毛细血管基底膜本身正常，无电子致密物沉积；近曲小管上皮细胞内可见脂质空泡，故称“脂性肾病”。本题题眼是“电镜下最主要变化”，应选足突广泛消失。\n选项分析：\nA. 错误：脂性肾病可见脂质沉积，但主要在近曲小管上皮细胞内，而非肾小球壁层上皮细胞；且不是电镜下最主要改变。\nB. 正确：脏层上皮细胞即足细胞，其足突广泛融合、消失是脂性肾病电镜下最特征性变化，也是大量蛋白尿的重要基础。\nC. 错误：肾小球毛细血管内皮细胞和系膜细胞增生主要见于毛细血管内增生性肾小球肾炎等，不是脂性肾病的特点。\nD. 错误：肾小球系膜基质增多主要见于系膜增生性肾小球肾炎、糖尿病肾病等，脂性肾病系膜区一般无明显增生或基质增多。\nE. 错误：肾小球毛细血管基底膜外驼峰状沉积物是急性感染后肾小球肾炎的典型电镜表现，脂性肾病无电子致密物沉积。\n易混点：脂性肾病电镜为“足突广泛消失、基底膜正常、无沉积物”；急性感染后肾小球肾炎为“上皮下驼峰状沉积物”；膜性肾病为“基底膜上皮侧钉突及沉积物”。记忆要点：儿童肾病综合征+光镜正常+足突消失，首先考虑微小病变性/脂性肾病。","chapter":13,"chapterName":"泌尿系统疾病","chapterTitle":"第13章 泌尿系统疾病"},{"id":"pathology-a-single-0256","type":"single","typeLabel":"单选题","number":256,"question":"创伤性脂肪栓塞时，栓塞部位通常是","options":[{"key":"A","text":"肝"},{"key":"B","text":"肾"},{"key":"C","text":"肺"},{"key":"D","text":"脑"},{"key":"E","text":"心"}],"answerKeys":["C"],"answerText":["肺"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：创伤性脂肪栓塞是长骨骨折后脂肪滴进入静脉血流，随右心首先阻塞肺小动脉和毛细血管，因此栓塞部位通常是肺。\n解析：长骨骨折或严重软组织创伤时，骨髓脂肪滴可被挤入破裂的静脉窦，随静脉回流进入右心，再进入肺动脉分支，形成肺脂肪栓塞。临床上可表现为突发呼吸困难、低氧血症，严重者出现脂肪栓塞综合征。题眼是“创伤性脂肪栓塞”和“通常部位”，即脂肪栓子首先经右心到达肺循环被滤过。\n\n选项分析：\nA. 错误：肝不是创伤性脂肪栓塞的首站部位。肝虽有肝动脉和门静脉双重血供，但脂肪滴经静脉主要先进入肺循环；肝内栓塞多见于门静脉系统或体循环动脉栓塞，并非本题通常部位。\nB. 错误：肾栓塞通常属于体循环动脉栓塞，栓子多来自左心瓣膜赘生物、左心房附壁血栓或主动脉粥样硬化斑块，可引起肾梗死；创伤性脂肪栓子首先停留在肺，故肾不是通常部位。\nC. 正确：脂肪滴经静脉回流至右心后进入肺动脉，肺毛细血管床是主要滤过部位，故创伤性脂肪栓塞通常发生于肺。镜下可见肺小血管内脂肪滴，严重时伴肺泡出血、水肿和炎症反应。\nD. 错误：脑脂肪栓塞属于体循环动脉栓塞，只有较小脂滴通过肺毛细血管或经动静脉分流进入体循环时才可能发生，可导致脑缺血、意识障碍等，但不是创伤性脂肪栓塞的通常首发部位。\nE. 错误：心栓塞通常指冠状动脉栓塞，栓子多来自左心或主动脉，可引起心肌梗死；创伤性脂肪栓子首先被肺循环滤过，故心不是通常部位。\n\n易混点：肺动脉血栓栓塞也累及肺，但血栓栓子多来自下肢深静脉，常阻塞较大肺动脉分支；脂肪栓塞则多继发于长骨骨折，栓子为脂肪滴，主要阻塞肺小动脉和毛细血管。记忆要点：静脉来源栓子先到肺，动脉来源栓子才易到脑、肾、心等体循环器官。","chapter":3,"chapterName":"局部血液循环障碍","chapterTitle":"第3章 局部血液循环障碍"},{"id":"pathology-a-single-0257","type":"single","typeLabel":"单选题","number":257,"question":"肱静脉血栓形成可引起","options":[{"key":"A","text":"肺动脉栓塞"},{"key":"B","text":"尺动脉栓塞"},{"key":"C","text":"桡动脉栓塞"},{"key":"D","text":"脑动脉栓塞"},{"key":"E","text":"肾动脉栓塞"}],"answerKeys":["A"],"answerText":["肺动脉栓塞"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：A\n核心考点：静脉血栓脱落后随静脉血流经右心进入肺循环，导致肺动脉栓塞。\n解析：肱静脉属上肢静脉，血栓脱落后依次经腋静脉、锁骨下静脉、头臂静脉、上腔静脉回右心房、右心室，再进入肺动脉及其分支，故可引起肺动脉栓塞。肺动脉栓塞的栓子绝大多数来自下肢深静脉，但上肢静脉、盆腔静脉等也可成为来源。本题题眼是“静脉血栓—右心—肺循环”，因此栓子首先进入肺循环，而不是体循环动脉。\n\n选项分析：\nA. 正确：肱静脉血栓脱落后经右心进入肺动脉，阻塞肺动脉分支，形成肺动脉栓塞；大栓子可阻塞肺动脉主干或大分支，小栓子可至肺小动脉。\nB. 错误：尺动脉属体循环动脉，其栓塞多来自左心附壁血栓、心房颤动、感染性心内膜炎赘生物或近端动脉粥样硬化斑块脱落；肱静脉血栓经右心进入肺循环，不能直接进入尺动脉。\nC. 错误：桡动脉栓塞同样属于体循环动脉栓塞，栓子来源多为左心或动脉系统；静脉栓子会被肺循环“过滤”，不会直接进入桡动脉。\nD. 错误：脑动脉栓塞常见于左心血栓（如房颤、心内膜炎）或颈动脉粥样硬化斑块脱落；肱静脉来源的栓子先到肺，不会直接入脑动脉。\nE. 错误：肾动脉栓塞多源于左心附壁血栓、感染性心内膜炎赘生物或主动脉粥样硬化斑块；肱静脉血栓不进入体循环动脉，故不引起肾动脉栓塞。\n易混点：静脉血栓脱落主要引起肺动脉栓塞，而不是体循环动脉栓塞；若静脉栓子经未闭卵圆孔等右向左分流进入体循环，才可能发生“反常栓塞”，但并非常规途径。记忆要点：体循环动脉栓塞多找左心和动脉源，肺动脉栓塞多找静脉源和右心。","chapter":3,"chapterName":"局部血液循环障碍","chapterTitle":"第3章 局部血液循环障碍"},{"id":"pathology-a-single-0258","type":"single","typeLabel":"单选题","number":258,"question":"关于主动脉粥样硬化的叙述中下列错误的是","options":[{"key":"A","text":"病变多位于主动脉后壁和各分支开口处"},{"key":"B","text":"可引起动脉血流障碍"},{"key":"C","text":"可引起主动脉瓣膜病"},{"key":"D","text":"可引起夹层动脉瘤"},{"key":"E","text":"可继发溃疡及血栓形成"}],"answerKeys":["D"],"answerText":["可引起夹层动脉瘤"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：主动脉粥样硬化的好发部位、继发病变及其与夹层动脉瘤的病因区别。\n解析：主动脉粥样硬化好发于腹主动脉后壁及各分支开口处，粥样斑块可导致管壁增厚、弹性减弱，并可继发斑块破裂、溃疡和血栓形成；累及主动脉根部时可引起主动脉瓣硬化、钙化等瓣膜病变。夹层动脉瘤的本质是主动脉内膜撕裂，血液进入中膜形成假腔，最常见相关因素是高血压，也可与马方综合征等结缔组织病有关，并非主动脉粥样硬化的典型并发症。本题题眼是“错误的是”，应选D。\n\n选项分析：\nA. 正确：主动脉粥样硬化病变多位于腹主动脉后壁及各分支开口处，这是考试常考的好发部位。\nB. 正确：粥样斑块可使管壁增厚、弹性下降，累及分支开口时可影响相应动脉血流，故可引起血流障碍。\nC. 正确：主动脉根部粥样硬化可累及主动脉瓣，引起瓣膜硬化、钙化，进而导致主动脉瓣膜病。\nD. 错误：夹层动脉瘤主要由内膜撕裂、血液进入中膜形成假腔所致，常见于高血压等；主动脉粥样硬化典型引起的是真性主动脉瘤，而不是夹层动脉瘤。\nE. 正确：粥样斑块可发生破裂、溃疡，并继发血栓形成，是动脉粥样硬化的常见继发性改变。\n\n易混点：主动脉粥样硬化可形成真性动脉瘤，表现为管壁全层扩张；夹层动脉瘤是血液进入中膜形成假腔，关键机制为内膜撕裂。记忆要点：粥样硬化“斑块—溃疡—血栓—真性动脉瘤”，高血压/结缔组织病“内膜撕裂—中膜假腔—夹层动脉瘤”。","chapter":9,"chapterName":"心血管系统疾病","chapterTitle":"第9章 心血管系统疾病"},{"id":"pathology-a-single-0259","type":"single","typeLabel":"单选题","number":259,"question":"与亚急性细菌性心内膜炎无关的病变是","options":[{"key":"A","text":"肾梗死"},{"key":"B","text":"皮肤黏膜出血点"},{"key":"C","text":"皮肤环形红斑"},{"key":"D","text":"心瓣膜赘生物"},{"key":"E","text":"脾大"}],"answerKeys":["C"],"answerText":["皮肤环形红斑"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：亚急性细菌性心内膜炎的赘生物、栓塞及免疫性周围表现，并与风湿热皮肤病变相鉴别。\n解析：亚急性细菌性心内膜炎（SBE）的基本病变是心瓣膜形成赘生物，赘生物可破碎脱落引起栓塞，并可因感染、免疫复合物沉积等出现脾大、皮肤黏膜瘀点等表现。皮肤环形红斑是风湿热的特征性皮肤表现，与A组溶血性链球菌感染后的免疫反应有关，并不是SBE的病变。本题题眼是“无关”，即选出不属于SBE的病变。\n\n选项分析：\nA. 错误：肾梗死是SBE赘生物脱落形成栓子栓塞肾动脉所致，属于本病可发生的栓塞并发症，故与SBE有关。\nB. 错误：皮肤黏膜出血点即瘀点，可由微栓塞、血管炎或血小板减少等引起，是SBE常见的周围血管表现之一。\nC. 正确：皮肤环形红斑是风湿热的皮肤表现，多见于躯干和四肢，呈环形淡红色红斑，与SBE无直接关系。\nD. 错误：心瓣膜赘生物是SBE的基本病变，常位于二尖瓣或主动脉瓣，由血栓、纤维蛋白、炎症细胞和细菌等构成。\nE. 错误：脾大在SBE中常见，与持续感染、单核巨噬细胞增生及免疫反应有关，也可伴脾梗死。\n\n易混点：SBE可出现Osler结节、Janeway损害、Roth斑和皮肤瘀点，但这些属于感染性心内膜炎的周围表现；环形红斑则主要见于风湿热。记忆要点：环形红斑归风湿热，SBE看赘生物、栓塞、脾大和瘀点。","chapter":9,"chapterName":"心血管系统疾病","chapterTitle":"第9章 心血管系统疾病"},{"id":"pathology-a-single-0260","type":"single","typeLabel":"单选题","number":260,"question":"在葡萄球菌感染的炎症反应中所见到的炎细胞主要是","options":[{"key":"A","text":"淋巴细胞"},{"key":"B","text":"单核细胞"},{"key":"C","text":"嗜酸性粒细胞"},{"key":"D","text":"肥大细胞"},{"key":"E","text":"中性粒细胞"}],"answerKeys":["E"],"answerText":["中性粒细胞"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n\n核心考点：葡萄球菌感染属于急性化脓性炎症，炎症灶内浸润的主要炎细胞是中性粒细胞。\n\n解析：葡萄球菌是常见的化脓性细菌，感染后局部常形成局限性化脓性炎，如疖、痈、脓肿等。急性炎症时，机体首先动员中性粒细胞自血管渗出至炎症灶，通过趋化、吞噬和杀菌作用清除病原体；脓液中的“脓细胞”主要就是变性坏死的中性粒细胞。本题题眼是“葡萄球菌感染”与“急性化脓性炎”，因此主要炎细胞为中性粒细胞。\n\n选项分析：\nA. 错误：淋巴细胞主要见于慢性炎症、病毒感染以及某些免疫反应性炎症，不是葡萄球菌急性化脓性感染的主要炎细胞。\nB. 错误：单核细胞主要见于慢性炎症、肉芽肿性炎、病毒感染后期等，可转化为巨噬细胞，但在葡萄球菌感染的急性化脓性炎早期不是主要渗出细胞。\nC. 错误：嗜酸性粒细胞主要见于寄生虫感染和IgE介导的过敏反应，也可见于某些皮肤病，并非化脓性细菌感染的主要炎细胞。\nD. 错误：肥大细胞主要参与IgE介导的速发型超敏反应，释放组胺等介质，不是葡萄球菌感染炎症灶中的主要炎细胞。\nE. 正确：葡萄球菌感染引起急性化脓性炎，中性粒细胞渗出最显著，具有趋化、吞噬和杀菌功能，坏死崩解后形成脓细胞，是本题正确答案。\n\n易混点：急性化脓性炎以中性粒细胞为主；慢性炎症以淋巴细胞、浆细胞和巨噬细胞为主；寄生虫感染和过敏性疾病则以嗜酸性粒细胞增多为特点。记忆要点：葡萄球菌、化脓、脓液、脓细胞均首先联系中性粒细胞。","chapter":4,"chapterName":"炎症","chapterTitle":"第4章 炎症"},{"id":"pathology-a-single-0261","type":"single","typeLabel":"单选题","number":261,"question":"如图所示，结核结节主要由什么细胞构成","options":[{"key":"A","text":"浆细胞"},{"key":"B","text":"淋巴细胞"},{"key":"C","text":"成纤维细胞"},{"key":"D","text":"巨噬细胞"},{"key":"E","text":"类上皮细胞和郎罕巨细胞"}],"answerKeys":["E"],"answerText":["类上皮细胞和郎罕巨细胞"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n核心考点：结核结节属于感染性肉芽肿，主要由类上皮细胞和郎罕巨细胞构成。\n解析：题目图片未提供，仅依据题干和标准答案分析。结核结节是结核病的特征性病变，中央常为干酪样坏死，周围主要由类上皮细胞（吞噬结核分枝杆菌后转化的巨噬细胞）和郎罕巨细胞（多核巨细胞，核排列呈马蹄形或环形）构成，外周可伴淋巴细胞浸润和成纤维细胞增生。题眼是“结核结节主要由什么细胞构成”，应选类上皮细胞和郎罕巨细胞；巨噬细胞虽是其来源，但不是最具特征性的主要构成表述。\n选项分析：\nA. 错误：浆细胞主要见于慢性炎症、梅毒等，可产生抗体，但不是结核结节的主要构成细胞。\nB. 错误：淋巴细胞可出现在结核结节外周，属于炎症反应成分，但不是主要特征性构成细胞。\nC. 错误：成纤维细胞参与结核结节周围纤维组织增生和包裹，不是结节中心的主要细胞。\nD. 错误：巨噬细胞是类上皮细胞和郎罕巨细胞的来源细胞，但典型结核结节中主要显示为已转化的类上皮细胞和郎罕巨细胞；单写巨噬细胞不能准确概括结节主要构成。\nE. 正确：类上皮细胞和郎罕巨细胞是结核结节的特征性主要成分，符合结核性肉芽肿的病理形态。\n易混点：结核结节与一般慢性肉芽肿均可见巨噬细胞、淋巴细胞和成纤维细胞，但结核结节的关键是类上皮细胞和郎罕巨细胞，并常伴中央干酪样坏死；记忆为“类上皮＋郎罕，中心干酪样”。","chapter":18,"chapterName":"传染病","chapterTitle":"第18章 传染病","needsImage":true},{"id":"pathology-a-single-0262","type":"single","typeLabel":"单选题","number":262,"question":"下列关于乳腺导管内乳头状瘤的描述错误的是","options":[{"key":"A","text":"多见于中老年妇女"},{"key":"B","text":"恶变率极低"},{"key":"C","text":"乳腺肿物多位于乳晕下"},{"key":"D","text":"绝大多数是多发性"},{"key":"E","text":"直径一般小于2cm"}],"answerKeys":["D"],"answerText":["绝大多数是多发性"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：乳腺导管内乳头状瘤的好发年龄、部位、单发或多发特点及其恶变倾向。\n解析：乳腺导管内乳头状瘤多见于中老年妇女，常发生在大导管，尤其是乳晕下导管，因此肿块多位于乳晕下，且常伴乳头血性溢液。肿瘤一般较小，直径多小于2cm，单发者恶变率极低。本题题眼在于“单发还是多发”：经典大导管内乳头状瘤以单发为主，而不是绝大多数多发，故D错误。\n选项分析：\nA. 正确：本病多见于中老年妇女，常为40～50岁经产妇，属于考试常考的好发年龄特点。\nB. 正确：单发性大导管内乳头状瘤恶变率很低，临床多表现为良性乳头状瘤。\nC. 正确：病变多位于乳晕下大导管，故乳腺肿物常位于乳晕下，并可伴乳头溢液。\nD. 错误：绝大多数乳腺导管内乳头状瘤为单发；多发性者多位于中小导管，称为乳头状瘤病，且癌变风险相对较高，不能概括为“绝大多数多发性”。\nE. 正确：肿瘤体积一般较小，直径通常小于2cm，这是其大体特点之一。\n易混点：导管内乳头状瘤以单发、位于乳晕下大导管、血性乳头溢液、恶变率低为记忆要点；多发性中小导管乳头状瘤病则癌变风险相对较高。与导管内乳头状癌鉴别时，后者细胞异型性明显、可浸润管壁，不能仅凭乳头状结构判断良恶性。","chapter":14,"chapterName":"生殖系统和乳腺疾病","chapterTitle":"第14章 生殖系统和乳腺疾病"},{"id":"pathology-a-single-0263","type":"single","typeLabel":"单选题","number":263,"question":"流行性乙型脑炎的病变性质属于","options":[{"key":"A","text":"变质性炎"},{"key":"B","text":"渗出性炎"},{"key":"C","text":"增生性炎"},{"key":"D","text":"肉芽肿性炎"},{"key":"E","text":"化脓性炎"}],"answerKeys":["A"],"answerText":["变质性炎"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：A\n核心考点：流行性乙型脑炎是病毒性脑炎，病变以脑实质神经细胞变性、坏死为主，属于变质性炎。\n解析：流行性乙型脑炎由乙型脑炎病毒引起，主要累及脑实质，尤其是大脑皮质、基底核、丘脑、脑干等部位。镜下突出表现为神经细胞变性坏死、噬神经细胞现象、筛状软化灶、胶质细胞增生形成胶质结节，以及血管周围淋巴细胞浸润形成血管套。其基本病变性质是实质细胞变性坏死，故归为变质性炎；题眼是“病毒性脑炎、脑实质损害为主”。\n选项分析：\nA. 正确：乙脑以神经细胞变性坏死为突出改变，属于变质性炎，可伴血管套和胶质结节等继发改变。\nB. 错误：渗出性炎以血管渗出和炎性细胞浸润为主，如大叶性肺炎；乙脑虽有血管周围炎细胞浸润，但本质不是渗出性炎。\nC. 错误：增生性炎以纤维组织或细胞增生为主，如慢性炎症、结节性病变；乙脑的胶质结节属于反应性增生，不是其基本病变性质。\nD. 错误：肉芽肿性炎常见于结核、真菌感染、结节病等，形成上皮样细胞和多核巨细胞构成的肉芽肿；乙脑无肉芽肿形成。\nE. 错误：化脓性炎由化脓菌引起，以中性粒细胞浸润和脓液形成为特征，如流行性脑脊髓膜炎；乙脑是病毒性、非化脓性脑炎。\n易混点：乙脑与流脑最易混：乙脑为病毒性变质性炎，病变在脑实质，可见筛状软化灶、噬神经细胞现象；流脑为细菌性化脓性炎，病变在蛛网膜下腔，可见脓性渗出物。记忆要点：乙脑“变质在脑实质”，流脑“化脓在脑膜”。","chapter":16,"chapterName":"神经系统疾病","chapterTitle":"第16章 神经系统疾病"},{"id":"pathology-a-single-0264","type":"single","typeLabel":"单选题","number":264,"question":"判断良恶性肿瘤的主要组织学特征是","options":[{"key":"A","text":"肿瘤细胞排列紊乱"},{"key":"B","text":"肿瘤细胞核的异型性"},{"key":"C","text":"肿瘤细胞的多型性"},{"key":"D","text":"肿瘤细胞浆嗜碱性"},{"key":"E","text":"肿瘤细胞失去极性"}],"answerKeys":["B"],"answerText":["肿瘤细胞核的异型性"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：良恶性肿瘤的组织学鉴别核心是细胞异型性，尤其是细胞核的异型性。\n解析：良性肿瘤细胞分化较成熟，异型性小，核形态与正常细胞较接近；恶性肿瘤细胞分化差，异型性明显，最关键的表现为核异型性，如核增大、核浆比增大、核染色质粗大深染、核仁明显、核膜不规则、出现巨核或多核，并可见病理性核分裂象。因此判断良恶性主要看肿瘤细胞核的异型性，题眼是“主要组织学特征”而非一般结构排列改变。肿瘤的异型性包括细胞异型性和结构异型性，其中细胞核的改变最具诊断价值。\n\n选项分析：\nA. 错误：肿瘤细胞排列紊乱属于结构异型性，恶性肿瘤常见，但炎症、修复、增生时也可有排列改变，不能作为判断良恶性的主要依据。\nB. 正确：核异型性反映肿瘤细胞分化不成熟和恶性程度，是良恶性肿瘤组织学鉴别中最重要、最可靠的指标。\nC. 错误：肿瘤细胞多型性指细胞大小、形态不一，是异型性的表现之一，但不如核异型性特异和关键；部分良性病变也可有一定细胞多型性。\nD. 错误：肿瘤细胞浆嗜碱性常因核糖体增多、蛋白合成旺盛所致，可见于恶性肿瘤，也可见于再生、炎症等活跃增生细胞，缺乏鉴别特异性。\nE. 错误：肿瘤细胞失去极性多见于恶性上皮性肿瘤，尤其原位癌，但并非所有肿瘤均适用，间叶肿瘤判断价值有限，且不是最主要的组织学标准。\n\n易混点：异型性越大通常恶性程度越高，但“异型性”不等同于“多型性”；结构异型性看排列和极性，细胞异型性看细胞和核，其中核异型性最重要。记忆要点：判断良恶性，先看核：核大深染、核仁明显、核浆比增大、病理性核分裂。","chapter":6,"chapterName":"肿瘤","chapterTitle":"第6章 肿瘤"},{"id":"pathology-a-single-0265","type":"single","typeLabel":"单选题","number":265,"question":"风湿性心肌炎会出现以下哪种特征性结构","options":[{"key":"A","text":"Osler结节"},{"key":"B","text":"Negri小体"},{"key":"C","text":"Aschoff小体"},{"key":"D","text":"环形红斑"},{"key":"E","text":"McCallum斑"}],"answerKeys":["C"],"answerText":["Aschoff小体"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n\n核心考点：风湿性心肌炎的特征性病理结构是Aschoff小体。\n\n解析：风湿性心肌炎属于风湿病的活动期病变，心肌间质内可出现特征性肉芽肿性病灶，即Aschoff小体。其典型组成包括中央纤维素样坏死，周围有Aschoff细胞、多核Aschoff巨细胞及淋巴细胞、浆细胞等浸润；Aschoff细胞核呈毛虫样，是考试常考形态。病变好发于左心室壁和室间隔，可影响传导系统而出现心律失常。本题题眼是“风湿性心肌炎”和“特征性结构”，故选Aschoff小体。\n\n选项分析：\nA. 错误：Osler结节是亚急性感染性心内膜炎的周围血管表现，为指趾端痛性小结节，与免疫复合物沉积有关，不是风湿性心肌炎的结构。\nB. 错误：Negri小体是狂犬病病毒包涵体，见于海马锥体细胞、小脑浦肯野细胞等胞质内，与风湿病无关。\nC. 正确：Aschoff小体是风湿性心肌炎的特征性肉芽肿，由纤维素样坏死、Aschoff细胞及炎细胞组成，是风湿病的标志性病变。\nD. 错误：环形红斑是急性风湿热的皮肤表现，属于诊断标准之一，位于皮肤而非心肌，不能作为心肌炎的特征性结构。\nE. 错误：McCallum斑是风湿性心脏病时左心房内膜因二尖瓣反流喷射冲击而形成的增厚斑块，属于心内膜病变，不是心肌炎特征。\n\n易混点：Aschoff小体是风湿性心肌炎的特征性肉芽肿；风湿性心内膜炎的特征是心瓣膜疣状赘生物；McCallum斑见于左心房内膜，环形红斑属于皮肤表现。记忆时可把“心肌炎—Aschoff小体、心内膜炎—疣状赘生物、心外膜炎—绒毛心”对应起来。","chapter":9,"chapterName":"心血管系统疾病","chapterTitle":"第9章 心血管系统疾病"},{"id":"pathology-a-single-0266","type":"single","typeLabel":"单选题","number":266,"question":"下述哪种病变只是由纤维素及血小板组成","options":[{"key":"A","text":"亚急性感染性心内膜炎的赘生物"},{"key":"B","text":"风湿性心内膜炎的赘生物"},{"key":"C","text":"心肌梗死的附壁血栓"},{"key":"D","text":"静脉内柱状血栓的体部"},{"key":"E","text":"静脉内柱状血栓的尾部"}],"answerKeys":["B"],"answerText":["风湿性心内膜炎的赘生物"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：风湿性心内膜炎的疣状赘生物本质为白色血栓，主要由血小板和纤维素组成。\n解析：风湿性心内膜炎时，瓣膜内皮受损，血小板黏附、聚集并激活凝血系统，形成由血小板和纤维素构成的白色血栓性赘生物。其好发于二尖瓣心房面闭锁缘，呈灰白色、半透明、单行排列，与瓣膜附着较牢固，不易脱落，故栓塞少见。本题题眼是“只是由纤维素及血小板组成”，即白色血栓的构成。\n选项分析：\nA. 错误：亚急性感染性心内膜炎的赘生物由血小板、纤维素、细菌菌落、坏死组织及炎细胞等组成，体积较大、质松软、易脱落，常引起栓塞。\nB. 正确：风湿性心内膜炎的赘生物即白色血栓，主要由血小板和纤维素构成，镜下无细菌菌落，炎细胞少，附着牢固。\nC. 错误：心肌梗死的附壁血栓属于混合血栓，除血小板和纤维素外，还含红细胞、白细胞等，并非仅由纤维素及血小板组成。\nD. 错误：静脉内柱状血栓的体部为混合血栓，由血小板小梁、纤维素网及大量红细胞、白细胞构成。\nE. 错误：静脉内柱状血栓的尾部为红色血栓，主要由纤维素网罗大量红细胞构成，不是仅由纤维素及血小板组成。\n易混点：白色血栓以血小板和纤维素为主，见于血栓头部、风湿性心内膜炎赘生物；感染性心内膜炎赘生物含细菌和坏死，混合血栓含红细胞，红色血栓以红细胞为主，抓住“成分”即可区分。","chapter":3,"chapterName":"局部血液循环障碍","chapterTitle":"第3章 局部血液循环障碍"},{"id":"pathology-a-single-0267","type":"single","typeLabel":"单选题","number":267,"question":"葡萄簇型横纹肌肉瘤之主要形态特征是","options":[{"key":"A","text":"幼稚横纹肌细胞"},{"key":"B","text":"原始间叶细胞"},{"key":"C","text":"丰富的黏液样基质"},{"key":"D","text":"紧靠黏膜下方有一宽带状的细胞密集区，细胞核大核分裂易见，称为“形成层”"},{"key":"E","text":"肿瘤表面被覆上皮糜烂溃疡形成"}],"answerKeys":["D"],"answerText":["紧靠黏膜下方有一宽带状的细胞密集区，细胞核大核分裂易见，称为“形成层”"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：葡萄簇型横纹肌肉瘤的镜下特征是黏膜上皮下“形成层”带。\n解析：葡萄簇型横纹肌肉瘤属于胚胎性横纹肌肉瘤的特殊亚型，好发于婴幼儿的阴道、膀胱、胆道及鼻咽等黏膜腔面，肉眼常呈息肉样、葡萄串状。镜下最关键的是紧靠黏膜上皮下方出现一条致密的肿瘤细胞带，即“形成层”，该带内细胞核大、异型性较明显、核分裂易见；其深部常为疏松黏液样区。题眼是“紧靠黏膜下方”的细胞密集带，即形成层，这是诊断葡萄簇型横纹肌肉瘤的重要形态学依据。\n选项分析：\nA. 错误：幼稚横纹肌细胞即横纹肌母细胞，可见嗜酸性胞质，部分可见横纹，属于横纹肌肉瘤的分化成分，但不是葡萄簇型的主要形态特征。\nB. 错误：原始间叶细胞属于小圆蓝细胞背景，可见于胚胎性横纹肌肉瘤等，但缺乏葡萄簇型的部位性和结构特征，不能作为本题主要形态特征。\nC. 错误：丰富黏液样基质可见于胚胎性横纹肌肉瘤的疏松区，葡萄簇型深部也可有黏液样背景，但它是背景改变，不是本题所问的特征性结构。\nD. 正确：黏膜上皮下宽带状肿瘤细胞密集区，细胞核大、核分裂易见，称为“形成层”，是葡萄簇型横纹肌肉瘤的典型镜下特征。\nE. 错误：肿瘤表面被覆上皮可因摩擦、感染等发生糜烂或溃疡，但属于继发性改变，无诊断特异性，不是主要形态特征。\n易混点：胚胎性横纹肌肉瘤可有黏液样基质和小圆蓝细胞，但葡萄簇型的关键是黏膜下形成层；与炎性息肉、肉芽组织鉴别时，形成层内为异型肿瘤细胞且核分裂易见，深部呈黏液样肿瘤背景。记忆要点：葡萄串状肉眼＋黏膜下形成层。","chapter":17,"chapterName":"骨关节和软组织疾病","chapterTitle":"第17章 骨关节和软组织疾病"},{"id":"pathology-a-single-0268","type":"single","typeLabel":"单选题","number":268,"question":"下列细胞中来源与巨噬细胞无关的是","options":[{"key":"A","text":"泡沫细胞"},{"key":"B","text":"Aschoff细胞"},{"key":"C","text":"伤寒细胞"},{"key":"D","text":"印戒细胞"},{"key":"E","text":"类上皮细胞"}],"answerKeys":["D"],"answerText":["印戒细胞"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：炎症肉芽肿及特殊病变中巨噬细胞来源细胞的识别，重点区分巨噬细胞衍生细胞与上皮源性肿瘤细胞。\n解析：本题题眼是“来源与巨噬细胞无关”。巨噬细胞在炎症、免疫反应及组织修复中可发生形态和功能转化，形成泡沫细胞、Aschoff细胞、伤寒细胞和类上皮细胞等。印戒细胞则多为腺癌细胞，因胞质内黏液积聚将细胞核挤向一侧，呈现“印戒样”形态，属于上皮源性肿瘤细胞，不是巨噬细胞来源。故标准答案为D。\n\n选项分析：\nA. 错误：泡沫细胞主要由巨噬细胞吞噬大量脂质后形成，常见于动脉粥样硬化斑块，与巨噬细胞来源有关，不符合题意。\nB. 错误：Aschoff细胞是风湿性肉芽肿（风湿小体）中增生的巨噬细胞及其衍化细胞，可形成Aschoff巨细胞，与巨噬细胞来源有关。\nC. 错误：伤寒细胞是巨噬细胞吞噬伤寒杆菌、红细胞及坏死组织后形成的细胞，常见于伤寒肉芽肿，与巨噬细胞来源有关。\nD. 正确：印戒细胞是胞质内含黏液空泡、细胞核被挤向一侧的肿瘤细胞，典型见于胃印戒细胞癌等腺癌，来源于上皮细胞而非巨噬细胞，故与巨噬细胞无关。\nE. 错误：类上皮细胞是巨噬细胞在结核等肉芽肿性炎中转化形成的细胞，胞体较大、边界不清，与巨噬细胞来源有关。\n\n易混点：类上皮细胞、伤寒细胞、Aschoff细胞均属于巨噬细胞衍生或转化细胞，常出现在肉芽肿性炎中；印戒细胞是恶性肿瘤细胞的形态描述，关键特征是“黏液空泡将核挤偏”，不要与吞噬脂质形成的泡沫细胞混淆。","chapter":4,"chapterName":"炎症","chapterTitle":"第4章 炎症"},{"id":"pathology-a-single-0269","type":"single","typeLabel":"单选题","number":269,"question":"萎缩的心肌细胞内最易出现的色素是","options":[{"key":"A","text":"含铁血黄素"},{"key":"B","text":"疟色素"},{"key":"C","text":"胆色素"},{"key":"D","text":"脂褐素"},{"key":"E","text":"黑色素"}],"answerKeys":["D"],"answerText":["脂褐素"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：萎缩细胞内脂褐素沉着的机制及“褐色萎缩”的形态学表现。\n解析：心肌细胞萎缩时，胞质内自噬溶酶体消化功能减弱，脂质过氧化产物在溶酶体残余体中蓄积，形成黄褐色、颗粒状、核旁分布的脂褐素。脂褐素又称“消耗性色素”或“衰老色素”，常见于萎缩或老化的心肌细胞、肝细胞和神经元；心肌萎缩伴脂褐素沉着时肉眼呈褐色，称褐色萎缩。本题题眼是“萎缩的心肌细胞内最易出现的色素”，应选脂褐素。\n选项分析：\nA. 错误：含铁血黄素是血红蛋白分解后铁蛋白聚集形成，见于陈旧性出血、肺淤血心衰细胞、铁过载等，不是心肌萎缩的特征性色素。\nB. 错误：疟色素为疟原虫消化血红蛋白后形成的血红蛋白分解产物，主要见于疟疾时单核巨噬细胞系统，不沉积于萎缩心肌细胞。\nC. 错误：胆色素为胆红素及其氧化产物，见于胆汁淤积、肝细胞性黄疸等，主要与肝胆疾病有关，不是心肌萎缩的典型表现。\nD. 正确：心肌细胞萎缩时脂褐素在胞质内蓄积，形成黄褐色颗粒，是褐色萎缩的病理基础，符合题意。\nE. 错误：黑色素由黑色素细胞产生，见于皮肤痣、黑色素瘤、色素痣等，亦可异常沉积于某些组织，但与心肌萎缩无直接关系。\n易混点：脂褐素是萎缩/老化细胞的“消耗性色素”，常见于心肌、肝、神经元；含铁血黄素与出血和铁过载有关，呈金黄色含铁颗粒。记忆要点：萎缩心肌“褐色萎缩”对应“脂褐素”，不要与心力衰竭时肺内“含铁血黄素”混淆。","chapter":1,"chapterName":"细胞和组织的适应与损伤","chapterTitle":"第1章 细胞和组织的适应与损伤"},{"id":"pathology-a-single-0270","type":"single","typeLabel":"单选题","number":270,"question":"高血压的血管壁玻璃样变主要发生于","options":[{"key":"A","text":"细小动脉"},{"key":"B","text":"毛细血管"},{"key":"C","text":"大动脉"},{"key":"D","text":"中动脉"},{"key":"E","text":"细小静脉"}],"answerKeys":["A"],"answerText":["细小动脉"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：A\n核心考点：良性高血压时细小动脉壁发生玻璃样变性，是高血压病基本的血管病理改变之一。\n解析：长期高血压使细小动脉持续痉挛、内皮通透性增高，血浆蛋白渗入内膜下，并伴平滑肌细胞增生及细胞外基质增多，最终在管壁沉积均质、红染、无结构的玻璃样物质，导致管壁增厚、变硬、管腔狭窄。病变好发于肾入球小动脉、视网膜动脉及脾小动脉等，可引起相应器官缺血和功能受损。本题题眼是“高血压的血管壁玻璃样变”，其靶血管为细小动脉。\n\n选项分析：\nA. 正确：细小动脉是高血压玻璃样变的主要发生部位，镜下见管壁增厚、均质红染、管腔狭窄，常累及肾入球小动脉和视网膜动脉。\nB. 错误：毛细血管壁薄，主要由内皮细胞和基膜构成，高血压时不是玻璃样变的典型部位；毛细血管主要参与微循环物质交换，病变多表现为内皮损伤、通透性改变等。\nC. 错误：大动脉高血压时主要发生动脉粥样硬化或中层囊性坏死等改变，玻璃样变不是其典型病变；大动脉弹力纤维丰富，病变重点不同。\nD. 错误：中动脉高血压相关病变常与动脉粥样硬化及中膜平滑肌增生、纤维化有关，并非高血压血管壁玻璃样变的主要部位。\nE. 错误：细小静脉不是高血压玻璃样变的靶血管，静脉壁薄、压力低，高血压所致特征性改变主要见于细小动脉而非静脉。\n\n易混点：良性高血压的细小动脉玻璃样变要与急进型高血压的细小动脉纤维素样坏死、洋葱皮样增生相区别；前者为均质红染玻璃样物质沉积、管腔狭窄，后者常伴纤维素样坏死和增殖性小动脉炎。记忆要点：良性高血压——细小动脉玻璃样变；恶性高血压——纤维素样坏死和增生性小动脉硬化。","chapter":9,"chapterName":"心血管系统疾病","chapterTitle":"第9章 心血管系统疾病"},{"id":"pathology-a-single-0271","type":"single","typeLabel":"单选题","number":271,"question":"在化脓性炎中，坏死组织的液化分解是由于下列哪一类细胞的浸润所致","options":[{"key":"A","text":"巨噬细胞"},{"key":"B","text":"中性粒细胞"},{"key":"C","text":"嗜酸性粒细胞"},{"key":"D","text":"淋巴细胞"},{"key":"E","text":"浆细胞"}],"answerKeys":["B"],"answerText":["中性粒细胞"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：化脓性炎以中性粒细胞渗出为主，中性粒细胞释放蛋白酶和氧自由基使坏死组织液化，形成脓液。\n解析：化脓性炎时，大量中性粒细胞从血管内渗出到炎症灶，在吞噬病原体和坏死组织的过程中，释放弹性蛋白酶、胶原酶等蛋白水解酶及氧自由基，导致坏死组织发生液化分解。液化后的坏死组织、变性坏死的中性粒细胞（脓细胞）、渗出液和细菌等共同构成脓液。本题题眼是“化脓性炎”和“坏死组织的液化分解”，其关键效应细胞是中性粒细胞。\n选项分析：\nA. 错误：巨噬细胞是炎症中重要的吞噬细胞，参与清除病原体、坏死碎片及组织修复，也可分泌酶和细胞因子，但化脓性炎的液化分解主要由中性粒细胞介导；巨噬细胞更突出见于肉芽肿性炎、慢性炎症及组织修复过程。\nB. 正确：中性粒细胞是急性化脓性炎的主要渗出细胞，其溶酶体酶和蛋白水解酶可直接降解坏死组织，是液化性坏死和脓液形成的主要细胞学基础。\nC. 错误：嗜酸性粒细胞主要见于寄生虫感染和IgE介导的过敏反应，其颗粒含有主要碱性蛋白等，不是化脓性炎液化分解的主要细胞。\nD. 错误：淋巴细胞主要见于慢性炎症、病毒感染及免疫反应，通过细胞免疫和细胞因子参与炎症，不直接造成化脓性液化。\nE. 错误：浆细胞主要产生抗体，见于慢性炎症和体液免疫反应，不具备中性粒细胞那样直接释放大量蛋白水解酶液化坏死组织的作用。\n易混点：中性粒细胞与巨噬细胞均有吞噬和清创作用，但“化脓性炎、脓液形成、坏死组织液化”首选中性粒细胞；巨噬细胞常与慢性炎症、肉芽肿形成和组织修复联系。脓细胞本质是变性坏死的中性粒细胞，不是独立细胞类型。","chapter":4,"chapterName":"炎症","chapterTitle":"第4章 炎症"},{"id":"pathology-a-single-0272","type":"single","typeLabel":"单选题","number":272,"question":"关于结外NK/T细胞淋巴瘤的叙述，下列哪项是错误的","options":[{"key":"A","text":"瘤细胞大小不等，形态多样"},{"key":"B","text":"伴有凝固性坏死和多种炎细胞浸润"},{"key":"C","text":"肿瘤性淋巴细胞散在分布或弥漫分布"},{"key":"D","text":"是一种非霍奇金淋巴瘤"},{"key":"E","text":"好发于年轻人"}],"answerKeys":["E"],"answerText":["好发于年轻人"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n核心考点：结外NK/T细胞淋巴瘤的临床病理特点及发病年龄。\n解析：结外NK/T细胞淋巴瘤属于非霍奇金淋巴瘤，多与EB病毒（EBV）感染相关，最常见于鼻腔及鼻咽部，呈血管中心性、血管破坏性生长，易发生广泛坏死。镜下瘤细胞大小不等、形态多样，可散在或弥漫分布，并常伴凝固性坏死及多种炎细胞浸润。本题题眼在“好发年龄”：该病主要见于成人，男性多见，中位发病年龄多在40～50岁左右，并非好发于年轻人，故E错误。\n选项分析：\nA. 正确：瘤细胞大小不一、形态多样，可为小、中或较大细胞，并可见多形性，符合结外NK/T细胞淋巴瘤的细胞学特点。\nB. 正确：肿瘤常伴凝固性坏死和多种炎细胞浸润，坏死与血管中心性破坏及EBV相关细胞毒损伤有关，是常考形态学表现。\nC. 正确：肿瘤性淋巴细胞可散在分布或弥漫分布，并常围绕血管浸润，导致血管壁破坏。\nD. 正确：结外NK/T细胞淋巴瘤是成熟NK/T细胞来源的非霍奇金淋巴瘤，不是霍奇金淋巴瘤。\nE. 错误：该病主要好发于成人，尤其成年男性，中位年龄偏中年，不是“好发于年轻人”；“年轻人好发”易与淋巴母细胞淋巴瘤等混淆。\n易混点：结外NK/T细胞淋巴瘤记忆要点为“成人男性、鼻腔多见、EBV相关、血管中心性破坏、凝固性坏死伴炎细胞浸润”；淋巴母细胞淋巴瘤多见于儿童和青少年，常伴纵隔肿块，TdT阳性，二者不要混淆。","chapter":12,"chapterName":"淋巴造血系统疾病","chapterTitle":"第12章 淋巴造血系统疾病"},{"id":"pathology-a-single-0273","type":"single","typeLabel":"单选题","number":273,"question":"中晚期食管癌最常见的肉眼类型是","options":[{"key":"A","text":"髓质型"},{"key":"B","text":"缩窄型"},{"key":"C","text":"溃疡型"},{"key":"D","text":"蕈伞型"},{"key":"E","text":"隆起型"}],"answerKeys":["C"],"answerText":["溃疡型"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：中晚期食管癌的肉眼分型及常见类型。\n解析：中晚期食管癌可呈髓质型、蕈伞型、溃疡型、缩窄型等肉眼形态。溃疡型者癌组织坏死脱落后形成较深溃疡，溃疡边缘可隆起、底部不平，常侵及肌层甚至更深，临床上可出现吞咽困难、胸骨后疼痛，并可并发出血或穿孔。本题题眼是“中晚期食管癌最常见的肉眼类型”，按题干所给标准答案应选溃疡型。\n\n选项分析：\nA. 错误：髓质型表现为癌组织在食管壁内浸润生长，管壁增厚、切面灰白质硬，可致管腔狭窄；但本题标准答案为溃疡型，故不选。\nB. 错误：缩窄型以癌组织环形浸润、纤维组织增生导致管腔明显狭窄为特点，吞咽困难出现较早，但并非本题考查的常见肉眼类型。\nC. 正确：溃疡型以癌组织坏死脱落形成溃疡为特征，溃疡可较深、边缘隆起，符合中晚期食管癌肉眼改变；按标准答案选C。\nD. 错误：蕈伞型表现为癌组织向管腔内呈蘑菇状或息肉状突起，表面可伴坏死，但并非本题标准答案所指类型。\nE. 错误：隆起型不是中晚期食管癌规范的四大肉眼分型之一，不能替代溃疡型作答。\n\n易混点：食管癌肉眼分型要与早期癌概念区分：早期食管癌多局限于黏膜或黏膜下层，肉眼可无明显肿块；中晚期癌才有明显肿块、溃疡或管腔狭窄。答题时注意题干限定“中晚期”“肉眼类型”“最常见”，按本题标准答案掌握为溃疡型。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-a-single-0274","type":"single","typeLabel":"单选题","number":274,"question":"重度慢性乙型病毒性肝炎时，肝细胞质出现毛玻璃样改变的原因是","options":[{"key":"A","text":"粗面内质网内有大量HBsAg"},{"key":"B","text":"滑面内质网内有大量HBsAg"},{"key":"C","text":"线粒体肿胀"},{"key":"D","text":"胞质内细胞器的变性"},{"key":"E","text":"肝细胞水肿"}],"answerKeys":["B"],"answerText":["滑面内质网内有大量HBsAg"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n\n核心考点：乙型病毒性肝炎肝细胞毛玻璃样改变的超微结构基础为滑面内质网内大量HBsAg蓄积。\n\n解析：毛玻璃样肝细胞在光镜下表现为肝细胞胞质内充满嗜酸性、细颗粒状物质，使胞质呈半透明毛玻璃样；电镜下该物质位于增生的滑面内质网内，主要成分为乙型肝炎表面抗原（HBsAg）。这是慢性乙型肝炎、尤其是HBsAg携带者和慢性肝炎的典型形态学表现之一，题眼是“毛玻璃样改变”与“滑面内质网内HBsAg”的对应关系。\n\n选项分析：\nA. 错误：粗面内质网主要参与蛋白质合成和转运，HBsAg大量蓄积并形成毛玻璃样改变的主要部位不是粗面内质网。\nB. 正确：滑面内质网增生并蓄积大量HBsAg，形成光镜下毛玻璃样肝细胞，是本题标准答案。\nC. 错误：线粒体肿胀属于细胞损伤的可逆性改变，可见于缺氧、中毒等，不形成乙型肝炎毛玻璃样肝细胞的典型结构。\nD. 错误：胞质内细胞器变性是广义的细胞损伤表现，不能特异地说明毛玻璃样改变由HBsAg在滑面内质网内蓄积所致。\nE. 错误：肝细胞水肿表现为胞质疏松、淡染、气球样变，属于水变性，与毛玻璃样肝细胞中HBsAg蓄积的形态和机制不同。\n\n易混点：毛玻璃样肝细胞要与肝细胞水肿所致的气球样变区分：前者胞质呈嗜酸性细颗粒状、半透明，电镜下为滑面内质网内HBsAg；后者胞质疏松淡染，为水变性。记忆要点是“毛玻璃—滑面内质网—HBsAg”。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-a-single-0275","type":"single","typeLabel":"单选题","number":275,"question":"大叶性肺炎的病变表现描述中错误的是","options":[{"key":"A","text":"肺脏层胸膜充血、水肿伴纤维素渗出"},{"key":"B","text":"病灶的病变特点是以细支气管为中心的化脓性炎"},{"key":"C","text":"炎症不破坏肺泡壁结构"},{"key":"D","text":"病变多累及一个大叶或一肺段"},{"key":"E","text":"炎症以纤维素渗出为主"}],"answerKeys":["B"],"answerText":["病灶的病变特点是以细支气管为中心的化脓性炎"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：大叶性肺炎为肺泡内弥漫性纤维素性渗出性炎，而“以细支气管为中心的化脓性炎”是小叶性肺炎（支气管肺炎）的特点。\n解析：大叶性肺炎的典型病变是肺泡腔内大量纤维素和中性粒细胞渗出，并通过肺泡间孔迅速蔓延，使一个肺大叶或肺段发生实变；炎症一般不破坏肺泡壁结构，消散后肺组织可恢复正常。题干问“错误的是”，B将小叶性肺炎的病变特点误用于大叶性肺炎，是本题题眼。\n\n选项分析：\nA. 正确：大叶性肺炎常累及胸膜，引起纤维素性胸膜炎，表现为脏层胸膜充血、水肿并有纤维素渗出，临床可有胸痛和胸膜摩擦音。\nB. 错误：以细支气管为中心的化脓性炎是小叶性肺炎（支气管肺炎）的典型特点，常形成以细支气管为中心的化脓性病灶；大叶性肺炎是以肺泡内纤维素性渗出为主的弥漫性炎症。\nC. 正确：大叶性肺炎属于渗出性炎，肺泡壁结构通常不被破坏，炎症消散后肺泡通气功能可恢复；若发生肺脓肿、脓胸等并发症则属并发症改变。\nD. 正确：大叶性肺炎典型累及一个大叶或一个肺段，也可累及多个肺叶，但“多累及一个大叶或一肺段”符合其大体分布特点。\nE. 正确：大叶性肺炎的本质是纤维素性炎，红色肝样变期和灰色肝样变期肺泡腔内均可见大量纤维素渗出，并伴红细胞或中性粒细胞等成分。\n\n易混点：大叶性肺炎与小叶性肺炎的核心区别是：大叶性肺炎为肺泡内弥漫性纤维素性炎，肺泡壁完整，实变累及大叶或肺段；小叶性肺炎为以细支气管为中心的化脓性炎，可破坏肺泡壁并融合成片。记忆要点：大叶“纤维素、肺泡壁完整”，小叶“细支气管中心、化脓”。","chapter":10,"chapterName":"呼吸系统疾病","chapterTitle":"第10章 呼吸系统疾病"},{"id":"pathology-a-single-0276","type":"single","typeLabel":"单选题","number":276,"question":"肺癌切除后，残余肺组织过度充气称为","options":[{"key":"A","text":"全腺泡型肺气肿"},{"key":"B","text":"腺泡中央型肺气肿"},{"key":"C","text":"腺泡周围型肺气肿"},{"key":"D","text":"瘢痕旁肺气肿"},{"key":"E","text":"代偿性肺气肿"}],"answerKeys":["E"],"answerText":["代偿性肺气肿"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n核心考点：代偿性肺气肿是肺组织切除或功能丧失后，残余肺组织代偿性过度充气、肺泡扩张所形成的病变。\n解析：肺癌行肺叶或全肺切除后，有效呼吸面积减少，残余肺组织通过代偿性通气增强而过度充气，肺泡腔扩张，即为代偿性肺气肿。其题眼是“肺癌切除后残余肺组织过度充气”，强调继发于肺组织缺失的代偿反应，而非吸烟、α1-抗胰蛋白酶缺乏或纤维瘢痕所致的肺泡壁破坏性肺气肿。\n\n选项分析：\nA. 错误：全腺泡型肺气肿主要与α1-抗胰蛋白酶缺乏有关，病变累及呼吸性细支气管、肺泡管、肺泡囊和肺泡，常位于肺下叶，不是肺切除后的残余肺过度充气。\nB. 错误：腺泡中央型肺气肿最常见于长期吸烟者，主要累及呼吸性细支气管，常位于肺上叶，属于破坏性肺气肿，不符合本题机制。\nC. 错误：腺泡周围型肺气肿又称间隔旁肺气肿，主要累及肺小叶周边、胸膜下区域，易并发自发性气胸，与肺切除后代偿性充气无关。\nD. 错误：瘢痕旁肺气肿又称不规则型肺气肿，发生于肺纤维化瘢痕周围，肺泡壁破坏并扩张，常见于尘肺、慢性纤维空洞型肺结核等，不是残余肺代偿性过度充气。\nE. 正确：肺切除后余肺组织因功能代偿而过度充气、肺泡扩张，符合代偿性肺气肿的定义和发生机制。\n\n易混点：代偿性肺气肿强调“肺组织减少后余肺过度充气”，肺泡壁通常无明显破坏；瘢痕旁肺气肿强调“纤维瘢痕周围肺泡破坏扩张”；全腺泡型、腺泡中央型、腺泡周围型则按病变累及肺腺泡的部位命名。记忆要点：切除后余肺过度充气选代偿性肺气肿。","chapter":10,"chapterName":"呼吸系统疾病","chapterTitle":"第10章 呼吸系统疾病"},{"id":"pathology-a-single-0277","type":"single","typeLabel":"单选题","number":277,"question":"流行性脑脊髓膜炎最常见的病原菌是","options":[{"key":"A","text":"肺炎球菌"},{"key":"B","text":"脑膜炎球菌"},{"key":"C","text":"金黄色葡萄球菌"},{"key":"D","text":"溶血性链球菌"},{"key":"E","text":"大肠杆菌"}],"answerKeys":["B"],"answerText":["脑膜炎球菌"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：流行性脑脊髓膜炎（流脑）是由脑膜炎奈瑟菌（脑膜炎球菌）引起的急性化脓性炎症。\n解析：脑膜炎球菌为革兰阴性双球菌，主要经呼吸道飞沫传播，好发于冬春季和儿童。病原菌侵入血流形成菌血症，继而累及软脑膜和蛛网膜下腔，引起化脓性炎症；典型病理表现为软脑膜充血、水肿及蛛网膜下腔大量中性粒细胞渗出，脑脊液呈脓性、压力升高、蛋白增多、糖降低。题眼是“流行性脑脊髓膜炎”这一特定传染病，其病原体即为脑膜炎球菌，而不是泛指所有化脓性脑膜炎的常见病原。\n选项分析：\nA. 错误：肺炎球菌即肺炎链球菌，可引起肺炎链球菌性脑膜炎，常继发于肺炎、中耳炎等，但不是“流行性脑脊髓膜炎”的病原菌。\nB. 正确：脑膜炎球菌即脑膜炎奈瑟菌，是流脑的病原体，革兰阴性双球菌，常寄生于鼻咽部，经飞沫传播后引起菌血症和化脓性脑脊髓膜炎。\nC. 错误：金黄色葡萄球菌可引起化脓性脑膜炎，但多继发于败血症、颅脑外伤、手术后或脑脓肿破溃，不是流脑的病原菌。\nD. 错误：溶血性链球菌主要与咽炎、丹毒、蜂窝织炎、风湿热等相关，偶可引起脑膜炎，但不是流行性脑脊髓膜炎的病原体。\nE. 错误：大肠埃希菌是新生儿化脓性脑膜炎的重要病原之一，常见于围生期感染或革兰阴性杆菌败血症，不是流脑的病原菌。\n易混点：要区分“流行性脑脊髓膜炎”与“化脓性脑膜炎总体”。流脑特指脑膜炎球菌所致；而新生儿化脓性脑膜炎以大肠埃希菌、B族链球菌较常见，儿童和成人还可由肺炎链球菌、金黄色葡萄球菌等引起。记忆要点：流脑=脑膜炎球菌；病理部位在软脑膜及蛛网膜下腔，脑实质损害相对轻。","chapter":16,"chapterName":"神经系统疾病","chapterTitle":"第16章 神经系统疾病"},{"id":"pathology-a-single-0278","type":"single","typeLabel":"单选题","number":278,"question":"大叶性肺炎的病理变化，除外","options":[{"key":"A","text":"肺组织大面积广泛实变"},{"key":"B","text":"肺泡性炎"},{"key":"C","text":"以纤维素渗出为主"},{"key":"D","text":"可合并肺肉质变"},{"key":"E","text":"常有肺泡壁结构破坏"}],"answerKeys":["E"],"answerText":["常有肺泡壁结构破坏"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n核心考点：大叶性肺炎是肺泡内的纤维素性炎，肺泡壁结构通常完整、不被破坏。\n解析：大叶性肺炎多由肺炎链球菌引起，病变累及肺段或整个肺大叶，表现为肺泡腔内大量纤维素性渗出和肺组织大片实变，故属于肺泡性炎而非间质性炎。典型病程为充血水肿期、红色肝样变期、灰色肝样变期和溶解消散期，渗出物可溶解吸收，肺泡壁支架通常保留，肺组织可恢复正常。少数因中性粒细胞渗出不足、纤维素不能完全溶解吸收而发生机化，形成肺肉质变。本题题眼是“除外”，即找出不属于大叶性肺炎的病理特点；肺泡壁结构破坏不是其常有表现。\n选项分析：\nA. 正确：大叶性肺炎可累及一个肺段乃至整个肺大叶，肉眼见肺组织大片实变，故“大面积广泛实变”符合。\nB. 正确：炎症主要发生在肺泡腔内，并经肺泡孔蔓延，属于肺泡性炎，而不是以支气管或肺间质为中心的炎症。\nC. 正确：大叶性肺炎的典型渗出物为大量纤维素，伴红细胞、中性粒细胞等，红色和灰色肝样变期均以纤维素渗出为重要特征。\nD. 正确：若渗出物中的纤维素不能完全溶解吸收，可被肉芽组织机化，使肺组织呈灰白色纤维化样外观，称肺肉质变。\nE. 错误：大叶性肺炎时肺泡壁毛细血管受压、肺泡腔充满渗出物，但肺泡壁结构通常完整，一般不发生明显破坏；肺泡壁破坏更见于支气管肺炎等化脓性炎。故E为本题应除外项。\n易混点：大叶性肺炎与支气管肺炎的关键区别是前者为肺泡性纤维素性炎、肺泡壁支架保留；后者以细支气管为中心呈化脓性炎，可破坏细支气管及肺泡壁。记忆要点：大叶性肺炎“腔内有渗出、壁多完整”，支气管肺炎“细支气管为中心、壁可破坏”。","chapter":10,"chapterName":"呼吸系统疾病","chapterTitle":"第10章 呼吸系统疾病"},{"id":"pathology-a-single-0279","type":"single","typeLabel":"单选题","number":279,"question":"病毒性肝炎时最常见的肝细胞坏死是","options":[{"key":"A","text":"嗜酸性坏死"},{"key":"B","text":"点状坏死"},{"key":"C","text":"溶解性坏死"},{"key":"D","text":"碎片状坏死"},{"key":"E","text":"桥接坏死"}],"answerKeys":["C"],"answerText":["溶解性坏死"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：病毒性肝炎时肝细胞坏死的常见形态学类型为溶解性坏死。\n解析：病毒性肝炎时，肝细胞受损后发生细胞水肿，进而细胞膜完整性破坏、细胞器崩解，最终形成溶解性坏死，这是病毒性肝炎中最常见的肝细胞坏死类型。其形态学基础是细胞由气球样变进一步发展而来，镜下见坏死肝细胞体积增大、胞质淡染、核固缩或消失，最终细胞溶解。本题题眼是“最常见的肝细胞坏死”，应选坏死细胞形态学类型，而不是点状、碎片状、桥接状等坏死分布方式。\n选项分析：\nA. 错误：嗜酸性坏死属于细胞凋亡的特殊表现，坏死细胞胞质浓缩红染，可形成嗜酸性小体，多见于病毒性肝炎等，但并非最常见坏死类型。\nB. 错误：点状坏死指单个或数个肝细胞坏死并伴炎细胞浸润，常见于急性普通型病毒性肝炎，是坏死灶范围/分布的描述，不是本题所问最常见的坏死形态类型。\nC. 正确：溶解性坏死由肝细胞严重水肿、气球样变发展而来，是病毒性肝炎最常见肝细胞坏死，符合标准答案。\nD. 错误：碎片状坏死又称界面炎，指肝小叶周边界板肝细胞呈灶状坏死、炎细胞浸润，常见于慢性肝炎，不是最常见坏死类型。\nE. 错误：桥接坏死指坏死带连接中央静脉与汇管区或连接两个汇管区，常见于中重度慢性肝炎，提示病变较重，并非最常见类型。\n易混点：点状坏死、碎片状坏死、桥接坏死主要描述坏死灶的分布和范围；溶解性坏死、嗜酸性坏死描述坏死细胞的形态学改变。记忆要点：病毒性肝炎最常见坏死形态是溶解性坏死，最常见坏死灶之一是点状坏死，慢性肝炎界面炎为碎片状坏死。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-a-single-0280","type":"single","typeLabel":"单选题","number":280,"question":"高分化的恶性肿瘤的主要特征是","options":[{"key":"A","text":"细胞形态和组织结构与起源组织相似"},{"key":"B","text":"不向周围组织直接蔓延"},{"key":"C","text":"不发生转移"},{"key":"D","text":"手术切除后一般不复发"},{"key":"E","text":"对机体危害程度较轻"}],"answerKeys":["A"],"answerText":["细胞形态和组织结构与起源组织相似"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：A\n核心考点：肿瘤分化程度指肿瘤细胞与起源组织在形态和功能上的相似程度，高分化恶性肿瘤仍具有恶性生物学行为。\n解析：高分化恶性肿瘤的瘤细胞形态、排列和组织结构与其起源组织较相似，异型性较小，核分裂象相对少，因此常被误认为“接近良性”。但它的本质仍是恶性肿瘤，可呈浸润性生长，并具有转移和复发潜能。本题题眼是“高分化”描述的是分化程度，而不是良恶性；恶性与否取决于浸润、转移等生物学行为。\n选项分析：\nA. 正确：高分化即肿瘤细胞和组织结构接近起源组织，异型性小，是高分化的核心形态学特征。\nB. 错误：恶性肿瘤具有浸润性生长，可直接蔓延至周围组织；高分化并不改变这一恶性生物学行为。\nC. 错误：恶性肿瘤可发生转移，高分化仅表示分化程度较高、恶性程度相对较低，并不等于不发生转移。\nD. 错误：恶性肿瘤手术切除后仍可能复发，高分化不能保证不复发；复发与浸润范围、切缘、分期等有关。\nE. 错误：恶性肿瘤对机体均有危害，高分化者恶性程度可能较低，但不能把“危害较轻”作为高分化恶性肿瘤的主要特征。\n易混点：高分化和良性肿瘤都表现为异型性小、与起源组织相似，但良性肿瘤不浸润、不转移；高分化恶性肿瘤仍可浸润、转移和复发。记忆要点：分化看“像不像”，良恶性看“侵不侵、转不转”。","chapter":6,"chapterName":"肿瘤","chapterTitle":"第6章 肿瘤"},{"id":"pathology-a-single-0281","type":"single","typeLabel":"单选题","number":281,"question":"急性病毒性肝炎时，最常见的炎症细胞是","options":[{"key":"A","text":"中性粒细胞"},{"key":"B","text":"嗜酸性粒细胞"},{"key":"C","text":"单核细胞"},{"key":"D","text":"淋巴细胞"},{"key":"E","text":"浆细胞"}],"answerKeys":["D"],"answerText":["淋巴细胞"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：急性病毒性肝炎时肝组织炎症浸润以淋巴细胞为主。\n解析：急性病毒性肝炎由肝炎病毒感染引起，肝细胞发生水肿、嗜酸性变及点状坏死等改变，同时汇管区和肝小叶内出现炎症细胞浸润，其中以淋巴细胞最为常见。淋巴细胞浸润反映机体针对病毒抗原的细胞免疫和体液免疫反应，是病毒性肝炎区别于化脓性炎的重要形态学特点。本题题眼是“急性病毒性肝炎”与“最常见炎症细胞”，应选淋巴细胞。\n选项分析：\nA. 错误：中性粒细胞主要见于急性化脓性炎，如细菌性肝脓肿；急性病毒性肝炎虽可有少量中性粒细胞，但不是最常见炎症细胞。\nB. 错误：嗜酸性粒细胞多见于寄生虫感染、过敏反应及某些药物性肝损伤，不是急性病毒性肝炎的主要浸润细胞。\nC. 错误：单核细胞可参与病毒性肝炎的炎症反应，并可分化为巨噬细胞，但急性病毒性肝炎最常见、最具代表性的浸润细胞是淋巴细胞。\nD. 正确：急性病毒性肝炎时汇管区及肝小叶内炎症浸润以淋巴细胞为主，常伴肝细胞变性、坏死，符合病毒感染所致免疫性损伤特点。\nE. 错误：浆细胞多见于慢性肝炎、自身免疫性肝炎等，产生抗体参与慢性炎症；急性病毒性肝炎虽可有少量浆细胞，但不是最常见细胞。\n易混点：急性病毒性肝炎以淋巴细胞浸润为主；慢性肝炎汇管区可见淋巴细胞、浆细胞浸润及纤维化；化脓性肝炎或肝脓肿则以中性粒细胞为主。记忆要点是“病毒感染看淋巴细胞，细菌化脓看中性粒细胞”。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-a-single-0282","type":"single","typeLabel":"单选题","number":282,"question":"在结核病的基本病变以增生为主时，常形成","options":[{"key":"A","text":"增生性息肉"},{"key":"B","text":"结核性肉芽肿"},{"key":"C","text":"结核球"},{"key":"D","text":"假结核结节"},{"key":"E","text":"炎性假瘤"}],"answerKeys":["B"],"answerText":["结核性肉芽肿"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：结核病以增生为主的基本病变是结核性肉芽肿，即结核结节。\n解析：结核病的基本病变包括渗出、增生和坏死，当机体抵抗力较强、菌量较少时以增生为主，形成结核性肉芽肿。镜下典型结构为中央可有干酪样坏死，周围为上皮样细胞、朗汉斯巨细胞，外周为淋巴细胞和纤维母细胞。题干题眼是“基本病变以增生为主”，对应结核结节而非结核球等继发性肺结核的形态。\n选项分析：\nA. 错误：增生性息肉属于黏膜上皮及间质增生形成的息肉样病变，见于胃肠道等，不是结核病的特征性病变。\nB. 正确：结核性肉芽肿即结核结节，是结核病增生性病变的代表，由上皮样细胞、朗汉斯巨细胞、淋巴细胞等构成，中央可伴干酪样坏死。\nC. 错误：结核球是继发性肺结核的一种类型，主要由干酪样坏死灶被纤维组织包裹形成，属于坏死及包裹性病变，不是“以增生为主”的基本病变。\nD. 错误：假结核结节见于血吸虫病，是血吸虫虫卵引起的肉芽肿性病变，虽名称相似，但病原和结构均不同于结核结节。\nE. 错误：炎性假瘤是慢性炎症伴纤维组织增生形成的瘤样肿块，可发生于肺等部位，但不是结核病的增生性基本病变。\n易混点：结核结节与假结核结节名称相近，前者见于结核病，后者见于血吸虫病；结核球虽含“结核”二字，但本质是干酪样坏死灶被纤维包裹，不是增生为主形成的结核性肉芽肿。记忆要点：结核基本病变“增生为主→结核结节（结核性肉芽肿）”。","chapter":18,"chapterName":"传染病","chapterTitle":"第18章 传染病"},{"id":"pathology-a-single-0283","type":"single","typeLabel":"单选题","number":283,"question":"肉芽组织中一般没有","options":[{"key":"A","text":"单核巨噬细胞"},{"key":"B","text":"中性粒细胞"},{"key":"C","text":"神经纤维"},{"key":"D","text":"胶原纤维"},{"key":"E","text":"外源性异物"}],"answerKeys":["C"],"answerText":["神经纤维"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：肉芽组织的组成及形态学特点，重点掌握肉芽组织一般不含神经纤维。\n解析：肉芽组织由新生毛细血管、成纤维细胞及炎细胞构成，炎细胞以巨噬细胞、中性粒细胞和淋巴细胞等为主。成纤维细胞可产生胶原纤维，故肉芽组织中可见胶原纤维；若有异物存留，也可出现外源性异物及异物性肉芽组织反应。肉芽组织本身一般没有神经纤维，因此临床触之不痛、易出血，这是本题题眼。\n\n选项分析：\nA. 错误：肉芽组织中常有单核巨噬细胞，属于重要炎细胞成分，参与吞噬坏死物和异物、清除局部刺激及修复调控，并非“一般没有”。\nB. 错误：肉芽组织早期常有中性粒细胞浸润，尤其伴感染或坏死时更明显，故中性粒细胞可以存在。\nC. 正确：肉芽组织由新生毛细血管、成纤维细胞和炎细胞组成，一般不含神经纤维；神经纤维不是肉芽组织的固有成分。\nD. 错误：肉芽组织中可见胶原纤维，后期成纤维细胞产生胶原并使肉芽组织逐渐纤维化、转变为瘢痕组织。\nE. 错误：外源性异物不是肉芽组织的固有成分，但当局部有异物存留时可存在，并可诱导异物性肉芽组织或异物肉芽肿形成，故不能选“一般没有”。\n\n易混点：肉芽组织与肉芽肿不同。肉芽组织是新生毛细血管、成纤维细胞和炎细胞构成的修复性组织，无神经纤维，触之不痛、易出血；肉芽肿是巨噬细胞及其衍生细胞局限性增生形成的结节状病变，常伴多核巨细胞。记忆要点：肉芽组织“毛细血管多、成纤维细胞多、炎细胞多，神经无”。","chapter":2,"chapterName":"损伤的修复","chapterTitle":"第2章 损伤的修复"},{"id":"pathology-a-single-0284","type":"single","typeLabel":"单选题","number":284,"question":"卵巢肿瘤中最常见的是","options":[{"key":"A","text":"浆液性肿瘤"},{"key":"B","text":"黏液性肿瘤"},{"key":"C","text":"生殖细胞肿瘤"},{"key":"D","text":"性索间质肿瘤"},{"key":"E","text":"转移性肿瘤"}],"answerKeys":["A"],"answerText":["浆液性肿瘤"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：A\n核心考点：卵巢肿瘤中最常见的组织学类型是浆液性肿瘤，属于卵巢上皮性肿瘤。\n解析：卵巢肿瘤按组织发生主要分为上皮性肿瘤、生殖细胞肿瘤、性索间质肿瘤和转移性肿瘤，其中上皮性肿瘤最常见，而浆液性肿瘤又是上皮性肿瘤中最常见的类型。浆液性肿瘤起源于卵巢表面上皮及间质，向输卵管上皮分化，可呈囊性、乳头状生长，良恶性谱系包括浆液性囊腺瘤、交界性浆液性肿瘤和浆液性癌。题眼是“卵巢肿瘤中最常见”，应选浆液性肿瘤，而不是仅指卵巢恶性肿瘤或某一特殊年龄组。\n\n选项分析：\nA. 正确：浆液性肿瘤是卵巢肿瘤中最常见的类型，也是卵巢上皮性肿瘤中最常见者，可伴囊内乳头和砂粒体，恶性者即浆液性癌。\nB. 错误：黏液性肿瘤也属卵巢上皮性肿瘤，但发生率低于浆液性肿瘤；其上皮类似宫颈管或肠黏膜黏液上皮，囊内充满黏液。\nC. 错误：生殖细胞肿瘤在儿童和青少年卵巢肿瘤中相对常见，但整体发生率不及上皮性肿瘤，更不是所有卵巢肿瘤中最常见。\nD. 错误：性索间质肿瘤较少见，可分泌性激素并引起内分泌症状，如颗粒细胞瘤产生雌激素，但并非最常见。\nE. 错误：转移性肿瘤属于卵巢继发性肿瘤，常见者为Krukenberg瘤（胃印戒细胞癌转移至卵巢），总体发生率远低于原发性浆液性肿瘤。\n\n易混点：记忆要点是“卵巢肿瘤总体最常见为浆液性肿瘤，卵巢恶性肿瘤中最常见也为浆液性癌”；而“儿童/青少年卵巢肿瘤最常见为生殖细胞肿瘤”。Krukenberg瘤为双侧卵巢转移性印戒细胞癌，不要与原发性卵巢黏液性肿瘤混淆。","chapter":14,"chapterName":"生殖系统和乳腺疾病","chapterTitle":"第14章 生殖系统和乳腺疾病"},{"id":"pathology-a-single-0285","type":"single","typeLabel":"单选题","number":285,"question":"动脉粥样硬化主要累及","options":[{"key":"A","text":"大、中动脉内膜"},{"key":"B","text":"大、中动脉中膜"},{"key":"C","text":"细小动脉中膜"},{"key":"D","text":"细小动脉的内膜"},{"key":"E","text":"细小动脉壁"}],"answerKeys":["A"],"answerText":["大、中动脉内膜"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：A\n核心考点：动脉粥样硬化主要累及大、中动脉的内膜，形成以脂质沉积和纤维斑块为特征的病变。\n解析：动脉粥样硬化的基本病变发生在大、中动脉内膜，尤其是腹主动脉后壁及其分支开口处，以及冠状动脉、脑底动脉、肾动脉和下肢动脉等。其机制是内皮损伤后脂质进入内膜，单核细胞来源的巨噬细胞吞噬脂质形成泡沫细胞，继而形成脂纹、纤维斑块和粥样斑块，并可发生斑块内出血、破裂、血栓形成和钙化。本题题眼是“主要累及”的部位和层次，即大、中动脉内膜，而不是中膜或细小动脉。\n选项分析：\nA. 正确：大、中动脉内膜是动脉粥样硬化的主要受累部位，病变包括脂纹、纤维斑块、粥样斑块及复合病变，可引起管腔狭窄甚至血栓形成。\nB. 错误：大、中动脉中膜不是动脉粥样硬化的主要部位；中膜病变见于梅毒性主动脉炎（中膜滋养血管周围炎症、中层囊性坏死）或动脉中层钙化等，不能与粥样硬化混同。\nC. 错误：细小动脉中膜不是动脉粥样硬化的典型部位；高血压时小动脉可发生中膜平滑肌增生肥大和纤维化，属于小动脉硬化，而非粥样硬化。\nD. 错误：细小动脉内膜并非动脉粥样硬化的主要部位；良性高血压时细动脉可发生玻璃样变，血浆蛋白渗入内膜下使管壁均质红染，但这不是大、中动脉粥样斑块。\nE. 错误：细小动脉壁受累主要见于高血压相关的细动脉硬化和小动脉硬化，可引起管壁增厚、管腔狭窄，但其病变性质和好发血管均不同于动脉粥样硬化。\n易混点：动脉粥样硬化属于动脉硬化的一种，但特指大、中动脉内膜的脂质斑块；高血压主要引起细小动脉硬化，表现为细动脉玻璃样变和小动脉纤维化；动脉中层钙化则主要累及中膜。记忆要点是“粥样硬化看大中动脉内膜，高血压看细小动脉壁”。","chapter":9,"chapterName":"心血管系统疾病","chapterTitle":"第9章 心血管系统疾病"},{"id":"pathology-a-single-0286","type":"single","typeLabel":"单选题","number":286,"question":"有关原发性高血压的叙述，下列错误的是","options":[{"key":"A","text":"高血压病常引起左心室肥大"},{"key":"B","text":"高血压常引起下肢坏疽"},{"key":"C","text":"高血压可继发糖尿病"},{"key":"D","text":"高血压晚期的肾脏常为颗粒性固缩肾"},{"key":"E","text":"脑出血是高血压病的主要致死原因"}],"answerKeys":["C"],"answerText":["高血压可继发糖尿病"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：原发性高血压的靶器官并发症及高血压与糖代谢异常的关系。\n解析：原发性高血压主要引起全身细动脉玻璃样变和小动脉硬化，导致心、脑、肾、视网膜等靶器官损害。典型表现包括左心室向心性肥大、原发性颗粒性固缩肾和脑出血，其中脑出血是重要致死原因。高血压不会“继发”糖尿病；二者常在肥胖、代谢综合征背景下并存，糖尿病由胰岛素分泌不足或胰岛素抵抗所致，本题题眼是“继发”造成因果倒置。\n\n选项分析：\nA. 正确：长期外周阻力增加使左心室后负荷加重，心肌细胞代偿性肥大，形成向心性肥大，晚期可失代偿扩张。\nB. 正确：长期高血压可促进下肢动脉粥样硬化、管腔狭窄，严重供血不足时可发生缺血性坏疽；但典型高血压靶器官损害仍以心、脑、肾、视网膜为主。\nC. 错误：高血压不是糖尿病的病因，不能称为高血压继发糖尿病；糖尿病是胰岛素分泌绝对或相对不足及胰岛素抵抗所致，高血压与糖尿病常作为代谢综合征成分共存。\nD. 正确：良性高血压晚期因入球小动脉玻璃样变、肾小球缺血性硬化，双肾对称缩小、表面呈细颗粒状，形成原发性颗粒性固缩肾。\nE. 正确：脑出血是高血压病最严重且常见的致死性并发症，好发于基底节、内囊，常与豆纹动脉破裂有关。\n\n易混点：高血压性颗粒性固缩肾表面颗粒细小均匀，慢性肾小球肾炎所致颗粒性固缩肾由大量肾小球硬化引起；左心室肥大是对压力负荷的向心性肥大，不等同于扩张型心肌病。下肢坏疽更常见于糖尿病足、动脉粥样硬化闭塞症和血栓闭塞性脉管炎，复习时注意病因与典型靶器官的对应。","chapter":9,"chapterName":"心血管系统疾病","chapterTitle":"第9章 心血管系统疾病"},{"id":"pathology-a-single-0287","type":"single","typeLabel":"单选题","number":287,"question":"慢性风湿性瓣膜病常见的联合瓣膜病变是","options":[{"key":"A","text":"二尖瓣和三尖瓣"},{"key":"B","text":"二尖瓣、主动脉瓣和三尖瓣"},{"key":"C","text":"主动脉瓣和三尖瓣"},{"key":"D","text":"二尖瓣和主动脉瓣"},{"key":"E","text":"主动脉瓣和肺动脉瓣"}],"answerKeys":["D"],"answerText":["二尖瓣和主动脉瓣"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：慢性风湿性瓣膜病最常见的联合瓣膜病变为二尖瓣与主动脉瓣同时受累。\n解析：风湿性心内膜炎反复发作后，瓣膜发生增厚、变硬、粘连、短缩及腱索融合，形成慢性瓣膜病。风湿性瓣膜病最常累及二尖瓣，其次为主动脉瓣，因此常见联合病变是二尖瓣和主动脉瓣。题眼是“慢性风湿性瓣膜病”和“常见联合瓣膜病变”，应与三尖瓣、肺动脉瓣受累少见相区别。\n选项分析：\nA. 错误：二尖瓣最常受累，但三尖瓣风湿性器质性病变少见；三尖瓣关闭不全更多见于右心衰竭引起的相对性关闭不全，不是常见联合风湿性瓣膜病变。\nB. 错误：二尖瓣和主动脉瓣受累常见，但三尖瓣风湿性病变少见，故“二尖瓣、主动脉瓣和三尖瓣”不是常见联合病变。\nC. 错误：遗漏了最常受累的二尖瓣；主动脉瓣可受累，但三尖瓣风湿性器质病变少见，不能作为常见联合组合。\nD. 正确：二尖瓣最常受累，主动脉瓣次之，二者联合受累是慢性风湿性瓣膜病最常见的联合瓣膜病变。\nE. 错误：肺动脉瓣极少发生风湿性瓣膜病变；肺动脉瓣病变更多见于先天性心脏病、类癌综合征等，不符合本题。\n易混点：记忆要点为“风湿性瓣膜病：二尖瓣最多，主动脉瓣次之，联合以二尖瓣+主动脉瓣常见；三尖瓣和肺动脉瓣少见”。三尖瓣关闭不全常继发于左心衰、肺动脉高压引起的右心室扩大，属于相对性关闭不全，不要误认为风湿性联合瓣膜病。","chapter":9,"chapterName":"心血管系统疾病","chapterTitle":"第9章 心血管系统疾病"},{"id":"pathology-a-single-0288","type":"single","typeLabel":"单选题","number
