淋巴结，晚于肺内原发灶。\nD. 正确：初次感染时细菌首先在肺泡局部引起渗出性炎和干酪样坏死，形成原发灶，这是最早出现的肺内病变。\nE. 错误：肺门淋巴结结核是原发综合征的组成部分，发生于原发灶形成并经淋巴管播散之后，不是最早肺内病变。\n\n易混点：原发灶是肺内最早病变；原发综合征是“原发灶＋淋巴管炎＋肺门淋巴结结核”的三联征，影像上可呈哑铃状。记忆要点：先有肺内原发灶，后有原发综合征；原发灶以渗出和坏死为早期表现。","chapter":18,"chapterName":"传染病","chapterTitle":"第18章 传染病"},{"id":"pathology-2a-single-0136","type":"single","typeLabel":"单选题","number":136,"question":"门脉性肝硬化最严重的合并症是","options":[{"key":"A","text":"蜘蛛痣"},{"key":"B","text":"睾丸萎缩"},{"key":"C","text":"痔静脉曲张"},{"key":"D","text":"腹水"},{"key":"E","text":"肝性脑病"}],"answerKeys":["E"],"answerText":["肝性脑病"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n核心考点：门脉性肝硬化失代偿期最严重、最常见的死亡原因之一是肝性脑病。\n解析：门脉性肝硬化时，肝细胞广泛变性坏死、纤维组织增生及假小叶形成，导致肝功能减退和门脉高压。肝功能严重障碍时，氨等毒性代谢产物不能被肝充分解毒，或经侧支循环绕过肝进入体循环，作用于中枢神经系统，引起肝性脑病，表现为意识障碍、行为异常、扑翼样震颤甚至昏迷。本题题眼是“最严重的合并症”，肝性脑病直接反映肝功能衰竭并危及生命，故为正确答案。\n选项分析：\nA. 错误：蜘蛛痣属于肝功能减退所致内分泌紊乱表现，主要因雌激素灭活减少、小动脉扩张形成，并非最严重合并症。\nB. 错误：睾丸萎缩也是肝硬化内分泌紊乱的表现，与雌激素增多、雄激素减少有关，属于肝功能减退的临床征象。\nC. 错误：痔静脉曲张属于门脉高压时侧支循环形成，可发生便血，但严重程度和致死性不及肝性脑病。\nD. 错误：腹水是门脉高压、低蛋白血症、醛固酮及抗利尿激素增多、淋巴回流障碍等共同作用的结果，是失代偿期重要表现，但不是最严重合并症。\nE. 正确：肝性脑病由肝功能衰竭和毒性代谢产物蓄积引起，可导致昏迷和死亡，是门脉性肝硬化最严重的合并症。\n易混点：门脉高压的典型表现包括脾大、侧支循环形成和腹水；侧支循环中食管胃底静脉曲张破裂出血最危险，但作为肝硬化整体最严重合并症应选肝性脑病。记忆要点：肝功能减退看蜘蛛痣、睾丸萎缩、肝掌；门脉高压看脾大、腹水、静脉曲张；危及生命选肝性脑病。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-2a-single-0137","type":"single","typeLabel":"单选题","number":137,"question":"肝穿刺活检，镜下表现如图。应诊断为","options":[{"key":"A","text":"急性普通型肝炎"},{"key":"B","text":"慢性中度肝炎"},{"key":"C","text":"肝细胞肝癌"},{"key":"D","text":"急性重型肝炎"},{"key":"E","text":"亚急性重型肝炎"}],"answerKeys":["C"],"answerText":["肝细胞肝癌"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：肝细胞肝癌的镜下组织学诊断依据。\n解析：题目图片未提供，仅依据文字信息和标准答案分析。肝穿刺活检诊断肝细胞肝癌的题眼是：异型肝细胞呈梁索状、团块状或假腺管状排列，梁索间有丰富血窦，癌细胞核大深染、核仁明显、胞质嗜酸性或透明，可见胆汁分泌。该镜下结构破坏正常肝小叶，兼具肝细胞来源形态和恶性肿瘤细胞学异型性，故诊断为肝细胞肝癌。肝穿刺标本虽小，但发现上述异型肝细胞巢及血窦网即可作出恶性诊断。\n选项分析：\nA. 错误：急性普通型肝炎以肝细胞胞质疏松化、气球样变、点状坏死和嗜酸性小体为特点，炎症坏死局限于小叶内，不形成异型肝细胞梁索状肿瘤巢，故不符合。\nB. 错误：慢性中度肝炎主要表现为汇管区炎症、界面炎、桥接坏死及纤维化，肝细胞可有变性坏死但无肿瘤性异型增生和血窦丰富的癌巢，故不符合。\nC. 正确：肝细胞肝癌镜下可见异型肝细胞呈梁索状或假腺管状排列，梁索间血窦丰富，核异型性明显；肝穿刺活检发现肿瘤性肝细胞巢是诊断依据。\nD. 错误：急性重型肝炎表现为肝细胞大片坏死，坏死区多无肝细胞再生，临床进展迅速并出现肝衰竭；病变以广泛坏死为主，而非异型肝细胞形成肿瘤巢。\nE. 错误：亚急性重型肝炎可见大片坏死伴结节状肝细胞再生和纤维组织增生，再生结节可致结构紊乱，但肝细胞无明显恶性肿瘤细胞学异型，也无浸润性癌巢，故不符合。\n易混点：亚急性重型肝炎的结节状再生易与高分化肝细胞肝癌混淆，记忆要点是前者为坏死背景下的再生结节，后者有肿瘤细胞异型、梁索状排列和丰富血窦；必要时结合网状纤维染色及HepPar-1、Glypican-3等免疫标记。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病","needsImage":true},{"id":"pathology-2a-single-0138","type":"single","typeLabel":"单选题","number":138,"question":"如图，下列脾梗死的形态特征哪项是错误的","options":[{"key":"A","text":"组织轮廓尚保存"},{"key":"B","text":"镜下呈凝固性坏死"},{"key":"C","text":"梗死区呈锥形"},{"key":"D","text":"梗死灶周围无炎症反应"},{"key":"E","text":"梗死灶呈灰白色"}],"answerKeys":["D"],"answerText":["梗死灶周围无炎症反应"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：脾梗死属于贫血性梗死（凝固性坏死），其形态特征及梗死灶周围常伴炎症反应。\n解析：脾梗死多由脾动脉分支阻塞引起，因脾组织致密、侧支循环少，梗死区呈凝固性坏死，肉眼呈灰白色，组织轮廓可保存，且因血管分布特点呈锥形。梗死灶周围并非“无炎症反应”，而是可见反应性充血、出血带及炎细胞浸润。题干图片未提供，仅依据文字信息分析。本题题眼是“错误的是”，应选“梗死灶周围无炎症反应”。\n选项分析：\nA. 正确：脾梗死为凝固性坏死，坏死早期组织轮廓尚保存，这是凝固性坏死的典型特点。\nB. 正确：脾梗死镜下为凝固性坏死，细胞核消失但组织轮廓可保留，并可有鬼影细胞。\nC. 正确：脾梗死灶常呈锥形，尖指向阻塞血管处，底朝向脾包膜，符合终末动脉分布特点。\nD. 错误：梗死灶周围可有充血、出血及炎细胞浸润等反应性炎症改变，并非无炎症反应；该表述将梗死周围反应错误地否定。\nE. 正确：脾梗死为贫血性梗死，梗死区因缺血、凝固性坏死而呈灰白色。\n易混点：贫血性梗死多见于脾、肾、心，常呈灰白色、凝固性坏死；出血性梗死多见于肺、肠，因双重血供或高度淤血而呈暗红色。记忆要点：脾梗死“灰白、锥形、轮廓保存、周围有反应带”。","chapter":3,"chapterName":"局部血液循环障碍","chapterTitle":"第3章 局部血液循环障碍","needsImage":true},{"id":"pathology-2a-single-0139","type":"single","typeLabel":"单选题","number":139,"question":"肺气肿大体表现的描述不正确的是","options":[{"key":"A","text":"肺体积膨大"},{"key":"B","text":"指压后压痕不易消退"},{"key":"C","text":"肺边缘锐利"},{"key":"D","text":"柔软，缺乏弹性"},{"key":"E","text":"入水漂浮"}],"answerKeys":["C"],"answerText":["肺边缘锐利"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：慢性肺气肿的大体形态学改变及“肺边缘钝圆”这一关键特征。\n解析：肺气肿时末梢肺组织含气量增多并伴肺泡间隔破坏，肺体积膨大、色灰白、质软而缺乏弹性，指压后压痕不易消退，因含气量多而比重降低，入水可漂浮。由于肺组织过度膨胀，肺边缘（尤其前缘）变钝圆，而不是锐利。本题题眼是“肺边缘锐利”与肺气肿应为“边缘钝圆”相矛盾。\n选项分析：\nA. 正确：肺气肿时肺泡腔扩张、含气量增多，大体可见肺体积膨大。\nB. 正确：肺组织弹性回缩力下降、质软，指压后压痕不易消退，为肺气肿大体表现之一。\nC. 错误：肺气肿时肺过度膨胀，肺边缘应变钝圆，尤其肺前缘可呈钝圆；“边缘锐利”不符合肺气肿大体表现，故为本题所选的错误描述。\nD. 正确：肺气肿肺组织弹性纤维破坏、弹性减退，故触之柔软、缺乏弹性。\nE. 正确：肺内含气量显著增多，比重降低，故入水漂浮。\n易混点：肺气肿记忆要点为“体积大、色灰白、质软、弹性差、边缘钝、入水浮”；肺不张多体积缩小，肺实变含气减少、质地变实，入水多下沉，均不要与肺气肿的“膨大、漂浮、边缘钝圆”混淆。","chapter":10,"chapterName":"呼吸系统疾病","chapterTitle":"第10章 呼吸系统疾病"},{"id":"pathology-2a-single-0140","type":"single","typeLabel":"单选题","number":140,"question":"下列哪种肾脏疾病肾组织免疫荧光检查在肾小球内找不到免疫球蛋白和补体的沉积","options":[{"key":"A","text":"弥漫性膜性肾小球肾炎"},{"key":"B","text":"弥漫性系膜增生性肾小球肾炎"},{"key":"C","text":"微小病变病"},{"key":"D","text":"弥漫性膜性增生性肾小球肾炎"},{"key":"E","text":"肺出血肾炎综合征"}],"answerKeys":["C"],"answerText":["微小病变病"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：微小病变病属于免疫荧光阴性的肾病综合征，肾小球内无免疫球蛋白和补体沉积。\n解析：微小病变病是儿童肾病综合征最常见的病理类型，光镜下肾小球基本正常，电镜下以弥漫性足细胞足突融合为特征，免疫荧光检查通常阴性，无IgG、C3等颗粒状或线性沉积。其发病机制主要与T细胞功能异常、循环通透性因子导致足细胞损伤和蛋白尿有关，而非经典免疫复合物沉积。题眼是“肾小球内找不到免疫球蛋白和补体沉积”，即免疫荧光阴性，应选微小病变病。\n\n选项分析：\nA. 错误：弥漫性膜性肾小球肾炎为上皮下免疫复合物沉积，免疫荧光示IgG和C3沿肾小球基底膜呈细颗粒状沉积，不是阴性。\nB. 错误：弥漫性系膜增生性肾小球肾炎可在系膜区出现免疫球蛋白和补体沉积，如IgA肾病可见IgA、C3沉积，非IgA型也常有IgG、IgM或C3沉积，不能归为免疫荧光阴性。\nC. 正确：微小病变病光镜近正常、电镜足突融合，免疫荧光阴性或仅偶有弱IgM，考试中按无免疫球蛋白和补体沉积理解。\nD. 错误：弥漫性膜性增生性肾小球肾炎常由免疫复合物沉积激活补体，免疫荧光可见C3、IgG等沿基底膜和系膜区沉积，部分类型以C3沉积为主。\nE. 错误：肺出血肾炎综合征即Goodpasture综合征，由抗肾小球基底膜抗体致病，免疫荧光可见IgG和C3沿肾小球基底膜呈线性沉积，并伴肺出血和肾炎。\n\n易混点：微小病变病与局灶节段性肾小球硬化均可有足突融合和肾病综合征，但微小病变免疫荧光阴性，而FSGS硬化区可伴IgM、C3沉积；膜性肾病则为基底膜上皮下颗粒状IgG/C3沉积，Goodpasture为线性IgG/C3沉积，记忆要点是“微小病变免疫荧光阴性”。","chapter":13,"chapterName":"泌尿系统疾病","chapterTitle":"第13章 泌尿系统疾病"},{"id":"pathology-2a-single-0141","type":"single","typeLabel":"单选题","number":141,"question":"不属于化脓性炎的疾病是","options":[{"key":"A","text":"急性细菌性心内膜炎"},{"key":"B","text":"急性蜂窝织性阑尾炎"},{"key":"C","text":"急性肾盂肾炎"},{"key":"D","text":"急性风湿性心内膜炎"},{"key":"E","text":"皮肤疖痈"}],"answerKeys":["D"],"answerText":["急性风湿性心内膜炎"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：化脓性炎是以中性粒细胞渗出为主、伴组织坏死和脓液形成的炎症，急性风湿性心内膜炎属于变态反应性非化脓性炎。\n解析：化脓性炎的题眼是“中性粒细胞弥漫或局限性浸润、脓液/脓肿形成”。急性风湿性心内膜炎由A组乙型溶血性链球菌感染后的变态反应引起，基本病变为纤维素样坏死、风湿小体形成及瓣膜闭锁缘疣状赘生物，赘生物为白色血栓，不含大量中性粒细胞和脓液，故不属于化脓性炎。其余选项均有中性粒细胞渗出及化脓性病变。\n选项分析：\nA. 错误：急性细菌性心内膜炎多由金黄色葡萄球菌等引起，瓣膜发生坏死、溃疡并伴大量中性粒细胞浸润和脓性渗出，属化脓性炎。\nB. 错误：急性蜂窝织性阑尾炎是阑尾壁疏松结缔组织的弥漫性化脓性炎，中性粒细胞弥漫浸润，属化脓性炎。\nC. 错误：急性肾盂肾炎是肾盂、肾盏黏膜及肾间质的化脓性炎，可见中性粒细胞浸润，并可形成小脓肿。\nD. 正确：急性风湿性心内膜炎为变态反应性炎，特征是风湿小体、纤维素样坏死和疣状白色血栓，非化脓性炎。\nE. 错误：皮肤疖是毛囊及周围组织的局限性化脓性炎，痈是多个疖融合而成的化脓性炎。\n易混点：风湿性心内膜炎与感染性心内膜炎均可累及瓣膜，但前者赘生物小、单行排列、不易脱落，病理为风湿小体；后者赘生物大、易脱落并栓塞，常为化脓性炎。记忆要点：风湿性心内膜炎“无菌、疣状、非化脓”；感染性心内膜炎“有菌、易脱落、化脓”。","chapter":4,"chapterName":"炎症","chapterTitle":"第4章 炎症"},{"id":"pathology-2a-single-0142","type":"single","typeLabel":"单选题","number":142,"question":"乙型肝炎病毒的主要传播途径是","options":[{"key":"A","text":"经飞沫传播"},{"key":"B","text":"昆虫媒介传播"},{"key":"C","text":"经口传播"},{"key":"D","text":"皮肤黏膜接触传播"},{"key":"E","text":"经血源传播"}],"answerKeys":["E"],"answerText":["经血源传播"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n核心考点：乙型肝炎病毒（HBV）的传播途径，尤其是血源性传播在流行病学和病理学中的意义。\n解析：HBV主要存在于患者和病毒携带者的血液、体液及分泌物中，可通过输血、注射、血制品、针刺、手术或牙科操作等血源途径传播；母婴垂直传播和性接触也是重要途径。病毒经血进入肝细胞后，可引起肝细胞损伤、坏死及炎症反应，临床可见乏力、食欲减退、黄疸、肝区疼痛和肝功能异常，部分患者可发展为慢性肝炎、肝硬化甚至肝细胞癌。本题题眼是“主要传播途径”，在备选项中最佳答案为经血源传播。\n\n选项分析：\nA. 错误：经飞沫传播主要见于呼吸道传染病，如流感、肺结核、麻疹等；HBV不通过飞沫作为主要途径传播。\nB. 错误：昆虫媒介传播不是HBV的主要传播方式，常见虫媒传播疾病如乙型脑炎、疟疾、登革热等，不能将HBV与这些疾病混淆。\nC. 错误：经口传播主要见于甲型肝炎病毒和戊型肝炎病毒，常因食用被粪便污染的水和食物而感染；HBV不是以粪-口途径为主要传播方式。\nD. 错误：HBV虽可经破损皮肤黏膜接触含病毒血液而传播，性接触也可造成黏膜暴露，但作为“主要传播途径”的概括，本题应选血源传播；完整皮肤黏膜通常具有屏障作用。\nE. 正确：HBV可通过输血、血制品、注射、针刺及破损皮肤黏膜接触血液等血源途径传播，是本题的最佳答案，符合乙型肝炎的流行病学特点和考试常考点。\n\n易混点：甲型肝炎和戊型肝炎以粪-口传播为主，乙型肝炎、丙型肝炎和丁型肝炎以血液体液传播为主；记忆时可将“甲戊经口、乙丙丁经血”作为基本区分。另需注意HBV还可母婴传播和性接触传播，但本题选项中“经血源传播”最准确。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-2a-single-0143","type":"single","typeLabel":"单选题","number":143,"question":"淋巴结癌转移时，癌细胞首先出现在","options":[{"key":"A","text":"副皮质区"},{"key":"B","text":"淋巴滤泡中心"},{"key":"C","text":"淋巴结门部"},{"key":"D","text":"边缘窦"},{"key":"E","text":"淋巴结的髓质"}],"answerKeys":["D"],"answerText":["边缘窦"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：经淋巴道转移的癌细胞随输入淋巴液首先到达并滞留于淋巴结被膜下窦（边缘窦）。\n解析：癌的淋巴道转移通常先经输入淋巴管进入淋巴结，输入淋巴管穿过被膜后开口于被膜下窦，因此癌细胞最早出现在边缘窦（被膜下窦）。随后癌细胞可沿淋巴窦向髓质、门部蔓延，并阻塞淋巴回流，引起淋巴结肿大、质地变硬，甚至癌细胞突破被膜向周围组织浸润。本题题眼是“首先出现”，应抓住淋巴结内淋巴液流动和引流路径的起始部位。\n\n选项分析：\nA. 错误：副皮质区是淋巴结的胸腺依赖区，主要含T细胞，参与细胞免疫应答；癌转移首先发生部位不是副皮质区，此区更多见于某些淋巴瘤或反应性增生时的改变。\nB. 错误：淋巴滤泡中心属于B细胞区，是滤泡增生、生发中心反应及某些淋巴瘤累及的部位；癌细胞经淋巴道进入淋巴结时并非首先进入滤泡中心。\nC. 错误：淋巴结门部是血管、输出淋巴管进出之处，属于淋巴液流出和髓窦汇集的区域，通常较边缘窦更晚受累，不是首先出现的部位。\nD. 正确：边缘窦又称被膜下窦，位于淋巴结被膜下，是输入淋巴管进入淋巴结后淋巴液首先到达的窦隙，癌细胞随淋巴液首先在这里滞留、生长。\nE. 错误：髓质内含髓窦和髓索，位于淋巴结深部，是淋巴液由皮质窦向门部流动经过的区域；癌转移可累及髓质，但发生在边缘窦之后，不是“首先”部位。\n\n易混点：边缘窦（被膜下窦）是淋巴液入淋巴结的第一站，髓窦和门部是后续引流区域，记忆为“输入淋巴管→被膜下窦→皮质窦→髓窦→门部输出”。不要将副皮质区、滤泡中心误认为淋巴道入口；它们是淋巴细胞分布和免疫反应区域。","chapter":6,"chapterName":"肿瘤","chapterTitle":"第6章 肿瘤"},{"id":"pathology-2a-single-0144","type":"single","typeLabel":"单选题","number":144,"question":"慢性风湿性瓣膜病常见的联合瓣膜病变是","options":[{"key":"A","text":"二尖瓣和三尖瓣病变"},{"key":"B","text":"二尖瓣、主动脉瓣和三尖瓣病变"},{"key":"C","text":"主动脉瓣和三尖瓣病变"},{"key":"D","text":"二尖瓣和主动脉瓣病变"},{"key":"E","text":"主动脉瓣和肺动脉瓣病变"}],"answerKeys":["D"],"answerText":["二尖瓣和主动脉瓣病变"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：慢性风湿性瓣膜病最常累及二尖瓣，其次为主动脉瓣，常见联合瓣膜病变为二尖瓣和主动脉瓣病变。\n解析：风湿性心内膜炎反复发作后，瓣膜发生增厚、纤维化、粘连、挛缩及腱索短缩，形成瓣膜狭窄和/或关闭不全。二尖瓣受累最常见，主动脉瓣次之，故考试中“联合瓣膜病变”的题眼应选二尖瓣合并主动脉瓣。临床可因左心房、左心室负荷增加及肺循环淤血出现呼吸困难、咯血、左心衰竭等表现。\n选项分析：\nA. 错误：二尖瓣合并三尖瓣病变并非最常见的风湿性联合瓣膜病变；三尖瓣器质性风湿病变较少见，临床所见三尖瓣关闭不全常继发于二尖瓣病变引起的右心室扩大，属功能性改变。\nB. 错误：二尖瓣、主动脉瓣和三尖瓣同时受累可见于重症风湿性心脏病，但发生率低于二尖瓣合并主动脉瓣，不是本题所问的常见联合病变。\nC. 错误：主动脉瓣合并三尖瓣病变不符合风湿性瓣膜病的好发顺序；三尖瓣风湿性病变少见，且多与二尖瓣病变并存而非与主动脉瓣构成常见联合。\nD. 正确：风湿性瓣膜病以二尖瓣最常受累、主动脉瓣次之，二者联合是最常见的联合瓣膜病变，符合病理学及考试常考结论。\nE. 错误：肺动脉瓣风湿性受累极少见；肺动脉瓣病变更多见于先天性畸形、感染性心内膜炎或类癌性心内膜病变等，不是慢性风湿性瓣膜病的常见联合部位。\n易混点：注意区分“风湿性器质性三尖瓣病变”与“继发于二尖瓣病变的三尖瓣功能性关闭不全”；记忆要点是风湿性心瓣膜病好发顺序为二尖瓣＞主动脉瓣＞三尖瓣＞肺动脉瓣，常见联合为二尖瓣和主动脉瓣。","chapter":9,"chapterName":"心血管系统疾病","chapterTitle":"第9章 心血管系统疾病"},{"id":"pathology-2a-single-0145","type":"single","typeLabel":"单选题","number":145,"question":"肾梗死灶大体形态的主要特点为","options":[{"key":"A","text":"多呈楔形，暗红色，界限不清"},{"key":"B","text":"多呈地图形，灰白色，界限清楚"},{"key":"C","text":"多呈楔形，灰白色，界限清楚"},{"key":"D","text":"多呈不规则形，暗红色，界限不清"},{"key":"E","text":"多呈地图形，暗红色，界限不清"}],"answerKeys":["C"],"answerText":["多呈楔形，灰白色，界限清楚"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：肾梗死的病理类型及大体形态特点，即贫血性梗死的形态规律。\n解析：肾梗死属于贫血性梗死。肾动脉分支为终末动脉，吻合支少，组织致密，梗死时局部血管床被压迫、出血少，故梗死灶呈灰白色；形态上因终末动脉分布呈圆锥形供血区，切面多呈楔形，尖端指向阻塞血管、底边朝向肾包膜；梗死灶与周围正常组织之间常有充血出血带，故界限清楚。本题题眼是“肾梗死”对应“贫血性梗死”，应选择楔形、灰白色、界限清楚。\n选项分析：\nA. 错误：楔形符合肾梗死的形状，但暗红色、界限不清不符合贫血性梗死；暗红色多见于出血性梗死或伴明显出血的组织。\nB. 错误：灰白色、界限清楚符合贫血性梗死，但地图形不是肾梗死的典型大体形态；地图形多见于心肌梗死等病变。\nC. 正确：肾梗死为贫血性梗死，肉眼呈楔形，灰白色，尖向肾门、底朝包膜，周围有充血出血带，故界限清楚。\nD. 错误：不规则形、暗红色、界限不清不符合肾贫血性梗死；暗红色和界限不清更倾向出血性梗死或炎症性病变。\nE. 错误：地图形、暗红色、界限不清均不符合肾梗死；肾梗死应为灰白色贫血性梗死，且常呈楔形、界限清楚。\n易混点：贫血性梗死常见于脾、肾、心，因终末动脉供血、组织致密，梗死灶灰白、界限清楚；出血性梗死常见于肺、肠，因双重血供或淤血、血管吻合丰富，梗死灶暗红、界限相对不清。记忆要点：肾、脾梗死“楔形灰白界限清”；肺、肠梗死“暗红出血”。","chapter":3,"chapterName":"局部血液循环障碍","chapterTitle":"第3章 局部血液循环障碍"},{"id":"pathology-2a-single-0146","type":"single","typeLabel":"单选题","number":146,"question":"宫颈癌的好发部位","options":[{"key":"A","text":"宫颈外口鳞状上皮侧"},{"key":"B","text":"宫颈外口鳞状上皮与柱状上皮交界处"},{"key":"C","text":"宫颈内口"},{"key":"D","text":"宫颈管"},{"key":"E","text":"宫颈外口柱状上皮侧"}],"answerKeys":["B"],"answerText":["宫颈外口鳞状上皮与柱状上皮交界处"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：宫颈癌好发于宫颈外口鳞状上皮与柱状上皮交界处，即宫颈移行带。\n解析：宫颈外口在生育期女性受雌激素等因素影响，柱状上皮可外移形成糜烂样改变，使鳞状上皮与柱状上皮交界处（移行带）成为HPV感染和上皮内病变最易发生的区域。宫颈癌以鳞状细胞癌最常见，多起源于该交界处的储备细胞，经历宫颈上皮内病变后进展为浸润癌。题眼是“好发部位”而非某一侧上皮，故应选鳞柱交界处。临床常见接触性出血、异常阴道流血，筛查重点亦为宫颈移行带。\n选项分析：\nA. 错误：宫颈外口鳞状上皮侧靠近鳞柱交界，但并非宫颈癌最精确的好发部位；单纯强调鳞状上皮侧忽略了移行带这一关键区域。\nB. 正确：宫颈外口鳞状上皮与柱状上皮交界处即移行带，是HPV感染、宫颈上皮内病变及宫颈鳞癌最常发生的部位。\nC. 错误：宫颈内口不是宫颈癌的好发部位；宫颈内口病变更多需考虑子宫内膜来源或宫颈管内膜病变，而非宫颈癌典型好发点。\nD. 错误：宫颈管可发生宫颈腺癌，但总体宫颈癌以鳞癌多见，好发部位仍是宫颈外口鳞柱交界处，不能将宫颈管作为总的好发部位。\nE. 错误：宫颈外口柱状上皮侧并非宫颈癌的典型好发部位；柱状上皮被覆区可发生腺上皮病变，但宫颈鳞癌主要起源于鳞柱交界处储备细胞。\n易混点：宫颈鳞癌好发于宫颈外口鳞柱交界处，宫颈腺癌多起源于宫颈管柱状上皮；记忆要点是“外口移行带、鳞癌最常见”。原位癌累及腺体仍属原位癌，不等同于浸润癌。","chapter":14,"chapterName":"生殖系统和乳腺疾病","chapterTitle":"第14章 生殖系统和乳腺疾病"},{"id":"pathology-2a-single-0147","type":"single","typeLabel":"单选题","number":147,"question":"败血症是指","options":[{"key":"A","text":"细菌大量入血，血中可查到细菌，但可无中毒症状"},{"key":"B","text":"细菌毒素入血，引起中毒症状"},{"key":"C","text":"细菌产物被吸收入血引起中毒症状"},{"key":"D","text":"细菌入血繁殖并产生毒素从而引起中毒症状，并在一些器官形成脓肿"},{"key":"E","text":"细菌入血，繁殖并产生毒素，并有中毒症状"}],"answerKeys":["E"],"answerText":["细菌入血，繁殖并产生毒素，并有中毒症状"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n核心考点：败血症是指细菌入血并在血中繁殖、产生毒素，引起全身中毒症状。\n解析：败血症时病原菌侵入血流后不仅在血中短暂存在，还可在血中繁殖并释放毒素，导致寒战、高热等全身中毒表现，血培养常可查到细菌。本题题眼是“入血、繁殖、产毒、中毒症状”四要素同时具备；仅有细菌入血或仅有毒素入血均不能诊断为败血症。\n选项分析：\nA. 错误：描述的是菌血症，血中可查到细菌但可无全身中毒症状；败血症必须有细菌繁殖产毒和中毒症状。\nB. 错误：描述的是毒血症，细菌毒素入血引起中毒症状，但细菌本身不一定入血并繁殖，不能等同于败血症。\nC. 错误：细菌产物被吸收入血引起中毒症状也属于毒血症或内毒素血症范畴，缺少细菌在血中繁殖这一关键环节。\nD. 错误：细菌入血繁殖产毒并引起中毒症状，同时在一些器官形成脓肿，属于脓毒败血症（迁徙性化脓灶），不是单纯败血症。\nE. 正确：细菌入血、在血中繁殖并产生毒素，引起全身中毒症状，符合败血症定义；若形成迁徙性脓肿则进一步称为脓毒败血症。\n易混点：菌血症重“血中有菌”而可无明显中毒症状；毒血症重“毒素入血”有中毒症状；败血症重“菌入血并繁殖产毒+中毒症状”；出现多器官迁徙性脓肿时考虑脓毒败血症。记忆要点：败血症=菌入血+繁殖产毒+中毒，脓肿迁徙=脓毒败血症。","chapter":4,"chapterName":"炎症","chapterTitle":"第4章 炎症"},{"id":"pathology-2a-single-0148","type":"single","typeLabel":"单选题","number":148,"question":"某患者白带增多，宫颈活检镜下见鳞状上皮层下部近2/3的细胞出现异型性，应诊断为","options":[{"key":"A","text":"宫颈上皮内瘤变Ⅰ级"},{"key":"B","text":"宫颈上皮内瘤变Ⅱ级"},{"key":"C","text":"宫颈上皮内瘤变Ⅲ级"},{"key":"D","text":"宫颈原位癌"},{"key":"E","text":"宫颈柱状上皮异位"}],"answerKeys":["B"],"answerText":["宫颈上皮内瘤变Ⅱ级"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：宫颈上皮内瘤变（CIN）的分级依据是异型鳞状上皮细胞占据上皮层的厚度，CINⅡ级为异型细胞累及上皮下1/3～2/3。\n解析：宫颈活检见鳞状上皮层下部近2/3的细胞出现异型性，提示异型增生未超过上皮下2/3，基底膜完整，符合CINⅡ级。CIN多为高危型HPV感染相关，患者可仅有白带增多等非特异表现，确诊依赖阴道镜活检及组织病理学分级。本题题眼是“近2/3”，应定位在CINⅡ级。\n\n选项分析：\nA. 错误：CINⅠ级为异型细胞局限于鳞状上皮下1/3，常可见挖空细胞，本题病变已达近2/3，故不符合。\nB. 正确：CINⅡ级为异型细胞累及上皮下1/3～2/3，细胞极性和层次紊乱，但未达全层，基底膜完整，与题干“下部近2/3”相符。\nC. 错误：CINⅢ级为异型细胞超过上皮下2/3，可达近全层或全层，属重度异型增生/高级别病变；题干仅近2/3，未达到CINⅢ标准。\nD. 错误：宫颈原位癌表现为异型细胞占据上皮全层，极性完全消失，核分裂象可上移，但基底膜仍完整；本题异型细胞未累及全层。\nE. 错误：宫颈柱状上皮异位是宫颈管柱状上皮外移形成的鳞柱交界改变，并非鳞状上皮异型增生，也不是癌前病变，组织学上无本题所述异型细胞层状分布。\n\n易混点：记忆CIN分级看“异型细胞占上皮厚度”：下1/3为Ⅰ级，下1/3～2/3为Ⅱ级，超过2/3至全层为Ⅲ级；全层异型而基底膜完整为原位癌。宫颈柱状上皮异位常被误称“宫颈糜烂”，但本质是柱状上皮外移，不应与CIN混淆。","chapter":14,"chapterName":"生殖系统和乳腺疾病","chapterTitle":"第14章 生殖系统和乳腺疾病"},{"id":"pathology-2a-single-0149","type":"single","typeLabel":"单选题","number":149,"question":"干性坏疽与湿性坏疽的区别在于前者","options":[{"key":"A","text":"好发生于四肢末端"},{"key":"B","text":"与正常组织分界清楚"},{"key":"C","text":"全身中毒症状严重"},{"key":"D","text":"静脉回流通畅"},{"key":"E","text":"有明显的臭味"}],"answerKeys":["D"],"answerText":["静脉回流通畅"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：干性坏疽与湿性坏疽的发生条件、形态学及临床联系的区别。\n解析：干性坏疽多发生于四肢末端，其关键发生条件是动脉供血中断而静脉回流通畅，坏死组织水分少、蒸发快，因而干燥皱缩、呈黑褐色，腐败菌感染较轻，与正常组织分界较清楚，全身中毒症状轻。湿性坏疽则多因动脉阻塞同时伴静脉回流受阻，坏死组织含水多、肿胀，腐败菌大量繁殖，产生恶臭，分界不清，全身中毒症状重。本题题眼是“区别在于前者”的本质条件，即静脉回流通畅。\n选项分析：\nA. 错误：好发生于四肢末端确为干性坏疽常见部位，但湿性坏疽在四肢静脉淤血基础上也可发生，且本题标准答案取发生条件D，A不是本题所问的本质区别。\nB. 错误：与正常组织分界清楚是干性坏疽的形态表现，其形成基础正是静脉回流通畅、组织水分少；但本题标准答案将其归为继发表现，故选D更符合题意。\nC. 错误：全身中毒症状严重是湿性坏疽的特点，干性坏疽中毒症状轻，故不是干性坏疽的特点。\nD. 正确：干性坏疽时动脉阻塞而静脉回流通畅，坏死组织干燥皱缩、腐败轻、分界清；湿性坏疽常伴静脉回流受阻，组织湿软肿胀、腐败重，这是两者区别的关键机制。\nE. 错误：有明显臭味是湿性坏疽因腐败菌感染重所致，干性坏疽一般无臭味或臭味很轻。\n易混点：记忆要点为“干性坏疽：动脉堵、静脉通、干、分界清、毒轻”；“湿性坏疽：静脉也阻、湿、恶臭、分界不清、毒重”。气性坏疽则强调厌氧产气菌感染、捻发音和进展迅速，勿与湿性坏疽混同。","chapter":1,"chapterName":"细胞和组织的适应与损伤","chapterTitle":"第1章 细胞和组织的适应与损伤"},{"id":"pathology-2a-single-0150","type":"single","typeLabel":"单选题","number":150,"question":"慢性胃溃疡最常见的并发症是","options":[{"key":"A","text":"出血"},{"key":"B","text":"穿孔"},{"key":"C","text":"梗阻"},{"key":"D","text":"癌变"},{"key":"E","text":"粘连"}],"answerKeys":["A"],"answerText":["出血"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：A\n核心考点：慢性胃溃疡最常见的并发症是出血，因溃疡底部血管被侵蚀破裂所致。\n解析：慢性胃溃疡的经典并发症包括出血、穿孔、幽门梗阻和癌变，其中出血最常见。溃疡进展时可侵蚀溃疡底部的血管，尤其是小动脉，导致呕血、黑便，严重者失血性休克。题眼是“最常见”，应选出血而非更凶险的穿孔或发生率较低的癌变。\n选项分析：\nA. 正确：溃疡底部肉芽组织和瘢痕组织中的血管被侵蚀破裂，可引起呕血、黑便，是慢性胃溃疡最常见的并发症。\nB. 错误：穿孔是溃疡穿透浆膜层引起急性弥漫性腹膜炎，临床凶险但发生率低于出血，不是“最常见”。\nC. 错误：梗阻多由幽门管溃疡瘢痕收缩或炎性水肿、痉挛引起幽门梗阻，属于较晚期并发症，并非最常见。\nD. 错误：癌变仅见于少数胃溃疡，良性溃疡癌变率低，且需与溃疡型胃癌鉴别，不是最常见并发症。\nE. 错误：粘连是溃疡浆膜面纤维素渗出机化后与邻近组织粘连，可见于慢性溃疡修复过程，但不属于最常考的经典并发症，也不是最常见。\n易混点：记忆要点为“出血最常见、穿孔最危险、幽门梗阻多由瘢痕收缩、癌变率低”。粘连虽可发生，但考试中慢性胃溃疡经典并发症首选出血。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-2a-single-0151","type":"single","typeLabel":"单选题","number":151,"question":"成人型呼吸窘迫综合征早期最有诊断意义的病理组织学变化是","options":[{"key":"A","text":"部分肺泡萎陷"},{"key":"B","text":"肺泡壁充血水肿"},{"key":"C","text":"肺泡腔充满水肿液"},{"key":"D","text":"透明膜形成"},{"key":"E","text":"毛细血管内中性粒细胞聚集"}],"answerKeys":["D"],"answerText":["透明膜形成"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：成人型呼吸窘迫综合征（ARDS）的形态学标志是弥漫性肺泡损伤，透明膜形成最具诊断意义。\n解析：ARDS时肺泡毛细血管膜严重损伤，血浆蛋白和坏死肺泡上皮细胞碎片渗出至肺泡腔，在肺泡表面凝集成嗜酸性、均质的膜状物，即透明膜。透明膜形成是弥漫性肺泡损伤的特征性改变，也是本题题眼“最有诊断意义”。临床对应进行性呼吸困难、顽固性低氧血症和双肺弥漫性浸润。\n\n选项分析：\nA. 错误：部分肺泡萎陷可见于ARDS，但肺不张、肺水肿等也可出现，缺乏特异性，不是最有诊断意义的改变。\nB. 错误：肺泡壁充血水肿属于非特异性急性炎症和渗出反应，可见于多种肺损伤，不能作为ARDS的特征性诊断依据。\nC. 错误：肺泡腔充满水肿液提示肺水肿，可见于心源性肺水肿等多种情况，不能据此诊断ARDS。\nD. 正确：透明膜由渗出的血浆蛋白和坏死上皮细胞碎片在肺泡表面凝集形成，是ARDS弥漫性肺泡损伤的特征性形态学标志。\nE. 错误：毛细血管内中性粒细胞聚集可见于ARDS早期，但也是多种急性炎症的共同表现，特异性和诊断意义不如透明膜形成。\n\n易混点：新生儿呼吸窘迫综合征（肺透明膜病）也可见透明膜，但其主要机制是肺表面活性物质缺乏；成人型ARDS的透明膜继发于肺泡毛细血管膜损伤和蛋白性渗出。记忆要点：成人型ARDS的病理标志是弥漫性肺泡损伤伴透明膜形成。","chapter":10,"chapterName":"呼吸系统疾病","chapterTitle":"第10章 呼吸系统疾病"},{"id":"pathology-2a-single-0152","type":"single","typeLabel":"单选题","number":152,"question":"符合门脉性肝硬化特点的是","options":[{"key":"A","text":"结节大小相仿，纤维间隔薄而均匀"},{"key":"B","text":"结节大小不等，纤维间隔厚薄不均"},{"key":"C","text":"结节呈细颗粒状，深绿色"},{"key":"D","text":"结节不明显"},{"key":"E","text":"肝内散在多个粗大结节"}],"answerKeys":["A"],"answerText":["结节大小相仿，纤维间隔薄而均匀"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：A\n核心考点：门脉性肝硬化属于小结节性肝硬化，其核心形态特点是再生结节大小相仿、纤维间隔薄而均匀。\n解析：门脉性肝硬化多由病毒性肝炎、酒精性肝病等引起，肝细胞反复坏死、再生并伴纤维组织增生，形成假小叶。大体上肝脏体积缩小、质地变硬，表面和切面呈弥漫性小结节，结节直径较小且大小较一致，周围纤维间隔较薄而均匀；镜下假小叶大小较相仿，纤维间隔较窄。本题题眼是“结节大小相仿、纤维间隔薄而均匀”，这正是小结节性/门脉性肝硬化的典型特点，故A正确。\n\n选项分析：\nA. 正确：符合门脉性肝硬化即小结节性肝硬化的典型病理形态，再生结节大小相仿，纤维间隔薄而均匀，假小叶大小较一致。\nB. 错误：结节大小不等、纤维间隔厚薄不均是大结节性肝硬化（坏死后性肝硬化）的特点，常继发于亚急性重型肝炎或大片肝坏死，不是门脉性肝硬化。\nC. 错误：结节呈细颗粒状、深绿色主要提示胆汁性肝硬化，深绿色与胆色素沉积、长期胆汁淤积有关，不是门脉性肝硬化的典型表现。\nD. 错误：结节不明显可见于血吸虫性肝硬化（干线型肝硬化）或淤血性肝硬化等，门脉性肝硬化常有明显弥漫性小结节，故不符合。\nE. 错误：肝内散在多个粗大结节更符合大结节性肝硬化/坏死后性肝硬化，门脉性肝硬化以弥漫均匀的小结节为特点。\n\n易混点：记忆要点是“门脉性—小结节—大小相仿、间隔薄而均匀”；“坏死后性—大结节—大小不等、间隔厚薄不均”。胆汁性肝硬化注意胆色素沉积所致深绿色，血吸虫性肝硬化注意门脉区纤维增生、结节不明显。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-2a-single-0153","type":"single","typeLabel":"单选题","number":153,"question":"早期大肠癌是","options":[{"key":"A","text":"局限于黏膜层及黏膜下层的癌"},{"key":"B","text":"侵及黏膜下层的癌"},{"key":"C","text":"侵及浅肌层的癌"},{"key":"D","text":"无淋巴结转移的癌"},{"key":"E","text":"直径小于2cm的癌"}],"answerKeys":["A"],"answerText":["局限于黏膜层及黏膜下层的癌"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：A\n核心考点：早期大肠癌是指癌组织局限于大肠黏膜层及黏膜下层、未侵及肌层的癌。\n解析：早期大肠癌的诊断依据是浸润深度，而不是肿瘤大小或有无淋巴结转移。癌组织未突破黏膜下层、未累及固有肌层时即属早期，包括黏膜内癌和黏膜下癌。题眼是“早期”，应抓住“局限于黏膜层及黏膜下层”这一深度标准。\n\n选项分析：\nA. 正确：完整表达了早期大肠癌的定义，即癌组织局限于黏膜层及黏膜下层，未侵及肌层。\nB. 错误：仅说“侵及黏膜下层”不能涵盖仅局限于黏膜层的黏膜内癌，作为定义不完整；早期大肠癌应包括黏膜内癌和黏膜下癌。\nC. 错误：侵及浅肌层说明癌已突破黏膜下层进入肌层，属于进展期大肠癌，不是早期。\nD. 错误：无淋巴结转移不能作为早期大肠癌的定义；早期大肠癌无论有无淋巴结转移，只要局限于黏膜层及黏膜下层即属早期，且部分进展期癌也可无淋巴结转移。\nE. 错误：直径小于2cm只是“小癌”的大小描述，不能代表浸润深度；小癌也可能已侵及肌层，而较大的癌也可能仍局限于黏膜下层。\n\n易混点：早期胃癌和早期大肠癌都以浸润深度定义，均指局限于黏膜层及黏膜下层、未累及肌层，不能把“小癌”或“无淋巴结转移”等同于早期癌。黏膜内癌一般很少转移，黏膜下癌淋巴结转移风险相对增高，但仍属早期大肠癌。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-2a-single-0154","type":"single","typeLabel":"单选题","number":154,"question":"关于心肌梗死的描述，下列哪项是错误的","options":[{"key":"A","text":"梗死灶形态不规则"},{"key":"B","text":"病变多属出血性梗死"},{"key":"C","text":"全层梗死可致心脏破裂"},{"key":"D","text":"梗死多发生在左心室前壁或心尖部"},{"key":"E","text":"病变累及心室壁心腔侧1/3称心内膜下梗死"}],"answerKeys":["B"],"answerText":["病变多属出血性梗死"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：心肌梗死多属贫血性梗死，透壁性梗死可并发心脏破裂，好发于左心室前壁及心尖部。\n解析：冠状动脉属终末动脉，心肌组织致密、侧支循环不丰富，故心肌梗死多为贫血性梗死（白色梗死），而非出血性梗死。梗死灶形态不规则，常呈地图状；透壁性梗死累及心室壁全层，坏死组织软化可导致心脏破裂，多发生于梗死后4～7天。本题题眼是“多属出血性梗死”，与心肌梗死的基本病理类型相反。\n\n选项分析：\nA. 正确：心肌梗死灶受冠状动脉分支分布影响，形态多不规则，可呈地图状，符合贫血性梗死的特点。\nB. 错误：心肌梗死多属贫血性梗死，因心肌组织致密、冠状动脉终末支供血、侧支循环少；出血性梗死多见于肺、肠等组织疏松或双重血供、静脉回流受阻的器官。\nC. 正确：全层梗死即透壁性心肌梗死，坏死组织软化、室壁张力下降，可导致心脏破裂，常发生在梗死后1～2周内，以4～7天最危险。\nD. 正确：心肌梗死多发生于左心室前壁、心尖部及室间隔前2/3，主要由左冠状动脉前降支供血区受累所致。\nE. 正确：病变仅累及心室壁心腔侧1/3者称心内膜下心肌梗死；若累及心室壁全层或超过2/3，则为透壁性心肌梗死。\n\n易混点：心肌梗死与肺、肠梗死不同，后者常为出血性梗死；心肌梗死以贫血性梗死为主。记忆要点：冠状动脉终末支、心肌致密，故“白”；透壁性梗死易破裂、室壁瘤，心内膜下梗死一般不引起心脏破裂。","chapter":9,"chapterName":"心血管系统疾病","chapterTitle":"第9章 心血管系统疾病"},{"id":"pathology-2a-single-0155","type":"single","typeLabel":"单选题","number":155,"question":"与EB病毒感染密切相关的淋巴瘤类型是","options":[{"key":"A","text":"蕈样肉芽肿（蕈样霉菌病）"},{"key":"B","text":"霍奇金淋巴瘤"},{"key":"C","text":"周围T细胞淋巴瘤"},{"key":"D","text":"滤泡型淋巴瘤"},{"key":"E","text":"弥漫性大B细胞淋巴瘤"}],"answerKeys":["B"],"answerText":["霍奇金淋巴瘤"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：EB病毒与经典型霍奇金淋巴瘤发病密切相关，尤其是混合细胞型和淋巴细胞消减型。\n解析：经典型霍奇金淋巴瘤的肿瘤细胞为R-S细胞及其变异型，约半数病例的R-S细胞中可检出EBV基因组及EBV编码的LMP1、EBNA等产物；LMP1可激活NF-κB等信号通路，促进B细胞转化和R-S细胞存活。其典型形态为双核或多核R-S细胞，背景为淋巴细胞、嗜酸性粒细胞、浆细胞等炎细胞，临床常表现为颈部无痛性淋巴结肿大，并可伴B症状。本题题眼是“与EB病毒感染密切相关”的淋巴瘤类型，标准答案为霍奇金淋巴瘤。\n选项分析：\nA. 错误：蕈样肉芽肿（蕈样霉菌病）是原发于皮肤的T细胞淋巴瘤，表现为皮肤斑块、斑片及肿瘤，病因与EBV无明确密切关系，不是EBV相关淋巴瘤的代表。\nB. 正确：经典型霍奇金淋巴瘤的R-S细胞常携带EBV潜伏感染，EBV编码蛋白参与R-S细胞存活和转化，是本题所指的密切相关淋巴瘤。\nC. 错误：周围T细胞淋巴瘤为非特指性外周T细胞肿瘤，多数与EBV无直接恒定关系；血管免疫母细胞性T细胞淋巴瘤虽可检出EBV阳性B细胞，但本题按标准答案选霍奇金淋巴瘤。\nD. 错误：滤泡型淋巴瘤起源于生发中心B细胞，特征性分子改变为t(14;18)导致BCL2过表达，与EBV感染无密切关系。\nE. 错误：弥漫性大B细胞淋巴瘤多数为散发性，与EBV无关；仅老年性EBV阳性弥漫性大B细胞淋巴瘤等少部分亚型与EBV相关，不能作为本题最典型答案。\n易混点：EBV相关淋巴瘤谱包括地方性Burkitt淋巴瘤、经典型霍奇金淋巴瘤、NK/T细胞淋巴瘤及部分免疫缺陷相关淋巴增殖性疾病。记忆要点：霍奇金淋巴瘤看R-S细胞和EBV；滤泡型淋巴瘤记t(14;18)/BCL2；蕈样肉芽肿是皮肤T细胞淋巴瘤。","chapter":12,"chapterName":"淋巴造血系统疾病","chapterTitle":"第12章 淋巴造血系统疾病"},{"id":"pathology-2a-single-0156","type":"single","typeLabel":"单选题","number":156,"question":"下列哪项不是恶性肿瘤","options":[{"key":"A","text":"Krukenberg瘤"},{"key":"B","text":"Ewing肉瘤"},{"key":"C","text":"Hodgkin瘤"},{"key":"D","text":"淋巴瘤"},{"key":"E","text":"多形性腺瘤"}],"answerKeys":["E"],"answerText":["多形性腺瘤"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n核心考点：肿瘤的良恶性鉴别及肿瘤命名，多形性腺瘤属于涎腺良性肿瘤。\n解析：多形性腺瘤又称涎腺混合瘤，是最常见的涎腺良性肿瘤，好发于腮腺，由腺上皮、肌上皮及黏液软骨样间质构成，组织形态多样，故称“多形性”，并非恶性细胞学多形性。其包膜常不完整，单纯剜除后易复发，少数可发生恶变。本题题眼是“名称带瘤不等于恶性”，A～D均为恶性病变，只有多形性腺瘤为良性。\n选项分析：\nA. 错误：Krukenberg瘤是卵巢转移性印戒细胞癌，多由胃印戒细胞癌转移而来，常累及双侧卵巢，属于恶性肿瘤。\nB. 错误：Ewing肉瘤是骨及软组织的小圆细胞恶性肿瘤，常见EWS-FLI1融合基因，CD99阳性，属于恶性。\nC. 错误：Hodgkin瘤规范称霍奇金淋巴瘤，是恶性淋巴瘤的一种，镜下可见R-S细胞，属于恶性。\nD. 错误：淋巴瘤是起源于淋巴造血组织的恶性肿瘤，分为霍奇金淋巴瘤和非霍奇金淋巴瘤，属于恶性。\nE. 正确：多形性腺瘤是涎腺最常见的良性肿瘤，好发于腮腺，虽可复发或恶变，但本身不是恶性肿瘤。\n易混点：多形性腺瘤与多形性腺瘤癌变不同，前者良性，后者是在长期病程或反复复发基础上出现恶性成分。Krukenberg瘤不要误认为卵巢原发良性肿瘤，其本质是转移癌；Ewing肉瘤注意与骨肉瘤区分，前者为小圆细胞肿瘤，后者以肿瘤性成骨为特点。","chapter":6,"chapterName":"肿瘤","chapterTitle":"第6章 肿瘤"},{"id":"pathology-2a-single-0157","type":"single","typeLabel":"单选题","number":157,"question":"如图，心肌梗死后很少出现下列哪种改变","options":[{"key":"A","text":"梗死灶呈地图形"},{"key":"B","text":"梗死灶心肌细胞再生"},{"key":"C","text":"贫血性梗死"},{"key":"D","text":"梗死灶周围充血出血带"},{"key":"E","text":"继发附壁血栓形成"}],"answerKeys":["B"],"answerText":["梗死灶心肌细胞再生"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：心肌梗死属于贫血性梗死，坏死心肌不能再生，最终由肉芽组织机化形成瘢痕。\n解析：题目图片未提供，仅依据文字信息分析。心肌细胞为终末分化细胞，再生能力极低，梗死后坏死心肌主要通过炎症清除、肉芽组织长入并机化，最终形成纤维瘢痕，因此很少出现心肌细胞再生。心肌梗死灶因冠状动脉分支分布及坏死范围不同，可呈不规则的地图形，属贫血性梗死，梗死周边可见充血出血带，并可在心内膜粗糙、血流缓慢或室壁瘤形成时继发附壁血栓。\n\n选项分析：\nA. 错误（不是“很少出现”的改变）：心肌梗死灶形状常不规则，可呈地图形，这是心肌梗死的常见肉眼形态之一。\nB. 正确：心肌细胞几乎没有再生能力，梗死区心肌细胞坏死后不能由心肌细胞再生修复，而由纤维瘢痕替代，故为本题答案。\nC. 错误（不是“很少出现”的改变）：心肌梗死属贫血性梗死，因冠状动脉阻塞后局部组织缺血坏死，梗死区常呈灰白色。\nD. 错误（不是“很少出现”的改变）：梗死灶周边发生炎症反应，血管扩张充血，可形成充血出血带，是梗死交界处的常见改变。\nE. 错误（不是“很少出现”的改变）：心肌梗死累及心内膜时内膜粗糙，加之局部血流缓慢或室壁瘤形成，可继发附壁血栓。\n易混点：贫血性梗死多见于心、脾、肾等血供较致密且侧支循环不丰富的实质器官；心肌梗死虽为贫血性梗死，但可因累及心内膜而继发附壁血栓。记忆要点：心肌、神经细胞均再生能力极低，坏死后的修复以纤维瘢痕为主，不要与上皮或肝细胞再生混淆。","chapter":9,"chapterName":"心血管系统疾病","chapterTitle":"第9章 心血管系统疾病","needsImage":true},{"id":"pathology-2a-single-0158","type":"single","typeLabel":"单选题","number":158,"question":"胃溃疡的合并症最常见的是","options":[{"key":"A","text":"梗阻"},{"key":"B","text":"穿孔"},{"key":"C","text":"出血"},{"key":"D","text":"癌变"},{"key":"E","text":"粘连"}],"answerKeys":["C"],"answerText":["出血"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：胃溃疡的常见合并症及其发生频率，其中出血最常见。\n解析：胃溃疡底部血管被溃疡侵蚀破坏后可引起出血，可表现为呕血、黑便或长期隐性失血导致贫血，是慢性消化性溃疡最常见的合并症。题眼在“最常见”，应选出血；穿孔、幽门梗阻和癌变虽为胃溃疡可发生的合并症，但发生率均低于出血。胃溃疡癌变较少见，且良性溃疡本身并非多数胃癌的前驱病变。\n选项分析：\nA. 错误：梗阻多因幽门管或十二指肠溃疡反复发作、瘢痕形成和幽门括约肌痉挛引起，表现为幽门梗阻、呕吐宿食等，并非胃溃疡最常见合并症。\nB. 错误：穿孔是溃疡穿透浆膜层所致，可引起急性弥漫性腹膜炎，属于严重但较少见的合并症；十二指肠前壁溃疡较易穿孔，不能作为胃溃疡最常见合并症。\nC. 正确：出血由溃疡底部血管被侵蚀引起，是胃溃疡和消化性溃疡最常见的合并症，可表现为呕血、黑便或贫血。\nD. 错误：癌变可见于少数慢性胃溃疡，但发生率低，且多见于中老年慢性胃溃疡；不能与最常见的出血混淆。\nE. 错误：粘连是溃疡浆膜面纤维素性渗出机化后与邻近组织粘连，可见于慢性溃疡，但不属于消化性溃疡经典四大合并症中最常见者。\n易混点：消化性溃疡四大合并症记忆为“出血、穿孔、幽门梗阻、癌变”，其中出血最常见；幽门梗阻多与幽门区或十二指肠溃疡瘢痕狭窄有关，癌变在胃溃疡中少见而十二指肠溃疡一般不癌变。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-2a-single-0159","type":"single","typeLabel":"单选题","number":159,"question":"胃最常见的两种良性肿瘤是","options":[{"key":"A","text":"平滑肌瘤和纤维瘤"},{"key":"B","text":"脂肪瘤和腺瘤"},{"key":"C","text":"神经纤维瘤和腺瘤"},{"key":"D","text":"腺瘤和平滑肌瘤"},{"key":"E","text":"纤维瘤和血管瘤"}],"answerKeys":["D"],"answerText":["腺瘤和平滑肌瘤"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：胃良性肿瘤中，以上皮来源的腺瘤和间叶来源的平滑肌瘤最常见。\n解析：胃腺瘤属于良性上皮性肿瘤/癌前病变，好发于胃窦，常伴慢性萎缩性胃炎和肠上皮化生，镜下可见腺管或绒毛状异型增生，需警惕癌变。胃平滑肌瘤属于良性间叶性肿瘤，由分化良好的平滑肌细胞构成，常呈结节状、界限清楚、切面编织状，镜下梭形细胞束状排列，SMA、desmin阳性。本题题眼是“胃最常见两种良性肿瘤”，应选腺瘤和平滑肌瘤。\n选项分析：\nA. 错误：平滑肌瘤是正确的一个，但胃纤维瘤罕见，由纤维结缔组织构成，不属于最常见的两种组合。\nB. 错误：腺瘤正确，但胃脂肪瘤少见，位于黏膜下层，由成熟脂肪组织构成，不是最常见的良性肿瘤之一。\nC. 错误：腺瘤正确，但胃神经纤维瘤罕见，可伴神经纤维瘤病，由施万细胞等构成，不是常见组合。\nD. 正确：胃腺瘤为常见上皮性良性肿瘤/癌前病变，胃平滑肌瘤为常见良性间叶性肿瘤，二者符合标准答案。\nE. 错误：胃纤维瘤和血管瘤均少见；血管瘤由异常血管腔构成，可出血，但不属于胃最常见良性肿瘤。\n易混点：胃腺瘤要与增生性息肉、胃底腺息肉鉴别，并注意腺瘤可异型增生、癌变；胃平滑肌瘤要与胃肠道间质瘤鉴别，间质瘤有恶性潜能，常CD117/DOG1阳性，而平滑肌瘤SMA/desmin阳性、CD117阴性。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-2a-single-0160","type":"single","typeLabel":"单选题","number":160,"question":"卡他性炎指的是","options":[{"key":"A","text":"皮肤的浆液性炎"},{"key":"B","text":"浆膜的浆液性炎"},{"key":"C","text":"黏膜的浆液性炎"},{"key":"D","text":"关节的浆液性炎"},{"key":"E","text":"脑膜的浆液性炎"}],"answerKeys":["C"],"answerText":["黏膜的浆液性炎"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：卡他性炎是发生于黏膜的浆液性炎，常伴有黏液分泌增多。\n解析：卡他性炎（catarrhal inflammation）特指黏膜的浆液性炎症，常见于鼻、咽、气管、支气管及胃肠道黏膜。其渗出液以浆液为主，并混有较多黏液和少量炎细胞，临床可见黏膜充血、水肿及浆液性或黏液脓性分泌物。题眼在“卡他”即黏膜表面渗出物向外流淌，故定位为黏膜而非浆膜、皮肤、关节或脑膜。\n选项分析：\nA. 错误：皮肤的浆液性炎通常表现为水疱形成，如烫伤或病毒感染所致的水疱，不称为卡他性炎。\nB. 错误：浆膜的浆液性炎常见于胸膜、腹膜和心包膜，表现为浆膜腔积液，属于浆膜炎而非黏膜卡他性炎。\nC. 正确：卡他性炎的定义就是黏膜的浆液性炎，渗出液含浆液和黏液，常伴杯状细胞和黏液腺分泌亢进。\nD. 错误：关节的浆液性炎表现为关节滑膜渗出、关节腔积液，常见于风湿性关节炎早期等，不称卡他性炎。\nE. 错误：脑膜的浆液性炎表现为脑膜充血、水肿及脑脊液增多，见于感染或中毒等，与黏膜卡他性炎概念不同。\n易混点：浆液性炎按部位可有皮肤水疱、浆膜腔积液、关节腔积液和黏膜卡他性炎；只有黏膜表面的浆液性炎才称卡他性炎。记忆要点：卡他=黏膜+浆液渗出+黏液增多，常见于呼吸道和消化道黏膜。","chapter":4,"chapterName":"炎症","chapterTitle":"第4章 炎症"},{"id":"pathology-2a-single-0161","type":"single","typeLabel":"单选题","number":161,"question":"关于慢性胃溃疡，下列哪项是错误的","options":[{"key":"A","text":"溃疡多位于胃大弯近幽门侧"},{"key":"B","text":"溃疡边缘整齐不隆起"},{"key":"C","text":"溃疡一般较深"},{"key":"D","text":"溃疡直径多在2cm以内"},{"key":"E","text":"溃疡周围黏膜皱襞呈放射状"}],"answerKeys":["A"],"answerText":["溃疡多位于胃大弯近幽门侧"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：A\n核心考点：慢性胃溃疡的好发部位及良性溃疡的形态学特点。\n解析：慢性胃溃疡好发于胃小弯近幽门侧，尤其胃窦部小弯侧，故A“胃大弯近幽门侧”错误。良性溃疡典型表现为圆形或椭圆形，边缘整齐、不隆起，底部平坦，周围黏膜皱襞呈放射状，溃疡一般较深，可深达肌层甚至浆膜层，直径多在2cm以内。本题题眼是“错误的是”，应选与良性溃疡好发部位相反的A。\n\n选项分析：\nA. 错误：慢性胃溃疡好发于胃小弯近幽门侧，而非胃大弯近幽门侧；胃大弯侧溃疡较少见，若见较大溃疡需警惕恶性可能。\nB. 正确：良性慢性胃溃疡边缘整齐、不隆起，呈凿除状，周围黏膜可向溃疡中心集中。\nC. 正确：慢性胃溃疡一般较深，可深达黏膜下层、肌层甚至浆膜层，底部常由坏死组织、炎性渗出物、肉芽组织和瘢痕组织构成。\nD. 正确：良性溃疡直径多在2cm以内；直径较大、边缘不整齐或隆起者应警惕恶性溃疡。\nE. 正确：溃疡周围黏膜因纤维化收缩和修复反应，皱襞常呈放射状向溃疡边缘集中。\n\n易混点：良性溃疡与恶性溃疡鉴别：良性溃疡多位于胃小弯近幽门侧、直径多小于2cm、边缘整齐不隆起、皱襞放射状；恶性溃疡常边缘不整齐、隆起、皱襞中断，需结合活检。记忆要点：良性溃疡“小、浅？不，较深但小、整齐、放射状”，部位记“小弯近幽门”。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-2a-single-0162","type":"single","typeLabel":"单选题","number":162,"question":"二尖瓣狭窄首先引起","options":[{"key":"A","text":"左心房肥大扩张"},{"key":"B","text":"心室肥大扩张"},{"key":"C","text":"肺淤血水肿"},{"key":"D","text":"肺动脉高压"},{"key":"E","text":"右心衰竭"}],"answerKeys":["A"],"answerText":["左心房肥大扩张"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：A\n核心考点：二尖瓣狭窄引起左心房压力负荷增加，最早出现左心房代偿性肥大和扩张。\n解析：二尖瓣狭窄时，舒张期左心房血液进入左心室受阻，左心房压力升高并发生代偿性肥大、扩张，这是血流动力学改变最早、最直接的后果。随后左心房压升高可逆传至肺静脉，引起肺淤血、肺水肿；长期肺循环压力升高可导致肺动脉高压，继而右心室肥大扩张，最终右心衰竭。本题题眼是“首先”，应选择二尖瓣狭窄直接累及的左心房。\n选项分析：\nA. 正确：二尖瓣狭窄使左心房排血受阻，左心房压力负荷增加，最先发生左心房肥大、扩张，是本题标准答案。\nB. 错误：二尖瓣狭窄主要使左心房压力升高，左心室舒张期充盈减少，左心室通常不肥大甚至偏小；右心室肥大扩张是肺动脉高压后的晚期改变，不是首先。\nC. 错误：肺淤血水肿是左心房压升高后肺静脉压升高的结果，属于二尖瓣狭窄较早但并非最先出现的病变，晚于左心房肥大扩张。\nD. 错误：肺动脉高压是肺淤血、肺静脉压长期升高后的继发改变，出现较晚，不是首先。\nE. 错误：右心衰竭是二尖瓣狭窄长期发展、肺动脉高压和右心室负荷加重后的终末结果，不是首先出现的改变。\n易混点：二尖瓣狭窄为“压力负荷”首先累及左心房，左心室不大；二尖瓣关闭不全为“容量负荷”，可引起左心房、左心室肥大扩张。主动脉瓣狭窄则首先引起左心室向心性肥大，注意区分受累心腔和负荷类型。","chapter":9,"chapterName":"心血管系统疾病","chapterTitle":"第9章 心血管系统疾病"},{"id":"pathology-2a-single-0163","type":"single","typeLabel":"单选题","number":163,"question":"良性肿瘤的异型性主要表现在","options":[{"key":"A","text":"细胞形态方面"},{"key":"B","text":"细胞形态和组织结构两方面均有明显异型性"},{"key":"C","text":"细胞形态和组织结构两方面均无异型性"},{"key":"D","text":"组织结构方面"},{"key":"E","text":"生长速度方面"}],"answerKeys":["D"],"answerText":["组织结构方面"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：肿瘤异型性的分类及良、恶性肿瘤在细胞异型性与组织结构异型性上的差别。\n解析：肿瘤的异型性包括细胞形态异型性和组织结构异型性。良性肿瘤分化程度较高，细胞形态常与起源组织相似，细胞异型性不明显；其异型性主要表现于组织结构方面，如细胞排列紊乱、层次不清、极向消失、腺体或纤维束结构不规则等。题眼是“良性肿瘤”和“主要表现”，若为恶性肿瘤则应选细胞形态和组织结构两方面均有明显异型性。\n选项分析：\nA. 错误：细胞形态方面明显异型性主要见于恶性肿瘤；良性肿瘤细胞形态异型性通常较轻或不明显。\nB. 错误：细胞形态和组织结构两方面均有明显异型性是恶性肿瘤的特点，不是良性肿瘤的主要表现。\nC. 错误：良性肿瘤虽然分化好，但并非完全没有异型性，常仍有一定程度的组织结构异型性。\nD. 正确：良性肿瘤的异型性主要看组织排列和结构紊乱，而细胞本身常较接近正常。\nE. 错误：生长速度属于肿瘤的生物学行为，不属于“异型性”的形态学分类指标。\n易混点：异型性小、分化好多提示良性；异型性大、细胞核多形性明显、核分裂象多尤其病理性核分裂象提示恶性。记忆要点：良性肿瘤“结构乱而细胞不太乱”，恶性肿瘤“结构和细胞都乱”。","chapter":6,"chapterName":"肿瘤","chapterTitle":"第6章 肿瘤"},{"id":"pathology-2a-single-0164","type":"single","typeLabel":"单选题","number":164,"question":"慢性轻度肝炎细胞坏死的特点是","options":[{"key":"A","text":"点状坏死"},{"key":"B","text":"灶性坏死"},{"key":"C","text":"碎片状坏死"},{"key":"D","text":"大块坏死"},{"key":"E","text":"溶解性坏死"}],"answerKeys":["A"],"answerText":["点状坏死"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：A\n核心考点：慢性轻度肝炎的肝细胞坏死以点状坏死为主，坏死范围小、界板基本完整。\n解析：慢性轻度肝炎（相当于慢性肝炎轻度，G1）时，肝细胞以变性为主，坏死较轻，典型表现为散在的单个或数个肝细胞坏死，伴局部炎细胞浸润，即点状坏死。其发生机制与病毒等致病因子的轻度持续损伤及免疫介导的肝细胞损伤有关。题眼是“慢性轻度”与“坏死特点”，应选范围小、程度轻的点状坏死；若出现明显碎片状坏死、桥接坏死则提示炎症活动度加重。\n选项分析：\nA. 正确：点状坏死是单个或数个肝细胞坏死，伴淋巴细胞等炎细胞浸润，常见于急性普通型肝炎及慢性轻度肝炎，符合本题“慢性轻度”的坏死特点。\nB. 错误：灶性坏死通常指较小范围但常累及多个肝细胞的坏死灶，范围较点状坏死大，更多用于描述活动性炎症坏死灶；它不是慢性轻度肝炎分级中最确切、最典型的坏死类型。\nC. 错误：碎片状坏死又称界面炎，指肝小叶周边界板处肝细胞坏死、炎细胞浸润，是慢性肝炎活动度和加重的重要指标，常见于中、重度慢性肝炎，不符合“轻度”特点。\nD. 错误：大块坏死指大片肝细胞坏死，见于重型肝炎，临床可有严重肝功能障碍甚至肝衰竭，与慢性轻度肝炎的轻微坏死不符。\nE. 错误：溶解性坏死是肝细胞坏死的形态学方式之一，表现为细胞溶解、结构消失，并非慢性轻度肝炎坏死范围/分布特点的分级术语；本题问的是坏死特点，应选点状坏死。\n易混点：点状坏死范围小，见于急性普通型肝炎和慢性轻度肝炎；碎片状坏死位于界板，是慢性肝炎活动度的关键指标；桥接坏死连接中央静脉与汇管区或汇管区之间，见于中重度慢性肝炎。记忆要点：轻度点状、活动碎片、重度桥接、重型大块。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-2a-single-0165","type":"single","typeLabel":"单选题","number":165,"question":"一般心肌缺血多长时间内，梗死的心肌细胞内糖原消失","options":[{"key":"A","text":"5分钟"},{"key":"B","text":"8分钟"},{"key":"C","text":"10分钟"},{"key":"D","text":"15分钟"},{"key":"E","text":"30分钟"}],"answerKeys":["E"],"answerText":["30分钟"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n核心考点：心肌梗死早期组织化学改变中，缺血心肌细胞糖原消失的时间窗。\n解析：心肌缺血后，细胞氧化磷酸化迅速受抑，ATP生成下降，糖原被消耗以维持无氧糖酵解；一般在缺血约30分钟时，梗死区心肌细胞内糖原明显减少或消失，是心肌梗死早期较敏感的组织化学改变之一。题眼是“糖原消失”的时间，而不是光镜下出现凝固性坏死、炎细胞浸润等改变的时间。光镜下典型心肌凝固性坏死通常需数小时才较明显，因此不能与30分钟这一早期代谢/组织化学改变混淆。\n选项分析：\nA. 错误：5分钟过短，此时缺血可开始出现代谢异常，但尚未达到常规描述的梗死心肌糖原消失时间点。\nB. 错误：8分钟无此标准记忆点，不符合一般病理学所述心肌缺血后糖原消失的时间。\nC. 错误：10分钟仍偏早，属于缺血极早期，不能作为梗死心肌糖原消失的代表性时间。\nD. 错误：15分钟不是本题所考查的标准时间，易与可逆性损伤的早期生化改变混淆。\nE. 正确：约30分钟缺血后，梗死心肌细胞内糖原减少或消失，是心肌梗死早期组织化学改变的重要表现。\n易混点：糖原消失约30分钟，光镜下凝固性坏死和炎症反应出现较晚；前者是早期组织化学改变，后者是较后期形态学改变。记忆要点：心梗“30分钟糖原消，4～12小时见坏死”。","chapter":9,"chapterName":"心血管系统疾病","chapterTitle":"第9章 心血管系统疾病"},{"id":"pathology-2a-single-0166","type":"single","typeLabel":"单选题","number":166,"question":"肉瘤的肉眼特点通常为","options":[{"key":"A","text":"结节状、有包膜，切面灰白质硬"},{"key":"B","text":"结节状、有包膜，切面灰白质软"},{"key":"C","text":"分叶状，可有或无包膜，切面灰红或粉红色，质硬"},{"key":"D","text":"形状不定，切面灰白色，质硬，干燥"},{"key":"E","text":"不规则结节状，有无完整包膜不定，切面灰红色，湿润质软如鱼肉状"}],"answerKeys":["E"],"answerText":["不规则结节状，有无完整包膜不定，切面灰红色，湿润质软如鱼肉状"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n核心考点：肉瘤的典型肉眼形态为切面灰红、湿润、质软如鱼肉状，常伴出血坏死。\n解析：肉瘤来源于间叶组织，生长较快、血供丰富、间质较少，故肉眼常呈不规则结节状，有无完整包膜不定，切面灰红色、湿润、质软，状似鱼肉，并可见出血和坏死。题眼是“肉瘤”与“癌”的肉眼鉴别：癌多灰白、质硬、干燥；肉瘤多灰红、质软、湿润。\n选项分析：\nA. 错误：结节状、有包膜、切面灰白质硬多见于良性肿瘤或纤维瘤等，不符合肉瘤质软、灰红、鱼肉状的特点。\nB. 错误：有包膜、灰白质软也不是肉瘤典型表现，更偏向某些良性肿瘤伴黏液变性或富含细胞，但不能概括肉瘤。\nC. 错误：分叶状、灰红或粉红但质硬，质地不符合肉瘤；可见于某些良性肿瘤或淋巴瘤等病变，不是肉瘤典型肉眼形态。\nD. 错误：形状不定、切面灰白、质硬、干燥是癌尤其是纤维性癌的典型特点，不是肉瘤特点。\nE. 正确：肉瘤常呈不规则结节状，可无完整包膜或仅有假包膜，切面灰红色、湿润、质软如鱼肉状，符合间叶来源、血供丰富、间质少和易出血坏死的病理特点。\n易混点：癌与肉瘤的肉眼鉴别可记为“癌白硬干、肉瘤红软湿”；肉瘤的包膜多为压迫形成的假包膜，并非真正包膜，且易经血道转移。","chapter":6,"chapterName":"肿瘤","chapterTitle":"第6章 肿瘤"},{"id":"pathology-2a-single-0167","type":"single","typeLabel":"单选题","number":167,"question":"乳腺小叶原位癌的特点是","options":[{"key":"A","text":"癌细胞局限于小叶腺泡内"},{"key":"B","text":"癌细胞局限于导管内"},{"key":"C","text":"癌细胞丰富、间质少"},{"key":"D","text":"纤维间质丰富，癌细胞少"},{"key":"E","text":"癌细胞与间质大致相等"}],"answerKeys":["A"],"answerText":["癌细胞局限于小叶腺泡内"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：A\n核心考点：乳腺小叶原位癌的癌细胞局限于小叶腺泡内，未突破基底膜，属于非浸润性癌。\n解析：乳腺小叶原位癌的病理学实质是癌细胞局限于小叶内末梢腺泡及腺管，腺泡可扩张，但基底膜完整，癌细胞不突破基底膜进入间质，因此不形成间质性浸润。其题眼是“小叶腺泡内”，强调部位和“原位”性质。临床上常无明显肿块，可为多中心性或双侧性，激素受体常阳性，E-cadherin常阴性，可与导管原位癌鉴别。\n选项分析：\nA. 正确：癌细胞局限于小叶腺泡内，未突破基底膜，符合小叶原位癌的“原位”特点，为本题正确答案。\nB. 错误：癌细胞局限于导管内是乳腺导管原位癌的特点，病变位于导管系统而非小叶腺泡，部位不符。\nC. 错误：癌细胞丰富、间质少是髓样癌的特点，属于浸润性乳腺癌的间质比例描述，不是小叶原位癌的表现。\nD. 错误：纤维间质丰富、癌细胞少是硬癌的特点，间质明显增生并伴癌细胞浸润，不符合原位癌。\nE. 错误：癌细胞与间质大致相等是单纯癌的间质比例特点，也属于浸润性癌的分类描述，不能用于说明小叶原位癌。\n易混点：小叶原位癌的关键是“小叶腺泡内、基底膜完整、不浸润间质”；导管原位癌是“导管内”。髓样癌、硬癌、单纯癌是浸润性乳腺癌按癌细胞与间质比例的传统分型，分别对应间质少、间质多、间质与癌细胞大致相等，不要与小叶原位癌混淆。","chapter":14,"chapterName":"生殖系统和乳腺疾病","chapterTitle":"第14章 生殖系统和乳腺疾病"},{"id":"pathology-2a-single-0168","type":"single","typeLabel":"单选题","number":168,"question":"恶性肿瘤细胞主要通过下列哪种途径入血","options":[{"key":"A","text":"中等动脉"},{"key":"B","text":"淋巴管"},{"key":"C","text":"毛细血管和小静脉"},{"key":"D","text":"中等静脉"},{"key":"E","text":"小动脉"}],"answerKeys":["C"],"answerText":["毛细血管和小静脉"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：恶性肿瘤血道转移时，瘤细胞侵入血管的主要门户是毛细血管和小静脉。\n解析：恶性肿瘤细胞可侵袭局部薄壁血管，毛细血管和小静脉管壁薄、周围间质疏松，且肿瘤新生血管多，故瘤细胞最易由此入血，形成瘤栓后可随血流运行，常滞留于肺、肝等毛细血管床而发生血道转移。本题题眼是“入血途径”，应抓住血管壁厚度、血流压力和肿瘤新生血管特点，而不是笼统理解为“癌经淋巴道、肉瘤经血道”的转移倾向。\n选项分析：\nA. 错误：中等动脉管壁较厚、肌层明显，血流压力高，瘤细胞不易直接侵入，也不是恶性肿瘤入血的主要途径。\nB. 错误：淋巴管是淋巴道转移的主要途径，瘤细胞可进入淋巴管并在淋巴结形成转移，但本题问的是直接入血，不能把淋巴管作为主要入血途径。\nC. 正确：毛细血管和小静脉壁薄、压力较低，恶性肿瘤新生血管丰富，瘤细胞最易侵袭此处进入血液循环，是血道转移的主要入血部位。\nD. 错误：中等静脉虽属静脉系统，但管壁相对较厚，不如毛细血管和小静脉易于被瘤细胞穿透，不是主要入血门户。\nE. 错误：小动脉仍有较完整的平滑肌层和较高压力，瘤细胞侵入较困难，不是主要入血途径。\n易混点：癌常先经淋巴道转移，肉瘤常经血道转移，但“血道入血的门户”仍是毛细血管和小静脉；不要误选淋巴管或中等静脉。记忆要点：瘤细胞入血靠“薄壁低压”的毛细血管和小静脉，血行转移的常见靶器官是肺和肝。","chapter":6,"chapterName":"肿瘤","chapterTitle":"第6章 肿瘤"},{"id":"pathology-2a-single-0169","type":"single","typeLabel":"单选题","number":169,"question":"光镜下见病灶中央为纤维素样坏死，周围有增生的Aschoff细胞，该病灶应称为","options":[{"key":"A","text":"结核结节"},{"key":"B","text":"假结核结节"},{"key":"C","text":"伤寒小结"},{"key":"D","text":"风湿小结"},{"key":"E","text":"小胶质细胞结节"}],"answerKeys":["D"],"answerText":["风湿小结"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：风湿小结（Aschoff小体）的病理形态学特征及其与风湿病的关系。\n解析：风湿小结是风湿病增生期具有诊断意义的病变，典型结构为病灶中央发生纤维素样坏死，周围有增生的Aschoff细胞（风湿细胞）及少量淋巴细胞、单核细胞。Aschoff细胞体积较大，胞质丰富，核染色质聚集于中央，呈枭眼状或毛虫状，来源于巨噬细胞。本题题眼是“中央纤维素样坏死＋周围增生Aschoff细胞”，这是风湿小结的标准描述，因此应选D。\n选项分析：\nA. 错误：结核结节为结核病的特征性肉芽肿，中央常为干酪样坏死，周围为上皮样细胞、Langhans巨细胞及淋巴细胞，不见Aschoff细胞和典型纤维素样坏死。\nB. 错误：假结核结节主要见于血吸虫病虫卵肉芽肿，中央可见虫卵或坏死物质，周围为上皮样细胞及异物巨细胞，属于寄生虫性肉芽肿，不是Aschoff细胞构成的病灶。\nC. 错误：伤寒小结由吞噬伤寒杆菌、红细胞和细胞碎片的巨噬细胞（伤寒细胞）聚集形成，镜下以伤寒细胞增生为主，无中央纤维素样坏死和Aschoff细胞。\nD. 正确：风湿小结中央为纤维素样坏死，周围有Aschoff细胞增生，符合风湿病增生期病变，故本题正确答案为D。\nE. 错误：小胶质细胞结节见于中枢神经系统病毒性脑炎等病变，由小胶质细胞增生聚集形成，常位于脑实质内，与纤维素样坏死及Aschoff细胞无关。\n易混点：风湿小结与结核结节、伤寒小结均属肉芽肿性病变，但成分不同。记忆要点：风湿小结看“纤维素样坏死＋Aschoff细胞”；结核结节看“干酪样坏死＋上皮样细胞和Langhans巨细胞”；伤寒小结看“伤寒细胞聚集”。","chapter":9,"chapterName":"心血管系统疾病","chapterTitle":"第9章 心血管系统疾病"},{"id":"pathology-2a-single-0170","type":"single","typeLabel":"单选题","number":170,"question":"胃窦部黏膜组织活检，镜下如图所示，胃黏膜发生的有关病变的描述，错误的是","options":[{"key":"A","text":"黏膜腺体中度肠上皮化生"},{"key":"B","text":"这种分化上的转向，只发生于同源细胞之间"},{"key":"C","text":"可分为不完全肠化和完全肠化"},{"key":"D","text":"该化生对机体有利，不会发生恶变"},{"key":"E","text":"该化生可恶变形成肠型腺癌"}],"answerKeys":["D"],"answerText":["该化生对机体有利，不会发生恶变"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：胃黏膜肠上皮化生的概念、分型及其癌前病变性质。\n解析：题目图片未提供，仅依据文字信息分析，不编造图像细节。胃黏膜肠上皮化生是指胃黏膜上皮被肠型上皮取代，属于化生性病变；化生虽可暂时增强上皮对刺激的耐受，但并非“有利且不会恶变”。肠上皮化生是胃癌特别是肠型腺癌的重要癌前病变，尤其不完全性大肠型化生恶变风险较高。本题题眼是“错误的是”，D将肠化说成有利且不会恶变，明显违背其癌前病变性质。\n选项分析：\nA. 正确：胃黏膜活检可见腺体肠上皮化生，按累及范围可分为轻、中、重度；“中度”需结合原图判断，但该表述本身符合肠化的病理诊断思路。\nB. 正确：化生通常是分化成熟的一种细胞类型被另一种分化成熟细胞类型替代，常发生于同源细胞之间；本题指胃黏膜柱状上皮向肠型柱状上皮分化转向，不跨越胚层。\nC. 正确：肠上皮化生可分为完全性肠化（小肠型）和不完全性肠化（大肠型/结肠型），后者与胃癌关系更密切。\nD. 错误：肠上皮化生不是单纯有利的适应性改变，而是癌前病变之一，可伴异型增生并进展为胃癌，因此“不会发生恶变”错误。\nE. 正确：肠上皮化生可经异型增生发展为肠型腺癌，符合慢性萎缩性胃炎—肠化—异型增生—肠型胃癌的经典发生模式。\n易混点：完全性肠化多类似小肠上皮，恶变风险相对较低；不完全性大肠型肠化黏液成分异常，恶变风险较高。化生是分化成熟的细胞类型替代，异型增生是上皮细胞异型性增加，两者可并存但概念不同。记忆要点：胃黏膜肠化是癌前病变，不是无害适应。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病","needsImage":true},{"id":"pathology-2a-single-0171","type":"single","typeLabel":"单选题","number":171,"question":"下列变化属于坏死的病理改变的是","options":[{"key":"A","text":"细胞体积肿大，胞浆内有红染颗粒"},{"key":"B","text":"细胞体积缩小，胞浆内有脂褐素颗粒"},{"key":"C","text":"细胞核膜破裂，染色质崩解为小碎片"},{"key":"D","text":"细胞核增大，细胞核的DNA含量增加"},{"key":"E","text":"细胞体积正常或稍大，出现双核"}],"answerKeys":["C"],"answerText":["细胞核膜破裂，染色质崩解为小碎片"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：坏死的基本病理改变是细胞核的不可逆性改变，包括核固缩、核碎裂和核溶解。\n解析：坏死细胞最特征性的改变在细胞核。C项“核膜破裂，染色质崩解为小碎片”即核碎裂，属于坏死时细胞核的典型改变之一，可与核固缩、核溶解共同出现。题眼是“坏死”，应抓住细胞核的不可逆损伤，而不是细胞体积变化或可逆性损伤表现。\n选项分析：\nA. 错误：细胞体积肿大、胞浆内出现红染颗粒多提示细胞水肿等可逆性损伤，尚未达到坏死程度。\nB. 错误：细胞体积缩小、胞浆内有脂褐素颗粒是萎缩的典型表现，脂褐素为萎缩细胞内残留体，不是坏死改变。\nC. 正确：核膜破裂、染色质崩解为小碎片即核碎裂，是坏死时细胞核的典型改变。\nD. 错误：细胞核增大、DNA含量增加多见于细胞增生、再生或肿瘤性增生，不是坏死的核改变。\nE. 错误：细胞体积正常或稍大、出现双核常见于代偿性增生或再生，如肝细胞增生，不属于坏死。\n易混点：坏死与萎缩、细胞水肿均可见细胞形态改变，但坏死的关键是细胞核不可逆改变；萎缩看细胞体积缩小和脂褐素，细胞水肿看体积肿大和胞浆疏松淡染。凋亡也可有核固缩、核碎裂，但形成凋亡小体且一般无明显炎症反应，坏死则常伴细胞膜破裂和炎症。","chapter":1,"chapterName":"细胞和组织的适应与损伤","chapterTitle":"第1章 细胞和组织的适应与损伤"},{"id":"pathology-2a-single-0172","type":"single","typeLabel":"单选题","number":172,"question":"下列哪种栓塞不会引起猝死","options":[{"key":"A","text":"颈内动脉栓塞"},{"key":"B","text":"冠状动脉栓塞"},{"key":"C","text":"肺动脉口栓塞"},{"key":"D","text":"肺动脉较大分支栓塞"},{"key":"E","text":"肾动脉栓塞"}],"answerKeys":["E"],"answerText":["肾动脉栓塞"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n核心考点：不同部位动脉栓塞的临床后果及猝死风险，重点掌握栓塞发生于生命重要器官或阻塞关键血流通道时可致猝死。\n解析：猝死常见于栓子阻塞心、脑、肺等重要器官或关键血管，导致急性心泵衰竭、严重心律失常、脑疝或急性肺循环障碍。肾动脉栓塞主要引起肾组织缺血性梗死，单侧病变通常表现为腰痛、血尿、肾功能指标异常等，一般不会立即危及生命。本题题眼是“不会引起猝死”，应选择非生命关键通道且通常不导致急性循环衰竭的肾动脉栓塞。\n\n选项分析：\nA. 错误：颈内动脉栓塞可导致大面积脑梗死，引起严重脑水肿、颅内压增高甚至脑疝，也可因重要脑区缺血而猝死。\nB. 错误：冠状动脉栓塞可引起急性心肌缺血、心肌梗死，易发生心室颤动、心源性休克而猝死。\nC. 错误：肺动脉口栓塞可阻塞右心室流出道，使心输出量骤降，引起急性右心衰竭和猝死，是典型猝死性栓塞。\nD. 错误：肺动脉较大分支栓塞可突然增加肺循环阻力，导致急性右心衰竭、严重缺氧和反射性心跳骤停，也可猝死。\nE. 正确：肾动脉栓塞主要引起肾梗死，单侧肾动脉栓塞一般不会立即造成致命性循环障碍，故通常不引起猝死。\n\n易混点：肺动脉小分支栓塞多无明显症状或仅引起肺出血性梗死，而肺动脉较大分支或骑跨于肺动脉口的栓塞常可猝死。肾动脉栓塞引起贫血性梗死，需与肾静脉血栓形成鉴别，后者可导致肾淤血、肿胀，但考试中“猝死性栓塞”的重点仍是心、脑、肺相关栓塞。","chapter":3,"chapterName":"局部血液循环障碍","chapterTitle":"第3章 局部血液循环障碍"},{"id":"pathology-2a-single-0173","type":"single","typeLabel":"单选题","number":173,"question":"多发生在青年妇女的霍奇金淋巴瘤是","options":[{"key":"A","text":"结节硬化型"},{"key":"B","text":"富于淋巴细胞的经典型"},{"key":"C","text":"混合细胞型"},{"key":"D","text":"淋巴细胞减少型"},{"key":"E","text":"结节性淋巴细胞为主型"}],"answerKeys":["A"],"answerText":["结节硬化型"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：A\n核心考点：霍奇金淋巴瘤各组织学亚型的年龄、性别和临床病理特点，其中结节硬化型最常发生于青年妇女。\n解析：结节硬化型是经典型霍奇金淋巴瘤最常见的亚型，好发于青年女性，常累及颈部淋巴结和纵隔。其病理学特点是增生的纤维组织将淋巴组织分隔成结节状，结节内可见陷窝细胞，典型Reed-Sternberg细胞较少。该型预后相对较好，但纵隔大肿块者可出现压迫症状。\n选项分析：\nA. 正确：结节硬化型好发于青年妇女，常累及颈部及纵隔，镜下见胶原纤维带分隔结节、陷窝细胞，符合题意。\nB. 错误：富于淋巴细胞的经典型霍奇金淋巴瘤多属早期、预后较好，但并非题目所强调的“青年妇女”代表性亚型；其病变以大量小淋巴细胞为背景，典型RS细胞少。\nC. 错误：混合细胞型常与EBV感染相关，多见于中老年或儿童，男性较多，常有全身症状，预后较结节硬化型差，不是青年妇女的典型亚型。\nD. 错误：淋巴细胞减少型多见于老年人，常与EBV、HIV感染相关，病变中淋巴细胞显著减少、RS细胞较多，预后最差。\nE. 错误：结节性淋巴细胞为主型是独立于经典型的霍奇金淋巴瘤类型，男性较多见，呈惰性经过，典型细胞为“爆米花细胞”，免疫表型为CD20+、CD45+、CD15-、CD30-。\n易混点：结节硬化型属于经典型霍奇金淋巴瘤，好发青年女性；结节性淋巴细胞为主型虽名称含“结节”，但不是经典型，男性较多且CD20+、CD30-。记忆要点：青年妇女、纵隔受累、纤维带分隔和陷窝细胞→结节硬化型。","chapter":12,"chapterName":"淋巴造血系统疾病","chapterTitle":"第12章 淋巴造血系统疾病"},{"id":"pathology-2a-single-0174","type":"single","typeLabel":"单选题","number":174,"question":"下列哪种肿瘤的恶性型归入癌","options":[{"key":"A","text":"腺瘤"},{"key":"B","text":"纤维瘤"},{"key":"C","text":"脂肪瘤"},{"key":"D","text":"滑膜瘤"},{"key":"E","text":"血管瘤"}],"answerKeys":["A"],"answerText":["腺瘤"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：A\n核心考点：癌是上皮组织来源的恶性肿瘤，腺瘤为腺上皮良性肿瘤，其恶性型为腺癌，故归入癌。\n解析：肿瘤命名的一般规律是：上皮组织来源的良性肿瘤称“瘤”，恶性者称“癌”；间叶组织来源的良性肿瘤称“瘤”，恶性者称“肉瘤”。腺瘤来源于腺上皮，属于上皮性良性肿瘤，其恶性对应病变是腺癌，因此归入癌。本题题眼是“恶性型归入癌”，即判断该良性肿瘤的来源是否为上皮组织。\n\n选项分析：\nA. 正确：腺瘤是腺上皮来源的良性肿瘤，恶性型为腺癌，腺癌属于癌，符合题意。\nB. 错误：纤维瘤是纤维结缔组织来源的良性肿瘤，恶性型为纤维肉瘤，属于间叶组织来源的肉瘤，不归入癌。\nC. 错误：脂肪瘤是脂肪组织来源的良性肿瘤，恶性型为脂肪肉瘤，属于肉瘤，不归入癌。\nD. 错误：滑膜瘤/滑膜性病变的恶性型为滑膜肉瘤，属于软组织肉瘤，不归入癌；滑膜肉瘤虽名称含“滑膜”，但分类上属肉瘤。\nE. 错误：血管瘤是血管内皮或血管组织来源的良性肿瘤，恶性型为血管肉瘤，属于肉瘤，不归入癌。\n\n易混点：记忆关键是“上皮恶性称癌，间叶恶性称肉瘤”。腺瘤、乳头状瘤、息肉状腺瘤等上皮来源良性病变的恶性型分别对应腺癌、乳头状癌等；纤维瘤、脂肪瘤、血管瘤、滑膜肉瘤等间叶来源者恶性型归入肉瘤。注意“瘤”不一定都是良性，如淋巴瘤、黑色素瘤、精原细胞瘤等为恶性肿瘤的特殊命名，需单独记忆。","chapter":6,"chapterName":"肿瘤","chapterTitle":"第6章 肿瘤"},{"id":"pathology-2a-single-0175","type":"single","typeLabel":"单选题","number":175,"question":"肉芽组织转化为瘢痕组织的过程，下列哪项是错误的","options":[{"key":"A","text":"毛细血管闭塞、数目减少"},{"key":"B","text":"胶原纤维增多"},{"key":"C","text":"成纤维细胞减少"},{"key":"D","text":"炎细胞增多"},{"key":"E","text":"间质的水分逐渐吸收减少"}],"answerKeys":["D"],"answerText":["炎细胞增多"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：肉芽组织成熟并转化为瘢痕组织的过程，本质是血管和炎细胞减少、成纤维细胞减少、胶原纤维增多及间质水分减少。\n解析：肉芽组织由新生毛细血管、成纤维细胞和炎细胞组成，并含较多间质水分。随着修复进展，肉芽组织逐渐成熟为瘢痕组织：毛细血管闭塞并减少，成纤维细胞逐渐减少，胶原纤维合成增多并致密化，炎细胞逐渐减少，间质水分被吸收。本题题眼是“转化为瘢痕组织时炎细胞的动态变化”，应为减少而非增多，故D错误。\n选项分析：\nA. 正确：肉芽组织中丰富的新生毛细血管逐渐闭塞、退化，数目减少，符合向瘢痕组织转化。\nB. 正确：成纤维细胞产生胶原纤维，成熟过程中胶原纤维逐渐增多并变得致密，形成瘢痕组织的主要成分。\nC. 正确：随着修复成熟，成纤维细胞逐渐减少，由活跃合成转向静止，瘢痕中细胞成分较肉芽组织明显减少。\nD. 错误：肉芽组织向瘢痕组织转化时炎细胞应逐渐减少，而不是增多；炎细胞增多常见于感染、炎症活动期或肉芽组织早期。\nE. 正确：间质水分逐渐吸收减少，组织由疏松、湿润的肉芽组织变为较致密、干燥的瘢痕组织。\n易混点：肉芽组织富含新生毛细血管、成纤维细胞和炎细胞；瘢痕组织以致密胶原纤维为主，血管和细胞少。注意“肉芽组织”不是“肉芽肿”，前者是修复性组织，后者是炎症性结节。","chapter":2,"chapterName":"损伤的修复","chapterTitle":"第2章 损伤的修复"},{"id":"pathology-2a-single-0176","type":"single","typeLabel":"单选题","number":176,"question":"霍奇金淋巴瘤按预后好坏，排列顺序为","options":[{"key":"A","text":"混合细胞型，淋巴细胞减少型，结节硬化型，淋巴细胞为主型"},{"key":"B","text":"淋巴细胞为主型，结节硬化型，淋巴细胞减少型，混合细胞型"},{"key":"C","text":"淋巴细胞减少型，混合细胞型，结节硬化型，淋巴细胞为主型"},{"key":"D","text":"淋巴细胞为主型，结节硬化型，混合细胞型，淋巴细胞减少型"},{"key":"E","text":"淋巴细胞减少型，淋巴细胞为主型，结节硬化型，混合细胞型"}],"answerKeys":["D"],"answerText":["淋巴细胞为主型，结节硬化型，混合细胞型，淋巴细胞减少型"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：经典型霍奇金淋巴瘤各组织学亚型的预后排序，即淋巴细胞为主型最好，淋巴细胞减少型最差。\n解析：霍奇金淋巴瘤的预后与组织学亚型密切相关。淋巴细胞为主型中淋巴细胞多、R-S细胞少，免疫功能相对较好，预后最佳；结节硬化型以胶原纤维带分隔结节、好发青年女性纵隔，预后较好；混合细胞型可见淋巴细胞、嗜酸性粒细胞、浆细胞和组织细胞混合浸润，R-S细胞较多，预后较差；淋巴细胞减少型淋巴细胞显著减少、R-S细胞或多形性细胞增多，多见于老年人，进展快，预后最差。题眼是“按预后好坏排列”，记忆要点为：淋巴细胞越多预后越好，淋巴细胞越少预后越差。\n\n选项分析：\nA. 错误：把混合细胞型列为首位、淋巴细胞减少型列为第二位，完全不符合预后由好到差的顺序；混合细胞型仅居中，淋巴细胞减少型最差。\nB. 错误：前两项“淋巴细胞为主型、结节硬化型”正确，但后两项颠倒；混合细胞型预后应优于淋巴细胞减少型，而不是最后。\nC. 错误：该顺序基本为从最差到最好倒置排列；淋巴细胞减少型不是预后最好，淋巴细胞为主型也不是预后最差。\nD. 正确：淋巴细胞为主型预后最好，其次结节硬化型，再次混合细胞型，淋巴细胞减少型预后最差，符合标准答案。\nE. 错误：把淋巴细胞减少型置于首位、混合细胞型置于末位，既不符合各亚型形态学特点，也不符合临床预后规律。\n\n易混点：淋巴细胞为主型/淋巴细胞丰富型预后好，淋巴细胞减少型预后差；结节硬化型虽可见明显纤维化，但预后在经典型霍奇金淋巴瘤中相对较好。不要将“结节硬化型”误认为最差，也不要将“混合细胞型”与“淋巴细胞减少型”的预后顺序颠倒。","chapter":12,"chapterName":"淋巴造血系统疾病","chapterTitle":"第12章 淋巴造血系统疾病"},{"id":"pathology-2a-single-0177","type":"single","typeLabel":"单选题","number":177,"question":"下列哪项是Goodpasture综合征的主要病变","options":[{"key":"A","text":"肺出血合并肾盂肾炎"},{"key":"B","text":"肺出血合并肾小管坏死"},{"key":"C","text":"肺出血合并肾小球肾炎"},{"key":"D","text":"肺水肿合并肾小球肾炎"},{"key":"E","text":"肺出血合并肾衰竭"}],"answerKeys":["C"],"answerText":["肺出血合并肾小球肾炎"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n\n核心考点：Goodpasture综合征即肺出血-肾炎综合征，本质是抗肾小球基底膜抗体介导的肺出血合并肾小球肾炎。\n\n解析：Goodpasture综合征患者体内产生抗肾小球基底膜（GBM）抗体，该抗体与肾小球基底膜和肺泡基底膜发生交叉免疫反应，导致肺毛细血管出血和肾小球损伤。肾脏病变典型为Ⅰ型急进性肾小球肾炎，免疫荧光示IgG沿肾小球基底膜呈线状沉积；肺部表现为反复咯血、肺泡内出血。题眼是“肺出血合并肾小球肾炎”，强调肺与肾小球基底膜共同受累，而不是单纯肾衰竭或肾小管坏死。\n\n选项分析：\nA. 错误：肺出血合并肾盂肾炎不是Goodpasture综合征。肾盂肾炎是肾盂、肾间质的化脓性炎症，主要与尿路感染有关，不符合抗GBM抗体介导的肾小球病变。\nB. 错误：肺出血合并肾小管坏死不符合本病主要病变。肾小管坏死常见于缺血、中毒等急性肾小管损伤，而Goodpasture综合征的原发肾病变在肾小球基底膜。\nC. 正确：肺出血合并肾小球肾炎是Goodpasture综合征的核心病变。抗GBM抗体同时攻击肺泡和肾小球基底膜，形成肺出血和急进性肾小球肾炎。\nD. 错误：肺水肿合并肾小球肾炎不是本病典型组合。肺水肿可由心源性或非心源性原因引起，而Goodpasture综合征的肺部主要病变是肺泡出血，不是单纯肺水肿。\nE. 错误：肺出血合并肾衰竭虽可见于本病晚期或严重病例，但肾衰竭是肾小球肾炎进展后的功能结果，不是主要病变组合；本题问的是主要病变，应选肺出血合并肾小球肾炎。\n\n易混点：Goodpasture综合征应与ANCA相关性血管炎所致肺出血-肾炎综合征鉴别，前者免疫荧光为IgG沿GBM线状沉积，后者多为寡免疫复合物沉积。记忆要点：Goodpasture＝抗GBM抗体＋肺出血＋急进性肾小球肾炎。","chapter":13,"chapterName":"泌尿系统疾病","chapterTitle":"第13章 泌尿系统疾病"},{"id":"pathology-2a-single-0178","type":"single","typeLabel":"单选题","number":178,"question":"毛玻璃样肝细胞内嗜酸性颗粒的成分是","options":[{"key":"A","text":"包涵体"},{"key":"B","text":"凋亡小体"},{"key":"C","text":"细胞内玻璃样变性"},{"key":"D","text":"内质网池"},{"key":"E","text":"HBsAg"}],"answerKeys":["E"],"answerText":["HBsAg"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n核心考点：毛玻璃样肝细胞胞质内嗜酸性细颗粒的本质是乙型肝炎表面抗原（HBsAg）蓄积。\n解析：毛玻璃样肝细胞常见于慢性乙型肝炎及HBsAg携带者，光镜下肝细胞胞质内充满均匀淡染、细颗粒状嗜酸性物质，使胞质呈毛玻璃样外观。电镜下这些物质主要位于增生的滑面内质网池内，其成分为HBsAg，故本题题眼是“毛玻璃样肝细胞＋嗜酸性颗粒成分”。HBsAg蓄积反映乙肝病毒表面抗原在肝细胞内的过度产生和滞留，是慢性乙肝常见形态学线索之一。\n选项分析：\nA. 错误：包涵体是病毒等病原体感染时在细胞内形成的异常结构，可为核内或胞质内包涵体；毛玻璃样肝细胞内的颗粒本质是HBsAg，并非一般意义上的包涵体。\nB. 错误：凋亡小体在肝病中常指嗜酸性小体（Councilman小体），是单个肝细胞凋亡后胞质浓缩、嗜酸性增强形成的圆形小体，与毛玻璃样肝细胞的弥漫细颗粒状胞质不同。\nC. 错误：细胞内玻璃样变性是形态学描述，指细胞内出现均质红染玻璃样物质；毛玻璃样肝细胞虽可归入此类形态改变，但题目问“嗜酸性颗粒的成分”，应具体答HBsAg，不能以变性名称代替成分。\nD. 错误：滑面内质网池是HBsAg蓄积的部位和电镜下结构基础，不是嗜酸性颗粒本身的成分；考试中常以“内质网池”作干扰项。\nE. 正确：毛玻璃样肝细胞胞质内嗜酸性细颗粒为HBsAg，电镜下位于增生的滑面内质网池内，是慢性乙型肝炎的重要形态学表现。\n易混点：毛玻璃样肝细胞内的HBsAg颗粒要与病毒性肝炎中的嗜酸性小体（凋亡小体）区分：前者为胞质弥漫细颗粒状、HBsAg阳性，后者为单个肝细胞凋亡形成的强嗜酸性圆形小体。记忆要点：毛玻璃样肝细胞＝HBsAg蓄积于滑面内质网。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-2a-single-0179","type":"single","typeLabel":"单选题","number":179,"question":"如图所见血栓可见于","options":[{"key":"A","text":"静脉内柱状血栓的尾部"},{"key":"B","text":"毛细血管内"},{"key":"C","text":"急性风湿性心内膜炎的瓣膜闭锁缘"},{"key":"D","text":"动脉血栓的头部"},{"key":"E","text":"左心房球形血栓"}],"answerKeys":["E"],"answerText":["左心房球形血栓"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n核心考点：血栓的类型及其好发部位，尤其是混合血栓与左心房球形血栓的对应关系。\n解析：题目图片未提供，仅依据文字和标准答案分析。左心房球形血栓多发生于二尖瓣狭窄伴心房颤动时，因左心房扩大、血流淤滞而形成，通常为混合血栓，可呈层状结构，并可阻塞二尖瓣口。本题题眼是“如图所见血栓”的类型判断，若图示为混合血栓，则最符合左心房球形血栓。混合血栓常见于血流较慢且有涡流形成的部位，如静脉延续性血栓体部、心房内球形血栓等。\n选项分析：\nA. 错误：静脉内柱状血栓的尾部通常为红色血栓，由纤维蛋白网罗大量红细胞构成，属于血栓的尾部，不是图示所对应的混合血栓。\nB. 错误：毛细血管内血栓属于透明血栓，主要由纤维蛋白构成，常见于弥散性血管内凝血，血栓微小，不是左心房球形血栓。\nC. 错误：急性风湿性心内膜炎时，瓣膜闭锁缘形成的疣状赘生物本质为白色血栓，主要由血小板和纤维蛋白构成，不是混合血栓。\nD. 错误：动脉血栓的头部通常为白色血栓，由血小板小梁和少量纤维蛋白构成，见于血流较快的动脉内，不是图示对应的混合血栓。\nE. 正确：左心房球形血栓常为混合血栓，好发于二尖瓣狭窄、心房颤动等血流淤滞情况，可阻塞房室瓣口，符合本题标准答案。\n易混点：记忆血栓类型与部位：白色血栓见于心瓣膜、心腔和动脉血栓头部；混合血栓见于静脉血栓体部及心房球形血栓；红色血栓见于静脉血栓尾部；透明血栓见于毛细血管等微循环。口诀可记“白头、混体、红尾、透明微”。","chapter":3,"chapterName":"局部血液循环障碍","chapterTitle":"第3章 局部血液循环障碍","needsImage":true},{"id":"pathology-2a-single-0180","type":"single","typeLabel":"单选题","number":180,"question":"下述关于风湿性心内膜炎的叙述中，哪项是正确的","options":[{"key":"A","text":"瓣膜赘生物内有细菌"},{"key":"B","text":"瓣膜赘生物牢固粘连"},{"key":"C","text":"受累瓣膜容易发生穿孔、破裂"},{"key":"D","text":"受累瓣膜以三尖瓣多见"},{"key":"E","text":"赘生物位于房室瓣心室面"}],"answerKeys":["B"],"answerText":["瓣膜赘生物牢固粘连"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：风湿性心内膜炎的赘生物为无菌性白色血栓，位于瓣膜闭锁缘且附着牢固、不易脱落。\n解析：风湿性心内膜炎属于风湿病的变态反应性炎症，常累及二尖瓣，其次为主动脉瓣。病变瓣膜闭锁缘形成粟粒大小、灰白色半透明的疣状赘生物，本质上为血小板和纤维素构成的白色血栓，不含细菌，与瓣膜组织结合较牢固，不易脱落，故栓塞少见。题眼是“风湿性心内膜炎”与“感染性心内膜炎”的鉴别：前者无菌、牢固、不易穿孔；后者含菌、松软易脱落，可致栓塞和瓣膜破坏。\n选项分析：\nA. 错误：风湿性心内膜炎的赘生物为无菌性白色血栓，内无细菌；赘生物内有细菌主要见于感染性心内膜炎。\nB. 正确：风湿性心内膜炎的疣状赘生物附着于瓣膜闭锁缘，与瓣膜粘连牢固，不易脱落，这是其重要形态学特点。\nC. 错误：受累瓣膜容易发生穿孔、破裂是感染性心内膜炎的破坏性病变特点；风湿性心内膜炎一般不引起瓣膜穿孔和破裂，后期多为瓣膜增厚、粘连、变形。\nD. 错误：风湿性心内膜炎最常累及二尖瓣，也可累及主动脉瓣，三尖瓣并非多见部位。\nE. 错误：风湿性心内膜炎累及房室瓣时，赘生物位于瓣膜闭锁缘的心房面，而非心室面；该位置与血流冲击和闭锁缘损伤有关。\n易混点：风湿性心内膜炎与感染性心内膜炎最易混淆。记忆要点：风湿性者为“无菌、疣状、牢固、闭锁缘、少栓塞”；感染性者为“有菌、息肉状或菜花状、松软易脱落、可穿孔破裂、易栓塞”。","chapter":9,"chapterName":"心血管系统疾病","chapterTitle":"第9章 心血管系统疾病"},{"id":"pathology-2a-single-0181","type":"single","typeLabel":"单选题","number":181,"question":"动脉粥样硬化脂纹病变中主要的细胞成分是","options":[{"key":"A","text":"单核细胞"},{"key":"B","text":"T淋巴细胞"},{"key":"C","text":"泡沫细胞"},{"key":"D","text":"平滑肌细胞"},{"key":"E","text":"中性粒细胞"}],"answerKeys":["C"],"answerText":["泡沫细胞"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：动脉粥样硬化早期脂纹的主要细胞成分是泡沫细胞。\n解析：脂纹是动脉粥样硬化的早期病变，肉眼呈黄色条纹，镜下主要表现为内膜下大量泡沫细胞聚集。泡沫细胞由巨噬细胞吞噬氧化型LDL后形成，也可由平滑肌细胞吞噬脂质形成，因此脂纹的主要细胞成分是泡沫细胞。本题题眼是“脂纹病变”和“主要细胞成分”，应选泡沫细胞而非其来源细胞。\n\n选项分析：\nA. 错误：单核细胞可黏附并进入内膜，是巨噬细胞的前体，也是泡沫细胞的重要来源之一，但脂纹中主要见到的已是吞噬脂质后的泡沫细胞，不是以单核细胞为主。\nB. 错误：T淋巴细胞可见于动脉粥样硬化斑块的炎症反应中，参与免疫炎症机制，但不是脂纹病变的主要细胞成分。\nC. 正确：脂纹由内膜下泡沫细胞聚集形成，泡沫细胞胞质内充满脂质空泡，是早期动脉粥样硬化最具代表性的细胞成分。\nD. 错误：平滑肌细胞可迁移至内膜并吞噬脂质形成肌源性泡沫细胞，也参与纤维帽形成，但脂纹的主要细胞成分是泡沫细胞，不能仅答平滑肌细胞。\nE. 错误：中性粒细胞主要见于急性炎症，动脉粥样硬化属于慢性炎症性/脂质性病变，脂纹中不以中性粒细胞为主。\n\n易混点：脂纹与粥样斑块要区分：脂纹以泡沫细胞聚集为主，属早期可逆性病变；粥样斑块则可见脂质池、坏死物质、胆固醇结晶、纤维帽及炎症细胞。泡沫细胞有两个来源：巨噬细胞源性和平滑肌细胞源性，记忆为“脂纹看泡沫，斑块看纤维帽和脂质池”。","chapter":9,"chapterName":"心血管系统疾病","chapterTitle":"第9章 心血管系统疾病"},{"id":"pathology-2a-single-0182","type":"single","typeLabel":"单选题","number":182,"question":"慢性硬化性肾小球肾炎的晚期发生高血压的最主要原因是","options":[{"key":"A","text":"肾小球滤过率减少"},{"key":"B","text":"少尿"},{"key":"C","text":"肾小管重吸收增加"},{"key":"D","text":"肾素分泌增加"},{"key":"E","text":"高脂血症"}],"answerKeys":["D"],"answerText":["肾素分泌增加"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：慢性硬化性肾小球肾炎晚期因肾缺血激活肾素-血管紧张素-醛固酮系统，导致肾性高血压。\n解析：慢性硬化性肾小球肾炎晚期大量肾小球玻璃样变、纤维化和硬化，肾小管萎缩、间质纤维化，肾组织缺血，刺激球旁细胞分泌肾素增加；肾素使血管紧张素Ⅱ生成增多，引起全身小动脉收缩，并促进醛固酮分泌导致水钠潴留，从而使血压升高。题目题眼是“晚期”和“最主要原因”，应选肾素分泌增加。虽然肾小球滤过率减少引起水钠潴留也参与高血压，但不是本题所问的最主要原因。\n选项分析：\nA. 错误：肾小球滤过率减少可导致水钠潴留、血容量增加，参与肾性高血压，但慢性硬化性肾炎晚期更关键的是肾缺血所致肾素分泌增加；且滤过率减少本身不是“分泌增加”的直接升压机制。\nB. 错误：少尿是肾小球滤过功能严重下降的临床表现，可加重水钠潴留，但它是结果和表现，不是晚期高血压的最主要原因。\nC. 错误：慢性硬化性肾炎晚期肾小管多萎缩、间质纤维化，重吸收功能并非主要增强；肾小管重吸收增加不是该病晚期高血压的主要机制。\nD. 正确：肾组织缺血刺激球旁细胞分泌肾素，激活肾素-血管紧张素-醛固酮系统，引起小动脉收缩和水钠潴留，是晚期高血压的最主要原因。\nE. 错误：高脂血症可见于肾病综合征等伴大量蛋白尿的病变，与慢性硬化性肾小球肾炎晚期高血压无直接主要因果关系，不能解释肾性高血压的核心机制。\n易混点：肾性高血压有容量依赖型和肾素依赖型两种机制。急性肾小球肾炎高血压常以水钠潴留为主；慢性硬化性肾小球肾炎晚期因肾缺血、肾素分泌增加更突出。记忆要点：颗粒性固缩肾、肾缺血、肾素升高。","chapter":13,"chapterName":"泌尿系统疾病","chapterTitle":"第13章 泌尿系统疾病"},{"id":"pathology-2a-single-0183","type":"single","typeLabel":"单选题","number":183,"question":"金黄色葡萄球菌引起","options":[{"key":"A","text":"导管周围乳腺炎"},{"key":"B","text":"乳腺导管扩张症"},{"key":"C","text":"脂肪坏死"},{"key":"D","text":"肉芽肿性乳腺炎"},{"key":"E","text":"急性乳腺炎"}],"answerKeys":["E"],"answerText":["急性乳腺炎"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n核心考点：急性乳腺炎的病因及化脓性炎病理特点。\n解析：急性乳腺炎最常见的致病菌是金黄色葡萄球菌，其次为链球菌，多发生于哺乳期，尤其初产妇。细菌常经乳头皲裂或乳管侵入，在乳腺内引起急性化脓性炎，局部出现红、肿、热、痛，可形成乳腺脓肿。本题题眼是“金黄色葡萄球菌”与“急性乳腺炎”的经典病因联系。\n选项分析：\nA. 错误：导管周围乳腺炎多与非哺乳期乳管扩张、分泌物潴留及混合感染有关，常表现为乳晕下炎症或脓肿，并非金黄色葡萄球菌引起的经典急性乳腺炎。\nB. 错误：乳腺导管扩张症属于导管扩张伴分泌物潴留、导管周围慢性炎症和纤维化，可继发浆细胞浸润，形成浆细胞性乳腺炎，不是金黄色葡萄球菌所致急性化脓性炎。\nC. 错误：脂肪坏死多由外伤、手术或出血等引起，表现为脂肪组织坏死、脂质吞噬细胞和纤维化，可形成质硬肿块，易与癌混淆，与金黄色葡萄球菌感染无直接对应关系。\nD. 错误：肉芽肿性乳腺炎以非干酪样肉芽肿为特征，常与自身免疫反应、棒状杆菌感染等相关，不是金黄色葡萄球菌感染的典型病变。\nE. 正确：急性乳腺炎由金黄色葡萄球菌等化脓菌经乳头皲裂或乳管侵入引起，镜下为中性粒细胞浸润的急性化脓性炎，可液化坏死形成脓肿，符合题意。\n易混点：急性乳腺炎强调哺乳期、金黄色葡萄球菌、急性化脓性炎和脓肿形成；乳腺导管扩张症/浆细胞性乳腺炎强调导管扩张、分泌物潴留和慢性炎症；肉芽肿性乳腺炎则以非干酪样肉芽肿为特征。记忆要点：金葡菌—急性化脓—哺乳期乳腺炎。","chapter":14,"chapterName":"生殖系统和乳腺疾病","chapterTitle":"第14章 生殖系统和乳腺疾病"},{"id":"pathology-2a-single-0184","type":"single","typeLabel":"单选题","number":184,"question":"风湿性心内膜炎会出现以下哪种特征性结构","options":[{"key":"A","text":"Osler结节"},{"key":"B","text":"Negri小体"},{"key":"C","text":"Aschoff小体"},{"key":"D","text":"环形红斑"},{"key":"E","text":"McCallum斑"}],"answerKeys":["E"],"answerText":["McCallum斑"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n核心考点：风湿性心内膜炎时左心房后壁心内膜的特征性增厚斑块——McCallum斑。\n解析：风湿性心内膜炎反复发作可累及心内膜，尤其左心房后壁，局部心内膜纤维化、增厚、粗糙并形成皱褶，称为McCallum斑。其本质是风湿性炎症反复修复后的心内膜纤维化改变，题眼是“风湿性心内膜炎的特征性结构”，应与风湿性心肌炎的Aschoff小体区分。Aschoff小体虽为风湿热特征性病变，但位于心肌间质，不属于心内膜炎结构。\n选项分析：\nA. 错误：Osler结节见于亚急性感染性心内膜炎，为指（趾）垫等处的小而痛性结节，与免疫复合物性血管炎有关，不是风湿性心内膜炎结构。\nB. 错误：Negri小体是狂犬病时神经细胞胞质内的嗜酸性包涵体，见于脑组织，与心血管疾病无关。\nC. 错误：Aschoff小体是风湿性心肌炎的特征性肉芽肿，由Aschoff细胞、Anitschkow细胞等构成，位于心肌间质，不是风湿性心内膜炎的心内膜结构。\nD. 错误：环形红斑是风湿热的皮肤表现，为边缘性红斑，属于风湿热皮肤病变，不是心内膜炎的特征性结构。\nE. 正确：McCallum斑是风湿性心内膜炎时左心房后壁心内膜增厚、粗糙、皱褶形成的斑块，属于风湿性心内膜炎的特征性心内膜改变。\n易混点：风湿性心内膜炎的瓣膜病变以闭锁缘疣状赘生物为重要表现；Aschoff小体在心肌，McCallum斑在心内膜，二者均可见于风湿热但部位和性质不同。记忆要点：Aschoff小体看心肌，McCallum斑看左房后壁心内膜。","chapter":9,"chapterName":"心血管系统疾病","chapterTitle":"第9章 心血管系统疾病"},{"id":"pathology-2a-single-0185","type":"single","typeLabel":"单选题","number":185,"question":"下面关于大叶性肺炎不正确的描述是","options":[{"key":"A","text":"肺泡壁毛细血管可扩张、充血"},{"key":"B","text":"肺泡壁结构通常遭到破坏"},{"key":"C","text":"肺泡腔内可有大量红细胞、少量中性粒细胞和巨噬细胞"},{"key":"D","text":"病变常累及肺大叶的全部或大部"},{"key":"E","text":"主要由肺炎球菌引起的以肺泡内纤维素渗出为主的炎症"}],"answerKeys":["B"],"answerText":["肺泡壁结构通常遭到破坏"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：大叶性肺炎是肺泡内纤维素性炎，肺泡壁结构通常完整、不被破坏。\n解析：大叶性肺炎主要由肺炎链球菌引起，病变常累及肺大叶的全部或大部，基本病理变化为肺泡腔内纤维素性渗出。虽然肺泡壁毛细血管可扩张、充血，但肺泡壁本身通常不遭破坏，故愈后肺组织可恢复原有结构。本题题眼在于区分“肺泡内渗出”与“肺泡壁破坏”，B项说肺泡壁结构通常遭到破坏，正好违背大叶性肺炎的本质。\n\n选项分析：\nA. 正确：充血水肿期肺泡壁毛细血管扩张、充血，肺泡腔内可出现浆液性渗出，符合大叶性肺炎早期改变。\nB. 错误：大叶性肺炎的炎症主要位于肺泡腔内，肺泡壁结构通常保持完整；肺泡壁破坏更见于小叶性肺炎、肺脓肿等化脓性病变。\nC. 正确：红色肝样变期肺泡腔内可有大量红细胞、少量中性粒细胞和巨噬细胞，并伴纤维素渗出，符合该期形态学特点。\nD. 正确：大叶性肺炎病变常累及肺大叶的全部或大部，这是“大叶性”命名的依据。\nE. 正确：大叶性肺炎主要由肺炎球菌即肺炎链球菌引起，以肺泡内纤维素渗出为主的急性纤维素性炎。\n\n易混点：大叶性肺炎与小叶性肺炎最关键区别是前者为肺泡内纤维素性炎、肺泡壁通常完整；后者为细支气管及周围肺泡的化脓性炎，常破坏组织并可形成脓肿。记忆要点：大叶性肺炎“肺泡内闹、肺泡壁保”，小叶性肺炎“细支气管为中心、破坏重”。","chapter":10,"chapterName":"呼吸系统疾病","chapterTitle":"第10章 呼吸系统疾病"},{"id":"pathology-2a-single-0186","type":"single","typeLabel":"单选题","number":186,"question":"下列癌的恶性程度相对较低的是","options":[{"key":"A","text":"卵巢黏液腺癌"},{"key":"B","text":"肺小细胞癌"},{"key":"C","text":"皮肤基底细胞癌"},{"key":"D","text":"肝胆管细胞癌"},{"key":"E","text":"肾盂移行细胞癌"}],"answerKeys":["C"],"answerText":["皮肤基底细胞癌"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n\n核心考点：基底细胞癌属于低度恶性肿瘤，生长缓慢、局部浸润破坏为主，极少发生转移。\n\n解析：皮肤基底细胞癌多发生于老年人面部等曝光部位，肉眼常呈结节状或溃疡状，边缘隆起、底部污秽。镜下见基底样细胞呈巢状或条索状排列，周边细胞呈栅栏状，癌巢与周围间质间可见收缩间隙。其恶性程度相对较低，主要表现出局部侵袭性，极少经淋巴道或血道转移，故本题题眼是“恶性程度相对较低”而非“良性”。\n\n选项分析：\nA. 错误：卵巢黏液腺癌属于卵巢上皮性恶性肿瘤，可腹腔种植和淋巴转移，预后与分期、分级相关，整体恶性程度高于基底细胞癌。\nB. 错误：肺小细胞癌是高度恶性肿瘤，生长快、早期转移，常伴神经内分泌分化及副肿瘤综合征，属于恶性程度最高的肺癌类型之一。\nC. 正确：皮肤基底细胞癌生长缓慢，以局部浸润破坏为主，转移罕见，恶性程度相对较低；但可破坏局部组织，不能视为良性。\nD. 错误：肝胆管细胞癌为肝内胆管上皮来源的恶性肿瘤，易沿胆管及血道浸润转移，预后差，恶性程度较高。\nE. 错误：肾盂移行细胞癌即尿路上皮癌，恶性程度随分级、分期升高，可发生尿路种植及淋巴结转移，整体高于基底细胞癌。\n\n易混点：基底细胞癌与鳞状细胞癌均可发生于皮肤曝光部位，但基底细胞癌转移极少、以局部破坏为主；鳞状细胞癌可转移，恶性程度相对更高。记忆要点：基底细胞癌“局部坏、少转移”，小细胞癌“小细胞、大恶性”。","chapter":6,"chapterName":"肿瘤","chapterTitle":"第6章 肿瘤"},{"id":"pathology-2a-single-0187","type":"single","typeLabel":"单选题","number":187,"question":"细菌性痢疾病变的最好发部位是","options":[{"key":"A","text":"空肠"},{"key":"B","text":"回肠下段"},{"key":"C","text":"回盲部"},{"key":"D","text":"横结肠"},{"key":"E","text":"乙状结肠和直肠"}],"answerKeys":["E"],"answerText":["乙状结肠和直肠"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n核心考点：细菌性痢疾是假膜性炎，病变主要累及结肠，尤以乙状结肠和直肠最明显。\n解析：细菌性痢疾由志贺菌引起，主要侵犯结肠黏膜，典型病变为纤维素性炎并形成假膜，假膜脱落后形成大小不等、形状不规则的浅表溃疡。病变好发于乙状结肠和直肠，因此临床上可出现腹痛、腹泻、黏液脓血便及里急后重，其中里急后重与直肠病变刺激直肠括约肌有关。本题题眼是“细菌性痢疾”与“最好发部位”，应锁定乙状结肠和直肠，而不是小肠或回盲部。\n选项分析：\nA. 错误：空肠不是细菌性痢疾的主要受累部位；菌痢病变主要在结肠，空肠病变更应想到霍乱等小肠感染。\nB. 错误：回肠下段是肠伤寒的好发部位，典型病变为回肠末段集合淋巴小结的髓样肿胀、坏死和溃疡，不符合菌痢。\nC. 错误：回盲部是肠结核的好发部位，也可见于肠阿米巴病，并非细菌性痢疾的最好发部位。\nD. 错误：横结肠可被菌痢累及，但并非最突出、最好发部位；菌痢以乙状结肠和直肠病变最明显。\nE. 正确：细菌性痢疾病变主要位于结肠，尤以乙状结肠和直肠最常见、最明显，形成假膜性炎和浅表溃疡。\n易混点：菌痢与阿米巴痢疾的定位不同：菌痢好发乙状结肠和直肠，呈假膜性炎、浅表不规则溃疡；阿米巴痢疾好发盲肠和升结肠，呈烧瓶状溃疡。肠伤寒好发回肠下段，肠结核好发回盲部，可对比记忆。","chapter":18,"chapterName":"传染病","chapterTitle":"第18章 传染病"},{"id":"pathology-2a-single-0188","type":"single","typeLabel":"单选题","number":188,"question":"肝硬化时蜘蛛痣发生的主要原因是","options":[{"key":"A","text":"血管内压增高"},{"key":"B","text":"雌激素灭活减少"},{"key":"C","text":"凝血机制障碍"},{"key":"D","text":"门静脉压增高"},{"key":"E","text":"低蛋白血症"}],"answerKeys":["B"],"answerText":["雌激素灭活减少"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：肝硬化时肝功能减退使雌激素灭活减少，皮肤小动脉扩张形成蜘蛛痣。\n解析：蜘蛛痣是皮肤小动脉末端分支性扩张所形成的血管痣，典型分布于面、颈、上胸部及上肢等上腔静脉分布区，压迫中心可退色。肝硬化时肝细胞功能受损，对雌激素的灭活能力下降，体内雌激素水平升高，使皮肤小动脉扩张，从而出现蜘蛛痣和肝掌。本题题眼是“蜘蛛痣”，其属于肝功能减退的表现，而不是门静脉高压的表现。\n选项分析：\nA. 错误：血管内压增高不是蜘蛛痣形成的主要原因；蜘蛛痣的本质是雌激素增多引起的小动脉扩张，并非单纯压力升高所致。\nB. 正确：肝硬化时肝脏灭活雌激素减少，雌激素增多可导致皮肤小动脉末端分支扩张，形成蜘蛛痣，也可伴肝掌、男性乳房发育等。\nC. 错误：凝血机制障碍主要因肝细胞合成凝血因子减少及脾功能亢进致血小板减少，表现为出血倾向，如牙龈出血、皮肤瘀斑，不形成蜘蛛痣。\nD. 错误：门静脉压增高主要引起门静脉高压症，表现为食管胃底静脉曲张、腹壁静脉曲张、痔静脉曲张、脾大和腹水，不是蜘蛛痣的直接原因。\nE. 错误：低蛋白血症主要因肝细胞合成白蛋白减少，引起血浆胶体渗透压下降，导致水肿和腹水，与蜘蛛痣形成无直接关系。\n易混点：蜘蛛痣和肝掌属于肝硬化肝功能减退的表现，机制与雌激素灭活减少有关；而食管胃底静脉曲张、腹壁静脉曲张、脾大、腹水属于门静脉高压表现。记忆要点：蜘蛛痣看“雌激素灭活减少”，侧支循环看“门静脉压增高”。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-2a-single-0189","type":"single","typeLabel":"单选题","number":189,"question":"如图所示，在慢性炎症灶中以下列哪种细胞最常见","options":[{"key":"A","text":"嗜酸性粒细胞"},{"key":"B","text":"肥大细胞"},{"key":"C","text":"淋巴细胞"},{"key":"D","text":"嗜碱性粒细胞"},{"key":"E","text":"中性粒细胞"}],"answerKeys":["C"],"answerText":["淋巴细胞"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：慢性炎症灶的炎细胞浸润以淋巴细胞、浆细胞和巨噬细胞为主，其中淋巴细胞是本题所问“下列细胞中最常见”的代表。\n解析：题目图片未提供，以下仅依据题干文字信息分析。慢性炎症常由急性炎症迁延、病原体持续存在或异物刺激等引起，镜下突出表现为淋巴细胞和浆细胞浸润，并伴有巨噬细胞、成纤维细胞及血管增生。淋巴细胞在局部持续聚集，可释放淋巴因子参与免疫反应和炎症维持；浆细胞则来源于B淋巴细胞，产生抗体。本题题眼是“慢性炎症灶”和“最常见”，应与急性炎症以中性粒细胞浸润为主相区分。\n选项分析：\nA. 错误：嗜酸性粒细胞主要见于寄生虫感染、过敏性疾病及部分自身免疫性疾病，虽可见于慢性炎症，但不是慢性炎症灶中最常见的细胞。\nB. 错误：肥大细胞参与I型超敏反应、血管反应和纤维化过程，在慢性炎症中可增多，但数量通常较少，不是最主要浸润细胞。\nC. 正确：慢性炎症灶中以淋巴细胞浸润最为突出，常伴浆细胞和巨噬细胞；淋巴细胞是慢性炎症的典型炎细胞，符合本题标准答案。\nD. 错误：嗜碱性粒细胞主要存在于血液中，组织内少见，参与过敏反应，并非慢性炎症灶常见浸润细胞。\nE. 错误：中性粒细胞是急性炎症尤其是化脓性炎的标志性炎细胞，主要负责吞噬和杀灭细菌，不是慢性炎症灶中最常见细胞。\n易混点：急性炎症以中性粒细胞为主，慢性炎症以淋巴细胞、浆细胞、巨噬细胞为主；肉芽肿性炎虽属慢性炎症，但突出的是巨噬细胞及其衍生细胞（上皮样细胞、多核巨细胞）。记忆要点：急性看中性粒，慢性看淋巴、浆、巨噬。","chapter":4,"chapterName":"炎症","chapterTitle":"第4章 炎症","needsImage":true},{"id":"pathology-2a-single-0190","type":"single","typeLabel":"单选题","number":190,"question":"一期愈合的特点不包括","options":[{"key":"A","text":"创缘整齐，对合严密"},{"key":"B","text":"无感染与异物"},{"key":"C","text":"愈合时间较短"},{"key":"D","text":"愈合后常遗留下较大瘢痕"},{"key":"E","text":"肉芽组织第三天即可从伤口边缘长出"}],"answerKeys":["D"],"answerText":["愈合后常遗留下较大瘢痕"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：一期愈合的病理特点及其与二期愈合的鉴别。\n解析：一期愈合多见于组织缺损小、创缘整齐、对合严密且无感染和异物的伤口，愈合快、形成的瘢痕小。其基本过程包括伤口边缘上皮再生、肉芽组织约第3天从伤口边缘长出，随后胶原纤维形成并逐渐改建。D项“愈合后常遗留下较大瘢痕”是二期愈合的特点，不是一期愈合的特点，故为本题答案。\n选项分析：\nA. 正确：一期愈合要求创缘整齐、对合严密，这是其形成小瘢痕、愈合快的重要条件。\nB. 正确：无感染与异物是一期愈合的典型条件；若有感染或异物，常转为二期愈合。\nC. 正确：一期愈合组织缺损小、对合好，炎症反应轻，愈合时间较短。\nD. 错误：一期愈合瘢痕小，较大瘢痕常见于二期愈合，因组织缺损大、创缘不整、肉芽组织填充多。\nE. 正确：一期愈合时肉芽组织约在伤后第3天从伤口边缘开始长出，属于常考时间点。\n易混点：一期愈合与二期愈合的核心区别是组织缺损大小、创缘是否整齐、能否严密对合、有无感染异物及瘢痕大小。记忆要点：一期“整齐、无感染、愈合快、瘢痕小”；二期“缺损大、不整齐、有感染、肉芽多、瘢痕大”。","chapter":2,"chapterName":"损伤的修复","chapterTitle":"第2章 损伤的修复"},{"id":"pathology-2a-single-0191","type":"single","typeLabel":"单选题","number":191,"question":"关于肾细胞癌，下列哪项描述是正确的","options":[{"key":"A","text":"常在早期即有临床症状"},{"key":"B","text":"大部分患者因血尿、腰痛和腰部肿块三联症被发现"},{"key":"C","text":"最常见的组织病理学形态为透明细胞癌"},{"key":"D","text":"转移少见，发生时也只局限于肾周"},{"key":"E","text":"肉眼上肿瘤切面实性，灰白色，含少量脂质"}],"answerKeys":["C"],"answerText":["最常见的组织病理学形态为透明细胞癌"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：肾细胞癌最常见组织学亚型为透明细胞癌，其透明胞质与脂质、糖原蓄积有关。\n解析：肾细胞癌早期常无明显症状，典型血尿、腰痛和腰部肿块三联症多属晚期表现，且仅少数患者出现。透明细胞癌是最常见的组织学类型，镜下癌细胞胞质透明、呈巢状或片状排列，间质富有薄壁血管；肉眼切面常呈淡黄色或金黄色，并可伴出血、坏死和囊性变。本题题眼是“最常见组织病理学形态”，应选透明细胞癌。\n选项分析：\nA. 错误：肾细胞癌早期常无症状，多在影像学检查时偶然发现；出现症状时往往已较晚，故“常在早期即有临床症状”不符合。\nB. 错误：血尿、腰痛和腰部肿块是肾细胞癌的经典三联症，但仅少数患者出现，且多提示晚期，不能说“大部分患者”因此被发现。\nC. 正确：透明细胞癌约占肾细胞癌的70%～80%，为最常见亚型；癌细胞胞质透明是因为含脂质和糖原，间质血管丰富，符合考试常考形态学特点。\nD. 错误：肾细胞癌转移并不少见，可通过血道转移至肺、骨、肝、脑等部位，也可形成肾静脉瘤栓；并非“转移少见且只局限于肾周”。\nE. 错误：透明细胞癌肉眼切面多呈实性、淡黄色或金黄色，含较多脂质，常伴出血、坏死、囊性变；描述为“灰白色、含少量脂质”不符合其典型改变。\n易混点：肾细胞癌典型三联症是晚期表现而非早期诊断依据；透明细胞癌切面金黄、胞质透明，与嫌色细胞癌、乳头状肾细胞癌等亚型区分。记忆要点：肾癌早期隐匿，透明细胞癌最常见，富脂质故切面金黄、镜下透明。","chapter":13,"chapterName":"泌尿系统疾病","chapterTitle":"第13章 泌尿系统疾病"},{"id":"pathology-2a-single-0192","type":"single","typeLabel":"单选题","number":192,"question":"低度恶性的上皮性肿瘤是","options":[{"key":"A","text":"浆液性囊腺瘤"},{"key":"B","text":"黏液性囊腺瘤"},{"key":"C","text":"浆液性囊腺癌"},{"key":"D","text":"黏液性囊腺癌"},{"key":"E","text":"交界性浆液性囊腺瘤"}],"answerKeys":["E"],"answerText":["交界性浆液性囊腺瘤"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n核心考点：卵巢上皮性肿瘤中“交界性肿瘤”属于低度恶性潜能肿瘤，介于良性囊腺瘤与浸润性癌之间。\n解析：交界性浆液性囊腺瘤的题眼是“低度恶性”，即肿瘤上皮呈复层、乳头分支较复杂、细胞有轻至中度异型，但无破坏性间质浸润，临床行为相对惰性，故归为低度恶性潜能。浆液性囊腺瘤和黏液性囊腺瘤均为良性，浆液性囊腺癌和黏液性囊腺癌均为明确恶性，因此选E。\n选项分析：\nA. 错误：浆液性囊腺瘤是卵巢良性上皮性肿瘤，囊壁被覆单层或少量复层浆液性上皮，细胞异型不明显，无低度恶性含义。\nB. 错误：黏液性囊腺瘤是良性上皮性肿瘤，常为多房囊性，被覆胃/肠型黏液上皮，细胞异型轻，无间质浸润。\nC. 错误：浆液性囊腺癌是恶性上皮性肿瘤，常见明显细胞异型、复杂乳头和间质浸润，属于明确恶性而非低度恶性。\nD. 错误：黏液性囊腺癌是恶性上皮性肿瘤，具有浸润性生长和细胞异型，属于明确恶性。\nE. 正确：交界性浆液性囊腺瘤又称低度恶性潜能肿瘤，上皮复层和乳头分支增多、细胞有轻中度异型，但无间质浸润，符合“低度恶性”的考试表述。\n易混点：交界性肿瘤的关键是“有异型、无间质浸润”，不要与浆液性囊腺瘤的单纯良性乳头混淆，也不要与浆液性囊腺癌的破坏性间质浸润混淆。记忆要点：良性看单层温和，交界看复层乳头但无浸润，癌看浸润和明显异型。","chapter":14,"chapterName":"生殖系统和乳腺疾病","chapterTitle":"第14章 生殖系统和乳腺疾病"},{"id":"pathology-2a-single-0193","type":"single","typeLabel":"单选题","number":193,"question":"心肌脂肪变性引起“虎斑心”时，最易出现变化的部位是","options":[{"key":"A","text":"左心房及左心耳内膜下心肌"},{"key":"B","text":"右心室内膜下心肌及乳头肌"},{"key":"C","text":"左心室内膜下心肌及乳头肌"},{"key":"D","text":"右心房及右心耳内膜下心肌"},{"key":"E","text":"左心室前壁及心尖区心肌"}],"answerKeys":["C"],"answerText":["左心室内膜下心肌及乳头肌"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n\n核心考点：心肌脂肪变性形成“虎斑心”的好发部位及机制。\n\n解析：心肌脂肪变性多由严重贫血、缺氧、中毒等引起，心肌细胞内出现脂滴。病变常呈黄色条纹，与正常红色心肌相间，形成“虎斑心”。其最易发生在左心室内膜下心肌及乳头肌，因为左心室工作负荷大、耗氧多，心内膜下和乳头肌处于血供相对远端、对缺氧敏感，脂肪变性最明显。本题题眼是“虎斑心”的脂肪变性与好发部位，而非心肌梗死或脂肪浸润。\n\n选项分析：\nA. 错误：左心房及左心耳内膜下心肌不是虎斑心的典型好发部位，心房肌负荷和耗氧相对较低，脂肪变性不如左心室心内膜下及乳头肌明显。\nB. 错误：右心室内膜下心肌及乳头肌可发生脂肪变性，但右心室压力负荷和耗氧低于左心室，不如左心室心内膜下及乳头肌典型，不能作为“最易”部位。\nC. 正确：左心室内膜下心肌及乳头肌工作负荷大、耗氧多且血供相对较差，是心肌脂肪变性最明显、形成虎斑心的典型部位。\nD. 错误：右心房及右心耳内膜下心肌不是虎斑心的好发部位，此处病变不典型，不能解释“虎斑”样条纹的主要分布。\nE. 错误：左心室前壁及心尖区是心肌梗死的好发部位，并非心肌脂肪变性形成虎斑心的最典型部位；虎斑心主要强调心内膜下心肌和乳头肌的黄色条纹。\n\n易混点：虎斑心是心肌细胞脂肪变性，好发于左心室内膜下及乳头肌；心肌脂肪浸润是心外膜脂肪组织向心肌间质长入，常以右心室较明显，二者机制不同。另需注意左心室前壁、心尖区是冠心病心肌梗死常见部位，不要与虎斑心混淆。","chapter":1,"chapterName":"细胞和组织的适应与损伤","chapterTitle":"第1章 细胞和组织的适应与损伤"},{"id":"pathology-2a-single-0194","type":"single","typeLabel":"单选题","number":194,"question":"肝细胞大片崩解坏死并有肝细胞结节状再生者见于","options":[{"key":"A","text":"慢性持续性肝炎"},{"key":"B","text":"慢性活动性肝炎"},{"key":"C","text":"亚急性重型肝炎"},{"key":"D","text":"急性普通型肝炎"},{"key":"E","text":"急性重型肝炎"}],"answerKeys":["C"],"answerText":["亚急性重型肝炎"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：亚急性重型肝炎的病理特点是肝细胞大片坏死与肝细胞结节状再生并存。\n解析：亚急性重型肝炎病程数周至数月，肝细胞发生大片崩解坏死，坏死区网状支架塌陷，同时残存肝细胞可增生形成不规则结节，并伴小胆管增生、纤维组织增生和炎细胞浸润，故可见“大片坏死＋结节状再生”这一组合。题眼在于“大片崩解坏死”提示重型肝炎，而“结节状再生”提示病变呈亚急性经过，因此选亚急性重型肝炎。\n\n选项分析：\nA. 错误：慢性持续性肝炎病变主要局限于汇管区，小叶界板完整，无碎片状坏死，肝小叶结构基本保留，不会出现大片崩解坏死和结节状再生。\nB. 错误：慢性活动性肝炎以碎片状坏死、桥接坏死及汇管区纤维化为特点，可伴肝细胞再生，但再生不呈大片坏死背景下的结节状，且病变为慢性进行性炎症。\nC. 正确：亚急性重型肝炎既有肝细胞大片坏死，又有肝细胞结节状再生，并伴网状支架塌陷和纤维组织增生，符合题干描述。\nD. 错误：急性普通型肝炎以肝细胞胞质疏松化、气球样变和点状坏死为主，可见嗜酸性小体及肝细胞再生，但坏死范围小，肝小叶结构完整。\nE. 错误：急性重型肝炎表现为肝细胞广泛大片坏死，再生不明显，肝体积明显缩小，临床起病急、病程短，与“结节状再生”不符。\n\n易混点：急性重型肝炎重在大片坏死而再生不明显；亚急性重型肝炎则是大片坏死与结节状再生并存，易发展为坏死后性肝硬化。慢性活动性肝炎虽可有桥接坏死和纤维化，但坏死范围及再生方式不同于重型肝炎。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-2a-single-0195","type":"single","typeLabel":"单选题","number":195,"question":"致使肺梗死的血栓栓子一般来自","options":[{"key":"A","text":"静脉系统或右心的血栓"},{"key":"B","text":"二尖瓣疣状血栓的脱落"},{"key":"C","text":"门静脉的血栓脱落"},{"key":"D","text":"左心房附壁血栓"},{"key":"E","text":"动脉及左心房的血栓脱落"}],"answerKeys":["A"],"answerText":["静脉系统或右心的血栓"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：A\n核心考点：肺动脉血栓栓塞的栓子来源及肺梗死的发生机制。\n解析：肺梗死的栓子绝大多数来自静脉系统或右心，尤其是下肢深静脉（股静脉、髂静脉、腘静脉等），血栓脱落后随静脉血回流至右心，再进入肺动脉分支造成栓塞。肺组织有双重血供，单纯肺动脉分支阻塞不一定梗死；若患者存在肺淤血（如左心衰）或支气管动脉循环障碍，则易发生出血性梗死。本题题眼是“肺梗死”的栓子经右心进入肺动脉，故来源于静脉系统或右心。\n\n选项分析：\nA. 正确：静脉系统或右心的血栓脱落后经右心室进入肺动脉，是肺栓塞、肺梗死最常见的栓子来源。\nB. 错误：二尖瓣疣状血栓多见于风湿性心内膜炎，脱落后进入左心室和主动脉，引起体循环动脉栓塞，不会进入肺动脉。\nC. 错误：门静脉血栓脱落后进入肝内门静脉分支，主要引起门静脉阻塞、肝淤血或肝梗死，不回流至右心和肺动脉。\nD. 错误：左心房附壁血栓常见于房颤，脱落后进入左心室，造成脑、脾、肾、下肢等体循环栓塞。\nE. 错误：动脉及左心房血栓均属体循环来源，脱落形成体循环动脉栓塞，不能导致肺动脉栓塞和肺梗死。\n\n易混点：肺栓塞栓子多来自右心及静脉系统，体循环栓塞栓子多来自左心及动脉系统；肺梗死常为出血性梗死，且常以肺淤血为基础，这与脾、肾等贫血性梗死不同。记忆要点：右心—肺，左心—体循环。","chapter":3,"chapterName":"局部血液循环障碍","chapterTitle":"第3章 局部血液循环障碍"},{"id":"pathology-2a-single-0196","type":"single","typeLabel":"单选题","number":196,"question":"如图，可能的疾病是","options":[{"key":"A","text":"急性肾小球肾炎"},{"key":"B","text":"急进性肾小球肾炎"},{"key":"C","text":"慢性肾小球肾炎"},{"key":"D","text":"慢性肾盂肾炎"},{"key":"E","text":"肾癌"}],"answerKeys":["D"],"answerText":["慢性肾盂肾炎"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：慢性肾盂肾炎的慢性间质性炎症、纤维化瘢痕及肾盂肾盏变形。\n解析：题目图片未提供，以下仅依据文字信息和标准答案分析。慢性肾盂肾炎是反复尿路感染、尿路梗阻或膀胱输尿管反流导致的慢性间质性肾炎，病变常累及肾盂、肾盏及肾间质，形成不对称性纤维化瘢痕，肾脏缩小、表面不规则凹陷，肾盂肾盏可变形；镜下见间质纤维化、慢性炎细胞浸润、肾小管萎缩及甲状腺化，部分肾小球继发性硬化。题眼在于“慢性间质性炎症伴瘢痕形成和肾盂肾盏变形”，符合慢性肾盂肾炎。\n选项分析：\nA. 错误：急性肾小球肾炎为链球菌感染后弥漫性毛细血管内增生性肾小球肾炎，肾小球内皮及系膜细胞增生、中性粒细胞浸润，临床呈急性肾炎综合征，肾脏轻度肿大，不以肾间质瘢痕和肾盂肾盏变形为特征。\nB. 错误：急进性肾小球肾炎即新月体性肾小球肾炎，镜下以肾小球囊壁新月体形成为特征，肾功能迅速恶化，属于肾小球疾病，不是慢性肾盂间质性炎症和瘢痕病变。\nC. 错误：慢性肾小球肾炎为双肾对称性缩小、表面细颗粒状，皮质变薄，大量肾小球硬化，临床为慢性肾衰竭；其病变以肾小球为主且对称，与本例慢性肾盂肾炎的不规则瘢痕、肾盂肾盏变形不同。\nD. 正确：慢性肾盂肾炎由反复感染及反流/梗阻引起，典型为肾间质纤维化、慢性炎细胞浸润、肾小管萎缩，肾表面不规则瘢痕，肾盂肾盏变形，可伴高血压和慢性肾功能不全。\nE. 错误：肾癌是肾小管上皮来源的恶性肿瘤，肉眼常为肾实质内黄白色肿块，伴出血、坏死，镜下为透明细胞等癌细胞巢；其本质为肿瘤，不是慢性间质性炎症和瘢痕形成。\n易混点：慢性肾小球肾炎为“双肾对称缩小、细颗粒状”，慢性肾盂肾炎为“不对称粗大瘢痕、肾盂肾盏变形”；前者原发于肾小球，后者原发于肾间质并继发肾小球硬化。","chapter":13,"chapterName":"泌尿系统疾病","chapterTitle":"第13章 泌尿系统疾病","needsImage":true},{"id":"pathology-2a-single-0197","type":"single","typeLabel":"单选题","number":197,"question":"下列不属于门脉高压症的表现的是","options":[{"key":"A","text":"脾大"},{"key":"B","text":"肝大"},{"key":"C","text":"食管静脉曲张"},{"key":"D","text":"痔核形成"},{"key":"E","text":"腹水"}],"answerKeys":["B"],"answerText":["肝大"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：门脉高压症的主要临床表现为脾大、侧支循环开放和腹水，肝大不属于门脉高压症本身的表现。\n解析：门脉高压症时门静脉回流受阻，首先引起脾静脉淤血而致脾大，并可伴脾功能亢进；同时门-体侧支循环开放，常见食管下段和胃底静脉曲张、直肠静脉丛曲张形成痔、脐周静脉曲张等；腹水形成与门脉压增高、低蛋白血症、淋巴液生成增多及醛固酮和抗利尿激素增多等有关。肝大可见于肝硬化早期、淤血肝、肝炎、肝癌等，但并非门脉高压综合征的固有表现，故本题题眼是“不属于门脉高压症的表现”。\n\n选项分析：\nA. 错误（作为本题答案错误；该表现属于门脉高压症）：脾静脉回流受阻导致脾淤血、脾大，并可引起脾功能亢进，是门脉高压症常见表现。\nB. 正确（本题答案；肝大不属于门脉高压症表现）：肝大取决于原发病和肝脏病变阶段，肝硬化晚期肝常缩小，门脉高压本身并不以肝大为表现。\nC. 错误（作为本题答案错误；该表现属于门脉高压症）：门静脉血流经胃冠状静脉等侧支回流，导致食管下段和胃底静脉曲张，破裂可引起致命性上消化道出血。\nD. 错误（作为本题答案错误；该表现属于门脉高压症）：门静脉血经直肠静脉丛回流时可使直肠静脉丛曲张，形成痔核。\nE. 错误（作为本题答案错误；该表现属于门脉高压症）：门脉压增高、低蛋白血症、淋巴回流障碍及内分泌因素共同促进腹水形成，是门脉高压症重要表现。\n\n易混点：门脉高压症的三大类是脾大、侧支循环开放和腹水；肝大不是门脉高压本身表现，不要把肝硬化病因或淤血肝、肝癌所致的肝大误归入门脉高压症。侧支循环中食管胃底静脉曲张最危险，直肠静脉丛曲张可表现为痔核，但痔核本身也常见于非门脉高压原因，需结合门脉高压背景判断。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-2a-single-0198","type":"single","typeLabel":"单选题","number":198,"question":"风湿小体发生于","options":[{"key":"A","text":"心瓣膜"},{"key":"B","text":"心肌细胞"},{"key":"C","text":"心肌间质"},{"key":"D","text":"关节滑膜"},{"key":"E","text":"心外膜"}],"answerKeys":["C"],"answerText":["心肌间质"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n\n核心考点：风湿小体（Aschoff小体）是风湿热增生期的特征性病变，主要发生于心肌间质小血管旁。\n\n解析：风湿小体由中央纤维素样坏死、周围增生的风湿细胞（Aschoff细胞，呈枭眼状或毛虫样）及少量淋巴细胞、单核细胞构成，是风湿热的病理诊断依据。其好发于心肌间质，尤其是左心室后壁、室间隔等处，可累及心脏传导系统而引起心律失常。本题题眼是“风湿小体发生部位”，应选心肌间质，而非心肌细胞本身。\n\n选项分析：\nA. 错误：心瓣膜是风湿性心内膜炎的好发部位，典型病变为二尖瓣闭锁缘的疣状赘生物（白色血栓），并非风湿小体的主要发生部位。\nB. 错误：风湿小体位于心肌间质，而非发生于心肌细胞内；心肌细胞可发生变性、坏死，但不是Aschoff小体的构成主体。\nC. 正确：风湿小体发生于心肌间质小血管旁，中央为纤维素样坏死，周围为风湿细胞及炎细胞，是风湿热增生期的特征性病变。\nD. 错误：关节滑膜主要见于风湿性关节炎，表现为滑膜充血、水肿及炎性渗出，临床为游走性大关节炎，风湿小体不是其典型部位。\nE. 错误：心外膜受累时形成风湿性心包炎，常为浆液纤维素性炎，可形成心包积液或纤维素性渗出，不是风湿小体的主要发生部位。\n\n易混点：风湿小体属于风湿热增生期肉芽肿性病变，位于心肌间质；而风湿性心内膜炎的疣状赘生物位于瓣膜闭锁缘，二者不可混淆。记忆要点：Aschoff小体“在间质、不在细胞，傍小血管、好发左室后壁和室间隔”。","chapter":9,"chapterName":"心血管系统疾病","chapterTitle":"第9章 心血管系统疾病"},{"id":"pathology-2a-single-0199","type":"single","typeLabel":"单选题","number":199,"question":"毛细血管再生时在蛋白分解酶作用下基底膜分解，首先出现的变化是","options":[{"key":"A","text":"内皮细胞分裂增生形成幼芽"},{"key":"B","text":"内皮细胞分泌层粘连蛋白"},{"key":"C","text":"内皮细胞分泌Ⅳ型胶原"},{"key":"D","text":"成纤维细胞分泌Ⅲ型胶原"},{"key":"E","text":"出现毛细血管管腔"}],"answerKeys":["A"],"answerText":["内皮细胞分裂增生形成幼芽"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：A\n核心考点：毛细血管再生的早期过程，即基底膜分解后内皮细胞增生形成实性幼芽。\n解析：毛细血管再生时，蛋白分解酶使受损血管基底膜分解，内皮细胞随后发生分裂增生，并向管壁外突出形成实性内皮细胞幼芽，这是血管再生的起始关键变化。内皮细胞幼芽继续迁移、增生并相互连接，之后才逐渐出现管腔、重建基底膜并包绕周细胞。本题题眼是“基底膜分解后首先出现的变化”，应抓住内皮细胞增生形成幼芽这一早期形态学表现。\n选项分析：\nA. 正确：基底膜分解后，内皮细胞分裂增生并形成实性幼芽，是毛细血管再生的首要表现，随后幼芽延伸并形成管腔。\nB. 错误：层粘连蛋白属于基底膜成分，主要在管腔形成及基底膜重建阶段由内皮细胞分泌，并非基底膜分解后首先出现的变化。\nC. 错误：Ⅳ型胶原也是基底膜的重要成分，参与新生毛细血管基底膜的重新构建，属于较晚阶段的变化，不是最初表现。\nD. 错误：成纤维细胞分泌Ⅲ型胶原参与肉芽组织基质形成和纤维化修复，属于间质修复过程，不是毛细血管内皮细胞再生的第一步。\nE. 错误：毛细血管管腔出现是内皮细胞幼芽增生、迁移并相互融合后形成的较晚阶段表现，不是基底膜分解后的首先变化。\n易混点：肉芽组织由新生毛细血管和增生的成纤维细胞构成，但毛细血管再生本身有顺序：基底膜分解→内皮细胞增生形成幼芽→幼芽延伸并形成管腔→基底膜重建。记忆时不要把“管腔出现”或“分泌基底膜成分”误认为第一步，第一步是内皮细胞增生形成幼芽。","chapter":2,"chapterName":"损伤的修复","chapterTitle":"第2章 损伤的修复"},{"id":"pathology-2a-single-0200","type":"single","typeLabel":"单选题","number":200,"question":"高血压时，血管壁玻璃样变性常见于","options":[{"key":"A","text":"冠状动脉"},{"key":"B","text":"肾弓形动脉"},{"key":"C","text":"主动脉"},{"key":"D","text":"肾小球入球动脉"},{"key":"E","text":"脑基底动脉"}],"answerKeys":["D"],"answerText":["肾小球入球动脉"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：良性高血压细动脉硬化的好发部位及玻璃样变性的病理机制。\n解析：高血压时，细小动脉长期痉挛和压力增高，内皮细胞受损，血浆蛋白渗入内膜下，同时平滑肌细胞合成细胞外基质增多，最终在管壁沉积均质、红染、无结构的玻璃样物质，使管壁增厚、变硬、管腔狭窄。该病变最典型累及肾小球入球动脉，故本题题眼是“高血压”加“血管壁玻璃样变性”加“好发部位”。\n选项分析：\nA. 错误：冠状动脉主要发生动脉粥样硬化，病变为内膜脂质沉积、粥样斑块形成，不是高血压细动脉玻璃样变性的典型部位。\nB. 错误：肾弓形动脉属于肌型小动脉，良性高血压时可发生内膜纤维化、中膜肥厚等小动脉硬化改变，但“玻璃样变性”最典型、最常考的部位不是弓形动脉。\nC. 错误：主动脉主要发生动脉粥样硬化，也可有梅毒性主动脉炎、中层囊性坏死等病变；高血压时主动脉可发生肥厚和扩张，但不是细动脉玻璃样变性的好发部位。\nD. 正确：肾小球入球动脉属于细小动脉，良性高血压时发生细动脉玻璃样变性，是高血压肾病变的重要基础，可导致肾小球缺血、萎缩和纤维化。\nE. 错误：脑基底动脉主要与动脉粥样硬化及高血压性脑出血相关，不是细动脉玻璃样变性的典型好发部位；脑内细小动脉也可有改变，但考试最常选肾入球动脉。\n易混点：高血压良性期细动脉玻璃样变性常见于肾入球动脉、视网膜小动脉和脾中央动脉；恶性高血压则常出现细小动脉纤维素样坏死和增生性小动脉硬化。动脉粥样硬化累及大中动脉，应与细动脉玻璃样变性区分。","chapter":9,"chapterName":"心血管系统疾病","chapterTitle":"第9章 心血管系统疾病"},{"id":"pathology-2a-single-0201","type":"single","typeLabel":"单选题","number":201,"question":"最容易引起皮肤潮红、水样腹泻、心动过速、支气管哮喘等症状的肺癌类型是","options":[{"key":"A","text":"大细胞癌"},{"key":"B","text":"黏液癌"},{"key":"C","text":"类癌"},{"key":"D","text":"未分化腺癌"},{"key":"E","text":"低分化鳞状细胞癌"}],"answerKeys":["C"],"answerText":["类癌"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：肺类癌属于神经内分泌肿瘤，可分泌血管活性物质而引发类癌综合征。\n解析：类癌起源于支气管黏膜的神经内分泌细胞（Kulchitsky细胞），肿瘤细胞可分泌5-羟色胺、缓激肽、组胺等血管活性物质，引起皮肤潮红、水样腹泻、心动过速和支气管痉挛（哮喘样发作），即类癌综合征。该类症状在肿瘤发生肝转移后更明显，因肝脏对活性物质灭活减少。题眼是“皮肤潮红、水样腹泻、心动过速、支气管哮喘”这一组类癌综合征表现，故首选类癌。\n选项分析：\nA. 错误：大细胞癌为高度恶性的未分化癌，多呈周围型大肿块，常见坏死，一般无神经内分泌分泌功能，不引起典型类癌综合征。\nB. 错误：黏液癌/黏液腺癌以产生黏液为特点，临床可表现为咳嗽、咳痰等，但不会因分泌5-羟色胺等引起皮肤潮红、腹泻和支气管痉挛。\nC. 正确：类癌为神经内分泌肿瘤，可分泌5-羟色胺等活性物质，产生类癌综合征，表现为皮肤潮红、水样腹泻、心动过速及哮喘样发作。\nD. 错误：未分化腺癌属于低分化腺癌，恶性程度高、腺体形成差，无典型神经内分泌功能，不能解释类癌综合征。\nE. 错误：低分化鳞状细胞癌多位于中央型，常见角化珠和细胞间桥，可发生空洞，但不分泌类癌相关血管活性物质。\n易混点：小细胞癌也可出现副肿瘤综合征，但常见的是抗利尿激素分泌异常综合征、库欣综合征和Lambert-Eaton综合征；类癌综合征的典型对应肿瘤是类癌。记忆要点：皮肤潮红＋水样腹泻＋心动过速＋支气管痉挛，想到类癌分泌5-羟色胺等活性物质。","chapter":10,"chapterName":"呼吸系统疾病","chapterTitle":"第10章 呼吸系统疾病"},{"id":"pathology-2a-single-0202","type":"single","typeLabel":"单选题","number":202,"question":"肺癌的临床表现为","options":[{"key":"A","text":"咳嗽，咳铁锈色痰"},{"key":"B","text":"刺激性干咳，无痰"},{"key":"C","text":"长期咳嗽，咳白色泡沫痰"},{"key":"D","text":"咳嗽，咳血，咳大量脓痰"},{"key":"E","text":"刺激性呛咳，痰中带血"}],"answerKeys":["E"],"answerText":["刺激性呛咳，痰中带血"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n\n核心考点：肺癌的典型呼吸道症状为刺激性呛咳和痰中带血，尤其与中央型肺癌相关。\n\n解析：肺癌起源于支气管黏膜上皮，肿瘤刺激支气管可引起阵发性刺激性呛咳；肿瘤组织血管丰富且易坏死、侵犯血管，故常出现痰中带血或咯血。中央型肺癌因位于主支气管、叶支气管，气道刺激和咯血症状出现较早；周围型肺癌早期可无症状，随病情进展可出现胸痛、呼吸困难、消瘦及转移表现。本题题眼是“刺激性呛咳＋痰中带血”，高度提示肺癌。\n\n选项分析：\nA. 错误：咳嗽、咳铁锈色痰是大叶性肺炎的典型表现，因肺泡内红细胞破坏、含铁血黄素析出所致，不是肺癌的典型痰色。\nB. 错误：刺激性干咳可见于肺癌早期，也可见于咽喉炎、支原体肺炎等；但“无痰”不能概括肺癌，肺癌更重要的线索是痰中带血，故不如E典型。\nC. 错误：长期咳嗽、咳白色泡沫痰多见于慢性支气管炎，因支气管黏液腺增生和分泌增多所致，缺乏肺癌的咯血特征。\nD. 错误：咳嗽、咯血并咳大量脓痰主要见于支气管扩张症，因支气管壁破坏、反复感染和脓性分泌物积聚；肺癌可咯血，但“大量脓痰”不是其典型表现。\nE. 正确：刺激性呛咳提示肿瘤刺激支气管黏膜，痰中带血提示肿瘤血管破裂或侵犯血管，是肺癌常见而重要的临床表现。\n\n易混点：铁锈色痰记大叶性肺炎，大量脓痰记支气管扩张，白色泡沫痰记慢性支气管炎，痰中带血伴刺激性呛咳记肺癌。肺结核也可咯血，但常伴低热、盗汗、乏力等结核中毒症状。","chapter":10,"chapterName":"呼吸系统疾病","chapterTitle":"第10章 呼吸系统疾病"},{"id":"pathology-2a-single-0203","type":"single","typeLabel":"单选题","number":203,"question":"链球菌感染后肾小球肾炎电镜下沉积物多存在于","options":[{"key":"A","text":"内皮下"},{"key":"B","text":"基底膜致密层"},{"key":"C","text":"基底膜和脏层上皮细胞间，呈驼峰状"},{"key":"D","text":"基底膜和脏层上皮细胞间，被基底膜钉状突起分隔"},{"key":"E","text":"壁层上皮下"}],"answerKeys":["C"],"answerText":["基底膜和脏层上皮细胞间，呈驼峰状"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：链球菌感染后肾小球肾炎（急性弥漫性增生性肾小球肾炎）的特征性电镜表现是上皮下“驼峰状”电子致密物沉积。\n解析：本病属于免疫复合物介导的肾小球肾炎，并非链球菌直接感染肾小球。免疫复合物主要沉积在基底膜与脏层上皮细胞之间，即上皮下，电镜下呈散在、粗大的“驼峰状”电子致密物；免疫荧光常显示IgG和C3沿基底膜呈颗粒状沉积。光镜下可见肾小球内皮细胞和系膜细胞弥漫性增生，临床常有感染后血尿、蛋白尿、水肿和高血压。本题题眼是“链球菌感染后”加“电镜下沉积物”，应直接联系上皮下驼峰状沉积。\n选项分析：\nA. 错误：内皮下沉积常见于膜增生性肾小球肾炎Ⅰ型、狼疮性肾炎等，不是链球菌感染后肾小球肾炎的主要沉积部位。\nB. 错误：基底膜致密层内沉积主要见于致密沉积物病（C3肾病），电镜下为致密层呈带状致密物，不是驼峰状。\nC. 正确：沉积物位于基底膜和脏层上皮细胞之间，即上皮下，呈驼峰状，是链球菌感染后肾小球肾炎的典型电镜特征。\nD. 错误：基底膜和脏层上皮细胞间沉积并被基底膜钉状突起分隔，是膜性肾病的典型表现，即“钉突”形成，不是驼峰状。\nE. 错误：壁层上皮下不是本病免疫复合物的主要沉积部位；壁层上皮细胞增生与新月体形成有关，常见于新月体性肾小球肾炎。\n易混点：膜性肾病与链球菌感染后肾小球肾炎都可表现为上皮下沉积，但前者形成基底膜钉状突起，后者为驼峰状沉积；膜增生性肾小球肾炎Ⅰ型以系膜区及内皮下沉积为特点，致密沉积物病以基底膜致密层沉积为特点。记忆要点：链球菌感染后“上皮下驼峰”，膜性肾病“上皮下钉突”。","chapter":13,"chapterName":"泌尿系统疾病","chapterTitle":"第13章 泌尿系统疾病"},{"id":"pathology-2a-single-0204","type":"single","typeLabel":"单选题","number":204,"question":"有关流行性脑脊髓膜炎的描述中，错误的是","options":[{"key":"A","text":"皮肤有淤点和淤斑"},{"key":"B","text":"脑膜刺激征"},{"key":"C","text":"颅内压升高症状"},{"key":"D","text":"血性脑脊液"},{"key":"E","text":"脑脊液中糖含量降低"}],"answerKeys":["D"],"answerText":["血性脑脊液"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：流行性脑脊髓膜炎是由脑膜炎奈瑟菌引起的急性化脓性脑脊髓膜炎，脑脊液呈脓性而非血性。\n解析：流行性脑脊髓膜炎的病理基础是蛛网膜下腔化脓性炎症，渗出物以中性粒细胞为主，故脑脊液外观混浊或呈脓性，白细胞显著增多、蛋白升高、糖降低。败血症期细菌内毒素及血管损伤可引起皮肤瘀点、瘀斑；脑膜炎症刺激及颅内压升高可产生脑膜刺激征和头痛、呕吐等表现。本题题眼是“错误的是”，血性脑脊液提示出血性病变，不符合流脑。\n\n选项分析：\nA. 正确：皮肤瘀点、瘀斑是流脑败血症期的典型体征，与细菌栓塞、内毒素致血管损伤有关。\nB. 正确：脑膜刺激征由蛛网膜下腔炎症刺激脑膜及脊神经根引起，是流脑常见表现。\nC. 正确：颅内压升高可致头痛、喷射性呕吐、视乳头水肿，严重时可发生脑疝。\nD. 错误：流脑脑脊液为混浊或脓性，不是血性脑脊液；血性脑脊液多见于蛛网膜下腔出血、脑出血等出血性病变。\nE. 正确：化脓性炎症时细菌及中性粒细胞消耗葡萄糖，故脑脊液糖含量降低，是化脓性脑膜炎的特点之一。\n\n易混点：流脑与乙脑均可有脑膜刺激征和颅内压升高，但流脑脑脊液为脓性、中性粒细胞为主、糖降低；乙脑多为清亮或微混、淋巴细胞为主、糖正常。血性脑脊液应首先想到蛛网膜下腔出血，而不是流行性脑脊髓膜炎。","chapter":18,"chapterName":"传染病","chapterTitle":"第18章 传染病"},{"id":"pathology-2a-single-0205","type":"single","typeLabel":"单选题","number":205,"question":"诊断肝硬化最可靠的依据是","options":[{"key":"A","text":"白球蛋白比值倒置"},{"key":"B","text":"面部、胸前蜘蛛痣"},{"key":"C","text":"脾肿大"},{"key":"D","text":"腹水"},{"key":"E","text":"肝穿刺活检，镜下见假小叶形成"}],"answerKeys":["E"],"answerText":["肝穿刺活检，镜下见假小叶形成"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n核心考点：肝硬化最可靠的诊断依据是肝穿刺活检镜下见假小叶形成。\n解析：肝硬化的基本病理变化是肝细胞弥漫性变性坏死、纤维结缔组织增生和肝细胞结节状再生，三者反复交替，导致正常肝小叶结构破坏，最终形成假小叶。假小叶是肝硬化的特征性病理改变，因此肝穿刺活检发现假小叶形成是诊断肝硬化最可靠的依据。本题题眼在“最可靠依据”，即病理组织学确诊依据，而不是临床表现或实验室检查。\n选项分析：\nA. 错误：白球蛋白比值倒置提示肝功能受损或免疫球蛋白增高，可见于肝硬化，也可见于慢性肝炎、其他慢性肝病等，缺乏特异性，不能作为最可靠诊断依据。\nB. 错误：面部、胸前蜘蛛痣与肝功能减退致雌激素灭活障碍有关，可见于肝硬化，但妊娠、青春期及某些肝病也可出现，属于临床表现而非确诊依据。\nC. 错误：脾肿大主要是门静脉高压的表现，可见于肝硬化，也可见于门静脉血栓、门静脉狭窄、血液系统疾病等，不能单独确诊肝硬化。\nD. 错误：腹水可由门静脉高压、低蛋白血症、水钠潴留等引起，肝硬化失代偿期常见，但结核性腹膜炎、心力衰竭、恶性肿瘤等也可出现，特异性不足。\nE. 正确：肝穿刺活检镜下见假小叶形成，可直接证明肝硬化的特征性结构改变，是诊断肝硬化最可靠、最具有病理学依据的检查。\n易混点：假小叶不是普通肝细胞再生结节，而是纤维结缔组织包绕的肝细胞结节，中央静脉缺如、偏位或出现多个，肝细胞索排列紊乱。记忆要点：肝硬化病理确诊看“假小叶”，临床门脉高压表现如脾大、腹水、蜘蛛痣仅提示而不能确诊。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-2a-single-0206","type":"single","typeLabel":"单选题","number":206,"question":"遗传性肿瘤发生的二次突变学说中，第一次突变和第二次突变发生的顺序应为","options":[{"key":"A","text":"原癌细胞－癌细胞"},{"key":"B","text":"原癌细胞－体细胞"},{"key":"C","text":"生殖细胞－体细胞"},{"key":"D","text":"体细胞－生殖细胞"},{"key":"E","text":"原癌细胞－生殖细胞"}],"answerKeys":["C"],"answerText":["生殖细胞－体细胞"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：遗传性肿瘤的“二次突变学说”强调第一次突变发生在生殖细胞系，第二次突变发生在体细胞，二者共同导致靶细胞转化。\n解析：二次突变学说以遗传性视网膜母细胞瘤为代表。遗传性肿瘤患者第一次突变发生在生殖细胞，因而全身多数体细胞均携带该突变，形成遗传易感性；当靶器官的某个体细胞再发生第二次突变，使另一等位基因也失活或异常激活，即可发生肿瘤。题眼是“遗传性肿瘤”和“第一次、第二次突变的先后顺序”，故应为生殖细胞突变在前、体细胞突变在后。散发性肿瘤则两次突变均发生在体细胞，不经过生殖细胞传递。\n选项分析：\nA. 错误：“原癌细胞－癌细胞”描述的是肿瘤演进或癌变的笼统过程，不是二次突变学说的两次打击顺序，也未体现生殖细胞与体细胞的层次。\nB. 错误：将“原癌细胞”和体细胞并列，混淆了原癌基因/抑癌基因突变与发生突变的细胞类型；二次突变学说不以“原癌细胞向体细胞转变”为顺序。\nC. 正确：遗传性肿瘤中第一次突变为生殖细胞系突变并可由亲代遗传，第二次突变为靶细胞体细胞突变，符合二次突变学说。\nD. 错误：顺序颠倒。若第一次在体细胞、第二次在生殖细胞，不符合遗传性肿瘤的遗传易感性形成机制；体细胞突变一般不能传递给后代。\nE. 错误：把“原癌细胞”与生殖细胞相混，概念不成立；生殖细胞突变是第一次打击，第二次打击应发生在体细胞，而不是“原癌细胞到生殖细胞”的顺序。\n易混点：遗传性肿瘤为“生殖细胞突变＋体细胞突变”，散发性肿瘤为“体细胞突变＋体细胞突变”。记忆要点：遗传性者先天携带第一次打击，后天靶细胞再中第二次打击即发病；经典例子为RB基因与视网膜母细胞瘤。","chapter":8,"chapterName":"遗传性疾病和儿童疾病","chapterTitle":"第8章 遗传性疾病和儿童疾病"},{"id":"pathology-2a-single-0207","type":"single","typeLabel":"单选题","number":207,"question":"动脉粥样硬化的继发性病变中最危险的是","options":[{"key":"A","text":"钙化"},{"key":"B","text":"斑块内出血"},{"key":"C","text":"斑块破裂"},{"key":"D","text":"动脉瘤形成"},{"key":"E","text":"粥样瘤性溃疡"}],"answerKeys":["C"],"answerText":["斑块破裂"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：动脉粥样硬化继发性病变中，斑块破裂最易诱发急性血栓形成和急性缺血事件，是危险性最高的并发症。\n解析：动脉粥样硬化斑块由纤维帽、脂质核心等构成。斑块破裂时，纤维帽完整性丧失，脂质核心和坏死物质暴露于血流，强烈激活凝血系统，迅速形成血栓，可引起冠状动脉、脑动脉等急性闭塞，导致急性心肌梗死、脑梗死甚至猝死。题眼是“继发性病变中最危险”，应抓“破裂后急性血栓形成”这一致命环节。\n\n选项分析：\nA. 错误：钙化属于继发性病变之一，可使动脉壁变硬、管腔狭窄，但通常进展较慢，危险性不如斑块破裂后急性血栓形成。钙化本身不是本题最危险的急性事件。\nB. 错误：斑块内出血可使斑块体积迅速增大、纤维帽张力增加，并可促进斑块破裂，属于危险因素和继发病变，但其最终致命后果多通过破裂、血栓形成实现，故不是最危险者。\nC. 正确：斑块破裂使脂质核心暴露，触发血小板黏附聚集和凝血级联反应，形成血栓并造成血管急性闭塞，是动脉粥样硬化最危险的继发性病变。\nD. 错误：动脉瘤形成是动脉粥样硬化累及中膜、管壁变薄后形成的继发性改变，可发生破裂出血，但属于较晚期并发症；相较斑块破裂所致急性血栓闭塞，它不是本题所指最危险者。\nE. 错误：粥样瘤性溃疡是斑块表面破溃形成的溃疡，可继发血栓形成和栓塞，但“斑块破裂”更强调纤维帽破裂及脂质核心暴露，是急性血栓形成的关键机制；溃疡是形态学表现之一，不等同于最危险的破裂事件。\n\n易混点：斑块破裂与粥样瘤性溃疡均可使斑块表面完整性受损并继发血栓，但考试强调“最危险”时选斑块破裂，因其可直接导致急性血栓形成和血管闭塞。记忆要点：斑块破裂—脂质核心暴露—急性血栓—心肌梗死/脑梗死。","chapter":9,"chapterName":"心血管系统疾病","chapterTitle":"第9章 心血管系统疾病"},{"id":"pathology-2a-single-0208","type":"single","typeLabel":"单选题","number":208,"question":"细胞内出现Mallory小体常见于","options":[{"key":"A","text":"门脉性肝硬化"},{"key":"B","text":"坏死后性肝硬化"},{"key":"C","text":"淤血性肝硬化"},{"key":"D","text":"酒精性肝硬化"},{"key":"E","text":"胆汁性肝硬化"}],"answerKeys":["D"],"answerText":["酒精性肝硬化"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：Mallory小体是酒精性肝病时肝细胞胞质内中间丝蛋白聚集形成的嗜酸性透明小体，最常见于酒精性肝硬化/酒精性肝炎。\n解析：Mallory小体又称酒精性透明小体，由受损肝细胞内角蛋白等中间丝异常聚集而成，HE染色下呈胞质内嗜酸性、不规则团块状结构，常位于核周。其形成与酒精代谢导致脂质过氧化、微管损伤和中间丝降解障碍有关，是酒精性肝病的重要形态学标志之一。题眼是“Mallory小体常见于”，应联系酒精性肝损伤，因此选酒精性肝硬化。\n选项分析：\nA. 错误：门脉性肝硬化是传统形态学分类中的小结节性肝硬化，常见于病毒性肝炎等，若为病毒性病因则不以Mallory小体为特征，故不是本题最佳答案。\nB. 错误：坏死后性肝硬化多属大结节性肝硬化，常由亚急性重型肝炎、药物或毒物损伤等引起，典型病变为广泛肝细胞坏死和纤维化，不以Mallory小体为常见标志。\nC. 错误：淤血性肝硬化又称心源性肝硬化，由慢性右心衰竭导致肝小叶中央区淤血、缺氧、坏死及纤维化，肉眼呈槟榔肝背景，无Mallory小体常见这一特点。\nD. 正确：酒精性肝硬化属于酒精性肝病终末阶段，酒精性肝炎/肝硬化时肝细胞可形成Mallory小体，伴肝细胞脂肪变、气球样变和中性粒细胞浸润，是考试中最常联系的病变。\nE. 错误：胆汁性肝硬化由长期胆道阻塞或胆汁淤积引起，主要见胆汁淤积、胆管增生和门管区纤维化，Mallory小体不是其常见形态学标志。\n易混点：Mallory小体为酒精性肝病相关嗜酸性透明小体；嗜酸性小体/Councilman小体多为肝细胞凋亡；Russell小体见于浆细胞；Negri小体见于狂犬病。记忆要点：Mallory小体与“酒精性肝病”强关联，非酒精性脂肪性肝炎也可出现，但考试首选酒精性肝硬化。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-2a-single-0209","type":"single","typeLabel":"单选题","number":209,"question":"假小叶的显微镜下的特点不包括","options":[{"key":"A","text":"再生的肝细胞结节"},{"key":"B","text":"增生的纤维组织分隔包绕"},{"key":"C","text":"小胆管和假胆管增生"},{"key":"D","text":"肝细胞内嗜酸性小体"},{"key":"E","text":"慢性炎细胞浸润"}],"answerKeys":["D"],"answerText":["肝细胞内嗜酸性小体"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：假小叶是肝硬化的基本病理形态学改变，由纤维结缔组织包绕的肝细胞再生结节构成。\n解析：假小叶的镜下特点包括：肝细胞排列紊乱、增生形成结节，结节周围有增生的纤维组织分隔包绕；纤维间隔内可见小胆管和假胆管增生、慢性炎细胞浸润，并可有血管改建。题眼是“假小叶的结构特点”，而肝细胞内嗜酸性小体是单个肝细胞凋亡形成的 Councilman 小体，主要见于病毒性肝炎等肝细胞损伤，并非假小叶的组成或诊断性结构。\n选项分析：\nA. 正确：再生的肝细胞结节是假小叶的核心成分，肝细胞排列紊乱、可伴脂肪变或坏死，属于假小叶特点。\nB. 正确：增生的纤维组织分隔并包绕肝细胞结节，形成假小叶的边界，是肝硬化假小叶的典型结构。\nC. 正确：纤维间隔内常伴小胆管增生和假胆管形成，属于假小叶周边纤维间隔的常见改变。\nD. 错误：肝细胞内嗜酸性小体是肝细胞凋亡小体，见于病毒性肝炎等，不代表假小叶的结构特点，故为本题“不包括”项。\nE. 正确：假小叶周围纤维间隔内常见淋巴细胞等慢性炎细胞浸润，属于其伴随病变。\n易混点：嗜酸性小体是单个肝细胞胞质浓缩、嗜酸性增强形成的凋亡小体；假小叶是“肝细胞结节＋纤维间隔”的结构单位。记忆要点：假小叶看“结节、纤维分隔、胆管增生、炎细胞”，嗜酸性小体看“单个肝细胞凋亡”，二者不能混为假小叶特征。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-2a-single-0210","type":"single","typeLabel":"单选题","number":210,"question":"以下哪项病变有助于对尖锐湿疣的诊断","options":[{"key":"A","text":"多量角化不全细胞"},{"key":"B","text":"凹空细胞"},{"key":"C","text":"表皮棘层肥厚"},{"key":"D","text":"乳头状瘤样增生"},{"key":"E","text":"角质层肥厚"}],"answerKeys":["B"],"answerText":["凹空细胞"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：尖锐湿疣的病理学诊断依据是HPV感染所致的凹空细胞。\n解析：尖锐湿疣由人类乳头瘤病毒（HPV）感染引起，好发于外生殖器及肛周等黏膜或皮肤移行部位。镜下最具有诊断价值的改变是表皮浅层出现凹空细胞，表现为细胞体积较大、核周有透亮空晕、核皱缩或轻度异型，常伴角化不全、棘层肥厚和乳头状增生。本题题眼是“有助于诊断”，应选择相对特异的凹空细胞，而不是一般性增生改变。\n\n选项分析：\nA. 错误：多量角化不全细胞可见于尖锐湿疣，也可见于其他HPV感染性病变及多种角化异常性皮肤病，缺乏诊断特异性。\nB. 正确：凹空细胞是HPV感染的特征性细胞学改变，位于表皮浅层，核周空晕、核皱缩，是尖锐湿疣的重要诊断依据。\nC. 错误：表皮棘层肥厚属于表皮增生性改变，可见于寻常疣、银屑病、慢性皮炎等多种疾病，不能作为尖锐湿疣的特异性诊断依据。\nD. 错误：乳头状瘤样增生可见于乳头状瘤、寻常疣、疣状癌等，虽然尖锐湿疣也可呈乳头状，但该改变本身不具特异性。\nE. 错误：角质层肥厚是角化过度表现，可见于胼胝、寻常疣、慢性湿疹等，不能提示尖锐湿疣。\n\n易混点：凹空细胞应与寻常疣中的空泡化细胞区分，后者也可由HPV感染引起，但尖锐湿疣的凹空细胞常位于表皮浅层且核周空晕明显。记忆要点：外生殖器乳头状肿物＋表皮浅层凹空细胞，首先考虑尖锐湿疣；棘层肥厚、乳头状增生、角化不全均只是辅助表现。","chapter":18,"chapterName":"传染病","chapterTitle":"第18章 传染病"},{"id":"pathology-2a-single-0211","type":"single","typeLabel":"单选题","number":211,"question":"早期胃癌的诊断标准是","options":[{"key":"A","text":"癌肿大小不超过2cm"},{"key":"B","text":"局部淋巴结无转移"},{"key":"C","text":"癌肿浸润深达肌层"},{"key":"D","text":"癌肿浸润未超过浆膜层"},{"key":"E","text":"瘤组织浸润仅限于黏膜或黏膜下层"}],"answerKeys":["E"],"answerText":["瘤组织浸润仅限于黏膜或黏膜下层"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n核心考点：早期胃癌是指癌组织浸润深度仅限于黏膜层或黏膜下层，而不论癌肿大小及有无淋
