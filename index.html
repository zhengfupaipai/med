<style>
  :root {
    --bg: #f4f6fb;
    --card: #ffffff;
    --text: #1e293b;
    --muted: #64748b;
    --line: #e2e8f0;
    --accent: #2563eb;
    --accent-dark: #1d4ed8;
    --ok: #16a34a;
    --bad: #dc2626;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .app { max-width: 860px; margin: 0 auto; padding: 28px 18px 48px; }

  .top {
    display: flex;
    flex-wrap: wrap;
    gap: 18px;
    align-items: flex-end;
    justify-content: space-between;
    margin-bottom: 22px;
  }
  .brand h1 { margin: 0; font-size: 26px; letter-spacing: .5px; }
  .brand p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  .top-stats {
    display: flex;
    gap: 10px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 10px 6px;
  }
  .top-stats > div {
    min-width: 62px;
    text-align: center;
    padding: 0 8px;
    display: flex;
    flex-direction: column;
  }
  .top-stats > div + div { border-left: 1px solid var(--line); }
  .top-stats span { font-size: 18px; font-weight: 700; line-height: 1.3; }
  .top-stats small { color: var(--muted); font-size: 11px; }

  .banks {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
    overflow-x: auto;
    padding-bottom: 2px;
  }
  .bank-tab {
    flex: 0 0 auto;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--muted);
    border-radius: 12px;
    padding: 10px 16px;
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: .15s;
  }
  .bank-tab b { font-weight: 600; color: inherit; }
  .bank-tab em {
    font-style: normal;
    font-size: 11px;
    background: #eef2f7;
    color: var(--muted);
    border-radius: 999px;
    padding: 1px 8px;
  }
  .bank-tab:hover { border-color: #bfdbfe; }
  .bank-tab.active {
    background: #eff6ff;
    border-color: #93c5fd;
    color: var(--accent-dark);
    box-shadow: 0 4px 14px rgba(37, 99, 235, .12);
  }
  .bank-tab.active em { background: #dbeafe; color: var(--accent-dark); }

  .chapter-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
  }
  .chapter-bar label { color: var(--muted); font-size: 13px; white-space: nowrap; }
  .chapter-bar select {
    flex: 1;
    max-width: 440px;
    padding: 9px 12px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
  }
  .chapter-bar select:focus { outline: 2px solid #bfdbfe; border-color: #93c5fd; }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .actions { display: flex; gap: 8px; }
  .modes { display: flex; gap: 8px; flex-wrap: wrap; }
  button { font-family: inherit; font-size: 14px; }
  .modes button, .ghost, .primary {
    border-radius: 10px;
    padding: 8px 14px;
    cursor: pointer;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--text);
    transition: .15s;
  }
  .modes button:hover, .ghost:hover { border-color: #cbd5e1; background: #f8fafc; }
  .modes button.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    box-shadow: 0 4px 12px rgba(37, 99, 235, .25);
  }
  .ghost.danger { color: var(--bad); }
  .ghost.danger:hover { border-color: #fecaca; background: #fef2f2; }
  .primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 600;
  }
  .primary:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
  .primary:disabled, .ghost:disabled {
    opacity: .45;
    cursor: not-allowed;
    box-shadow: none;
  }
  .small { padding: 6px 12px; font-size: 13px; }

  .progress {
    height: 6px;
    background: #e5eaf3;
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 18px;
  }
  #progressBar {
    height: 100%;
    width: 0;
    background: linear-gradient(90deg, #60a5fa, #2563eb);
    border-radius: 999px;
    transition: width .25s ease;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: 0 10px 30px rgba(30, 41, 59, .06);
    padding: 26px;
  }
  .meta {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 14px;
  }
  .meta .badge {
    background: #eef2ff;
    color: #4338ca;
    border-radius: 999px;
    padding: 2px 10px;
    font-weight: 600;
  }
  .meta .chapter-badge { background: #ecfdf5; color: #047857; }
  .qtext {
    font-size: 17px;
    font-weight: 600;
    line-height: 1.75;
    white-space: pre-wrap;
    margin-bottom: 20px;
  }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    width: 100%;
    text-align: left;
    padding: 12px 15px;
    border: 1px solid var(--line);
    background: #fff;
    border-radius: 12px;
    cursor: pointer;
    font-size: 15px;
    line-height: 1.6;
    color: var(--text);
    transition: .15s;
  }
  .option:hover:not(:disabled) { border-color: #93c5fd; background: #f8fbff; }
  .option:disabled { cursor: default; }
  .option .key {
    flex: 0 0 26px;
    height: 26px;
    border-radius: 50%;
    background: #eef2f7;
    color: #475569;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 13px;
    margin-top: 1px;
  }
  .option .txt { flex: 1; }
  .option.correct { border-color: #86efac; background: #f0fdf4; }
  .option.correct .key { background: var(--ok); color: #fff; }
  .option.wrong { border-color: #fca5a5; background: #fef2f2; }
  .option.wrong .key { background: var(--bad); color: #fff; }

  .feedback {
    margin-top: 18px;
    padding: 12px 15px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 600;
  }
  .feedback.hint { background: #f8fafc; color: var(--muted); font-weight: 400; }
  .feedback.ok { background: #f0fdf4; color: #15803d; }
  .feedback.bad { background: #fef2f2; color: #b91c1c; }

  .analysis {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed rgba(0, 0, 0, .12);
    font-weight: 400;
    font-size: 13px;
    color: var(--muted);
    white-space: pre-wrap;
  }

  .ai-row {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 12px;
  }
  .ai-btn {
    border: 1px solid #c7d2fe;
    background: #eef2ff;
    color: #4338ca;
    border-radius: 10px;
    padding: 7px 12px;
    font-size: 13px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: .15s;
  }
  .ai-btn:hover:not(:disabled) { background: #e0e7ff; }
  .ai-btn:disabled { opacity: .6; cursor: wait; }
  .ai-status { font-size: 12px; color: var(--muted); }

  .modal {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(15, 23, 42, .45);
  }
  .modal[hidden] { display: none; }
  .modal-card {
    width: 100%;
    max-width: 460px;
    max-height: 90vh;
    overflow-y: auto;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: 0 24px 60px rgba(15, 23, 42, .25);
    padding: 22px;
  }
  .modal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .modal-head h2 { margin: 0; font-size: 18px; }
  .modal-close {
    border: none;
    background: none;
    color: var(--muted);
    font-size: 24px;
    line-height: 1;
    padding: 0 4px;
    cursor: pointer;
  }
  .modal-close:hover { color: var(--text); }
  .modal-note {
    margin: 0 0 16px;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.6;
  }
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
  .field span { font-size: 13px; color: var(--muted); }
  .field input {
    width: 100%;
    padding: 9px 12px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
  }
  .field input:focus { outline: 2px solid #bfdbfe; border-color: #93c5fd; }
  .modal-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  .modal-status {
    min-height: 18px;
    margin-top: 10px;
    font-size: 12px;
    color: var(--muted);
    white-space: pre-wrap;
  }
  .modal-status.ok { color: #15803d; }
  .modal-status.bad { color: #b91c1c; }

  .done[hidden] { display: none; }
  .done {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: space-between;
    align-items: center;
    background: #eff6ff;
    border: 1px solid #bfdbfe;
    color: var(--accent-dark);
    border-radius: 12px;
    padding: 12px 16px;
    margin-bottom: 18px;
    font-size: 14px;
    font-weight: 600;
  }

  .nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 22px;
    padding-top: 18px;
    border-top: 1px solid var(--line);
  }
  .nav .pos { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }

  .empty { text-align: center; padding: 46px 16px; }
  .empty.hidden { display: none; }
  .empty-title { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
  .empty p { color: var(--muted); margin: 0 0 18px; font-size: 14px; }

  .foot {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: space-between;
    color: #6f7c91;
    font-size: 12px;
    margin-top: 18px;
    padding: 0 4px;
  }

  @media (max-width: 620px) {
    .app { padding: 20px 12px 36px; }
    .brand h1 { font-size: 21px; }
    .top { align-items: flex-start; }
    .top-stats { width: 100%; justify-content: space-between; }
    .card { padding: 18px; }
    .qtext { font-size: 16px; }
  }
</style>
<style id="liquid-theme">
  :root {
    --bg: #f6f8fc;
    --text: #172136;
    --muted: #4f5d75;
    --line: rgba(255, 255, 255, .62);
    --accent: #2563eb;
    --accent-dark: #1d4ed8;
    --ok: #15803d;
    --bad: #dc2626;
    --radius: 26px;
    --glass-bg: linear-gradient(145deg, rgba(255, 255, 255, .92), rgba(255, 255, 255, .76));
    --glass-border: rgba(255, 255, 255, .9);
    --glass-blur: 22px;
    --shadow-lg: 0 24px 60px -22px rgba(30, 52, 96, .28), 0 10px 24px -14px rgba(30, 52, 96, .14);
    --shadow-sm: 0 6px 18px -8px rgba(30, 52, 96, .16);
    --ease: cubic-bezier(.22, .8, .3, 1);
  }

  html { color-scheme: light; }
  body {
    min-height: 100svh;
    color: var(--text);
    background-color: #f6f8fc;
    background-image: radial-gradient(1100px 720px at 50% -12%, rgba(191, 219, 254, .32), transparent 68%);
    background-repeat: no-repeat;
    letter-spacing: .012em;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
  }
  ::selection { background: rgba(37, 99, 235, .18); }
  button { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 2px solid rgba(37, 99, 235, .55); outline-offset: 2px; }

  .app { max-width: 880px; padding: 30px 18px 56px; }

  .glass {
    position: relative;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    box-shadow: var(--shadow-lg), inset 0 1px 0 rgba(255, 255, 255, .9);
    -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(150%);
    backdrop-filter: blur(var(--glass-blur)) saturate(150%);
  }
  .glass::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1px;
    background: linear-gradient(150deg, rgba(255, 255, 255, .95), rgba(255, 255, 255, .12) 30%, rgba(255, 255, 255, .06) 62%, rgba(255, 255, 255, .7));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    mask-composite: exclude;
    pointer-events: none;
  }

  .top { align-items: center; margin-bottom: 20px; }
  .brand h1 { font-size: 28px; letter-spacing: .04em; }
  .brand p { color: var(--muted); }
  .top-stats { padding: 10px 8px; border-radius: 20px; }
  .top-stats > div { min-width: 68px; }
  .top-stats span { font-size: 19px; }
  .top-stats > div + div { border-left: 1px solid rgba(148, 163, 184, .28); }

  .banks { gap: 9px; padding: 2px 0 6px; scrollbar-width: none; }
  .banks::-webkit-scrollbar { display: none; }
  .bank-tab {
    background: rgba(255, 255, 255, .72);
    border: 1px solid rgba(255, 255, 255, .88);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .9), 0 4px 12px -8px rgba(30, 52, 96, .2);
    color: var(--muted);
    transition: transform .18s var(--ease), background-color .18s, border-color .18s, box-shadow .18s;
  }
  .bank-tab em { background: rgba(255, 255, 255, .8); }
  .bank-tab:hover { transform: translateY(-1px); border-color: rgba(147, 197, 253, .85); }
  .bank-tab.active {
    background: linear-gradient(140deg, rgba(219, 234, 254, .95), rgba(239, 246, 255, .72));
    border-color: rgba(147, 197, 253, .9);
    color: var(--accent-dark);
    box-shadow: inset 0 1px 0 #fff, 0 10px 24px -14px rgba(37, 99, 235, .55);
  }
  .bank-tab.active em { background: rgba(191, 219, 254, .75); color: var(--accent-dark); }

  .chapter-bar { margin-bottom: 14px; }
  .chapter-bar select {
    min-height: 42px;
    border: 1px solid rgba(255, 255, 255, .9);
    background: rgba(255, 255, 255, .84);
    border-radius: 13px;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .95), 0 4px 12px -10px rgba(30, 52, 96, .2);
    transition: border-color .18s, box-shadow .18s;
  }
  .chapter-bar select:hover { border-color: rgba(147, 197, 253, .9); }
  .chapter-bar select:focus {
    outline: none;
    border-color: rgba(96, 165, 250, .9);
    box-shadow: 0 0 0 3px rgba(147, 197, 253, .35), inset 0 1px 0 #fff;
  }

  .toolbar { margin-bottom: 16px; }
  .modes button, .ghost, .primary, .ai-btn {
    border-radius: 13px;
    min-height: 40px;

<div class="app">
  <header class="top">
    <div class="brand">

        <button type="button" data-theme-btn="light">浅色</button>

        <button type="button" data-theme-btn="dark">黑暗</button>

      <div><span id="statCorrect">0</span><small>正确</small></div>
      <div><span id="statRate">—</span><small>正确率</small></div>
      <div><span id="statWrong">0</span><small>错题</small></div>
    </div>

  <section class="chapter-bar">
    <label for="chapterSelect">章节</label>
    <select id="chapterSelect"></select>
    <label class="auto-next-toggle" for="autoNextToggle">
      <input type="checkbox" id="autoNextToggle" checked>
      <span class="auto-next-track" aria-hidden="true"><span class="auto-next-thumb"></span></span>
      <span>答对自动下一题</span>
    </label>
  </section>

  <section class="toolbar">
    <div class="modes" id="modeButtons">
      <button type="button" data-mode="seq">顺序练习</button>
      <button type="button" data-mode="random">随机练习</button>
      <button type="button" data-mode="wrong">错题练习</button>
      <button type="button" id="btnMemorize" class="memorize-toggle" aria-pressed="false">背题模式</button>
    </div>
    <div class="actions">
      <button type="button" id="btnAiSettings" class="ghost">AI 设置</button>
      <button type="button" id="btnRestart" class="ghost">重新开始</button>
    </div>
  </section>

  <div class="progress"><div id="progressBar"></div></div>

  <main class="card glass">
    <div class="empty" id="empty" hidden>
      <div class="empty-title" id="emptyTitle">暂无题目</div>
      <p id="emptyDesc"></p>
      <button type="button" id="emptyAction" class="primary" hidden>去顺序练习</button>
    </div>

    <div id="quiz">
      <div class="done" id="doneBanner" hidden>
        <span id="doneText"></span>
        <button type="button" id="doneRestart" class="primary small">再来一轮</button>
      </div>
      <div class="meta" id="qMeta"></div>
      <div class="qtext" id="qText"></div>
      <div class="image-warning" id="qImageWarning" hidden></div>
      <div class="options" id="qOptions"></div>
      <div class="feedback" id="feedback"></div>
      <div class="nav">
        <button type="button" id="btnPrev" class="ghost">上一题</button>
        <button type="button" id="btnQList" class="ghost" aria-expanded="false">题目列表</button>
        <div class="pos" id="qPos"></div>
        <button type="button" id="btnNext" class="primary">下一题</button>
      </div>
    </div>
  </main>

<script>
window.QUESTION_BANKS = [{"id":"pathology-2a","name":"病理学2A","count":300,"questions":[{"id":"pathology-2a-single-0001","type":"single","typeLabel":"单选题","number":1,"question":"流行性脑脊髓膜炎的病变性质属于","options":[{"key":"A","text":"变质性炎"},{"key":"B","text":"渗出性炎"},{"key":"C","text":"增生性炎"},{"key":"D","text":"肉芽肿性炎"},{"key":"E","text":"化脓性炎"}],"answerKeys":["E"],"answerText":["化脓性炎"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n\n核心考点：流行性脑脊髓膜炎是由脑膜炎双球菌引起的化脓性脑膜炎，病变性质为化脓性炎。\n\n解析：流行性脑脊髓膜炎的病原体为脑膜炎双球菌，经呼吸道传播，入血形成菌血症或败血症后侵犯软脑膜和蛛网膜，引起蛛网膜下腔大量中性粒细胞渗出，形成脓性渗出物。肉眼可见软脑膜充血、水肿、混浊，蛛网膜下腔积脓；镜下以中性粒细胞为主的化脓性渗出为特征。临床上常见高热、头痛、呕吐、脑膜刺激征及皮肤瘀点、瘀斑。本题题眼是“流行性脑脊髓膜炎”即化脓性脑膜炎，故最准确的病变性质是化脓性炎。\n\n选项分析：\nA. 错误：变质性炎以实质细胞变性、坏死为主，渗出和增生较轻，常见于病毒性肝炎、中毒性心肌炎等；流行性脑脊髓膜炎以中性粒细胞渗出和脓性渗出物为主，不是变质性炎。\nB. 错误：渗出性炎是较宽泛的基本类型，包括浆液性炎、纤维素性炎、化脓性炎等；流行性脑脊髓膜炎虽属于渗出性炎范畴，但本题要求选择更具体、更准确的病变性质，应选化脓性炎。\nC. 错误：增生性炎以组织细胞增生为主，如炎性息肉、肉芽组织增生等；流行性脑脊髓膜炎的突出病变是蛛网膜下腔脓性渗出，而非增生性改变。\nD. 错误：肉芽肿性炎以巨噬细胞及其演化的上皮样细胞、多核巨细胞形成肉芽肿为特征，常见于结核、伤寒、麻风等；流行性脑脊髓膜炎无典型肉芽肿形成。\nE. 正确：流行性脑脊髓膜炎为脑膜炎双球菌所致化脓性脑膜炎，病变以软脑膜充血、水肿及蛛网膜下腔中性粒细胞大量渗出、积脓为特征，故属于化脓性炎。\n\n易混点：流行性脑脊髓膜炎应与流行性乙型脑炎区分，后者为病毒引起的脑实质变质性炎，常累及神经细胞并出现噬神经细胞现象、卫星现象；结核性脑膜炎则以浆液纤维素性渗出和肉芽肿性病变为特点，多位于脑底部。记忆要点：流脑为“软脑膜化脓性炎”，乙脑为“脑实质变质性炎”。","chapter":4,"chapterName":"炎症","chapterTitle":"第4章 炎症"},{"id":"pathology-2a-single-0002","type":"single","typeLabel":"单选题","number":2,"question":"下述关于四肢动脉粥样硬化的叙述中，哪项是错误的","options":[{"key":"A","text":"四肢动脉粥样硬化常见于下肢动脉"},{"key":"B","text":"可以继发血栓形成"},{"key":"C","text":"可引起肢体局部坏疽"},{"key":"D","text":"较小动脉管腔狭窄，就易产生严重后果"},{"key":"E","text":"行走时可出现跛行症状"}],"answerKeys":["D"],"answerText":["较小动脉管腔狭窄，就易产生严重后果"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：四肢动脉粥样硬化的好发部位、继发病变及缺血性后果，尤其是较大动脉与较小动脉狭窄后侧支循环代偿的差异。\n解析：四肢动脉粥样硬化以下肢动脉多见，病变常累及较大、中等动脉，管腔狭窄导致肢体缺血，行走时出现间歇性跛行；斑块破裂或内皮损伤可继发血栓形成，严重狭窄或闭塞可引起肢体坏疽。本题题眼在“较小动脉管腔狭窄就易产生严重后果”，该说法错误：较小动脉狭窄时侧支循环较易建立，通常不首先产生严重后果；反而是较大动脉狭窄或闭塞、侧支代偿不足时后果更严重。\n选项分析：\nA. 正确：四肢动脉粥样硬化以下肢动脉最常见，常累及股动脉、腘动脉等。\nB. 正确：粥样斑块可破裂、溃疡，内皮损伤后易继发血栓形成，加重管腔阻塞。\nC. 正确：严重缺血且侧支循环不足时可发生肢体坏疽，下肢多见，常为干性坏疽。\nD. 错误：较小动脉管腔狭窄一般有较丰富的侧支循环代偿，不易产生严重后果；较大动脉狭窄或闭塞才更易导致明显缺血、坏死。本题所问正是此错误项。\nE. 正确：下肢动脉狭窄导致运动时供血不足，可出现间歇性跛行，行走后疼痛、休息后缓解。\n易混点：间歇性跛行提示肢体运动时缺血，静息痛提示缺血更重；坏疽是严重缺血晚期表现。记忆要点：四肢动脉粥样硬化“下肢多、大中动脉为主、可继发血栓、重者坏疽”，较小动脉狭窄因侧支代偿常不首先造成严重后果。","chapter":9,"chapterName":"心血管系统疾病","chapterTitle":"第9章 心血管系统疾病"},{"id":"pathology-2a-single-0003","type":"single","typeLabel":"单选题","number":3,"question":"慢性支气管炎患者通气和换气功能障碍的病变基础是","options":[{"key":"A","text":"支气管黏膜上皮细胞变性、坏死脱落"},{"key":"B","text":"支气管壁腺体增生、肥大"},{"key":"C","text":"支气管壁充血、水肿、淋巴细胞和浆细胞浸润"},{"key":"D","text":"急、慢性细支气管炎及细支气管周围炎"},{"key":"E","text":"支气管管壁平滑肌束断裂，萎缩"}],"answerKeys":["D"],"answerText":["急、慢性细支气管炎及细支气管周围炎"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：慢性支气管炎导致通气和换气功能障碍的关键病变是小气道及细支气管周围炎症。\n解析：慢性支气管炎虽然主要累及大、中等支气管，但出现通气和换气功能障碍的关键在于病变向细支气管及细支气管周围组织扩展，形成急、慢性细支气管炎及细支气管周围炎。炎症渗出、黏膜水肿、平滑肌痉挛及纤维化可使小气道狭窄、阻塞，增加气道阻力，引起通气障碍；细支气管周围炎症和肺泡壁受累可影响弥散及通气/血流比例，引起换气障碍。题眼是“通气与换气功能障碍的病变基础”，应选择小气道及周围炎。\n\n选项分析：\nA. 错误：支气管黏膜上皮细胞变性、坏死脱落主要损害纤毛黏液清除功能，临床以咳嗽、咳痰为主，不是通气和换气障碍的主要病变基础。\nB. 错误：支气管壁腺体增生、肥大导致黏液分泌增多，是慢性支气管炎的典型病理改变和咳痰基础，但不直接造成明显通气和换气障碍。\nC. 错误：支气管壁充血、水肿及淋巴细胞和浆细胞浸润属于慢性炎症表现，可参与管腔狭窄，但不如细支气管及细支气管周围炎对小气道阻塞和换气功能影响关键。\nD. 正确：急、慢性细支气管炎及细支气管周围炎可造成小气道狭窄、阻塞，并累及细支气管周围肺泡组织，是通气和换气功能障碍的主要病变基础。\nE. 错误：支气管管壁平滑肌束断裂、萎缩及软骨破坏可使管壁支撑力下降、呼气时气道塌陷，加重阻塞，但不是本题所问通气和换气功能障碍的主要病变基础。\n\n易混点：腺体增生肥大对应“痰多”，上皮损伤对应“纤毛清除功能下降”，平滑肌和软骨破坏对应“管壁塌陷”；而细支气管炎及细支气管周围炎才是突出引起小气道阻塞和通气/换气障碍的病变基础。","chapter":10,"chapterName":"呼吸系统疾病","chapterTitle":"第10章 呼吸系统疾病"},{"id":"pathology-2a-single-0004","type":"single","typeLabel":"单选题","number":4,"question":"脑萎缩的大体特征是","options":[{"key":"A","text":"脑沟加深，脑回变窄"},{"key":"B","text":"脑沟加深，脑回增宽"},{"key":"C","text":"脑沟变窄，脑回增宽"},{"key":"D","text":"脑沟变窄，脑回变窄"},{"key":"E","text":"脑沟变浅，脑回变窄"}],"answerKeys":["A"],"answerText":["脑沟加深，脑回变窄"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：A\n核心考点：脑萎缩时脑沟加深、脑回变窄，是脑实质体积缩小后大体形态改变的基本表现。\n解析：脑萎缩指脑组织实质细胞体积缩小或数量减少，导致脑体积缩小、重量减轻。由于脑皮质变薄、脑回缩小，脑回变窄；脑回间相应的脑沟因脑实质减少而相对增宽、加深，严重时可见蛛网膜下腔扩大、脑室扩张。题眼是“萎缩”导致组织体积缩小，故表现为脑沟加深、脑回变窄，而不是脑回增宽。\n选项分析：\nA. 正确：脑实质缩小使脑回变窄，脑回间间隙增大使脑沟加深，为脑萎缩的典型大体改变。\nB. 错误：脑沟加深可见于脑萎缩，但脑回增宽不是萎缩表现；脑回增宽多见于脑水肿等脑体积增大的病变。\nC. 错误：脑沟变窄、脑回增宽提示脑组织肿胀、体积增大，常见于脑水肿，与脑萎缩相反。\nD. 错误：脑沟变窄、脑回变窄不符合脑萎缩的形态学逻辑；萎缩时脑回变窄，但脑沟应加深、增宽。\nE. 错误：脑回变窄可见于萎缩，但脑沟变浅不是脑萎缩的典型表现；脑沟变浅常见于脑水肿导致脑回肿胀、脑沟受压变窄变浅。\n易混点：记忆要点是“萎缩 = 体积小、沟深回窄；水肿 = 体积大、沟浅回宽”。脑水肿时脑回增宽、脑沟变窄变浅，可与脑萎缩的脑沟加深、脑回变窄形成对照。","chapter":1,"chapterName":"细胞和组织的适应与损伤","chapterTitle":"第1章 细胞和组织的适应与损伤"},{"id":"pathology-2a-single-0005","type":"single","typeLabel":"单选题","number":5,"question":"卵巢Krukenberg瘤的原发病灶常在","options":[{"key":"A","text":"肺"},{"key":"B","text":"胃肠道"},{"key":"C","text":"乳腺"},{"key":"D","text":"肝脏"},{"key":"E","text":"子宫内膜"}],"answerKeys":["B"],"answerText":["胃肠道"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：Krukenberg瘤是卵巢的转移性黏液癌/印戒细胞癌，原发灶最常见于胃肠道，尤其是胃。\n解析：Krukenberg瘤并非卵巢原发肿瘤，而是胃癌等胃肠道癌转移至卵巢形成的转移性癌，经典组织学表现为含黏液的印戒细胞浸润卵巢间质，并伴明显促纤维增生。肿瘤常累及双侧卵巢，可形成肾形或实性肿块，临床上有时卵巢转移灶先于原发胃癌被发现。本题题眼是“原发病灶常在”，应选胃肠道。\n选项分析：\nA. 错误：肺癌可发生卵巢转移，但不是Krukenberg瘤的典型和常见原发部位；肺癌卵巢转移不呈经典印戒细胞癌伴间质促纤维增生表现。\nB. 正确：胃肠道是Krukenberg瘤最常见的原发部位，尤以胃印戒细胞癌最典型，癌细胞可经腹膜、淋巴道或血行转移至卵巢。\nC. 错误：乳腺癌可转移至卵巢，乳腺小叶癌甚至可模拟卵巢原发肿瘤，但乳腺癌不是Krukenberg瘤的经典常见原发灶，不能作为本题最佳答案。\nD. 错误：原发性肝癌转移至卵巢少见，且肝癌不是Krukenberg瘤的典型来源；肝脏更多是胃肠道癌转移的靶器官，而不是本题所指原发灶。\nE. 错误：子宫内膜癌可累及卵巢或与卵巢癌并存，但属于子宫内膜原发肿瘤的扩散/转移，不符合Krukenberg瘤“胃肠道来源的卵巢转移性印戒细胞癌”这一概念。\n易混点：需区分卵巢原发性黏液性癌与转移性Krukenberg瘤。记忆要点是“双侧、肾形、印戒细胞、间质促纤维增生，原发多在胃”；若见到卵巢印戒细胞癌，应首先追查胃肠道，尤其是胃。","chapter":14,"chapterName":"生殖系统和乳腺疾病","chapterTitle":"第14章 生殖系统和乳腺疾病"},{"id":"pathology-2a-single-0006","type":"single","typeLabel":"单选题","number":6,"question":"如图所示，它属于下列哪个部位的何种病变","options":[{"key":"A","text":"黏膜的纤维素性炎"},{"key":"B","text":"浆膜的纤维素性炎"},{"key":"C","text":"黏膜的浆液性炎"},{"key":"D","text":"浆膜的浆液性炎"},{"key":"E","text":"化脓性炎"}],"answerKeys":["A"],"answerText":["黏膜的纤维素性炎"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：A\n核心考点：纤维素性炎按发生部位可分为黏膜的纤维素性炎（假膜性炎）和浆膜的纤维素性炎，本题题眼为“黏膜表面纤维素性渗出/假膜形成”。\n解析：题目图片未提供，仅依据题干文字和标准答案分析。黏膜的纤维素性炎时，渗出的纤维素、坏死上皮和炎细胞在黏膜表面凝聚，形成灰白色膜状物，即假膜，故又称假膜性炎，常见于白喉、细菌性痢疾等。其病理学依据是纤维素性渗出为主并伴黏膜坏死，而不是以浆液或脓液渗出为主。本题选A的关键是把病变部位定位在“黏膜”，把渗出性质定位在“纤维素性”。\n选项分析：\nA. 正确：黏膜的纤维素性炎又称假膜性炎，渗出物以纤维素为主，常形成覆盖于黏膜表面的假膜，符合标准答案。\nB. 错误：浆膜的纤维素性炎发生在心包、胸膜、腹膜等浆膜面，典型如纤维素性心包炎形成“绒毛心”，不是黏膜病变。\nC. 错误：黏膜的浆液性炎以浆液渗出为主，常见于感冒早期鼻黏膜卡他性炎，表现为浆液性分泌物，不形成纤维素性假膜。\nD. 错误：浆膜的浆液性炎表现为浆膜腔积液，如胸腔积液、心包积液，渗出物以浆液为主，无黏膜假膜形成。\nE. 错误：化脓性炎以中性粒细胞大量渗出和脓液形成为特点，常见于脓肿、蜂窝织炎、化脓性阑尾炎等，不符合纤维素性炎的基本改变。\n易混点：黏膜纤维素性炎的记忆要点是“黏膜+假膜”，如白喉、菌痢；浆膜纤维素性炎的记忆要点是“浆膜+纤维素机化/粘连”，如绒毛心。浆液性炎则以“清亮液体渗出”为主，化脓性炎以“脓液和中性粒细胞”为主。","chapter":4,"chapterName":"炎症","chapterTitle":"第4章 炎症","needsImage":true},{"id":"pathology-2a-single-0007","type":"single","typeLabel":"单选题","number":7,"question":"动脉粥样硬化复合病变中最危险的并发症是","options":[{"key":"A","text":"脉瘤的形成"},{"key":"B","text":"血栓的形成"},{"key":"C","text":"钙化"},{"key":"D","text":"斑块内出血"},{"key":"E","text":"斑块破裂"}],"answerKeys":["D"],"answerText":["斑块内出血"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：动脉粥样硬化复合病变中，斑块内出血可致斑块急性增大并诱发急性缺血事件。\n解析：斑块内出血多因斑块内新生血管破裂或斑块表面裂隙使血液进入斑块内，导致斑块体积迅速增大、管腔急性狭窄甚至闭塞；同时可进一步引起斑块破裂和血栓形成，因而临床后果最危险。本题题眼是“复合病变中最危险”，强调急性、可迅速导致缺血或闭塞的病变，标准答案为斑块内出血。\n选项分析：\nA. 错误：动脉瘤形成是动脉粥样硬化严重并发症之一，因斑块处中膜被破坏、管壁薄弱而局部膨出，可发生破裂出血，但多属慢性进展性改变，不是本题所指复合病变中最危险者。\nB. 错误：血栓形成常继发于斑块破裂、斑块内出血或内皮损伤，可导致管腔阻塞和梗死，但它是复合病变的重要后果之一；本题强调最危险的原发性复合病变，标准答案为斑块内出血。\nC. 错误：钙化是动脉粥样硬化晚期常见改变，使斑块和管壁变硬、脆性增加，但通常不直接造成斑块急性膨胀或管腔突然闭塞，危险性相对较低。\nD. 正确：斑块内出血可使斑块在短时间内明显增大，压迫管腔并加重狭窄，还可促发斑块破裂和血栓形成，导致急性心肌缺血、脑缺血等严重后果，故为复合病变中最危险者。\nE. 错误：斑块破裂可暴露脂质核心和胶原，启动血小板黏附聚集及血栓形成，是急性冠脉综合征的重要机制；但本题标准答案强调斑块内出血所致斑块急性增大和后续连锁反应，故不选此项。\n易混点：斑块内出血、斑块破裂和血栓形成常相互关联。记忆要点：斑块内出血使斑块“急性膨胀”，斑块破裂是“暴露内容物”，血栓形成是“管腔堵塞的后果”；三者均可致急性缺血，但标准答案突出斑块内出血为最危险复合病变。","chapter":9,"chapterName":"心血管系统疾病","chapterTitle":"第9章 心血管系统疾病"},{"id":"pathology-2a-single-0008","type":"single","typeLabel":"单选题","number":8,"question":"左心衰竭患者的股静脉血栓脱落可引起肺","options":[{"key":"A","text":"贫血性梗死"},{"key":"B","text":"出血性梗死"},{"key":"C","text":"心肌梗死"},{"key":"D","text":"凝固性坏死"},{"key":"E","text":"液化性坏死"}],"answerKeys":["B"],"answerText":["出血性梗死"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：肺栓塞在肺淤血基础上易形成出血性梗死。\n解析：股静脉血栓脱落后经下腔静脉、右心进入肺动脉，造成肺动脉分支栓塞。左心衰竭时肺静脉压升高、肺淤血，支气管动脉侧支供血不足，加之肺组织疏松、双重血供，梗死区血液不易被挤出，故形成出血性梗死。题眼是“股静脉血栓脱落引起肺”加“左心衰竭肺淤血”，提示肺出血性梗死而不是贫血性梗死。\n\n选项分析：\nA. 错误：贫血性梗死多见于脾、肾、心等结构致密、侧支循环不丰富且无严重淤血的器官，肺因双重血供和淤血背景不符合。\nB. 正确：肺梗死典型为出血性梗死，尤其左心衰竭肺淤血时更易发生；梗死区呈暗红色，镜下肺泡腔内充满红细胞。\nC. 错误：心肌梗死由冠状动脉阻塞引起，病变部位在心肌，属于心肌缺血性凝固性坏死，不是肺栓塞所致肺部病变。\nD. 错误：凝固性坏死是坏死的基本类型，可见于心、肾、脾缺血性梗死；肺梗死虽可伴凝固性坏死，但本题问的是梗死类型，应选出血性梗死。\nE. 错误：液化性坏死常见于脑梗死、化脓性感染等，肺梗死不以液化性坏死为主要表现。\n\n易混点：出血性梗死形成条件常概括为“严重淤血＋组织疏松＋双重血供”，典型见于肺和肠；贫血性梗死多见于“结构致密、侧支少”的脾、肾、心。记忆时注意：肺栓塞不一定都梗死，只有在肺淤血、支气管动脉供血不足时才易发生出血性梗死。","chapter":3,"chapterName":"局部血液循环障碍","chapterTitle":"第3章 局部血液循环障碍"},{"id":"pathology-2a-single-0009","type":"single","typeLabel":"单选题","number":9,"question":"下列哪种肿瘤的发生与EB病毒感染密切相关","options":[{"key":"A","text":"胃癌"},{"key":"B","text":"鼻咽癌"},{"key":"C","text":"膀胱癌"},{"key":"D","text":"肺癌"},{"key":"E","text":"胰腺癌"}],"answerKeys":["B"],"answerText":["鼻咽癌"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：EB病毒（EBV）感染与鼻咽癌发生密切相关，尤其非角化型（未分化型）鼻咽癌。\n解析：鼻咽癌好发于鼻咽顶后壁及咽隐窝，组织学上以非角化性癌多见，其中未分化型癌细胞呈泡状核、核仁明显，间质常有大量淋巴细胞浸润。EBV潜伏感染鼻咽上皮细胞后，病毒编码的LMP1、EBNA等可促进细胞增殖、抑制凋亡并参与免疫逃逸，是鼻咽癌的重要致病因素；临床上常表现为涕中带血、鼻塞、耳鸣及颈部淋巴结转移。本题题眼是“EB病毒感染密切相关”，应选鼻咽癌。\n\n选项分析：\nA. 错误：胃癌的经典相关因素是幽门螺杆菌、吸烟、高盐及腌制饮食等；EBV仅与少数EBV相关胃癌有关，不是考试中“与EBV感染密切相关”的代表性肿瘤。\nB. 正确：鼻咽癌，特别是非角化型鼻咽癌，与EBV潜伏感染密切相关，患者血清中常可检出EBV相关抗体及EBV DNA，病理上癌细胞间可见淋巴细胞浸润。\nC. 错误：膀胱癌主要与吸烟、芳香胺类化学物、慢性膀胱炎等有关；埃及血吸虫感染可相关于膀胱鳞状细胞癌，但与EBV无明确密切相关。\nD. 错误：肺癌主要与吸烟、石棉、氡、空气污染等有关；EBV不是肺癌的公认主要致病病毒。\nE. 错误：胰腺癌主要与吸烟、慢性胰腺炎、肥胖、糖尿病和遗传因素等有关；EBV感染不是其经典致病因素。\n\n易混点：EBV相关肿瘤记忆为“鼻咽癌、Burkitt淋巴瘤、霍奇金淋巴瘤、NK/T细胞淋巴瘤及移植后淋巴增殖性疾病”；HPV主要与宫颈癌、口咽癌相关，HBV/HCV与肝细胞癌相关，幽门螺杆菌与胃MALT淋巴瘤及胃癌相关。","chapter":6,"chapterName":"肿瘤","chapterTitle":"第6章 肿瘤"},{"id":"pathology-2a-single-0010","type":"single","typeLabel":"单选题","number":10,"question":"引起成人肾病综合征最常见的原因为","options":[{"key":"A","text":"系膜增生性肾小球肾炎"},{"key":"B","text":"膜性增生性肾小球肾炎"},{"key":"C","text":"局灶性节段性肾小球硬化"},{"key":"D","text":"脂性肾病"},{"key":"E","text":"膜性肾小球肾炎"}],"answerKeys":["E"],"answerText":["膜性肾小球肾炎"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n核心考点：成人原发性肾病综合征最常见的病理类型为膜性肾小球肾炎。\n解析：膜性肾小球肾炎多见于中老年成人，是成人肾病综合征最常见的原因。其发病机制主要为自身抗体与肾小球基底膜上皮侧抗原结合，形成上皮下免疫复合物，激活补体导致基底膜弥漫性增厚，银染色可见“钉突”形成，电镜下上皮下电子致密物沉积、足细胞足突融合。临床以大量蛋白尿、低蛋白血症、明显水肿和高脂血症为特征，题眼是“成人”与“肾病综合征最常见原因”。\n选项分析：\nA. 错误：系膜增生性肾小球肾炎以系膜细胞和系膜基质增生为特点，常表现为血尿、蛋白尿，部分可呈肾病综合征，但不是成人肾病综合征最常见原因。\nB. 错误：膜性增生性肾小球肾炎又称系膜毛细血管性肾小球肾炎，多见于儿童和青少年，常呈肾炎综合征或肾病综合征伴血尿，低补体血症较突出，并非成人最常见。\nC. 错误：局灶性节段性肾小球硬化可导致成人肾病综合征，且是较常见类型之一，但并非最常见；其病变为部分肾小球节段性硬化，常伴高血压、血尿和肾功能减退。\nD. 错误：脂性肾病即微小病变性肾小球病，是儿童肾病综合征最常见原因，成人也可发生但比例较低；光镜下肾小球基本正常，电镜下足细胞足突弥漫融合。\nE. 正确：膜性肾小球肾炎是成人肾病综合征最常见的原因，尤其好发于中老年；病理以基底膜增厚、上皮下免疫复合物沉积和钉突形成为核心。\n易混点：肾病综合征最常见原因要区分年龄：儿童首推微小病变性肾小球病（脂性肾病），成人首推膜性肾小球肾炎。记忆要点：儿童“脂性”，成人“膜性”；膜性肾病标志是基底膜增厚、钉突和上皮下沉积。","chapter":13,"chapterName":"泌尿系统疾病","chapterTitle":"第13章 泌尿系统疾病"},{"id":"pathology-2a-single-0011","type":"single","typeLabel":"单选题","number":11,"question":"关于肉芽组织的结局，下列叙述正确的是","options":[{"key":"A","text":"最终填补缺损"},{"key":"B","text":"最终纤维化形成瘢痕"},{"key":"C","text":"抗感染的过程"},{"key":"D","text":"产生细胞外基质的过程"},{"key":"E","text":"分泌大量生长因子，调控细胞增生的过程"}],"answerKeys":["B"],"answerText":["最终纤维化形成瘢痕"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：肉芽组织的转归及瘢痕形成机制。\n解析：肉芽组织由新生毛细血管、成纤维细胞及炎细胞构成，在创伤修复中可填补缺损、抗感染、机化或包裹坏死物和异物；但其最终结局是成纤维细胞逐渐转变为纤维细胞，胶原纤维增多、血管减少，肉芽组织纤维化而形成瘢痕组织。题眼是“结局”，应选“最终纤维化形成瘢痕”，而不是肉芽组织在修复过程中的作用或形成机制。\n选项分析：\nA. 错误：肉芽组织具有填补缺损的作用，但这是修复过程中的功能表现，不是最终结局；缺损最终由纤维化形成的瘢痕组织修复。\nB. 正确：肉芽组织逐渐发生纤维化，血管减少、胶原增多，最终转变为瘢痕组织，这是其经典结局。\nC. 错误：抗感染是肉芽组织的重要作用之一，主要与炎细胞、新生血管及渗出有关，属于修复过程，不是最终结局。\nD. 错误：产生细胞外基质是肉芽组织纤维化、瘢痕形成的机制之一，不能概括最终结局。\nE. 错误：分泌生长因子、调控细胞增生是肉芽组织形成和修复过程中的调节机制，不是肉芽组织的最终转归。\n易混点：肉芽组织是新生毛细血管和成纤维细胞构成的修复性组织，最终变为瘢痕组织；肉芽肿则是巨噬细胞增生形成的炎症性病变，二者概念不同。记忆要点：肉芽组织“先修复、后纤维化”，最终结局是瘢痕。","chapter":2,"chapterName":"损伤的修复","chapterTitle":"第2章 损伤的修复"},{"id":"pathology-2a-single-0012","type":"single","typeLabel":"单选题","number":12,"question":"下列属病理性再生的是","options":[{"key":"A","text":"血细胞的更新"},{"key":"B","text":"肠道黏膜上皮的更新"},{"key":"C","text":"子宫内膜的周期性再生"},{"key":"D","text":"皮肤缺损由周围的被覆上皮增生修复"},{"key":"E","text":"口腔黏膜上皮脱落更新"}],"answerKeys":["D"],"answerText":["皮肤缺损由周围的被覆上皮增生修复"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：生理性再生与病理性再生的区别，即组织更新是否发生在正常生理状态下。\n解析：病理性再生是指组织、细胞因损伤而缺失后，由邻近存活的同种细胞增生修复的过程。皮肤缺损后，周围残存的被覆上皮（主要来自表皮基底层或毛囊、汗腺上皮）增生、迁移覆盖创面，属于损伤后的修复性再生，因此为病理性再生。本题题眼是“病理性”，即再生由损伤引起，而非正常周期性更新。\n选项分析：\nA. 错误：血细胞的更新是骨髓造血干细胞持续增殖分化以补充衰老血细胞，属于正常生理性再生。\nB. 错误：肠道黏膜上皮不断脱落并由隐窝干细胞增生补充，属于生理性更新，不属于病理性再生。\nC. 错误：子宫内膜在月经周期中受激素调节发生周期性增生和脱落再生，属于生理性再生。\nD. 正确：皮肤缺损后由周围被覆上皮增生修复，是损伤后的修复过程，属于病理性再生。\nE. 错误：口腔黏膜上皮脱落后由基底层细胞增生补充，属于正常生理性更新。\n易混点：生理性再生是正常组织更新，如血细胞、肠黏膜、子宫内膜和口腔黏膜上皮；病理性再生是损伤后修复。若损伤浅表、由同种上皮细胞修复，属完全再生；若缺损深、由纤维组织修复，则形成瘢痕，属不完全再生。","chapter":2,"chapterName":"损伤的修复","chapterTitle":"第2章 损伤的修复"},{"id":"pathology-2a-single-0013","type":"single","typeLabel":"单选题","number":13,"question":"下列关于心肌梗死的合并症的描述，哪项是错误的","options":[{"key":"A","text":"心脏破裂多见"},{"key":"B","text":"可引起心源性休克"},{"key":"C","text":"附壁血栓多见于左心室"},{"key":"D","text":"室壁瘤较多见"},{"key":"E","text":"常引起急性充血性心衰"}],"answerKeys":["E"],"answerText":["常引起急性充血性心衰"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n\n核心考点：心肌梗死的常见并发症及其临床病理联系。\n\n解析：急性心肌梗死可并发心律失常、心力衰竭、心源性休克、心脏破裂、室壁瘤和附壁血栓形成等。心梗后最常出现的是急性左心衰竭，严重时可致心源性休克；而“急性充血性心衰”表述不准确，充血性心力衰竭通常指慢性心衰伴肺循环和/或体循环淤血，并非急性心肌梗死常见的典型合并症表述。本题题眼在于“错误的合并症描述”，应选E。\n\n选项分析：\nA. 正确：心脏破裂是急性透壁性心肌梗死的重要严重并发症，多发生于梗死后1～2周，好发于左心室前壁、心尖部，可引起心包积血和心脏压塞。\nB. 正确：大面积心肌梗死使左心室泵血功能急剧下降，心排血量明显减少，可引起血压下降、组织灌注不足，即心源性休克。\nC. 正确：梗死累及心内膜时，心内膜粗糙并伴血流淤滞，易在左心室形成附壁血栓；血栓脱落可导致体循环动脉栓塞。\nD. 正确：梗死区坏死组织机化、瘢痕形成后心室壁变薄，在心室腔内压作用下局部向外膨出，形成室壁瘤，多见于左心室前壁和心尖部。\nE. 错误：心肌梗死常引起急性左心衰竭，严重者发生心源性休克；“急性充血性心衰”不是其典型、常见的合并症表述。充血性心力衰竭多指慢性心力衰竭伴淤血表现，不能作为本题的常见并发症。\n\n易混点：急性左心衰竭表现为肺水肿、呼吸困难；心源性休克强调心排血量骤降和组织灌注不足；充血性心力衰竭强调慢性淤血综合征。记忆要点：心梗并发症记“心律失常、心衰、休克、破裂、室壁瘤、附壁血栓”，但心衰通常表述为急性左心衰，而非“急性充血性心衰”。","chapter":9,"chapterName":"心血管系统疾病","chapterTitle":"第9章 心血管系统疾病"},{"id":"pathology-2a-single-0014","type":"single","typeLabel":"单选题","number":14,"question":"老年人产生萎缩的器官主要是","options":[{"key":"A","text":"心、肾"},{"key":"B","text":"脑、心"},{"key":"C","text":"肝、肺"},{"key":"D","text":"心、肺"},{"key":"E","text":"肾、脑"}],"answerKeys":["B"],"answerText":["脑、心"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：老年性萎缩（生理性萎缩）的好发器官及形态学表现。\n解析：老年人随年龄增长，脑和心等实质器官可发生生理性萎缩，故本题选B。脑萎缩时脑体积缩小、重量减轻，脑回变窄、脑沟增宽，脑室扩大；心肌萎缩时心肌细胞体积变小，可伴脂褐素沉积，形成“褐色萎缩”，心肌间质纤维组织相对增多。题眼是“老年人”和“主要”，应联系老年性萎缩的经典好发器官为脑、心。\n\n选项分析：\nA. 错误：心可发生老年性萎缩，但肾不是本题所指的主要老年性萎缩器官；肾萎缩更常见于肾动脉硬化、慢性肾盂肾炎、慢性肾小球肾炎等病理性改变，或全身性萎缩。该选项以肾替代了脑，故不选。\nB. 正确：脑和心是老年人发生生理性萎缩的典型器官。脑萎缩表现为脑沟增宽、脑回变窄、脑室扩大；心肌萎缩可见心肌细胞变小和脂褐素沉积，符合老年性萎缩的病理特点。\nC. 错误：肝、肺不是老年性萎缩的主要代表器官。肝萎缩可见于慢性肝病、营养不良、充血等；肺萎缩可见于肺不张、压迫性萎缩等，均属病理情况，不能概括老年性生理性萎缩。\nD. 错误：心可发生老年性萎缩，但肺不是主要器官；肺体积缩小更常见于肺不张、压迫性肺萎陷或肺纤维化等病变。该选项以肺替代了脑，故不选。\nE. 错误：脑为老年性萎缩的主要器官之一，但肾不是本题经典答案所指的主要器官；老年肾可有重量减轻和肾单位减少，但考试中“老年性萎缩主要器官”强调脑和心。该选项以肾替代了心，故不选。\n\n易混点：老年性萎缩属生理性萎缩，经典好发器官记“脑、心”；心肌萎缩时脂褐素沉积称褐色萎缩。病理性萎缩则按原因分为营养不良性、压迫性、失用性、神经性、内分泌性等，如肾萎缩、肺不张不能与老年性生理性萎缩混同。","chapter":1,"chapterName":"细胞和组织的适应与损伤","chapterTitle":"第1章 细胞和组织的适应与损伤"},{"id":"pathology-2a-single-0015","type":"single","typeLabel":"单选题","number":15,"question":"食管癌最常见的组织学类型是","options":[{"key":"A","text":"鳞状细胞癌"},{"key":"B","text":"小细胞癌"},{"key":"C","text":"腺癌"},{"key":"D","text":"腺鳞癌"},{"key":"E","text":"黏液癌"}],"answerKeys":["A"],"answerText":["鳞状细胞癌"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：A\n核心考点：食管癌的组织学类型及地域分布特点。\n解析：食管癌在我国最常见的组织学类型是鳞状细胞癌，约占90%以上，多发生于食管中段，与吸烟、饮酒、亚硝胺类物质、过热或粗糙饮食、食管慢性炎症及Barrett食管无关。其发生常经历食管黏膜上皮异型增生→原位癌→浸润癌的过程，镜下可见癌细胞形成角化珠和细胞间桥。题眼是“我国最常见”和“组织学类型”，应选鳞状细胞癌；但在欧美国家，食管下段及食管胃交界处腺癌的发病率已明显上升，这与Barrett食管相关，属于考试中常考的地域差异。\n选项分析：\nA. 正确：鳞状细胞癌在我国食管癌中最常见，好发于食管中段，镜下可见角化珠、细胞间桥，符合本题“最常见组织学类型”。\nB. 错误：小细胞癌属于神经内分泌癌，在食管中罕见，恶性程度高、预后差，并非最常见类型。\nC. 错误：腺癌多起源于食管下段的Barrett食管或食管腺体，在欧美国家发病率上升，但在我国食管癌中仍少于鳞状细胞癌。\nD. 错误：腺鳞癌同时具有腺癌和鳞癌成分，属于少见类型，不是食管癌最常见组织学类型。\nE. 错误：黏液癌是腺癌的一种特殊亚型，以癌细胞分泌大量黏液为特点，在食管中少见。\n易混点：食管鳞癌多位于食管中段，与吸烟、饮酒、过热饮食相关；食管腺癌多位于食管下段，与Barrett食管、胃食管反流相关。记忆要点：我国“中段鳞癌最多”，欧美“下段腺癌增多”。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-2a-single-0016","type":"single","typeLabel":"单选题","number":16,"question":"肺肉质变指的是","options":[{"key":"A","text":"胸膜渗出物纤维化"},{"key":"B","text":"支气管壁纤维化"},{"key":"C","text":"肺泡壁纤维化"},{"key":"D","text":"肺泡壁平滑肌增生"},{"key":"E","text":"肺泡腔内渗出物机化"}],"answerKeys":["E"],"answerText":["肺泡腔内渗出物机化"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n核心考点：肺肉质变是大叶性肺炎的并发症，本质为肺泡腔内纤维素性渗出物机化。\n解析：大叶性肺炎灰色肝样变期肺泡腔内充满大量纤维素性渗出物和中性粒细胞，若中性粒细胞渗出不足或蛋白溶解酶不足，渗出物不能完全溶解吸收，则由肉芽组织长入并机化，使肺组织呈灰白或红褐色实变、质地变硬似肉，故称肺肉质变。其病变部位在肺泡腔内，而非肺泡壁或胸膜，题眼是“渗出物机化”。\n选项分析：\nA. 错误：胸膜渗出物纤维化属于胸膜纤维化、胸膜粘连，发生部位在胸膜腔，不是肺实质肺泡腔内渗出物机化。\nB. 错误：支气管壁纤维化见于慢性支气管炎、支气管扩张等气道慢性炎症和重塑，病变在支气管壁，不构成肺肉质变。\nC. 错误：肺泡壁纤维化属于肺间质纤维化，常见于间质性肺炎、尘肺等，病变位于肺泡间隔，而肺肉质变的机化发生在肺泡腔内。\nD. 错误：肺泡壁平滑肌增生属于肺组织结构重塑，可见于慢性肺淤血、肺气肿等，不是渗出物机化，不能解释肺肉质变。\nE. 正确：肺泡腔内纤维素性渗出物不能溶解吸收，被肉芽组织机化，形成质地似肉的实变区，符合肺肉质变的定义。\n易混点：肺肉质变与肺间质纤维化不同，前者病变在肺泡腔内，是渗出物机化；后者在肺泡壁/间质。记忆要点：大叶性肺炎灰色肝样变期→纤维素渗出→溶解吸收障碍→肺泡腔内机化→肺肉质变。","chapter":10,"chapterName":"呼吸系统疾病","chapterTitle":"第10章 呼吸系统疾病"},{"id":"pathology-2a-single-0017","type":"single","typeLabel":"单选题","number":17,"question":"肿瘤恶性程度的高低取决于","options":[{"key":"A","text":"肿瘤体积的大小"},{"key":"B","text":"肿瘤患者的临床表现"},{"key":"C","text":"肿瘤的生长速度"},{"key":"D","text":"肿瘤细胞的分化程度"},{"key":"E","text":"肿瘤发生的部位"}],"answerKeys":["D"],"answerText":["肿瘤细胞的分化程度"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：肿瘤的恶性程度主要取决于肿瘤细胞的分化程度及异型性，分化越低、异型性越大，恶性程度越高。\n解析：病理学上判断肿瘤恶性程度，核心看肿瘤细胞与相应正常组织的差异，即分化程度和异型性。分化程度高者接近正常组织，恶性程度较低；分化程度低者幼稚、异型性明显，恶性程度高。生长速度、体积、部位和临床表现可提示病情或影响预后，但不能作为判定恶性程度高低的主要依据。本题题眼是“恶性程度取决于”，应选肿瘤细胞的分化程度。\n选项分析：\nA. 错误：肿瘤体积大小不能决定恶性程度。良性肿瘤如脂肪瘤可体积很大，而某些恶性肿瘤早期体积很小却已具侵袭和转移能力，体积只是生长表现，不是恶性本质。\nB. 错误：患者临床表现受肿瘤部位、大小、并发症及全身状态影响，不能反映肿瘤细胞本身的恶性程度。例如同样症状可由良性压迫或恶性浸润引起。\nC. 错误：生长速度与恶性程度有一定相关性，恶性肿瘤常生长较快，但并非决定因素；部分良性病变也可生长较快，部分恶性肿瘤生长相对缓慢，故不能替代分化程度作为判断依据。\nD. 正确：肿瘤细胞分化程度越低、异型性越明显，恶性程度越高；恶性肿瘤组织学分级正是依据分化程度和异型性等来判断，故为本题正确答案。\nE. 错误：肿瘤发生部位影响临床表现、治疗和预后，但不决定肿瘤本身的恶性程度。同一组织学类型的肿瘤在不同部位其恶性本质仍主要由分化程度和生物学行为决定。\n易混点：注意区分“分级”和“分期”：分级主要依据肿瘤细胞分化程度和异型性，反映恶性程度；分期依据肿瘤大小、浸润深度、淋巴结和远处转移，反映进展范围。记忆要点：分化越低、异型性越大，恶性程度越高。","chapter":6,"chapterName":"肿瘤","chapterTitle":"第6章 肿瘤"},{"id":"pathology-2a-single-0018","type":"single","typeLabel":"单选题","number":18,"question":"恶性高血压病特征性病变是","options":[{"key":"A","text":"细动脉纤维素样坏死"},{"key":"B","text":"血管壁单核细胞，中性粒细胞浸润"},{"key":"C","text":"弓形动脉内膜显著增生"},{"key":"D","text":"小动脉内弹力膜分裂"},{"key":"E","text":"小动脉内微血栓形成"}],"answerKeys":["A"],"answerText":["细动脉纤维素样坏死"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：A\n核心考点：恶性高血压的特征性血管病变是细动脉纤维素样坏死，即坏死性细动脉炎。\n解析：恶性高血压时血压急剧升高，血管内皮损伤，血浆蛋白渗入细动脉壁，并伴纤维素样物质沉积，形成细动脉壁纤维素样坏死。病变常累及肾入球小动脉，可导致肾小球缺血、坏死及恶性肾硬化，临床可见急剧进展的高血压和肾功能损害。本题题眼是“恶性高血压”和“特征性病变”，应选细动脉纤维素样坏死。\n选项分析：\nA. 正确：细动脉纤维素样坏死是恶性高血压的特征性病变，属于坏死性细动脉炎，血管壁呈伊红染、均质纤维素样改变。\nB. 错误：血管壁单核细胞、中性粒细胞浸润可见于坏死性血管炎等炎症性病变，也可在恶性高血压坏死灶周围出现反应性炎症，但不是其最特征性病变。\nC. 错误：弓形动脉内膜显著增生不是恶性高血压的特征；良性高血压可累及小动脉及弓形动脉，出现内膜增厚、纤维化等改变，但题中所述不符合恶性高血压的典型病变。\nD. 错误：小动脉内弹力膜分裂不是恶性高血压的特征性病变，可见于某些先天性或获得性动脉壁结构异常、动脉瘤等，不能作为本题答案。\nE. 错误：小动脉内微血栓形成可见于血栓性微血管病、DIC等，恶性高血压虽可伴微血管病变，但特征性形态学改变不是微血栓形成。\n易混点：良性高血压的细动脉典型病变是玻璃样变性，恶性高血压的细动脉典型病变是纤维素样坏死；恶性高血压还可出现增生性小动脉硬化，呈“洋葱皮样”改变。记忆要点：良性高血压——细动脉玻璃样变；恶性高血压——细动脉纤维素样坏死。","chapter":9,"chapterName":"心血管系统疾病","chapterTitle":"第9章 心血管系统疾病"},{"id":"pathology-2a-single-0019","type":"single","typeLabel":"单选题","number":19,"question":"手术切口为何选择术后5～7日拆线","options":[{"key":"A","text":"伤口内肉芽组织已长满"},{"key":"B","text":"伤口两侧出现胶原纤维连接"},{"key":"C","text":"伤口内成肌纤维细胞大量形成"},{"key":"D","text":"伤口内成纤维细胞增生达高峰"},{"key":"E","text":"炎症基本消失"}],"answerKeys":["B"],"answerText":["伤口两侧出现胶原纤维连接"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：手术切口一期愈合中，拆线时机取决于伤口抗张力强度的恢复，而抗张力主要来自胶原纤维的形成与连接。\n解析：手术切口属于一期愈合。术后5～7日，伤口内肉芽组织逐渐填满缺损，成纤维细胞产生胶原纤维，伤口两侧开始出现胶原纤维连接，使伤口具备一定抗张力，此时拆线不易裂开。题眼是“拆线”依据伤口抗张力，而不是单纯肉芽组织长满或炎症消退。\n\n选项分析：\nA. 错误：肉芽组织长满只是伤口填充的过程，肉芽组织本身抗张力弱，不能作为拆线的主要依据；且一期愈合切口主要靠胶原连接恢复强度。\nB. 正确：术后5～7日胶原纤维在伤口两侧形成连接，伤口抗张力明显增加，达到临床拆线所需的基本强度，这是一期愈合拆线的病理学基础。\nC. 错误：成肌纤维细胞大量形成主要与肉芽组织收缩、瘢痕收缩有关，常见于后期或二期愈合，不能解释5～7日拆线。\nD. 错误：成纤维细胞增生是胶原形成的前提，但增生达高峰并不等于胶原已形成有效连接；拆线取决于抗张力，而非细胞增生峰值。\nE. 错误：炎症基本消失说明炎症反应减轻，但炎症消退并不代表伤口已获得足够抗张力；拆线主要看组织连接强度。\n\n易混点：肉芽组织可填满伤口，但抗张力弱；瘢痕组织中的胶原纤维连接才是抗张力主要来源。一期愈合约5～7日可拆线，二期愈合因缺损大、肉芽需填满，愈合时间明显延长。","chapter":2,"chapterName":"损伤的修复","chapterTitle":"第2章 损伤的修复"},{"id":"pathology-2a-single-0020","type":"single","typeLabel":"单选题","number":20,"question":"肝细胞发生广泛变性，点状坏死，符合上述病变特点的是","options":[{"key":"A","text":"急性普通型肝炎"},{"key":"B","text":"轻度慢性肝炎"},{"key":"C","text":"重度慢性肝炎"},{"key":"D","text":"重型肝炎"},{"key":"E","text":"亚急性重型肝炎"}],"answerKeys":["A"],"answerText":["急性普通型肝炎"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：A\n\n核心考点：急性普通型肝炎的典型肝细胞病变为广泛变性伴点状坏死。\n\n解析：急性普通型肝炎时，肝细胞发生广泛的水肿变性，肉眼可见肝脏肿大、包膜紧张；镜下以胞质疏松化和气球样变为主，并可见散在的点状坏死，坏死灶内常伴中性粒细胞浸润，同时汇管区有淋巴细胞浸润和库普弗细胞增生。题眼是“肝细胞发生广泛变性，点状坏死”，这正是急性普通型肝炎的典型形态学特点，临床常伴肝大、肝区压痛及ALT升高，多数可痊愈。\n\n选项分析：\nA. 正确：急性普通型肝炎以肝细胞广泛变性（胞质疏松化、气球样变）和点状坏死为突出特点，坏死范围小、散在，符合题干描述。\nB. 错误：轻度慢性肝炎虽可有少量点状坏死，但病变以汇管区炎症、轻度纤维化为主，肝细胞变性通常较轻且不呈“广泛”变性，不符合本题最突出特点。\nC. 错误：重度慢性肝炎的典型病变是碎片状坏死、桥接坏死及纤维化，可伴肝细胞异型增生和假小叶形成倾向，不是单纯广泛变性伴点状坏死。\nD. 错误：重型肝炎表现为肝细胞大片状坏死，坏死范围广而严重，常伴肝功能衰竭，不是点状坏死。\nE. 错误：亚急性重型肝炎以亚大块坏死、坏死区网状支架塌陷及结节状肝细胞再生为特点，可进展为坏死后肝硬化，不符合“广泛变性、点状坏死”。\n\n易混点：点状坏死见于普通型肝炎，尤其是急性普通型；碎片状坏死和桥接坏死提示慢性肝炎较重；大片状坏死提示重型肝炎。记忆要点：急性普通型“广泛变性+点状坏死”，重型“大片坏死”，亚急性重型“亚大块坏死+结节状再生”。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-2a-single-0021","type":"single","typeLabel":"单选题","number":21,"question":"霍奇金淋巴瘤中的反应性细胞是","options":[{"key":"A","text":"Reed-Sternberg cell"},{"key":"B","text":"镜影细胞"},{"key":"C","text":"淋巴细胞、浆细胞"},{"key":"D","text":"霍奇金细胞"},{"key":"E","text":"陷窝细胞"}],"answerKeys":["C"],"answerText":["淋巴细胞、浆细胞"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：霍奇金淋巴瘤的肿瘤性细胞与反应性背景细胞的鉴别，反应性细胞主要为淋巴细胞、浆细胞等炎症细胞。\n\n解析：霍奇金淋巴瘤（HL）的组织学特点是肿瘤性细胞数量少，通常仅占病变细胞的少数，而背景中大量为反应性炎细胞。这些反应性细胞包括小淋巴细胞、浆细胞、嗜酸性粒细胞、组织细胞等，它们构成HL的诊断性背景。题眼是“反应性细胞”，即非肿瘤性、反应性增生的炎症细胞；而Reed-Sternberg细胞及其变异型才是HL的肿瘤性细胞。经典型HL中R-S细胞常表达CD15、CD30，具有诊断意义，但数量较少。\n\n选项分析：\nA. 错误：Reed-Sternberg cell（R-S细胞）是霍奇金淋巴瘤的肿瘤性细胞，体积大、双核或多核，核仁明显，是诊断性细胞而非反应性细胞。\nB. 错误：镜影细胞是R-S细胞的一种典型形态，指两个相对排列的核及明显核仁呈“猫头鹰眼”样，属于肿瘤性细胞，不是反应性细胞。\nC. 正确：淋巴细胞、浆细胞属于霍奇金淋巴瘤背景中的反应性炎症细胞，常大量存在，并可与嗜酸性粒细胞、组织细胞等共同构成病变背景。\nD. 错误：霍奇金细胞是R-S细胞的单核变异型，属于肿瘤性细胞，不是反应性细胞。\nE. 错误：陷窝细胞是经典型霍奇金淋巴瘤结节硬化型的变异型肿瘤细胞，胞质丰富、核呈分叶状，并非反应性细胞。\n\n易混点：霍奇金淋巴瘤中“诊断性R-S细胞”与“背景反应性细胞”要分开记忆：肿瘤细胞少而诊断价值高，反应性炎细胞多但非肿瘤成分。镜影细胞、霍奇金细胞、陷窝细胞均为R-S细胞或其变异型，不要误认为反应性细胞。","chapter":12,"chapterName":"淋巴造血系统疾病","chapterTitle":"第12章 淋巴造血系统疾病"},{"id":"pathology-2a-single-0022","type":"single","typeLabel":"单选题","number":22,"question":"左锁骨上淋巴结转移性腺癌的原发部位最可能是","options":[{"key":"A","text":"乳腺"},{"key":"B","text":"甲状腺"},{"key":"C","text":"食管"},{"key":"D","text":"胃"},{"key":"E","text":"肝脏"}],"answerKeys":["D"],"answerText":["胃"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：左锁骨上淋巴结（Virchow淋巴结）转移性腺癌是胃癌淋巴道转移的经典表现。\n解析：胃癌细胞可侵入胃壁淋巴管，沿淋巴管经胸导管向上转移，最终累及左锁骨上淋巴结，形成所谓Virchow淋巴结。该淋巴结位于胸导管注入左静脉角附近，是腹腔恶性肿瘤淋巴道转移的重要部位；转移癌常呈腺癌形态，因此“左锁骨上淋巴结转移性腺癌”首先考虑胃腺癌。题眼是“左锁骨上淋巴结”与“腺癌”组合，提示腹腔来源，尤其胃癌。\n选项分析：\nA. 错误：乳腺癌可发生锁骨上淋巴结转移，但多先累及同侧腋窝淋巴结，且原发灶多为乳腺浸润性癌；左锁骨上淋巴结转移性腺癌的经典原发部位不是乳腺。\nB. 错误：甲状腺癌尤其乳头状癌常转移至颈部淋巴结，但一般不把左锁骨上淋巴结作为典型首发转移部位；且甲状腺癌组织学类型不完全等同胃腺癌。\nC. 错误：食管癌可经淋巴道转移，下段食管癌可累及腹腔淋巴结，但我国食管癌以鳞状细胞癌多见，腺癌相对少；左锁骨上淋巴结转移性腺癌最经典仍提示胃癌。\nD. 正确：胃癌多为腺癌，易经淋巴道转移至左锁骨上淋巴结，形成Virchow淋巴结；这是考试中“左锁骨上淋巴结转移性腺癌”的题眼和标准答案。\nE. 错误：原发性肝癌最常见为肝细胞癌，并非腺癌；肝脏虽可发生转移性腺癌，但此时原发灶常在胃肠道等处，不能把肝脏本身作为最可能原发部位。\n易混点：左锁骨上淋巴结肿大可见于炎症、淋巴瘤及多种癌转移，但“转移性腺癌”应首先想到胃癌；食管下段腺癌也可类似，但食管癌以鳞癌多见。乳腺癌锁骨上转移常与腋窝淋巴结相连，甲状腺癌以颈部淋巴结转移为特点，肝癌则多为肝细胞癌而非腺癌。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-2a-single-0023","type":"single","typeLabel":"单选题","number":23,"question":"下列不是流行性脑脊髓膜炎的临床表现的是","options":[{"key":"A","text":"脑膜刺激征状"},{"key":"B","text":"颅内压升高"},{"key":"C","text":"偏瘫"},{"key":"D","text":"脑脊髓液细胞数增加"},{"key":"E","text":"脑神经麻痹"}],"answerKeys":["C"],"answerText":["偏瘫"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：流行性脑脊髓膜炎是化脓性脑膜炎，主要累及脑脊膜，临床以脑膜刺激征和颅内压升高为主，一般不出现脑实质局灶性损害所致的偏瘫。\n解析：流行性脑脊髓膜炎由脑膜炎双球菌引起，病变以软脑膜和蛛网膜的化脓性炎症为主，蛛网膜下腔有大量中性粒细胞渗出。因此可出现脑膜刺激征、颅内压升高及脑脊液细胞数明显增加；颅底脓性渗出物累及脑神经时可出现脑神经麻痹。偏瘫属于脑实质局灶性损害表现，常提示大脑半球皮质或皮质脊髓束受累，不是流脑的典型临床表现，故本题题眼是“不是”。\n\n选项分析：\nA. 正确：脑膜刺激征是流脑常见表现，因炎性渗出物刺激脊神经根和脑膜，出现颈强直、Kernig征和Brudzinski征阳性。\nB. 正确：流脑时蛛网膜下腔炎性渗出和脑脊液循环障碍可引起颅内压升高，表现为头痛、呕吐、视乳头水肿等。\nC. 错误：偏瘫提示脑实质局灶性损害，常见于脑梗死、脑出血、脑肿瘤或乙型脑炎等；流脑主要累及脑膜，不以偏瘫为典型表现。\nD. 正确：流脑为化脓性脑膜炎，脑脊液呈化脓性改变，细胞数显著增加，以中性粒细胞为主。\nE. 正确：颅底脓性渗出物可压迫或累及脑神经，引起脑神经麻痹，如面神经、听神经等受累。\n\n易混点：流脑与乙型脑炎均属中枢神经系统感染，但流脑以脑膜化脓性炎症为主，突出脑膜刺激征和脑脊液中性粒细胞增多；乙型脑炎以脑实质炎症和神经元损害为主，易出现意识障碍、抽搐和偏瘫等局灶症状。记忆要点：流脑“重脑膜”，乙脑“重脑实质”。","chapter":16,"chapterName":"神经系统疾病","chapterTitle":"第16章 神经系统疾病"},{"id":"pathology-2a-single-0024","type":"single","typeLabel":"单选题","number":24,"question":"白色血栓主要由下列哪些成分构成","options":[{"key":"A","text":"白细胞、纤维素和血小板"},{"key":"B","text":"血小板和纤维素"},{"key":"C","text":"红细胞和白细胞"},{"key":"D","text":"红细胞和纤维素"},{"key":"E","text":"血小板和红细胞"}],"answerKeys":["B"],"answerText":["血小板和纤维素"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：白色血栓的组成以血小板和纤维素（纤维蛋白）为主，常见于血流较快、剪切力较高的动脉或心腔内。\n解析：白色血栓多发生于动脉、心瓣膜或心腔内，因局部血流快、涡流形成，血小板先黏附、聚集，随后纤维素沉积，形成灰白色、质硬的小血栓，常附着于血管壁或瓣膜。镜下以血小板小梁和纤维素网架为主，红细胞较少，故肉眼呈白色。题眼是“白色血栓”与“红色血栓”“混合血栓”的成分鉴别。\n\n选项分析：\nA. 错误：白细胞、纤维素和血小板虽可见于血栓，但白色血栓的主要成分不是白细胞；白细胞增多更多见于炎症性渗出或血栓机化早期，不是本题所问“主要由哪些成分构成”。\nB. 正确：白色血栓主要由血小板和纤维素构成，符合动脉血栓、心瓣膜血栓在高速血流下以血小板聚集和纤维蛋白沉积为起始的病理机制。\nC. 错误：红细胞和白细胞不是白色血栓的主要成分；该组合更接近血细胞成分描述，不能体现白色血栓中血小板小梁和纤维素网架的特点。\nD. 错误：红细胞和纤维素主要见于红色血栓，常发生于静脉血流缓慢、淤滞时，红细胞被纤维素网罗，肉眼呈暗红色。\nE. 错误：血小板和红细胞不是白色血栓的主要构成；若以红细胞为主并伴纤维素，应考虑红色血栓或混合血栓中的红细胞层。\n\n易混点：白色血栓以血小板和纤维素为主，见于动脉、心瓣膜；红色血栓以红细胞和纤维素为主，见于静脉淤滞；混合血栓可见血小板小梁、纤维素网架与红细胞层交替，形成层状结构。记忆要点：白血栓“血小板+纤维素”，红血栓“红细胞+纤维素”，混合血栓“层状相间”。","chapter":3,"chapterName":"局部血液循环障碍","chapterTitle":"第3章 局部血液循环障碍"},{"id":"pathology-2a-single-0025","type":"single","typeLabel":"单选题","number":25,"question":"肿瘤的演进是指","options":[{"key":"A","text":"细胞的恶性转化"},{"key":"B","text":"恶性肿瘤的浸润能力"},{"key":"C","text":"恶性肿瘤的转移现象"},{"key":"D","text":"恶性肿瘤的生长速度"},{"key":"E","text":"恶性肿瘤在生长过程中变得越来越富有侵袭性的现象"}],"answerKeys":["E"],"answerText":["恶性肿瘤在生长过程中变得越来越富有侵袭性的现象"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n核心考点：肿瘤演进是指恶性肿瘤在生长过程中侵袭性逐渐增强的动态过程。\n解析：恶性肿瘤在生长过程中，由于肿瘤细胞不断增殖、基因突变积累和异质性形成，经过机体的选择作用，侵袭能力较强的亚克隆逐渐占据优势，使肿瘤变得越来越富有侵袭性。其可表现为生长加快、异型性增大、浸润和转移能力增强等，但“演进”的核心是侵袭性增强的动态现象。本题题眼是“在生长过程中越来越富有侵袭性”，而不是单纯描述某一项恶性生物学行为。\n\n选项分析：\nA. 错误：细胞的恶性转化是指正常细胞在致癌因素作用下转变为肿瘤细胞的过程，属于肿瘤发生的起始环节；肿瘤演进发生在恶性转化之后，是已形成的恶性肿瘤继续向侵袭性增强的方向发展，二者概念不同。\nB. 错误：恶性肿瘤的浸润能力是恶性肿瘤的生物学特征之一，也是肿瘤演进后可增强的表现；但单独说“浸润能力”不能完整概括演进这一动态过程，不能等同于演进的定义。\nC. 错误：恶性肿瘤的转移现象是恶性肿瘤浸润、脱离、播散并在远处形成继发瘤的结果，是演进过程中可能出现的严重后果；但转移现象本身不等于演进，演进强调侵袭性逐渐增强的过程。\nD. 错误：恶性肿瘤的生长速度可以随演进而加快，但生长速度只是肿瘤生长动力学表现之一；有些肿瘤演进主要体现在异型性增加和侵袭转移能力增强，故不能以生长速度定义演进。\nE. 正确：恶性肿瘤在生长过程中变得越来越富有侵袭性的现象，正符合肿瘤演进的定义。其病理基础包括肿瘤异质性、基因组不稳定和克隆选择，常伴异型性增加、浸润和转移能力增强，是考试中要求掌握的关键表述。\n\n易混点：肿瘤演进易与“恶性转化”“浸润”“转移”混淆。记忆要点是：恶性转化是正常细胞变成癌细胞，属于“起点”；浸润和转移是恶性肿瘤的生物学行为及演进结果；演进强调恶性肿瘤在生长过程中侵袭性不断增强的动态过程。","chapter":6,"chapterName":"肿瘤","chapterTitle":"第6章 肿瘤"},{"id":"pathology-2a-single-0026","type":"single","typeLabel":"单选题","number":26,"question":"下列组织对缺氧的耐受性依次为","options":[{"key":"A","text":"脑＞肝＞肾"},{"key":"B","text":"肾＞肝＞脑"},{"key":"C","text":"肝＞脑＞肾"},{"key":"D","text":"肝＞肾＞脑"},{"key":"E","text":"肾＞脑＞肝"}],"answerKeys":["B"],"answerText":["肾＞肝＞脑"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n\n核心考点：不同组织器官对缺氧的耐受性不同，本题排序为肾＞肝＞脑，脑组织对缺氧最敏感、耐受性最差。\n\n解析：缺氧时细胞损伤程度取决于组织对缺氧的敏感性和代谢需求。脑神经元氧储备少、耗氧高，对缺氧极敏感，缺氧数分钟即可发生不可逆损伤，常见海马CA1区、小脑浦肯野细胞及大脑皮质锥体细胞受累，最终可发生液化性坏死。肝细胞代谢活跃，缺氧时可出现细胞水肿、脂肪变性，严重者小叶中央区坏死；肾组织在本题三者中耐受性相对较高，但肾小管上皮尤其近曲小管对缺血缺氧仍较敏感，可发生水肿、坏死。本题题眼是“耐受性依次”应由高到低排列，即肾＞肝＞脑。\n\n选项分析：\nA. 错误：脑对缺氧耐受性最低，不应排在首位；该排序把最敏感的脑放在最前，完全颠倒。\nB. 正确：符合教材排序，肾耐受性相对最高，肝居中，脑耐受性最低。\nC. 错误：肝虽较脑耐受，但肾的耐受性应高于肝，不应把肾排最后。\nD. 错误：把肝排在肾之前，不符合肾＞肝的相对顺序。\nE. 错误：把脑排在肝之前，误将脑的耐受性判断为高于肝，实际脑最不耐受缺氧。\n\n易混点：要区分“对缺氧的敏感性”和“对缺氧的耐受性”，二者相反：脑敏感性最高、耐受性最低。肾小管上皮对缺血缺氧也敏感，可发生肾小管坏死，但本题是三者相对排序，不能据此把脑排在肾之前。记忆要点：脑最怕缺氧，排序为肾＞肝＞脑。","chapter":1,"chapterName":"细胞和组织的适应与损伤","chapterTitle":"第1章 细胞和组织的适应与损伤"},{"id":"pathology-2a-single-0027","type":"single","typeLabel":"单选题","number":27,"question":"肝细胞弥漫性水样变性主要见于","options":[{"key":"A","text":"急性重型肝炎"},{"key":"B","text":"亚急性重型肝炎"},{"key":"C","text":"慢性持续性肝炎"},{"key":"D","text":"急性普通型肝炎"},{"key":"E","text":"淤胆型肝炎"}],"answerKeys":["D"],"answerText":["急性普通型肝炎"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n\n核心考点：急性普通型肝炎以肝细胞广泛变性为主，其中最典型的是肝细胞弥漫性水样变性（气球样变）。\n\n解析：急性普通型病毒性肝炎时，肝细胞广泛受累，因缺氧、病毒直接损伤及免疫损伤导致细胞内ATP减少、钠泵功能障碍，水钠潴留于胞质，形成胞质疏松化、气球样变，即水样变性。镜下可见肝细胞体积增大、胞质淡染疏松透亮，坏死多轻微，呈点状坏死；临床可出现肝大、肝区压痛和ALT升高。本题题眼是“肝细胞弥漫性水样变性主要见于”，应锁定以广泛变性、坏死轻为特点的急性普通型肝炎。\n\n选项分析：\nA. 错误：急性重型肝炎的突出病变是肝细胞大片状坏死，坏死面积大、进展迅速，可伴肝功能衰竭，并非以弥漫性水样变性为主要表现。\nB. 错误：亚急性重型肝炎以亚大块坏死、肝细胞结节状再生和纤维组织增生为特点，病变较重，并非弥漫性水样变性。\nC. 错误：慢性持续性肝炎（旧称，相当于轻度慢性肝炎）炎症主要局限于门管区，肝细胞变性、坏死较轻，不以弥漫性水样变性为主要特征。\nD. 正确：急性普通型肝炎最常见、最突出的镜下改变是肝细胞广泛胞质疏松化和气球样变，即水样变性，坏死轻微。\nE. 错误：淤胆型肝炎以毛细胆管及小胆管内胆汁淤积为突出表现，临床以梗阻性黄疸为特点，并非以肝细胞弥漫性水样变性为主。\n\n易混点：肝细胞水样变性即胞质疏松化、气球样变，属于可逆性损伤；重型肝炎的关键词是“大片坏死/亚大块坏死”，慢性肝炎关键词是“门管区炎症、纤维化”，淤胆型肝炎关键词是“胆汁淤积”。记忆要点：急性普通型肝炎“变性重、坏死轻”，重型肝炎“坏死重”。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-2a-single-0028","type":"single","typeLabel":"单选题","number":28,"question":"风湿性心内膜炎心内膜之赘生物的实质是","options":[{"key":"A","text":"增生的肉芽组织"},{"key":"B","text":"风湿性肉芽肿"},{"key":"C","text":"机化的瘢痕"},{"key":"D","text":"混合血栓"},{"key":"E","text":"白色血栓"}],"answerKeys":["E"],"answerText":["白色血栓"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n核心考点：风湿性心内膜炎瓣膜疣状赘生物的本质是白色血栓。\n解析：风湿性心内膜炎时，瓣膜闭锁缘内皮受损，内皮下胶原暴露，在高流速血流中血小板黏附、聚集，并伴纤维素沉积，形成灰白色、细小、疣状、沿闭锁缘排列的白色血栓。其附着较牢固，通常不易脱落，故体循环栓塞少见。题眼是“赘生物实质”，应抓住其由血小板和纤维素构成，而非风湿性肉芽肿或机化瘢痕。\n选项分析：\nA. 错误：增生的肉芽组织是血栓机化、修复时的改变，可出现在病变后期，但不是风湿性心内膜炎疣状赘生物的实质。\nB. 错误：风湿性肉芽肿即Aschoff小体，主要由风湿细胞、淋巴细胞等构成，位于心肌间质、心内膜下等部位，不是瓣膜表面赘生物的实质。\nC. 错误：机化的瘢痕是病变修复后的结局，属于慢性或愈合期改变，不是急性风湿性心内膜炎赘生物的本质。\nD. 错误：混合血栓多见于静脉、动脉瘤或心房腔等血流较缓部位，由白色血栓与红色血栓分层构成，不符合风湿性瓣膜赘生物的特点。\nE. 正确：赘生物为瓣膜闭锁缘内皮损伤后形成的血小板-纤维素血栓，即白色血栓，肉眼呈疣状、灰白色、细小且附着牢固。\n易混点：风湿性心内膜炎赘生物要与感染性心内膜炎赘生物鉴别，后者常较大、松软、易脱落并含细菌集落；Aschoff小体是风湿性肉芽肿，位于组织内，不等同于瓣膜表面血栓性赘生物。记忆要点：风湿性疣状赘生物＝闭锁缘＋白色血栓＋不易脱落。","chapter":9,"chapterName":"心血管系统疾病","chapterTitle":"第9章 心血管系统疾病"},{"id":"pathology-2a-single-0029","type":"single","typeLabel":"单选题","number":29,"question":"膜性肾小球肾炎电镜下常见","options":[{"key":"A","text":"基底膜外侧许多颗粒状电子致密物沉积"},{"key":"B","text":"基底膜外侧有驼峰状电子致密物沉积"},{"key":"C","text":"基底膜呈“双轨状”"},{"key":"D","text":"脏层上皮细胞足突融合"},{"key":"E","text":"基底膜内侧电子致密物散在沉积"}],"answerKeys":["A"],"answerText":["基底膜外侧许多颗粒状电子致密物沉积"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：A\n核心考点：膜性肾小球肾炎（膜性肾病）的典型电镜表现是基底膜外侧（上皮下）颗粒状电子致密物沉积。\n解析：膜性肾小球肾炎属于免疫复合物介导的肾小球病，抗原抗体复合物主要沉积于肾小球基底膜外侧、脏层上皮细胞（足细胞）下，电镜下呈颗粒状电子致密物，沿基底膜外侧分布；随病变进展可刺激基底膜物质增生，形成“钉突”，光镜下见毛细血管壁弥漫增厚。题眼是“基底膜外侧”和“颗粒状电子致密物”，这是膜性肾病最具诊断意义的电镜特点。临床常表现为肾病综合征，好发于成人。\n\n选项分析：\nA. 正确：基底膜外侧即上皮下颗粒状电子致密物沉积，是膜性肾小球肾炎的典型电镜改变，并常伴钉突形成。\nB. 错误：驼峰状电子致密物沉积是急性弥漫性增生性肾小球肾炎（链球菌感染后肾小球肾炎）的典型表现，位于上皮下但形态为驼峰状，不是膜性肾病的颗粒状沉积。\nC. 错误：基底膜呈“双轨状”是膜增生性肾小球肾炎（系膜毛细血管性肾小球肾炎）的典型改变，由系膜细胞和基质插入基底膜及内皮下沉积所致。\nD. 错误：脏层上皮细胞足突融合可见于膜性肾病，也可见于微小病变性肾小球病等，属于非特异性改变，不是本题所问的最具特征性的电镜表现。\nE. 错误：基底膜内侧即内皮下电子致密物沉积，常见于狼疮性肾炎、膜增生性肾小球肾炎等，不是膜性肾小球肾炎的典型部位。\n\n易混点：记忆要点为“膜性外颗粒、感染后驼峰、膜增生双轨、内皮下沉积多见于狼疮或膜增生”。足突融合虽可见于膜性肾病，但特异性差，考试中应抓住“上皮下颗粒状致密物”这一题眼。","chapter":13,"chapterName":"泌尿系统疾病","chapterTitle":"第13章 泌尿系统疾病"},{"id":"pathology-2a-single-0030","type":"single","typeLabel":"单选题","number":30,"question":"关于肝硬化的叙述，下列哪项是错误的","options":[{"key":"A","text":"蜘蛛状血管痣"},{"key":"B","text":"男性女性化"},{"key":"C","text":"腹腔积液"},{"key":"D","text":"胃肠道出血"},{"key":"E","text":"病因被消除后，肝脏的正常结构可以恢复"}],"answerKeys":["E"],"answerText":["病因被消除后，肝脏的正常结构可以恢复"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n核心考点：肝硬化是弥漫性肝纤维化伴假小叶形成的终末性病变，肝脏正常结构破坏后通常不可逆；临床主要表现为肝功能减退和门脉高压。\n解析：肝硬化的本质是肝细胞弥漫性变性坏死、纤维组织增生和肝细胞结节状再生，三者反复交替导致假小叶形成和纤维间隔。即使去除病因，已形成的假小叶和纤维化支架也不能使肝脏恢复正常结构，只能延缓进展或使部分纤维化有所减轻。本题题眼是“肝硬化后病因消除能否恢复正常结构”，标准答案为E。A、B、C、D均属肝硬化常见临床表现。\n选项分析：\nA. 正确：蜘蛛状血管痣是肝功能减退、雌激素灭活减少所致小动脉扩张，常见于上腔静脉分布区，是肝硬化典型体征。\nB. 正确：男性女性化与雌激素增多、雄激素减少有关，可表现为睾丸萎缩、乳房发育、性欲减退等。\nC. 正确：腹腔积液形成与门静脉高压、低白蛋白血症、醛固酮和抗利尿激素增多、淋巴液回流受阻等有关。\nD. 正确：胃肠道出血常由门静脉高压所致食管胃底静脉曲张破裂引起，也可与凝血功能障碍、胃黏膜病变有关。\nE. 错误：肝硬化形成假小叶和纤维间隔后，肝脏正常结构不能恢复；病因去除可延缓进展，部分早期纤维化可减轻，但不能等同于结构恢复正常。\n易混点：肝纤维化与肝硬化不同。早期肝纤维化在去除病因后可能有一定可逆性；一旦形成假小叶并发展为肝硬化，结构破坏通常不可逆。记忆要点是“纤维化可部分逆转，假小叶形成不可逆”。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-2a-single-0031","type":"single","typeLabel":"单选题","number":31,"question":"如图，此图的病变属","options":[{"key":"A","text":"肥大"},{"key":"B","text":"化生"},{"key":"C","text":"萎缩"},{"key":"D","text":"增生"},{"key":"E","text":"扩大"}],"answerKeys":["C"],"answerText":["萎缩"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：萎缩是指已发育正常的实质细胞、组织或器官体积缩小，可伴有细胞数目减少。\n解析：题目图片未提供，仅依据题干和标准答案判断。本题标准答案为萎缩，病理学上萎缩属于适应性改变，常见于营养不良、缺血、失用、神经损伤或内分泌变化等，镜下可见实质细胞体积变小、胞质减少，间质纤维脂肪组织相对增多。题眼在于病变本质是“已发育正常组织器官的体积缩小”，而非细胞数目增多或细胞类型转变。\n选项分析：\nA. 错误：肥大是细胞体积增大导致组织器官体积增大，常与负荷增加、内分泌刺激等有关，本题病变本质为体积缩小，不符合肥大。\nB. 错误：化生是分化成熟的一种细胞类型被另一种细胞类型取代，如支气管假复层纤毛柱状上皮发生鳞状上皮化生，属于细胞表型改变，不是器官体积缩小。\nC. 正确：萎缩是已发育正常的细胞、组织或器官体积缩小，可伴实质细胞数目减少和间质相对增多，符合本题标准答案。\nD. 错误：增生是实质细胞数目增多使组织器官体积增大，细胞本身不一定变小；本题不是以细胞数目增多为主要改变。\nE. 错误：“扩大”不是病理学适应与损伤章节中的规范基本病变名称，不能用于替代萎缩、肥大、增生等概念。\n易混点：萎缩与发育不全不同，萎缩是已发育正常后体积缩小，发育不全是未达到正常大小。假性肥大是实质细胞萎缩而间质脂肪组织增生，器官体积可增大。化生是细胞类型转变，增生是细胞数目增多，二者可与萎缩并存但概念不同。","chapter":1,"chapterName":"细胞和组织的适应与损伤","chapterTitle":"第1章 细胞和组织的适应与损伤","needsImage":true},{"id":"pathology-2a-single-0032","type":"single","typeLabel":"单选题","number":32,"question":"原发性肝癌最常见的组织学类型是","options":[{"key":"A","text":"未分化癌"},{"key":"B","text":"胆管上皮癌"},{"key":"C","text":"肝细胞癌"},{"key":"D","text":"类癌"},{"key":"E","text":"混合性肝癌"}],"answerKeys":["C"],"answerText":["肝细胞癌"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：原发性肝癌最常见的组织学类型是肝细胞癌，占原发性肝癌的绝大多数。\n解析：肝细胞癌（HCC）约占原发性肝癌的80%～90%，是最常见的组织学类型。其发生与乙型/丙型肝炎病毒慢性感染、肝硬化、黄曲霉毒素等因素密切相关，患者常有AFP升高。镜下癌细胞可呈梁索状、假腺管状或实体团块状排列，癌组织血窦丰富，癌细胞形态类似肝细胞；临床上常表现为肝区疼痛、肝大、消瘦及肝硬化背景。本题题眼是“原发性肝癌最常见组织学类型”，应直接选肝细胞癌。\n选项分析：\nA. 错误：未分化癌属于分化极差、缺乏肝细胞或胆管上皮分化特征的恶性肿瘤，原发性肝癌中罕见，侵袭性强、预后差，但不是最常见类型。\nB. 错误：胆管上皮癌即肝内胆管癌，来源于肝内胆管上皮，组织学多为腺癌，可伴黏液分泌，CK7、CK19常阳性，约占原发性肝癌的10%左右，属于第二常见类型，不是最常见。\nC. 正确：肝细胞癌来源于肝细胞，是原发性肝癌最常见的组织学类型，常伴肝硬化及HBV/HCV感染背景，镜下可见梁索状结构、血窦丰富，AFP常升高。\nD. 错误：类癌是神经内分泌肿瘤，原发于肝脏的类癌极罕见，更多见的是胃肠道等部位神经内分泌肿瘤转移至肝，不能作为原发性肝癌最常见类型。\nE. 错误：混合性肝癌同时具有肝细胞癌和胆管上皮癌两种成分，诊断需两种成分均存在，临床较少见，不是最常见类型。\n易混点：肝细胞癌与肝内胆管癌最易混淆：前者常有肝硬化、HBV/HCV感染和AFP升高，癌细胞似肝细胞并呈梁索状；后者来源于胆管上皮，常为腺癌，CA19-9可升高，AFP多不高。记忆要点是“原发性肝癌最常见为肝细胞癌，胆管细胞癌次之，混合型和未分化癌少见”。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-2a-single-0033","type":"single","typeLabel":"单选题","number":33,"question":"目前临床主要应用的国际肿瘤分期方法是","options":[{"key":"A","text":"WHO系统"},{"key":"B","text":"TNM系统"},{"key":"C","text":"NIH系统"},{"key":"D","text":"CDC系统"},{"key":"E","text":"AJCS系统"}],"answerKeys":["B"],"answerText":["TNM系统"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：肿瘤TNM分期系统的组成及临床意义，TNM是目前临床主要应用的国际肿瘤分期方法。\n解析：TNM系统由国际抗癌联盟（UICC）和美国癌症联合委员会（AJCC）等制定并不断修订，是目前临床最常用的恶性肿瘤分期方法。T代表原发肿瘤的大小、浸润深度和范围，N代表区域淋巴结转移情况，M代表有无远处转移；综合TNM可形成临床分期，用于判断病情早晚、选择治疗方案和评估预后。本题题眼是“临床主要应用的国际肿瘤分期方法”，应选TNM系统，而不是肿瘤的组织学分类系统或行政管理机构名称。\n选项分析：\nA. 错误：WHO系统主要用于肿瘤的组织学分类和命名，如WHO肿瘤分类，重点在于判断肿瘤类型和组织来源，不是临床主要应用的TNM式分期方法。\nB. 正确：TNM系统按原发肿瘤（T）、区域淋巴结（N）和远处转移（M）进行分期，能反映肿瘤侵犯范围和转移情况，是临床分期、治疗决策及预后判断的主要国际系统。\nC. 错误：NIH为美国国立卫生研究院，是科研与资助管理机构，不是肿瘤临床分期系统，不能用于TNM分期。\nD. 错误：CDC为疾病控制与预防中心，主要涉及公共卫生和疾病防控，不是肿瘤病理或临床分期方法。\nE. 错误：AJCS不是规范、常用的肿瘤分期系统名称；与AJCC相近，但AJCC主要是制定和发布TNM分期的机构，临床应用的仍是TNM系统，不能将其作为与TNM并列的独立分期方法。\n易混点：注意区分“分级”和“分期”：分级多依据肿瘤细胞分化程度和核分裂象等，反映恶性程度；分期多依据肿瘤大小、浸润范围、淋巴结和远处转移，反映进展范围。WHO分类解决“是什么肿瘤”，TNM分期解决“进展到哪一期”。","chapter":6,"chapterName":"肿瘤","chapterTitle":"第6章 肿瘤"},{"id":"pathology-2a-single-0034","type":"single","typeLabel":"单选题","number":34,"question":"关于栓子的运行途径，下列说法错误的是","options":[{"key":"A","text":"静脉系统及右心栓子常引起肺栓塞"},{"key":"B","text":"动脉系统及左心栓子常引起脑、脾、肾等器官的栓塞"},{"key":"C","text":"栓子运行一般顺压力方向"},{"key":"D","text":"下腔静脉内的血栓在胸、腹压突然升高时可发生逆行性栓塞"},{"key":"E","text":"交叉性栓塞又称反常性栓塞"}],"answerKeys":["C"],"answerText":["栓子运行一般顺压力方向"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：栓子运行途径的一般规律及逆行性、交叉性栓塞等特殊类型。\n解析：栓子通常随血流方向运行，而不是笼统地“顺压力方向”。体静脉及右心栓子随静脉血回流至右心后进入肺动脉，常引起肺栓塞；左心及动脉系统栓子随动脉血流运行，常阻塞脑、脾、肾等体循环器官。题眼是“错误”，C将“顺血流方向”误表述为“顺压力方向”，故为错误项。\n选项分析：\nA. 正确：静脉系统及右心栓子随静脉血流回到右心，再进入肺动脉，常引起肺栓塞。\nB. 正确：动脉系统及左心栓子随动脉血流运行，可栓塞脑、脾、肾等体循环器官。\nC. 错误：栓子运行一般顺血流方向，而非“顺压力方向”；压力差虽驱动血流，但不能替代血流方向这一病理学表述，且存在逆行性栓塞等例外。\nD. 正确：下腔静脉内血栓在咳嗽、深呼吸等胸、腹压突然升高时，可逆血流方向运行，引起下腔静脉所属分支的逆行性栓塞。\nE. 正确：交叉性栓塞又称反常性栓塞，指栓子经未闭卵圆孔、房间隔缺损或室间隔缺损等异常通道，由右心进入左心，造成体循环动脉栓塞。\n易混点：顺行性栓塞顺血流方向；逆行性栓塞逆血流方向，常见于下腔静脉血栓伴胸腹压骤升；交叉性栓塞即反常性栓塞，关键是有心内或肺动静脉异常通道。记忆要点：静脉右心去肺，左心动脉去体循环；压骤升可逆行，有异常通道可交叉。","chapter":3,"chapterName":"局部血液循环障碍","chapterTitle":"第3章 局部血液循环障碍"},{"id":"pathology-2a-single-0035","type":"single","typeLabel":"单选题","number":35,"question":"下列肿瘤中，有明显家族发病倾向者为","options":[{"key":"A","text":"胶质瘤"},{"key":"B","text":"结肠息肉性腺瘤"},{"key":"C","text":"骨软骨瘤"},{"key":"D","text":"畸胎瘤"},{"key":"E","text":"淋巴瘤"}],"answerKeys":["B"],"answerText":["结肠息肉性腺瘤"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n\n核心考点：肿瘤的家族聚集性与遗传性肿瘤综合征；结肠家族性腺瘤性息肉病具有明显家族发病倾向。\n\n解析：本题题眼是“明显家族发病倾向”。结肠息肉性腺瘤在家族性腺瘤性息肉病中表现为结肠多发性腺瘤性息肉，呈常染色体显性遗传，与APC抑癌基因突变有关，患者家族成员发病风险明显增高，且若不治疗几乎最终可发生结肠癌。其病理特点是结肠黏膜多发腺瘤性息肉，镜下为腺体增生、异型增生，属于癌前病变。\n\n选项分析：\nA. 错误：胶质瘤是中枢神经系统肿瘤，多数为散发性；少数可伴神经纤维瘤病、Li-Fraumeni综合征等，但作为一般胶质瘤并无明显家族发病倾向。\nB. 正确：结肠息肉性腺瘤，尤其家族性腺瘤性息肉病中的多发性腺瘤性息肉，具有明确家族聚集和遗传倾向，APC基因突变是关键分子机制，属癌前病变。\nC. 错误：骨软骨瘤是良性成软骨性肿瘤，常位于长骨干骺端，多数为单发性、散发性；只有多发性骨软骨瘤病才有家族遗传倾向，不能把普通骨软骨瘤等同于遗传性肿瘤。\nD. 错误：畸胎瘤是生殖细胞来源肿瘤，含两个或三个胚层组织，好发于卵巢、睾丸及骶尾部等，通常无明显家族发病倾向。\nE. 错误：淋巴瘤是淋巴造血系统恶性肿瘤，多数病例为散发性，虽与EBV、免疫缺陷等有关，但一般不属于有明显家族发病倾向的肿瘤。\n\n易混点：家族性腺瘤性息肉病应与散发性结肠腺瘤区分，前者多发、遗传、几乎必癌变，记忆要点为“APC基因、常染色体显性、结肠多发腺瘤”。单发骨软骨瘤多为散发，多发性骨软骨瘤病才有遗传倾向。","chapter":6,"chapterName":"肿瘤","chapterTitle":"第6章 肿瘤"},{"id":"pathology-2a-single-0036","type":"single","typeLabel":"单选题","number":36,"question":"粥样斑块没有下列哪种成分","options":[{"key":"A","text":"泡沫细胞"},{"key":"B","text":"胆固醇结晶"},{"key":"C","text":"淋巴细胞"},{"key":"D","text":"中性粒细胞"},{"key":"E","text":"纤维组织伴玻璃样变性"}],"answerKeys":["D"],"answerText":["中性粒细胞"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：动脉粥样硬化粥样斑块的组成成分及其慢性炎症性质。\n解析：粥样斑块由表面纤维帽和深部粥样坏死物构成，粥样物内可见脂质、坏死碎片、胆固醇结晶、泡沫细胞及淋巴细胞等。纤维帽由胶原纤维、平滑肌细胞等构成，并常发生玻璃样变性。本题题眼是“没有”：粥样斑块属于慢性炎症性病变，浸润细胞以单核巨噬细胞、淋巴细胞为主，中性粒细胞主要见于急性炎症或斑块破裂等并发症，不是粥样斑块的固有成分。\n选项分析：\nA. 正确：泡沫细胞是粥样斑块的重要成分，主要来自吞噬脂质的巨噬细胞，也可来自平滑肌细胞，常位于脂纹和斑块内。\nB. 正确：胆固醇结晶是粥样坏死物中的典型成分，石蜡切片中常因胆固醇溶解而呈针状空隙。\nC. 正确：淋巴细胞可见于粥样斑块内，反映动脉粥样硬化的慢性炎症反应，常与巨噬细胞并存。\nD. 错误：中性粒细胞属于急性炎症细胞，不是粥样斑块的典型固有成分；若出现多见于斑块破裂、继发血栓形成或感染等并发症。\nE. 正确：粥样斑块表面纤维帽由纤维组织构成，纤维组织可发生玻璃样变性，是斑块的常见形态学表现。\n易混点：粥样斑块是慢性炎症，浸润细胞以巨噬细胞、淋巴细胞为主；中性粒细胞提示急性炎症或并发症。泡沫细胞不是肿瘤细胞，而是吞噬脂质后的巨噬细胞或平滑肌细胞。","chapter":9,"chapterName":"心血管系统疾病","chapterTitle":"第9章 心血管系统疾病"},{"id":"pathology-2a-single-0037","type":"single","typeLabel":"单选题","number":37,"question":"下列哪项是变质性炎","options":[{"key":"A","text":"流行性脑脊髓膜炎"},{"key":"B","text":"细菌性痢疾"},{"key":"C","text":"大叶性肺炎"},{"key":"D","text":"阿米巴肝脓肿"},{"key":"E","text":"化脓性胆囊炎"}],"answerKeys":["D"],"answerText":["阿米巴肝脓肿"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：变质性炎是以组织细胞变性、坏死为主，渗出和增生轻微的炎症。\n解析：阿米巴肝脓肿由溶组织内阿米巴滋养体引起，滋养体溶解破坏肝组织，导致肝细胞坏死、液化形成“脓肿”样病灶，局部炎症细胞渗出较少，故属于变质性炎。本题题眼是“变质性炎”，即炎症以实质细胞坏死为主，而不是以化脓性渗出或纤维素性渗出为主。阿米巴肝脓肿虽称“脓肿”，但并非中性粒细胞大量渗出形成的化脓性炎。\n选项分析：\nA. 错误：流行性脑脊髓膜炎是脑膜炎双球菌引起的化脓性炎，病变以蛛网膜下腔大量中性粒细胞渗出、脓性渗出物积聚为特点。\nB. 错误：细菌性痢疾是肠道纤维素性炎，典型表现为肠黏膜假膜形成，属于纤维素性炎而非变质性炎。\nC. 错误：大叶性肺炎是肺泡内纤维素性渗出为主的纤维素性炎，常累及肺大叶，渗出明显。\nD. 正确：阿米巴肝脓肿以肝组织坏死液化为主，炎症渗出轻微，符合变质性炎的病理特点。\nE. 错误：化脓性胆囊炎是化脓性炎，胆囊壁大量中性粒细胞浸润并可有脓性渗出，不属于变质性炎。\n易混点：阿米巴肝脓肿名称中有“脓肿”，但本质是组织坏死液化，不是化脓性炎；变质性炎常考病毒性肝炎、流行性乙型脑炎、阿米巴肝脓肿，记忆要点是“实质细胞坏死为主、渗出增生轻”。","chapter":4,"chapterName":"炎症","chapterTitle":"第4章 炎症"},{"id":"pathology-2a-single-0038","type":"single","typeLabel":"单选题","number":38,"question":"下列哪种肿瘤的形状，癌的可能性大","options":[{"key":"A","text":"息肉状"},{"key":"B","text":"火山口状溃疡"},{"key":"C","text":"分叶状"},{"key":"D","text":"结节状"},{"key":"E","text":"乳头状"}],"answerKeys":["B"],"answerText":["火山口状溃疡"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：肿瘤大体形态与良恶性鉴别，火山口状溃疡是癌（恶性上皮性肿瘤）较典型的大体表现。\n解析：癌组织生长迅速，中央常发生坏死脱落，形成边缘隆起、外翻、底部凹凸不平的溃疡，状如火山口，故称火山口状溃疡。该形态提示恶性溃疡，常见于胃癌、肠癌等消化道癌。题眼是“癌的可能性大”，应选择与恶性上皮性肿瘤坏死溃破相关的大体形状。\n选项分析：\nA. 错误：息肉状多见于黏膜良性肿瘤，如结肠腺瘤性息肉，也可为恶性息肉，但并非癌的典型形状；其外观为向外突出的团块，癌的可能性相对较小。\nB. 正确：火山口状溃疡由癌组织坏死脱落形成，边缘不规则、隆起外翻，底部坏死污秽，是癌性溃疡的典型大体形态。\nC. 错误：分叶状常见于良性肿瘤，如脂肪瘤、纤维腺瘤等，表现为多个结节融合成叶状；恶性肿瘤也可分叶，但不是提示癌的首选形状。\nD. 错误：结节状多见于良性肿瘤，如平滑肌瘤、腺瘤等，呈边界较清楚的结节；仅凭结节状不能提示癌。\nE. 错误：乳头状多见于良性乳头状瘤，也可发生于乳头状癌，但典型表现是外生性乳头状结构，而非癌坏死形成的火山口状溃疡。\n易混点：重点区分良性溃疡与恶性溃疡。良性溃疡多呈圆形或椭圆形，边缘整齐、底部平坦；恶性溃疡呈火山口状，边缘隆起外翻、底部凹凸不平。记忆要点：火山口状溃疡提示癌，息肉状、乳头状、分叶状、结节状更常见于良性肿瘤，但最终需结合镜下病理诊断。","chapter":6,"chapterName":"肿瘤","chapterTitle":"第6章 肿瘤"},{"id":"pathology-2a-single-0039","type":"single","typeLabel":"单选题","number":39,"question":"粥样斑块最危险的并发症是","options":[{"key":"A","text":"斑块内出血"},{"key":"B","text":"粥样瘤性溃疡"},{"key":"C","text":"斑块破裂"},{"key":"D","text":"钙化"},{"key":"E","text":"动脉瘤形成"}],"answerKeys":["C"],"answerText":["斑块破裂"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n\n核心考点：粥样斑块纤维帽破裂后暴露坏死核心，继发血栓形成，是导致急性冠脉综合征和猝死的最危险并发症。\n\n解析：粥样斑块由脂质坏死核心和纤维帽构成。斑块破裂时，纤维帽完整性丧失，坏死核心中的脂质和促凝物质进入血流，激活血小板和凝血系统，形成血栓，可迅速阻塞冠状动脉，引起急性心肌梗死、不稳定型心绞痛或猝死。因此本题题眼是“最危险”，强调破裂后急性血栓性事件的高致死性，而不是单纯斑块体积增大或管壁钙化。\n\n选项分析：\nA. 错误：斑块内出血多因斑块内新生血管破裂所致，可使斑块迅速增大、管腔狭窄加重，并可诱发破裂，但本身不是最危险的直接并发症。\nB. 错误：粥样瘤性溃疡指斑块表面纤维帽破溃形成溃疡，可并发血栓形成和栓塞，属于斑块破裂相关病变；其危险性最终仍主要体现在血栓形成和急性缺血事件上。\nC. 正确：斑块破裂使坏死核心暴露于血液，促进血栓形成，是急性心肌梗死和冠脉猝死最重要的机制，故为最危险并发症。\nD. 错误：钙化是粥样斑块晚期改变，可使动脉壁变硬、脆性增加，但钙化斑块相对稳定，通常不是最危险的急性并发症。\nE. 错误：动脉瘤形成是粥样硬化累及动脉中膜、管壁薄弱后发生的严重并发症，可破裂出血，但本题所问粥样斑块最危险、最典型的急性致命并发症是斑块破裂继发血栓形成。\n\n易混点：斑块内出血、溃疡、破裂均可使斑块不稳定，但“破裂”强调纤维帽撕破并暴露坏死核心，直接触发血栓；动脉瘤形成强调管壁结构破坏后扩张，属于另一类严重后果。记忆要点：斑块破裂→血栓形成→急性冠脉综合征，是最危险的“急性事件”。","chapter":9,"chapterName":"心血管系统疾病","chapterTitle":"第9章 心血管系统疾病"},{"id":"pathology-2a-single-0040","type":"single","typeLabel":"单选题","number":40,"question":"下列哪项最符合远隔器官转移瘤的特点","options":[{"key":"A","text":"与原发瘤组织学类型不同"},{"key":"B","text":"在远隔器官内形成单个转移灶"},{"key":"C","text":"分化程度同原发肿瘤"},{"key":"D","text":"多个圆形结节，散在分布于脏器边缘，可形成“癌脐”"},{"key":"E","text":"淋巴道转移的结果"}],"answerKeys":["D"],"answerText":["多个圆形结节，散在分布于脏器边缘，可形成“癌脐”"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：远隔器官转移瘤多经血道转移，其大体形态常为多个散在、边界清楚的圆形结节，并可形成“癌脐”。\n解析：远隔器官转移瘤最常见的途径是血道转移，瘤细胞随血流进入肺、肝、骨、脑等器官，故常形成多个散在的转移结节。肉眼观结节多呈圆形、边界较清楚，常见于脏器边缘；当转移结节中央发生坏死并凹陷时，可形成所谓“癌脐”。本题题眼是“远隔器官转移瘤的大体特点”，D项最符合血道转移瘤的典型形态。\n\n选项分析：\nA. 错误：转移瘤的组织学类型通常与原发瘤相同，反映其同源性；若组织学类型不同，应考虑多原发肿瘤、误判或去分化等情况，不能作为远隔转移瘤的特点。\nB. 错误：血道转移至远隔器官时常见多个转移灶，而非典型单个转移灶；单个病灶不能概括远隔器官转移瘤的形态规律。\nC. 错误：转移瘤可保留原发瘤的分化特征，但“分化程度同原发肿瘤”并非远隔转移瘤的定义性形态特点，且转移瘤可出现一定程度异质性和去分化，不能作为最佳选项。\nD. 正确：远隔器官转移瘤常表现为多个圆形结节，散在分布于脏器边缘，中央坏死凹陷可形成“癌脐”，是血道转移的典型肉眼形态。\nE. 错误：远隔器官转移主要经血道，淋巴道转移首先表现为区域淋巴结转移；淋巴道晚期虽可入血，但不能把远隔器官转移瘤概括为淋巴道转移的结果。\n\n易混点：区域淋巴结转移常表现为淋巴结肿大、质硬、可粘连融合；远隔器官转移则以肺、肝等血道转移结节为典型。记忆要点：血道转移——多发性、圆形、边界清楚、脏器边缘、“癌脐”；组织学类型一般与原发瘤相同。","chapter":6,"chapterName":"肿瘤","chapterTitle":"第6章 肿瘤"},{"id":"pathology-2a-single-0041","type":"single","typeLabel":"单选题","number":41,"question":"乳腺癌最常见的组织学类型是","options":[{"key":"A","text":"浸润性小叶癌"},{"key":"B","text":"髓样癌"},{"key":"C","text":"浸润性导管癌"},{"key":"D","text":"导管内癌为主的浸润性导管癌"},{"key":"E","text":"小管癌"}],"answerKeys":["C"],"answerText":["浸润性导管癌"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：乳腺癌中最常见的组织学类型是浸润性导管癌（非特殊类型）。\n解析：浸润性导管癌是乳腺浸润性癌中最常见的组织学类型，约占全部乳腺癌的大多数。其基本病理机制是导管上皮来源的癌细胞突破基底膜向间质浸润生长，镜下常呈巢状、索条状或片状排列，并伴明显促纤维增生，故触诊质硬、边界不清。题眼是“最常见的组织学类型”，应选非特殊类型浸润性导管癌，而不是特殊类型癌或伴大量导管内癌成分的亚型。\n选项分析：\nA. 错误：浸润性小叶癌是乳腺癌较常见的特殊类型，但发生率明显低于浸润性导管癌；其癌细胞常呈单行串珠状浸润，E-cadherin表达缺失，不是本题“最常见”的答案。\nB. 错误：髓样癌属于特殊类型乳腺癌，较少见，镜下常呈合体细胞样巢团、边界较清楚并伴明显淋巴浆细胞浸润，不能作为最常见组织学类型。\nC. 正确：浸润性导管癌为非特殊类型浸润性乳腺癌中最常见者，癌细胞浸润间质并引起纤维组织增生，是考试中“乳腺癌最常见组织学类型”的标准答案。\nD. 错误：导管内癌为主的浸润性导管癌描述的是浸润性导管癌中伴大量导管内癌成分的情况，属于成分/伴随病变的描述，并不是乳腺癌最常见的独立组织学类型；不能与浸润性导管癌本身混淆。\nE. 错误：小管癌是特殊类型乳腺癌，分化较好，由小而规则的小管构成，发生率低，不符合“最常见”。\n易混点：记忆时抓住“非特殊类型浸润性导管癌最常见，浸润性小叶癌次之”；小叶癌与导管癌鉴别常看E-cadherin，小叶癌通常缺失。特殊类型癌如髓样癌、小管癌均少见，不能与最常见的浸润性导管癌混淆。","chapter":14,"chapterName":"生殖系统和乳腺疾病","chapterTitle":"第14章 生殖系统和乳腺疾病"},{"id":"pathology-2a-single-0042","type":"single","typeLabel":"单选题","number":42,"question":"风湿性心脏病瓣膜疣赘物的结局是","options":[{"key":"A","text":"溶解吸收"},{"key":"B","text":"机化引起心瓣膜病变"},{"key":"C","text":"软化脱落引起栓塞"},{"key":"D","text":"引起瓣膜穿孔"},{"key":"E","text":"引起败血症"}],"answerKeys":["B"],"answerText":["机化引起心瓣膜病变"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：风湿性心内膜炎瓣膜疣状赘生物的结局是机化并导致慢性心瓣膜病。\n解析：风湿性心内膜炎时，瓣膜闭锁缘形成串珠状、粟粒大小的疣状赘生物，本质为血小板和纤维蛋白构成的白色血栓，附着较牢固。赘生物机化后可造成瓣膜增厚、变硬、卷曲、短缩及粘连，最终引起瓣膜狭窄和/或关闭不全。题眼是“风湿性心脏病瓣膜疣赘物”，其最重要结局是机化并遗留瓣膜病变。\n\n选项分析：\nA. 错误：风湿性疣赘物虽体积小，但其主要结局是机化并导致瓣膜变形；溶解吸收不是本题所考查的风湿性瓣膜疣赘物主要结局。\nB. 正确：疣赘物由白色血栓构成，机化后纤维组织增生，使瓣膜增厚、变硬、粘连、短缩，形成慢性风湿性心瓣膜病。\nC. 错误：软化脱落引起栓塞多见于感染性心内膜炎的赘生物，其较大、松软、易脱落；风湿性疣赘物附着牢固，一般不易脱落。\nD. 错误：瓣膜穿孔主要见于感染性心内膜炎，因细菌破坏瓣膜组织；风湿性心内膜炎一般不引起瓣膜穿孔。\nE. 错误：败血症是感染性心内膜炎的重要临床后果，因赘生物内含细菌并不断入血；风湿性疣赘物为无菌性白色血栓，不引起败血症。\n\n易混点：风湿性心内膜炎疣赘物为无菌性白色血栓，位于瓣膜闭锁缘，附着牢固，主要机化导致瓣膜病；感染性心内膜炎赘生物含细菌，体积较大、松软易脱落，可引起栓塞、瓣膜穿孔和败血症。记忆要点：风湿“机化留瓣病”，感染“脱落栓败穿”。","chapter":9,"chapterName":"心血管系统疾病","chapterTitle":"第9章 心血管系统疾病"},{"id":"pathology-2a-single-0043","type":"single","typeLabel":"单选题","number":43,"question":"小叶性肺炎的病变性质是","options":[{"key":"A","text":"浆液性炎"},{"key":"B","text":"卡他性炎"},{"key":"C","text":"肉芽肿性炎"},{"key":"D","text":"化脓性炎"},{"key":"E","text":"纤维素性炎"}],"answerKeys":["D"],"answerText":["化脓性炎"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：小叶性肺炎的病变性质为化脓性炎，是以细支气管为中心的肺小叶化脓性炎症。\n解析：小叶性肺炎又称支气管肺炎，多由化脓性细菌经支气管播散引起。炎症以细支气管为中心，累及周围肺泡，肺泡腔内充满中性粒细胞、脓细胞和渗出物，形成散在的、大小不一的化脓性实变灶。题眼是“病变性质”，应与大叶性肺炎的纤维素性炎、病毒性肺炎的间质性炎等相区别。\n选项分析：\nA. 错误：浆液性炎以浆液渗出为主，可见于炎症早期或某些渗出性病变，但不是小叶性肺炎的主要病变性质。\nB. 错误：卡他性炎是黏膜的渗出性炎症，常见于支气管炎等，虽有黏液和炎性渗出，但小叶性肺炎的本质是肺小叶化脓性炎。\nC. 错误：肉芽肿性炎以巨噬细胞及其衍生的上皮样细胞形成肉芽肿为特征，常见于结核病、结节病、异物性炎症等，不是小叶性肺炎。\nD. 正确：小叶性肺炎以细支气管为中心，肺泡腔内大量中性粒细胞浸润并坏死，形成化脓性实变灶，故为化脓性炎。\nE. 错误：纤维素性炎以纤维蛋白原渗出并形成纤维素为特征，典型见于大叶性肺炎、白喉、纤维素性心包炎等，不是小叶性肺炎的病变性质。\n易混点：大叶性肺炎常为纤维素性炎，病变累及肺大叶；小叶性肺炎即支气管肺炎，为化脓性炎，病灶围绕细支气管呈小叶性分布。病毒性、支原体性肺炎多为间质性炎，不以中性粒细胞性化脓性渗出为主。","chapter":10,"chapterName":"呼吸系统疾病","chapterTitle":"第10章 呼吸系统疾病"},{"id":"pathology-2a-single-0044","type":"single","typeLabel":"单选题","number":44,"question":"下述关于脑动脉粥样硬化的叙述中，哪项是错误的","options":[{"key":"A","text":"大脑前动脉病变最重"},{"key":"B","text":"脑动脉粥样硬化的发生比冠状动脉晚"},{"key":"C","text":"继发脑动脉血栓形成"},{"key":"D","text":"可引起脑软化"},{"key":"E","text":"可引起小动脉瘤"}],"answerKeys":["A"],"answerText":["大脑前动脉病变最重"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：A\n核心考点：脑动脉粥样硬化的好发部位、病变特点及其继发病变（血栓形成、脑软化、小动脉瘤）。\n解析：脑动脉粥样硬化最常累及基底动脉、大脑中动脉及Willis环，其中以大脑中动脉和基底动脉病变最重，而不是大脑前动脉，故A叙述错误，为本题正确答案。脑动脉粥样硬化发生一般较冠状动脉粥样硬化晚；斑块使管腔狭窄、内皮损伤，可继发血栓形成，导致脑组织缺血、梗死，形成脑软化。动脉壁因粥样硬化而受损、变薄，在血流压力作用下可形成小动脉瘤，破裂可引起脑出血。题眼在于“病变最重”的部位判断。\n\n选项分析：\nA. 错误：脑动脉粥样硬化病变最重的是大脑中动脉和基底动脉，大脑前动脉并非病变最重部位；本项叙述不符合病理学事实，是本题所选的错误项。\nB. 正确：脑动脉粥样硬化的发生通常较冠状动脉粥样硬化晚，这与不同动脉床病变出现时间差异有关。\nC. 正确：粥样斑块可造成管腔狭窄、内皮损伤和血流紊乱，容易继发血栓形成，进一步加重脑缺血。\nD. 正确：脑动脉粥样硬化导致管腔狭窄或闭塞时，相应供血区脑组织缺血坏死，可形成脑软化（脑梗死）。\nE. 正确：粥样硬化使动脉壁结构破坏、局部变薄，在血压冲击下可形成小动脉瘤，破裂可致脑出血。\n\n易混点：脑动脉粥样硬化好发于大脑中动脉和基底动脉，大脑中动脉病变常引起对侧偏瘫等；高血压性小动脉硬化也可形成微动脉瘤并致脑出血，但二者血管病变基础不同。记忆要点：脑动脉粥样硬化“中动脉、基底动脉最重”，并发症记“血栓、脑软化、小动脉瘤”。","chapter":9,"chapterName":"心血管系统疾病","chapterTitle":"第9章 心血管系统疾病"},{"id":"pathology-2a-single-0045","type":"single","typeLabel":"单选题","number":45,"question":"动脉粥样硬化主要累及","options":[{"key":"A","text":"小动脉的内膜"},{"key":"B","text":"大、中动脉的中膜"},{"key":"C","text":"大、中动脉的内膜"},{"key":"D","text":"小动脉的中膜"},{"key":"E","text":"细动脉壁"}],"answerKeys":["C"],"answerText":["大、中动脉的内膜"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：动脉粥样硬化主要累及大、中动脉的内膜，形成脂质斑块及纤维斑块。\n解析：动脉粥样硬化（AS）的病变起始于大、中动脉内膜，尤其是腹主动脉后壁及其分支开口处、冠状动脉、脑底动脉、肾动脉等。其机制与内皮损伤、脂质沉积、单核细胞浸润、泡沫细胞形成及平滑肌细胞增生有关，肉眼可见内膜脂纹、纤维斑块、粥样斑块，并可继发溃疡、血栓形成、钙化和动脉瘤。本题题眼是“主要累及”，应定位到“大、中动脉的内膜”，而不是中膜或小/细动脉。\n\n选项分析：\nA. 错误：小动脉内膜不是动脉粥样硬化的主要部位；小动脉受累更常见于高血压所致小动脉硬化，如增生性小动脉硬化，与AS的粥样斑块不同。\nB. 错误：大、中动脉的中膜不是AS的主要部位；中膜病变可见于动脉中层钙化（Mönckeberg动脉硬化），表现为中膜钙盐沉积，与AS无关。\nC. 正确：AS主要发生在大、中动脉内膜，内膜脂质沉积、泡沫细胞形成和纤维斑块是其基本病变，故为标准答案。\nD. 错误：小动脉中膜不是AS主要累及部位；小动脉病变常见于高血压、糖尿病等所致小动脉硬化/玻璃样变，并非粥样斑块。\nE. 错误：细动脉壁病变常见于良性高血压或糖尿病的细动脉玻璃样变，以及恶性高血压的纤维素样坏死，不属于动脉粥样硬化的主要累及部位。\n\n易混点：动脉硬化是总称，包括动脉粥样硬化、小动脉硬化和动脉中层钙化。记忆要点：“粥样硬化累及大、中动脉内膜”；“小动脉硬化/细动脉玻璃样变”多与高血压、糖尿病相关；“中层钙化”累及中膜，不形成粥样斑块。","chapter":9,"chapterName":"心血管系统疾病","chapterTitle":"第9章 心血管系统疾病"},{"id":"pathology-2a-single-0046","type":"single","typeLabel":"单选题","number":46,"question":"下述流行性脑脊髓膜炎的临床表现错误的是","options":[{"key":"A","text":"脑脊髓膜刺激征"},{"key":"B","text":"颅内压升高症状"},{"key":"C","text":"混浊或脓样脑脊髓液"},{"key":"D","text":"血性脑脊髓液"},{"key":"E","text":"皮肤淤点及淤斑"}],"answerKeys":["D"],"answerText":["血性脑脊髓液"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：流行性脑脊髓膜炎是脑膜炎双球菌引起的化脓性脑脊髓膜炎，脑脊液典型改变为混浊或脓性，而不是血性。\n解析：流行性脑脊髓膜炎主要累及软脑膜和蛛网膜，炎症渗出物使脑脊液呈混浊、脓样，常规检查可见中性粒细胞显著增多、蛋白升高、糖和氯化物降低，并可找到致病菌。临床可见脑膜刺激征、颅内压升高及败血症期皮肤淤点、淤斑。血性脑脊液常提示蛛网膜下腔出血、脑出血破入脑室或蛛网膜下腔、颅脑外伤等，并非流脑的典型表现，故D错误。\n\n选项分析：\nA. 正确：脑膜炎症刺激可引起颈项强直、Kernig征、Brudzinski征等脑脊髓膜刺激征。\nB. 正确：炎性渗出物和脑水肿可致颅内压升高，出现头痛、呕吐、视乳头水肿等。\nC. 正确：流脑为化脓性脑膜炎，脑脊液外观混浊或呈脓样，中性粒细胞大量渗出是题眼。\nD. 错误：流脑脑脊液典型为混浊或脓样而非血性；血性脑脊液多见于蛛网膜下腔出血、脑出血或颅脑外伤等。\nE. 正确：脑膜炎双球菌败血症可损伤血管内皮并引起DIC，出现皮肤淤点、淤斑，暴发型更明显。\n\n易混点：化脓性脑膜炎脑脊液“混浊、中性粒细胞多、糖低”；病毒性脑膜炎多“清亮、淋巴细胞多、糖正常”；血性脑脊液要首先想到蛛网膜下腔出血或损伤，不要误归为流脑。记忆要点：流脑是“脓性脑脊液＋皮肤淤点淤斑”，不是“血性脑脊液”。","chapter":16,"chapterName":"神经系统疾病","chapterTitle":"第16章 神经系统疾病"},{"id":"pathology-2a-single-0047","type":"single","typeLabel":"单选题","number":47,"question":"原发性肺结核的特点不包括","options":[{"key":"A","text":"多见于儿童"},{"key":"B","text":"形成原发综合征"},{"key":"C","text":"急性全身性粟粒性结核多见"},{"key":"D","text":"肺门淋巴结易受累"},{"key":"E","text":"原发病灶常见于肺上叶下部或肺下叶上部近脏胸膜处"}],"answerKeys":["C"],"answerText":["急性全身性粟粒性结核多见"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：原发性肺结核的典型临床病理特点及原发综合征的构成。\n解析：原发性肺结核多见于儿童，是机体首次感染结核分枝杆菌后形成的病变，典型表现为原发综合征，即肺原发病灶、结核性淋巴管炎和肺门淋巴结结核三者并存。原发病灶常位于肺上叶下部或下叶上部近脏胸膜处，肺门淋巴结易受累。急性全身性粟粒性结核属于血道播散所致，可在原发肺结核恶化时发生，但并非原发性肺结核“多见”的特点，故C为本题题眼。\n\n选项分析：\nA. 正确：原发性肺结核多见于儿童，因儿童初次感染结核分枝杆菌、尚未建立特异性免疫力，故符合其特点。\nB. 正确：原发综合征是原发性肺结核的典型表现，由肺原发病灶、结核性淋巴管炎和肺门淋巴结结核组成。\nC. 错误：急性全身性粟粒性结核是血行播散性结核的表现，可在少数原发性肺结核恶化时发生，但不能说原发性肺结核“多见”此改变，故不属于其常见特点。\nD. 正确：原发性肺结核时病原体沿淋巴管引流至肺门淋巴结，故肺门淋巴结易受累并发生干酪样坏死。\nE. 正确：原发病灶常位于肺上叶下部或肺下叶上部、靠近脏胸膜处，这是原发性肺结核原发灶的典型好发部位。\n\n易混点：原发综合征容易与继发性肺结核混淆。继发性肺结核多见于成人，好发于肺尖，病变多样、易形成空洞并以支气管播散为主；原发性肺结核多见于儿童，以原发综合征和肺门淋巴结受累为特征。急性粟粒性结核提示血道播散，但“血行播散可见”不等于“原发型肺结核多见”。","chapter":18,"chapterName":"传染病","chapterTitle":"第18章 传染病"},{"id":"pathology-2a-single-0048","type":"single","typeLabel":"单选题","number":48,"question":"脾、肾梗死灶肉眼检查的主要特点为","options":[{"key":"A","text":"多呈楔形、灰白色、界限清楚"},{"key":"B","text":"多呈不规则形、暗红色、界限不清"},{"key":"C","text":"多呈楔形、暗红色、界限不清"},{"key":"D","text":"多呈地图形、暗红色、界限不清"},{"key":"E","text":"多呈地图形、灰白色、界限清楚"}],"answerKeys":["A"],"answerText":["多呈楔形、灰白色、界限清楚"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：A\n核心考点：脾、肾贫血性梗死的肉眼形态特点及其发生机制。\n解析：脾、肾属于组织致密、侧支循环较少的实质器官，动脉分支阻塞后局部组织发生凝固性坏死，形成贫血性梗死。典型肉眼观为梗死灶呈楔形（切面呈三角形），尖端指向血管阻塞处、底部朝向器官包膜，灰白色，与周围正常组织界限清楚；周围可有一圈暗红色充血出血带。本题题眼是“脾、肾”和“楔形、灰白色、界限清楚”，应选A。\n选项分析：\nA. 正确：脾、肾贫血性梗死灶多呈楔形、灰白色、界限清楚，符合其致密组织和侧支循环少的特点。\nB. 错误：不规则形、暗红色、界限不清更符合出血性梗死的表现，常见于肺、肠等存在双重血供、组织疏松或伴严重淤血的器官，并非脾、肾梗死的主要特点。\nC. 错误：楔形可见于脾、肾梗死，但暗红色、界限不清提示明显出血性改变，不符合脾、肾贫血性梗死以灰白色凝固性坏死为主的特点。\nD. 错误：地图形、暗红色、界限不清多见于出血性梗死或坏死性炎症等病变，与脾、肾贫血性梗死形态不符。\nE. 错误：地图形、灰白色、界限清楚可用来描述部分贫血性梗死（如心肌梗死呈不规则地图状），但不是脾、肾梗死“楔形”的典型肉眼特点。\n易混点：贫血性梗死好发于脾、肾、心，因组织致密、侧支循环少，梗死灶灰白、界限清；出血性梗死好发于肺、肠，因双重血供、组织疏松或淤血，梗死灶暗红。记忆要点：脾肾“楔形灰白”，肺肠“暗红出血”。","chapter":3,"chapterName":"局部血液循环障碍","chapterTitle":"第3章 局部血液循环障碍"},{"id":"pathology-2a-single-0049","type":"single","typeLabel":"单选题","number":49,"question":"伤寒小结的主要构成成分是","options":[{"key":"A","text":"类上皮细胞"},{"key":"B","text":"淋病细胞"},{"key":"C","text":"多核巨细胞"},{"key":"D","text":"浆细胞"},{"key":"E","text":"巨噬细胞"}],"answerKeys":["E"],"answerText":["巨噬细胞"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n核心考点：伤寒小结即伤寒肉芽肿，主要由吞噬活跃的巨噬细胞（伤寒细胞）聚集构成。\n解析：伤寒杆菌感染后，巨噬细胞被激活并吞噬伤寒杆菌、红细胞、淋巴细胞及细胞碎片，形成胞质丰富、吞噬活跃的“伤寒细胞”；多个伤寒细胞聚集即形成伤寒小结。伤寒小结是伤寒的特征性病变，常见于回肠末段集合淋巴小结、肠系膜淋巴结、肝、脾和骨髓等处，可伴坏死并形成溃疡。本题题眼是“伤寒小结的主要构成成分”，应选巨噬细胞。\n选项分析：\nA. 错误：类上皮细胞是结核结节的主要成分之一，由巨噬细胞转化而来，但不是伤寒小结的主要构成细胞。\nB. 错误：“淋病细胞”并非规范病理学概念，若题意为淋巴细胞，则淋巴细胞可存在于伤寒小结中，但只是少量伴随成分，不是主要构成成分。\nC. 错误：多核巨细胞常见于结核结节（朗汉斯巨细胞）或异物肉芽肿，伤寒小结中不是主要成分。\nD. 错误：浆细胞主要见于慢性炎症、梅毒等病变，可产生抗体，但不是伤寒小结的主要构成细胞。\nE. 正确：伤寒小结由伤寒细胞构成，伤寒细胞本质为吞噬活跃的巨噬细胞，故主要成分为巨噬细胞。\n易混点：结核结节以类上皮细胞和朗汉斯多核巨细胞为特征；伤寒小结以巨噬细胞（伤寒细胞）为特征。记忆要点：结核看“类上皮+朗汉斯巨细胞”，伤寒看“巨噬细胞吞噬成伤寒细胞”。","chapter":18,"chapterName":"传染病","chapterTitle":"第18章 传染病"},{"id":"pathology-2a-single-0050","type":"single","typeLabel":"单选题","number":50,"question":"急性输卵管炎的基本病变是","options":[{"key":"A","text":"黏膜层的增生性炎"},{"key":"B","text":"肌层的化脓性炎"},{"key":"C","text":"全层的坏疽性炎"},{"key":"D","text":"黏膜层的肉芽肿性炎"},{"key":"E","text":"浆膜层的卡他性炎"}],"answerKeys":["E"],"answerText":["浆膜层的卡他性炎"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n核心考点：急性输卵管炎的基本病变为浆膜层的卡他性炎，即以浆膜充血、水肿和浆液性渗出为主的渗出性炎症。\n解析：急性输卵管炎多由上行性感染引起，早期基本病变表现为输卵管浆膜层充血、水肿，浆液性渗出并伴少量中性粒细胞浸润，即浆膜层卡他性炎。病变可向管壁其他层蔓延，但本题问“基本病变”，题眼在“急性”和“浆膜层卡他性炎”，应选E。临床常伴下腹痛、发热及阴道分泌物增多等。\n\n选项分析：\nA. 错误：黏膜层增生性炎多见于慢性输卵管炎，以黏膜上皮增生、纤维组织增生和管壁增厚为特点，不是急性输卵管炎的基本病变。\nB. 错误：肌层化脓性炎可见于炎症加重或扩散时，但急性输卵管炎的基本病变不是肌层化脓性炎；化脓性炎以大量中性粒细胞浸润和脓性渗出为特征。\nC. 错误：全层坏疽性炎属于严重感染伴缺血坏死，病变累及全层并出现坏疽，不是急性输卵管炎的普通基本病变。\nD. 错误：黏膜层肉芽肿性炎主要见于输卵管结核等特殊感染，镜下为结核结节和干酪样坏死等，不是急性输卵管炎的表现。\nE. 正确：急性输卵管炎基本病变为浆膜层卡他性炎，表现为浆膜充血、水肿和浆液性渗出，符合急性渗出性炎症特点。\n\n易混点：卡他性炎常被误认为只发生在黏膜，本题强调急性输卵管炎的基本病变定位在浆膜层；慢性输卵管炎重黏膜增生和纤维化，输卵管结核重肉芽肿性炎，全层坏疽性炎则提示严重缺血坏死性感染。记忆要点：急性重浆膜卡他渗出，慢性重黏膜增生纤维化，结核重肉芽肿。","chapter":14,"chapterName":"生殖系统和乳腺疾病","chapterTitle":"第14章 生殖系统和乳腺疾病"},{"id":"pathology-2a-single-0051","type":"single","typeLabel":"单选题","number":51,"question":"慢性支气管炎最常见的并发症是","options":[{"key":"A","text":"支气管扩张症"},{"key":"B","text":"大叶性肺炎"},{"key":"C","text":"肺气肿"},{"key":"D","text":"小叶性肺炎"},{"key":"E","text":"肺脓肿"}],"answerKeys":["C"],"answerText":["肺气肿"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：慢性支气管炎最常见并发症是阻塞性肺气肿。\n解析：慢性支气管炎长期反复发作，导致细支气管管壁增厚、纤维化及黏液栓形成，引起气道不完全阻塞和呼气性呼吸困难，使肺泡内残气量增多、肺泡过度膨胀，最终形成肺气肿。其病理基础是慢性气道阻塞所致肺泡膨胀及肺泡壁破坏，考试题眼是“最常见并发症”。\n选项分析：\nA. 错误：支气管扩张症可为慢性支气管炎反复感染后的并发症，因支气管壁破坏、管腔持久扩张，但发生率不如肺气肿高，且典型表现为大量脓痰、咯血。\nB. 错误：大叶性肺炎主要由肺炎链球菌引起，为肺泡弥漫性纤维素性渗出性炎，并非慢性支气管炎最常见并发症。\nC. 正确：慢性支气管炎引起气道阻塞和呼气困难，导致肺泡残气量增加、肺泡膨胀，进而发生肺气肿，是本题标准答案。\nD. 错误：小叶性肺炎是以细支气管为中心的化脓性炎，慢性支气管炎患者可因抵抗力下降而并发，但不是最常见并发症。\nE. 错误：肺脓肿是肺组织化脓性坏死并形成脓腔，可继发于吸入性感染或肺炎，但并非慢性支气管炎最常见并发症。\n易混点：慢性支气管炎、肺气肿、支气管扩张症均可有长期咳嗽咳痰，但慢支最常见并发症是肺气肿；支气管扩张症以大量脓痰和咯血为特点；小叶性肺炎强调以细支气管为中心的化脓性炎。记忆要点：慢支→气道阻塞→残气增多→肺气肿。","chapter":10,"chapterName":"呼吸系统疾病","chapterTitle":"第10章 呼吸系统疾病"},{"id":"pathology-2a-single-0052","type":"single","typeLabel":"单选题","number":52,"question":"最有防御意义的炎症改变过程是","options":[{"key":"A","text":"炎症介质形成"},{"key":"B","text":"分解代谢亢进"},{"key":"C","text":"局部酸中毒"},{"key":"D","text":"分子浓度增高"},{"key":"E","text":"白细胞渗出"}],"answerKeys":["E"],"answerText":["白细胞渗出"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n\n核心考点：炎症渗出的白细胞是机体清除病原体和坏死组织的主要防御力量，白细胞渗出最有防御意义。\n\n解析：炎症的基本病理变化包括变质、渗出和增生，其中渗出性改变尤其是白细胞渗出，是机体防御反应的核心环节。白细胞在趋化因子作用下穿出血管，进入炎区后通过吞噬、杀菌和降解坏死组织等方式清除病原体及抗原物质，因此具有明确的防御意义。题眼是“最有防御意义”，应抓住白细胞的吞噬和杀菌功能，而不是炎症局部的代谢改变或炎症介质的调控作用。\n\n选项分析：\nA. 错误：炎症介质形成可扩张血管、增加通透性、趋化白细胞并引起疼痛等，是炎症反应的重要调控环节，但其本身主要起介导和放大作用，不是最直接、最有防御意义的改变。\nB. 错误：分解代谢亢进是炎症局部代谢改变之一，可导致耗氧增加、乳酸堆积和局部酸中毒，属于炎症局部环境变化，不能直接体现清除病原体的防御功能。\nC. 错误：局部酸中毒由分解代谢增强、缺氧和乳酸堆积等引起，可影响酶活性和局部环境，但属于继发性代谢改变，不是最有防御意义的炎症过程。\nD. 错误：分子浓度增高主要与血管通透性增加、血浆蛋白渗出及组织分解产物增多有关，反映渗出和代谢改变，不能等同于白细胞的吞噬杀菌防御作用。\nE. 正确：白细胞渗出包括边集、滚动、黏附、游出和趋化，随后发挥吞噬和杀菌作用，是炎症中最重要、最直接的防御性改变。\n\n易混点：炎症介质形成和白细胞渗出都参与炎症，但前者主要是“调控和放大”，后者才是“执行防御”。记忆要点：看炎症防御意义，首选白细胞渗出；看炎症局部代谢改变，才考虑分解代谢亢进、局部酸中毒和分子浓度增高。","chapter":4,"chapterName":"炎症","chapterTitle":"第4章 炎症"},{"id":"pathology-2a-single-0053","type":"single","typeLabel":"单选题","number":53,"question":"陷窝细胞常见于霍奇金淋巴瘤的哪种组织学类型","options":[{"key":"A","text":"结节性淋巴细胞为主型"},{"key":"B","text":"淋巴细胞为主型"},{"key":"C","text":"淋巴细胞减少型"},{"key":"D","text":"混合细胞型"},{"key":"E","text":"结节硬化型"}],"answerKeys":["E"],"answerText":["结节硬化型"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n核心考点：陷窝细胞是结节硬化型经典霍奇金淋巴瘤的特征性肿瘤细胞。\n解析：陷窝细胞属于R-S细胞的变异型，体积大、胞质丰富浅染，核常呈分叶状，福尔马林固定后胞质收缩，与周围细胞之间形成空隙，形似“陷窝”。结节硬化型经典霍奇金淋巴瘤的镜下特点是粗大胶原纤维束将病变分隔成结节，结节内可见陷窝细胞，并常伴有小淋巴细胞、嗜酸性粒细胞等背景细胞。该型好发于年轻女性，常累及纵隔淋巴结，本题题眼即“陷窝细胞”与“结节硬化型”的对应关系。\n选项分析：\nA. 错误：结节性淋巴细胞为主型霍奇金淋巴瘤以LP细胞（“爆米花细胞”）为特征，免疫表型常为CD20+、CD45+、CD15-、CD30-，不是陷窝细胞常见类型。\nB. 错误：淋巴细胞为主型（经典型霍奇金淋巴瘤的淋巴细胞丰富型/旧分类）背景以大量小淋巴细胞为主，典型R-S细胞较少，陷窝细胞不是其标志性改变。\nC. 错误：淋巴细胞减少型以多形性R-S细胞、Hodgkin细胞及弥漫纤维化或网状纤维增生为特点，常见于老年人，预后较差，不以陷窝细胞为特征。\nD. 错误：混合细胞型可见典型R-S细胞和Hodgkin细胞，背景为淋巴细胞、嗜酸性粒细胞、浆细胞等混合性炎细胞，常与EBV感染相关，但缺乏结节硬化型中胶原纤维束分隔结节及陷窝细胞为主的特点。\nE. 正确：结节硬化型以胶原纤维束分隔结节和陷窝细胞为组织学特征，是陷窝细胞最常见、最常考的霍奇金淋巴瘤亚型。\n易混点：陷窝细胞见于结节硬化型经典霍奇金淋巴瘤；“爆米花细胞”见于结节性淋巴细胞为主型霍奇金淋巴瘤。记忆要点：结节硬化型—胶原纤维束—陷窝细胞—年轻女性纵隔淋巴结；NLPHL—爆米花细胞—CD20+、CD15-、CD30-。","chapter":12,"chapterName":"淋巴造血系统疾病","chapterTitle":"第12章 淋巴造血系统疾病"},{"id":"pathology-2a-single-0054","type":"single","typeLabel":"单选题","number":54,"question":"发生液化性坏死基本条件应包括","options":[{"key":"A","text":"含有较多的可凝固蛋白"},{"key":"B","text":"组织淤血较严重"},{"key":"C","text":"组织比较松软"},{"key":"D","text":"产生蛋白酶较多"},{"key":"E","text":"有腐败菌感染"}],"answerKeys":["D"],"answerText":["产生蛋白酶较多"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：液化性坏死的基本机制是组织内蛋白酶产生增多、酶性消化占优势。\n解析：坏死时如果蛋白凝固占优势，形成凝固性坏死；若组织内蛋白酶较多，坏死组织被酶分解液化，则形成液化性坏死。脑梗死时脑组织因脂质多、可凝固蛋白少，加上溶酶体酶和炎症细胞释放蛋白酶，坏死组织迅速液化；脓肿时中性粒细胞释放大量蛋白酶也可造成液化。本题题眼是“基本条件应包括”，应抓住蛋白酶增多这一关键机制。\n选项分析：\nA. 错误：含有较多可凝固蛋白是凝固性坏死的重要基础，如心、肾、脾梗死时蛋白变性凝固占优势，并非液化性坏死的基本条件。\nB. 错误：组织淤血较重主要提示循环障碍、充血或出血性梗死等改变，可加重缺血缺氧，但不是发生液化性坏死的直接基本条件。\nC. 错误：组织比较松软只是形态学或质地描述，不能决定坏死类型；脑组织虽软，但液化性坏死的关键仍是酶性消化。\nD. 正确：产生蛋白酶较多使坏死组织被迅速分解液化，是液化性坏死的核心条件，常见于脑梗死、脓肿及急性胰腺炎脂肪坏死周围等。\nE. 错误：腐败菌感染主要与坏疽相关，尤其湿性坏疽可出现腐败和液化，但腐败菌感染不是液化性坏死的基本条件；无菌性脓肿或脑梗死液化可无腐败菌感染。\n易混点：凝固性坏死以蛋白变性凝固为主，肉眼灰白、界限较清；液化性坏死以酶性消化为主，坏死组织呈液态。记“凝固看蛋白，液化看酶”，坏疽则强调腐败菌感染和坏死组织继发改变。","chapter":1,"chapterName":"细胞和组织的适应与损伤","chapterTitle":"第1章 细胞和组织的适应与损伤"},{"id":"pathology-2a-single-0055","type":"single","typeLabel":"单选题","number":55,"question":"伤寒的传播途径是","options":[{"key":"A","text":"消化道传播"},{"key":"B","text":"呼吸道传播"},{"key":"C","text":"血液传播"},{"key":"D","text":"接触传播"},{"key":"E","text":"内源性感染"}],"answerKeys":["A"],"answerText":["消化道传播"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：A\n核心考点：伤寒是伤寒沙门菌引起的急性消化道传染病，主要经粪-口途径（消化道）传播。\n解析：伤寒沙门菌随患者或带菌者的粪便、尿液排出，污染水源、食物、食具或手后经口进入消化道，故传播途径为消化道传播。细菌侵入肠黏膜后可形成菌血症，并主要累及回肠末段集合淋巴小结和孤立淋巴小结，引起髓样肿胀、坏死和溃疡。本题题眼是“传播途径”，不是菌血症阶段或肠道病变部位，不能因血培养阳性而误选血液传播。\n选项分析：\nA. 正确：伤寒沙门菌经污染的水、食物等经口进入消化道，属于典型粪-口途径传播，是本题标准答案。\nB. 错误：呼吸道传播主要见于肺结核、流感、麻疹等经飞沫或尘埃传播的疾病；伤寒虽可有全身感染，但不经呼吸道作为主要传播途径。\nC. 错误：血液传播常见于乙型肝炎、丙型肝炎、HIV感染、疟疾等；伤寒病程中可出现菌血症，但“菌血症”不等于以输血或血行方式传播。\nD. 错误：接触传播多见于狂犬病、疥疮、性传播疾病或某些直接接触感染；伤寒主要通过污染食物和水经口传播，一般不归为接触传播。\nE. 错误：内源性感染指正常菌群或体内潜伏病原在机体抵抗力下降时引起感染，如菌群失调、阑尾炎等；伤寒为外源性病原经消化道侵入，不属于内源性感染。\n易混点：伤寒、细菌性痢疾、霍乱等均以消化道传播为主，但病变和临床不同；伤寒虽有菌血症期，考试问“传播途径”仍选消化道。记忆要点：伤寒经口入，病变在回肠末段淋巴组织，溃疡长轴与肠管长轴平行。","chapter":18,"chapterName":"传染病","chapterTitle":"第18章 传染病"},{"id":"pathology-2a-single-0056","type":"single","typeLabel":"单选题","number":56,"question":"早期动脉粥样硬化的肉眼病变是","options":[{"key":"A","text":"脂纹"},{"key":"B","text":"纤维斑块"},{"key":"C","text":"粥样坏死"},{"key":"D","text":"出血"},{"key":"E","text":"玻璃样变"}],"answerKeys":["A"],"answerText":["脂纹"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：A\n核心考点：动脉粥样硬化分期及其肉眼形态，早期病变为脂纹。\n解析：动脉粥样硬化早期，在损伤的血管内皮处脂质沉积，单核细胞迁入内膜并转化为巨噬细胞，吞噬脂质形成泡沫细胞，局部肉眼表现为黄色点状或条纹状病灶，即脂纹。脂纹通常平坦或仅轻微隆起，好发于主动脉后壁及其分支开口处、冠状动脉等处，是早期、可逆性病变。题眼是“早期”和“肉眼病变”，对应脂纹，而不是已经形成明显隆起斑块或坏死灶的进展期、晚期病变。\n选项分析：\nA. 正确：脂纹是动脉粥样硬化最早期的肉眼病变，呈黄色条纹或斑点，主要由泡沫细胞和脂质沉积形成，病变平坦或微隆起。\nB. 错误：纤维斑块属于进展期病变，肉眼呈灰白色或瓷白色隆起斑块，镜下为表面纤维帽和下方脂质、泡沫细胞等，不是早期病变。\nC. 错误：粥样坏死是粥样斑块期/晚期病变，表现为灰黄色粥糜样坏死物质，常伴胆固醇结晶、钙化和炎细胞浸润，并非早期肉眼改变。\nD. 错误：出血不是早期动脉粥样硬化的基本病变；斑块内出血多发生于斑块形成后，可因新生血管破裂或斑块破裂引起，属于并发症。\nE. 错误：玻璃样变不是早期动脉粥样硬化的特征性肉眼病变；细动脉玻璃样变常见于高血压病，纤维斑块表面纤维帽也可发生玻璃样变，但均不能作为早期动脉粥样硬化病变。\n易混点：脂纹与纤维斑块最易混淆，记忆要点是“早期黄色条纹平坦或微隆起，进展期灰白隆起纤维帽”。另外，细动脉玻璃样变属于高血压性小动脉硬化，不等同于动脉粥样硬化的脂纹。","chapter":9,"chapterName":"心血管系统疾病","chapterTitle":"第9章 心血管系统疾病"},{"id":"pathology-2a-single-0057","type":"single","typeLabel":"单选题","number":57,"question":"动脉粥样硬化病变最为严重的部位是","options":[{"key":"A","text":"降主动脉"},{"key":"B","text":"胸主动脉"},{"key":"C","text":"腹主动脉"},{"key":"D","text":"升主动脉"},{"key":"E","text":"主动脉弓"}],"answerKeys":["C"],"answerText":["腹主动脉"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：主动脉粥样硬化的好发及病变最重部位是腹主动脉，尤其腹主动脉后壁及其分支开口处。\n解析：动脉粥样硬化累及主动脉时，病变程度依次以腹主动脉最重，其次为胸主动脉、主动脉弓和升主动脉。腹主动脉后壁及分支开口处受血流剪切力、湍流和血管壁结构等因素影响，脂质更易沉积，粥样斑块形成较早且较重。严重者可并发斑块溃疡、血栓形成和动脉瘤，腹主动脉也是粥样硬化性动脉瘤的常见部位。本题题眼是“最为严重”，应定位到腹主动脉而非笼统的降主动脉。\n选项分析：\nA. 错误：降主动脉包括胸主动脉和腹主动脉，表述过于笼统；若指胸降主动脉，其粥样硬化程度也较腹主动脉轻，不能作为病变最严重部位。\nB. 错误：胸主动脉可发生粥样硬化，但病变程度一般轻于腹主动脉，不是最严重部位。\nC. 正确：腹主动脉，特别是后壁及分支开口处，是主动脉粥样硬化最常累及且病变最严重的部位。\nD. 错误：升主动脉粥样硬化相对较轻；临床上升主动脉更应注意梅毒性主动脉炎等病变，而非粥样硬化最重部位。\nE. 错误：主动脉弓可发生粥样硬化，但程度不及腹主动脉，不是本题所问的最严重部位。\n易混点：主动脉粥样硬化以腹主动脉最重；梅毒性主动脉炎好发于升主动脉和主动脉弓，二者好发部位相反。记忆要点：粥样硬化“腹主最重”，梅毒“升主为主”。","chapter":9,"chapterName":"心血管系统疾病","chapterTitle":"第9章 心血管系统疾病"},{"id":"pathology-2a-single-0058","type":"single","typeLabel":"单选题","number":58,"question":"下述哪种病变不会引起远隔器官梗死","options":[{"key":"A","text":"风湿性二尖瓣狭窄"},{"key":"B","text":"心肌梗死"},{"key":"C","text":"心脏室壁瘤"},{"key":"D","text":"亚急性感染性心内膜炎"},{"key":"E","text":"高血压性心脏病"}],"answerKeys":["E"],"answerText":["高血压性心脏病"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n核心考点：远隔器官梗死多由体循环动脉栓塞引起，重点掌握心源性栓子的常见来源。\n解析：远隔器官梗死通常指脑、肾、脾、肠系膜等体循环器官的动脉栓塞性梗死。心腔内附壁血栓、瓣膜赘生物或左房血栓脱落后，栓子可随体循环动脉进入远隔器官，造成栓塞性梗死。高血压性心脏病主要引起左心室向心性肥大，晚期可发生心力衰竭和心律失常，一般不形成易脱落的瓣膜赘生物或心腔内附壁血栓，因此不是远隔器官梗死的常见原因。本题题眼是“远隔器官梗死”，即寻找能产生体循环栓子的心脏病变。\n选项分析：\nA. 错误：风湿性二尖瓣狭窄可引起左心房扩张、心房颤动和左房血栓形成，血栓脱落可导致脑、肾、脾等远隔器官栓塞性梗死，因此符合“可引起”。\nB. 错误：心肌梗死特别是前壁、心尖部透壁性梗死，可形成心内膜附壁血栓，血栓脱落可造成体循环栓塞和远隔器官梗死，因此符合“可引起”。\nC. 错误：心脏室壁瘤处血流缓慢、内膜损伤，易形成附壁血栓，血栓脱落后可引起远隔器官动脉栓塞和梗死，因此符合“可引起”。\nD. 错误：亚急性感染性心内膜炎时，瓣膜表面形成大而松脆的赘生物，赘生物脱落可随体循环引起脑、肾、脾等栓塞，甚至形成感染性梗死和脓肿，因此符合“可引起”。\nE. 正确：高血压性心脏病以左心室肥大、心腔扩张和心力衰竭为主，通常不形成可脱落的心腔内血栓或瓣膜赘生物，故一般不引起远隔器官梗死。\n易混点：高血压本身可导致脑出血、腔隙性脑梗死或高血压脑病，但这些多与细小动脉硬化、血压骤升有关，不属于心源性栓子造成的远隔器官栓塞性梗死。记忆要点：能引起体循环栓塞的心脏病变常与“左房/左室附壁血栓、瓣膜赘生物”有关，如二尖瓣狭窄、心肌梗死、室壁瘤和感染性心内膜炎。","chapter":9,"chapterName":"心血管系统疾病","chapterTitle":"第9章 心血管系统疾病"},{"id":"pathology-2a-single-0059","type":"single","typeLabel":"单选题","number":59,"question":"关于风湿病的论述中，哪一项是错误的是","options":[{"key":"A","text":"风湿病是累及全身结缔组织的变态反应性疾病"},{"key":"B","text":"心脏病变对患者危害最大"},{"key":"C","text":"风湿性心内膜炎引起的慢性心瓣膜病严重影响心脏功能"},{"key":"D","text":"风湿性关节炎常可导致关节畸形"},{"key":"E","text":"皮下结节和环形红斑对临床诊断风湿病有帮助"}],"answerKeys":["D"],"answerText":["风湿性关节炎常可导致关节畸形"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：风湿病的全身结缔组织变态反应性炎症及其心脏、关节等受累特点，尤其是风湿性关节
