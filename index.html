巴结转移。\n解析：胃癌的“早期”是病理学分期概念，判断依据是浸润深度，而不是肿块大小、淋巴结状态或是否达浆膜。只要癌组织限于黏膜或黏膜下层，即属早期胃癌；若浸润至肌层及更深，则属进展期胃癌。本题题眼是“诊断标准=浸润深度”，故E正确。\n选项分析：\nA. 错误：癌肿大小不是早期胃癌诊断标准；直径大小只用于描述小胃癌、微小胃癌等，不能据此分期。早期胃癌可大可小。\nB. 错误：局部淋巴结无转移不是诊断早期胃癌的必要条件；早期胃癌，尤其黏膜下癌，仍可发生淋巴结转移，有无转移影响预后和分期，但不是定义标准。\nC. 错误：癌肿浸润深达肌层已超过黏膜下层，属于进展期胃癌，不是早期胃癌。\nD. 错误：癌肿浸润未超过浆膜层范围过宽，可包括浸润肌层甚至更深但仍未穿透浆膜的进展期胃癌，不能作为早期胃癌标准。\nE. 正确：瘤组织浸润仅限于黏膜或黏膜下层，符合早期胃癌的病理学定义，是本题标准答案。\n易混点：早期胃癌强调“浸润深度未超过黏膜下层”，不是“胃癌早期临床表现”，也不等于无淋巴结转移；小胃癌、微小胃癌是按直径描述，不能替代早期胃癌定义。记忆要点：早期胃癌看深度，不看大小，不看淋巴结。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-2a-single-0212","type":"single","typeLabel":"单选题","number":212,"question":"干酪样肺炎通常是由于急性或慢性结核性空洞内的细菌通过以下哪个途径播散所致","options":[{"key":"A","text":"肺门淋巴结"},{"key":"B","text":"支气管"},{"key":"C","text":"肺动脉"},{"key":"D","text":"胸膜腔"},{"key":"E","text":"肺静脉"}],"answerKeys":["B"],"answerText":["支气管"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：急性或慢性结核性空洞内结核分枝杆菌经支气管播散，引起干酪样肺炎。\n解析：干酪样肺炎多继发于肺结核空洞，空洞内的干酪样坏死物质含大量结核分枝杆菌，可随痰液经支气管树播散至同侧或对侧肺组织，形成小叶性或大叶性干酪样肺炎。病变区肺泡腔内大量浆液、纤维素渗出，伴巨噬细胞及干酪样坏死，抗酸染色常易查见结核分枝杆菌。题眼是“空洞内细菌播散”，强调沿支气管途径，而非血行播散。\n选项分析：\nA. 错误：肺门淋巴结途径属于淋巴道播散，主要引起淋巴结结核，可致肺门淋巴结肿大，但不是空洞内细菌播散形成干酪样肺炎的通常通道。\nB. 正确：空洞内干酪样坏死物含菌，经支气管播散沿支气管树分布，是干酪样肺炎的典型发生途径，常形成小叶性干酪样肺炎，也可融合成较大实变区。\nC. 错误：肺动脉属于血行播散途径，结核分枝杆菌经肺动脉进入肺内主要引起粟粒性肺结核，表现为肺内弥漫均匀粟粒结节，不是沿支气管分布的干酪样肺炎。\nD. 错误：胸膜腔播散主要引起结核性胸膜炎，表现为胸膜渗出、纤维素沉着或胸膜增厚，不是肺实质干酪样肺炎。\nE. 错误：肺静脉属于血行播散途径，细菌可经肺静脉进入体循环，引起全身粟粒性结核等肺外播散，不是空洞内容物在肺内形成干酪样肺炎的主要途径。\n易混点：支气管播散与血行播散要分清：经支气管播散多见于空洞性肺结核，病变沿支气管分布，可形成干酪样肺炎；经肺动脉血行播散形成肺粟粒性结核，结节分布均匀。记忆要点：空洞痰菌沿“支气管”下行播散；动脉入肺、静脉出肺，血行播散多为粟粒性病变。","chapter":18,"chapterName":"传染病","chapterTitle":"第18章 传染病"},{"id":"pathology-2a-single-0213","type":"single","typeLabel":"单选题","number":213,"question":"急进型高血压时，增生性小动脉硬化及坏死性细动脉炎主要发生于","options":[{"key":"A","text":"大脑"},{"key":"B","text":"肾"},{"key":"C","text":"心"},{"key":"D","text":"肾上腺"},{"key":"E","text":"脾"}],"answerKeys":["B"],"answerText":["肾"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：急进型高血压主要累及肾入球小动脉，引起坏死性细动脉炎和增生性小动脉硬化。\n解析：急进型高血压又称恶性高血压，舒张压显著升高，小动脉壁发生纤维素样坏死，即坏死性细动脉炎；同时平滑肌细胞增生、胶原沉积，管壁呈“洋葱皮样”增厚，即增生性小动脉硬化。病变主要累及肾入球小动脉和肾小球，临床上可出现蛋白尿、血尿及急性肾功能衰竭。本题题眼是“急进型高血压”和“主要发生部位”，标准答案为肾。\n选项分析：\nA. 错误：脑是高血压的重要靶器官，急进型高血压可引起高血压脑病、脑出血和微动脉瘤形成，但坏死性细动脉炎及增生性小动脉硬化主要不在脑。\nB. 正确：肾入球小动脉是急进型高血压最特征性的受累部位，可发生纤维素样坏死和洋葱皮样增生，导致肾小球缺血、坏死及急性肾功能损害。\nC. 错误：心脏在高血压时主要发生左心室向心性肥大、心肌劳损和心力衰竭，并非坏死性细动脉炎和增生性小动脉硬化的主要部位。\nD. 错误：肾上腺不是高血压的典型靶器官；肾上腺病变如嗜铬细胞瘤可引起继发性高血压，但本题所问的细动脉病变不主要发生于肾上腺。\nE. 错误：脾不是高血压的主要靶器官，脾小动脉可随全身动脉硬化受累，但不符合急进型高血压特征性细动脉炎的主要发生部位。\n易混点：良性高血压的细动脉病变以玻璃样变为主，常累及肾入球小动脉、视网膜和脑；急进型高血压则以纤维素样坏死和洋葱皮样增生为特征，肾最典型。记忆要点：急进型高血压看肾入球小动脉，坏死加洋葱皮。","chapter":9,"chapterName":"心血管系统疾病","chapterTitle":"第9章 心血管系统疾病"},{"id":"pathology-2a-single-0214","type":"single","typeLabel":"单选题","number":214,"question":"肝脏上有一转移瘤，镜下表现如图，肝外最可能的原发部位是","options":[{"key":"A","text":"食管"},{"key":"B","text":"膀胱"},{"key":"C","text":"结肠"},{"key":"D","text":"股骨"},{"key":"E","text":"小脑"}],"answerKeys":["C"],"answerText":["结肠"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：肝脏转移性肿瘤多经门静脉播散，消化系统尤其是结直肠癌是最常见的肝外原发来源之一。\n解析：题目图片未提供，以下仅依据文字信息分析。肝脏是腹腔脏器恶性肿瘤最常见的转移部位，结肠静脉血经门静脉回流至肝，因此结肠癌容易发生肝转移，且常为多发性结节。镜下若见腺癌结构（腺管样排列、细胞异型、核分裂及坏死），应首先考虑结直肠腺癌肝转移。题眼是“肝转移瘤”结合“最可能原发部位”，应想到门静脉引流途径及结直肠癌的器官转移规律。\n选项分析：\nA. 错误：食管癌可发生肝转移，但食管癌以淋巴道转移较突出，下段食管虽可经胃左静脉入门脉系统，但总体肝转移概率和常见程度低于结直肠癌；且本题问“最可能”，结肠更符合门静脉转移规律。\nB. 错误：膀胱癌主要经淋巴道及血行转移，常见转移至盆腔淋巴结、肺、骨等，肝转移相对少见，不是肝转移瘤的首选原发部位。\nC. 正确：结肠癌经门静脉转移至肝，肝是最常见远处转移部位之一；转移性结直肠腺癌在肝内常形成边界较清楚的癌结节，镜下可见腺癌结构，符合本题题意。\nD. 错误：股骨为骨组织，原发恶性肿瘤如骨肉瘤、软骨肉瘤等主要经血行转移至肺，转移至肝较少见；股骨不是肝脏转移瘤的常见原发部位。\nE. 错误：小脑原发肿瘤如髓母细胞瘤、毛细胞型星形细胞瘤等，主要沿脑脊液或局部浸润，颅外肝转移罕见；小脑也不是肝转移瘤的常见来源。\n易混点：肝内转移性腺癌需与原发性肝细胞癌、肝内胆管癌鉴别。记忆要点：肝转移瘤多来自门静脉引流区，结直肠癌、胃癌、胰腺癌是重点；原发性肝细胞癌常有肝硬化背景和AFP升高，转移性结直肠癌常有腺癌结构和结直肠癌病史。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病","needsImage":true},{"id":"pathology-2a-single-0215","type":"single","typeLabel":"单选题","number":215,"question":"慢性支气管炎的病变性质是","options":[{"key":"A","text":"慢性特异性炎症"},{"key":"B","text":"慢性非特异性炎症"},{"key":"C","text":"急性浆液性炎症"},{"key":"D","text":"急性出血性炎症"},{"key":"E","text":"急性化脓性炎症"}],"answerKeys":["B"],"answerText":["慢性非特异性炎症"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：慢性支气管炎属于支气管黏膜及其周围组织的慢性非特异性炎症，并伴腺体增生、黏液分泌增多及气道重构。\n解析：慢性支气管炎的病理学本质是长期反复刺激引起的慢性非特异性炎症，主要累及支气管及细支气管，镜下可见黏膜上皮变性、坏死、纤毛倒伏脱落，杯状细胞增生，黏膜下腺体肥大增生，炎症细胞浸润及纤维组织增生。临床以长期咳嗽、咳痰或伴喘息为特征，诊断常参考每年咳嗽咳痰持续3个月以上、连续2年及以上。本题题眼是“慢性”和“非特异性”，故不能选急性炎症或特异性炎症。\n\n选项分析：\nA. 错误：慢性特异性炎症常见于结核、梅毒等，具有特定病原及肉芽肿等特征，不是慢性支气管炎的病变性质。\nB. 正确：慢性支气管炎是慢性非特异性炎症，伴黏膜上皮损伤、杯状细胞增生、腺体肥大和慢性炎症细胞浸润，符合其病变本质。\nC. 错误：急性浆液性炎症属于急性渗出性炎症，常见于急性炎症早期，不是慢性支气管炎的慢性非特异性炎症。\nD. 错误：急性出血性炎症以明显出血性渗出为特点，见于某些严重感染或中毒等，不是慢性支气管炎的基本病变。\nE. 错误：急性化脓性炎症以大量中性粒细胞和脓性渗出为特点；慢性支气管炎急性加重时可合并化脓性炎，但其基本病变性质仍为慢性非特异性炎症。\n\n易混点：慢性支气管炎与急性支气管炎都可为非特异性炎症，但前者强调长期慢性过程及腺体增生、黏液高分泌和气道重构；急性加重期出现脓痰提示合并化脓性炎，不可据此将基本病变性质改为急性化脓性炎症。","chapter":10,"chapterName":"呼吸系统疾病","chapterTitle":"第10章 呼吸系统疾病"},{"id":"pathology-2a-single-0216","type":"single","typeLabel":"单选题","number":216,"question":"甲状腺恶性肿瘤中生长慢，恶性程度低，发病率最高的是","options":[{"key":"A","text":"滤泡性癌"},{"key":"B","text":"乳头状腺癌"},{"key":"C","text":"髓样癌"},{"key":"D","text":"未分化癌"},{"key":"E","text":"肉瘤"}],"answerKeys":["B"],"answerText":["乳头状腺癌"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n\n核心考点：甲状腺乳头状癌是甲状腺恶性肿瘤中发病率最高、分化较好、生长较慢且总体预后较好的类型。\n\n解析：甲状腺乳头状癌约占甲状腺癌的60%～80%，常表现为无痛性甲状腺结节，易经淋巴道转移至颈部淋巴结，但淋巴结转移对总体预后影响相对较小。镜下典型特征为乳头状结构、细胞核呈毛玻璃样、可见核沟和核内假包涵体，间质内可有砂粒体。题眼是“发病率最高＋生长慢、恶性程度低”，指向分化型甲状腺癌中的乳头状癌。\n\n选项分析：\nA. 错误：滤泡性癌是甲状腺癌中较常见类型，但发病率低于乳头状癌；其诊断依赖包膜或血管侵犯，主要经血道转移至骨、肺，侵袭性通常略高于乳头状癌。\nB. 正确：乳头状癌最常见，分化较好、生长缓慢，虽常伴颈部淋巴结转移，但总体恶性程度较低、预后较好，符合题干全部限定。\nC. 错误：髓样癌来源于滤泡旁C细胞，可分泌降钙素，部分与MEN2相关，间质可有淀粉样物；其恶性程度和预后不同于乳头状癌，且发病率不高。\nD. 错误：未分化癌多见于老年人，生长迅速、高度恶性、早期转移，预后极差，与“生长慢、恶性程度低”相反。\nE. 错误：肉瘤为间叶来源恶性肿瘤，甲状腺原发肉瘤极罕见；甲状腺恶性肿瘤绝大多数为上皮来源的癌，肉瘤不符合“发病率最高”。\n\n易混点：乳头状癌与滤泡性癌均属分化型甲状腺癌，但乳头状癌有毛玻璃核、核沟、假包涵体和砂粒体，主要经淋巴道转移；滤泡性癌诊断关键是包膜或血管侵犯，主要经血道转移。记忆要点：甲状腺癌最常见是乳头状癌，预后最差是未分化癌，髓样癌找降钙素和淀粉样间质。","chapter":15,"chapterName":"内分泌系统疾病","chapterTitle":"第15章 内分泌系统疾病"},{"id":"pathology-2a-single-0217","type":"single","typeLabel":"单选题","number":217,"question":"急性重症肝炎肝细胞常见而普遍的病变是","options":[{"key":"A","text":"坏死"},{"key":"B","text":"变性"},{"key":"C","text":"再生"},{"key":"D","text":"萎缩"},{"key":"E","text":"化生"}],"answerKeys":["A"],"answerText":["坏死"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：A\n核心考点：急性重症肝炎（急性重型肝炎/暴发型肝炎）以肝细胞大范围坏死为基本、常见而普遍的病变。\n解析：急性重症肝炎多由肝炎病毒（尤其是乙型肝炎病毒）或药物等引起，病变特点是肝细胞发生大块或亚大块坏死，坏死常从小叶中央区开始并迅速融合，累及多数肝小叶，导致肝细胞功能急剧丧失。临床上可出现黄疸迅速加深、凝血功能障碍、肝性脑病和肝功能衰竭。本题题眼是“急性重症”和“常见而普遍”，强调其核心病变为坏死，而不是一般变性。\n选项分析：\nA. 正确：急性重症肝炎最特征、最普遍的病变是肝细胞大范围坏死，可呈大块或亚大块坏死，并伴出血和炎症细胞浸润。\nB. 错误：变性如水样变、脂肪变等多见于较轻的肝细胞损伤，急性重症肝炎虽可伴细胞肿胀等改变，但不能概括其常见而普遍的严重病变，核心仍是坏死。\nC. 错误：急性重症肝炎可见肝细胞再生，但常因广泛坏死和肝功能衰竭而不明显，不是最常见、最普遍的病变；结节状再生更常见于亚急性重型肝炎等。\nD. 错误：萎缩多见于慢性肝病晚期、肝内胆管阻塞或受压等，急性重症肝炎不以肝细胞萎缩为突出表现。\nE. 错误：化生是分化成熟组织转变为另一种成熟组织，如胆管上皮化生等，并非急性重症肝炎肝细胞的主要病变。\n易混点：急性重型肝炎以广泛肝细胞坏死为主，再生较轻；亚急性重型肝炎则在大块坏死基础上出现明显结节状肝细胞再生。记忆要点：急性重症肝炎“坏死突出、再生不足”，易发生肝功能衰竭。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-2a-single-0218","type":"single","typeLabel":"单选题","number":218,"question":"左心衰竭病人的股静脉血栓脱落可引起","options":[{"key":"A","text":"肺凝固性坏死"},{"key":"B","text":"肺液化性坏死"},{"key":"C","text":"肺出血性梗死"},{"key":"D","text":"肺贫血性梗死"},{"key":"E","text":"心肌梗死"}],"answerKeys":["C"],"answerText":["肺出血性梗死"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：左心衰竭所致肺淤血背景下，股静脉血栓脱落引起肺动脉栓塞，易形成肺出血性梗死。\n解析：股静脉血栓脱落后随静脉血流经下腔静脉、右心进入肺动脉，阻塞肺动脉分支。左心衰竭时肺静脉压升高、肺淤血，肺内支气管动脉侧支循环受阻，栓塞后可发生梗死；因肺组织疏松、具双重血供且存在严重淤血，梗死灶内大量红细胞渗出，故为暗红色出血性梗死。题眼是“左心衰竭”提示肺淤血，肺栓塞合并肺淤血时典型表现为肺出血性梗死。\n选项分析：\nA. 错误：肺凝固性坏死并非本题所问的梗死类型；单纯凝固性坏死多见于脾、肾、心肌梗死，肺栓塞在肺淤血基础上应表现为出血性梗死。\nB. 错误：肺液化性坏死多见于脑梗死、化脓性感染等，肺栓塞所致梗死不是液化性坏死。\nC. 正确：股静脉血栓经右心进入肺动脉造成栓塞，左心衰竭引起的肺淤血使肺组织易发生出血性梗死，梗死灶暗红、楔形，基底靠近胸膜。\nD. 错误：贫血性梗死多见于脾、肾、心肌等组织致密、侧支循环少且无明显淤血的器官；肺有肺动脉和支气管动脉双重供血，且本例有肺淤血，故不发生典型贫血性梗死。\nE. 错误：股静脉栓子进入肺循环，不进入体循环冠状动脉；心肌梗死主要与冠状动脉粥样硬化、血栓形成等有关。\n易混点：肺梗死因肺淤血和双重血供而呈出血性梗死；脾、肾、心肌梗死多呈贫血性梗死。记忆要点：有严重淤血、组织疏松、双重血供的器官（肺、肠）易发生出血性梗死。","chapter":3,"chapterName":"局部血液循环障碍","chapterTitle":"第3章 局部血液循环障碍"},{"id":"pathology-2a-single-0219","type":"single","typeLabel":"单选题","number":219,"question":"IgA肾病的最显著特点是","options":[{"key":"A","text":"血清IgA水平增高"},{"key":"B","text":"复发性血尿"},{"key":"C","text":"弥漫性系膜增多"},{"key":"D","text":"系膜区IgA沉积"},{"key":"E","text":"血清C3下降"}],"answerKeys":["D"],"answerText":["系膜区IgA沉积"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：IgA肾病是以系膜区IgA沉积为特征的原发性肾小球疾病，免疫病理检查是确诊依据。\n解析：IgA肾病又名Berger病，最显著的病理特点是免疫荧光见IgA（常伴C3）呈颗粒状沉积于肾小球系膜区，因此诊断依赖免疫病理。临床上常表现为反复发作性肉眼血尿或持续性镜下血尿，但“复发性血尿”是临床表现，不是最显著的特异性病理特点。光镜下可见系膜细胞和基质增生，但程度不一，可局灶、节段甚至光镜基本正常，故不如系膜区IgA沉积特异。题眼在“最显著特点”，应选免疫病理学标志。\n\n选项分析：\nA. 错误：部分患者血清IgA水平可增高，但并非诊断依据，也不特异，肝硬化、HIV感染等也可升高。\nB. 错误：复发性血尿是IgA肾病常见临床表现，但其他肾小球疾病也可出现，不能作为最显著的特异性特点。\nC. 错误：弥漫性系膜增多属于光镜下系膜增生性改变，可见于多种系膜增生性肾小球肾炎；IgA肾病增生程度和分布可不一致，特异性不足。\nD. 正确：系膜区IgA沉积是IgA肾病最关键、最特异的免疫病理特点，常伴C3沉积，是确诊依据。\nE. 错误：IgA肾病血清补体C3多正常；血清C3下降更常见于急性链球菌感染后肾小球肾炎、膜增生性肾小球肾炎等。\n\n易混点：过敏性紫癜性肾炎也可有系膜区IgA沉积，但伴有紫癜、关节痛、腹痛等系统表现；IgA肾病主要是肾脏受累。单纯血尿还需与薄基底膜肾病鉴别，后者免疫荧光阴性、基底膜变薄，而IgA肾病以系膜区IgA沉积为记忆要点。","chapter":13,"chapterName":"泌尿系统疾病","chapterTitle":"第13章 泌尿系统疾病"},{"id":"pathology-2a-single-0220","type":"single","typeLabel":"单选题","number":220,"question":"下列哪项是发生干性坏疽的条件","options":[{"key":"A","text":"发生于肺或子宫等内脏"},{"key":"B","text":"有明显的腐败菌感染"},{"key":"C","text":"全身中毒症状严重"},{"key":"D","text":"病变部分较干燥，腐败菌感染较轻"},{"key":"E","text":"病灶内坏死组织分界，产生大量气体"}],"answerKeys":["D"],"answerText":["病变部分较干燥，腐败菌感染较轻"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：干性坏疽的发生条件及形态学特点，即坏死组织水分少、干燥皱缩、腐败菌感染轻。\n解析：干性坏疽多发生于四肢末端，常见于动脉阻塞而静脉回流仍相对通畅时。坏死组织因水分蒸发而干燥、皱缩、呈黑褐色，腐败菌感染较轻，病变与健康组织之间分界清楚。题眼是“干性”与“腐败菌感染较轻”，说明其发生条件不同于湿性坏疽。\n选项分析：\nA. 错误：肺、子宫等内脏器官多与外界相通，坏死组织含水分多，易合并腐败菌感染，通常形成湿性坏疽，而不是干性坏疽。\nB. 错误：有明显的腐败菌感染是湿性坏疽的重要特点，腐败菌大量繁殖使坏死组织湿软、恶臭，并可产生全身中毒症状。\nC. 错误：全身中毒症状严重多见于湿性坏疽或气性坏疽，因为腐败菌或厌氧菌大量繁殖并产生毒素；干性坏疽全身中毒症状一般较轻。\nD. 正确：病变部分较干燥、腐败菌感染较轻，符合干性坏疽的形成条件。干性坏疽好发于四肢末端，动脉阻塞后坏死组织水分蒸发，腐败菌不易大量繁殖，故干燥皱缩、分界清楚。\nE. 错误：干性坏疽可有坏死组织与健康组织分界清楚，但不会产生大量气体；“产生大量气体”是气性坏疽的特点，常由产气荚膜梭菌等厌氧菌感染引起。\n易混点：干性坏疽关键词是“四肢末端、干燥皱缩、腐败菌轻、分界清”；湿性坏疽关键词是“内脏或与外界相通、湿润、腐败菌重、中毒明显”；气性坏疽关键词是“深部创伤、厌氧菌、大量气体、捻发感”。记忆时抓住“干—轻—清，湿—重—毒，气—产气”。","chapter":1,"chapterName":"细胞和组织的适应与损伤","chapterTitle":"第1章 细胞和组织的适应与损伤"},{"id":"pathology-2a-single-0221","type":"single","typeLabel":"单选题","number":221,"question":"直肠癌最常见的症状是","options":[{"key":"A","text":"肠梗阻"},{"key":"B","text":"体重减轻"},{"key":"C","text":"贫血"},{"key":"D","text":"大便习惯改变"},{"key":"E","text":"黏液血便"}],"answerKeys":["E"],"answerText":["黏液血便"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n核心考点：直肠癌的临床表现，尤其以便血/黏液血便为最常见首发或就诊症状。\n解析：直肠癌好发于直肠中下段，肿瘤向肠腔生长并发生表面溃烂、出血及黏液分泌，粪便通过时刺激病灶，故常出现黏液血便或血便，是本题题眼。便血可为鲜红色或暗红色，常混有黏液，易被误诊为痔或痢疾。考试中直肠癌“最常见症状”优先选黏液血便；排便习惯改变也很常见，但标准答案以黏液血便为准。\n选项分析：\nA. 错误：肠梗阻多见于肿瘤逐渐增大导致肠腔狭窄的较晚期，尤其是左半结肠癌，并非直肠癌最常见症状。\nB. 错误：体重减轻属于恶性肿瘤消耗性全身表现，可见于晚期，缺乏定位特异性，不是最常见症状。\nC. 错误：贫血常由慢性失血引起，可见于右半结肠癌或病程较长者，不是直肠癌最突出的常见症状。\nD. 错误：大便习惯改变（排便次数增多、里急后重、便秘与腹泻交替等）是直肠癌常见表现之一，但本题标准答案为黏液血便，需注意其虽常见但不是本题所问“最常见”。\nE. 正确：直肠癌表面溃烂出血并伴黏液分泌，血液和黏液随粪便排出，故黏液血便最常见，也是患者就诊的重要原因。\n易混点：痔也可出现便血，但多为便后滴血、鲜血附着于粪便表面；直肠癌便血常混有黏液，并可伴里急后重、排便习惯改变。记忆要点：直肠癌“黏液血便”最突出，左半结肠癌易梗阻，右半结肠癌易贫血和腹部包块。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-2a-single-0222","type":"single","typeLabel":"单选题","number":222,"question":"主动脉粥样硬化巨检如图，镜下观如图所示，该病变最佳名称为","options":[{"key":"A","text":"脂纹"},{"key":"B","text":"纤维斑块"},{"key":"C","text":"粥样斑块"},{"key":"D","text":"粥瘤性溃疡"},{"key":"E","text":"动脉瘤形成"}],"answerKeys":["D"],"answerText":["粥瘤性溃疡"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：粥样斑块纤维帽破裂、内膜破溃形成溃疡性病变，即粥瘤性溃疡。\n解析：题目图片未提供，仅依据文字信息分析。主动脉粥样硬化进展到粥样斑块后，若纤维帽破裂、内膜面破溃，坏死粥样物暴露于血流，即形成粥瘤性溃疡。镜下可见纤维帽断裂、内膜缺损，其下为含胆固醇结晶、坏死碎屑和泡沫细胞的粥样坏死核心，并可伴炎症细胞浸润、血栓形成或钙化。本题题眼是“病变最佳名称”，应以斑块是否破溃定名：已破溃者为粥瘤性溃疡，而非单纯粥样斑块。临床可继发血栓栓塞、出血和动脉瘤形成等。\n选项分析：\nA. 错误：脂纹是动脉粥样硬化早期病变，为内膜平坦或略隆起的黄色条纹，主要由泡沫细胞和脂质构成，无纤维帽破裂和溃疡形成。\nB. 错误：纤维斑块为较早期斑块，表面有纤维帽覆盖，灰白色隆起，尚未形成明显粥样坏死核心破溃，故不是最佳名称。\nC. 错误：粥样斑块虽有纤维帽、脂质坏死核心、胆固醇结晶和钙化，但内膜面通常完整；本题所示病变已破溃，故不能仅称粥样斑块。\nD. 正确：粥瘤性溃疡是粥样斑块纤维帽破裂、内膜破溃所致，坏死核心暴露，是主动脉粥样硬化的重要复合病变，符合题意。\nE. 错误：动脉瘤形成是动脉粥样硬化导致管壁薄弱后发生的扩张性并发症，属于后果或并发症名称，不是图中斑块破溃病变本身的最佳名称。\n易混点：粥样斑块与粥瘤性溃疡的关键区别在于纤维帽是否完整、内膜是否破溃；前者完整，后者破溃。动脉瘤形成强调管壁扩张，可继发于溃疡性斑块，但不能代替“溃疡”这一病变名称。记忆要点：脂纹最早、纤维斑块有帽、粥样斑块有坏死核心、破溃即成粥瘤性溃疡。","chapter":9,"chapterName":"心血管系统疾病","chapterTitle":"第9章 心血管系统疾病","needsImage":true},{"id":"pathology-2a-single-0223","type":"single","typeLabel":"单选题","number":223,"question":"最常见的栓子是","options":[{"key":"A","text":"脱落的肿瘤细胞团"},{"key":"B","text":"空气"},{"key":"C","text":"血栓"},{"key":"D","text":"羊水"},{"key":"E","text":"寄生虫"}],"answerKeys":["C"],"answerText":["血栓"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n\n核心考点：栓塞的类型及各类栓子的常见程度，血栓栓子是最常见的栓子。\n\n解析：栓子是指随血流运行并阻塞血管腔的异常物质。血栓形成后，若血栓部分或全部脱落，即成为血栓栓子，随静脉血流回流至右心后常引起肺栓塞；若来自左心或动脉系统，则可引起脑、脾、肾、下肢等体循环动脉栓塞。临床上栓塞中最常见的就是血栓栓子，因此本题题眼在“最常见”。\n\n选项分析：\nA. 错误：脱落的肿瘤细胞团属于肿瘤栓子，恶性肿瘤侵袭血管后可脱落并随血流转移，形成转移瘤，但发生率远低于血栓栓子，不是最常见的栓子。\nB. 错误：空气属于气体栓子，常见于静脉损伤、手术、输液等情况下空气进入血流，少量可被吸收，大量可阻塞肺循环，但临床少见，不是最常见类型。\nC. 正确：血栓脱落后形成血栓栓子，可随血流阻塞相应血管，是临床最常见的栓塞类型；下肢深静脉血栓脱落是肺栓塞的常见来源，左心附壁血栓脱落可引起体循环动脉栓塞。\nD. 错误：羊水属于羊水栓子，见于分娩过程中羊水成分进入母体血液循环，引起羊水栓塞，可导致休克、DIC和呼吸衰竭，病情危重但发生率低，不是最常见栓子。\nE. 错误：寄生虫或虫卵可成为寄生虫性栓子，如血吸虫虫卵可栓塞门静脉分支等，但属于少见类型，不是最常见栓子。\n\n易混点：血栓形成是活体心血管内血液凝固形成固体质块，栓塞则是栓子随血流运行阻塞血管；血栓栓子最常见，但肺栓塞的栓子多来自下肢深静脉血栓脱落，左心附壁血栓脱落则多引起体循环动脉栓塞。记忆要点：栓子种类虽多，考试中“最常见”选血栓。","chapter":3,"chapterName":"局部血液循环障碍","chapterTitle":"第3章 局部血液循环障碍"},{"id":"pathology-2a-single-0224","type":"single","typeLabel":"单选题","number":224,"question":"在我国引起肺源性心脏病最常见的疾病是","options":[{"key":"A","text":"肺结核"},{"key":"B","text":"硅沉着症"},{"key":"C","text":"支气管哮喘"},{"key":"D","text":"支气管扩张症"},{"key":"E","text":"慢性支气管炎伴肺气肿"}],"answerKeys":["E"],"answerText":["慢性支气管炎伴肺气肿"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n核心考点：肺源性心脏病的病因在我国以慢性支气管炎伴肺气肿最常见。\n解析：肺源性心脏病是由肺组织、肺血管或胸廓疾病引起肺循环阻力增加、肺动脉高压，进而导致右心室肥厚、扩张甚至右心衰竭的疾病。在我国，慢性支气管炎反复发作可并发阻塞性肺气肿，造成肺通气和换气功能障碍，长期缺氧引起肺小动脉痉挛及肺血管床减少，肺循环阻力升高，最终形成肺动脉高压和右心室肥厚。题眼是“我国”和“最常见”，应选慢性支气管炎伴肺气肿。\n选项分析：\nA. 错误：肺结核可引起肺纤维化、肺组织破坏和肺血管床减少，导致继发性肺动脉高压，是肺心病的病因之一，但并非我国最常见病因。\nB. 错误：硅沉着症（矽肺）可引起肺弥漫性纤维化和肺血管床减少，导致肺动脉高压和肺心病，但属于职业性尘肺，不是我国肺心病最常见病因。\nC. 错误：支气管哮喘可因反复气道炎症、气道重构及通气障碍引起缺氧和肺动脉高压，但通常不是我国肺心病最常见的基础疾病。\nD. 错误：支气管扩张症反复感染和肺纤维化可损害肺血管床，晚期可引起肺动脉高压和肺心病，但发病率及导致肺心病的常见程度不及慢性支气管炎伴肺气肿。\nE. 正确：慢性支气管炎伴肺气肿是我国肺源性心脏病最常见的病因，长期小气道阻塞、缺氧性肺血管收缩及肺血管床减少共同导致肺动脉高压，进而引起右心室肥厚、扩张。\n易混点：肺心病病因可分为支气管肺疾病、肺血管疾病、胸廓运动和神经肌肉疾病等；我国考试中首选“慢性支气管炎并发肺气肿”，不要误选肺结核或硅沉着症。病理联系记忆为“慢性气道阻塞—缺氧—肺小动脉痉挛—肺动脉高压—右心室肥厚”。","chapter":10,"chapterName":"呼吸系统疾病","chapterTitle":"第10章 呼吸系统疾病"},{"id":"pathology-2a-single-0225","type":"single","typeLabel":"单选题","number":225,"question":"早期胃癌是指","options":[{"key":"A","text":"仅限于黏膜下层以内"},{"key":"B","text":"仅限于肌层以内"},{"key":"C","text":"仅限于浆膜以内"},{"key":"D","text":"仅限于局部淋巴结转移"},{"key":"E","text":"仅限于扩散至邻近器官"}],"answerKeys":["A"],"answerText":["仅限于黏膜下层以内"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：A\n核心考点：早期胃癌的定义是癌组织浸润深度限于黏膜层或黏膜下层，无论有无局部淋巴结转移。\n解析：胃癌的“早期”是按浸润深度判断，而不是按有无淋巴结转移或肿瘤大小判断。癌组织仅累及黏膜层、黏膜下层，未突破黏膜下层进入肌层时，称为早期胃癌；若浸润至肌层或更深，则为进展期胃癌。早期胃癌可伴局部淋巴结转移，因此不能把“无淋巴结转移”作为必要条件。题目题眼是“浸润深度限于黏膜下层以内”。\n选项分析：\nA. 正确：癌组织限于黏膜层或黏膜下层，未侵犯肌层，符合早期胃癌定义，且无论是否存在局部淋巴结转移均属早期胃癌。\nB. 错误：限于肌层以内包括浸润至肌层，已超过黏膜下层，属于进展期胃癌，不是早期胃癌。\nC. 错误：仅限于浆膜以内范围过宽，可包括肌层、浆膜下层等深部浸润，已不属于早期胃癌；若侵及浆膜或浆膜外则更属晚期。\nD. 错误：局限淋巴结转移不是早期胃癌的定义标准；早期胃癌可以发生局部淋巴结转移，而进展期胃癌也可有淋巴结转移，故不能以“仅限局部淋巴结转移”界定。\nE. 错误：扩散至邻近器官说明癌已穿透胃壁并直接蔓延，属于晚期胃癌表现，绝非早期胃癌。\n易混点：早期胃癌与“小胃癌、微小胃癌”不同，后者按病灶大小命名，仍须结合浸润深度；早期胃癌也不等于“无淋巴结转移”。记忆要点：早期胃癌看深度——黏膜层或黏膜下层；一旦侵及肌层即进展期。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-2a-single-0226","type":"single","typeLabel":"单选题","number":226,"question":"下述均为急性链球菌感染后肾小球肾炎的特点，但除外","options":[{"key":"A","text":"多见于儿童"},{"key":"B","text":"明显血尿"},{"key":"C","text":"肾小球呈缺血状"},{"key":"D","text":"上皮下驼峰状电子致密物"},{"key":"E","text":"肾小球毛细血管内有链球菌菌栓"}],"answerKeys":["E"],"answerText":["肾小球毛细血管内有链球菌菌栓"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n核心考点：急性链球菌感染后肾小球肾炎是免疫复合物介导的弥漫性毛细血管内增生性肾小球肾炎，并非链球菌直接栓塞肾小球。\n解析：本病多见于儿童，常在链球菌感染后1～3周发生，临床表现为急性肾炎综合征，血尿明显，可呈肉眼血尿。病理上肾小球内皮细胞和系膜细胞增生，伴中性粒细胞浸润，毛细血管腔狭窄甚至闭塞，使肾小球呈缺血状；电镜下可见上皮下“驼峰状”电子致密物沉积。题眼是“除外”，即要找出不属于本病特点的选项，肾小球毛细血管内并无链球菌菌栓，病变由免疫复合物沉积引起。\n选项分析：\nA. 正确：本病好发于儿童，以6～10岁多见，属于急性链球菌感染后肾小球肾炎的流行病学特点。\nB. 正确：急性肾炎综合征以血尿为突出表现，常为首发症状，可呈镜下或肉眼血尿。\nC. 正确：肾小球毛细血管内皮细胞、系膜细胞增生及炎细胞浸润使管腔狭窄、闭塞，肾小球球丛呈缺血状。\nD. 正确：电镜下典型表现为基底膜上皮侧（足突与基底膜之间）驼峰状电子致密物，提示免疫复合物沉积。\nE. 错误：本病不是链球菌直接感染肾小球，肾小球毛细血管内无链球菌菌栓；其发生机制是链球菌抗原诱导的免疫复合物沉积并激活补体。\n易混点：急性链球菌感染后肾炎的“驼峰状”沉积位于上皮下，属于免疫复合物介导；若见毛细血管内菌栓应考虑感染性栓塞或感染性心内膜炎相关肾损害。记忆要点：链球菌感染后肾炎是“免疫沉积、无细菌”，不是“细菌栓塞”。","chapter":13,"chapterName":"泌尿系统疾病","chapterTitle":"第13章 泌尿系统疾病"},{"id":"pathology-2a-single-0227","type":"single","typeLabel":"单选题","number":227,"question":"染色体异常是肿瘤细胞的一大特征。如果一种异常的染色体较多地出现在某种肿瘤细胞内，就称为","options":[{"key":"A","text":"特异染色体"},{"key":"B","text":"特征染色体"},{"key":"C","text":"标记染色体"},{"key":"D","text":"干系染色体"},{"key":"E","text":"众数染色体"}],"answerKeys":["C"],"answerText":["标记染色体"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：标记染色体是指较恒定地出现在某种肿瘤细胞中的异常染色体，可作为该肿瘤的细胞遗传学标志。\n解析：肿瘤细胞常出现染色体数目和结构异常，其中某些异常染色体在某一类肿瘤中反复、较多出现，称为标记染色体。其病理学意义在于提示肿瘤的克隆性增生，并可为诊断、分型及靶向治疗提供线索，如慢性髓性白血病中的Ph染色体。本题题眼是“某种异常染色体较多地出现在某种肿瘤细胞内”，强调该异常染色体与特定肿瘤的关联性和相对恒定性，因此选标记染色体。\n\n选项分析：\nA. 错误：“特异染色体”不是肿瘤细胞遗传学的规范术语，不能准确表达某种异常染色体反复出现于特定肿瘤并作为标志的概念。\nB. 错误：“特征染色体”虽字面上接近“特征性异常”，但并非标准病理学名词；考试中该概念固定称为标记染色体。\nC. 正确：标记染色体是某种肿瘤细胞中较恒定出现的异常染色体，可代表肿瘤克隆的细胞遗传学特征，如Ph染色体与慢性髓性白血病相关。\nD. 错误：干系染色体指肿瘤细胞群体中占优势的细胞克隆所具有的染色体组成，强调优势克隆，而不是指某一种异常染色体作为该肿瘤的标志。\nE. 错误：众数染色体指细胞群体染色体数目分布中最常见的数目，属于染色体数目异常的描述，不表示某种异常染色体与特定肿瘤的标志关系。\n\n易混点：标记染色体强调“特定异常染色体与某肿瘤相关”，干系染色体强调“肿瘤细胞群中的优势克隆”，众数染色体强调“染色体数目的最常见值”。记忆要点：看到某种异常染色体反复出现在某肿瘤中，选标记染色体；看到肿瘤细胞群体占优势的核型，选干系。","chapter":6,"chapterName":"肿瘤","chapterTitle":"第6章 肿瘤"},{"id":"pathology-2a-single-0228","type":"single","typeLabel":"单选题","number":228,"question":"小叶性肺炎的病变范围","options":[{"key":"A","text":"以呼吸性细支气管为中心"},{"key":"B","text":"以终末细支管为中心"},{"key":"C","text":"以细支气管为中心"},{"key":"D","text":"以支气管为中心"},{"key":"E","text":"以肺泡管为中心"}],"answerKeys":["C"],"answerText":["以细支气管为中心"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：小叶性肺炎（支气管肺炎）是以细支气管为中心的化脓性炎症，病变呈小叶性分布。\n解析：小叶性肺炎又称支气管肺炎，多由细菌经支气管树下行播散引起。炎症起始并突出于细支气管，细支气管壁充血、水肿及中性粒细胞浸润，管腔和周围肺泡内出现脓性渗出物，形成以细支气管为中心、可累及多个肺泡的小叶性实变灶。病变常为双侧性，好发于两肺下叶及背侧，临床可有发热、咳嗽、脓痰和肺部湿啰音。本题题眼是“小叶性肺炎”的病变中心定位，即细支气管而非单纯肺泡或较大支气管。\n选项分析：\nA. 错误：以呼吸性细支气管为中心不是小叶性肺炎的典型定位。呼吸性细支气管属于细支气管的远端分支，病变可波及此处，但其中心定位于细支气管；该表述易与某些间质性或细支气管周围病变混淆。\nB. 错误：终末细支气管虽与小叶性肺炎的播散路径有关，但典型病变中心是细支气管。终末细支气管更强调气道终末段，不能替代“以细支气管为中心”的经典描述。\nC. 正确：小叶性肺炎的炎症以细支气管为中心，细支气管壁及周围肺泡发生化脓性炎，形成小叶性实变，这是本病的病理学标志。\nD. 错误：以支气管为中心常见于慢性支气管炎等病变；小叶性肺炎累及的是较小气道的细支气管，而不是以较大支气管为中心。\nE. 错误：以肺泡管为中心不符合小叶性肺炎。肺泡管受累可见于炎症向肺泡蔓延时，但中心病变仍在细支气管；以大叶性肺炎为代表的肺泡性炎变更强调肺泡内弥漫性渗出。\n易混点：大叶性肺炎以肺泡为中心、累及肺段或肺大叶，呈弥漫性肺泡内纤维素性炎；小叶性肺炎以细支气管为中心、呈小叶性化脓性实变。记忆要点：大叶性肺炎“肺泡为中心”，小叶性肺炎“细支气管为中心”。","chapter":10,"chapterName":"呼吸系统疾病","chapterTitle":"第10章 呼吸系统疾病"},{"id":"pathology-2a-single-0229","type":"single","typeLabel":"单选题","number":229,"question":"下列哪项不是变异型R-S细胞","options":[{"key":"A","text":"“爆米花”细胞"},{"key":"B","text":"多形性R-S细胞"},{"key":"C","text":"未分化R-S细胞"},{"key":"D","text":"陷窝细胞"},{"key":"E","text":"上皮样细胞"}],"answerKeys":["E"],"answerText":["上皮样细胞"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n核心考点：霍奇金淋巴瘤中R-S细胞及其变异型的形态学识别。\n解析：R-S细胞是霍奇金淋巴瘤的特征性肿瘤细胞，经典R-S细胞为双核或多核、核仁大而嗜酸性，周围常伴反应性炎细胞背景。变异型R-S细胞包括“爆米花”细胞、多形性R-S细胞、未分化R-S细胞和陷窝细胞等。本题题眼是“不是变异型R-S细胞”，上皮样细胞本质上是上皮样巨噬细胞/组织细胞，常见于结核、结节病等肉芽肿性病变，不属于R-S细胞变异型。\n\n选项分析：\nA. 正确：“爆米花”细胞即L&H细胞，是结节性淋巴细胞为主型霍奇金淋巴瘤的变异型R-S细胞，核分叶、核仁较小，形似爆米花，免疫表型常为CD20+、CD15-、CD30-。\nB. 正确：多形性R-S细胞属于变异型R-S细胞，细胞大小不一、核畸形明显，可见于经典型霍奇金淋巴瘤，尤其需与间变性大细胞淋巴瘤等鉴别。\nC. 正确：未分化R-S细胞属于R-S细胞的变异形态之一，细胞分化差、异型性明显；考试中应将其与“未分化癌”等概念区分，不能因名称含“未分化”就误判为上皮来源。\nD. 正确：陷窝细胞又称腔隙型R-S细胞，是结节硬化型经典型霍奇金淋巴瘤的典型变异型R-S细胞，胞质丰富、固定后收缩，与周围细胞间形成陷窝样空隙。\nE. 错误：上皮样细胞是上皮样巨噬细胞/组织细胞，见于肉芽肿性炎等病变，不是R-S细胞的变异型；霍奇金淋巴瘤背景中虽可见上皮样组织细胞反应，但不能将其归为R-S细胞。\n\n易混点：爆米花细胞属于结节性淋巴细胞为主型霍奇金淋巴瘤，常CD20+、CD15-、CD30-；陷窝细胞属于经典型霍奇金淋巴瘤结节硬化型，常CD15+、CD30+。上皮样细胞要与R-S细胞区分：前者核仁小、胞质丰富，常参与肉芽肿形成；后者核仁大而嗜酸，是霍奇金淋巴瘤的肿瘤细胞。","chapter":12,"chapterName":"淋巴造血系统疾病","chapterTitle":"第12章 淋巴造血系统疾病"},{"id":"pathology-2a-single-0230","type":"single","typeLabel":"单选题","number":230,"question":"大肠癌的好发部位依次是","options":[{"key":"A","text":"直肠、升结肠、降结肠、乙状结肠、横结肠"},{"key":"B","text":"直肠、乙状结肠、横结肠、升结肠、降结肠"},{"key":"C","text":"直肠、乙状结肠、盲肠、升结肠、横结肠、降结肠"},{"key":"D","text":"升结肠、横结肠、盲肠、降结肠、乙状结肠、直肠"},{"key":"E","text":"升结肠、降结肠、盲肠、横结肠、直肠、乙状结肠"}],"answerKeys":["C"],"answerText":["直肠、乙状结肠、盲肠、升结肠、横结肠、降结肠"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：大肠癌的好发部位及发生频率顺序。\n解析：大肠癌最好发于直肠，其次为乙状结肠，随后依次为盲肠、升结肠、横结肠、降结肠。其好发顺序与大肠各段肠内容物停留时间、致癌物作用时间及黏膜病变分布有关，考试题眼是“依次”二字，应选择完整且顺序正确的频率序列。C项完整列出直肠、乙状结肠、盲肠、升结肠、横结肠、降结肠，符合病理学常考结论。\n选项分析：\nA. 错误：把升结肠、降结肠排在乙状结肠之前，且横结肠置于最后，不符合大肠癌好发频率；升结肠并非第二好发部位。\nB. 错误：虽以直肠、乙状结肠开头，但随后把横结肠提前，遗漏盲肠，且升结肠、降结肠顺序亦不符合好发频率。\nC. 正确：直肠最常见，乙状结肠次之，其后为盲肠、升结肠、横结肠、降结肠，符合教材所述好发部位顺序。\nD. 错误：以升结肠为首，将右半结肠置于直肠之前，明显违背“直肠最多见”的基本规律；该顺序也不是大肠解剖顺序。\nE. 错误：同样把升结肠列为首位，并将直肠、乙状结肠后置，既不符合好发频率，也不符合大肠癌最常见于直肠、乙状结肠的临床病理特点。\n易混点：牢记“直乙盲升横降”这一好发频率顺序，不要与大肠解剖顺序“盲肠—升结肠—横结肠—降结肠—乙状结肠—直肠”混淆。另需区分右半结肠癌常以肿块型、贫血和腹部肿块为特点，左半结肠癌常以浸润型、便血和肠梗阻为特点。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-2a-single-0231","type":"single","typeLabel":"单选题","number":231,"question":"寄生虫感染引起的炎症，下列哪种细胞多见","options":[{"key":"A","text":"中性粒细胞"},{"key":"B","text":"嗜酸性粒细胞"},{"key":"C","text":"单核巨噬细胞"},{"key":"D","text":"淋巴细胞"},{"key":"E","text":"浆细胞"}],"answerKeys":["B"],"answerText":["嗜酸性粒细胞"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：寄生虫感染所致炎症中以嗜酸性粒细胞浸润为典型特征。\n解析：寄生虫感染，尤其是蠕虫感染时，机体常产生以IgE为主的体液免疫和Th2型免疫反应，肥大细胞脱颗粒并释放嗜酸性粒细胞趋化因子，吸引嗜酸性粒细胞从血液进入组织，故寄生虫性炎症中嗜酸性粒细胞多见。镜下可见嗜酸性粒细胞胞质内充满嗜酸性颗粒，常与肥大细胞、淋巴细胞等混合浸润；临床常伴外周血嗜酸性粒细胞增多。题眼是“寄生虫感染”与“嗜酸性粒细胞”的对应关系。\n选项分析：\nA. 错误：中性粒细胞主要见于急性化脓性炎，如金黄色葡萄球菌、链球菌等细菌感染，而不是寄生虫感染中最具特征性的炎症细胞。\nB. 正确：嗜酸性粒细胞是寄生虫感染尤其是蠕虫感染时最典型的浸润细胞，与IgE介导的Th2型免疫反应及嗜酸性粒细胞趋化因子有关。\nC. 错误：单核巨噬细胞主要见于慢性炎症、肉芽肿性炎、结核、真菌感染及异物反应等，虽可参与寄生虫周围慢性炎症，但不是本题最典型答案。\nD. 错误：淋巴细胞主要见于慢性炎症、病毒感染及免疫反应，寄生虫感染时也可出现，但不如嗜酸性粒细胞具有提示性。\nE. 错误：浆细胞主要见于慢性炎症和体液免疫活跃的病变，如梅毒、类风湿关节炎等，并非寄生虫感染炎症的最特征性细胞。\n易混点：寄生虫感染典型为嗜酸性粒细胞浸润；急性化脓性炎以中性粒细胞为主；慢性炎症常以淋巴细胞、浆细胞和单核巨噬细胞为主。记忆要点：寄生虫和过敏反应“嗜酸”，细菌化脓“中性”，慢性炎症“淋巴、浆细胞、巨噬细胞”。","chapter":4,"chapterName":"炎症","chapterTitle":"第4章 炎症"},{"id":"pathology-2a-single-0232","type":"single","typeLabel":"单选题","number":232,"question":"尿路梗阻或尿液排泄不畅所致的肾盂积水，肾实质发生的病变为","options":[{"key":"A","text":"营养不良性萎缩"},{"key":"B","text":"神经性萎缩"},{"key":"C","text":"失用性萎缩"},{"key":"D","text":"压迫性萎缩"},{"key":"E","text":"内分泌性萎缩"}],"answerKeys":["D"],"answerText":["压迫性萎缩"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：尿路梗阻所致肾盂积水引起肾实质的压迫性萎缩。\n解析：尿路梗阻或尿液排泄不畅时，尿液潴留使肾盂内压升高，形成肾盂积水。积水持续存在可机械性压迫肾实质，使肾组织受压、缺血缺氧、营养供应障碍，逐渐发生萎缩，故为压迫性萎缩。题眼是“尿路梗阻—肾盂积水—肾实质受压”。长期可表现为肾皮质变薄、肾实质减少，严重时影响肾功能。\n选项分析：\nA. 错误：营养不良性萎缩多因全身或局部营养供应不足，如慢性消耗性疾病、恶性肿瘤恶病质、长期饥饿等，并非尿路梗阻后肾盂积水的机械压迫所致。\nB. 错误：神经性萎缩是神经损伤后其支配的靶器官发生的萎缩，如脊髓灰质炎后肢体肌肉萎缩、面神经损伤后表情肌萎缩，与肾盂积水无关。\nC. 错误：失用性萎缩是组织器官长期功能活动减少所致，如骨折固定后肌肉萎缩、长期卧床肢体萎缩；肾盂积水主要通过压迫肾实质致病，不属于失用性萎缩。\nD. 正确：肾盂积水使肾盂内压增高并压迫肾实质，肾组织因长期受压、缺血缺氧而发生萎缩，符合压迫性萎缩。\nE. 错误：内分泌性萎缩是靶器官缺乏相应激素刺激所致，如垂体功能减退引起甲状腺、肾上腺、性腺萎缩，绝经后卵巢和子宫内膜萎缩，与尿路梗阻无关。\n易混点：压迫性萎缩与失用性萎缩都可表现为器官体积缩小，但压迫性萎缩有明确的机械压迫因素，如积水、肿瘤、囊肿压迫；失用性萎缩是功能负荷长期减少所致。记忆要点：肾盂积水压迫肾实质，选压迫性萎缩。","chapter":1,"chapterName":"细胞和组织的适应与损伤","chapterTitle":"第1章 细胞和组织的适应与损伤"},{"id":"pathology-2a-single-0233","type":"single","typeLabel":"单选题","number":233,"question":"与免疫复合物无关的肾小球肾炎是","options":[{"key":"A","text":"膜性肾炎"},{"key":"B","text":"急性肾炎"},{"key":"C","text":"微小病变病"},{"key":"D","text":"膜性增生性肾炎"},{"key":"E","text":"新月体性肾炎"}],"answerKeys":["C"],"answerText":["微小病变病"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：微小病变病肾小球内无免疫复合物沉积，其发病主要与T细胞功能异常及足细胞损伤有关。\n解析：微小病变病是肾病综合征的常见病理类型，光镜下肾小球基本正常，电镜下见脏层上皮细胞足突广泛融合，免疫荧光通常阴性，故与免疫复合物沉积无关。本题题眼是“免疫荧光阴性、无免疫复合物”，应选微小病变病。其余选项多数由循环或原位免疫复合物介导，免疫荧光可见相应沉积。\n\n选项分析：\nA. 错误：膜性肾炎为原位免疫复合物介导，免疫荧光见IgG、C3沿肾小球毛细血管壁呈颗粒状沉积，电镜下上皮下电子致密物沉积并形成钉突。\nB. 错误：急性肾炎即急性弥漫性增生性肾小球肾炎，常为链球菌感染后免疫复合物沉积，电镜下上皮下“驼峰状”致密物，免疫荧光颗粒状沉积。\nC. 正确：微小病变病免疫荧光阴性，电镜以足细胞足突融合为特征，无明确免疫复合物沉积，发病与T细胞因子导致肾小球通透性增高有关。\nD. 错误：膜性增生性肾炎又称系膜毛细血管性肾炎，常有免疫复合物及补体在系膜区和内皮下沉积，免疫荧光见C3、IgG等颗粒状沉积，并伴低补体血症。\nE. 错误：新月体性肾炎分型中，Ⅱ型为免疫复合物型，Ⅰ型为抗GBM抗体型；Ⅲ型为寡免疫复合物型。考试中该选项作为新月体性肾炎总体，常与免疫复合物致病相关联，并非本题最佳“无关”答案。\n易混点：微小病变病的关键记忆点是“光镜正常、电镜足突融合、免疫荧光阴性”；膜性肾炎的关键是“上皮下免疫复合物和钉突”。新月体性肾炎需注意分型，Ⅲ型寡免疫复合物虽无沉积，但单选题中最典型的“与免疫复合物无关”仍是微小病变病。","chapter":13,"chapterName":"泌尿系统疾病","chapterTitle":"第13章 泌尿系统疾病"},{"id":"pathology-2a-single-0234","type":"single","typeLabel":"单选题","number":234,"question":"下列哪项属于早期食管癌的必要条件","options":[{"key":"A","text":"癌变面积小于1.0cm"},{"key":"B","text":"浸润深度未超过黏膜下层"},{"key":"C","text":"无明显临床症状"},{"key":"D","text":"无淋巴结转移"},{"key":"E","text":"钡餐检查可有局限性僵硬"}],"answerKeys":["B"],"answerText":["浸润深度未超过黏膜下层"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：早期食管癌以癌组织浸润深度未超过黏膜下层、未侵及肌层为界定核心。\n解析：早期食管癌指癌组织局限于食管黏膜层或黏膜下层，尚未浸润至肌层，因此“浸润深度未超过黏膜下层”是必要条件。此时可无明显症状，也可有胸骨后不适、烧灼感或异物感；钡餐可正常或仅见黏膜皱襞改变。题眼是“早期”按浸润深度判断，而不是按面积、症状或淋巴结状态判断。\n\n选项分析：\nA. 错误：早期食管癌不以癌变面积小于1.0cm为界定标准，癌灶大小可不一；面积小并非“早期”的必要条件，不能与微小癌等概念混淆。\nB. 正确：癌组织局限于黏膜层或黏膜下层、未侵及肌层，是早期食管癌最核心的病理学依据；一旦浸润肌层即属中晚期。\nC. 错误：无明显临床症状不是必要条件；早期食管癌常无症状，但也可出现轻度胸骨后不适、烧灼感或异物感，有症状并不能排除早期。\nD. 错误：有无淋巴结转移属于分期和播散指标，不是本题所要求的“必要条件”；判断早期应抓住浸润深度未超过黏膜下层这一关键。\nE. 错误：钡餐检查见局限性僵硬、管壁僵硬或狭窄多提示癌已浸润肌层，属于进展期食管癌表现；早期钡餐可无明显异常，不能作为早期癌的必要条件。\n\n易混点：早期食管癌与中晚期食管癌的界限在于是否侵及肌层；中晚期可表现为髓质型、蕈伞型、溃疡型、缩窄型。记忆要点：早期食管癌“深度不过黏膜下层”，早期胃癌则常强调“局限于黏膜层或黏膜下层，无论有无淋巴结转移”，两者均以浸润深度为核心。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-2a-single-0235","type":"single","typeLabel":"单选题","number":235,"question":"如图，此肿瘤生长方式是","options":[{"key":"A","text":"浸润性生长"},{"key":"B","text":"外生性生长"},{"key":"C","text":"膨胀性生长"},{"key":"D","text":"浸润与外生"},{"key":"E","text":"膨胀与浸润"}],"answerKeys":["A"],"answerText":["浸润性生长"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：A\n核心考点：肿瘤的生长方式，尤其是恶性肿瘤浸润性生长的生物学特征。\n解析：题目图片未提供，仅依据文字信息和标准答案分析。浸润性生长是恶性肿瘤常见的生长方式，瘤细胞侵入并破坏周围组织，常无完整包膜，边界不清，活动度差，手术切除范围需扩大。题眼在于判断肿瘤是否向周围组织呈浸润性扩展，标准答案定为A，说明本题考查的是恶性肿瘤的浸润性生长特征。\n选项分析：\nA. 正确：浸润性生长指瘤细胞长入周围组织并破坏正常结构，是恶性肿瘤的重要生物学行为，常表现为无包膜、界限不清、固定或不易推动。\nB. 错误：外生性生长指肿瘤向体表或腔道表面突出生长，呈息肉状、乳头状或蕈伞状，常见于腔道黏膜肿瘤，并非本题标准答案所指的主要生长方式。\nC. 错误：膨胀性生长是良性肿瘤常见方式，肿瘤常有包膜，推挤周围组织而不明显侵入，界限较清，可推动。\nD. 错误：浸润与外生可同时见于腔道恶性肿瘤，如胃肠道癌可向腔内外生长，但本题标准答案只选浸润性生长，说明图示强调的主要方式不是外生性生长。\nE. 错误：膨胀性生长主要见于良性肿瘤，浸润性生长主要见于恶性肿瘤，二者并存不是本题所考查的主要生长方式；标准答案已排除膨胀与浸润。\n易混点：良性肿瘤多为膨胀性生长，恶性肿瘤多为浸润性生长；外生性生长只说明向表面突出，不等于良性，腔道恶性肿瘤可表现为外生性并伴浸润。记忆要点：看包膜、边界和是否侵犯周围组织，有浸润破坏者优先考虑恶性。","chapter":6,"chapterName":"肿瘤","chapterTitle":"第6章 肿瘤","needsImage":true},{"id":"pathology-2a-single-0236","type":"single","typeLabel":"单选题","number":236,"question":"下列哪种癌较早经血道转移","options":[{"key":"A","text":"移行细胞癌"},{"key":"B","text":"绒毛膜癌"},{"key":"C","text":"肺大细胞癌"},{"key":"D","text":"胃癌"},{"key":"E","text":"乳腺浸润性导管癌"}],"answerKeys":["B"],"answerText":["绒毛膜癌"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n\n核心考点：癌的转移途径及绒毛膜癌易早期经血道转移的生物学特点。\n\n解析：绒毛膜癌由异型滋养细胞组成，侵袭性强，肿瘤细胞极易侵入子宫肌层血管，经血道播散至肺、脑、肝、阴道等部位，故早期即可发生血道转移，且转移灶常伴明显出血坏死。题眼是“癌”与“较早经血道转移”的组合，属于“癌多经淋巴道转移”的重要例外。\n\n选项分析：\nA. 错误：移行细胞癌即尿路上皮癌，主要沿淋巴道转移，也可局部浸润，血道转移不是其最早、最突出的转移方式。\nB. 正确：绒毛膜癌恶性度高，滋养细胞侵袭血管的能力强，早期即可侵入血窦经血道转移，肺最常见，脑、肝等亦可受累。\nC. 错误：肺大细胞癌属于非小细胞肺癌，可经淋巴道和血道转移，但血道转移并非其相对于绒毛膜癌的早期特征，且肺癌常先有淋巴道转移。\nD. 错误：胃癌主要经淋巴道转移，晚期可经门静脉血道转移至肝，但血道转移相对较晚，不是本题所指的“较早”。\nE. 错误：乳腺浸润性导管癌以淋巴道转移为主，血道转移多发生于较晚期，常见转移至肺、骨、肝、脑等。\n\n易混点：一般规律为“癌多经淋巴道转移，肉瘤多经血道转移”，但绒毛膜癌、肝癌、肾癌、甲状腺滤泡癌等癌也可较早经血道转移。绒毛膜癌还应与侵蚀性葡萄胎鉴别：前者镜下无绒毛结构，后者可见绒毛结构。","chapter":6,"chapterName":"肿瘤","chapterTitle":"第6章 肿瘤"},{"id":"pathology-2a-single-0237","type":"single","typeLabel":"单选题","number":237,"question":"心肌梗死会出现以下哪种病理改变","options":[{"key":"A","text":"心肌间质淋巴细胞浸润"},{"key":"B","text":"心肌细胞脂肪组织浸润"},{"key":"C","text":"心肌肉眼呈红、黄相间的条纹"},{"key":"D","text":"心肌细胞空泡变性"},{"key":"E","text":"心肌组织凝固性坏死"}],"answerKeys":["E"],"answerText":["心肌组织凝固性坏死"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n核心考点：心肌梗死的基本病理本质是缺血导致的凝固性坏死。\n解析：心肌梗死由冠状动脉供血中断引起，梗死区心肌发生凝固性坏死，镜下表现为心肌细胞胞质嗜酸性增强、核固缩碎裂溶解，坏死区周围可见中性粒细胞浸润，后期由肉芽组织机化。题目题眼是“心肌梗死”，其核心形态学改变为凝固性坏死，因此选E。\n\n选项分析：\nA. 错误：心肌间质淋巴细胞浸润主要见于病毒性心肌炎等炎症性病变，不是心肌梗死的典型改变；梗死早期以中性粒细胞浸润为主。\nB. 错误：脂肪组织浸润发生在心肌间质，常见于右心室心肌脂肪浸润，并非心肌细胞本身被脂肪组织浸润，也不是心肌梗死的病理改变。\nC. 错误：心肌肉眼呈红、黄相间条纹常见于心肌脂肪变或心肌脂肪浸润（如虎斑心），黄红色相间并非心肌梗死灶的典型表现；梗死灶多呈灰黄、黄白色，周边可有充血出血带。\nD. 错误：心肌细胞空泡变性属于可逆性损伤，可见于缺氧、中毒、感染等，不是心肌梗死最具诊断意义的改变；梗死典型为凝固性坏死。\nE. 正确：心肌梗死时心肌细胞发生凝固性坏死，是本题的标准答案；坏死心肌保持基本轮廓，胞质嗜酸性增强，核消失，伴炎症反应和后期机化。\n\n易混点：心肌梗死要与病毒性心肌炎、心肌脂肪变/脂肪浸润鉴别。记忆要点：梗死本质是“凝固性坏死”，病毒性心肌炎以间质淋巴细胞浸润为特点，虎斑心以红黄相间条纹为肉眼特点。","chapter":9,"chapterName":"心血管系统疾病","chapterTitle":"第9章 心血管系统疾病"},{"id":"pathology-2a-single-0238","type":"single","typeLabel":"单选题","number":238,"question":"慢性肝淤血肉眼观如图所示，关于其形态特征说法不正确的是","options":[{"key":"A","text":"色暗红，体积增大，切面湿润"},{"key":"B","text":"色灰白，体积缩小，切面干燥"},{"key":"C","text":"重量增加，质地变硬"},{"key":"D","text":"切面可见红黄相间的条纹"},{"key":"E","text":"又称槟榔肝"}],"answerKeys":["B"],"answerText":["色灰白，体积缩小，切面干燥"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：慢性肝淤血的肉眼形态特征及“槟榔肝”的形成机制。\n解析：题目图片未提供，以下仅依据文字信息分析。慢性肝淤血多由右心衰竭引起，肝静脉回流受阻，肝小叶中央区淤血，肝窦扩张充血，中央区肝细胞萎缩甚至坏死，而周边肝细胞脂肪变性；肉眼表现为肝体积增大、重量增加、色暗红、切面湿润，切面红黄相间形成“槟榔肝”。长期反复淤血可伴纤维组织增生，使肝脏质地变硬。本题题眼是“不正确”，B所述“色灰白、体积缩小、切面干燥”不符合慢性肝淤血，而更接近肝萎缩或晚期肝硬化等改变。\n选项分析：\nA. 正确：慢性肝淤血时肝内血液淤积，肝脏体积增大，色暗红，切面因充血、水肿而湿润。\nB. 错误：该描述不是慢性肝淤血的表现；色灰白、体积缩小、切面干燥可见于肝萎缩等病变，晚期肝硬化虽可体积缩小、质地变硬，但常伴表面结节和假小叶形成。\nC. 正确：慢性肝淤血早期重量增加，长期淤血可致纤维组织增生，使肝脏质地变硬。\nD. 正确：切面红黄相间条纹是槟榔肝的典型肉眼表现，红色为小叶中央区淤血，黄色为周边肝细胞脂肪变性。\nE. 正确：慢性肝淤血因切面红黄相间如槟榔切面，故又称槟榔肝。\n易混点：槟榔肝的本质是慢性肝淤血，红黄相间由“中央淤血+周边脂肪变”构成；肝硬化则以纤维间隔和假小叶为特征，肝脏可缩小、变硬并呈结节状，二者不能混同。记忆要点：槟榔肝是“增大、暗红、红黄相间、湿润”。","chapter":3,"chapterName":"局部血液循环障碍","chapterTitle":"第3章 局部血液循环障碍","needsImage":true},{"id":"pathology-2a-single-0239","type":"single","typeLabel":"单选题","number":239,"question":"交界性肿瘤是指","options":[{"key":"A","text":"介于良性和恶性肿瘤之间的肿瘤"},{"key":"B","text":"癌前病变"},{"key":"C","text":"同时具有癌和肉瘤结构的肿瘤"},{"key":"D","text":"发生于表皮与真皮交界处的肿瘤"},{"key":"E","text":"是良性肿瘤"}],"answerKeys":["A"],"answerText":["介于良性和恶性肿瘤之间的肿瘤"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：A\n核心考点：交界性肿瘤是生物学行为介于良性与恶性之间的一类肿瘤，具有局部复发和潜在恶性倾向，但通常不发生明显浸润和转移。\n解析：交界性肿瘤多发生于卵巢等部位，如卵巢交界性浆液性/黏液性肿瘤。其镜下常表现为上皮细胞增生和一定异型性，但缺乏明确间质浸润，肉眼可见囊实性肿块；临床经过较恶性肿瘤好，但需随访，不能等同于良性肿瘤。本题题眼是“交界性”并非位置交界，而是良恶性生物学行为之间的交界。\n选项分析：\nA. 正确：交界性肿瘤指形态和生物学行为介于良、恶性之间，常有不典型增生但浸润不明显，属于独立的一类肿瘤，如卵巢交界性上皮性肿瘤。\nB. 错误：癌前病变是指某些具有癌变潜能的病变，如黏膜白斑、宫颈上皮内瘤变、结肠腺瘤性息肉等，本身不是“介于良恶性之间的肿瘤”这一肿瘤分类概念。\nC. 错误：同时具有癌和肉瘤结构的肿瘤称为癌肉瘤，属于恶性肿瘤；若两种不同肿瘤成分碰撞共存则称碰撞瘤，均不是交界性肿瘤的定义。\nD. 错误：发生于表皮与真皮交界处的病变常指交界痣，是痣细胞位于表皮真皮交界处，属于黑色素细胞痣的一种，不是交界性肿瘤。\nE. 错误：交界性肿瘤不是良性肿瘤，其具有一定的潜在恶性、复发风险，需与良性肿瘤和明确恶性肿瘤鉴别。\n易混点：交界性肿瘤不要与“交界痣”混淆，前者强调生物学行为介于良恶性之间，后者强调痣细胞所在解剖位置；也不要将癌前病变误认为交界性肿瘤，癌前病变是癌变风险增高的病变，而非独立的一类交界性肿瘤。","chapter":6,"chapterName":"肿瘤","chapterTitle":"第6章 肿瘤"},{"id":"pathology-2a-single-0240","type":"single","typeLabel":"单选题","number":240,"question":"我国门脉性肝硬化的原因主要是","options":[{"key":"A","text":"慢性酒精中毒"},{"key":"B","text":"病毒性肝炎"},{"key":"C","text":"营养缺乏"},{"key":"D","text":"砷中毒"},{"key":"E","text":"四氯化碳中毒"}],"answerKeys":["B"],"answerText":["病毒性肝炎"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：我国门脉性肝硬化的最常见病因是病毒性肝炎，尤其是乙型和丙型病毒性肝炎。\n解析：病毒性肝炎（特别是乙肝、丙肝）在我国是门脉性肝硬化的主要病因。其机制是病毒持续感染引起肝细胞反复变性、坏死，伴纤维组织增生和肝细胞结节状再生，最终形成假小叶和弥漫性纤维化，导致门脉高压和肝功能减退。本题题眼是“我国”和“主要原因”，应选病毒性肝炎。\n选项分析：\nA. 错误：慢性酒精中毒是西方国家酒精性肝硬化的主要原因，在我国虽可致病，但不是门脉性肝硬化的主要病因。\nB. 正确：我国门脉性肝硬化以病毒性肝炎后肝硬化最多见，尤其乙型肝炎，其次丙型肝炎；反复肝细胞损伤、纤维化及假小叶形成是病理基础。\nC. 错误：营养缺乏可促进脂肪肝和肝损伤，但单纯营养缺乏不是我国门脉性肝硬化的主要原因，属于次要或参与因素。\nD. 错误：砷中毒属于化学毒物中毒，可引起肝损伤，但临床少见，不是我国门脉性肝硬化的主要病因。\nE. 错误：四氯化碳中毒是实验性或职业性肝毒物损伤，可致肝细胞坏死和肝硬化，但并非我国门脉性肝硬化的主要原因。\n易混点：门脉性肝硬化在我国以病毒性肝炎后肝硬化为主，在西方则酒精性肝硬化更常见；记忆时要区分“我国主要病因”和“西方国家主要病因”。酒精性肝病常经历脂肪肝、酒精性肝炎、肝硬化；病毒性肝炎则强调反复坏死、纤维化和假小叶形成。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-2a-single-0241","type":"single","typeLabel":"单选题","number":241,"question":"泌尿系统最常见的恶性肿瘤是","options":[{"key":"A","text":"输尿管鳞状细胞癌"},{"key":"B","text":"Wilms瘤"},{"key":"C","text":"肾细胞癌"},{"key":"D","text":"输尿管移行细胞癌"},{"key":"E","text":"膀胱移行细胞癌"}],"answerKeys":["C"],"answerText":["肾细胞癌"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：泌尿系统恶性肿瘤的总体最常见类型（按本题标准为肾细胞癌）。\n解析：肾细胞癌起源于肾小管上皮，是肾脏最常见的恶性肿瘤，多见于中老年男性，好发于肾上极，常表现为无痛性肉眼血尿、腰痛和腹部肿块，并可出现副肿瘤综合征。本题题眼是“泌尿系统最常见”，按标准答案应选肾细胞癌，而不是仅局限于膀胱或输尿管的肿瘤。\n选项分析：\nA. 错误：输尿管鳞状细胞癌少见，输尿管恶性肿瘤多为尿路上皮癌（移行细胞癌）；鳞状细胞癌常与慢性刺激、黏膜鳞状化生有关，不是泌尿系统最常见恶性肿瘤。\nB. 错误：Wilms瘤即肾母细胞瘤，是儿童最常见的肾脏恶性肿瘤，但总体发病率低，不能作为泌尿系统最常见恶性肿瘤。\nC. 正确：肾细胞癌为肾脏最常见恶性肿瘤，在本题标准答案中为泌尿系统最常见恶性肿瘤，病理上以透明细胞癌最常见，常伴血尿、腰痛和肿块。\nD. 错误：输尿管移行细胞癌是输尿管最常见的恶性肿瘤，但输尿管肿瘤总体发病率低，不能作为泌尿系统最常见恶性肿瘤。\nE. 错误：膀胱移行细胞癌是膀胱最常见的恶性肿瘤，但本题问泌尿系统总体最常见，按标准答案不选膀胱移行细胞癌。\n易混点：肾细胞癌是肾脏最常见恶性肿瘤；膀胱尿路上皮癌（移行细胞癌）是膀胱最常见恶性肿瘤；Wilms瘤好发于儿童。考试中注意题干限定“肾脏”“膀胱”还是“泌尿系统总体”，并严格按教材和标准答案作答。","chapter":13,"chapterName":"泌尿系统疾病","chapterTitle":"第13章 泌尿系统疾病"},{"id":"pathology-2a-single-0242","type":"single","typeLabel":"单选题","number":242,"question":"下列哪个器官的梗死灶为节段性","options":[{"key":"A","text":"脑"},{"key":"B","text":"肝"},{"key":"C","text":"心脏"},{"key":"D","text":"小肠"},{"key":"E","text":"脾"}],"answerKeys":["D"],"answerText":["小肠"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：梗死灶的形态取决于器官血管分布特点，小肠梗死因肠系膜血管支配方式而呈节段性。\n解析：小肠由肠系膜上、下动脉分支供血，肠壁血管呈弓形吻合后发出终末支，当肠系膜动脉栓塞或血栓形成时，受累肠段发生出血性梗死，肉眼常表现为一段肠管暗红、肿胀，境界较清楚，故梗死灶呈节段性。题眼是“节段性”，应联想到肠梗死；小肠梗死还常伴肠壁水肿、出血、坏死，临床可有腹痛、血便及腹膜炎表现。\n\n选项分析：\nA. 错误：脑梗死多为贫血性梗死，后期发生液化性坏死，形成软化灶或囊性变，不以节段性为特征。\nB. 错误：肝有肝动脉和门静脉双重血供，肝动脉阻塞时因门静脉供血常不易发生明显梗死；若发生梗死，多呈楔形或不规则，不是节段性。\nC. 错误：心肌梗死多位于左心室前壁、室间隔前部及心尖部，形态常呈不规则地图状，不是节段性。\nD. 正确：小肠梗死常累及一段肠管，梗死灶呈节段性，且多为出血性梗死，是小肠梗死的典型形态特点。\nE. 错误：脾由脾动脉终末支供血，脾梗死典型表现为锥形或楔形，底部朝向脾包膜，尖端朝向脾门，不是节段性。\n\n易混点：脾、肾、肺梗死常呈锥形或楔形；肠梗死呈节段性；心肌梗死呈不规则地图状；脑梗死液化坏死形成软化灶。记忆要点：按“器官血管分布”判断梗死形状，看到“节段性”优先选肠。","chapter":3,"chapterName":"局部血液循环障碍","chapterTitle":"第3章 局部血液循环障碍"},{"id":"pathology-2a-single-0243","type":"single","typeLabel":"单选题","number":243,"question":"下列哪一项是恶性肿瘤独有的特征","options":[{"key":"A","text":"局部肿块"},{"key":"B","text":"恶病质"},{"key":"C","text":"出血坏死"},{"key":"D","text":"浸润性生长"},{"key":"E","text":"转移"}],"answerKeys":["E"],"answerText":["转移"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n核心考点：转移是恶性肿瘤最可靠、最具诊断意义的生物学特征，良性肿瘤不会发生转移。\n解析：恶性肿瘤细胞突破基底膜后，可经淋巴道、血道、体腔种植等途径播散，在远处或淋巴结形成与原发瘤同类型的继发瘤，这一过程称为转移。转移提示肿瘤已获得侵袭和远处定植能力，是判断恶性最确切的依据。本题题眼在“独有”，良性肿瘤可形成肿块、可出血坏死，也可引起消耗，但不会转移。\n\n选项分析：\nA. 错误：局部肿块并非恶性肿瘤独有，良性肿瘤、囊肿、炎症性肿块、增生性病变等均可形成局部肿块；白血病等恶性肿瘤甚至可无明显肿块。\nB. 错误：恶病质多见于恶性肿瘤晚期，但并非恶性肿瘤独有，严重慢性感染、慢性消耗性疾病及重度营养不良等也可出现恶病质；且并非所有恶性肿瘤都发生恶病质。\nC. 错误：出血坏死可见于恶性肿瘤因生长快、血供不足而发生，但良性肿瘤也可发生出血、坏死，如蒂扭转、梗死、红色变性等，故不具特异性。\nD. 错误：浸润性生长是恶性肿瘤的重要特征，但不是绝对独有；少数良性肿瘤如血管瘤、淋巴管瘤可呈浸润性生长，且原位癌尚未突破基底膜，可无明显浸润。\nE. 正确：转移是恶性肿瘤独有的特征，良性肿瘤不发生转移。肿瘤细胞经淋巴道、血道或种植性播散并在远处形成继发瘤，是恶性生物学行为的确切证据。\n\n易混点：浸润性生长和转移均提示恶性，但“浸润”强调局部侵犯，“转移”强调远处播散；考试中若问“恶性肿瘤独有特征”，首选转移。诊断恶性最可靠的依据也是转移，而非单纯的肿块、坏死或恶病质。","chapter":6,"chapterName":"肿瘤","chapterTitle":"第6章 肿瘤"},{"id":"pathology-2a-single-0244","type":"single","typeLabel":"单选题","number":244,"question":"容易发生出血性梗死的器官是","options":[{"key":"A","text":"心"},{"key":"B","text":"肾"},{"key":"C","text":"脑"},{"key":"D","text":"脾"},{"key":"E","text":"肠"}],"answerKeys":["E"],"answerText":["肠"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n核心考点：出血性梗死的发生条件及好发器官，肠因双重血供、吻合支丰富、组织疏松并常伴严重淤血而发生出血性梗死。\n解析：出血性梗死多发生于有双重血供或吻合支丰富、组织疏松，且梗死前存在严重淤血的器官，经典好发部位为肺和肠。肠梗死时，肠系膜动脉阻塞后，血液仍可经吻合支流入坏死区，加之肠壁疏松、静脉回流受阻，梗死区高度淤血、出血，呈暗红色，故为出血性梗死。题眼是“容易发生出血性梗死”，应选肠。\n\n选项分析：\nA. 错误：心梗死多为贫血性梗死。冠状动脉分支多属终末动脉，心肌组织较致密，坏死区出血少，肉眼常呈苍白或黄白色。\nB. 错误：肾为终末动脉供血，肾组织致密，梗死多为贫血性梗死，典型呈楔形灰白色坏死区。\nC. 错误：脑梗死多属贫血性梗死，因脑动脉终末支供血且脑组织坏死为液化性坏死；出血性脑卒中属于出血，不是典型的出血性梗死。\nD. 错误：脾为终末动脉供血，脾组织致密，梗死多为贫血性梗死，常呈楔形、灰白色。\nE. 正确：肠有丰富血管吻合支，肠壁组织疏松，肠套叠、肠扭转或肠系膜血管阻塞时先有严重淤血，随后发生出血性梗死，梗死肠段呈暗红色，易继发坏疽和穿孔。\n\n易混点：贫血性梗死好发于心、肾、脾，梗死灶灰白；出血性梗死好发于肺、肠，梗死灶暗红。记忆出血性梗死条件可抓“双血供、组织松、严重淤血”，肠同时符合这些特点。","chapter":3,"chapterName":"局部血液循环障碍","chapterTitle":"第3章 局部血液循环障碍"},{"id":"pathology-2a-single-0245","type":"single","typeLabel":"单选题","number":245,"question":"不符合大叶性肺炎红色肝样期病理变化的是","options":[{"key":"A","text":"肺泡壁血管贫血状态"},{"key":"B","text":"肺泡腔内纤维素渗出"},{"key":"C","text":"患者缺氧严重"},{"key":"D","text":"肺泡腔内中性粒细胞渗出"},{"key":"E","text":"肉眼实变，有如肝脏切面"}],"answerKeys":["A"],"answerText":["肺泡壁血管贫血状态"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：A\n核心考点：大叶性肺炎红色肝样期的肺泡壁毛细血管显著扩张充血，而非贫血状态。\n解析：红色肝样期肺泡壁毛细血管明显扩张充血，肺泡腔内渗出大量红细胞、纤维素及少量中性粒细胞，使肺组织实变、暗红如肝，患者因通气/血流比失调而缺氧明显。题眼是“红色肝样期”的血管状态：应为充血，不是贫血。\n选项分析：\nA. 正确：红色肝样期肺泡壁毛细血管显著扩张充血；“血管贫血状态”主要见于灰色肝样期，因肺泡腔内大量渗出物压迫毛细血管，故该项不符合。\nB. 错误：肺泡腔内纤维素渗出是红色肝样期的典型变化之一，并参与肺组织实变。\nC. 错误：红色肝样期肺泡腔被渗出物填充，气体交换受阻，患者缺氧严重，可出现发绀。\nD. 错误：红色肝样期肺泡腔内可有中性粒细胞渗出，只是数量较少；大量中性粒细胞渗出更见于灰色肝样期。\nE. 错误：红色肝样期肺叶肿大、暗红，质地实变，切面呈粗颗粒状，状如肝脏，故称“肝样变”。\n易混点：红色肝样期记忆为“充血、红细胞多、缺氧重、暗红如肝”；灰色肝样期记忆为“毛细血管受压贫血、中性粒细胞多、缺氧改善、灰白如肝”。两期均可实变如肝，关键区别在充血/贫血和渗出细胞成分。","chapter":10,"chapterName":"呼吸系统疾病","chapterTitle":"第10章 呼吸系统疾病"},{"id":"pathology-2a-single-0246","type":"single","typeLabel":"单选题","number":246,"question":"动脉粥样硬化斑块中泡沫细胞的主要来源是","options":[{"key":"A","text":"内皮细胞和巨噬细胞"},{"key":"B","text":"平滑肌细胞"},{"key":"C","text":"单核细胞和平滑肌细胞"},{"key":"D","text":"淋巴细胞和内皮细胞"},{"key":"E","text":"中性粒细胞和单核细胞"}],"answerKeys":["C"],"answerText":["单核细胞和平滑肌细胞"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：动脉粥样硬化斑块中泡沫细胞主要由迁入的单核细胞（巨噬细胞）和中膜迁入的平滑肌细胞摄取脂质后形成。\n解析：动脉粥样硬化早期，内皮损伤后单核细胞黏附并迁入内膜，分化为巨噬细胞，吞噬氧化型低密度脂蛋白后形成巨噬细胞源性泡沫细胞；同时中膜平滑肌细胞迁入内膜、增殖并摄取脂质，形成平滑肌细胞源性泡沫细胞。因此泡沫细胞并非单一来源，而是以单核细胞来源的巨噬细胞和平滑肌细胞为主。题眼是“主要来源”，需抓住单核细胞入内膜分化为巨噬细胞以及平滑肌细胞迁移、吞噬脂质两条途径。\n选项分析：\nA. 错误：内皮细胞是动脉粥样硬化起始阶段受损和功能异常的靶细胞，但不是泡沫细胞的主要来源；巨噬细胞虽可形成泡沫细胞，但其前体应表述为单核细胞，且本项遗漏平滑肌细胞。\nB. 错误：平滑肌细胞确实可迁入内膜并吞噬脂质形成泡沫细胞，但只说平滑肌细胞不全面，遗漏了更重要的单核细胞/巨噬细胞来源。\nC. 正确：单核细胞迁入内膜后分化为巨噬细胞，吞噬脂质形成巨噬细胞源性泡沫细胞；平滑肌细胞迁入内膜后也可摄取脂质形成平滑肌细胞源性泡沫细胞，二者是斑块中泡沫细胞的主要来源。\nD. 错误：淋巴细胞参与炎症和免疫反应，内皮细胞主要是受损靶细胞，二者均不是泡沫细胞的主要来源；本项混淆了炎症细胞浸润与脂质吞噬细胞。\nE. 错误：中性粒细胞不是动脉粥样硬化斑块泡沫细胞的主要来源；单核细胞虽正确，但本项遗漏平滑肌细胞，且将中性粒细胞置于主要来源地位不准确。\n易混点：巨噬细胞源性泡沫细胞来自血液单核细胞，不是来自内皮细胞；平滑肌细胞源性泡沫细胞来自中膜平滑肌细胞迁入内膜。记忆要点：动脉粥样硬化泡沫细胞“两来源”——单核细胞/巨噬细胞与平滑肌细胞，内皮细胞是损伤起点而非主要泡沫细胞来源。","chapter":9,"chapterName":"心血管系统疾病","chapterTitle":"第9章 心血管系统疾病"},{"id":"pathology-2a-single-0247","type":"single","typeLabel":"单选题","number":247,"question":"贫血性梗死发生于","options":[{"key":"A","text":"组织疏松的器官"},{"key":"B","text":"有双重血液供给的器官"},{"key":"C","text":"严重淤血的器官"},{"key":"D","text":"组织结构致密的器官"},{"key":"E","text":"侧支循环充分的器官"}],"answerKeys":["D"],"answerText":["组织结构致密的器官"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：贫血性梗死多发生于组织结构致密、侧支循环不充分的器官，如心、肾、脾。\n解析：贫血性梗死又称白色梗死，常见于心、肾、脾等实质器官。这些器官组织较致密，梗死发生后血液不易渗入坏死区，局部出血少，坏死组织逐渐吸收水分，故梗死灶呈灰白色，边界清楚，周边可见充血出血带。本题题眼是“贫血性梗死发生于”，关键条件是组织结构致密且侧支循环不充分，因此选D。\n\n选项分析：\nA. 错误：组织疏松的器官（如肺、肠）发生梗死后血液易渗入坏死组织，常形成出血性梗死，而不是典型的贫血性梗死。\nB. 错误：有双重血液供给的器官（如肺、肠）因血流较丰富，梗死后易发生出血性梗死；贫血性梗死多见于侧支循环不充分的器官。\nC. 错误：严重淤血的器官（如淤血肺、淤血肠）发生梗死时更易出血，常为出血性梗死，故不是贫血性梗死的典型条件。\nD. 正确：组织结构致密、侧支循环不充分的器官（心、肾、脾）梗死后出血少，坏死区呈灰白色，为贫血性梗死。\nE. 错误：侧支循环充分的器官通常不易发生梗死；即使发生，也不以贫血性梗死为典型。贫血性梗死的重要条件恰是侧支循环不充分。\n\n易混点：梗死类型主要看组织致密程度、侧支循环和有无淤血。记忆要点：心、肾、脾“致密少出血”——贫血性（白色）梗死；肺、肠“疏松、双重血供、常伴淤血”——出血性（红色）梗死。","chapter":3,"chapterName":"局部血液循环障碍","chapterTitle":"第3章 局部血液循环障碍"},{"id":"pathology-2a-single-0248","type":"single","typeLabel":"单选题","number":248,"question":"风湿病的特异性病理变化是指","options":[{"key":"A","text":"风湿小结形成"},{"key":"B","text":"结缔组织的黏液变化"},{"key":"C","text":"胶原纤维的变性、坏死"},{"key":"D","text":"病灶中发生的纤维样坏死"},{"key":"E","text":"病灶内出现梭形小瘢痕"}],"answerKeys":["A"],"answerText":["风湿小结形成"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：A\n核心考点：风湿病增生期的特征性病变为风湿小体（风湿小结），是诊断风湿病及判断活动性的重要组织学依据。\n解析：风湿病的基本病变包括变质渗出期、增生期和纤维化期。增生期在心肌间质、心内膜下及皮下结缔组织等处形成风湿小体，即风湿小结，中央可见纤维素样坏死，周围有淋巴细胞、单核细胞及Aschoff细胞（Anitschkow细胞）等，故“风湿小结形成”是特异性病理变化。本题题眼是“特异性”，早期黏液样变性和纤维素样坏死虽可出现，但可见于多种结缔组织病，不具特异性；梭形小瘢痕是风湿小体纤维化后的结局，属修复性改变。\n选项分析：\nA. 正确：风湿小结又称风湿小体或Aschoff body，是风湿病增生期的特征性病变，多见于心肌间质、心内膜下和皮下结缔组织，具有诊断意义。\nB. 错误：结缔组织黏液样变性属于风湿病变质渗出期的改变，可见于其他变态反应性结缔组织病，缺乏特异性。\nC. 错误：胶原纤维变性、坏死属于变质性改变，常表现为纤维素样坏死，并非风湿病所特有。\nD. 错误：病灶内纤维样坏死（纤维素样坏死）可见于系统性红斑狼疮、结节性多动脉炎、恶性高血压等，不能作为风湿病的特异性病变。\nE. 错误：梭形小瘢痕是风湿小体经纤维化愈合后形成的，属于晚期修复改变，不是活动期特征性风湿小结。\n易混点：风湿小体是增生期特征性病变，中央为纤维素样坏死，周围为Aschoff细胞；纤维素样坏死本身非特异，黏液样变性也非特异。记忆要点：风湿病“特异性看小体，坏死变性不特异，梭形瘢痕是结局”。","chapter":9,"chapterName":"心血管系统疾病","chapterTitle":"第9章 心血管系统疾病"},{"id":"pathology-2a-single-0249","type":"single","typeLabel":"单选题","number":249,"question":"下列哪一类型的霍奇金淋巴瘤的预后最好","options":[{"key":"A","text":"结节硬化型"},{"key":"B","text":"弥漫纤维化型的淋巴细胞减少型"},{"key":"C","text":"网状细胞型的淋巴细胞减少型"},{"key":"D","text":"混合细胞型"},{"key":"E","text":"淋巴细胞为主型"}],"answerKeys":["E"],"answerText":["淋巴细胞为主型"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n核心考点：霍奇金淋巴瘤组织学亚型与预后的关系，淋巴细胞为主型预后最好。\n解析：霍奇金淋巴瘤的预后与组织学亚型密切相关。淋巴细胞为主型背景中淋巴细胞大量增生，典型R-S细胞较少，病变多局限、进展慢，临床分期常较早，因此预后最好。题眼是“预后最好”，应选淋巴细胞为主型；而淋巴细胞减少型因淋巴细胞显著减少、肿瘤性R-S细胞或多形性细胞增多，预后最差。\n选项分析：\nA. 错误：结节硬化型预后较好，常见于青年女性，常累及纵隔，镜下见胶原纤维束分割结节及陷窝细胞，但其预后不如淋巴细胞为主型，不是“最好”。\nB. 错误：弥漫纤维化型属于淋巴细胞减少型，背景淋巴细胞少并伴明显纤维化，预后差，不是最好。\nC. 错误：网状细胞型属于淋巴细胞减少型，肿瘤性R-S细胞或多形性细胞丰富，淋巴细胞少，预后最差，尤其不是最好。\nD. 错误：混合细胞型背景中嗜酸性粒细胞、浆细胞、组织细胞等混合存在，R-S细胞较多，常与EBV相关，预后中等或较差。\nE. 正确：淋巴细胞为主型以大量成熟小淋巴细胞为背景，典型R-S细胞少，病变常局限，临床进展较慢，预后最好。\n易混点：记忆要点是“淋巴细胞越多预后越好，淋巴细胞越少预后越差”。结节硬化型虽属预后较好类型，但最好仍是淋巴细胞为主型；淋巴细胞减少型无论弥漫纤维化型还是网状细胞型均预后差，其中网状细胞型更差。","chapter":12,"chapterName":"淋巴造血系统疾病","chapterTitle":"第12章 淋巴造血系统疾病"},{"id":"pathology-2a-single-0250","type":"single","typeLabel":"单选题","number":250,"question":"炎症时渗出的纤维素是指下列哪种成分","options":[{"key":"A","text":"纤维组织"},{"key":"B","text":"纤维蛋白"},{"key":"C","text":"纤维细胞"},{"key":"D","text":"纤维蛋白原"},{"key":"E","text":"胶原纤维"}],"answerKeys":["B"],"answerText":["纤维蛋白"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：炎症渗出物中的“纤维素”即纤维蛋白（fibrin），由纤维蛋白原转化而来。\n解析：炎症时血管通透性增高，血浆中的纤维蛋白原渗出到血管外，在组织凝血因子等作用下转变为纤维蛋白，形成纤维素性渗出物。纤维素性炎常见于黏膜、浆膜和肺，镜下呈红染、网状或片状纤维蛋白，可机化或引起粘连。本题题眼是“纤维素”不是纤维组织、纤维细胞或胶原纤维，而是纤维蛋白。\n选项分析：\nA. 错误：纤维组织属于结缔组织，由纤维细胞和胶原纤维等构成，是组织成分，不是炎症时渗出的血浆蛋白成分。\nB. 正确：炎症渗出中的纤维素即纤维蛋白，是纤维蛋白原在血管外转化形成的，构成纤维素性炎的渗出物。\nC. 错误：纤维细胞是结缔组织中的细胞成分，不是渗出液中的“纤维素”，也不能形成纤维素性渗出物。\nD. 错误：纤维蛋白原是血浆中的可溶性前体，渗出后转变为不溶性纤维蛋白；题目所问“渗出的纤维素”指已形成的纤维蛋白，而不是纤维蛋白原本身。\nE. 错误：胶原纤维是结缔组织细胞外基质成分，属于纤维组织的一部分，不是炎症渗出物中的纤维素。\n易混点：纤维蛋白原是可溶性前体，纤维蛋白是不溶性渗出物；病理学“纤维素性炎”中的“纤维素”应记为纤维蛋白，不要误解为植物纤维素或胶原纤维。","chapter":4,"chapterName":"炎症","chapterTitle":"第4章 炎症"},{"id":"pathology-2a-single-0251","type":"single","typeLabel":"单选题","number":251,"question":"小叶性肺炎不会出现的并发症是","options":[{"key":"A","text":"肺脓肿"},{"key":"B","text":"呼吸衰竭"},{"key":"C","text":"支气管扩张"},{"key":"D","text":"肺肉质变"},{"key":"E","text":"心力衰竭"}],"answerKeys":["D"],"answerText":["肺肉质变"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：小叶性肺炎与大叶性肺炎并发症的鉴别，肺肉质变是大叶性肺炎的并发症。\n解析：小叶性肺炎（支气管肺炎）病变以细支气管为中心呈化脓性炎，可累及周围肺泡，重者可出现肺脓肿、呼吸衰竭、心力衰竭及支气管扩张等并发症。肺肉质变又称肺纤维化机化，发生于大叶性肺炎时肺泡腔内渗出物不能被完全吸收，肉芽组织长入并机化，使肺组织呈灰白色、质韧如肉，不属于小叶性肺炎的典型并发症。本题题眼是“不会出现”，即把大叶性肺炎的并发症作为干扰项。\n\n选项分析：\nA. 错误：小叶性肺炎为化脓性炎，病灶中心坏死、中性粒细胞浸润，可融合形成肺脓肿，尤其见于抵抗力低下者。\nB. 错误：病变广泛时可影响通气和换气功能，导致缺氧和二氧化碳潴留，出现呼吸衰竭。\nC. 错误：反复或严重的小叶性肺炎可破坏支气管壁，经纤维组织增生和牵拉形成支气管扩张。\nD. 正确：肺肉质变是大叶性肺炎肺泡腔内渗出物机化所致，不是小叶性肺炎的并发症。\nE. 错误：严重感染、缺氧和毒素作用可加重心脏负担，尤其小儿或原有心脏病者，可发生心力衰竭。\n\n易混点：大叶性肺炎典型并发症包括肺肉质变、肺脓肿、脓胸、感染性休克；小叶性肺炎典型并发症包括呼吸衰竭、心力衰竭、肺脓肿、脓胸和支气管扩张。记忆要点：肺肉质变是“肺泡内渗出物机化”，归属大叶性肺炎。","chapter":10,"chapterName":"呼吸系统疾病","chapterTitle":"第10章 呼吸系统疾病"},{"id":"pathology-2a-single-0252","type":"single","typeLabel":"单选题","number":252,"question":"关于肺出血肾炎综合征的叙述，错误的是","options":[{"key":"A","text":"属于快速进行性肾炎1型"},{"key":"B","text":"抗GBM的抗体与肺泡基底膜发生交叉反应，引起反复咯血"},{"key":"C","text":"病理特征是肾小球内新月体形成"},{"key":"D","text":"常继发于链球菌感染或系统性红斑狼疮"},{"key":"E","text":"肾小球内IgG和C3沿毛细血管袢呈线状沉积"}],"answerKeys":["D"],"answerText":["常继发于链球菌感染或系统性红斑狼疮"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：肺出血肾炎综合征（Goodpasture综合征）属于抗GBM病，是快速进行性肾炎Ⅰ型，累及肺和肾基底膜。\n解析：肺出血肾炎综合征由抗肾小球基底膜（GBM）抗体介导，抗体与肺泡基底膜发生交叉反应，导致反复咯血，同时引起肾小球新月体性肾炎。免疫荧光特征为IgG和C3沿肾小球毛细血管袢呈线状沉积。本题题眼是“肺出血+肾炎+抗GBM”，其本质为原发性抗GBM病，而非链球菌感染或系统性红斑狼疮继发的新月体性肾炎。\n选项分析：\nA. 正确：快速进行性肾炎Ⅰ型即抗GBM抗体型，肺出血肾炎综合征是其典型代表。\nB. 正确：抗GBM抗体可与肺泡基底膜交叉反应，造成肺毛细血管损伤和反复咯血，这是肺肾同时受累的机制。\nC. 正确：肾脏病理特征是大量新月体形成，属于新月体性肾小球肾炎，临床进展迅速。\nD. 错误：链球菌感染后肾炎和系统性红斑狼疮可继发免疫复合物型新月体性肾炎，即快速进行性肾炎Ⅱ型，并非肺出血肾炎综合征的常见继发原因；肺出血肾炎综合征是抗GBM抗体介导的原发性疾病。\nE. 正确：直接免疫荧光示IgG和C3沿毛细血管袢呈线状沉积，是抗GBM病的特征性表现。\n易混点：快速进行性肾炎分型记忆为Ⅰ型抗GBM线状沉积、Ⅱ型免疫复合物颗粒状沉积（如SLE、链球菌感染后）、Ⅲ型寡免疫复合物（ANCA相关）。肺出血肾炎综合征归Ⅰ型，不要与SLE或链球菌感染后新月体性肾炎混淆。","chapter":13,"chapterName":"泌尿系统疾病","chapterTitle":"第13章 泌尿系统疾病"},{"id":"pathology-2a-single-0253","type":"single","typeLabel":"单选题","number":253,"question":"风湿性心内膜炎最常累及","options":[{"key":"A","text":"二尖瓣及主动脉瓣"},{"key":"B","text":"三尖瓣及肺动脉瓣"},{"key":"C","text":"三尖瓣"},{"key":"D","text":"二尖瓣"},{"key":"E","text":"主动脉瓣"}],"answerKeys":["D"],"answerText":["二尖瓣"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：风湿性心内膜炎最常累及二尖瓣，形成沿瓣膜闭锁缘排列的疣状赘生物。\n解析：风湿性心内膜炎是风湿病的特征性病变之一，主要侵犯心瓣膜，以二尖瓣受累最常见，其次为二尖瓣和主动脉瓣同时受累，三尖瓣和肺动脉瓣极少受累。其赘生物多位于二尖瓣心房面闭锁缘，呈单行串珠状排列，由血小板和纤维素构成，灰白半透明，不易脱落，机化后可导致瓣膜增厚、变硬和变形。本题题眼是“最常累及”，应选单一最常见部位二尖瓣。\n\n选项分析：\nA. 错误：二尖瓣及主动脉瓣同时受累在风湿性心内膜炎中较常见，但属于其次常见组合，不是“最常累及”的部位。\nB. 错误：三尖瓣及肺动脉瓣属于右心瓣膜，风湿性心内膜炎极少累及；右心瓣膜病变更多见于感染性心内膜炎等情形。\nC. 错误：三尖瓣单独受累在风湿性心内膜炎中罕见，不能作为最常见部位。\nD. 正确：风湿性心内膜炎最常累及二尖瓣，典型表现为二尖瓣闭锁缘疣状赘生物，是本病的考试记忆要点。\nE. 错误：主动脉瓣可单独或与二尖瓣同时受累，但单独主动脉瓣受累少于二尖瓣，不是最常见部位。\n\n易混点：风湿性心内膜炎最常累及二尖瓣，赘生物小、不易脱落；亚急性感染性心内膜炎常累及二尖瓣和主动脉瓣，赘生物较大、质脆易脱落，可形成栓塞。记忆要点：风湿性心内膜炎“二尖瓣最常见、闭锁缘疣状赘生物、无菌性”。","chapter":9,"chapterName":"心血管系统疾病","chapterTitle":"第9章 心血管系统疾病"},{"id":"pathology-2a-single-0254","type":"single","typeLabel":"单选题","number":254,"question":"电镜下细胞凋亡的特征性改变是","options":[{"key":"A","text":"细胞皱缩"},{"key":"B","text":"胞浆致密"},{"key":"C","text":"染色质边集"},{"key":"D","text":"核碎裂"},{"key":"E","text":"凋亡小体形成"}],"answerKeys":["E"],"answerText":["凋亡小体形成"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n核心考点：细胞凋亡的超微结构标志是凋亡小体形成。\n解析：凋亡时细胞膜完整、胞质浓缩、染色质边集并核碎裂，随后细胞膜内陷包裹细胞碎片形成凋亡小体。凋亡小体可被巨噬细胞或邻近细胞吞噬清除，不引起明显炎症反应，是电镜下识别凋亡的特征性结构。题眼在“电镜下”和“特征性改变”，应选凋亡小体形成。\n选项分析：\nA. 错误：细胞皱缩是凋亡早期常见形态改变，光镜和电镜均可见，但属于一般形态变化，不是电镜下最具特征性的标志。\nB. 错误：胞浆致密可见于凋亡细胞，电镜下表现为细胞器密集、胞质浓缩，但也可在其他细胞损伤状态中见到，特异性不如凋亡小体。\nC. 错误：染色质边集是凋亡早期核改变，染色质凝聚并靠近核膜，电镜可见，但它是凋亡过程的一个阶段，不是最终特征性结构。\nD. 错误：核碎裂既可见于凋亡，也可见于坏死，不能单独作为电镜下凋亡的特征性改变；凋亡时核碎片最终被包入凋亡小体。\nE. 正确：凋亡小体由细胞膜包裹核碎片和细胞器碎片形成，电镜下结构清楚，是凋亡区别于坏死的标志性改变。\n易混点：坏死以细胞肿胀、细胞膜破裂、核溶解和炎症反应为特点；凋亡以细胞皱缩、染色质边集、凋亡小体形成且无明显炎症为特点。记忆要点：看到“电镜下特征性”优先选“凋亡小体形成”。","chapter":1,"chapterName":"细胞和组织的适应与损伤","chapterTitle":"第1章 细胞和组织的适应与损伤"},{"id":"pathology-2a-single-0255","type":"single","typeLabel":"单选题","number":255,"question":"下列最符合鳞状细胞癌的特征的是","options":[{"key":"A","text":"发生于原有单层扁平上皮的覆盖部位"},{"key":"B","text":"呈外生性生长"},{"key":"C","text":"癌细胞的排列及形态仍保留单层扁平上皮的某些特征"},{"key":"D","text":"癌珠形成"},{"key":"E","text":"主要经淋巴道转移"}],"answerKeys":["C"],"answerText":["癌细胞的排列及形态仍保留单层扁平上皮的某些特征"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：鳞状细胞癌的组织学分化特征是癌细胞呈巢状排列，并保留鳞状上皮的形态学特征。\n解析：鳞状细胞癌是上皮来源的恶性肿瘤，癌细胞向鳞状上皮分化，常形成癌巢；高分化者可见细胞间桥和角化珠。判断鳞癌的关键不是生长方式或转移途径，而是癌细胞的排列及形态仍保留来源上皮的某些特征，因此C最符合。D所述癌珠仅见于高分化鳞癌，并非所有鳞癌均具有。\n选项分析：\nA. 错误：鳞癌多发生于复层扁平上皮覆盖部位或鳞状化生上皮，单层扁平上皮如间皮、内皮并非其典型来源。\nB. 错误：外生性生长可见于乳头状瘤、息肉及多种癌，并非鳞癌的特异性特征；鳞癌也可呈溃疡浸润性生长。\nC. 正确：鳞癌细胞向鳞状上皮分化，癌巢内细胞排列和形态保留来源上皮的某些特征，如复层排列倾向、细胞间桥及角化，这是诊断鳞癌的重要依据。\nD. 错误：癌珠即角化珠，是高分化的鳞癌常见形态，低分化鳞癌可无，不能作为所有鳞癌最普遍的特征。\nE. 错误：癌一般多经淋巴道转移，但这是多数癌的共同倾向，不能用于识别鳞癌；不同部位鳞癌的转移途径也可不同。\n易混点：癌珠提示高分化鳞癌，细胞间桥也是鳞癌分化的重要形态；外生性生长和淋巴道转移均为一般性描述，缺乏特异性。","chapter":6,"chapterName":"肿瘤","chapterTitle":"第6章 肿瘤"},{"id":"pathology-2a-single-0256","type":"single","typeLabel":"单选题","number":256,"question":"亚急性细菌性心内膜炎的特点除外下列哪项","options":[{"key":"A","text":"赘生物单个或多个，呈息肉状或菜花状"},{"key":"B","text":"多发生于原有病变的瓣膜上"},{"key":"C","text":"镜下表面有细菌团"},{"key":"D","text":"赘生物脱落引起动脉栓塞和血管炎"},{"key":"E","text":"外观污秽，质松软、灰黄、易脱落"}],"answerKeys":["C"],"answerText":["镜下表面有细菌团"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：亚急性感染性心内膜炎赘生物的组成及细菌分布特点，需与急性感染性心内膜炎鉴别。\n解析：亚急性感染性心内膜炎多侵犯原有病变的瓣膜，赘生物呈息肉状或菜花状，外观污秽、灰黄、质松软且易脱落，脱落后可引起动脉栓塞及血管炎。镜下赘生物由血小板、纤维素、坏死组织、炎细胞及细菌菌落构成，但亚急性者细菌量少，常位于赘生物深部，表面可无明显细菌团，故“镜下表面有细菌团”不是其特点。本题题眼是“亚急性”和“除外”，C项混淆了细菌团的位置及急性感染性心内膜炎大量细菌的特点。\n选项分析：\nA. 正确：亚急性感染性心内膜炎的赘生物可单个或多个，呈息肉状或菜花状，属于其形态特点。\nB. 正确：亚急性感染性心内膜炎多发生于已有风湿性心内膜炎、先天性瓣膜病等原有病变的瓣膜上。\nC. 错误：亚急性者赘生物内细菌较少且多位于深部，表面常无明显细菌团；表面大量细菌团更符合急性感染性心内膜炎。\nD. 正确：赘生物质松软、易脱落，可随血流引起动脉栓塞，并可伴免疫复合物相关血管炎。\nE. 正确：亚急性感染性心内膜炎赘生物肉眼呈污秽、灰黄、质松软、易脱落，符合其外观特点。\n易混点：急性感染性心内膜炎多侵犯正常瓣膜，赘生物大而松软，内含大量细菌；亚急性者多侵犯原有病变瓣膜，赘生物较小，细菌少且深在。记忆要点：亚急性“原有瓣膜、菜花状、少菌深在”；急性“正常瓣膜、大量细菌、易脱落”。","chapter":9,"chapterName":"心血管系统疾病","chapterTitle":"第9章 心血管系统疾病"},{"id":"pathology-2a-single-0257","type":"single","typeLabel":"单选题","number":257,"question":"引起急性弥漫增生性肾小球肾炎的致病抗原常来自","options":[{"key":"A","text":"乙型肝炎病毒"},{"key":"B","text":"葡萄球菌"},{"key":"C","text":"肺炎球菌"},{"key":"D","text":"溶血性链球菌"},{"key":"E","text":"麻疹病毒"}],"answerKeys":["D"],"answerText":["溶血性链球菌"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：急性弥漫增生性肾小球肾炎即急性链球菌感染后肾小球肾炎，致病抗原常来自溶血性链球菌。\n解析：本病多在咽部或皮肤A组β溶血性链球菌感染后1～3周发生，属于免疫复合物介导的肾小球损伤。链球菌抗原可形成循环免疫复合物沉积于肾小球，也可原位沉积，激活补体并吸引中性粒细胞，导致毛细血管内皮细胞和系膜细胞弥漫增生。镜下典型为肾小球体积增大、内皮及系膜细胞增生、中性粒细胞浸润，临床表现为急性肾炎综合征。本题题眼是“急性弥漫增生性肾小球肾炎”与“溶血性链球菌”的经典对应关系。\n选项分析：\nA. 错误：乙型肝炎病毒可引起乙肝病毒相关性肾炎，常见病理类型包括膜性肾病、膜增生性肾小球肾炎等，不是急性弥漫增生性肾小球肾炎的经典致病抗原。\nB. 错误：葡萄球菌感染偶可并发感染后或感染相关性肾小球肾炎，但本题所问的经典急性弥漫增生性肾小球肾炎致病抗原不是葡萄球菌。\nC. 错误：肺炎球菌可引起肺炎等感染，偶有感染后免疫性肾损害，但不是急性弥漫增生性肾小球肾炎最常考、最典型的致病抗原来源。\nD. 正确：A组β溶血性链球菌的致肾炎菌株感染是本病经典病因，尤其咽部感染或皮肤感染后，链球菌抗原参与免疫复合物形成并沉积于肾小球。\nE. 错误：麻疹病毒属于病毒感染，可引起其他系统病变或与某些肾小球轻微病变相关，但不是急性弥漫增生性肾小球肾炎的常见致病抗原。\n易混点：急性弥漫增生性肾小球肾炎以毛细血管内皮和系膜细胞增生为主，常有链球菌感染史；急进性肾小球肾炎以新月体形成为特征，进展快、肾衰竭早。记忆要点：急性弥漫增生性肾炎抓“链球菌感染后、毛细血管内增生、急性肾炎综合征”。","chapter":13,"chapterName":"泌尿系统疾病","chapterTitle":"第13章 泌尿系统疾病"},{"id":"pathology-2a-single-0258","type":"single","typeLabel":"单选题","number":258,"question":"下列哪项不是引起肾盂肾炎的主要诱因","options":[{"key":"A","text":"感染"},{"key":"B","text":"机体抵抗力下降"},{"key":"C","text":"尿路阻塞"},{"key":"D","text":"抗原抗体反应"},{"key":"E","text":"膀胱输尿管反流"}],"answerKeys":["D"],"answerText":["抗原抗体反应"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n\n核心考点：肾盂肾炎的病因与易感因素，重点是它与免疫介导性肾小球肾炎的鉴别。\n\n解析：肾盂肾炎是主要累及肾盂、肾盏和肾间质的化脓性炎症，最常见病原体为大肠杆菌，感染途径以上行性感染为主。尿路阻塞、膀胱输尿管反流可造成尿液潴留和细菌繁殖，机体抵抗力下降则降低局部防御能力，均属于重要诱因。抗原抗体反应不是肾盂肾炎的主要诱因，而主要参与免疫复合物介导的肾小球肾炎等疾病。本题题眼是“不是主要诱因”，应选免疫学机制相关的D。\n\n选项分析：\nA. 错误：感染是肾盂肾炎的主要致病因素，最常见为大肠杆菌等细菌感染，尤其上行性感染；因此它属于主要诱因，不是本题答案。\nB. 错误：机体抵抗力下降可削弱泌尿系统防御和局部吞噬功能，使细菌易于繁殖和上行，是肾盂肾炎的重要诱因。\nC. 错误：尿路阻塞可导致尿液潴留，形成细菌繁殖条件，并促进感染沿尿路向上蔓延，是肾盂肾炎的经典易感因素。\nD. 正确：抗原抗体反应主要与免疫介导的肾小球肾炎相关，如免疫复合物沉积引起肾小球损伤；它不是肾盂肾炎的主要诱因，故为本题答案。\nE. 错误：膀胱输尿管反流可使含菌尿液反流至肾盂、肾盏，是上行性肾盂肾炎的重要诱因，尤其与尿路结构异常有关。\n\n易混点：肾盂肾炎是感染性、化脓性间质性炎症，病变中心在肾盂、肾盏和肾间质；肾小球肾炎多为免疫介导，病变中心在肾小球。记忆要点是“肾盂肾炎看感染和尿路梗阻/反流，肾小球肾炎看免疫复合物”。","chapter":13,"chapterName":"泌尿系统疾病","chapterTitle":"第13章 泌尿系统疾病"},{"id":"pathology-2a-single-0259","type":"single","typeLabel":"单选题","number":259,"question":"晚期胃癌，最常发生转移的远处淋巴结为","options":[{"key":"A","text":"颈部"},{"key":"B","text":"腋窝"},{"key":"C","text":"腹股沟"},{"key":"D","text":"左锁骨上"},{"key":"E","text":"胃窦部小弯处"}],"answerKeys":["D"],"answerText":["左锁骨上"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：晚期胃癌经淋巴道转移时，最常累及的远处淋巴结为左锁骨上淋巴结，即Virchow淋巴结。\n解析：胃癌淋巴道转移最早多累及胃周局部淋巴结，晚期癌细胞可沿淋巴管经胸导管或淋巴干逆行播散至左锁骨上淋巴结，形成可触及的肿大淋巴结。该部位是胃癌远处淋巴道转移的经典部位，临床常作为判断胃癌晚期和远处转移的重要体征。本题题眼是“晚期胃癌”“最常发生转移的远处淋巴结”，应选左锁骨上而非胃周局部淋巴结。\n\n选项分析：\nA. 错误：颈部淋巴结转移可见于头颈部肿瘤等，胃癌虽可转移至颈部淋巴结，但最典型的远处淋巴结是左锁骨上淋巴结，不能笼统选“颈部”。\nB. 错误：腋窝淋巴结是乳腺癌等肿瘤常见的淋巴道转移部位，不是晚期胃癌最常转移的远处淋巴结。\nC. 错误：腹股沟淋巴结主要收集下肢、会阴及部分盆腔区域的淋巴回流，常见于下肢、外阴、肛管等部位肿瘤转移，与胃癌淋巴引流途径不符。\nD. 正确：胃癌细胞可经胸导管逆行进入左锁骨上淋巴结，形成Virchow淋巴结，是晚期胃癌最常发生的远处淋巴结转移部位，具有重要临床提示意义。\nE. 错误：胃窦部小弯处属于胃周局部淋巴结引流区域，是胃癌局部淋巴道转移的常见部位，不属于“远处淋巴结”，不符合题干要求。\n\n易混点：胃癌局部转移应先累及胃小弯、幽门上下等胃周淋巴结；左锁骨上淋巴结属于远处转移的经典部位。记忆要点：胃癌晚期远处淋巴结转移找“左锁骨上Virchow淋巴结”；腋窝想到乳腺癌，腹股沟想到下肢、会阴及盆腔肿瘤。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-2a-single-0260","type":"single","typeLabel":"单选题","number":260,"question":"下述哪种因素与血栓形成无关","options":[{"key":"A","text":"血管内膜损伤"},{"key":"B","text":"血小板数量增多"},{"key":"C","text":"血流缓慢"},{"key":"D","text":"癌细胞崩解产物"},{"key":"E","text":"纤溶酶增加"}],"answerKeys":["E"],"answerText":["纤溶酶增加"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n核心考点：血栓形成的条件（Virchow三要素）及纤溶系统对血栓的影响。\n解析：血栓形成主要与血管内皮损伤、血流状态改变和血液凝固性增高有关。血管内膜损伤可暴露内皮下胶原并激活血小板和凝血系统；血流缓慢有利于血小板边集和凝血因子局部浓集；血小板增多及癌细胞崩解产物均可促进高凝状态。纤溶酶的主要作用是降解纤维蛋白和纤维蛋白原，使血栓溶解，因此纤溶酶增加不是血栓形成的促进因素，反而有抗血栓作用。本题题眼是“无关”，应选与促血栓形成相反的因素。\n选项分析：\nA. 正确：血管内膜损伤是血栓形成的重要条件，可暴露内皮下胶原、激活血小板黏附聚集，并启动内源性和外源性凝血途径。\nB. 正确：血小板数量增多可增强血小板黏附、聚集和释放反应，使血液呈高凝倾向，促进血栓形成。\nC. 正确：血流缓慢可使血小板由轴流进入边流并易于黏附于内膜，同时使凝血因子局部浓度升高、内皮细胞缺氧，利于血栓形成。\nD. 正确：癌细胞崩解产物可释放组织因子或癌促凝物质，激活外源性凝血途径，引起高凝状态、游走性血栓性静脉炎或DIC，故与血栓形成有关。\nE. 错误：纤溶酶增加可溶解纤维蛋白，促进血栓溶解，属于抗血栓因素，与血栓形成无促进关系，故为本题正确答案。\n易混点：癌细胞崩解产物既可通过促凝物质引起血栓形成，又可继发纤溶亢进，但“纤溶酶增加”本身是溶解血栓的方向。记忆要点：血栓形成看“内皮损伤、血流缓慢、高凝”；纤溶酶是“溶栓”而非“促栓”。","chapter":3,"chapterName":"局部血液循环障碍","chapterTitle":"第3章 局部血液循环障碍"},{"id":"pathology-2a-single-0261","type":"single","typeLabel":"单选题","number":261,"question":"表达AFP最强的癌是","options":[{"key":"A","text":"卵巢癌"},{"key":"B","text":"肝癌"},{"key":"C","text":"结肠癌"},{"key":"D","text":"子宫内膜癌"},{"key":"E","text":"胃癌"}],"answerKeys":["B"],"answerText":["肝癌"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：甲胎蛋白（AFP）在原发性肝细胞癌中的表达及其诊断价值。\n解析：AFP是胚胎期肝细胞和卵黄囊细胞合成的糖蛋白，出生后血清水平迅速下降。原发性肝细胞癌可重新表达AFP，且在各选项中表达最强、最具代表性，故血清AFP持续升高是肝细胞癌的重要诊断和复发监测指标。本题题眼是“表达AFP最强”，应首选肝细胞癌；考试中常将AFP与肝癌、CEA与结直肠癌、CA125与卵巢癌等标志物对应记忆。\n\n选项分析：\nA. 错误：卵巢癌中的卵巢卵黄囊瘤等生殖细胞肿瘤可表达AFP，但普通卵巢上皮性癌不以AFP最强表达为特点，且题干未特指卵黄囊瘤，不能作为“最强”答案。\nB. 正确：原发性肝细胞癌由肝细胞来源，可合成AFP，免疫组化常呈AFP阳性，血清AFP升高也是其重要临床联系，符合“表达AFP最强”的题眼。\nC. 错误：结肠癌常用的肿瘤标志物是CEA，部分可有其他标志物升高，但AFP不是其代表性最强表达产物，不能选。\nD. 错误：子宫内膜癌常见标志物包括CA125等，AFP并非其特异或最强表达标志物，与肝癌相比无诊断代表性。\nE. 错误：胃癌可检测CEA、CA19-9等，少数可产生AFP（AFP阳性胃癌），但总体表达强度和考试对应关系均不及肝细胞癌，故不选。\n\n易混点：AFP升高并非肝癌独有，卵黄囊瘤、部分生殖细胞肿瘤及少数胃癌也可升高；但病理学选择题中“AFP最强的癌”通常指原发性肝细胞癌。记忆要点：肝癌—AFP，结直肠癌—CEA，卵巢癌—CA125，胃癌—CEA/CA19-9。","chapter":6,"chapterName":"肿瘤","chapterTitle":"第6章 肿瘤"},{"id":"pathology-2a-single-0262","type":"single","typeLabel":"单选题","number":262,"question":"下列哪一项不符合肺动脉高压形成的机制","options":[{"key":"A","text":"缺氧引起肺小动脉痉挛"},{"key":"B","text":"长期、反复痉挛导致肺小动脉玻璃样变"},{"key":"C","text":"肺内无肌性细动脉肌化"},{"key":"D","text":"肺纤维化及肺气肿可引起肺动脉高压"},{"key":"E","text":"肌型小动脉中膜肥厚，内膜下出现纵形肌束"}],"answerKeys":["B"],"answerText":["长期、反复痉挛导致肺小动脉玻璃样变"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：肺动脉高压的血管重构机制及形态学改变。\n解析：肺动脉高压形成的关键环节包括缺氧性肺小动脉痉挛、肺血管床减少和慢性血管重构。长期、反复痉挛可引起肺小动脉中膜肥厚、无肌性细动脉肌化、内膜纤维化及纵形肌束形成，而不是典型的“玻璃样变”。本题题眼是“不符合”，B项把肺动脉高压的慢性血管改变误写成玻璃样变，故为错误项。\n选项分析：\nA. 正确：缺氧可直接引起肺小动脉痉挛，是缺氧性肺动脉高压的重要起始机制，长期可促进血管重构。\nB. 错误：长期、反复痉挛主要导致肺小动脉中膜肥厚、肌化、内膜纤维化等重构改变；玻璃样变多见于良性高血压细小动脉、糖尿病微血管病变或慢性肺淤血等，不是肺动脉高压形成的典型机制表述。\nC. 正确：肺内无肌性细动脉肌化是慢性肺动脉高压的典型血管重构表现，可使血管壁增厚、管腔狭窄。\nD. 正确：肺纤维化和肺气肿可破坏肺毛细血管床、引起缺氧和肺血管收缩，并可导致肺动脉高压，进而发展为肺源性心脏病。\nE. 正确：肌型小动脉中膜肥厚、内膜下出现纵形肌束，属于慢性肺动脉高压时肺血管重构的形态学改变。\n易混点：肺动脉高压的血管改变记忆为“痉挛—肌化—中膜肥厚—内膜纤维化/纵形肌束”，不要与“细小动脉玻璃样变”混淆；后者常提示高血压或糖尿病等微血管病变。肺气肿引起肺动脉高压的核心是缺氧性肺血管收缩和肺血管床减少。","chapter":10,"chapterName":"呼吸系统疾病","chapterTitle":"第10章 呼吸系统疾病"},{"id":"pathology-2a-single-0263","type":"single","typeLabel":"单选题","number":263,"question":"下列哪项不是原发性肺结核病的特点","options":[{"key":"A","text":"初次感染"},{"key":"B","text":"儿童多见"},{"key":"C","text":"原发综合征"},{"key":"D","text":"支气管播散"},{"key":"E","text":"大多可自愈"}],"answerKeys":["D"],"answerText":["支气管播散"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：原发性肺结核病的典型临床病理特点及与继发性肺结核的鉴别。\n解析：原发性肺结核是机体首次感染结核分枝杆菌后发生的肺结核，多见于儿童，典型病变为原发综合征，即肺原发灶、结核性淋巴管炎和肺门淋巴结结核三者构成，X线可呈“哑铃状”。本病多数经纤维化、钙化而自愈，仅少数可进展或经血道、淋巴道播散。题眼是“不是原发性肺结核病的特点”，经支气管播散是继发性肺结核的典型播散方式，故D错误。\n选项分析：\nA. 正确：初次感染是原发性肺结核的基本含义，指结核分枝杆菌首次进入机体后引起的病变。\nB. 正确：儿童免疫功能尚未充分建立，初次感染后较易形成原发性肺结核，故儿童多见。\nC. 正确：原发综合征由肺原发灶、结核性淋巴管炎和肺门淋巴结结核组成，是原发性肺结核的特征性病变。\nD. 错误：支气管播散多见于继发性肺结核，尤其是空洞型肺结核，干酪样坏死物经支气管排出时含菌物质沿气道播散；原发性肺结核主要经淋巴道和血道播散。\nE. 正确：大多数原发性肺结核经纤维化和钙化而自愈，临床可无明显症状，仅结核菌素试验转为阳性。\n易混点：原发性肺结核以原发综合征、淋巴道和血道播散、多可自愈为记忆要点；继发性肺结核好发于肺尖、病变复杂多样、易形成空洞并常经支气管播散，且不易自愈。血道播散可致粟粒性肺结核，不要与支气管播散混淆。","chapter":18,"chapterName":"传染病","chapterTitle":"第18章 传染病"},{"id":"pathology-2a-single-0264","type":"single","typeLabel":"单选题","number":264,"question":"大叶性肺炎肉质变是因为","options":[{"key":"A","text":"局部组织缺血"},{"key":"B","text":"纤维素渗出较多"},{"key":"C","text":"机体抵抗力降低"},{"key":"D","text":"中性粒细胞数量过少"},{"key":"E","text":"合并其他细菌感染"}],"answerKeys":["D"],"answerText":["中性粒细胞数量过少"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：大叶性肺炎肉质变的发生机制是中性粒细胞渗出过少，纤维素性渗出物不能被充分溶解吸收而发生机化。\n解析：大叶性肺炎本质为肺泡内弥漫性纤维素性炎。病变进入灰色肝样变期后，若中性粒细胞数量过少，释放的蛋白水解酶不足，肺泡腔内纤维素渗出物不能溶解吸收，肉芽组织长入并将其机化，肺组织变硬呈肉样，称肺肉质变，也称机化性肺炎。本题题眼是“肉质变”与“中性粒细胞过少导致纤维素溶解障碍”的关系。\n选项分析：\nA. 错误：局部组织缺血主要见于肺梗死等缺血性坏死，不是大叶性肺炎肉质变的直接机制。\nB. 错误：纤维素渗出较多是形成纤维素性炎的基础，但肉质变的关键是纤维素未能被溶解吸收；若中性粒细胞充足，纤维素可被蛋白水解酶溶解。\nC. 错误：机体抵抗力降低可促使感染加重、扩散或迁延，但不是纤维素渗出物机化的直接原因。\nD. 正确：中性粒细胞过少使纤维蛋白溶解酶和蛋白水解酶不足，纤维素渗出物不能被溶解清除，继而由肉芽组织机化，形成肺肉质变。\nE. 错误：合并其他细菌感染常引起化脓、肺脓肿或病程迁延，不是肉质变的定义性机制。\n易混点：肺肉质变强调“纤维素性渗出物机化”，不是肺缺血坏死；记忆要点为“大叶性肺炎＋中性粒细胞少＋纤维素未溶解→肉芽组织机化→肺变硬如肉”。灰色肝样变期以纤维素和中性粒细胞渗出为主，而肉质变是其后机化结局。","chapter":10,"chapterName":"呼吸系统疾病","chapterTitle":"第10章 呼吸系统疾病"},{"id":"pathology-2a-single-0265","type":"single","typeLabel":"单选题","number":265,"question":"下列哪项不是真性肿瘤","options":[{"key":"A","text":"白血病"},{"key":"B","text":"动脉瘤"},{"key":"C","text":"蕈样肉芽肿"},{"key":"D","text":"霍奇金淋巴瘤"},{"key":"E","text":"鲍温病"}],"answerKeys":["B"],"answerText":["动脉瘤"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：真性肿瘤的本质是肿瘤细胞的克隆性异常增生，而动脉瘤属于血管壁扩张性病变，并非肿瘤。\n解析：真性肿瘤由具有自主性、克隆性增殖能力的肿瘤细胞构成，可为良性或恶性。动脉瘤是血管壁结构薄弱或损伤后形成的局限性病理性扩张，可发生于主动脉等部位，本质是血管病变而非肿瘤性增生。本题题眼在于识别名称中带“瘤”“病”“肉芽肿”等字样但并非真性肿瘤的病变；其余选项均属造血系统或皮肤恶性肿瘤。\n\n选项分析：\nA. 错误：白血病是造血系统恶性肿瘤，白血病细胞在骨髓和血液中克隆性增生，属于真性肿瘤，只是常不形成实体肿块。\nB. 正确：动脉瘤是动脉壁病理性扩张，可因动脉粥样硬化、感染、先天因素等引起，并非肿瘤细胞增生，因此不是真性肿瘤。\nC. 错误：蕈样肉芽肿虽然名称中有“肉芽肿”，实际是皮肤T细胞淋巴瘤，属于恶性淋巴瘤，是真性肿瘤。\nD. 错误：霍奇金淋巴瘤是起源于淋巴造血系统的恶性肿瘤，具有特征性R-S细胞，属于真性肿瘤。\nE. 错误：鲍温病是表皮内原位鳞状细胞癌，属于皮肤恶性肿瘤，病变局限于表皮内，尚未突破基底膜，但仍是真性肿瘤。\n\n易混点：名称带“瘤”不等于肿瘤，如动脉瘤、炎性假瘤、结核性肉芽肿等属于瘤样病变或炎症性病变；而蕈样肉芽肿名称带“肉芽肿”，实为T细胞淋巴瘤。记忆要点：判断真性肿瘤要看是否有肿瘤细胞的克隆性增生，不能只看名称。","chapter":6,"chapterName":"肿瘤","chapterTitle":"第6章 肿瘤"},{"id":"pathology-2a-single-0266","type":"single","typeLabel":"单选题","number":266,"question":"急性普通型肝炎的病变特点是","options":[{"key":"A","text":"肝细胞广泛变性，坏死严重"},{"key":"B","text":"肝细胞广泛变性，炎细胞浸润明显"},{"key":"C","text":"肝细胞广泛变性，坏死轻微"},{"key":"D","text":"肝细胞广泛变性，淤胆明显"},{"key":"E","text":"肝细胞广泛变性，Kupffer细胞增生活跃"}],"answerKeys":["C"],"answerText":["肝细胞广泛变性，坏死轻微"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：急性普通型肝炎以肝细胞广泛变性、坏死轻微为基本病变特点，坏死多为点状坏死。\n解析：急性普通型肝炎时，肝细胞广泛发生胞质疏松化和气球样变，部分可见嗜酸性变；坏死轻微，通常为散在点状坏死。汇管区及小叶内可有轻度炎细胞浸润，Kupffer细胞也可增生，但考试最特征性的表述是“广泛变性、坏死轻微”。题眼在“急性普通型”，需与重型肝炎的严重坏死相区分。\n\n选项分析：\nA. 错误：肝细胞广泛变性伴坏死严重不符合急性普通型；坏死严重、大片或亚大块坏死主要见于急性重型或亚急性重型肝炎。\nB. 错误：急性普通型可有炎细胞浸润，但通常为轻度，并非“浸润明显”作为主要特点；明显炎细胞浸润更可见于慢性肝炎等活动性炎症病变。\nC. 正确：肝细胞广泛水肿变性，坏死轻微并呈点状坏死，是急性普通型肝炎的典型病理特点，临床可有肝大、压痛及ALT升高。\nD. 错误：淤胆明显主要见于胆汁淤积性肝炎、药物性胆汁淤积或胆道梗阻等，表现为毛细胆管胆栓形成，不是急性普通型肝炎的主要特点。\nE. 错误：Kupffer细胞增生可见于病毒性肝炎，但“增生活跃”不是急性普通型肝炎最具诊断意义的病变；本题强调肝细胞广泛变性而坏死轻微。\n\n易混点：急性普通型记住“广泛气球样变＋点状坏死”；重型肝炎记住“大片/亚大块坏死”；慢性肝炎常伴汇管区炎症、碎片状坏死及纤维化。不要因见到炎细胞或Kupffer细胞增生就忽略“坏死轻微”这一关键。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-2a-single-0267","type":"single","typeLabel":"单选题","number":267,"question":"下列哪一类型的肝炎易演变为坏死后性肝硬化","options":[{"key":"A","text":"急性黄疸性肝炎"},{"key":"B","text":"急性普通肝炎"},{"key":"C","text":"慢性活动性肝炎"},{"key":"D","text":"亚急性重型肝炎"},{"key":"E","text":"慢性持续性肝炎"}],"answerKeys":["D"],"answerText":["亚急性重型肝炎"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：坏死后性肝硬化多由亚急性重型肝炎引起，其病理基础是肝细胞亚大块/大块坏死及网状支架塌陷。\n解析：亚急性重型肝炎时肝细胞发生广泛坏死，坏死区网状纤维支架塌陷，随后纤维组织大量增生并包绕再生的肝细胞团，形成宽大纤维间隔和大而不规则的再生结节，最终演变为坏死后性肝硬化。坏死后性肝硬化的肉眼特点是肝体积缩小、表面呈大小不等结节，镜下见宽大纤维间隔及大结节，题眼是“坏死后性”，对应严重坏死后的支架塌陷和瘢痕形成。\n\n选项分析：\nA. 错误：急性黄疸性肝炎属于急性普通型肝炎的临床类型，病变以肝细胞水肿、气球样变和点状坏死为主，网状支架完整，通常可完全修复，不演变为坏死后性肝硬化。\nB. 错误：急性普通性肝炎以肝细胞变性、点状坏死为主，坏死范围小，不造成广泛支架塌陷，预后多数良好，不形成坏死后性肝硬化。\nC. 错误：慢性活动性肝炎可伴界面炎和纤维化，可进展为肝硬化，但其典型病变不是亚大块坏死后的支架塌陷和大结节形成；与亚急性重型肝炎相比，不是本题所指坏死后性肝硬化的最典型来源。\nD. 正确：亚急性重型肝炎有亚大块乃至大块肝坏死，网状支架塌陷，纤维组织增生形成宽大间隔，再生结节大而不规则，故易演变为坏死后性肝硬化。\nE. 错误：慢性持续性肝炎旧称，炎症程度轻，无明显界面炎，进展缓慢，一般不发展为肝硬化，更不会典型演变为坏死后性肝硬化。\n\n易混点：门脉性肝硬化多由慢性病毒性肝炎、酒精等引起，结节较小而均匀；坏死后性肝硬化则强调严重肝坏死后的支架塌陷，结节大而不规则、纤维间隔宽。记忆要点是“亚急性重型肝炎—亚大块坏死—支架塌陷—坏死后性肝硬化”。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-2a-single-0268","type":"single","typeLabel":"单选题","number":268,"question":"急性肾小球肾炎的病变是","options":[{"key":"A","text":"纤维素性炎"},{"key":"B","text":"变态反应性炎"},{"key":"C","text":"变质性炎"},{"key":"D","text":"化脓性炎"},{"key":"E","text":"增生性炎"}],"answerKeys":["B"],"answerText":["变态反应性炎"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：急性肾小球肾炎本质是免疫复合物介导的变态反应性炎症。\n解析：急性肾小球肾炎多发生于链球菌感染后1～3周，由循环免疫复合物或原位免疫复合物沉积于肾小球引起，故属于变态反应性炎。镜下典型表现为双侧肾小球弥漫性毛细血管内皮细胞和系膜细胞增生，并伴中性粒细胞浸润，免疫荧光可见IgG、C3呈颗粒状沉积，电镜下可见上皮下“驼峰状”沉积物。题眼是“急性肾小球肾炎的炎症性质”，应抓住其免疫复合物介导机制，而不能仅按其增生形态归类。\n选项分析：\nA. 错误：纤维素性炎以纤维蛋白原渗出并形成纤维素为特点，常见于大叶性肺炎、细菌性痢疾、风湿性心包炎等，不是急性肾小球肾炎的病变本质。\nB. 正确：急性肾小球肾炎由免疫复合物沉积激活补体、招引炎症细胞引起，属于变态反应性炎，符合标准答案。\nC. 错误：变质性炎以实质细胞变性、坏死为主，常见于病毒性肝炎、流行性乙型脑炎、阿米巴病等，急性肾小球肾炎不以变质为主。\nD. 错误：化脓性炎由化脓菌直接感染引起，常见于脓肿、急性阑尾炎、化脓性脑膜炎等；急性肾小球肾炎虽可有中性粒细胞浸润，但不是化脓性炎。\nE. 错误：急性肾小球肾炎镜下确有内皮细胞和系膜细胞增生，但“增生性炎”只描述形态改变，不能说明其免疫复合物介导的变态反应性本质，作为本题单选答案不准确。\n易混点：急性肾小球肾炎的“增生”是肾小球病理形态描述，而“变态反应性炎”是其病因发病学分类，二者不能混为一谈。记忆要点：链球菌感染后、免疫复合物沉积、C3下降、上皮下驼峰状沉积，本质为变态反应性炎。","chapter":13,"chapterName":"泌尿系统疾病","chapterTitle":"第13章 泌尿系统疾病"},{"id":"pathology-2a-single-0269","type":"single","typeLabel":"单选题","number":269,"question":"下列哪种炎症介质不具有对白细胞的阳性趋化作用","options":[{"key":"A","text":"白细胞三烯"},{"key":"B","text":"IL-8"},{"key":"C","text":"IL-5"},{"key":"D","text":"TNF"},{"key":"E","text":"缓激肽"}],"answerKeys":["E"],"answerText":["缓激肽"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n核心考点：炎症介质的趋化作用及各类介质的主要生物学效应，尤其是缓激肽的血管活性作用而非白细胞趋化作用。\n解析：阳性趋化作用是指炎症介质吸引白细胞定向游走至炎症灶。LTB4、IL-8、IL-5及TNF均能通过不同环节促进白细胞趋化和/或募集；而缓激肽属于激肽系统，主要引起微血管扩张、通透性增高、平滑肌收缩和疼痛，不具有直接吸引白细胞的阳性趋化作用。本题题眼是“不具有阳性趋化作用”，应选以血管效应为主的缓激肽。\n\n选项分析：\nA. 错误：白细胞三烯中的LTB4是强趋化因子，可趋化中性粒细胞和单核细胞，并促进白细胞黏附、脱颗粒；半胱氨酰白三烯则主要参与支气管收缩和血管通透性增高。\nB. 错误：IL-8即CXCL8，属CXC趋化因子，对中性粒细胞有强趋化作用，并可促进其脱颗粒和呼吸爆发。\nC. 错误：IL-5是嗜酸性粒细胞趋化、活化、分化和存活的重要细胞因子，参与寄生虫感染及变态反应性炎症。\nD. 错误：TNF可激活内皮细胞、上调黏附分子并诱导趋化因子产生，促进中性粒细胞和单核细胞向炎症部位募集，具有促进白细胞趋化和激活的作用。\nE. 正确：缓激肽由激肽释放酶作用于激肽原生成，主要使血管扩张、通透性增加、平滑肌收缩并致痛，不直接对白细胞产生阳性趋化作用。\n\n易混点：C5a是强趋化因子，可趋化中性粒细胞和单核细胞；C3a趋化作用较弱，主要参与过敏毒素反应。LTB4趋化白细胞，而LTC4、LTD4、LTE4主要引起支气管平滑肌收缩和血管通透性增高。记忆要点：缓激肽、组胺主要“扩血管、增通透、致痛”，趋化作用主要记C5a、LTB4、IL-8及细菌产物等。","chapter":4,"chapterName":"炎症","chapterTitle":"第4章 炎症"},{"id":"pathology-2a-single-0270","type":"single","typeLabel":"单选题","number":270,"question":"葡萄状肉瘤是指","options":[{"key":"A","text":"侵蚀性葡萄胎"},{"key":"B","text":"葡萄胎"},{"key":"C","text":"绒毛膜癌"},{"key":"D","text":"脂肪肉瘤的一种类型"},{"key":"E","text":"横纹肌肉瘤的一种类型"}],"answerKeys":["E"],"answerText":["横纹肌肉瘤的一种类型"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n核心考点：葡萄状肉瘤是横纹肌肉瘤的一种特殊类型，属于胚胎性横纹肌肉瘤的葡萄状亚型。\n解析：葡萄状肉瘤（botryoid rhabdomyosarcoma）并非独立于横纹肌肉瘤之外的新肿瘤，而是胚胎性横纹肌肉瘤发生在黏膜下时形成的息肉样、葡萄串状亚型。好发于婴幼儿和儿童的阴道、膀胱、胆道等被覆黏膜的腔道器官，肉眼呈多发息肉样或葡萄状突起；镜下肿瘤细胞在黏膜下密集形成“形成层”（cambium layer），由小圆形或梭形横纹肌母细胞组成，可见横纹肌分化。题眼是“葡萄状”描述的是肿瘤大体形态，而不是妊娠滋养细胞疾病中的“葡萄胎”样病变。\n选项分析：\nA. 错误：侵蚀性葡萄胎属于妊娠滋养细胞疾病，是葡萄胎组织侵入子宫肌层所致，虽可呈葡萄状水泡，但本质不是肉瘤，也不属于横纹肌肉瘤。\nB. 错误：葡萄胎是良性妊娠滋养细胞疾病，表现为绒毛水肿呈葡萄串状，但它是胎盘绒毛病变，不是软组织肿瘤，更不是横纹肌肉瘤。\nC. 错误：绒毛膜癌是高度恶性的妊娠滋养细胞肿瘤，常继发于葡萄胎、流产或足月产，镜下为滋养细胞增生伴出血坏死，无绒毛结构，与葡萄状肉瘤无关。\nD. 错误：脂肪肉瘤是脂肪组织来源的恶性软组织肿瘤，常见类型包括高分化、去分化、黏液样和多形性脂肪肉瘤等，不存在“葡萄状肉瘤”这一脂肪肉瘤类型。\nE. 正确：葡萄状肉瘤是横纹肌肉瘤的一种类型，属于胚胎性横纹肌肉瘤的葡萄状亚型，好发于婴幼儿腔道黏膜下，呈葡萄状息肉样生长。\n易混点：名称中“葡萄”易与葡萄胎、侵蚀性葡萄胎混淆，但后两者属于妊娠滋养细胞疾病；葡萄状肉瘤是横纹肌肉瘤的形态学亚型。记忆要点：葡萄状肉瘤看“横纹肌”，好发婴幼儿腔道黏膜，镜下找黏膜下形成层。","chapter":6,"chapterName":"肿瘤","chapterTitle":"第6章 肿瘤"},{"id":"pathology-2a-single-0271","type":"single","typeLabel":"单选题","number":271,"question":"下述哪种疾病属出血性炎","options":[{"key":"A","text":"病毒性肝炎"},{"key":"B","text":"肠阿米巴病"},{"key":"C","text":"流行性脑脊髓膜炎"},{"key":"D","text":"钩端螺旋体病"},{"key":"E","text":"丹毒"}],"answerKeys":["D"],"answerText":["钩端螺旋体病"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：出血性炎是以大量红细胞漏出为突出表现的渗出性炎，钩端螺旋体病是其代表性疾病之一。\n解析：钩端螺旋体病的病原体及其毒素可损伤血管内皮细胞，使血管壁通透性显著增高，导致广泛出血；病变常累及肺、肝、肾等，肺弥漫性出血是重要死因。题眼是“出血性炎”强调炎症渗出物中以红细胞大量漏出为主，而非以化脓、纤维素渗出或实质细胞变性坏死为主。\n\n选项分析：\nA. 错误：病毒性肝炎的基本病变是肝细胞变性、坏死，伴炎症细胞浸润，属于变质性炎；可有出血倾向，但炎症分类不是出血性炎。\nB. 错误：肠阿米巴病以组织溶解坏死、形成烧瓶状溃疡为特点，炎症反应轻微，属于变质性炎；果酱样便虽含血，但不是以广泛出血为分类依据的出血性炎。\nC. 错误：流行性脑脊髓膜炎是脑脊髓膜的化脓性炎，蛛网膜下腔有大量中性粒细胞渗出和脓性分泌物，不是出血性炎。\nD. 正确：钩端螺旋体病可广泛损伤血管内皮，引起皮肤、黏膜、肺等出血，肺弥漫性出血尤其典型，符合出血性炎的病理特点。\nE. 错误：丹毒是溶血性链球菌引起的皮肤及网状淋巴管急性炎症，表现为边界清楚的红、肿、热、痛，可伴淋巴管炎，但不以红细胞大量漏出为突出病变，不属于出血性炎。\n\n易混点：病毒性肝炎、肠阿米巴病常归为变质性炎；流脑为化脓性炎；钩端螺旋体病和流行性出血热才常作为出血性炎代表。记忆要点：出血性炎看“红细胞大量漏出”，钩体病肺弥漫性出血是高频题眼。","chapter":4,"chapterName":"炎症","chapterTitle":"第4章 炎症"},{"id":"pathology-2a-single-0272","type":"single","typeLabel":"单选题","number":272,"question":"急性重型肝炎大量肝细胞溶解坏死可导致以下各项，除了","options":[{"key":"A","text":"胆红素大量入血"},{"key":"B","text":"肝细胞性黄疸"},{"key":"C","text":"凝血因子合成障碍"},{"key":"D","text":"肝细胞再生"},{"key":"E","text":"肝性脑病"}],"answerKeys":["D"],"answerText":["肝细胞再生"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n\n核心考点：急性重型肝炎以肝细胞广泛大片溶解坏死、肝功能急剧衰竭为特征，肝细胞再生不明显，而亚急性重型肝炎才常见结节状肝细胞再生。\n\n解析：急性重型肝炎时，肝细胞发生弥漫性大片坏死，导致肝细胞摄取、结合和排泄胆红素功能障碍，故可出现肝细胞性黄疸；坏死使肝细胞内的胆红素及未结合胆红素大量入血。肝细胞是合成凝血因子的重要场所，大量坏死可致凝血因子合成障碍和出血倾向；同时肝功能衰竭、氨代谢障碍可诱发肝性脑病。本型病程短、坏死广泛，网状支架塌陷，肝细胞再生常不明显，因此“肝细胞再生”不是急性重型肝炎大量肝细胞溶解坏死的典型结果。题眼是急性重型肝炎的“大片坏死、再生不明显”。\n\n选项分析：\nA. 正确：大量肝细胞坏死可释放胆红素，且肝脏对胆红素的摄取、结合和排泄障碍，使胆红素大量入血。\nB. 正确：肝细胞广泛坏死导致胆红素代谢障碍，可出现肝细胞性黄疸。\nC. 正确：肝细胞合成凝血因子减少，导致凝血功能障碍，是肝功能衰竭的重要表现。\nD. 错误：急性重型肝炎因病程短、坏死广泛、网状支架塌陷，肝细胞再生常不明显；明显肝细胞再生更符合亚急性重型肝炎。\nE. 正确：肝功能急剧衰竭时，氨等毒性物质不能有效代谢，可发生肝性脑病。\n\n易混点：急性重型肝炎与亚急性重型肝炎的鉴别是常考点。急性重型肝炎为大片坏死且肝细胞再生不明显；亚急性重型肝炎为大片坏死伴结节状肝细胞再生，可逐渐发展为坏死后性肝硬化。记忆要点：急性重型“坏死重、再生少、病程急”。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-2a-single-0273","type":"single","typeLabel":"单选题","number":273,"question":"子宫内膜腺上皮的核下空泡出现在月经周期的","options":[{"key":"A","text":"11～14天"},{"key":"B","text":"24～28天"},{"key":"C","text":"20～23天"},{"key":"D","text":"16～17天"},{"key":"E","text":"17～19天"}],"answerKeys":["D"],"answerText":["16～17天"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：子宫内膜腺上皮核下空泡是早期分泌期的特征性形态学标志，对应月经周期第16～17天。\n解析：以28天月经周期、第14天排卵为基准，排卵后孕激素作用使腺上皮合成糖原，糖原首先积聚在细胞核下方，形成核下空泡。镜下可见腺体轻度弯曲，腺上皮细胞核下出现排列较整齐的透明空泡，为判断排卵后早期分泌期的重要依据。题眼是“核下空泡”，其出现时间即周期第16～17天。\n选项分析：\nA. 错误：11～14天属于增生晚期，子宫内膜腺体弯曲、腺上皮核分裂活跃，受雌激素作用，尚无明显核下空泡。\nB. 错误：24～28天属于分泌晚期及月经前期，腺体高度分泌、分泌物溢出，间质水肿及蜕膜样变，核下空泡已消失。\nC. 错误：20～23天属于分泌中期，腺腔内分泌物明显，核下空泡已不明显，可见核上空泡及分泌物。\nD. 正确：16～17天为排卵后早期分泌期，孕激素促使糖原在腺上皮核下积聚，形成典型核下空泡。\nE. 错误：17～19天核下空泡逐渐明显或开始向核上移动，至19天前后核上空泡和腺腔分泌更突出，故不是“核下空泡出现”的最佳时间点。\n易混点：核下空泡提示早期分泌期，核上空泡及腔内分泌物提示分泌中晚期；增生期主要表现为腺体弯曲和核分裂活跃。记忆要点：排卵后第2～3天看“核下空泡”，即周期第16～17天。","chapter":14,"chapterName":"生殖系统和乳腺疾病","chapterTitle":"第14章 生殖系统和乳腺疾病"},{"id":"pathology-2a-single-0274","type":"single","typeLabel":"单选题","number":274,"question":"关于干酪样肺炎的叙述，下列哪项是正确的","options":[{"key":"A","text":"是原发性肺结核的一种常见类型"},{"key":"B","text":"多由急、慢性空洞内的结核杆菌经血道播散所致"},{"key":"C","text":"可由浸润型肺结核恶化、进展而来"},{"key":"D","text":"病变性质为富含脂质的化脓性炎"},{"key":"E","text":"常发生在免疫力强或变态反应低的患者"}],"answerKeys":["C"],"answerText":["可由浸润型肺结核恶化、进展而来"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：干酪样肺炎是继发性肺结核的严重类型，多由浸润型肺结核恶化进展或空洞内结核杆菌经支气管播散引起。\n解析：干酪样肺炎的发生与机体免疫力低下、变态反应增强有关，肺内出现大范围渗出、坏死，并伴明显干酪样坏死，可呈小叶性或大叶性实变。题眼在“可由浸润型肺结核恶化、进展而来”，这是继发性肺结核进展为干酪样肺炎的重要途径；空洞内结核杆菌主要经支气管播散，而不是经血道播散。\n选项分析：\nA. 错误：干酪样肺炎不是原发性肺结核的常见类型，原发性肺结核典型为原发综合征；干酪样肺炎属于继发性肺结核中的严重进展型。\nB. 错误：急、慢性空洞内结核杆菌主要经支气管播散，引起同侧或对侧肺内播散；经血道播散主要导致粟粒性肺结核等血行播散性结核。\nC. 正确：浸润型肺结核在机体抵抗力下降时可恶化、进展，出现大片干酪样坏死和渗出，形成干酪样肺炎。\nD. 错误：干酪样肺炎的本质是结核性渗出和干酪样坏死，不是富含脂质的化脓性炎；化脓性炎以中性粒细胞和脓液形成为特点。\nE. 错误：干酪样肺炎常发生于免疫力低下、变态反应增强的患者，而不是免疫力强或变态反应低者。\n易混点：干酪样坏死不等于化脓性炎；干酪样肺炎可源于浸润型肺结核恶化或空洞经支气管播散，血道播散应想到粟粒性肺结核。记忆要点：继发性肺结核、免疫力低、大片干酪样坏死、支气管播散。","chapter":18,"chapterName":"传染病","chapterTitle":"第18章 传染病"},{"id":"pathology-2a-single-0275","type":"single","typeLabel":"单选题","number":275,"question":"来源于三个胚层组织的肿瘤称","options":[{"key":"A","text":"癌肉瘤"},{"key":"B","text":"混合瘤"},{"key":"C","text":"畸胎瘤"},{"key":"D","text":"错构瘤"},{"key":"E","text":"胚胎瘤"}],"answerKeys":["C"],"answerText":["畸胎瘤"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：畸胎瘤是由多能生殖细胞或胚胎残余组织发生的肿瘤，瘤内可含两个以上、常为三个胚层的组织成分。\n解析：畸胎瘤的本质是肿瘤内出现来源于外胚层、中胚层和内胚层的成熟或未成熟组织，因此题干“来源于三个胚层组织”是典型题眼。好发于卵巢、睾丸，也可发生于纵隔、骶尾部等中线部位；肉眼常呈囊实性，可见毛发、皮脂、骨、牙等，镜下可见皮肤及附属器、呼吸道上皮、软骨、骨、神经等多种成分。成熟畸胎瘤多为良性，未成熟畸胎瘤含原始神经上皮等未成熟成分，恶性潜能较高。\n选项分析：\nA. 错误：癌肉瘤是恶性混合性肿瘤，含恶性上皮成分（癌）和恶性间叶成分（肉瘤），表现为双向分化，并非来源于三个胚层组织。\nB. 错误：混合瘤泛指含两种或两种以上组织成分的肿瘤，如涎腺多形性腺瘤，常由上皮和间叶样成分构成，不等于三个胚层来源。\nC. 正确：畸胎瘤可含外胚层、中胚层和内胚层衍生物，符合“来源于三个胚层组织”的定义，是本题标准答案。\nD. 错误：错构瘤是局部正常组织在异常部位排列紊乱形成的瘤样畸形，并非真正肿瘤，也不以三个胚层组织为特征。\nE. 错误：胚胎瘤多指由胚胎性未分化组织构成的肿瘤，如肾母细胞瘤、神经母细胞瘤、胚胎性横纹肌肉瘤等，强调胚胎性组织形态，不强调三个胚层来源。\n易混点：畸胎瘤与混合瘤最易混。记忆要点：看到“三个胚层、毛发皮脂骨牙、卵巢/睾丸/中线部位”选畸胎瘤；看到“癌和肉瘤两种恶性成分”选癌肉瘤；看到“正常组织排列紊乱的瘤样病变”选错构瘤。","chapter":6,"chapterName":"肿瘤","chapterTitle":"第6章 肿瘤"},{"id":"pathology-2a-single-0276","type":"single","typeLabel":"单选题","number":276,"question":"下列哪项是变质性炎症","options":[{"key":"A","text":"肾盂肾炎"},{"key":"B","text":"菌痢"},{"key":"C","text":"大叶性肺炎"},{"key":"D","text":"阿米巴肝脓肿"},{"key":"E","text":"阑尾炎"}],"answerKeys":["D"],"answerText":["阿米巴肝脓肿"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：变质性炎是以组织细胞变性、坏死为主，渗出和增生较轻微的炎症，阿米巴肝脓肿是其典型代表。\n解析：阿米巴肝脓肿由溶组织内阿米巴滋养体侵入肝组织，溶解破坏肝细胞并引起液化性坏死，形成局限性脓肿样病灶；镜下以坏死液化为主，炎症细胞渗出较少，符合变质性炎。题眼是“变质性炎症”，即病变中心在实质细胞坏死而非大量渗出或明显增生。\n选项分析：\nA. 错误：肾盂肾炎是化脓性炎，主要累及肾盂、肾盏黏膜及肾间质，伴大量中性粒细胞渗出和脓性分泌物，并非以变质为主。\nB. 错误：菌痢即细菌性痢疾，是纤维素性炎（假膜性炎），结肠黏膜表面有大量纤维素、炎细胞和坏死上皮形成的假膜，属于渗出性炎。\nC. 错误：大叶性肺炎是纤维素性炎，肺泡腔内大量纤维素性渗出物代替空气，常累及肺大叶，虽可有肺泡壁毛细血管充血和渗出，但分类上属渗出性炎。\nD. 正确：阿米巴肝脓肿以肝组织液化性坏死为主，周围炎症反应轻微，符合变质性炎的病理特点；病灶可呈“巧克力色”脓液样坏死物。\nE. 错误：阑尾炎尤其是急性阑尾炎为化脓性炎，阑尾壁可见大量中性粒细胞浸润、脓性渗出，可伴坏疽和穿孔，不属于变质性炎。\n易混点：细菌性肝脓肿是化脓性炎，以大量中性粒细胞和脓液为特点；阿米巴肝脓肿则以液化性坏死为主、炎细胞少，属变质性炎。记忆要点：阿米巴“溶解坏死”、菌痢“假膜渗出”、大叶性肺炎“纤维素渗出”、肾盂肾炎和阑尾炎“化脓”。","chapter":4,"chapterName":"炎症","chapterTitle":"第4章 炎症"},{"id":"pathology-2a-single-0277","type":"single","typeLabel":"单选题","number":277,"question":"关于慢性支气管炎的描述错误的是","options":[{"key":"A","text":"黏膜腺体增生、肥大"},{"key":"B","text":"支气管壁平滑肌断裂、萎缩"},{"key":"C","text":"黏膜上皮可出现鳞状化生"},{"key":"D","text":"典型临床表现为伴有哮鸣音的呼气性呼吸困难"},{"key":"E","text":"支气管壁充血水肿，淋巴细胞、浆细胞浸润"}],"answerKeys":["D"],"answerText":["典型临床表现为伴有哮鸣音的呼气性呼吸困难"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：慢性支气管炎的病理变化及典型临床表现，尤其是“咳嗽、咳痰”与“喘息性呼吸困难”的鉴别。\n解析：慢性支气管炎是气管、支气管黏膜及其周围组织的慢性非特异性炎症，病理上可见黏膜腺体增生肥大、杯状细胞增多、黏膜上皮鳞状化生、间质充血水肿并伴淋巴细胞和浆细胞浸润，病变累及支气管壁时平滑肌可断裂、萎缩。临床诊断要点为反复咳嗽、咳痰或伴喘息，每年发病持续3个月、连续2年或以上。D所述“伴有哮鸣音的呼气性呼吸困难”并非慢性支气管炎的典型表现，而是支气管哮喘及慢性阻塞性肺疾病较常见的特点。题眼在于区分慢性支气管炎的“咳嗽咳痰”与哮喘的“发作性喘息、呼气性呼吸困难”。\n\n选项分析：\nA. 正确：慢性支气管炎时支气管黏膜黏液腺增生、肥大，杯状细胞增多，黏液分泌亢进，是患者咳痰的重要病理基础；腺体增生肥大也是本病较具特征性的改变。\nB. 正确：长期慢性炎症可破坏支气管壁结构，使平滑肌束断裂、萎缩，软骨也可发生变性、萎缩或钙化，说明病变并非仅限黏膜。\nC. 正确：长期吸烟、感染等慢性刺激可使柱状纤毛上皮发生变性、坏死、脱落，修复过程中可出现鳞状上皮化生，属于适应性改变。\nD. 错误：伴有哮鸣音的呼气性呼吸困难主要见于支气管哮喘、慢性阻塞性肺疾病等；慢性支气管炎的典型表现是长期反复咳嗽、咳痰，部分患者可有喘息，但“典型表现为呼气性呼吸困难”不准确。\nE. 正确：慢性支气管炎属于慢性非特异性炎症，支气管壁可充血、水肿，黏膜下及周围间质可见淋巴细胞、浆细胞浸润。\n\n易混点：慢性支气管炎的记忆要点是“长期咳嗽咳痰、黏液腺增生肥大、Reid指数增大”；支气管哮喘则以“发作性呼气性呼吸困难、哮鸣音、嗜酸性粒细胞及平滑肌痉挛”为主。喘息性支气管炎虽可有哮鸣音，但不能将其等同于哮喘的典型呼气性呼吸困难。","chapter":10,"chapterName":"呼吸系统疾病","chapterTitle":"第10章 呼吸系统疾病"},{"id":"pathology-2a-single-0278","type":"single","typeLabel":"单选题","number":278,"question":"下列哪项不具有防御作用","options":[{"key":"A","text":"纤维蛋白渗出"},{"key":"B","text":"白细胞游出"},{"key":"C","text":"血浆渗出"},{"key":"D","text":"炎性增生"},{"key":"E","text":"红细胞漏出"}],"answerKeys":["E"],"answerText":["红细胞漏出"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n核心考点：炎症渗出和增生过程中各种成分的防御作用及红细胞漏出的被动性质。\n解析：炎症时纤维蛋白渗出可形成纤维网限制病原体扩散并作为修复支架，白细胞游出后通过吞噬、杀菌参与防御，血浆渗出带来抗体、补体和抗菌物质，炎性增生参与局限病灶和修复。红细胞漏出主要是血管通透性增高、血流改变所致的被动漏出，本身不承担识别、吞噬或中和病原体等防御功能，因此本题题眼是“是否具有防御作用”。\n\n选项分析：\nA. 错误：纤维蛋白渗出具有防御作用，可网罗病原体和异物、限制炎症扩散，并为修复提供支架。\nB. 错误：白细胞游出是炎症防御的核心环节，中性粒细胞和单核细胞可吞噬、杀灭病原体并参与免疫反应。\nC. 错误：血浆渗出可带来抗体、补体、纤维蛋白原和抗菌物质，有助于中和病原体及调理吞噬。\nD. 错误：炎性增生包括纤维组织、血管内皮和上皮增生，可局限病灶、修复缺损并形成包囊。\nE. 正确：红细胞漏出是血管通透性增高和血流动力学改变导致的被动漏出，常提示充血、出血，不具有独立防御作用。\n\n易混点：白细胞游出是主动过程，具有吞噬和杀菌意义；红细胞漏出是被动过程，只反映血管损伤和通透性增高。记忆要点：血浆渗出“带抗体”，白细胞游出“去吞噬”，纤维蛋白“网病原”，红细胞漏出“无防御”。","chapter":4,"chapterName":"炎症","chapterTitle":"第4章 炎症"},{"id":"pathology-2a-single-0279","type":"single","typeLabel":"单选题","number":279,"question":"肺癌的早期诊断中最有价值的检查是","options":[{"key":"A","text":"早期症状的发现"},{"key":"B","text":"纤维支气管镜活检"},{"key":"C","text":"X线检查"},{"key":"D","text":"CT检查"},{"key":"E","text":"血液检查"}],"answerKeys":["B"],"answerText":["纤维支气管镜活检"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：肺癌早期诊断中最有价值的是纤维支气管镜活检，可获得组织病理学确诊，尤其适用于中央型肺癌。\n解析：肺癌早期常缺乏特异性症状，影像学检查虽能发现肺部结节或肿块，但不能确定良恶性；纤维支气管镜可直视支气管腔内病变并取活检，阳性即可病理确诊，是中央型肺癌早期诊断和鉴别诊断的重要方法。本题题眼是“早期诊断中最有价值”，强调病理确诊而非单纯筛查，故答案为B。\n选项分析：\nA. 错误：早期肺癌常无明显症状，出现咳嗽、咯血、胸痛等时多已非早期；依靠症状发现缺乏敏感性和特异性，不能作为最有价值的诊断检查。\nB. 正确：纤维支气管镜活检可直接观察支气管黏膜及腔内病变，并取材行组织病理学检查，对中央型肺癌早期诊断价值大；病理诊断是肺癌确诊的金标准。\nC. 错误：X线检查可用于肺部病变初步筛查，能显示肿块、阻塞性肺炎等，但对小结节敏感性低，且不能确定组织学类型，不能替代病理活检。\nD. 错误：CT检查敏感性高于X线，常用于肺癌筛查、分期和定位，低剂量CT可发现早期肺结节，但影像学不能确诊良恶性，仍需病理检查。\nE. 错误：血液检查包括肿瘤标志物等，对肺癌早期诊断敏感性和特异性均不足，主要用于辅助监测，不能作为确诊依据。\n易混点：低剂量CT是肺癌高危人群筛查的重要手段，而纤维支气管镜活检是中央型肺癌取得病理诊断的重要手段；若为周围型肺癌，常需经皮肺穿刺活检。记忆要点：影像定位、病理定性，早期中央型肺癌首选支气管镜活检。","chapter":10,"chapterName":"呼吸系统疾病","chapterTitle":"第10章 呼吸系统疾病"},{"id":"pathology-2a-single-0280","type":"single","typeLabel":"单选题","number":280,"question":"肺小细胞癌不会引起","options":[{"key":"A","text":"肺性骨关节病"},{"key":"B","text":"肌无力综合征"},{"key":"C","text":"类癌综合征"},{"key":"D","text":"Cushing综合征"},{"key":"E","text":"甲状腺功能亢进"}],"answerKeys":["E"],"answerText":["甲状腺功能亢进"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n核心考点：肺小细胞癌具有神经内分泌分化，可引起多种副肿瘤综合征，但甲状腺功能亢进不是其经典表现。\n解析：肺小细胞癌多起源于支气管黏膜的神经内分泌细胞，癌细胞可异位分泌ACTH、ADH、降钙素等激素或通过免疫机制引起副肿瘤综合征。其典型临床联系包括异位ACTH综合征导致Cushing综合征、Lambert-Eaton肌无力综合征等。本题题眼是“不会引起”，即选出不属于小细胞癌经典副肿瘤表现的选项。\n选项分析：\nA. 错误：肺性骨关节病（肥大性肺性骨关节病）可作为肺癌的肺外表现，虽更常见于非小细胞癌，但肺癌包括小细胞癌并非不会伴发，故不能作为“不会引起”的答案。\nB. 错误：肌无力综合征即Lambert-Eaton综合征，是小细胞癌经典的副肿瘤性神经肌肉病变，与抗电压门控钙通道抗体有关，常表现为近端肌无力、下肢重于上肢。\nC. 错误：类癌综合征由神经内分泌肿瘤分泌5-羟色胺等活性物质引起，小细胞癌具有神经内分泌特征，可出现相关异位分泌表现，虽较典型类癌少见，但不能说不会引起。\nD. 错误：小细胞癌可异位分泌ACTH，刺激肾上腺皮质增生并引起异位ACTH综合征，表现为Cushing综合征，属于常考副肿瘤综合征。\nE. 正确：甲状腺功能亢进多由Graves病、毒性甲状腺肿等引起，不是肺小细胞癌的经典副肿瘤综合征；小细胞癌常见异位激素为ACTH、ADH等，而非引起甲亢。\n易混点：小细胞癌的副肿瘤综合征常考“异位ACTH→Cushing综合征”“ADH→低钠血症”“Lambert-Eaton肌无力综合征”；类癌综合征典型见于类癌，但神经内分泌肿瘤亦可出现。甲亢应联系甲状腺自身免疫性疾病，不要与肺癌异位激素综合征混淆。","chapter":10,"chapterName":"呼吸系统疾病","chapterTitle":"第10章 呼吸系统疾病"},{"id":"pathology-2a-single-0281","type":"single","typeLabel":"单选题","number":281,"question":"血栓转归中不会发生的是","options":[{"key":"A","text":"钙化"},{"key":"B","text":"溶解"},{"key":"C","text":"化生"},{"key":"D","text":"机化"},{"key":"E","text":"再通"}],"answerKeys":["C"],"answerText":["化生"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：血栓的转归包括溶解吸收、机化再通、钙化，化生不属于血栓转归。\n解析：血栓形成后可经历溶解、机化、再通和钙化等转归。机化是肉芽组织从血管壁长入血栓并逐渐纤维化，随后可形成再通；钙化是血栓内钙盐沉积，常见于长期存在的血栓。化生是指一种已分化组织转化为另一种分化组织，血栓本身不是活体组织，因此不会以“化生”作为转归。本题题眼是“不会发生”，应选化生。\n\n选项分析：\nA. 错误：钙化可发生，长期未机化或未溶解的血栓可发生钙盐沉积，形成静脉石或动脉石，属于血栓转归之一。\nB. 错误：溶解可发生，血栓内纤维蛋白可被纤溶酶溶解，较小血栓可完全溶解吸收，较大血栓可部分溶解。\nC. 正确：化生是活体组织类型的转化，如柱状上皮化生为鳞状上皮、纤维组织化生为骨组织；血栓是无生命异物，不发生化生。\nD. 错误：机化可发生，肉芽组织长入血栓并取代之，最终形成纤维瘢痕，是血栓的重要转归。\nE. 错误：再通可发生，机化血栓内可形成裂隙或新生血管，使血流部分恢复，属于血栓机化后的继发改变。\n易混点：机化是肉芽组织取代血栓，再通是机化血栓内出现血流通道，钙化是钙盐沉积；三者均为血栓转归。化生强调“组织类型转变”，不是血栓的转归，考试中看到“化生”与“血栓转归”并列应高度警惕。","chapter":3,"chapterName":"局部血液循环障碍","chapterTitle":"第3章 局部血液循环障碍"},{"id":"pathology-2a-single-0282","type":"single","typeLabel":"单选题","number":282,"question":"急性左心衰竭时常引起","options":[{"key":"A","text":"肺水肿"},{"key":"B","text":"眼睑水肿"},{"key":"C","text":"脑水肿"},{"key":"D","text":"下肢水肿"},{"key":"E","text":"心包积液"}],"answerKeys":["A"],"answerText":["肺水肿"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：A\n核心考点：急性左心衰竭导致肺静脉压升高，引起急性肺淤血、肺水肿。\n解析：急性左心衰竭时左心室排血能力骤降，血液淤滞于左心房和肺静脉，肺静脉压及肺毛细血管流体静压升高，血浆液体渗入肺间质和肺泡，形成肺淤血、肺水肿。临床可突发严重呼吸困难、端坐呼吸、咳粉红色泡沫痰，两肺满布湿啰音；本题题眼是“急性左心衰”，其最具特征性的靶器官改变是肺水肿。\n选项分析：\nA. 正确：急性左心衰使肺静脉回流受阻、肺毛细血管静水压升高，液体漏出形成肺水肿，是左心衰竭最典型的表现。\nB. 错误：眼睑水肿多见于肾脏疾病，如急性肾小球肾炎、肾病综合征，因水钠潴留和低蛋白血症等引起；不是急性左心衰的典型表现。\nC. 错误：脑水肿可见于缺氧、中毒、颅脑病变、低钠血症等，急性左心衰虽可因严重缺氧影响脑，但“脑水肿”不是其直接、典型的水肿表现。\nD. 错误：下肢水肿主要见于右心衰竭导致的体循环淤血，也可见于静脉回流障碍、低蛋白血症等；急性左心衰主要引起肺循环淤血而非下肢水肿。\nE. 错误：心包积液常见于心包炎、肿瘤转移、尿毒症等，是心包腔液体异常积聚；它不是急性左心衰引起的水肿类型，且可压迫心脏影响充盈，与本题机制不同。\n易混点：左心衰看“肺”，右心衰看“体循环”。急性左心衰突出肺淤血、肺水肿，咳粉红色泡沫痰；右心衰突出体循环淤血，表现为颈静脉怒张、肝大、下肢凹陷性水肿。眼睑水肿先想肾，下肢水肿先想右心衰和静脉回流障碍。","chapter":9,"chapterName":"心血管系统疾病","chapterTitle":"第9章 心血管系统疾病"},{"id":"pathology-2a-single-0283","type":"single","typeLabel":"单选题","number":283,"question":"细动脉壁的玻璃样变最常见于下列哪种疾病","options":[{"key":"A","text":"急性弥漫性增生性肾小球肾炎"},{"key":"B","text":"急性肾盂肾炎"},{"key":"C","text":"快速进行性肾小球肾炎"},{"key":"D","text":"急进型高血压"},{"key":"E","text":"缓进型高血压"}],"answerKeys":["E"],"answerText":["缓进型高血压"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n核心考点：细动脉壁玻璃样变（细动脉硬化）是缓进型高血压的基本血管病变。\n解析：缓进型高血压长期持续血压升高，使细动脉内皮细胞受损、血浆蛋白渗入内膜下，同时平滑肌细胞合成细胞外基质增多，导致细动脉壁均质红染、管腔狭窄，即玻璃样变，常见于肾入球小动脉、脾中央动脉和视网膜动脉。题眼在“细动脉壁的玻璃样变”与“高血压类型”的对应关系：良性/缓进型高血压表现为细动脉玻璃样变，而恶性/急进型高血压表现为细动脉纤维素样坏死和增生性小动脉硬化。\n选项分析：\nA. 错误：急性弥漫性增生性肾小球肾炎的主要病变是肾小球毛细血管内皮细胞和系膜细胞增生，不是细动脉壁玻璃样变，且临床多为急性肾炎综合征。\nB. 错误：急性肾盂肾炎是肾盂、肾间质的化脓性炎症，镜下以中性粒细胞浸润和肾小管腔内脓性渗出为主，与细动脉玻璃样变无关。\nC. 错误：快速进行性肾小球肾炎的特征是肾小球囊壁层上皮细胞增生形成新月体，病变位于肾小球，不是细动脉硬化。\nD. 错误：急进型高血压属于恶性高血压，基本血管病变是细动脉纤维素样坏死和增生性小动脉硬化（洋葱皮样改变），不是玻璃样变。\nE. 正确：缓进型高血压即良性高血压，细小动脉长期受压和内皮损伤后发生细动脉玻璃样变，是本型高血压最常考的血管病理改变。\n易混点：缓进型高血压记“玻璃样变”，急进型高血压记“纤维素样坏死、洋葱皮样”；肾小球肾炎的病变核心在肾小球，不要把肾小球增生性病变误记为细动脉硬化。","chapter":1,"chapterName":"细胞和组织的适应与损伤","chapterTitle":"第1章 细胞和组织的适应与损伤"},{"id":"pathology-2a-single-0284","type":"single","typeLabel":"单选题","number":284,"question":"关于中央型肺癌的特点，应除外","options":[{"key":"A","text":"由段以上支气管发生"},{"key":"B","text":"位于肺门部"},{"key":"C","text":"多是小细胞肺癌"},{"key":"D","text":"较易被纤维支气管镜检查发现"},{"key":"E","text":"巨大癌块环绕癌变支气管"}],"answerKeys":["C"],"answerText":["多是小细胞肺癌"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：中央型肺癌的好发部位、肉眼形态、组织学类型及支气管镜诊断价值。\n解析：中央型肺癌发生于主支气管、叶支气管及段支气管，即段及段以上支气管，癌组织常位于肺门部，可向支气管腔内生长并浸润管壁，向外形成围绕癌变支气管的巨大癌块，因此纤维支气管镜较易发现并取材。中央型肺癌最常见的组织学类型是鳞状细胞癌，而不是小细胞肺癌；小细胞肺癌虽多位于肺门附近，但“中央型肺癌多是小细胞肺癌”这一总体表述错误。本题题眼是“应除外”，即找出不符合中央型肺癌特点的选项。\n\n选项分析：\nA. 正确：中央型肺癌由段及段以上支气管发生，包括主支气管、叶支气管和段支气管。\nB. 正确：中央型肺癌位于肺门部，常形成肺门肿块，故又称肺门型肺癌。\nC. 错误：中央型肺癌最多见的是鳞状细胞癌；小细胞肺癌多发生于肺门附近，但不能表述为中央型肺癌“多是”小细胞肺癌。\nD. 正确：中央型肺癌位于较大支气管，纤维支气管镜可直接观察支气管腔内病变并活检，较易发现。\nE. 正确：中央型肺癌可沿支气管壁浸润生长并向管外扩展，形成巨大癌块环绕癌变支气管，是中央型肺癌的典型肉眼形态之一。\n\n易混点：小细胞肺癌常位于肺门附近、恶性程度高、易早期转移，但中央型肺癌最常见的组织学类型是鳞癌。记忆要点：中央型肺癌＝段以上支气管、肺门肿块、鳞癌最多见、支气管镜易发现；小细胞肺癌是“多位于中央”的肺癌类型，但不等同于中央型肺癌最多见的类型。","chapter":10,"chapterName":"呼吸系统疾病","chapterTitle":"第10章 呼吸系统疾病"},{"id":"pathology-2a-single-0285","type":"single","typeLabel":"单选题","number":285,"question":"肿瘤生长分数是指","options":[{"key":"A","text":"肿瘤细胞中处于增殖阶段的细胞比例"},{"key":"B","text":"肿瘤细胞中处于合成前期的细胞比例"},{"key":"C","text":"肿瘤细胞中处于有丝分裂期的细胞比例"},{"key":"D","text":"肿瘤细胞中处于合成前、后期的细胞比例"},{"key":"E","text":"肿瘤细胞中处于合成期的细胞比例"}],"answerKeys":["A"],"answerText":["肿瘤细胞中处于增殖阶段的细胞比例"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：A\n核心考点：肿瘤生长分数是肿瘤细胞群体中处于细胞增殖周期（G1、S、G2、M期）的细胞所占比例，不包括G0期静止细胞。\n解析：肿瘤生长分数反映肿瘤细胞中具有增殖能力的细胞比例，是判断肿瘤生长速度和化疗敏感性的重要指标。生长分数高，说明进入细胞周期的细胞多，肿瘤生长较快，对作用于增殖期细胞的化疗药较敏感；生长分数低则G0期细胞多，生长相对缓慢且对化疗较不敏感。本题题眼是“增殖阶段”，应理解为整个细胞周期中的细胞，而不是某一单一时相。\n\n选项分析：\nA. 正确：指肿瘤细胞中处于增殖阶段即G1、S、G2、M期的细胞比例，符合生长分数定义。\nB. 错误：仅指合成前期即G1期细胞比例，只包括细胞周期的一个阶段，不能代表全部增殖细胞。\nC. 错误：仅指有丝分裂期即M期细胞比例，范围过窄，不能等同于生长分数。\nD. 错误：指合成前期和合成后期即G1期与G2期细胞比例，仍遗漏S期和M期，概念不完整。\nE. 错误：仅指合成期即S期细胞比例；S期细胞比例常用于标记指数等指标，但不是生长分数的完整定义。\n\n易混点：生长分数易与S期标记指数混淆。S期标记指数只反映处于DNA合成期的细胞比例，而生长分数包括G1、S、G2、M期全部增殖细胞。记忆要点：生长分数看“是否在周期中”，G0期静止细胞不计入；肿瘤倍增时间还受细胞周期时间及细胞丢失率影响。","chapter":6,"chapterName":"肿瘤","chapterTitle":"第6章 肿瘤"},{"id":"pathology-2a-single-0286","type":"single","typeLabel":"单选题","number":286,"question":"下列哪项不属于微小病变性肾病的病变特点","options":[{"key":"A","text":"又称为脂性肾病"},{"key":"B","text":"是引起成人肾病综合征的最常见原因"},{"key":"C","text":"光镜下肾小球基本正常，肾小管上皮有脂质沉积"},{"key":"D","text":"蛋白尿的主要成分是小分子的白蛋白，属于选择性蛋白尿"},{"key":"E","text":"皮质类固醇激素治疗大都效果明显"}],"answerKeys":["B"],"answerText":["是引起成人肾病综合征的最常见原因"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：微小病变性肾病的临床病理特点及其在肾病综合征病因中的年龄分布。\n解析：微小病变性肾病是儿童原发性肾病综合征最常见的病因，而不是成人肾病综合征最常见的原因。其病理特点是光镜下肾小球基本正常，电镜下可见肾小球脏层上皮细胞足突弥漫性融合，肾小管上皮可因脂质吸收而出现空泡变性，故又称脂性肾病。临床表现为大量蛋白尿，且多为以白蛋白为主的选择性蛋白尿，对糖皮质激素治疗敏感，多数预后良好。本题题眼是“成人肾病综合征最常见原因”，应改为儿童肾病综合征最常见原因。\n\n选项分析：\nA. 正确：微小病变性肾病因肾小管上皮细胞脂质沉积、空泡变性明显，又称脂性肾病，属于本病特点。\nB. 错误：微小病变性肾病是儿童肾病综合征最常见的原因；成人原发性肾病综合征最常见的原因通常为膜性肾病，故本项不属于微小病变性肾病的特点，为本题答案。\nC. 正确：光镜下肾小球基本正常，近曲小管上皮细胞可见脂质沉积和空泡变性，是微小病变性肾病的典型光镜表现。\nD. 正确：微小病变性肾病时肾小球滤过屏障电荷屏障受损为主，蛋白尿以中小分子白蛋白为主，属于选择性蛋白尿。\nE. 正确：微小病变性肾病对皮质类固醇激素治疗敏感，大多数患者疗效明显，甚至完全缓解。\n\n易混点：微小病变性肾病与膜性肾病最易混淆。记忆要点：儿童肾病综合征最常见为微小病变，电镜为足突融合，激素敏感；成人原发性肾病综合征最常见为膜性肾病，光镜为基底膜增厚、钉突形成，激素疗效相对较差。","chapter":13,"chapterName":"泌尿系统疾病","chapterTitle":"第13章 泌尿系统疾病"},{"id":"pathology-2a-single-0287","type":"single","typeLabel":"单选题","number":287,"question":"膜性肾小球肾炎的大体呈","options":[{"key":"A","text":"大红肾"},{"key":"B","text":"大白肾"},{"key":"C","text":"蚤咬肾"},{"key":"D","text":"多囊肾"},{"key":"E","text":"固缩肾"}],"answerKeys":["B"],"answerText":["大白肾"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：膜性肾小球肾炎的大体形态为双肾弥漫性肿大、颜色苍白，称“大白肾”。\n解析：膜性肾小球肾炎（膜性肾病）的主要病变是肾小球毛细血管基底膜弥漫性增厚，上皮下免疫复合物沉积，临床多表现为肾病综合征。由于肾小球及肾间质水肿、脂质沉积等因素，双肾体积增大、色泽苍白，故有“大白肾”之称。本题题眼是“膜性肾小球肾炎的大体形态”，应直接联系“大白肾”。\n选项分析：\nA. 错误：“大红肾”主要见于急性弥漫性增生性肾小球肾炎，双肾轻度肿大、充血发红，是毛细血管内皮细胞和系膜细胞增生、炎症充血所致。\nB. 正确：膜性肾小球肾炎双肾弥漫性肿大、颜色苍白，称“大白肾”，属于其大体特点。\nC. 错误：“蚤咬肾”也主要见于急性弥漫
