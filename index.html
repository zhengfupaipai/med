terName":"心血管系统疾病","chapterTitle":"第9章 心血管系统疾病"},{"id":"pathology-a-single-0060","type":"single","typeLabel":"单选题","number":60,"question":"肝功能不全患者蜘蛛状血管痣好发于","options":[{"key":"A","text":"腹前壁"},{"key":"B","text":"颈、面部、前臂及手掌"},{"key":"C","text":"全身各部"},{"key":"D","text":"上肢及下肢"},{"key":"E","text":"背部及颈部"}],"answerKeys":["B"],"answerText":["颈、面部、前臂及手掌"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：肝功能不全时雌激素灭活减少，引起上腔静脉分布区小动脉及毛细血管扩张，形成蜘蛛状血管痣。\n解析：蜘蛛痣是皮肤小动脉末端分支性扩张所形成的血管痣，中央为搏动性小动脉，周围有放射状毛细血管，形似蜘蛛。肝功能不全时肝脏对雌激素灭活能力下降，雌激素水平升高，促使小动脉扩张，故好发于颈、面部、前臂及手掌等上腔静脉引流区域。本题题眼是“肝功能不全”与“好发部位”，应想到雌激素灭活障碍及上腔静脉分布区。\n选项分析：\nA. 错误：腹前壁是门静脉高压时腹壁浅静脉曲张的好发部位，可形成“海蛇头”，并非蜘蛛痣的典型好发部位。\nB. 正确：颈、面部、前臂及手掌属于上腔静脉分布区，是蜘蛛痣的典型好发部位，符合肝功能不全时雌激素灭活减少的机制。\nC. 错误：蜘蛛痣虽可散发于身体多处，但并非全身各部均匀分布，其好发部位集中在上腔静脉引流区，尤其颈面部。\nD. 错误：上肢可受累，但下肢不是典型好发部位；手掌可见蜘蛛痣，也可见肝掌，但“上下肢”作为整体不符合其好发规律。\nE. 错误：颈部属于蜘蛛痣好发区，但背部不是典型好发部位；该组合不如颈、面部、前臂及手掌准确。\n易混点：蜘蛛痣与肝掌均与肝功能不全、雌激素灭活减少有关，但蜘蛛痣好发于颈面部及上腔静脉分布区，肝掌主要表现为大小鱼际红斑；门静脉高压所致腹壁静脉曲张则呈“海蛇头”，不要与蜘蛛痣混淆。记忆要点：蜘蛛痣“上腔静脉分布区”，腹壁静脉曲张“门脉高压”。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-a-single-0061","type":"single","typeLabel":"单选题","number":61,"question":"下列属于恶性肿瘤的是","options":[{"key":"A","text":"皮肤纤维瘤"},{"key":"B","text":"淋巴瘤"},{"key":"C","text":"骨瘤"},{"key":"D","text":"肝腺瘤"},{"key":"E","text":"肺炎性假瘤"}],"answerKeys":["B"],"answerText":["淋巴瘤"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：肿瘤的良恶性命名及生物学行为，名称带“瘤”不等于一定是良性肿瘤。\n解析：淋巴瘤是起源于淋巴造血系统的恶性肿瘤，分为霍奇金淋巴瘤和非霍奇金淋巴瘤两大类，常表现为无痛性淋巴结肿大，也可伴发热、盗汗、体重下降等全身症状。本题题眼在于“恶性肿瘤”的识别：淋巴造血系统肿瘤虽常以“瘤”命名，但淋巴瘤属于恶性。判断良恶性不能只看名称，还要结合起源组织、分化程度、生长方式、侵袭和转移能力等。\n选项分析：\nA. 错误：皮肤纤维瘤是良性纤维组织细胞性病变，多位于真皮，常为小结节，生长缓慢，不发生转移，属于良性肿瘤性病变。\nB. 正确：淋巴瘤起源于淋巴细胞及其前体，属于恶性淋巴造血系统肿瘤，可破坏正常淋巴结结构并累及结外器官，是本题唯一明确的恶性肿瘤。\nC. 错误：骨瘤是良性骨形成性肿瘤，多见于颅面骨，由成熟致密骨组织构成，生长局限，属于良性肿瘤。\nD. 错误：肝腺瘤是良性肝细胞性肿瘤，常与口服避孕药等因素相关，虽可破裂出血并有恶变风险，但其本质仍属良性肿瘤。\nE. 错误：肺炎性假瘤是炎症后修复性、反应性增生形成的瘤样病变，由纤维组织、炎细胞等构成，并非真性肿瘤，更不是恶性肿瘤。\n易混点：淋巴瘤、白血病虽然名称中带“瘤”或“病”，但均属恶性淋巴造血系统肿瘤；炎性假瘤是瘤样病变而非真性肿瘤。记忆要点：判断良恶性要抓“起源组织＋生物学行为”，不能仅凭“瘤”字。","chapter":6,"chapterName":"肿瘤","chapterTitle":"第6章 肿瘤"},{"id":"pathology-a-single-0062","type":"single","typeLabel":"单选题","number":62,"question":"关于肺气肿患者的临床表现，下面错误的是","options":[{"key":"A","text":"逐渐加强的吸气性呼吸困难"},{"key":"B","text":"低氧血症"},{"key":"C","text":"桶状胸"},{"key":"D","text":"胸透肺野透明度增加"},{"key":"E","text":"肺动脉高压和肺源性心脏病"}],"answerKeys":["A"],"answerText":["逐渐加强的吸气性呼吸困难"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：A\n核心考点：肺气肿的临床表现及阻塞性通气障碍所致呼吸困难类型。\n解析：肺气肿时肺泡壁破坏、肺组织弹性回缩力下降，小气道在呼气时更易塌陷，导致阻塞性通气障碍，典型表现为呼气性呼吸困难，而不是逐渐加强的吸气性呼吸困难。肺过度充气使胸廓前后径增大形成桶状胸，X线/胸透可见肺野透明度增加、膈肌低平。通气血流比例失调和弥散面积减少可引起低氧血症；长期缺氧导致肺血管收缩及肺毛细血管床减少，可继发肺动脉高压和肺源性心脏病。本题题眼是“吸气性呼吸困难”，肺气肿应为呼气性呼吸困难。\n选项分析：\nA. 错误：肺气肿属于下呼吸道阻塞性病变，表现为呼气性呼吸困难，严重时出现呼气延长、呼气费力；吸气性呼吸困难见于喉、气管等上气道阻塞。\nB. 正确：肺气肿因肺泡通气/血流比例失调、弥散面积减少，常出现低氧血症，晚期可伴二氧化碳潴留。\nC. 正确：肺过度充气、残气量增加使胸廓前后径增大，肋间隙增宽，形成桶状胸。\nD. 正确：肺内含气量增多、肺透亮度增高，胸透或X线可见肺野透明度增加、膈肌下降变平。\nE. 正确：长期缺氧引起肺小动脉收缩、肺血管重构，加之肺毛细血管床减少，可形成肺动脉高压，进而发展为肺源性心脏病。\n易混点：吸气性呼吸困难多见于喉、气管异物或肿瘤等上气道阻塞，常伴“三凹征”；呼气性呼吸困难多见于肺气肿、支气管哮喘等下气道阻塞性疾病。记忆要点：上气道阻塞“吸气难”，肺气肿“呼气难”。","chapter":10,"chapterName":"呼吸系统疾病","chapterTitle":"第10章 呼吸系统疾病"},{"id":"pathology-a-single-0063","type":"single","typeLabel":"单选题","number":63,"question":"可以诊断为恶性肿瘤的是","options":[{"key":"A","text":"肿瘤有出血"},{"key":"B","text":"肿瘤有坏死"},{"key":"C","text":"肿瘤有火山口状溃疡形成"},{"key":"D","text":"肿瘤的异型性明显"},{"key":"E","text":"肿瘤呈浸润性生长"}],"answerKeys":["D"],"answerText":["肿瘤的异型性明显"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：恶性肿瘤诊断最可靠的细胞学依据是肿瘤细胞异型性明显，即分化不成熟和间变。\n解析：良性肿瘤与恶性肿瘤的根本区别在于肿瘤细胞的分化程度及异型性。恶性肿瘤细胞常表现为核大、深染、核仁明显、核质比增高、核多形性及病理性核分裂象，故“异型性明显”是诊断恶性肿瘤的重要依据。题眼在于判断“可以诊断恶性肿瘤”的最可靠形态学标准，而不是仅凭出血、坏死、溃疡或生长方式等继发改变。\n选项分析：\nA. 错误：肿瘤出血可由血管丰富、破裂、缺血或炎症等引起，良性肿瘤也可出血，不能据此诊断恶性。\nB. 错误：坏死在恶性肿瘤中常见，但良性肿瘤发生缺血、感染或变性时也可坏死，故不是恶性肿瘤的特异性诊断依据。\nC. 错误：火山口状溃疡是恶性溃疡的肉眼特点之一，常见于胃癌等，但溃疡形态需结合镜下细胞异型性、浸润深度等判断，不能单独确诊恶性。\nD. 正确：肿瘤细胞异型性明显，尤其核的多形性、深染、核仁明显和病理性核分裂象，提示分化差、恶性程度较高，是诊断恶性肿瘤的重要依据。\nE. 错误：浸润性生长是恶性肿瘤的重要生物学行为，但少数良性肿瘤如血管瘤等也可呈浸润性生长，故不能仅凭此点绝对诊断恶性，诊断仍需结合细胞异型性。\n易混点：恶性肿瘤常有出血、坏死、溃疡和浸润，但这些多为继发或生物学行为表现；最核心的鉴别点是细胞分化程度和异型性。记忆要点：诊断恶性看“细胞异型性明显、浸润性生长、转移”，其中细胞异型性最直接、最可靠。","chapter":6,"chapterName":"肿瘤","chapterTitle":"第6章 肿瘤"},{"id":"pathology-a-single-0064","type":"single","typeLabel":"单选题","number":64,"question":"新月体性肾小球肾炎的主要病变是","options":[{"key":"A","text":"肾球囊脏层上皮细胞增生"},{"key":"B","text":"毛细血管壁纤维蛋白样坏死"},{"key":"C","text":"单核细胞渗出于肾球囊内"},{"key":"D","text":"中性粒细胞渗出于肾球囊内"},{"key":"E","text":"肾球囊壁层上皮细胞增生和巨噬细胞增生"}],"answerKeys":["E"],"answerText":["肾球囊壁层上皮细胞增生和巨噬细胞增生"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n核心考点：新月体性肾小球肾炎（快速进行性肾小球肾炎）的特征性病变是肾球囊内新月体形成，主要由壁层上皮细胞增生和巨噬细胞增生构成。\n解析：新月体位于肾球囊腔内，由增生的肾球囊壁层上皮细胞和渗出的单核巨噬细胞组成，常伴纤维蛋白渗出及纤维素样坏死。新月体压迫肾小球毛细血管丛，使球囊腔闭塞，临床表现为快速进行性肾功能衰竭。本题题眼是“新月体的主要细胞成分”，应抓住壁层上皮细胞和巨噬细胞。\n选项分析：\nA. 错误：肾球囊脏层上皮细胞即足细胞，其增生或损伤可见于微小病变性肾小球病、局灶节段性肾小球硬化等，但不是新月体的主要构成成分。\nB. 错误：毛细血管壁纤维蛋白样坏死可见于急进性肾小球肾炎Ⅰ型、坏死性血管炎等，是新月体形成的诱发和伴随病变，但不是“主要病变”的细胞学描述。\nC. 错误：单核细胞渗出至肾球囊内可参与新月体形成，并被描述为巨噬细胞增生，但单独强调“单核细胞渗出”不完整，未突出壁层上皮细胞增生这一关键。\nD. 错误：中性粒细胞渗出至肾球囊内主要见于急性弥漫性增生性肾小球肾炎（感染后肾小球肾炎），不是新月体性肾小球肾炎的主要病变。\nE. 正确：肾球囊壁层上皮细胞增生并伴巨噬细胞增生，形成新月体，是新月体性肾小球肾炎最具诊断意义的形态学改变。\n易混点：新月体成分易与急性弥漫性增生性肾小球肾炎混淆，后者以毛细血管内皮细胞和系膜细胞增生、中性粒细胞浸润为主；新月体则强调“壁层上皮细胞＋巨噬细胞”，位于肾球囊内。记忆要点：新月体在球囊内，壁层上皮加巨噬。","chapter":13,"chapterName":"泌尿系统疾病","chapterTitle":"第13章 泌尿系统疾病"},{"id":"pathology-a-single-0065","type":"single","typeLabel":"单选题","number":65,"question":"下列哪种类型为不累及肺泡的肺气肿","options":[{"key":"A","text":"全腺泡型"},{"key":"B","text":"腺泡中央型"},{"key":"C","text":"腺泡周围型"},{"key":"D","text":"不规则型"},{"key":"E","text":"间质性肺气肿"}],"answerKeys":["E"],"answerText":["间质性肺气肿"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n核心考点：肺气肿按累及部位分为肺泡性肺气肿与间质性肺气肿，间质性肺气肿的空气位于肺间质而不在肺泡腔内。\n解析：间质性肺气肿多因细支气管或肺泡壁破裂，空气进入肺间质，沿支气管血管束、小叶间隔、胸膜下等间质间隙弥散，故不以肺泡腔扩张为主要表现，属“不累及肺泡”的类型。题眼是“不累及肺泡”，应与全腺泡型、腺泡中央型、腺泡周围型、不规则型等肺泡性肺气肿相区别。后者均有呼吸性细支气管至肺泡不同程度的扩张和肺泡壁破坏。\n选项分析：\nA. 错误：全腺泡型累及整个腺泡，从呼吸性细支气管到肺泡管、肺泡囊和肺泡均扩张，肺泡受累明显。\nB. 错误：腺泡中央型主要累及腺泡中央的呼吸性细支气管，肺泡管和肺泡囊相对保留，但仍属肺泡性肺气肿。\nC. 错误：腺泡周围型又称隔旁型，累及腺泡远端的肺泡管、肺泡囊和肺泡，常位于胸膜下，肺泡受累。\nD. 错误：不规则型常继发于瘢痕，腺泡受累不规则，肺泡壁破坏并伴纤维化，仍累及肺泡。\nE. 正确：间质性肺气肿是空气进入肺间质，位于间质间隙而非肺泡腔，故符合“不累及肺泡”的肺气肿。\n易混点：肺泡性肺气肿包括全腺泡型、腺泡中央型、腺泡周围型和不规则型，均有肺泡腔扩张；间质性肺气肿则强调气体在肺间质内，可沿间隔向胸膜下、纵隔扩散。记忆要点：看“气体在哪里”——在肺泡腔为肺泡性，在间质为间质性。","chapter":10,"chapterName":"呼吸系统疾病","chapterTitle":"第10章 呼吸系统疾病"},{"id":"pathology-a-single-0066","type":"single","typeLabel":"单选题","number":66,"question":"AIDS患者常见的恶性肿瘤是","options":[{"key":"A","text":"尤文氏肉瘤"},{"key":"B","text":"Kaposi肉瘤"},{"key":"C","text":"纤维肉瘤"},{"key":"D","text":"膀胱移行细胞癌"},{"key":"E","text":"直肠癌"}],"answerKeys":["B"],"answerText":["Kaposi肉瘤"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：AIDS患者因严重免疫缺陷，易发生Kaposi肉瘤等免疫缺陷相关肿瘤。\n解析：AIDS患者CD4+ T淋巴细胞显著减少，免疫监视功能下降，易并发Kaposi肉瘤、非霍奇金淋巴瘤及宫颈癌等。Kaposi肉瘤与人类疱疹病毒8型（HHV-8/KSHV）感染密切相关，常表现为皮肤黏膜紫红色斑块或结节，也可累及淋巴结和内脏，是AIDS定义性疾病之一。本题题眼是“AIDS患者常见的恶性肿瘤”，应选Kaposi肉瘤。\n选项分析：\nA. 错误：尤文氏肉瘤是骨和软组织的小圆细胞恶性肿瘤，常与EWS-FLI1基因易位相关，并非AIDS相关常见肿瘤。\nB. 正确：Kaposi肉瘤是AIDS患者最常见的恶性肿瘤之一，由HHV-8驱动，免疫缺陷促进其发生，皮肤黏膜紫红色斑块/结节为典型表现。\nC. 错误：纤维肉瘤是软组织肉瘤，病因与放射性损伤、遗传综合征等有关，不属于AIDS常见相关肿瘤。\nD. 错误：膀胱移行细胞癌主要与吸烟、职业性芳香胺暴露等有关，并非AIDS患者特征性常见肿瘤。\nE. 错误：直肠癌多与腺瘤癌变、遗传因素、炎症性肠病等有关，AIDS可增加部分肿瘤风险，但直肠癌不是其常见相关恶性肿瘤。\n易混点：AIDS相关肿瘤谱主要记Kaposi肉瘤、非霍奇金淋巴瘤和宫颈癌；Kaposi肉瘤要与血管肉瘤鉴别，前者与HHV-8及免疫缺陷密切相关，后者多见于老年人头面部或放疗后。记忆要点：AIDS免疫缺陷→HHV-8再激活→Kaposi肉瘤。","chapter":5,"chapterName":"免疫性疾病","chapterTitle":"第5章 免疫性疾病"},{"id":"pathology-a-single-0067","type":"single","typeLabel":"单选题","number":67,"question":"除下列哪项外均为中晚期食管癌的肉眼类型","options":[{"key":"A","text":"髓质型"},{"key":"B","text":"蕈伞型"},{"key":"C","text":"平坦型"},{"key":"D","text":"溃疡型"},{"key":"E","text":"缩窄型"}],"answerKeys":["C"],"answerText":["平坦型"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：中晚期食管癌的四种肉眼类型及其与早期食管癌肉眼分型的区别。\n解析：中晚期食管癌肉眼常分为髓质型、蕈伞型、溃疡型和缩窄型四型。髓质型最常见，癌组织在管壁内浸润生长，使管壁增厚、管腔狭窄；蕈伞型向管腔内呈息肉状或蕈伞状突起；溃疡型形成边缘隆起、底部不规则的溃疡；缩窄型因纤维组织增生导致环形狭窄，出现进行性吞咽困难。平坦型不属于中晚期食管癌的标准肉眼类型，故为“除外”项。本题题眼是把“中晚期四型”与“早期食管癌肉眼分型”区分开。\n\n选项分析：\nA. 正确：髓质型是中晚期食管癌常见肉眼类型，癌组织在管壁内弥漫浸润，管壁明显增厚，可伴管腔狭窄。\nB. 正确：蕈伞型是中晚期食管癌肉眼类型，肿瘤向食管腔内呈蕈伞状或息肉状突出。\nC. 错误：平坦型不是中晚期食管癌的标准肉眼类型；早期食管癌肉眼可分隐伏型、糜烂型、斑块型、乳头型等，平坦型不能列为中晚期四型之一。\nD. 正确：溃疡型是中晚期食管癌肉眼类型，癌组织坏死脱落后形成较深溃疡，边缘常隆起。\nE. 正确：缩窄型是中晚期食管癌肉眼类型，癌组织伴明显纤维化，造成食管环形狭窄，临床吞咽困难常较明显。\n\n易混点：中晚期食管癌肉眼四型记忆为“髓、蕈、溃、缩”；早期食管癌肉眼分型记忆为“隐、糜、斑、乳”。不要把“平坦型”混入中晚期四型，也不要把髓质型的管壁增厚与缩窄型的环形狭窄完全等同。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-a-single-0068","type":"single","typeLabel":"单选题","number":68,"question":"下列梗死中，哪项属于液化性坏死","options":[{"key":"A","text":"肺梗死"},{"key":"B","text":"脑梗死"},{"key":"C","text":"肠梗死"},{"key":"D","text":"肾梗死"},{"key":"E","text":"脾梗死"}],"answerKeys":["B"],"answerText":["脑梗死"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：不同器官梗死后的坏死类型，脑梗死属于液化性坏死。\n解析：脑组织缺血坏死后，由于脑组织富含脂质和溶酶体水解酶，坏死组织被水解液化，形成软化灶，因此脑梗死属于液化性坏死。题眼是“梗死中的液化性坏死”，关键要联系器官组织特性：脑组织坏死以液化性坏死为典型，而肺、肠、肾、脾梗死多表现为凝固性坏死。\n选项分析：\nA. 错误：肺梗死属于出血性梗死，梗死区肺组织多发生凝固性坏死，并非液化性坏死；其发生与肺组织疏松、双重血供及静脉淤血有关。\nB. 正确：脑梗死为缺血性梗死，脑组织坏死后期液化形成软化灶，是液化性坏死的典型代表。\nC. 错误：肠梗死属于出血性梗死，肠壁组织发生凝固性坏死，可继发坏疽；题眼不是“出血性”，而是坏死类型。\nD. 错误：肾梗死属于贫血性梗死，梗死灶内肾组织发生凝固性坏死，典型呈楔形灰白色坏死灶。\nE. 错误：脾梗死也属于贫血性梗死，脾组织发生凝固性坏死，常呈楔形、灰白色梗死灶。\n易混点：出血性梗死（肺、肠）强调梗死灶伴明显出血，不等于液化性坏死；贫血性梗死（肾、脾、心）多为凝固性坏死。记忆要点：脑梗死—液化性坏死/脑软化；肺、肠—出血性梗死但坏死性质仍多为凝固性坏死。","chapter":3,"chapterName":"局部血液循环障碍","chapterTitle":"第3章 局部血液循环障碍"},{"id":"pathology-a-single-0069","type":"single","typeLabel":"单选题","number":69,"question":"亚急性细菌性心内膜炎的特点除外下列哪项","options":[{"key":"A","text":"赘生物单个或多个，呈息肉状或菜花状"},{"key":"B","text":"多发生于原有病变的瓣膜上"},{"key":"C","text":"镜下表面有细菌团"},{"key":"D","text":"赘生物脱落引起动脉栓塞和血管炎"},{"key":"E","text":"外观污秽、质松软、灰黄、易脱落"}],"answerKeys":["C"],"answerText":["镜下表面有细菌团"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：亚急性感染性心内膜炎的赘生物形态、镜下构成及栓塞并发症，重点区分其与急性感染性心内膜炎的差异。\n解析：亚急性感染性心内膜炎多发生在已有病变的瓣膜上，赘生物常为单个或多个，呈息肉状或菜花状，外观污秽、灰黄、质松软、易脱落；脱落后可引起动脉栓塞及血管炎。镜下赘生物主要由血小板、纤维素、坏死组织、炎细胞及细菌菌落构成，但细菌菌落多位于赘生物深部或基底部，表面常为纤维素和血小板，故“镜下表面有细菌团”不是亚急性感染性心内膜炎的典型特点。本题题眼是“除外”，应选不属于亚急性感染性心内膜炎特点的C。\n\n选项分析：\nA. 正确：亚急性感染性心内膜炎的赘生物可单发或多发，呈息肉状或菜花状，这是其肉眼形态特点之一。\nB. 正确：本病常发生于原有病变的瓣膜，如风湿性心内膜炎、先天性瓣膜畸形等基础上，故“多发生于原有病变的瓣膜上”符合其特点。\nC. 错误：亚急性感染性心内膜炎赘生物内虽可见细菌菌落，但多位于赘生物深部，表面主要为纤维素、血小板等；“镜下表面有细菌团”更不符合亚急性者，故为本题应除外项。\nD. 正确：赘生物质松软、易脱落，脱落后可随血流引起动脉栓塞，并可导致血管炎，是重要临床并发症。\nE. 正确：赘生物外观污秽、质松软、灰黄、易脱落，是亚急性感染性心内膜炎的典型肉眼特点。\n\n易混点：急性感染性心内膜炎常累及正常瓣膜，赘生物大而松软、细菌多且易脱落，细菌常位于赘生物表面或浅层；亚急性者多在原有病变瓣膜上，赘生物细菌菌落较深。风湿性心内膜炎的赘生物为白色血栓，无细菌，不易脱落，应与感染性心内膜炎鉴别。","chapter":9,"chapterName":"心血管系统疾病","chapterTitle":"第9章 心血管系统疾病"},{"id":"pathology-a-single-0070","type":"single","typeLabel":"单选题","number":70,"question":"下列器官很少发生梗死的是","options":[{"key":"A","text":"心"},{"key":"B","text":"脾"},{"key":"C","text":"肾"},{"key":"D","text":"肝"},{"key":"E","text":"肠"}],"answerKeys":["D"],"answerText":["肝"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n\n核心考点：器官血供特点决定梗死发生率，肝具有肝动脉和门静脉双重血供，故很少发生梗死。\n\n解析：梗死多发生于动脉分支为终末动脉、侧支循环不充分的器官。肝同时接受肝动脉和门静脉供血，两者在肝窦汇合，且肝内血管吻合较丰富；当一支血流受阻时，另一支可部分代偿，因此肝梗死少见。肝梗死并非绝对不发生，若肝动脉阻塞且门静脉供血不足时也可发生，但总体发生率低。本题题眼是“很少发生梗死”，应选肝。\n\n选项分析：\nA. 错误：心可发生心肌梗死，常见于冠状动脉粥样硬化继发血栓形成、痉挛或栓塞，冠状动脉侧支循环有限，心肌对缺血敏感。\nB. 错误：脾可发生脾梗死，脾动脉分支属终末动脉，栓塞或血栓形成后局部易发生贫血性梗死，梗死灶常呈楔形。\nC. 错误：肾可发生肾梗死，肾动脉分支亦属终末动脉，阻塞后常形成灰白色贫血性梗死，可伴腰痛、血尿等。\nD. 正确：肝有肝动脉和门静脉双重血供，门静脉阻塞时肝动脉仍可供血，肝动脉阻塞时门静脉可部分代偿，故肝很少发生梗死。\nE. 错误：肠可发生肠梗死，常见于肠系膜动脉栓塞、血栓形成、肠扭转、肠套叠或嵌顿疝等；因肠组织疏松且血管丰富，梗死常为出血性梗死。\n\n易混点：脾、肾、心多属终末动脉供血，闭塞后易发生贫血性梗死；肠因血管吻合较丰富，单纯动脉阻塞不一定立即梗死，但在静脉回流受阻或肠管扭转等情况下易发生出血性梗死。肝的关键记忆点是“双重血供”，因此梗死少见，门静脉阻塞通常不引起肝梗死。","chapter":3,"chapterName":"局部血液循环障碍","chapterTitle":"第3章 局部血液循环障碍"},{"id":"pathology-a-single-0071","type":"single","typeLabel":"单选题","number":71,"question":"下列哪种恶性肿瘤属于B细胞型淋巴瘤","options":[{"key":"A","text":"霍奇金淋巴瘤"},{"key":"B","text":"滤泡型淋巴瘤"},{"key":"C","text":"蕈样肉芽肿（蕈样霉菌病）"},{"key":"D","text":"恶性组织细胞增生症"},{"key":"E","text":"Sezary综合征"}],"answerKeys":["B"],"answerText":["滤泡型淋巴瘤"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：滤泡型淋巴瘤是起源于滤泡生发中心B细胞的成熟B细胞型非霍奇金淋巴瘤。\n解析：滤泡型淋巴瘤属于B细胞型淋巴瘤，肿瘤细胞多来源于生发中心B细胞，常见t(14;18)染色体易位，导致BCL2过表达，抑制细胞凋亡。病理上淋巴结结构被多数肿瘤性滤泡破坏，滤泡内以中心细胞和中心母细胞为主，免疫表型常为CD20阳性、CD10阳性、BCL2阳性。本题题眼是“B细胞型淋巴瘤”，应选择明确归入B细胞非霍奇金淋巴瘤的滤泡型淋巴瘤。\n\n选项分析：\nA. 错误：霍奇金淋巴瘤虽其RS细胞常来源于生发中心B细胞，但疾病分类上属于霍奇金淋巴瘤，不归入“B细胞型淋巴瘤”这一非霍奇金淋巴瘤分类，典型形态为RS细胞及炎性背景。\nB. 正确：滤泡型淋巴瘤为成熟B细胞肿瘤，具有滤泡样生长方式、t(14;18)及BCL2过表达等特点，符合B细胞型淋巴瘤。\nC. 错误：蕈样肉芽肿又称蕈样霉菌病，是原发皮肤的低度恶性T细胞淋巴瘤，肿瘤细胞常为CD4阳性T细胞，亲表皮生长，不属于B细胞型淋巴瘤。\nD. 错误：恶性组织细胞增生症属于组织细胞/巨噬细胞来源的病变，不是B细胞淋巴瘤；临床可有发热、肝脾淋巴结肿大、全血细胞减少等。\nE. 错误：Sezary综合征是成熟T细胞淋巴瘤，常表现为红皮病、淋巴结肿大及外周血Sezary细胞，免疫表型多为CD4阳性T细胞，不属于B细胞型淋巴瘤。\n\n易混点：霍奇金淋巴瘤的RS细胞可来源于B细胞，但考试分类中仍单列霍奇金淋巴瘤；蕈样肉芽肿和Sezary综合征均属皮肤T细胞淋巴瘤。记忆要点：滤泡型、弥漫大B、伯基特、套细胞等属B细胞淋巴瘤；蕈样肉芽肿、Sezary综合征属T细胞淋巴瘤。","chapter":12,"chapterName":"淋巴造血系统疾病","chapterTitle":"第12章 淋巴造血系统疾病"},{"id":"pathology-a-single-0072","type":"single","typeLabel":"单选题","number":72,"question":"肾小球肾炎的基本病理改变不包括","options":[{"key":"A","text":"肾小球细胞增多"},{"key":"B","text":"肾小球炎症渗出和坏死"},{"key":"C","text":"肾间质内脓肿形成"},{"key":"D","text":"基膜增厚、系膜基质增多"},{"key":"E","text":"玻璃样变和硬化"}],"answerKeys":["C"],"answerText":["肾间质内脓肿形成"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：肾小球肾炎的基本病理改变局限于肾小球，包括细胞增多、渗出坏死、基膜增厚和系膜基质增多、玻璃样变及硬化。\n解析：肾小球肾炎是以肾小球损伤为主的变态反应性疾病，基本病变可归纳为增生、渗出、坏死和硬化。增生表现为肾小球内细胞增多；渗出和坏死表现为中性粒细胞浸润、纤维素样坏死；基膜增厚及系膜基质增多常见于膜性及系膜增生性病变；病变进展可发生肾小球玻璃样变和硬化。肾间质内脓肿形成属于化脓性间质性炎症，是急性肾盂肾炎等感染性疾病的特征，不是肾小球肾炎的基本改变，本题题眼即“肾间质内脓肿”。\n\n选项分析：\nA. 正确：肾小球细胞增多是肾小球肾炎的基本改变之一，可包括系膜细胞、内皮细胞增生，严重时壁层上皮细胞增生形成新月体。\nB. 正确：肾小球内炎症渗出和坏死属于基本病变，急性毛细血管内增生性肾小球肾炎可见中性粒细胞浸润，新月体性肾小球肾炎等可见毛细血管袢纤维素样坏死。\nC. 错误：肾间质内脓肿形成提示急性肾盂肾炎等化脓性间质性肾炎，病变位于肾间质并伴中性粒细胞聚集和脓肿，不属于肾小球肾炎的基本病理改变。\nD. 正确：基膜增厚和系膜基质增多是肾小球肾炎常见的基本改变，膜性肾小球病以基膜增厚为突出表现，系膜增生性病变可见系膜基质增多。\nE. 正确：玻璃样变和硬化是肾小球肾炎进展和终末期的基本改变，肾小球可逐渐纤维化、玻璃样变，最终形成硬化性肾小球。\n\n易混点：肾小球肾炎的核心病变在肾小球，基本模式为增生、渗出、坏死、基膜增厚和硬化；肾间质脓肿、间质化脓性炎症应首先考虑急性肾盂肾炎。记忆要点：肾小球病变看“球内”，间质脓肿看“感染”。","chapter":13,"chapterName":"泌尿系统疾病","chapterTitle":"第13章 泌尿系统疾病"},{"id":"pathology-a-single-0073","type":"single","typeLabel":"单选题","number":73,"question":"细胞因子主要由哪些细胞产生","options":[{"key":"A","text":"肥大细胞和血小板"},{"key":"B","text":"中性粒细胞和嗜酸性粒细胞"},{"key":"C","text":"淋巴细胞和单核细胞"},{"key":"D","text":"中性粒细胞和嗜碱性粒细胞"},{"key":"E","text":"肥大细胞和嗜碱性粒细胞"}],"answerKeys":["C"],"answerText":["淋巴细胞和单核细胞"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：炎症反应中细胞因子的主要来源是激活的淋巴细胞和单核-巨噬细胞。\n解析：细胞因子是一类由免疫细胞和某些非免疫细胞分泌的小分子多肽，参与炎症细胞活化、趋化、增殖及全身反应。病理学教材强调，激活的淋巴细胞和单核-巨噬细胞是细胞因子的主要产生细胞，如单核-巨噬细胞产生IL-1、IL-6、TNF-α等，淋巴细胞产生淋巴因子并调节免疫和炎症。本题题眼是“主要产生细胞”，应与肥大细胞、嗜碱性粒细胞释放组胺等血管活性介质相区分。\n选项分析：\nA. 错误：肥大细胞主要释放组胺、白三烯等炎症介质；血小板主要参与止血和释放部分颗粒内容物，二者不是细胞因子的主要来源。\nB. 错误：中性粒细胞是急性炎症的主要吞噬细胞，可产生少量趋化因子等；嗜酸性粒细胞主要释放颗粒蛋白、白三烯等，参与寄生虫感染和变态反应，均非主要来源。\nC. 正确：激活的淋巴细胞和单核-巨噬细胞是细胞因子的主要来源，符合炎症中细胞因子网络的核心概念。\nD. 错误：中性粒细胞不是主要细胞因子来源；嗜碱性粒细胞与肥大细胞类似，主要释放组胺、白三烯等过敏和炎症介质。\nE. 错误：肥大细胞和嗜碱性粒细胞是IgE介导变态反应中组胺等介质的重要来源，并非细胞因子的主要产生细胞。\n易混点：细胞因子主要来自淋巴细胞和单核-巨噬细胞；组胺主要来自肥大细胞和嗜碱性粒细胞。记忆时把“细胞因子—淋巴/单核”与“组胺—肥大/嗜碱”分开。","chapter":4,"chapterName":"炎症","chapterTitle":"第4章 炎症"},{"id":"pathology-a-single-0074","type":"single","typeLabel":"单选题","number":74,"question":"血栓形成是指","options":[{"key":"A","text":"在活体的心脏和血管内血液成分形成固体质块的过程"},{"key":"B","text":"血液发生凝固形成固体质块的过程"},{"key":"C","text":"在活体组织内血液发生凝固形成固体质块的过程"},{"key":"D","text":"血液在静止状态中发生的异常凝固"},{"key":"E","text":"活体组织内红细胞发生凝固形成固体质块的过程"}],"answerKeys":["A"],"answerText":["在活体的心脏和血管内血液成分形成固体质块的过程"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：A\n核心考点：血栓形成是在活体心脏和血管内，血液成分发生黏集、凝固形成固体质块的过程。\n解析：血栓形成的本质是活体心血管内血液成分析出并形成固体质块，其发生与心血管内皮损伤、血流缓慢或涡流、血液高凝状态密切相关。血栓可发生于动脉、静脉或心腔，镜下由血小板、纤维蛋白、红细胞和白细胞等构成，并可进一步机化、钙化或脱落形成栓塞。本题题眼是“活体的心脏和血管内”和“血液成分形成固体质块”，强调血栓形成发生于活体循环系统内，而非组织内出血后凝固。\n选项分析：\nA. 正确：准确表述血栓形成的定义，强调活体、心脏和血管内、血液成分形成固体质块，是病理学标准概念。\nB. 错误：仅说血液发生凝固形成固体质块，未限定在活体心脏和血管内，不能区分血栓形成与组织内血肿、体外凝血或死后血凝块。\nC. 错误：活体组织内血液凝固形成固体质块通常指血肿，属于出血后血液在组织内凝固，不是心血管内血栓形成。\nD. 错误：血液在静止状态中异常凝固并非血栓形成的完整定义；血栓形成可在血流缓慢或涡流条件下发生，但关键仍是活体心血管内血液成分形成固体质块。\nE. 错误：活体组织内红细胞发生凝固形成固体质块属于组织内出血后凝血，即血肿形成，不是血栓形成；血栓形成不限于红细胞，且部位在心脏和血管内。\n易混点：血栓形成与血液凝固不同，前者强调活体心血管内血液成分形成固体质块；组织内出血后凝固称血肿。死后血凝块表面光滑、湿润、有弹性，与血管壁无粘连；血栓常较干燥、粗糙，并与血管壁粘连。记忆要点：血栓形成＝活体＋心/血管内＋血液成分＋固体质块。","chapter":3,"chapterName":"局部血液循环障碍","chapterTitle":"第3章 局部血液循环障碍"},{"id":"pathology-a-single-0075","type":"single","typeLabel":"单选题","number":75,"question":"可导致肝脏肿大的疾病不包括","options":[{"key":"A","text":"肺源性心脏病"},{"key":"B","text":"普通型肝炎"},{"key":"C","text":"重型肝炎"},{"key":"D","text":"糖尿病"},{"key":"E","text":"酒精性肝病"}],"answerKeys":["C"],"answerText":["重型肝炎"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：重型肝炎以广泛肝细胞坏死为主，典型表现为肝脏体积缩小而非肿大。\n解析：肝脏肿大的常见病理基础包括肝细胞弥漫性肿胀、肝脂肪变、肝淤血、炎细胞浸润及纤维组织增生等。重型肝炎时肝细胞发生大块或亚大块坏死，肝实质大量丧失，网状支架塌陷，典型急性重型肝炎表现为肝脏体积显著缩小、重量减轻，故不属于导致肝脏肿大的疾病。本题题眼是“重型肝炎”的肝缩小性改变，需与普通型肝炎的肝细胞肿胀、气球样变所致肝大相区别。\n\n选项分析：\nA. 正确：肺源性心脏病可引起慢性右心衰竭，导致肝淤血。肝窦扩张充血、肝细胞受压萎缩，肝脏可肿大并有压痛，长期可发展为心源性肝硬化。\nB. 正确：普通型肝炎即急性病毒性肝炎，肝细胞弥漫性肿胀、气球样变，伴汇管区炎细胞浸润，肝脏常轻度肿大，包膜紧张，临床可有肝区叩击痛。\nC. 错误：重型肝炎以肝细胞大片坏死为特征，急性重型肝炎肝脏体积显著缩小、重量减轻，呈红色或黄色肝萎缩，故不能列为导致肝大的疾病。\nD. 正确：糖尿病可引起肝脂肪变，形成脂肪肝，肝细胞内脂滴蓄积使肝脏体积增大；。此外糖原蓄积也可致肝大。\nE. 正确：酒精性肝病早期常见肝脂肪变，酒精性肝炎时肝细胞肿胀、气球样变及炎细胞浸润，肝脏可肿大；晚期纤维化也可伴肝大。\n\n易混点：普通型肝炎与重型肝炎均可有肝细胞损伤，但普通型肝炎以肝细胞肿胀、气球样变为主而肝大；重型肝炎以广泛坏死、肝实质塌陷为主而肝缩小。记忆要点：急性重型肝炎是“肝越重病越轻”——病情重而肝脏体积小。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-a-single-0076","type":"single","typeLabel":"单选题","number":76,"question":"下列哪种为癌基因","options":[{"key":"A","text":"ras基因"},{"key":"B","text":"P53基因"},{"key":"C","text":"Rb基因"},{"key":"D","text":"APC基因"},{"key":"E","text":"NF-1基因"}],"answerKeys":["A"],"answerText":["ras基因"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：A\n核心考点：癌基因（原癌基因）与抑癌基因的区分，ras属于原癌基因，P53、Rb、APC、NF-1均属于抑癌基因。\n解析：癌基因通常指原癌基因在点突变、扩增、易位等激活后，能促进细胞增殖和转化。ras基因编码小GTP结合蛋白p21，参与Ras-MAPK等信号转导；其点突变可使GTP酶活性下降，Ras持续处于活化状态，常见于胰腺癌、结直肠癌、肺癌等。本题题眼是“癌基因”，应选ras；其余选项均为经典抑癌基因，作用方式是失活后促进肿瘤发生。\n选项分析：\nA. 正确：ras是经典原癌基因，突变后编码的p21持续活化，促进细胞增殖，属于癌基因。\nB. 错误：P53是抑癌基因，编码p53蛋白，参与DNA损伤后的细胞周期阻滞和凋亡；其失活与Li-Fraumeni综合征及多种肿瘤相关。\nC. 错误：Rb是抑癌基因，编码Rb蛋白，调控G1/S期检查点；其失活见于视网膜母细胞瘤及多种肿瘤。\nD. 错误：APC是抑癌基因，参与Wnt/β-catenin通路中β-catenin降解；其失活与家族性腺瘤性息肉病和结直肠癌相关。\nE. 错误：NF-1是抑癌基因，编码神经纤维瘤蛋白，负调控Ras信号；其失活导致神经纤维瘤病I型，不能因其与Ras通路相关而误认为癌基因。\n易混点：NF-1通过负调控Ras通路发挥抑癌作用，但NF-1本身是抑癌基因，ras才是癌基因。记忆要点：癌基因“激活获功能”，抑癌基因“失活失功能”；ras、myc、sis等为癌基因，P53、Rb、APC、NF-1为抑癌基因。","chapter":6,"chapterName":"肿瘤","chapterTitle":"第6章 肿瘤"},{"id":"pathology-a-single-0077","type":"single","typeLabel":"单选题","number":77,"question":"心肌脂肪变性时出现以下哪种病理改变","options":[{"key":"A","text":"心肌间质淋巴细胞浸润"},{"key":"B","text":"心肌细胞脂肪组织浸润"},{"key":"C","text":"心肌肉眼呈红、黄相间的条纹"},{"key":"D","text":"心肌细胞空泡变性"},{"key":"E","text":"心肌组织凝固性坏死"}],"answerKeys":["C"],"answerText":["心肌肉眼呈红、黄相间的条纹"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：心肌脂肪变性（脂肪沉积于心肌细胞内）的肉眼形态呈“虎斑心”，即红、黄相间的条纹。\n解析：心肌脂肪变性常由缺氧、中毒或严重贫血等引起，脂滴蓄积于心肌细胞胞质内，好发于左心室乳头肌和心内膜下心肌。肉眼观察，正常心肌呈暗红色，脂肪变性区呈黄色，二者相间形成红、黄相间的条纹，故称“虎斑心”。本题题眼是“心肌脂肪变性的肉眼病理改变”，应选C。\n\n选项分析：\nA. 错误：心肌间质淋巴细胞浸润提示心肌炎，尤其是病毒性心肌炎等炎症性病变，并非心肌脂肪变性的特征。\nB. 错误：该表述混淆了“心肌脂肪变性”和“心肌脂肪浸润”。心肌脂肪浸润是脂肪组织在心肌间质内增生、浸润，常从心外膜向心肌内延伸，严重时可穿入心壁；而脂肪变性是脂滴蓄积在心肌细胞胞质内。\nC. 正确：心肌细胞脂肪变性后，变性区呈黄色，与正常暗红色心肌相间，形成红、黄相间的条纹，即“虎斑心”，为本病典型肉眼改变。\nD. 错误：心肌细胞空泡变性通常指细胞水肿时胞质内水分增多形成空泡，也可由脂滴在制片中溶解形成空泡，但“空泡变性”不是本题所问的心肌脂肪变性特征性肉眼改变，且概念上易与水肿混淆。\nE. 错误：心肌组织凝固性坏死见于心肌梗死，表现为坏死心肌呈灰黄或灰白色，周围有充血出血带，属坏死而非脂肪变性。\n\n易混点：重点区分“心肌脂肪变性”和“心肌脂肪浸润”：前者是心肌细胞内脂滴沉积，肉眼呈虎斑心；后者是脂肪组织在心肌间质内浸润，常无典型红黄相间条纹。镜下脂肪变性可见心肌细胞内有脂滴空泡，但考试若问肉眼形态，应选“红、黄相间条纹”。","chapter":1,"chapterName":"细胞和组织的适应与损伤","chapterTitle":"第1章 细胞和组织的适应与损伤"},{"id":"pathology-a-single-0078","type":"single","typeLabel":"单选题","number":78,"question":"关于霍奇金病，有诊断意义的细胞是","options":[{"key":"A","text":"类上皮细胞"},{"key":"B","text":"陷窝细胞"},{"key":"C","text":"镜影细胞"},{"key":"D","text":"异物巨细胞"},{"key":"E","text":"异型性组织细胞"}],"answerKeys":["C"],"answerText":["镜影细胞"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n\n核心考点：霍奇金病（霍奇金淋巴瘤）的病理诊断依据是找到具有特征性的R-S细胞，其中典型双核面对面排列者称镜影细胞。\n\n解析：霍奇金病的瘤细胞起源于生发中心B细胞，典型R-S细胞体积大，胞质丰富，双核相对排列，核仁大而嗜酸性，形似“猫头鹰眼”，双核形态呈镜像相对者称镜影细胞，是本病最有诊断意义的细胞。题眼在“有诊断意义”：即看到典型R-S细胞/镜影细胞并结合背景炎性细胞浸润，可提示霍奇金病。\n\n选项分析：\nA. 错误：类上皮细胞是结核等肉芽肿性炎中巨噬细胞转化的细胞，见于结核结节等病变，不是霍奇金病的诊断性瘤细胞。\nB. 错误：陷窝细胞是R-S细胞的变异型，常见于结节硬化型霍奇金病，胞质收缩形成陷窝样空隙，有辅助诊断价值，但本题所问最具特征性、诊断意义的典型细胞为镜影细胞。\nC. 正确：镜影细胞即典型双核R-S细胞，双核相对、核仁明显，是霍奇金病特征性诊断细胞，符合标准答案。\nD. 错误：异物巨细胞见于异物肉芽肿，由巨噬细胞融合形成，核排列杂乱，并非霍奇金病的R-S细胞。\nE. 错误：异型性组织细胞仅提示细胞异型，可见于多种肿瘤或反应性病变，缺乏霍奇金病特异的形态学诊断意义。\n\n易混点：镜影细胞与陷窝细胞均属R-S细胞谱系，但镜影细胞为典型双核R-S细胞，诊断意义最强；陷窝细胞为变异型，多见于结节硬化型。记忆要点：霍奇金病找R-S细胞，双核面对面称镜影细胞。","chapter":12,"chapterName":"淋巴造血系统疾病","chapterTitle":"第12章 淋巴造血系统疾病"},{"id":"pathology-a-single-0079","type":"single","typeLabel":"单选题","number":79,"question":"细动脉玻璃样变最常发生于","options":[{"key":"A","text":"心、脾、肺、视网膜等处的细动脉"},{"key":"B","text":"肾、脑、脾、视网膜等处的细动脉"},{"key":"C","text":"心、肝、肾、脑等处的细动脉"},{"key":"D","text":"肺、胰、脾、肠等处的细动脉"},{"key":"E","text":"肺、脑、脾、视网膜等处的细动脉"}],"answerKeys":["B"],"answerText":["肾、脑、脾、视网膜等处的细动脉"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：细动脉玻璃样变是良性高血压的基本血管病变，好发于肾、脑、脾、视网膜等处的细动脉。\n解析：长期高血压使细动脉内皮受损，血浆蛋白渗入内膜下，并伴平滑肌细胞合成细胞外基质增多，形成均质红染、无结构的玻璃样物质，导致管壁增厚、管腔狭窄。受累器官可因缺血发生相应改变，如肾入球小动脉玻璃样变引起肾小球缺血、肾实质萎缩，脑和视网膜细动脉病变与脑出血、视网膜病变相关。本题题眼是“细动脉玻璃样变”与良性高血压及其典型靶器官的对应关系。\n选项分析：\nA. 错误：脾、视网膜可受累，但心、肺不是细动脉玻璃样变最常列举的部位；肺血管改变更常联系肺动脉高压等病变。\nB. 正确：肾、脑、脾、视网膜是良性高血压细动脉玻璃样变最典型、最常考的部位，尤其是肾入球小动脉。\nC. 错误：肾、脑可受累，但肝不是典型好发部位，心也不是本题所强调的细动脉玻璃样变最常见组合。\nD. 错误：肺、胰、脾、肠不是良性高血压细动脉玻璃样变的典型靶器官组合，不能作为最常见部位。\nE. 错误：脑、脾、视网膜可受累，但肺不是典型好发部位，故组合不正确。\n易混点：细动脉玻璃样变主要见于良性高血压；恶性高血压的特征是细动脉纤维素样坏死和增生性小动脉硬化。动脉粥样硬化主要累及大中动脉，不要与细动脉玻璃样变混淆。记忆要点：良性高血压——细动脉玻璃样变，靶器官记“肾、脑、脾、视网膜”。","chapter":9,"chapterName":"心血管系统疾病","chapterTitle":"第9章 心血管系统疾病"},{"id":"pathology-a-single-0080","type":"single","typeLabel":"单选题","number":80,"question":"下述关于动脉粥样硬化性固缩肾的描述中，哪项是错误的","options":[{"key":"A","text":"可引起肾血管性高血压"},{"key":"B","text":"肾动脉开口处或主干近侧端狭窄"},{"key":"C","text":"肾动脉粥样硬化可并发血栓形成"},{"key":"D","text":"受累的肾脏出现较大块的凹陷瘢痕"},{"key":"E","text":"常引起肾功能不全"}],"answerKeys":["E"],"answerText":["常引起肾功能不全"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n核心考点：肾动脉粥样硬化性固缩肾的病理特点及其与肾功能不全的关系。\n解析：肾动脉粥样硬化使肾动脉开口处或主干近侧端狭窄，受累肾组织缺血萎缩，间质纤维组织增生，形成较大块、不规则的凹陷性瘢痕，故称动脉粥样硬化性固缩肾。缺血可激活肾素-血管紧张素系统，引起肾血管性高血压；粥样斑块表面可并发血栓形成而加重狭窄。但该病变常为单侧或局灶性，健存肾单位可代偿，通常不引起明显肾功能不全，因此E项错误。\n选项分析：\nA. 正确：肾动脉狭窄导致肾缺血，刺激肾素分泌，引起肾血管性高血压，是本题重要临床联系。\nB. 正确：动脉粥样硬化好发于肾动脉开口处或主干近侧端，造成管腔狭窄和肾缺血。\nC. 正确：粥样斑块可破裂、溃疡并继发血栓形成，使肾动脉狭窄加重甚至闭塞。\nD. 正确：缺血区肾实质萎缩、纤维化，形成较大块凹陷瘢痕，是动脉粥样硬化性固缩肾的肉眼特点。\nE. 错误：该病变多为单侧或节段性，健存肾组织可代偿，一般不以肾功能不全为主要表现；常引起肾功能不全者更见于慢性肾小球肾炎、良性高血压晚期等弥漫性肾病变。\n易混点：动脉粥样硬化性固缩肾的瘢痕较大、不规则，常伴肾动脉狭窄和肾血管性高血压；良性高血压性颗粒性固缩肾为双侧弥漫细颗粒状，晚期可肾功能不全；慢性肾小球肾炎为双肾对称性细颗粒状固缩肾，常导致肾功能不全。","chapter":9,"chapterName":"心血管系统疾病","chapterTitle":"第9章 心血管系统疾病"},{"id":"pathology-a-single-0081","type":"single","typeLabel":"单选题","number":81,"question":"胃活检切片，镜下表现如图，应诊断为","options":[{"key":"A","text":"低分化腺癌"},{"key":"B","text":"髓样癌"},{"key":"C","text":"印戒细胞癌"},{"key":"D","text":"硬癌"},{"key":"E","text":"癌肉瘤"}],"answerKeys":["C"],"answerText":["印戒细胞癌"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：胃印戒细胞癌的镜下形态学特征及鉴别诊断。\n\n解析：胃印戒细胞癌属于胃黏液细胞癌的一种特殊类型，癌细胞胞质内积聚大量黏液，将细胞核挤向一侧，使细胞呈“印戒样”外观；癌细胞常弥漫浸润于胃壁，可无明显腺管形成，活检中识别印戒样细胞是本题题眼。题目图片未提供，仅依据文字信息及标准答案分析，不能编造具体图像细节；考试中见到胃活检组织内典型印戒样细胞，应优先考虑印戒细胞癌。该型侵袭性较强，早期可呈黏膜内弥漫分布，临床及肉眼形态有时不典型。\n\n选项分析：\nA. 错误：低分化腺癌指腺管形成少、细胞异型明显的腺癌，可见实性癌巢或少量腺样结构，但典型诊断依据不是胞质内大黏液空泡将核挤向一侧的印戒样细胞；若出现大量印戒样细胞应归入印戒细胞癌。\nB. 错误：髓样癌又称实体癌，特点是癌细胞呈实性巢状或片状排列、间质少，常伴明显淋巴细胞浸润；其诊断要点是实性癌巢和间质稀少，而不是印戒样细胞。\nC. 正确：印戒细胞癌的病理学依据是癌细胞胞质内大量黏液蓄积，核被挤压至一侧，呈印戒状；胃活检中见到这种细胞即可作出倾向性诊断，符合本题标准答案。\nD. 错误：硬癌的特点是癌组织间质纤维组织丰富、癌细胞较少，质地硬，胃内弥漫浸润时可形成“皮革胃”；其核心是间质纤维增生，不是细胞内黏液和印戒样形态。\nE. 错误：癌肉瘤需同时具有癌和肉瘤两种恶性成分，镜下可见上皮性癌成分与梭形细胞肉瘤成分双相分化；本题为胃活检中的印戒样癌细胞，不符合双相恶性肿瘤。\n\n易混点：印戒细胞癌要与低分化腺癌、黏液腺癌鉴别，关键是细胞内黏液将核挤向一侧形成印戒样细胞；硬癌强调间质多、质硬，髓样癌强调实性癌巢、间质少，癌肉瘤强调癌与肉瘤双相成分。记忆要点：印戒看“细胞内黏液+核偏位”，硬癌看“间质纤维化”。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病","needsImage":true},{"id":"pathology-a-single-0082","type":"single","typeLabel":"单选题","number":82,"question":"下列都符合流行性乙型脑炎，除外","options":[{"key":"A","text":"病毒引起的急性传染病"},{"key":"B","text":"也称日本夏季脑炎"},{"key":"C","text":"以蚊虫为传播媒介"},{"key":"D","text":"脑组织以渗出性病变为主"},{"key":"E","text":"病变以大脑皮质、基底节、视丘最为严重"}],"answerKeys":["D"],"answerText":["脑组织以渗出性病变为主"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n\n核心考点：流行性乙型脑炎是由乙型脑炎病毒引起的、以中枢神经系统变质性炎症为主的急性传染病。\n\n解析：流行性乙型脑炎简称乙脑，也称日本夏季脑炎，由乙型脑炎病毒经蚊虫叮咬传播，属于急性传染病。其基本病理变化是脑组织变质性炎，表现为神经细胞变性坏死、卫星现象、噬神经细胞现象、软化灶形成、胶质细胞增生形成胶质结节，以及血管周围淋巴细胞套和脑水肿，而不是“以渗出性病变为主”。病变好发于大脑皮质、基底节和视丘，故D项错误，为本题“除外”项。\n\n选项分析：\nA. 正确：流行性乙型脑炎由乙型脑炎病毒引起，属于病毒性急性传染病，病原学和疾病性质均符合。\nB. 正确：流行性乙型脑炎又称日本夏季脑炎，因最早在日本发现且多发生于夏季，是考试中常见别名。\nC. 正确：乙脑为蚊媒传染病，主要通过蚊虫叮咬传播，猪是重要传染源和扩增宿主。\nD. 错误：乙脑的脑组织病变以变质性炎为主，主要累及神经细胞，可见神经细胞变性坏死、软化灶、胶质结节等；渗出性病变为主更常见于流行性脑脊髓膜炎等化脓性炎症，本题题眼即“变质性炎而非渗出性炎”。\nE. 正确：乙脑病变分布以大脑皮质、基底节、视丘最严重，可解释患者出现意识障碍、抽搐、锥体外系症状等临床表现。\n\n易混点：流行性乙型脑炎是“变质性炎”，流行性脑脊髓膜炎是“化脓性渗出性炎”。记忆要点：乙脑伤神经元、见软化灶和噬神经细胞现象；流脑伤脑膜、见脓性渗出和脑膜刺激征。","chapter":18,"chapterName":"传染病","chapterTitle":"第18章 传染病"},{"id":"pathology-a-single-0083","type":"single","typeLabel":"单选题","number":83,"question":"下述成分是粥样斑块中所不具备的是","options":[{"key":"A","text":"胆固醇结晶"},{"key":"B","text":"纤维结缔组织"},{"key":"C","text":"中性粒细胞"},{"key":"D","text":"泡沫细胞"},{"key":"E","text":"坏死物质"}],"answerKeys":["C"],"answerText":["中性粒细胞"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：动脉粥样硬化粥样斑块的组成成分及其与急性炎症细胞浸润的鉴别。\n解析：粥样斑块由纤维帽和粥样核心构成，纤维帽主要为纤维结缔组织、平滑肌细胞及泡沫细胞等，粥样核心含坏死物质、胆固醇结晶、泡沫细胞和钙化等。斑块内浸润的炎细胞以巨噬细胞（泡沫细胞）和淋巴细胞为主，中性粒细胞不是粥样斑块的固有组成成分。本题题眼是“粥样斑块中所不具备”，应选中性粒细胞。\n\n选项分析：\nA. 错误：胆固醇结晶是粥样核心的典型成分，常呈针状空隙，属于粥样斑块具备的成分。\nB. 错误：纤维结缔组织构成斑块纤维帽的重要部分，属于粥样斑块具备的成分。\nC. 正确：中性粒细胞主要见于急性炎症、斑块破裂继发血栓形成或感染等急性病变，不是粥样斑块的基本组成成分。\nD. 错误：泡沫细胞由巨噬细胞或平滑肌细胞吞噬脂质形成，见于脂纹及粥样斑块内，属于斑块具备的成分。\nE. 错误：坏死物质是粥样核心的重要内容，常与脂质、胆固醇结晶混合存在，属于斑块具备的成分。\n\n易混点：粥样斑块内炎细胞以巨噬细胞和淋巴细胞为主，中性粒细胞多提示急性炎症或斑块破裂继发改变；不要因斑块破裂处可见中性粒细胞，就误认为它是粥样斑块的固有成分。记忆要点：纤维帽看纤维结缔组织和平滑肌，粥样核心看坏死物、胆固醇结晶和泡沫细胞。","chapter":9,"chapterName":"心血管系统疾病","chapterTitle":"第9章 心血管系统疾病"},{"id":"pathology-a-single-0084","type":"single","typeLabel":"单选题","number":84,"question":"肺转移性肝癌是指","options":[{"key":"A","text":"肝癌和肺癌互相转移"},{"key":"B","text":"肝癌转移到肺"},{"key":"C","text":"肝和肺同时发生转移性癌"},{"key":"D","text":"肺癌转移到肝"},{"key":"E","text":"肝癌和肺癌同期转移到其他地方"}],"answerKeys":["B"],"answerText":["肝癌转移到肺"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：转移性肿瘤的命名及原发灶与转移灶的判定。\n解析：肺转移性肝癌指原发癌位于肝，肝细胞癌经血道等途径转移至肺，在肺内形成与原发肝癌组织学形态相似的转移性癌结节。题眼是“原发在肝、转移在肺”，即肝癌肺转移，而不是肺癌与肝癌互相转移。肺内可见多发或孤立性癌结节，镜下具有肝细胞癌的形态特点，临床常可发现肝原发灶。\n选项分析：\nA. 错误：肿瘤转移通常指从原发灶向其他部位播散，“互相转移”不是该命名的含义；若肺癌转移至肝则称肝转移性肺癌。\nB. 正确：原发灶为肝癌，转移部位为肺，符合“肝癌转移到肺”的含义，故肺内病变为转移性肝癌。\nC. 错误：该说法强调肝和肺同时发生转移性癌，等于二者均为转移灶，不能说明原发灶在肝、转移灶在肺。\nD. 错误：肺癌转移到肝应是“肝转移性肺癌”或“肺癌肝转移”，方向与本例相反。\nE. 错误：该说法指肝癌和肺癌同期转移至其他部位，与原题“肺内出现肝癌转移灶”的定位不符。\n易混点：记忆时抓住“转移性×癌”中原发癌的名称和转移部位：肝癌转移到肺称肺转移性肝癌；肺癌转移到肝称肝转移性肺癌。判断关键是先找原发灶，再看转移部位。","chapter":6,"chapterName":"肿瘤","chapterTitle":"第6章 肿瘤"},{"id":"pathology-a-single-0085","type":"single","typeLabel":"单选题","number":85,"question":"以下哪类肿瘤不发生转移","options":[{"key":"A","text":"高分化癌"},{"key":"B","text":"原位癌"},{"key":"C","text":"早期浸润癌"},{"key":"D","text":"微小癌"},{"key":"E","text":"霍奇金病"}],"answerKeys":["B"],"answerText":["原位癌"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n\n核心考点：原位癌未突破基底膜，无浸润和转移能力。\n\n解析：肿瘤转移的前提是癌细胞浸润突破基底膜，进入淋巴管、血管或体腔并到达远处形成继发瘤。原位癌指异型上皮细胞累及上皮全层，但基底膜完整、病变未突破基底膜，因此不发生转移。本题题眼是“不发生转移”，应选尚未获得浸润能力的原位癌。\n\n选项分析：\nA. 错误：高分化癌分化程度较好、恶性程度相对较低，但仍属浸润癌，可发生淋巴道、血道或种植性转移，不能因其“高分化”而认为不转移。\nB. 正确：原位癌病变局限于上皮层内，基底膜完整，无血管、淋巴管侵入，故不发生转移；但若不处理可进展为浸润癌。\nC. 错误：早期浸润癌已突破基底膜并浸润间质，虽浸润范围小、转移率较低，但已具备转移的病理基础，不能视为绝不转移。\nD. 错误：微小癌多指直径很小（如甲状腺微小癌、微小胃癌等）的癌，体积小并不等于无浸润，部分可发生淋巴结转移。\nE. 错误：霍奇金病即霍奇金淋巴瘤，属恶性淋巴瘤，可沿淋巴道扩散并累及淋巴结及结外器官，晚期可播散，并非不发生转移。\n\n易混点：原位癌与早期浸润癌的关键区别在基底膜是否完整：原位癌基底膜完整、无转移；早期浸润癌已突破基底膜、有转移潜能。记忆要点是“未浸润不转移，一浸润即有转移可能”。","chapter":6,"chapterName":"肿瘤","chapterTitle":"第6章 肿瘤"},{"id":"pathology-a-single-0086","type":"single","typeLabel":"单选题","number":86,"question":"确诊淀粉样变常用的染色法是","options":[{"key":"A","text":"刚果红染色"},{"key":"B","text":"苏丹Ⅲ染色"},{"key":"C","text":"普鲁蓝染色"},{"key":"D","text":"PAS染色"},{"key":"E","text":"HE染色"}],"answerKeys":["A"],"answerText":["刚果红染色"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：A\n核心考点：淀粉样变的特殊染色确诊方法，即刚果红染色结合偏振光观察。\n解析：淀粉样变是细胞间质内蛋白质性物质沉积，常呈均质、淡红染，HE染色缺乏特异性。刚果红染色可与淀粉样蛋白的β折叠结构结合，普通光下呈橘红色，偏振光下呈苹果绿色双折光，是确诊淀粉样变的经典染色方法。题眼在“确诊”二字，HE只能提示，不能作为确诊依据。\n选项分析：\nA. 正确：刚果红染色是确诊淀粉样变的常用特殊染色，偏振光下苹果绿色双折光具有重要诊断价值。\nB. 错误：苏丹Ⅲ染色用于显示脂质，常用于脂肪变性或脂肪组织，对应的是脂滴，不是淀粉样蛋白。\nC. 错误：普鲁蓝染色（普鲁士蓝染色）用于显示含铁血黄素中的铁，对应含铁血黄素沉积，不能确诊淀粉样变。\nD. 错误：PAS染色用于显示糖原、糖蛋白、基膜和真菌等，常用于糖原贮积、基膜增厚或真菌感染，不用于确诊淀粉样变。\nE. 错误：HE染色是常规染色，淀粉样物可呈均质淡红染，但缺乏特异性，只能提示而不能确诊。\n易混点：淀粉样变与玻璃样变均可呈均质红染，但淀粉样变须靠刚果红染色及偏振光下苹果绿色双折光确诊；苏丹Ⅲ染脂质，普鲁士蓝染铁，PAS染糖原，要按“染什么物质”对应记忆。","chapter":1,"chapterName":"细胞和组织的适应与损伤","chapterTitle":"第1章 细胞和组织的适应与损伤"},{"id":"pathology-a-single-0087","type":"single","typeLabel":"单选题","number":87,"question":"胃溃疡镜下变化由内向外分别是","options":[{"key":"A","text":"炎性渗出、坏死、肉芽、疤痕"},{"key":"B","text":"坏死、炎性渗出、肉芽、疤痕"},{"key":"C","text":"疤痕、肉芽、炎性渗出、坏死"},{"key":"D","text":"疤痕、肉芽、坏死、炎性渗出"},{"key":"E","text":"坏死、肉芽、炎性渗出、疤痕"}],"answerKeys":["A"],"answerText":["炎性渗出、坏死、肉芽、疤痕"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：A\n核心考点：慢性胃溃疡活动期底部由溃疡表面向深部依次为炎性渗出层、坏死层、肉芽组织层和瘢痕组织层。\n解析：胃溃疡的典型镜下结构呈分层改变：最表层为纤维素性炎性渗出物，其中可见中性粒细胞和坏死细胞碎屑；其下为无结构的坏死层；再深为肉芽组织层，含新生毛细血管和成纤维细胞；最深层为瘢痕组织层，由胶原纤维增生并伴慢性炎细胞浸润。题眼是“由内向外”，即从胃腔面溃疡表面向胃壁深部依次辨认四层结构，故选A。临床可并发出血、穿孔、幽门梗阻及癌变。\n选项分析：\nA. 正确：符合慢性胃溃疡活动期由溃疡表面到深部的经典四层结构，炎性渗出层位于最表面，瘢痕层位于最深处。\nB. 错误：把坏死层置于炎性渗出层之前，实际渗出物覆盖于坏死组织表面；该顺序不符合活动性溃疡底部层次。\nC. 错误：以瘢痕、肉芽起始，相当于从深部向表面排列，且后两层顺序也不符合典型四层结构。\nD. 错误：基本为A项由深到浅的倒置，描述的是由瘢痕层向溃疡表面的逆向层次，而非题干的由内向外。\nE. 错误：将肉芽组织置于炎性渗出层之前，层次关系错乱；炎性渗出应位于最表层，瘢痕应位于最深部。\n易混点：记忆要点为“表面渗出盖坏死，下方肉芽长瘢痕”，即炎性渗出层→坏死层→肉芽组织层→瘢痕组织层。良性溃疡底较平坦、层次清楚；恶性溃疡边缘隆起、底部污秽，镜下为异型肿瘤细胞浸润，不呈规则四层结构。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-a-single-0088","type":"single","typeLabel":"单选题","number":88,"question":"急性弥漫性增生性肾小球肾炎最主要的病变特点是","options":[{"key":"A","text":"肾球囊壁层上皮细胞增生"},{"key":"B","text":"肾小球毛细血管壁纤维素样坏死"},{"key":"C","text":"肾小球系膜细胞和内皮细胞增生"},{"key":"D","text":"肾小球毛细血管内血栓形成及基底膜增厚"},{"key":"E","text":"肾小球内中性粒细胞浸润"}],"answerKeys":["C"],"answerText":["肾小球系膜细胞和内皮细胞增生"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：急性弥漫性增生性肾小球肾炎（毛细血管内增生性肾小球肾炎）以肾小球系膜细胞和内皮细胞弥漫性增生为最主要病变特点。\n解析：急性弥漫性增生性肾小球肾炎多发生于链球菌感染后，属于免疫复合物介导的肾小球肾炎。其核心病理改变是弥漫性肾小球系膜细胞和内皮细胞增生，使毛细血管腔狭窄甚至闭塞，并常伴中性粒细胞浸润，临床上可表现为急性肾炎综合征。题眼是“最主要的病变特点”，即“毛细血管内增生”，增生细胞为系膜细胞和内皮细胞，而不是肾小囊壁层上皮细胞。\n选项分析：\nA. 错误：肾球囊壁层上皮细胞增生形成新月体，是快速进行性肾小球肾炎（新月体性肾小球肾炎）的主要病变，不是急性弥漫性增生性肾小球肾炎的主要特点。\nB. 错误：肾小球毛细血管壁纤维素样坏死常见于新月体性肾小球肾炎、狼疮性肾炎及血管炎相关肾损害等；本病虽可有渗出和毛细血管损伤，但最主要特点是系膜细胞和内皮细胞增生。\nC. 正确：本病又称毛细血管内增生性肾小球肾炎，光镜下可见肾小球系膜细胞和内皮细胞弥漫性增生，伴中性粒细胞浸润，导致毛细血管腔狭窄，是本病的标志性改变。\nD. 错误：毛细血管内血栓形成更常见于血栓性微血管病等；基底膜增厚主要见于膜性肾病等，均不是本病最主要的病变特点。\nE. 错误：肾小球内中性粒细胞浸润确可见于本病，属于渗出性改变，但它是伴随表现，不能替代“系膜细胞和内皮细胞增生”这一最主要增生性病变。\n易混点：注意“毛细血管内增生”与“毛细血管外增生”的区别，前者为系膜细胞和内皮细胞增生，见于急性弥漫性增生性肾小球肾炎；后者为肾小囊壁层上皮细胞增生形成新月体，见于快速进行性肾小球肾炎。记忆要点：急性链球菌感染后肾炎——内皮和系膜增生、中性粒细胞浸润、上皮下驼峰状沉积。","chapter":13,"chapterName":"泌尿系统疾病","chapterTitle":"第13章 泌尿系统疾病"},{"id":"pathology-a-single-0089","type":"single","typeLabel":"单选题","number":89,"question":"有Ph1染色体标志的主要是","options":[{"key":"A","text":"急性粒细胞性白血病"},{"key":"B","text":"慢性粒细胞性白血病"},{"key":"C","text":"慢性淋巴细胞性白血病"},{"key":"D","text":"急性淋巴细胞性白血病"},{"key":"E","text":"急性单核细胞性白血病"}],"answerKeys":["B"],"answerText":["慢性粒细胞性白血病"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：Ph1染色体（费城染色体）是慢性粒细胞性白血病的特征性细胞遗传学标志，本质为t(9;22)形成BCR-ABL1融合基因。\n解析：Ph1染色体由9号染色体长臂与22号染色体长臂相互易位形成，即t(9;22)(q34;q11)，产生BCR-ABL1融合基因，编码具有持续酪氨酸激酶活性的融合蛋白，促进粒细胞克隆性增殖。慢性粒细胞性白血病多见于成人，起病隐匿，外周血白细胞显著增高，以中、晚幼粒细胞和杆状核粒细胞增多为主，常伴嗜酸性、嗜碱性粒细胞增多及脾大；骨髓粒系增生极度活跃。考试题眼是“Ph1染色体标志”，应首选慢性粒细胞性白血病。\n选项分析：\nA. 错误：急性粒细胞性白血病（急性髓系白血病）常见核型包括t(15;17)、t(8;21)、inv(16)等，Ph1染色体不是其主要标志，仅少数病例可出现。\nB. 正确：慢性粒细胞性白血病约95%以上存在Ph1染色体及BCR-ABL1融合基因，是其诊断和靶向治疗的重要分子病理基础。\nC. 错误：慢性淋巴细胞性白血病为成熟小B淋巴细胞肿瘤，常见del(13q)、del(11q)、del(17p)及12号染色体三体等，不以Ph1染色体为标志。\nD. 错误：急性淋巴细胞性白血病部分成人病例可Ph1染色体阳性，但它是部分ALL的预后相关异常，不是“主要”标志；典型Ph1染色体标志仍为慢性粒细胞性白血病。\nE. 错误：急性单核细胞性白血病属于急性髓系白血病，可见11q23/MLL等异常，Ph1染色体不是其典型标志。\n易混点：Ph1染色体阳性并非只见于慢性粒细胞性白血病，成人急性淋巴细胞性白血病也可阳性；但题目问“主要”，应选慢性粒细胞性白血病。记忆要点：t(9;22)=BCR-ABL1=慢性粒细胞性白血病，少数ALL也可阳性。","chapter":12,"chapterName":"淋巴造血系统疾病","chapterTitle":"第12章 淋巴造血系统疾病"},{"id":"pathology-a-single-0090","type":"single","typeLabel":"单选题","number":90,"question":"慢性支气管炎的描述，正确的是","options":[{"key":"A","text":"黏液脓性痰"},{"key":"B","text":"咳铁锈色痰"},{"key":"C","text":"黏液泡沫痰"},{"key":"D","text":"呼吸困难"},{"key":"E","text":"桶状胸"}],"answerKeys":["C"],"answerText":["黏液泡沫痰"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：慢性支气管炎的临床病理联系，典型痰液性状为白色黏液泡沫痰。\n解析：慢性支气管炎时，支气管黏膜黏液腺体增生肥大、杯状细胞增多，分泌亢进，因而患者长期咳嗽、咳白色黏液泡沫痰。病变早期痰液多为黏液性，急性加重合并细菌感染时可变为黏液脓性痰，但这并非慢支最典型的描述。本题题眼是“慢性支气管炎”的典型痰液性质，故选择C。\n选项分析：\nA. 错误：黏液脓性痰可见于慢性支气管炎急性加重期合并细菌感染时，但不是慢支平时的典型描述，不能作为本题最佳答案。\nB. 错误：咳铁锈色痰是大叶性肺炎（尤其肺炎链球菌肺炎）的典型表现，因肺泡内渗出物含红细胞破坏产物所致，不是慢性支气管炎的表现。\nC. 正确：慢性支气管炎因黏液腺增生、杯状细胞增多和分泌亢进，典型表现为长期咳嗽、咳白色黏液泡沫痰，符合标准答案。\nD. 错误：呼吸困难不是慢性支气管炎的早期典型表现；当病变进展并发肺气肿、COPD时可出现逐渐加重的呼吸困难。\nE. 错误：桶状胸是肺气肿导致肺过度充气、胸廓前后径增大的体征，见于慢支并发肺气肿时，不是慢性支气管炎本身的描述。\n易混点：慢性支气管炎典型为白色黏液泡沫痰，急性加重期可呈黏液脓性痰；铁锈色痰提示大叶性肺炎，大量脓痰提示支气管扩张。桶状胸和呼吸困难主要提示肺气肿或COPD，应与单纯慢性支气管炎区分。","chapter":10,"chapterName":"呼吸系统疾病","chapterTitle":"第10章 呼吸系统疾病"},{"id":"pathology-a-single-0091","type":"single","typeLabel":"单选题","number":91,"question":"主动脉瓣狭窄的描述中下列哪一项是错误的","options":[{"key":"A","text":"心室代偿性肥大"},{"key":"B","text":"左心房失代偿性扩张"},{"key":"C","text":"肺淤血水肿"},{"key":"D","text":"右心代偿性肥大"},{"key":"E","text":"主动脉瓣区收缩期杂音"}],"answerKeys":["D"],"answerText":["右心代偿性肥大"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：主动脉瓣狭窄的血流动力学后果是左心室压力负荷增加，引起左心室向心性肥大，晚期才可继发肺淤血和右心改变。\n解析：主动脉瓣狭窄时，左心室收缩期射血受阻，左心室后负荷增加，早期通过左心室心肌向心性肥厚代偿。失代偿后左心室舒张末压升高，左心房压升高，出现左心房扩张及肺淤血、肺水肿。主动脉瓣区可闻及收缩期喷射性杂音。右心室肥大并非主动脉瓣狭窄的直接代偿反应，只有晚期发生肺动脉高压、右心负荷增加时才可能继发右心室肥厚，故D错误。\n选项分析：\nA. 正确：主动脉瓣狭窄使左心室压力负荷增加，早期引起左心室代偿性向心性肥大。\nB. 正确：晚期左心室舒张末压升高，压力向后传递，可引起左心房扩张，失代偿时更明显。\nC. 正确：左心衰竭后肺静脉压升高，可导致肺淤血甚至肺水肿。\nD. 错误：主动脉瓣狭窄直接引起的是左心室肥大；右心室肥大通常继发于晚期肺动脉高压，并非本病直接代偿表现，题眼即“右心代偿性肥大”。\nE. 正确：狭窄处血流形成湍流，产生主动脉瓣区收缩期喷射性杂音，常向颈部传导。\n易混点：主动脉瓣狭窄主要导致左心室向心性肥大；二尖瓣狭窄更常较早引起左心房扩大、肺淤血及右心室肥大。记忆要点：主动脉瓣狭窄“先左室肥厚，晚期肺淤血可累及右心”，但不能把右心代偿性肥厚作为其直接、典型表现。","chapter":9,"chapterName":"心血管系统疾病","chapterTitle":"第9章 心血管系统疾病"},{"id":"pathology-a-single-0092","type":"single","typeLabel":"单选题","number":92,"question":"关于慢性支气管炎的说法，下列哪项是错误的","options":[{"key":"A","text":"40岁以上男性多见"},{"key":"B","text":"可伴喘息症状"},{"key":"C","text":"常见反复咳嗽、咳痰"},{"key":"D","text":"可进展为肺心病"},{"key":"E","text":"常伴发作性呼气性呼吸困难"}],"answerKeys":["E"],"answerText":["常伴发作性呼气性呼吸困难"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n核心考点：慢性支气管炎的临床特点及其与支气管哮喘的鉴别。\n解析：慢性支气管炎以长期、反复咳嗽、咳痰为核心表现，多见于40岁以上男性，尤其吸烟者；病变可累及细支气管并引起阻塞性通气障碍，进而发展为肺气肿、肺动脉高压和肺心病。部分患者因支气管痉挛或分泌物刺激可伴喘息，但“发作性呼气性呼吸困难”是支气管哮喘的典型表现，不是慢性支气管炎常伴的特点。本题题眼在于区分慢性支气管炎的慢性咳痰与哮喘的发作性呼气性呼吸困难。\n选项分析：\nA. 正确：慢性支气管炎好发于40岁以上男性，与长期吸烟、粉尘及反复呼吸道感染等有关，属于考试中常考的人群特点。\nB. 正确：慢性支气管炎可因支气管平滑肌痉挛、黏膜水肿和分泌物增多出现喘息，临床可见喘息型慢性支气管炎。\nC. 正确：反复咳嗽、咳痰是慢性支气管炎最基本的临床表现，常为晨间咳嗽、咳白色黏液痰。\nD. 正确：慢性支气管炎可并发肺气肿和肺动脉高压，最终导致慢性肺源性心脏病，是重要临床联系。\nE. 错误：发作性呼气性呼吸困难主要见于支气管哮喘；慢性支气管炎虽可伴喘息或活动后气促，但不以“发作性呼气性呼吸困难”为常见特点。\n易混点：慢性支气管炎是慢性咳嗽咳痰，常持续存在；支气管哮喘是发作性喘息、呼气性呼吸困难，多有过敏原接触和可逆性气流受限。记忆要点：咳痰两三年、每年三个月是慢支；发作性呼气困难、可逆是哮喘。","chapter":10,"chapterName":"呼吸系统疾病","chapterTitle":"第10章 呼吸系统疾病"},{"id":"pathology-a-single-0093","type":"single","typeLabel":"单选题","number":93,"question":"深达肌肉的开放性创伤组织合并厌氧菌感染所致的坏死属于","options":[{"key":"A","text":"液化性坏死"},{"key":"B","text":"凝固性坏死"},{"key":"C","text":"干性坏疽"},{"key":"D","text":"湿性坏疽"},{"key":"E","text":"气性坏疽"}],"answerKeys":["E"],"answerText":["气性坏疽"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n\n核心考点：坏疽是坏死组织继发腐败菌感染的特殊类型，气性坏疽由深部开放性创伤合并厌氧菌感染引起，以坏死组织产气、肿胀和捻发音为特征。\n\n解析：深达肌肉的开放性创伤形成乏氧环境，利于产气荚膜梭菌等厌氧菌繁殖，细菌分解坏死组织并产生大量气体和毒素，导致气性坏疽。其病变进展迅速，局部明显肿胀、恶臭、可触及捻发音，并伴严重全身中毒症状。本题题眼是“深达肌肉的开放性创伤”加“厌氧菌感染”，这是气性坏疽的典型发生条件。坏死类型上，气性坏疽属于坏死继发腐败菌感染的特殊类型，而非单纯某一基本坏死类型。\n\n选项分析：\nA. 错误：液化性坏死多见于脑梗死、脓肿和急性胰腺炎等，坏死组织被酶解液化，不具有深部创伤合并厌氧菌感染并产气的特征。\nB. 错误：凝固性坏死多见于心、肾、脾等贫血性梗死，坏死组织呈灰白或灰黄、质地较实，结构轮廓可保留，不符合本题厌氧菌感染背景。\nC. 错误：干性坏疽多发于四肢末端，常因动脉阻塞而静脉回流尚可，局部干燥皱缩、呈黑色、界限较清，一般无明显产气和深部肌肉感染。\nD. 错误：湿性坏疽多见于与外界相通的内脏如肺、肠、阑尾、子宫，或四肢伴严重淤血水肿时，局部肿胀湿软、恶臭、界限不清；虽也有腐败菌感染，但本题的“深部肌肉开放性创伤合并厌氧菌”更特指气性坏疽。\nE. 正确：气性坏疽发生于深部开放性创伤，尤其肌肉丰富部位，合并厌氧菌感染后坏死组织产气、肿胀、恶臭并有捻发音，病情凶险，符合题意。\n\n易混点：湿性坏疽与气性坏疽均有腐败菌感染和恶臭，但气性坏疽强调深部肌肉创伤、厌氧菌和产气；干性坏疽强调四肢末端动脉阻塞、干燥黑缩、界限清。记忆要点：深部创伤厌氧菌产气——气性坏疽；内脏淤血腐败湿软——湿性坏疽；四肢末端干燥黑缩——干性坏疽。","chapter":1,"chapterName":"细胞和组织的适应与损伤","chapterTitle":"第1章 细胞和组织的适应与损伤"},{"id":"pathology-a-single-0094","type":"single","typeLabel":"单选题","number":94,"question":"潜水员从深水中过快地升向水面，容易发生","options":[{"key":"A","text":"肺水肿"},{"key":"B","text":"氮气栓塞"},{"key":"C","text":"二氧化碳栓塞"},{"key":"D","text":"肺不张"},{"key":"E","text":"氧气栓塞"}],"answerKeys":["B"],"answerText":["氮气栓塞"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：快速减压时溶解于血液和组织中的氮气析出形成气泡，导致氮气栓塞（减压病）。\n解析：潜水员在深水高压环境下，血液和组织中溶解的氮气量增多；若过快升向水面，外界压力迅速降低，氮气来不及经肺排出而析出形成气泡，随血流运行造成多部位栓塞。氮气栓塞是减压病的主要病理基础，常累及关节、皮肤、神经系统和肺等。本题题眼是“深水作业后过快上升”，提示压力骤降导致气体析出，而非普通肺水肿或气道阻塞。\n选项分析：\nA. 错误：肺水肿多由左心衰竭、急性肺损伤、高原缺氧或中毒等引起，表现为肺间质和肺泡内液体渗出，并非深水快速上浮时气体析出所致。\nB. 正确：高压下氮气大量溶解，快速减压时形成氮气泡，可引起血管内栓塞和组织压迫，符合氮气栓塞（减压病）的发病机制。\nC. 错误：二氧化碳栓塞较少见，可见于严重创伤、产气菌感染或腹腔镜等医源性情况，不是深水快速上浮的典型后果。\nD. 错误：肺不张是支气管阻塞或肺受压后肺泡含气减少、萎陷，与快速减压时气体析出形成栓子无直接关系。\nE. 错误：氧气栓塞并非深水快速上浮的主要机制；高压氧治疗或医源性操作时需警惕氧中毒及气体栓塞，但与本题所述压缩空气潜水快速减压不同。\n易混点：减压病主要与氮气气泡有关，空气栓塞多见于静脉损伤或医源性注气，二氧化碳栓塞多见于产气菌感染或腔镜手术。记忆要点：深潜快速上浮—氮气析出—减压病。","chapter":3,"chapterName":"局部血液循环障碍","chapterTitle":"第3章 局部血液循环障碍"},{"id":"pathology-a-single-0095","type":"single","typeLabel":"单选题","number":95,"question":"引起亚急性感染性心内膜炎的常见病原体是","options":[{"key":"A","text":"草绿色链球菌"},{"key":"B","text":"金黄色葡萄球菌"},{"key":"C","text":"产气荚膜梭状芽孢杆菌"},{"key":"D","text":"柯萨奇B组病毒"},{"key":"E","text":"朊病毒"}],"answerKeys":["A"],"answerText":["草绿色链球菌"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：A\n核心考点：亚急性感染性心内膜炎最常见的病原体是草绿色链球菌。\n解析：亚急性感染性心内膜炎多发生于已有器质性心脏病的基础上，如风湿性心瓣膜病、先天性心脏病等。草绿色链球菌是口腔和上呼吸道正常菌群，侵入血流后可黏附于受损心内膜和瓣膜，形成赘生物。其毒力相对较弱，病程较长，临床常表现为发热、乏力、贫血、脾大、皮肤瘀点及栓塞现象。本题题眼是“亚急性感染性心内膜炎”和“常见病原体”，应首选草绿色链球菌。\n选项分析：\nA. 正确：草绿色链球菌是亚急性感染性心内膜炎最常见的病原体，符合其毒力较弱、病程较长的特点，常继发于风湿性心瓣膜病等器质性心脏病。\nB. 错误：金黄色葡萄球菌毒力强，是急性感染性心内膜炎的常见病原体，也可发生于静脉药瘾者，常累及三尖瓣，不符合“亚急性最常见病原体”这一限定。\nC. 错误：产气荚膜梭状芽孢杆菌主要引起气性坏疽等厌氧菌感染，不是感染性心内膜炎的常见病原体。\nD. 错误：柯萨奇B组病毒主要引起病毒性心肌炎、心包炎等，不引起细菌性心内膜炎，亦不是亚急性感染性心内膜炎病原体。\nE. 错误：朊病毒主要引起克雅病等中枢神经系统海绵状脑病，与感染性心内膜炎无关。\n易混点：急性与亚急性感染性心内膜炎的病原体不同：亚急性以草绿色链球菌最常见，急性以金黄色葡萄球菌最常见。记忆要点是“亚急草绿，急金葡”；但亚急性心内膜炎也可由肠球菌等其他链球菌引起，考试中问“最常见”仍选草绿色链球菌。","chapter":9,"chapterName":"心血管系统疾病","chapterTitle":"第9章 心血管系统疾病"},{"id":"pathology-a-single-0096","type":"single","typeLabel":"单选题","number":96,"question":"十二指肠溃疡病最好发于","options":[{"key":"A","text":"十二指肠各段"},{"key":"B","text":"十二指肠降部"},{"key":"C","text":"十二指肠球部"},{"key":"D","text":"十二指肠降部和球部"},{"key":"E","text":"十二指肠下段后壁"}],"answerKeys":["C"],"answerText":["十二指肠球部"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n\n核心考点：消化性溃疡的好发部位——十二指肠溃疡约95%发生于十二指肠球部。\n\n解析：十二指肠溃疡是最常见的慢性消化性溃疡，其发生是胃酸／胃蛋白酶侵袭作用增强与黏膜防御修复能力下降共同作用的结果。球部紧接幽门，承受胃酸冲击最直接，黏膜下缺乏丰富的碱性黏液保护，且幽门螺杆菌感染率高，因此成为最好发部位。肉眼观溃疡多为单个、直径常小于1cm的圆形或椭圆形缺损，边缘整齐、底部平坦；镜下由浅至深分为四层：渗出层、坏死层、肉芽组织层和瘢痕层。本题题眼即“十二指肠溃疡最好发部位”，属纯记忆性考点。\n\n选项分析：\nA. 错误：十二指肠各段受累并不均等，球部以下各段（降部、水平部、升部）发生消化性溃疡极少，不能笼统称“各段”。\nB. 错误：降部是十二指肠乳头（胆总管和胰管共同开口）所在部位，持续有碱性胆汁、胰液排入中和胃酸，黏膜受保护，原发性消化性溃疡罕见；该处病变多见于十二指肠憩室、壶腹部肿瘤等。\nC. 正确：约95%的十二指肠溃疡位于球部，因球部紧邻幽门、胃酸浓度最高而黏膜防御相对薄弱，是考试要求牢记的好发部位。\nD. 错误：球部为正确好发部位，但降部并非好发部位，将两者并列错误；若在降部以下见到溃疡，应警惕卓-艾综合征（胃泌素瘤）、克罗恩病等特殊病因。\nE. 错误：十二指肠下段（水平部、升部）溃疡极罕见，该处临床问题多为肠系膜上动脉压迫所致的梗阻；后壁溃疡确易侵蚀胃十二指肠动脉引起大出血，但前提是位于球部后壁，而非“下段后壁”。\n\n易混点：胃溃疡好发于胃小弯近幽门侧（胃窦部小弯侧），十二指肠溃疡好发于球部，二者不要混淆。球部溃疡中，前壁者易穿孔，后壁者易侵蚀血管致出血，并可因瘢痕收缩引起幽门梗阻。记忆口诀：“胃小弯、球部好发；前穿孔、后出血”。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-a-single-0097","type":"single","typeLabel":"单选题","number":97,"question":"慢性肾盂肾炎与慢性硬化性肾小球肾炎的肉眼区别主要是","options":[{"key":"A","text":"体积缩小"},{"key":"B","text":"质地变硬"},{"key":"C","text":"肾内小动脉硬化"},{"key":"D","text":"颜色苍白"},{"key":"E","text":"表面有不规则的凹陷性瘢痕"}],"answerKeys":["E"],"answerText":["表面有不规则的凹陷性瘢痕"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n\n核心考点：慢性肾盂肾炎与慢性硬化性肾小球肾炎的肉眼形态鉴别，关键在瘢痕的分布和形态。\n\n解析：慢性肾盂肾炎因反复化脓性炎症及纤维化，肾表面形成不规则的凹陷性瘢痕，瘢痕常不对称，可伴肾盂肾盏变形；慢性硬化性肾小球肾炎则表现为双肾对称性弥漫性细颗粒状固缩肾。两者到晚期都可有体积缩小、质地变硬、颜色苍白及小动脉硬化，因此主要肉眼区别是瘢痕形态。本题题眼是“表面有不规则的凹陷性瘢痕”。\n\n选项分析：\nA. 错误：体积缩小是慢性肾盂肾炎和慢性硬化性肾小球肾炎晚期均可出现的改变，不能作为主要鉴别点。\nB. 错误：两者均因纤维化、肾单位减少而质地变硬，属于共同表现。\nC. 错误：肾内小动脉硬化可见于慢性硬化性肾小球肾炎，也可见于高血压及慢性肾盂肾炎等，非两者主要肉眼区别。\nD. 错误：颜色苍白与纤维化、缺血有关，两者晚期均可苍白，鉴别价值小。\nE. 正确：慢性肾盂肾炎的特征性肉眼改变是肾表面有不规则、不对称的凹陷性瘢痕，切面可见肾盂肾盏变形；慢性硬化性肾小球肾炎为弥漫细颗粒状，无明显不规则大瘢痕。\n\n易混点：慢性硬化性肾小球肾炎呈“颗粒性固缩肾”，双肾对称、表面细颗粒；慢性肾盂肾炎呈“瘢痕肾”，瘢痕不规则且常不对称，并累及肾盂肾盏。记忆要点：看瘢痕是否规则、是否对称，以及有无肾盂肾盏变形。","chapter":13,"chapterName":"泌尿系统疾病","chapterTitle":"第13章 泌尿系统疾病"},{"id":"pathology-a-single-0098","type":"single","typeLabel":"单选题","number":98,"question":"流行性乙型脑炎的病变部位最轻微的是","options":[{"key":"A","text":"大脑皮层"},{"key":"B","text":"脊髓"},{"key":"C","text":"丘脑"},{"key":"D","text":"中脑"},{"key":"E","text":"基底核"}],"answerKeys":["B"],"answerText":["脊髓"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：流行性乙型脑炎的中枢神经系统病变分布具有“脑重脊髓轻”的特点，最轻微部位为脊髓。\n解析：流行性乙型脑炎是由乙型脑炎病毒经蚊传播引起的急性传染病，病变主要累及中枢神经系统灰质，表现为神经细胞变性坏死、卫星现象和噬神经细胞现象、血管淋巴细胞套、胶质结节及筛状软化灶。病变分布以大脑皮质、基底核、丘脑、中脑等部位较重，越向低位中枢越轻，脊髓受累最轻，故本题题眼是“病变部位最轻微”。\n选项分析：\nA. 错误：大脑皮质是乙脑病变较重的部位之一，常可见神经细胞变性坏死、胶质结节和软化灶，不是最轻微部位。\nB. 正确：脊髓虽可受累，但乙脑病变以大脑皮质、基底核、丘脑、中脑等为重，脊髓病变最轻微，符合标准答案。\nC. 错误：丘脑是乙脑常累及且病变较重的部位之一，可出现神经细胞坏死和炎症反应，并非最轻微。\nD. 错误：中脑属于乙脑病变较重部位，脑干灰质受累明显，不能选为最轻微。\nE. 错误：基底核是乙脑好发且病变较重的部位之一，常与大脑皮质、丘脑等同时受累，不是最轻微。\n易混点：乙脑为病毒引起的变质性炎，病变以灰质为主，呈“大脑皮质、基底核、丘脑、中脑较重，脊髓最轻”的分布；不要误认为脊髓完全不受累。与流行性脑脊髓膜炎不同，后者为化脓性炎、累及脑膜，而乙脑主要累及脑实质。记忆要点：乙脑“上重下轻”，脊髓最轻。","chapter":18,"chapterName":"传染病","chapterTitle":"第18章 传染病"},{"id":"pathology-a-single-0099","type":"single","typeLabel":"单选题","number":99,"question":"关于胃癌的转移途径的叙述，下列哪项是错误的","options":[{"key":"A","text":"癌细胞脱落种植于盆腔器官"},{"key":"B","text":"血道转移至肝脏"},{"key":"C","text":"癌细胞脱落种植于十二指肠壁"},{"key":"D","text":"淋巴道转移至所属局部淋巴结"},{"key":"E","text":"淋巴道转移至大网膜淋巴结"}],"answerKeys":["C"],"answerText":["癌细胞脱落种植于十二指肠壁"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：胃癌的转移途径及种植性转移的常见部位；需区分种植转移与直接蔓延。\n解析：胃癌转移途径包括淋巴道、血道、种植性转移和直接蔓延。淋巴道转移最早、最常见，先至胃周局部淋巴结，可进一步累及大网膜淋巴结等；血道转移多经门静脉至肝，故肝是最常见血道转移部位；癌细胞脱落后可种植于腹膜、盆腔器官，如直肠子宫陷凹、卵巢形成Krukenberg瘤。C项“癌细胞脱落种植于十二指肠壁”不属于胃癌典型种植部位；胃癌累及十二指肠壁通常为癌组织直接蔓延，而非脱落种植，故C错误。本题题眼是“转移途径”中的“种植”与“直接蔓延”的鉴别。\n选项分析：\nA. 正确：胃癌侵透浆膜后癌细胞脱落，可种植于腹膜及盆腔器官，常见于直肠子宫陷凹，卵巢种植可形成Krukenberg瘤。\nB. 正确：胃癌血道转移经门静脉系统首先至肝，肝是最常见的血道转移部位。\nC. 错误：十二指肠壁受胃癌累及多因胃窦部癌直接蔓延所致，属于直接蔓延；脱落癌细胞种植的典型部位是腹腔、盆腔，而非十二指肠壁。\nD. 正确：淋巴道转移是胃癌最常见、发生较早的转移途径，常转移至胃周所属局部淋巴结。\nE. 正确：胃癌可沿淋巴引流转移至大网膜淋巴结，属于淋巴道转移的常见表现之一。\n易混点：种植性转移是癌细胞脱落后在浆膜面或盆腔器官表面生长，典型为Krukenberg瘤；直接蔓延是癌组织连续浸润邻近器官。胃癌侵犯十二指肠应首先考虑直接蔓延，不要误记为种植转移。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-a-single-0100","type":"single","typeLabel":"单选题","number":100,"question":"肉芽组织和肉芽肿的区别点在于","options":[{"key":"A","text":"是否为慢性炎症"},{"key":"B","text":"是否导致局部纤维化"},{"key":"C","text":"是否由急性转化而来"},{"key":"D","text":"组成成分不同"},{"key":"E","text":"最后结局不同"}],"answerKeys":["D"],"answerText":["组成成分不同"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：肉芽组织与肉芽肿是本质不同的两种病理概念，区别在于组成成分不同。\n解析：肉芽组织是组织损伤后由新生毛细血管、成纤维细胞及炎细胞共同构成的修复性组织，肉眼呈鲜红色、颗粒状、柔软湿润，最终可纤维化形成瘢痕。肉芽肿则是由巨噬细胞及其转化来的上皮样细胞、多核巨细胞构成的结节状病灶，是慢性肉芽肿性炎的特征性病变。本题题眼是“肉芽组织”和“肉芽肿”名称相近但本质不同，核心区别在组成成分，而不是病程、结局或是否由急性炎症转化而来。\n选项分析：\nA. 错误：肉芽组织可见于急性炎症后的修复及创伤愈合过程，并非慢性炎症所特有；肉芽肿虽属慢性炎症，但“是否为慢性炎症”不是二者根本区别。\nB. 错误：肉芽组织最终常纤维化形成瘢痕；肉芽肿也可发生纤维化、钙化等，因此是否导致局部纤维化不能作为区别点。\nC. 错误：肉芽组织可在组织损伤、急性炎症后出现，但肉芽肿并非简单地由急性炎症转化而来，而是慢性肉芽肿性炎的特征性病变；该点不是二者本质区别。\nD. 正确：肉芽组织由新生毛细血管、成纤维细胞和炎细胞组成；肉芽肿由巨噬细胞、上皮样细胞和多核巨细胞等组成，二者组成成分不同是根本区别。\nE. 错误：肉芽组织结局多为纤维化形成瘢痕；肉芽肿可纤维化、钙化或吸收，结局并非区分二者的关键，且二者均可有纤维化结局。\n易混点：肉芽组织是修复性组织，不是慢性炎性结节；肉芽肿是慢性肉芽肿性炎的结节状病灶，不是肿瘤。记忆要点：肉芽组织看“毛细血管+成纤维细胞”，肉芽肿看“巨噬细胞+上皮样细胞+多核巨细胞”。","chapter":4,"chapterName":"炎症","chapterTitle":"第4章 炎症"},{"id":"pathology-a-single-0101","type":"single","typeLabel":"单选题","number":101,"question":"流行性乙型脑炎的传播途径","options":[{"key":"A","text":"呼吸道"},{"key":"B","text":"消化道"},{"key":"C","text":"神经"},{"key":"D","text":"虫媒传染"},{"key":"E","text":"皮肤接触传染"}],"answerKeys":["D"],"answerText":["虫媒传染"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：流行性乙型脑炎是由乙型脑炎病毒引起、经蚊虫叮咬传播的虫媒性传染病。\n解析：乙型脑炎病毒主要在蚊（我国以三带喙库蚊为主）体内繁殖，猪是重要的扩增宿主，人被带毒蚊虫叮咬后形成病毒血症，病毒再经血行突破血脑屏障侵犯中枢神经系统。病变以脑实质炎症为主，常累及基底核、视丘、大脑皮质及脑干，可见神经细胞变性坏死、噬神经细胞现象、卫星现象、血管淋巴细胞套及软化灶。题眼是“传播途径”，应抓住蚊虫叮咬这一虫媒环节。\n选项分析：\nA. 错误：呼吸道传播常见于流行性脑脊髓膜炎、肺结核等，乙脑不通过飞沫或空气传播。\nB. 错误：消化道传播常见于甲型肝炎、脊髓灰质炎等，乙脑不是粪-口途径传播；脊髓灰质炎虽也侵犯神经系统，但传播途径和病变部位均不同。\nC. 错误：经神经传播的典型例子是狂犬病病毒沿周围神经向中枢上行，乙脑主要经蚊虫叮咬后血行播散入脑，不是以神经直接传播为主要途径。\nD. 正确：乙脑属于虫媒传染病，带毒蚊虫叮咬是其主要传播途径，猪为重要储存和扩增宿主。\nE. 错误：皮肤接触传播可见于狂犬病咬伤后经伤口感染、炭疽接触感染等，乙脑不通过直接皮肤接触患者或动物传播。\n易混点：乙脑与流脑均可有高热、头痛、脑膜刺激征，但乙脑为蚊媒传播、脑实质受累明显；流脑为呼吸道飞沫传播、以化脓性脑膜炎为主。脊髓灰质炎经消化道传播并主要累及脊髓前角，狂犬病经动物咬伤后沿神经上行，均不能与乙脑的虫媒传播混淆。记忆要点：乙脑“蚊媒、猪宿主、脑实质软化灶”。","chapter":16,"chapterName":"神经系统疾病","chapterTitle":"第16章 神经系统疾病"},{"id":"pathology-a-single-0102","type":"single","typeLabel":"单选题","number":102,"question":"大量空气迅速进入血液循环引起死亡的原因是","options":[{"key":"A","text":"心肌梗死"},{"key":"B","text":"急性心力衰竭和呼吸衰竭"},{"key":"C","text":"脑栓塞"},{"key":"D","text":"肺梗死"},{"key":"E","text":"心脏破裂"}],"answerKeys":["B"],"answerText":["急性心力衰竭和呼吸衰竭"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：空气栓塞的死亡机制，即大量空气迅速入血后阻塞右心及肺动脉，导致急性循环、呼吸衰竭。\n解析：大量空气迅速进入静脉后，随血流进入右心。右心收缩使空气与血液混合形成泡沫状血液，阻塞肺动脉入口，使静脉回流受阻、肺动脉输出明显减少，肺循环障碍并严重缺氧，进而引起急性右心衰竭和呼吸衰竭而死亡。题眼是“大量、迅速”，强调空气不能及时溶解吸收，形成机械性阻塞；少量缓慢进入的空气多可逐渐被吸收而不致死亡。\n选项分析：\nA. 错误：心肌梗死是冠状动脉急性阻塞导致心肌缺血性坏死，常见于血栓形成或栓塞，不是大量空气迅速入血致死的主要机制；空气虽偶可进入冠状动脉，但非本题所述共同致死原因。\nB. 正确：大量空气在右心形成泡沫血，阻塞肺动脉入口，导致急性心力衰竭和呼吸衰竭，这是空气栓塞迅速致死的核心机制。\nC. 错误：脑栓塞可由栓子进入体循环动脉引起，空气仅在存在心房/心室间隔缺损等右向左分流时偶可导致反常栓塞；它不是大量空气迅速入静脉后致死的主要机制。\nD. 错误：肺梗死多由肺动脉血栓栓塞等引起，且肺有支气管动脉和肺动脉双重血供，空气栓子一般不易造成典型肺梗死；本题强调右心及肺动脉入口的机械性阻塞。\nE. 错误：心脏破裂常见于急性透壁性心肌梗死、心脏压塞或外伤等，与大量空气进入血液循环无直接病理联系。\n易混点：血栓栓塞常引起相应器官梗死，如肺动脉血栓栓塞可致肺梗死；空气栓塞的关键是右心内泡沫状血液阻塞肺动脉入口，致死机制为急性心衰和呼衰。记忆要点：大量空气迅速入血——右心泡沫、肺动脉阻塞——急性心衰、呼衰致死。","chapter":3,"chapterName":"局部血液循环障碍","chapterTitle":"第3章 局部血液循环障碍"},{"id":"pathology-a-single-0103","type":"single","typeLabel":"单选题","number":103,"question":"关于亚急性感染性心内膜炎，下列哪项描述是错误的","options":[{"key":"A","text":"常引起栓塞"},{"key":"B","text":"常由草绿色链球菌引起"},{"key":"C","text":"可在拔牙或尿道手术后发生"},{"key":"D","text":"常发生在原有病变的心瓣膜上"},{"key":"E","text":"常在二尖瓣闭锁缘形成单行排列、灰白色、粟粒大小的赘生物"}],"answerKeys":["E"],"answerText":["常在二尖瓣闭锁缘形成单行排列、灰白色、粟粒大小的赘生物"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n核心考点：亚急性感染性心内膜炎与风湿性心内膜炎赘生物形态的鉴别。\n解析：亚急性感染性心内膜炎多由草绿色链球菌引起，常发生于已有病变的心瓣膜（如风湿性心瓣膜病），拔牙、泌尿道手术等可造成短暂菌血症而诱发。其赘生物由细菌团、坏死组织、血小板和纤维蛋白等构成，质地松脆，易脱落引起栓塞。E项所述“二尖瓣闭锁缘单行排列、灰白色、粟粒大小”的赘生物是急性风湿性心内膜炎的典型形态，并非亚急性感染性心内膜炎的表现，故E为错误项。\n选项分析：\nA. 正确：亚急性感染性心内膜炎的赘生物松脆易脱落，可形成栓子，常引起脑、肾、脾等器官栓塞。\nB. 正确：亚急性感染性心内膜炎最常见的致病菌是草绿色链球菌。\nC. 正确：拔牙、泌尿道手术等可导致菌血症，细菌易在原有病变的瓣膜上定植，引发亚急性感染性心内膜炎。\nD. 正确：亚急性感染性心内膜炎常发生在风湿性心瓣膜病等原有病变的心瓣膜上，二尖瓣和主动脉瓣好发。\nE. 错误：二尖瓣闭锁缘单行排列、灰白色、粟粒大小、串珠状赘生物是风湿性心内膜炎的特点；亚急性感染性心内膜炎的赘生物常较大、不规则、呈菜花状或息肉状，质松脆、易脱落。\n易混点：风湿性心内膜炎赘生物无菌、附着牢固、不易脱落；亚急性感染性心内膜炎赘生物含细菌、松脆易脱落，常致栓塞。记忆要点：闭锁缘串珠状→风湿性；菜花状松脆含菌→感染性。","chapter":9,"chapterName":"心血管系统疾病","chapterTitle":"第9章 心血管系统疾病"},{"id":"pathology-a-single-0104","type":"single","typeLabel":"单选题","number":104,"question":"不符合慢性支气管炎咳嗽咳痰的病理基础是","options":[{"key":"A","text":"黏膜上皮杯状细胞增多"},{"key":"B","text":"浆液细胞黏液化"},{"key":"C","text":"黏液腺增生"},{"key":"D","text":"管壁充血水肿，炎性渗出"},{"key":"E","text":"纤毛细胞增生"}],"answerKeys":["E"],"answerText":["纤毛细胞增生"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n核心考点：慢性支气管炎咳嗽、咳痰的病理基础是黏液分泌增多和呼吸道黏液-纤毛排送系统受损。\n\n解析：慢性支气管炎时，黏膜下黏液腺增生肥大、浆液腺黏液化生，杯状细胞增多，黏液分泌亢进，形成大量痰液；同时黏膜充血水肿、炎性细胞浸润和渗出，刺激咳嗽反射。纤毛柱状上皮常发生变性、坏死、脱落，纤毛变短、粘连、倒伏或脱失，导致纤毛清除功能下降，分泌物潴留而咳痰。因此“纤毛细胞增生”不符合慢性支气管炎咳嗽咳痰的病理基础，本题题眼是黏液分泌增加与纤毛清除功能障碍，而非纤毛细胞增生。\n\n选项分析：\nA. 正确：黏膜上皮杯状细胞增多，黏液分泌增加，是痰多的重要基础。\nB. 正确：浆液细胞黏液化生，可使黏液成分增多，促进咳痰。\nC. 正确：黏液腺增生肥大是慢性支气管炎的主要形态学改变之一，直接导致痰液分泌增多。\nD. 正确：管壁充血水肿、炎性渗出可刺激黏膜和咳嗽感受器，并增加气道分泌物。\nE. 错误：慢性支气管炎时纤毛柱状上皮多受损，纤毛细胞可变性、坏死、脱落，纤毛功能降低，后期还可发生鳞状化生；纤毛细胞增生并非本病的典型改变，也不能解释咳嗽咳痰。\n\n易混点：慢性支气管炎的核心是“黏液多、纤毛坏”：黏液腺增生、杯状细胞增多、浆液腺黏液化生使痰多；纤毛受损使痰排不出去。不要误记为“纤毛细胞增生”，纤毛细胞增生不是慢支咳嗽咳痰的病理基础。","chapter":10,"chapterName":"呼吸系统疾病","chapterTitle":"第10章 呼吸系统疾病"},{"id":"pathology-a-single-0105","type":"single","typeLabel":"单选题","number":105,"question":"慢性胃溃疡最好发的部位是","options":[{"key":"A","text":"胃大弯近幽门部"},{"key":"B","text":"胃大弯近贲门部"},{"key":"C","text":"胃小弯近幽门部"},{"key":"D","text":"胃小弯近贲门部"},{"key":"E","text":"胃体小弯侧"}],"answerKeys":["C"],"answerText":["胃小弯近幽门部"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：慢性胃溃疡最好发于胃小弯近幽门部，即胃窦小弯侧。\n解析：慢性消化性胃溃疡约75%～80%发生于胃小弯近幽门部，尤以胃窦小弯侧最常见。该处黏膜与胃酸、胃蛋白酶接触时间较长，且局部黏膜防御修复能力相对薄弱，易形成圆形或椭圆形溃疡，直径多小于2cm，边缘整齐、底部平坦，周围黏膜皱襞可呈放射状。题眼是“慢性胃溃疡最好发部位”，应与胃癌好发部位及十二指肠溃疡好发部位相区分。\n选项分析：\nA. 错误：胃大弯近幽门部不是慢性胃溃疡的典型好发部位，大弯侧溃疡较少见，若见较大溃疡需警惕恶性可能。\nB. 错误：胃大弯近贲门部属于胃底贲门区，慢性消化性溃疡少见，不能作为最好发部位。\nC. 正确：胃小弯近幽门部即胃窦小弯侧，是慢性胃溃疡最经典、最常见的好发部位，考试常以此作为题眼。\nD. 错误：胃小弯近贲门部靠近贲门胃底区，该处溃疡发生率低，不是慢性胃溃疡最好发部位。\nE. 错误：胃体小弯侧虽可发生溃疡，但不如胃小弯近幽门部常见，属于非最佳选项，不能取代“胃窦小弯侧”的经典定位。\n易混点：胃癌也好发于胃窦小弯侧，但恶性溃疡常较大、边缘隆起不规则、底部凹凸不平；慢性胃溃疡则多较小、边缘整齐、底部平坦。十二指肠消化性溃疡最好发于球部，不要与胃溃疡好发部位混淆。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-a-single-0106","type":"single","typeLabel":"单选题","number":106,"question":"关于化脓性炎的叙述，下列不正确的是","options":[{"key":"A","text":"表面化脓是指发生在浆膜、黏膜的化脓性炎"},{"key":"B","text":"黏膜的化脓性炎又可称为脓性卡他"},{"key":"C","text":"化脓性炎可不伴有坏死"},{"key":"D","text":"蜂窝织炎是指弥漫性化脓性炎"},{"key":"E","text":"当脓液在组织间隙或体腔、自然管腔中积聚时称为积脓"}],"answerKeys":["C"],"answerText":["化脓性炎可不伴有坏死"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：化脓性炎以中性粒细胞渗出为主，并伴有组织坏死和脓液形成。\n解析：化脓性炎的基本病变是大量中性粒细胞渗出、组织坏死溶解及脓液形成；坏死的程度可轻可重，但“可不伴有坏死”不符合其基本概念，故C为不正确项。题眼是“化脓性炎=中性粒细胞渗出+组织坏死+脓液形成”。\n\n选项分析：\nA. 正确：表面化脓指发生在浆膜、黏膜表面的化脓性炎，脓性渗出物主要位于表面。\nB. 正确：黏膜的化脓性炎伴较多黏液分泌时称为脓性卡他，属于表面化脓的表现。\nC. 错误：化脓性炎常伴不同程度组织坏死，坏死溶解后形成脓液；“可不伴坏死”的表述不符合定义。\nD. 正确：蜂窝织炎是疏松结缔组织的弥漫性化脓性炎，常由溶血性链球菌引起，好发于皮肤、肌肉和阑尾。\nE. 正确：脓液在组织间隙、体腔或自然管腔内积聚可称积脓；体腔和自然管腔积脓尤具代表性。\n\n易混点：脓肿为局限性化脓性炎并有脓腔形成；蜂窝织炎为疏松结缔组织弥漫性化脓性炎；积脓强调脓液蓄积于体腔或自然管腔。记忆要点：局限成腔是脓肿，弥漫疏松是蜂窝织炎，腔道积脓是积脓。","chapter":4,"chapterName":"炎症","chapterTitle":"第4章 炎症"},{"id":"pathology-a-single-0107","type":"single","typeLabel":"单选题","number":107,"question":"良性肿瘤对机体的影响主要取决于肿瘤的","options":[{"key":"A","text":"生长方式"},{"key":"B","text":"生长部位"},{"key":"C","text":"生长速度"},{"key":"D","text":"有无复发"},{"key":"E","text":"有无转移"}],"answerKeys":["B"],"answerText":["生长部位"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：良性肿瘤对机体的影响主要取决于肿瘤的生长部位，而不是其良恶性本身。\n解析：良性肿瘤分化较成熟、生长缓慢、呈膨胀性生长，通常不转移，但由于生长部位特殊，仍可引起严重后果，如颅内良性肿瘤压迫脑组织、气管内肿瘤阻塞气道、肠腔内肿瘤引起肠梗阻等。题眼在于“良性肿瘤”并非都危害小，其危害大小主要看发生在什么部位、是否压迫重要器官或阻塞管腔。\n\n选项分析：\nA. 错误：生长方式是肿瘤的生物学行为之一，良性肿瘤多呈膨胀性生长，但生长方式本身不是决定其对机体影响的主要因素。\nB. 正确：生长部位决定肿瘤是否压迫重要器官、阻塞管道或影响功能，是良性肿瘤对机体影响的主要决定因素。\nC. 错误：生长速度可影响肿瘤体积增大和压迫程度，但不是主要决定因素；良性肿瘤一般生长缓慢。\nD. 错误：有无复发与肿瘤是否切除彻底、生物学行为等有关，部分良性肿瘤可复发，但不是判断其对机体影响的主要依据。\nE. 错误：有无转移主要用于区分良恶性肿瘤，良性肿瘤一般不转移，因此不是良性肿瘤影响机体的主要决定因素。\n\n易混点：良性肿瘤与恶性肿瘤的最大区别在于是否浸润和转移，但“对机体影响的严重程度”不能只看良恶性。记忆要点：良性肿瘤“不转移但可致命”，关键看部位，如颅内、气道、肠道等特殊部位可因压迫或梗阻产生严重后果。","chapter":6,"chapterName":"肿瘤","chapterTitle":"第6章 肿瘤"},{"id":"pathology-a-single-0108","type":"single","typeLabel":"单选题","number":108,"question":"光镜下判断细胞是否坏死，主要观察","options":[{"key":"A","text":"染色质形态的改变"},{"key":"B","text":"核仁形态的改变"},{"key":"C","text":"细胞质形态的改变"},{"key":"D","text":"细胞核形态的改变"},{"key":"E","text":"细胞形态的改变"}],"answerKeys":["D"],"answerText":["细胞核形态的改变"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：光镜下判断细胞坏死最可靠的形态学依据是细胞核的改变，即核固缩、核碎裂和核溶解。\n解析：细胞坏死的镜下标志以核变化最为关键。核固缩表现为核体积缩小、染色质浓缩深染；核碎裂表现为核染色质碎块散在；核溶解表现为染色质变淡、核轮廓消失。细胞质嗜酸性增强、细胞肿胀及细胞膜完整性丧失等也可出现，但可逆性损伤或自溶时亦可类似，故判断坏死主要看细胞核形态改变。本题题眼是“光镜下判断细胞是否坏死”，应选涵盖坏死三大核变化的“细胞核形态的改变”。\n选项分析：\nA. 错误：染色质形态改变属于核改变的一部分，但范围过窄；凋亡时也可见染色质边集、浓缩，不能作为判断坏死的完整主要指标。\nB. 错误：核仁形态改变可见于代谢变化、损伤修复等，并非坏死最特征、最可靠的判断依据。\nC. 错误：细胞质改变如嗜酸性增强、颗粒状或空泡状变可见于可逆性损伤，不能单独据此判定坏死。\nD. 正确：坏死时出现核固缩、核碎裂、核溶解，是光镜下判断细胞坏死的主要依据。\nE. 错误：细胞形态改变如细胞肿胀、轮廓改变等也可见于可逆性细胞损伤，缺乏坏死判断的特异性。\n易混点：坏死与凋亡均可有核改变，但坏死以核固缩、核碎裂、核溶解为经典表现，且常伴细胞膜破裂和炎症反应；凋亡则细胞膜完整、形成凋亡小体。记忆要点：判断坏死先看核，“固缩、碎裂、溶解”三联征最常考。","chapter":1,"chapterName":"细胞和组织的适应与损伤","chapterTitle":"第1章 细胞和组织的适应与损伤"},{"id":"pathology-a-single-0109","type":"single","typeLabel":"单选题","number":109,"question":"下列哪项不是胆汁性肝硬化的病变特点","options":[{"key":"A","text":"肝脏呈绿色"},{"key":"B","text":"有胆汁湖形成"},{"key":"C","text":"肝细胞显著脂肪变性"},{"key":"D","text":"含有胆汁的肝细胞呈羽毛状坏死"},{"key":"E","text":"肝汇管区可有急性或慢性炎症细胞浸润"}],"answerKeys":["C"],"answerText":["肝细胞显著脂肪变性"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：胆汁性肝硬化的病理形态特点及胆汁淤积性肝损伤。\n解析：胆汁性肝硬化以长期胆汁淤积为启动因素，胆红素沉积使肝呈绿色，汇管区可见急、慢性炎症细胞浸润及胆管周围纤维化，并可形成胆汁湖。胆汁酸损伤肝细胞可致肝细胞胞浆疏松淡染、呈羽毛状变性甚至坏死，因此A、B、D、E均符合。显著脂肪变性主要见于脂肪肝、酒精性肝病等，不是胆汁性肝硬化的特征性病变，故本题题眼是“不是”。\n\n选项分析：\nA. 正确：长期胆汁淤积使胆红素沉积于肝组织，肉眼可见肝脏呈绿色或黄绿色，是胆汁性肝硬化的典型表现。\nB. 正确：胆汁湖为胆汁在扩张胆管或坏死组织中淤积形成的胆汁池，是胆汁性肝硬化较有诊断意义的形态学表现。\nC. 错误：显著脂肪变性不是胆汁性肝硬化的病变特点，而更符合脂肪肝、酒精性肝病等代谢性肝损伤；胆汁性肝硬化以胆汁淤积、胆管炎症和纤维化为主。\nD. 正确：胆汁酸可损伤肝细胞，使肝细胞胞浆疏松、淡染，呈羽毛状变性/坏死，并常伴胆色素沉积。\nE. 正确：汇管区常出现急性或慢性炎症细胞浸润，并伴胆管损伤、增生及纤维化，是胆汁性肝硬化的重要组织学改变。\n易混点：羽毛状坏死是胆汁淤积性肝细胞损伤，特点是胞浆疏松淡染而非脂滴空泡；脂肪变性则是肝细胞内出现脂滴空泡。记忆要点：胆汁性肝硬化看“绿肝、胆汁湖、汇管区炎症、羽毛状坏死”，不要误选脂肪变性。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-a-single-0110","type":"single","typeLabel":"单选题","number":110,"question":"脓肿最常见的致病菌是","options":[{"key":"A","text":"溶血性链球菌"},{"key":"B","text":"绿脓杆菌"},{"key":"C","text":"金黄色葡萄球菌"},{"key":"D","text":"白色葡萄球菌"},{"key":"E","text":"草绿色链球菌"}],"answerKeys":["C"],"answerText":["金黄色葡萄球菌"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：脓肿是以中性粒细胞渗出、组织坏死液化形成脓腔为特征的局限性化脓性炎，金黄色葡萄球菌是最常见致病菌。\n解析：金黄色葡萄球菌可产生血浆凝固酶，使渗出的纤维蛋白原转变为纤维蛋白，将感染灶局限化，并吸引大量中性粒细胞浸润；中性粒细胞坏死崩解后释放蛋白溶解酶，使坏死组织液化，形成含脓液的脓肿。金葡菌还产生溶血素、杀白细胞素等，易引起疖、痈、皮肤软组织脓肿及骨髓炎等。本题题眼是“脓肿最常见”，应选金黄色葡萄球菌。\n\n选项分析：\nA. 错误：溶血性链球菌可产生透明质酸酶、链激酶等，侵袭力强、易沿组织间隙扩散，常引起蜂窝织炎、丹毒等弥漫性化脓性炎，而不是以局限性脓肿为最常见表现。\nB. 错误：绿脓杆菌即铜绿假单胞菌，常见于烧伤创面、医院获得性感染和免疫力低下者，可形成化脓性病变，但不是脓肿最常见的致病菌。\nC. 正确：金黄色葡萄球菌是革兰阳性球菌，血浆凝固酶阳性，能使感染局限并形成脓肿，是皮肤软组织脓肿、疖、痈等最常见的病原菌。\nD. 错误：白色葡萄球菌通常指表皮葡萄球菌等凝固酶阴性葡萄球菌，多为条件致病菌，常见于导管相关感染、人工植入物感染等，不是脓肿最常见致病菌。\nE. 错误：草绿色链球菌主要与亚急性感染性心内膜炎、龋齿等相关，也可引起化脓性感染，但并非脓肿最常见致病菌。\n\n易混点：脓肿与蜂窝织炎的关键区别在于病变是否局限、是否形成脓腔；金葡菌因凝固酶阳性使病灶局限并液化形成脓肿，链球菌因透明质酸酶和链激酶等易扩散，常致蜂窝织炎。记忆要点： “脓肿最常见——金葡菌；蜂窝织炎常见——溶血性链球菌”。","chapter":4,"chapterName":"炎症","chapterTitle":"第4章 炎症"},{"id":"pathology-a-single-0111","type":"single","typeLabel":"单选题","number":111,"question":"亚急性细菌性心内膜炎的赘生物有以下特点，除外","options":[{"key":"A","text":"多发生于原有病变的瓣膜上"},{"key":"B","text":"外观污秽、灰黄色，质松脆，易脱落"},{"key":"C","text":"赘生物单个或多个，呈息肉状或菜花状"},{"key":"D","text":"镜下，其表面有细菌团"},{"key":"E","text":"赘生物脱落引起动脉性栓塞和血管炎"}],"answerKeys":["D"],"answerText":["镜下，其表面有细菌团"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：亚急性感染性心内膜炎赘生物的形态学特点及细菌分布位置。\n解析：亚急性感染性心内膜炎的赘生物由纤维蛋白、血小板、坏死组织、炎细胞和细菌组成，但细菌多位于赘生物深部，表面常被纤维蛋白和血小板覆盖，因此“表面有细菌团”不符合其典型镜下特点。其肉眼常呈污秽灰黄色、质松脆、易脱落，多发生于原有病变的瓣膜上，脱落后可造成动脉性栓塞并引起血管炎。本题题眼是“除外”，应选不属于亚急性感染性心内膜炎赘生物特点的选项。\n\n选项分析：\nA. 正确：亚急性感染性心内膜炎多发生在已有病变的瓣膜上，如风湿性瓣膜病、先天性瓣膜畸形等。\nB. 正确：其赘生物肉眼呈污秽、灰黄色，质松脆，易脱落，是感染性栓塞的重要来源。\nC. 正确：赘生物可单个或多个，常呈息肉状或菜花状，附着于瓣膜。\nD. 错误：亚急性感染性心内膜炎赘生物内的细菌多位于深部，表面常为纤维蛋白、血小板覆盖，并非“表面有细菌团”；这是本题的正确答案。\nE. 正确：赘生物脱落可引起动脉性栓塞，并可因感染性栓塞或免疫复合物沉积引起血管炎。\n\n易混点：急性感染性心内膜炎常累及正常瓣膜，赘生物较大、松软、易脱落，细菌多且可位于表面；亚急性感染性心内膜炎多累及原有病变瓣膜，细菌多位于赘生物深部。风湿性心内膜炎赘生物为白色血栓，无细菌，不易脱落，应与感染性心内膜炎鉴别。","chapter":9,"chapterName":"心血管系统疾病","chapterTitle":"第9章 心血管系统疾病"},{"id":"pathology-a-single-0112","type":"single","typeLabel":"单选题","number":112,"question":"血栓的结局不包括","options":[{"key":"A","text":"溶解吸收"},{"key":"B","text":"机化、再通"},{"key":"C","text":"钙化"},{"key":"D","text":"脱落形成栓子"},{"key":"E","text":"肉芽肿形成"}],"answerKeys":["E"],"answerText":["肉芽肿形成"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n\n核心考点：血栓的结局（转归）包括溶解吸收、机化与再通、钙化及脱落形成栓子，不包括肉芽肿形成。\n\n解析：血栓形成后，机体可通过纤溶系统和白细胞释放的蛋白水解酶使血栓软化、溶解并被吸收；较大血栓可由血管壁长入肉芽组织逐渐机化，并形成再通管道；陈旧血栓可发生钙化；血栓也可部分脱落成为栓子引起栓塞。肉芽肿形成属于慢性炎症的结局，主要由巨噬细胞及其衍生的上皮样细胞、多核巨细胞构成，并非血栓的转归。本题题眼是“血栓的结局”，应将血栓的机化（肉芽组织）与炎症的肉芽肿形成严格区分。\n\n选项分析：\nA. 正确：溶解吸收是血栓常见结局之一，主要通过纤维蛋白溶解系统和白细胞释放的蛋白水解酶使血栓软化、溶解，小的血栓可完全吸收。\nB. 正确：机化是血栓被血管壁长入的肉芽组织取代并逐渐纤维化的过程；机化过程中可形成新的血管腔道，称为再通。\nC. 正确：钙化是陈旧性血栓的结局之一，钙盐沉积后可形成静脉石或动脉石。\nD. 正确：血栓可部分脱落形成栓子，随血流运行阻塞远处血管，引起栓塞，这是血栓的重要并发症和结局之一。\nE. 错误：肉芽肿形成是慢性肉芽肿性炎的病理改变，常见于结核、结节病、异物等，由巨噬细胞来源的上皮样细胞和多核巨细胞构成，不属于血栓的结局。\n\n易混点：血栓“机化”是肉芽组织长入并取代血栓，属于血栓结局；而“肉芽肿形成”是炎症的形态学表现，两者名称相近但本质不同。记忆要点：血栓四大结局为“溶解吸收、机化再通、钙化、脱落栓塞”；肉芽肿归入炎症章节，不列入血栓结局。","chapter":3,"chapterName":"局部血液循环障碍","chapterTitle":"第3章 局部血液循环障碍"},{"id":"pathology-a-single-0113","type":"single","typeLabel":"单选题","number":113,"question":"关于肺疾病的叙述，下列哪项是正确的","options":[{"key":"A","text":"肺气肿发生气流受阻的主要病因是小气道病变"},{"key":"B","text":"支原体主要引起小叶性肺炎"},{"key":"C","text":"支气管肺炎常作为独立疾病发生"},{"key":"D","text":"硅沉着病主要由直径＜5μm的粉尘引起"},{"key":"E","text":"α1-抗胰蛋白酶缺乏是肺气肿的主要原因"}],"answerKeys":["A"],"answerText":["肺气肿发生气流受阻的主要病因是小气道病变"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：A\n核心考点：慢性阻塞性肺疾病中肺气肿引起气流受限的主要机制是小气道病变。\n解析：肺气肿时肺泡壁破坏、弹性回缩力下降，同时常合并慢性支气管炎、细支气管炎等小气道炎症、黏液栓阻塞和管壁纤维化，使小气道阻力增加，这是气流受阻的主要病理基础。题眼在“气流受阻的主要病因”，不是单纯肺泡扩大，而是小气道病变与肺组织弹性回缩力下降共同造成持续性气流受限。A项准确。\n选项分析：\nA. 正确：肺气肿患者气流受阻主要与细小气道炎症、狭窄、黏液阻塞及肺弹性回缩力下降有关，小气道病变是关键环节。\nB. 错误：支原体肺炎主要引起间质性肺炎，即原发性非典型肺炎，病变以肺间质淋巴细胞、单核细胞浸润为主，不是小叶性肺炎。\nC. 错误：支气管肺炎又称小叶性肺炎，常继发于支气管炎、麻疹、百日咳、长期卧床等，多见于小儿和老年人，常作为并发症发生，而非“常作为独立疾病发生”。\nD. 错误：硅沉着病由含游离二氧化硅的硅尘引起，直径＜5μm的硅尘可吸入肺泡，其中1～2μm致病力最强；D将“粉尘”泛化，未强调硅尘及游离二氧化硅，表述不准确。\nE. 错误：α1-抗胰蛋白酶缺乏可引起全小叶型肺气肿，是肺气肿的遗传性原因之一，但并非主要原因；主要危险因素为吸烟、慢性支气管炎及环境粉尘等。\n易混点：肺气肿气流受限要抓住“小气道病变”；支原体肺炎是间质性肺炎，小叶性肺炎是支气管肺炎。α1-抗胰蛋白酶缺乏所致肺气肿多累及全小叶，临床相对少见，不能误记为肺气肿主要原因。","chapter":10,"chapterName":"呼吸系统疾病","chapterTitle":"第10章 呼吸系统疾病"},{"id":"pathology-a-single-0114","type":"single","typeLabel":"单选题","number":114,"question":"急性细菌性痢疾的假膜成分除外","options":[{"key":"A","text":"细菌"},{"key":"B","text":"大量纤维蛋白"},{"key":"C","text":"淋巴细胞"},{"key":"D","text":"坏死上皮"},{"key":"E","text":"中性粒细胞"}],"answerKeys":["C"],"answerText":["淋巴细胞"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：急性细菌性痢疾属于结肠纤维素性炎，其假膜由纤维素、坏死上皮、中性粒细胞、红细胞和细菌等构成，淋巴细胞不是假膜的典型主要成分。\n解析：急性细菌性痢疾由志贺菌引起，病变主要位于乙状结肠和直肠，黏膜发生纤维素性炎。渗出的纤维蛋白原转变为纤维蛋白，与坏死脱落的上皮、大量中性粒细胞、红细胞及细菌共同形成假膜。假膜脱落后可形成地图状溃疡，临床出现黏液脓血便和里急后重。本题题眼是“假膜成分除外”，即选出不属于假膜典型成分者，故为淋巴细胞。\n选项分析：\nA. 错误：细菌是假膜成分之一，假膜内可含有志贺菌，因此不是“除外”项。\nB. 错误：大量纤维蛋白是急性细菌性痢疾假膜形成的关键成分，属于纤维素性渗出物，故不能除外。\nC. 正确：假膜内炎症细胞以中性粒细胞为主，淋巴细胞不是急性菌痢假膜的典型主要成分，故为本题答案。\nD. 错误：坏死上皮是假膜的重要组成部分，假膜本质上是纤维素性渗出物与坏死组织的混合体。\nE. 错误：中性粒细胞是急性细菌性痢疾假膜中的主要炎症细胞，属于典型成分。\n易混点：菌痢假膜要与白喉假膜、伪膜性肠炎假膜区分。记忆要点是：急性菌痢假膜以纤维蛋白、中性粒细胞、坏死上皮和细菌为主，好发于乙状结肠、直肠；若见大量淋巴细胞，更应考虑慢性炎症或其他肠病，而不是急性菌痢假膜的典型构成。","chapter":18,"chapterName":"传染病","chapterTitle":"第18章 传染病"},{"id":"pathology-a-single-0115","type":"single","typeLabel":"单选题","number":115,"question":"减压病的发生主要是由于","options":[{"key":"A","text":"氧气栓塞"},{"key":"B","text":"氮气栓塞"},{"key":"C","text":"二氧化碳栓塞"},{"key":"D","text":"氢气栓塞"},{"key":"E","text":"混合气体栓塞"}],"answerKeys":["B"],"answerText":["氮气栓塞"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：减压病是高压环境下溶解于血液和组织中的氮气在快速减压时析出形成气泡，引起气体栓塞。\n解析：减压病又称潜水员病或沉箱病。人在高气压环境中作业时，血液和组织中溶解的氮气增多，其中脂肪组织溶解氮气较多；若减压过快，氮气迅速变为过饱和并析出气泡，造成多部位气体栓塞。气泡可阻塞小血管，也可在关节、皮下、肺和中枢神经系统等处形成压迫和缺血性损伤，临床可见关节肌肉疼痛、皮肤瘙痒、呼吸困难及神经症状。本题题眼是“减压病”与“氮气气泡栓塞”的对应关系。\n选项分析：\nA. 错误：氧气栓塞不是减压病的主要机制。高压氧或氧中毒主要造成肺和中枢神经系统损伤，氧气还可被组织代谢利用，并非减压病气泡的主要成分。\nB. 正确：高气压下氮气大量溶解于血液和组织，快速减压时氮气析出形成气泡，导致气体栓塞，是减压病的根本发病机制。\nC. 错误：二氧化碳栓塞多见于腹腔镜手术等医源性情况，二氧化碳溶解度高、易转运，不是减压病的主要栓塞气体。\nD. 错误：氢气栓塞少见，氢气主要与肠道细菌产气等有关，不是减压病发生的主要因素。\nE. 错误：混合气体栓塞常见于空气栓塞，如静脉损伤或医源性空气进入循环；减压病的气泡主要成分为氮气，不能笼统称为混合气体栓塞。\n易混点：空气栓塞是外界空气经破损静脉进入血流，属于混合气体栓塞；减压病则是高压下溶解于体内的氮气在减压过快时原位析出。记忆要点：减压病——氮气析出——气泡栓塞。","chapter":3,"chapterName":"局部血液循环障碍","chapterTitle":"第3章 局部血液循环障碍"},{"id":"pathology-a-single-0116","type":"single","typeLabel":"单选题","number":116,"question":"膜增生性肾小球肾炎的特点是肾小球的","options":[{"key":"A","text":"肾球囊壁层上皮增生，形成大量新月体"},{"key":"B","text":"毛细血管丛内皮细胞显著增生肥大"},{"key":"C","text":"系膜细胞增生伴基质增多，基膜增厚，及双轨征形成"},{"key":"D","text":"肾球囊壁增厚，肾小球周围纤维化"},{"key":"E","text":"基底膜伸出钉突状突起"}],"answerKeys":["C"],"answerText":["系膜细胞增生伴基质增多，基膜增厚，及双轨征形成"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n\n核心考点：膜增生性肾小球肾炎的病理特点是系膜细胞及系膜基质增生，并伴毛细血管基底膜增厚和双轨征形成。\n\n解析：膜增生性肾小球肾炎又称系膜毛细血管性肾小球肾炎，镜下可见系膜细胞增生、系膜基质增多，增生的系膜组织及免疫复合物沿内皮下插入，使毛细血管壁增厚；镀银染色可见基底膜呈“双轨征”或“车轨状”。病变主要累及系膜和毛细血管壁，临床常表现为肾病综合征，也可伴血尿、高血压和肾功能不全。本题题眼是“系膜细胞增生伴基质增多”和“双轨征”。\n\n选项分析：\nA. 错误：肾球囊壁层上皮增生并形成大量新月体是新月体性肾小球肾炎的特点，属于快速进行性肾小球肾炎，病变位于肾小球囊壁，不是膜增生性肾小球肾炎的固有改变。\nB. 错误：毛细血管丛内皮细胞显著增生肥大主要见于毛细血管内增生性肾小球肾炎，即急性弥漫性增生性肾小球肾炎，常伴系膜细胞增生和中性粒细胞浸润，临床多与链球菌感染后有关。\nC. 正确：膜增生性肾小球肾炎以系膜细胞和系膜基质增生为突出表现，增生成分插入毛细血管壁内皮下，导致基底膜增厚并形成双轨征，符合标准答案。\nD. 错误：肾球囊壁增厚、肾小球周围纤维化多见于慢性硬化性肾小球肾炎晚期，表现为肾小球硬化、纤维化及相应肾小管萎缩，属于慢性肾小球肾炎的终末改变。\nE. 错误：基底膜伸出钉突状突起是膜性肾病的典型形态学表现，由上皮下免疫复合物沉积后基底膜反应性增生形成，并非膜增生性肾小球肾炎的双轨征。\n\n易混点：膜增生性肾小球肾炎记“系膜增生＋双轨征”；膜性肾病记“上皮下沉积＋钉突”；毛细血管内增生性肾小球肾炎记“内皮和系膜细胞增生＋中性粒细胞浸润”；新月体性肾小球肾炎记“壁层上皮增生＋新月体”。","chapter":13,"chapterName":"泌尿系统疾病","chapterTitle":"第13章 泌尿系统疾病"},{"id":"pathology-a-single-0117","type":"single","typeLabel":"单选题","number":117,"question":"关于流行性乙型脑炎的叙述，下列哪项是正确的","options":[{"key":"A","text":"乙脑病毒属于DNA病毒"},{"key":"B","text":"有较多的中性粒细胞围血管浸润"},{"key":"C","text":"镂空筛状软化灶形成具有一定的诊断意义"},{"key":"D","text":"小胶质细胞越多，预后越好"},{"key":"E","text":"出现脑膜刺激征基本上可排除脑炎"}],"answerKeys":["C"],"answerText":["镂空筛状软化灶形成具有一定的诊断意义"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：流行性乙型脑炎的基本病理改变，尤其是镂空筛状软化灶的诊断意义。\n解析：流行性乙型脑炎由乙型脑炎病毒引起，病毒为单股正链RNA病毒。病变主要累及脑实质，表现为神经细胞变性坏死、血管周围淋巴细胞套、小胶质细胞增生及噬神经细胞现象，并可见神经组织坏死液化形成的镂空筛状软化灶。该软化灶是乙脑较有特征性的形态学改变，对病理诊断具有一定意义，因此C正确。本题题眼是“乙脑特征性病理改变”，而非病毒核酸类型或脑膜刺激征的有无。\n\n选项分析：\nA. 错误：乙脑病毒属于黄病毒科，为单股正链RNA病毒，不是DNA病毒；此为病毒学基本概念混淆。\nB. 错误：乙脑的血管周围浸润以淋巴细胞、单核细胞和浆细胞为主，形成血管套，并非“较多中性粒细胞”；中性粒细胞浸润明显更常见于化脓性脑膜炎等病变。\nC. 正确：乙脑时神经组织坏死液化可形成筛状、镂空状软化灶，具有一定诊断意义，是本题要求掌握的特征性病变。\nD. 错误：小胶质细胞增生并形成噬神经细胞现象、卫星现象是乙脑的病理表现之一，属神经组织损伤后的反应；不能简单认为“小胶质细胞越多，预后越好”，其数量与预后无此直接对应关系。\nE. 错误：乙脑可累及脑膜，临床可出现脑膜刺激征，因此出现脑膜刺激征不能排除脑炎；脑膜刺激征也可见于脑膜炎、蛛网膜下腔出血等。\n\n易混点：乙脑为病毒性脑炎，脑脊液和浸润细胞以淋巴细胞为主，血管周围“淋巴细胞套”是记忆点；化脓性脑膜炎则以中性粒细胞为主。镂空筛状软化灶是乙脑较特异的病理线索，需与脑梗死后的液化囊腔及一般病毒性脑炎的坏死灶相区分。","chapter":16,"chapterName":"神经系统疾病","chapterTitle":"第16章 神经系统疾病"},{"id":"pathology-a-single-0118","type":"single","typeLabel":"单选题","number":118,"question":"急性病毒性肝炎的病变性质为","options":[{"key":"A","text":"急性增生性炎"},{"key":"B","text":"急性出血性炎"},{"key":"C","text":"急性浆液性炎"},{"key":"D","text":"急性变质性炎"},{"key":"E","text":"急性纤维素性炎"}],"answerKeys":["D"],"answerText":["急性变质性炎"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：急性病毒性肝炎是以肝细胞变性、坏死为主的急性变质性炎。\n解析：肝炎病毒（尤其经免疫介导）损伤肝细胞，镜下以肝细胞水肿、气球样变、嗜酸性变及点状坏死等变质性改变为主，炎细胞浸润和增生相对较轻。故其病变性质为急性变质性炎，题眼在“病变性质”而非病原体或临床经过。急性病毒性肝炎虽可见汇管区淋巴细胞浸润和库普弗细胞增生，但不足以改变其变质性炎的本质。\n选项分析：\nA. 错误：急性增生性炎以组织细胞增生为主，如急性肾小球肾炎、伤寒肉芽肿等；病毒性肝炎的汇管区炎细胞浸润和库普弗细胞增生是伴随改变，不是主要病变。\nB. 错误：急性出血性炎以血管损伤、明显出血为特征，如流行性出血热、急性出血性胰腺炎、炭疽等；病毒性肝炎不以广泛出血为主要病变。\nC. 错误：急性浆液性炎以浆液渗出为主，如烫伤水疱、结核性胸膜炎早期；病毒性肝炎的主要病变位于肝细胞，不是浆液渗出。\nD. 正确：急性病毒性肝炎以肝细胞变性、坏死为主，渗出和增生轻微，符合变质性炎的定义。\nE. 错误：急性纤维素性炎以纤维素渗出、假膜形成或肺实变为特征，如大叶性肺炎、白喉、细菌性痢疾；病毒性肝炎无此典型改变。\n易混点：变质性炎与渗出性炎、增生性炎的区分要看主要病变。急性病毒性肝炎记“肝细胞气球样变、嗜酸性变、点状坏死＋汇管区淋巴细胞浸润”，核心仍是变质；大叶性肺炎记纤维素性炎，急性肾小球肾炎记增生性炎。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-a-single-0119","type":"single","typeLabel":"单选题","number":119,"question":"二尖瓣狭窄可继发以下改变，但除外哪项","options":[{"key":"A","text":"肺褐色硬化"},{"key":"B","text":"槟榔肝及脾大"},{"key":"C","text":"三尖瓣相对关闭不全"},{"key":"D","text":"左心房附壁血栓形成"},{"key":"E","text":"主动脉关闭不全"}],"answerKeys":["E"],"answerText":["主动脉关闭不全"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n核心考点：二尖瓣狭窄引起左心房压升高、肺循环高压及右心衰竭，进而产生一系列继发性改变，但不直接继发主动脉关闭不全。\n解析：二尖瓣狭窄时，舒张期左心房血液流入左心室受阻，左心房压力升高，肺静脉回流受阻，导致慢性肺淤血、肺褐色硬化；进一步发展可引起肺动脉高压、右心室肥厚扩张和右心衰竭。右心衰竭时体循环淤血，可形成槟榔肝及脾大；右心室扩大可使三尖瓣环扩大，出现三尖瓣相对关闭不全；左心房扩大、血流淤滞，尤其合并心房颤动时易形成左心房附壁血栓。主动脉关闭不全多由风湿性主动脉瓣炎、感染性心内膜炎、梅毒、主动脉根部扩张等引起，不是二尖瓣狭窄血流动力学改变所继发。本题题眼是“继发改变”与“除外”。\n选项分析：\nA. 正确：慢性肺淤血使肺泡壁纤维组织增生，并伴含铁血黄素沉着，形成肺褐色硬化，是二尖瓣狭窄肺循环高压的继发改变。\nB. 正确：二尖瓣狭窄晚期引起右心衰竭，体循环淤血可导致肝淤血（槟榔肝）及脾淤血肿大。\nC. 正确：肺动脉高压和右心室扩大可引起三尖瓣环扩大，造成三尖瓣相对关闭不全。\nD. 正确：左心房扩大及血流淤滞，尤其伴心房颤动时，易在左心房形成附壁血栓。\nE. 错误：主动脉关闭不全属于主动脉瓣本身或主动脉根部病变，不是二尖瓣狭窄的继发性血流动力学改变；风湿性心脏病虽可多瓣膜受累，但属于合并瓣膜病变，不是“继发”。\n易混点：二尖瓣狭窄最典型的继发链条是“左心房压升高→肺淤血/肺褐色硬化→肺动脉高压→右心室肥大扩张→右心衰竭→槟榔肝、脾大、三尖瓣相对关闭不全”。左心房附壁血栓与左心房扩大、血流淤滞和房颤有关；主动脉关闭不全应归入主动脉瓣病变，不要与二尖瓣狭窄的继发改变混淆。","chapter":9,"chapterName":"心血管系统疾病","chapterTitle":"第9章 心血管系统疾病"},{"id":"pathology-a-single-0120","type":"single","typeLabel":"单选题","number":120,"question":"第二期梅毒的主要表现是","options":[{"key":"A","text":"主动脉炎"},{"key":"B","text":"硬性下疳"},{"key":"C","text":"梅毒疹"},{"key":"D","text":"软性下疳"},{"key":"E","text":"树胶样肿形成"}],"answerKeys":["C"],"answerText":["梅毒疹"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：梅毒的分期及其特征性病变，第二期梅毒以梅毒疹为主要表现。\n解析：梅毒螺旋体感染后，第二期梅毒属于早期梅毒，通常在硬下疳消退后数周至数月出现，主要因螺旋体经血流播散至全身皮肤黏膜所致。其特征性表现是梅毒疹，可呈斑疹、丘疹、脓疱等，常累及躯干、四肢及掌跖，并伴黏膜斑、扁平湿疣和全身淋巴结肿大，传染性较强。本题题眼是“第二期”，应选择皮肤黏膜的梅毒疹。\n选项分析：\nA. 错误：主动脉炎属于三期梅毒的心血管梅毒病变，主要累及升主动脉，引起主动脉中层弹性纤维破坏、主动脉瘤等，不是二期梅毒的主要表现。\nB. 错误：硬性下疳即硬下疳，是一期梅毒的典型病变，发生于梅毒螺旋体侵入部位，表现为无痛性溃疡、边缘隆起、底部清洁质硬，伴局部淋巴结肿大。\nC. 正确：梅毒疹是二期梅毒的主要表现，由螺旋体血行播散引起，皮损多样且对称分布，掌跖梅毒疹和黏膜斑具有提示意义。\nD. 错误：软性下疳是软下疳的特征性病变，由杜克雷嗜血杆菌引起，属于另一种性传播疾病，溃疡质软、疼痛、易化脓，与梅毒螺旋体无关。\nE. 错误：树胶样肿形成是三期梅毒的特征性病变，属于晚期梅毒的肉芽肿性改变，可累及皮肤、黏膜、骨和内脏，不是二期梅毒的主要表现。\n易混点：硬下疳是一期梅毒，梅毒疹是二期梅毒，树胶样肿和主动脉炎是三期梅毒；软性下疳不是梅毒，而是软下疳。记忆要点可按“一期硬下疳、二期梅毒疹、三期树胶肿/心血管梅毒”串联分期。","chapter":18,"chapterName":"传染病","chapterTitle":"第18章 传染病"},{"id":"pathology-a-single-0121","type":"single","typeLabel":"单选题","number":121,"question":"胃癌最主要的转移途径是","options":[{"key":"A","text":"直接扩散"},{"key":"B","text":"淋巴道转移"},{"key":"C","text":"血道转移"},{"key":"D","text":"腹腔内种植"},{"key":"E","text":"盆腔内种植"}],"answerKeys":["B"],"answerText":["淋巴道转移"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：胃癌的转移途径及其最常见、最主要的方式是淋巴道转移。\n解析：胃癌癌细胞侵入淋巴管后，随淋巴引流首先转移至胃周局部淋巴结，进而可沿淋巴链上行，晚期经胸导管转移至左锁骨上淋巴结，即Virchow淋巴结。淋巴道转移发生最早、最常见，是胃癌最主要的转移途径，也是本题题眼。血道转移和种植转移多见于晚期，虽具有重要临床意义，但不是“最主要”途径。\n选项分析：\nA. 错误：直接扩散指癌组织突破胃壁向邻近器官蔓延，如侵及肝、胰、横结肠、大网膜等，属于局部浸润蔓延，并非胃癌最主要的转移途径。\nB. 正确：淋巴道转移是胃癌最主要的转移途径，常先转移至胃周淋巴结，晚期可出现左锁骨上淋巴结转移，临床触诊该淋巴结增大有重要提示意义。\nC. 错误：血道转移多见于胃癌晚期，癌细胞经门静脉转移至肝较常见，也可至肺、骨、脑等，但发生率和重要性均不及淋巴道转移，不能答“最主要”。\nD. 错误：腹腔内种植是癌组织穿透胃浆膜后脱落，种植于腹膜、大网膜及盆腔器官表面，可形成种植性结节；卵巢种植可形成Krukenberg瘤，但属于晚期转移方式，不是最主要途径。\nE. 错误：盆腔内种植本质上属于腹腔内种植的一部分，可种植于直肠子宫陷凹等处形成Blumer斑，但并非胃癌的主要转移途径，也不是本题所问的“最主要”方式。\n易混点：胃癌最常见转移途径是淋巴道，最特征性的远处淋巴结是左锁骨上淋巴结；种植转移至双侧卵巢形成Krukenberg瘤，血道转移至肝常见但多为晚期。记忆要点：胃癌“淋巴最先、最常见；卵巢种植Krukenberg；肝转移属血道晚期”。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-a-single-0122","type":"single","typeLabel":"单选题","number":122,"question":"日本血吸虫引起的肝硬化为","options":[{"key":"A","text":"门脉性肝硬化"},{"key":"B","text":"干线性肝硬化"},{"key":"C","text":"坏死后性肝硬化"},{"key":"D","text":"胆汁性肝硬化"},{"key":"E","text":"淤血性肝硬化"}],"answerKeys":["B"],"answerText":["干线性肝硬化"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：日本血吸虫性肝硬化属于寄生虫性肝硬化，病理上呈特征性的“干线性肝硬化”（也称管道型肝硬化）。\n解析：日本血吸虫虫卵主要沉积于肝内门静脉小分支，引起虫卵肉芽肿及周围纤维组织增生，纤维组织沿门静脉分支呈树枝状、干线状分布，故称干线性肝硬化。病变以汇管区及门静脉周围纤维化为主，肝细胞坏死和假小叶形成不如门脉性肝硬化典型，但门静脉阻塞及窦前性门脉高压显著，临床常见脾大、腹水、食管下段静脉曲张等。本题题眼是“日本血吸虫”与“肝内门静脉小分支虫卵沉积”，应选干线性肝硬化。\n选项分析：\nA. 错误：门脉性肝硬化多由病毒性肝炎、酒精性肝病等引起，典型表现为广泛肝细胞坏死、纤维隔形成及假小叶，肝表面呈小结节状，并非血吸虫性肝硬化的特征。\nB. 正确：日本血吸虫虫卵沉积于门静脉小分支，形成虫卵肉芽肿和沿门脉分支走行的纤维化，切面呈干线状/树枝状，故称干线性肝硬化，门脉高压突出而肝功能损害相对较轻。\nC. 错误：坏死后性肝硬化继发于大片或亚大片肝坏死，多与重型病毒性肝炎、药物或毒物中毒有关，纤维隔宽大、肝结构紊乱，结节大小不一，不是血吸虫病的典型病变。\nD. 错误：胆汁性肝硬化由长期胆道梗阻或自身免疫性胆管损伤引起，汇管区纤维化伴胆管增生、胆色素淤积，与虫卵沉积门脉分支的机制不同。\nE. 错误：淤血性肝硬化又称心源性肝硬化，见于慢性右心衰竭等，因长期肝淤血导致中央静脉周围纤维化，常伴槟榔肝背景，与日本血吸虫感染无关。\n易混点：干线性肝硬化与门脉性肝硬化最易混淆。记忆要点：血吸虫虫卵堵在门静脉小分支，纤维化“沿门脉呈干线状”，门脉高压早而重，假小叶不典型；门脉性肝硬化则以假小叶形成为核心，肝表面小结节状。","chapter":18,"chapterName":"传染病","chapterTitle":"第18章 传染病"},{"id":"pathology-a-single-0123","type":"single","typeLabel":"单选题","number":123,"question":"下列哪种因素对再生修复不利","options":[{"key":"A","text":"局部感染已被控制"},{"key":"B","text":"患者无血管硬化性疾病"},{"key":"C","text":"局部有较明显的瘢痕组织"},{"key":"D","text":"创口缝合良好"},{"key":"E","text":"充足维生素C的供给"}],"answerKeys":["C"],"answerText":["局部有较明显的瘢痕组织"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：影响组织再生修复的因素，尤其是局部瘢痕组织对再生修复的不利作用。\n解析：组织再生修复受全身和局部多种因素影响。全身因素包括年龄、营养状态（如蛋白质、维生素C）、激素和有无血管硬化性疾病等；局部因素包括感染、异物、血供、损伤范围、创口对合情况及有无瘢痕组织等。较明显的瘢痕组织由致密纤维结缔组织构成，血供差、组织致密，既妨碍再生细胞迁移和血管长入，又可形成机械屏障，因此对再生修复不利。本题题眼是“对再生修复不利”，应选局部瘢痕组织明显这一不利因素。\n选项分析：\nA. 错误：局部感染已被控制，说明不利于修复的感染因素已消除，有利于再生修复；若感染未控制才不利。\nB. 错误：患者无血管硬化性疾病，提示局部和全身血供条件较好，有利于输送氧、营养物质和修复细胞，对再生修复有利。\nC. 正确：局部有较明显的瘢痕组织，瘢痕组织血管少、纤维致密，阻碍再生细胞和新生血管长入，并可形成机械性屏障，因此对再生修复不利。\nD. 错误：创口缝合良好可使创缘对合整齐、缩小创面、减少感染和坏死组织，有利于愈合和再生修复。\nE. 错误：充足维生素C可促进胶原蛋白合成，是修复过程中肉芽组织和瘢痕形成的重要条件，对再生修复有利。\n易混点：肉芽组织与瘢痕组织要区分：肉芽组织富含新生毛细血管和成纤维细胞，能填补缺损、促进修复；瘢痕组织是肉芽组织成熟纤维化后的结果，过度或明显瘢痕组织血供差并可阻碍再生。记忆要点：感染、异物、血供差、瘢痕组织明显均不利；营养充足、血供良好、创缘对合良好均有利。","chapter":2,"chapterName":"损伤的修复","chapterTitle":"第2章 损伤的修复"},{"id":"pathology-a-single-0124","type":"single","typeLabel":"单选题","number":124,"question":"下列哪项对良性胃溃疡的大体形态描述是错误的","options":[{"key":"A","text":"圆形或椭圆形"},{"key":"B","text":"溃疡边缘整齐"},{"key":"C","text":"溃疡底部凹凸不平，有坏死"},{"key":"D","text":"周围黏膜皱襞向溃疡集中"},{"key":"E","text":"直径一般＜2cm"}],"answerKeys":["C"],"answerText":["溃疡底部凹凸不平，有坏死"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：良性胃溃疡（慢性消化性溃疡）的大体形态特点及良、恶性溃疡的肉眼鉴别。\n\n解析：良性胃溃疡大体多呈圆形或椭圆形，直径一般小于2cm，边缘整齐，底部平坦、洁净，周围黏膜皱襞常向溃疡集中。C项“溃疡底部凹凸不平，有坏死”不符合良性溃疡的大体形态，而更符合恶性溃疡（胃癌）的肉眼特点。本题题眼是“大体形态描述错误”，应抓住良性溃疡底部平坦、边缘整齐与恶性溃疡底部凹凸不平、边缘不整的鉴别。\n\n选项分析：\nA. 正确：良性胃溃疡多呈圆形或椭圆形，这是慢性消化性溃疡的典型大体形态。\nB. 正确：良性溃疡边缘整齐，周围黏膜可因纤维化收缩而向溃疡集中。\nC. 错误：良性溃疡底部通常平坦、洁净；底部凹凸不平并伴坏死、边缘隆起不整是恶性溃疡的特点，不能用于描述良性胃溃疡的大体形态。\nD. 正确：溃疡周围黏膜皱襞向溃疡集中是良性溃疡因瘢痕收缩形成的典型改变。\nE. 正确：良性胃溃疡直径一般小于2cm，直径较大、形态不规则者应警惕恶性溃疡。\n\n易混点：良性溃疡与恶性溃疡鉴别记忆为“良小整平集中，恶大不整凹凸坏死”。镜下良性溃疡底部由表及里可见渗出层、坏死层、肉芽组织层和瘢痕层，但大体描述强调底部平坦洁净，不能把镜下坏死层误作肉眼“底部凹凸不平、有坏死”。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-a-single-0125","type":"single","typeLabel":"单选题","number":125,"question":"在溃疡愈合期，填补溃疡的是","options":[{"key":"A","text":"肌细胞和结缔组织"},{"key":"B","text":"淋巴细胞和淋巴组织"},{"key":"C","text":"上皮细胞和肉芽组织"},{"key":"D","text":"纤维母细胞和肌组织"},{"key":"E","text":"不稳定细胞和组织"}],"answerKeys":["C"],"answerText":["上皮细胞和肉芽组织"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：溃疡愈合的基本过程是肉芽组织填补缺损、上皮细胞再生覆盖创面。\n解析：溃疡形成后，缺损区先由底部和边缘长出的肉芽组织填补，肉芽组织内含新生毛细血管、纤维母细胞及炎细胞，逐渐机化并转变为瘢痕组织；同时溃疡边缘的上皮细胞增生并向中心移行，最终覆盖表面。本题题眼是“填补溃疡”的成分，既包括填充缺损的肉芽组织，也包括表面再生的上皮细胞，故C正确。\n选项分析：\nA. 错误：肌细胞再生能力很弱，尤其心肌和骨骼肌基本不能再生成熟肌细胞，不能作为溃疡缺损的主要填补成分；结缔组织可参与修复，但单独与肌细胞组合不符合溃疡愈合规律。\nB. 错误：淋巴细胞和淋巴组织属于炎症和免疫相关细胞，可出现在炎症反应中，但不能填充组织缺损，也不能形成修复性肉芽组织。\nC. 正确：肉芽组织从溃疡底部及边缘向缺损内生长，填补组织缺损；上皮细胞从溃疡边缘增生、移行并覆盖创面，二者共同构成溃疡愈合的主要修复成分。\nD. 错误：纤维母细胞是肉芽组织的重要成分，可产生胶原纤维参与修复，但肌组织再生能力有限，不能作为溃疡填补的主要成分；该选项混淆了肉芽组织与肌组织再生。\nE. 错误：不稳定细胞和组织是按细胞再生能力分类的概念，如表皮细胞、消化道黏膜上皮、造血细胞等，并非溃疡愈合时填补缺损的具体组织组合；溃疡填补主要靠肉芽组织，表面靠上皮再生。\n易混点：肉芽组织是修复期新生结缔组织，最终可成熟为瘢痕组织；瘢痕组织是修复后期产物，不是早期填补溃疡的主要成分。记忆要点：溃疡愈合=肉芽组织填坑+上皮再生盖面。","chapter":2,"chapterName":"损伤的修复","chapterTitle":"第2章 损伤的修复"},{"id":"pathology-a-single-0126","type":"single","typeLabel":"单选题","number":126,"question":"肝穿刺活检，镜下可见弥漫性肝细胞胞浆疏松化，气球样变，点状坏死及嗜酸性小体形成，汇管区有轻度炎细胞浸润。应诊断为","options":[{"key":"A","text":"急性普通型肝炎"},{"key":"B","text":"慢性中度肝炎"},{"key":"C","text":"肝硬化"},{"key":"D","text":"急性重型肝炎"},{"key":"E","text":"亚急性重型肝炎"}],"answerKeys":["A"],"answerText":["急性普通型肝炎"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：A\n核心考点：急性普通型病毒性肝炎的镜下病理改变以肝细胞广泛变性、点状坏死为特征。\n解析：本例见弥漫性肝细胞胞浆疏松化、气球样变，提示肝细胞水肿性变性；点状坏死及嗜酸性小体形成提示少数肝细胞坏死和凋亡；汇管区仅轻度炎细胞浸润，无明显桥接坏死、纤维化或假小叶形成，符合急性普通型肝炎。题眼是“弥漫性变性＋点状坏死＋汇管区轻度炎症”，坏死轻、无纤维化是与其他类型肝炎鉴别的关键。\n选项分析：\nA. 正确：急性普通型肝炎以肝细胞广泛水肿变性为主，可见胞浆疏松化、气球样变、点状坏死和嗜酸性小体，汇管区轻度炎细胞浸润，符合题意。\nB. 错误：慢性中度肝炎应有较明显的汇管区炎症、界面炎，常伴桥接坏死及纤维化，病程较长；本例缺乏桥接坏死和纤维化依据。\nC. 错误：肝硬化诊断需有假小叶形成和纤维间隔，肝结构改建；本例仅为肝细胞变性和点状坏死，无假小叶。\nD. 错误：急性重型肝炎表现为大片状肝细胞坏死，肝体积缩小，常伴严重肝功能衰竭；本例坏死呈点状、程度轻，不符合。\nE. 错误：亚急性重型肝炎表现为亚大块坏死，伴肝细胞结节状再生和纤维组织增生；本例无大片坏死及再生结节、纤维化。\n易混点：点状坏死见于急性普通型肝炎，桥接坏死多见于慢性中重度肝炎，大片/亚大块坏死见于重型肝炎；嗜酸性小体是肝细胞凋亡的表现，不能据此误判为重型肝炎。记忆要点：急性普通型“变性重、坏死轻、无纤维化”。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-a-single-0127","type":"single","typeLabel":"单选题","number":127,"question":"槟榔肝是指","options":[{"key":"A","text":"肝细胞肿胀"},{"key":"B","text":"肝细胞脂肪变性、淤血"},{"key":"C","text":"慢性肝炎"},{"key":"D","text":"肝硬化"},{"key":"E","text":"肝细胞萎缩"}],"answerKeys":["B"],"answerText":["肝细胞脂肪变性、淤血"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：槟榔肝是慢性肝淤血合并肝细胞脂肪变性的典型形态学描述。\n解析：槟榔肝常见于右心衰竭等引起的慢性肝淤血。肝小叶中央静脉及周围肝窦高度扩张淤血，呈暗红色；而周边区肝细胞因缺氧发生脂肪变性，呈黄色，故肝脏切面呈红黄相间的槟榔样花纹。题眼在于“槟榔肝”并非独立疾病，而是慢性肝淤血时淤血与脂肪变性并存所形成的肉眼形态。\n\n选项分析：\nA. 错误：肝细胞肿胀即细胞水肿，常由缺氧、感染、中毒等引起，表现为肝细胞体积增大、胞质疏松淡染，不能形成红黄相间的槟榔样花纹。\nB. 正确：慢性肝淤血时中央区淤血呈暗红，周边肝细胞脂肪变性呈黄色，二者相间构成槟榔肝，符合其病理本质。\nC. 错误：慢性肝炎以肝细胞变性坏死、炎症细胞浸润及纤维化为主要改变，可有肝大和质地改变，但“槟榔肝”特指慢性淤血伴脂肪变性，不是慢性肝炎的典型描述。\nD. 错误：肝硬化以假小叶形成和弥漫性纤维化为特征；长期慢性肝淤血虽可发展为淤血性肝硬化，但槟榔肝只是淤血性肝病的形态阶段，不能等同于肝硬化。\nE. 错误：慢性肝淤血时中央区肝细胞可萎缩甚至坏死，但槟榔肝的红黄相间外观主要由淤血和周边肝细胞脂肪变性共同形成，单用肝细胞萎缩不能解释。\n\n易混点：槟榔肝的本质是“中央淤血发红、周边脂肪变发黄”，记忆为“红淤血、黄脂变”。长期慢性肝淤血可进一步导致淤血性肝硬化，但槟榔肝本身尚不等于肝硬化；也不要与病毒性肝炎、普通脂肪肝混淆。","chapter":3,"chapterName":"局部血液循环障碍","chapterTitle":"第3章 局部血液循环障碍"},{"id":"pathology-a-single-0128","type":"single","typeLabel":"单选题","number":128,"question":"毛玻璃样肝细胞可见于","options":[{"key":"A","text":"急性普通型肝炎"},{"key":"B","text":"慢性普通型肝炎"},{"key":"C","text":"急性重型肝炎"},{"key":"D","text":"亚急性重型肝炎"},{"key":"E","text":"酒精性肝病"}],"answerKeys":["B"],"answerText":["慢性普通型肝炎"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：毛玻璃样肝细胞是乙型肝炎病毒感染的形态学标志之一，常见于慢性普通型肝炎及HBV携带者。\n解析：毛玻璃样肝细胞在光镜下表现为肝细胞胞质内充满嗜酸性细颗粒状物质，呈不透明、毛玻璃样外观；电镜下主要为滑面内质网增生，其中含有大量HBsAg。该改变多见于慢性乙型肝炎，尤其是慢性普通型肝炎，也可见于无症状HBsAg携带者。本题题眼是“毛玻璃样肝细胞”与HBV感染、HBsAg蓄积及滑面内质网增生的联系。\n选项分析：\nA. 错误：急性普通型肝炎以肝细胞广泛气球样变、点状坏死、嗜酸性小体形成为主要表现，毛玻璃样肝细胞不是其典型或主要病变。\nB. 正确：慢性普通型肝炎，尤其慢性乙型肝炎，肝细胞胞质内可因HBsAg蓄积和滑面内质网增生而呈毛玻璃样，是本题标准答案。\nC. 错误：急性重型肝炎主要表现为肝细胞大片状坏死、出血和炎症细胞浸润，病情凶险，毛玻璃样肝细胞不是其诊断性形态。\nD. 错误：亚急性重型肝炎以亚大块坏死、肝细胞结节状再生和纤维组织增生为特点，可发展为坏死后肝硬化，毛玻璃样肝细胞不是其核心改变。\nE. 错误：酒精性肝病典型表现为肝细胞脂肪变、Mallory小体（透明小体）、窦周纤维化等，毛玻璃样肝细胞主要提示HBV感染，不是酒精性肝病的特征。\n易混点：毛玻璃样肝细胞应与Mallory小体、嗜酸性小体区分。毛玻璃样肝细胞本质是HBsAg在滑面内质网内蓄积，见于慢性乙型肝炎；Mallory小体见于酒精性肝病，为胞质内不规则嗜酸性透明团块；嗜酸性小体是肝细胞凋亡形成的浓缩嗜酸性小体。记忆要点：毛玻璃找HBV，Mallory找酒精。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-a-single-0129","type":"single","typeLabel":"单选题","number":129,"question":"与坏死后肝硬化相比，下列哪项是门脉性肝硬化常见的特点","options":[{"key":"A","text":"肝功能障碍"},{"key":"B","text":"上消化道大出血"},{"key":"C","text":"合并胆管上皮癌"},{"key":"D","text":"合并肝细胞肝癌"},{"key":"E","text":"结节大小相仿"}],"answerKeys":["E"],"answerText":["结节大小相仿"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n\n核心考点：门脉性肝硬化与坏死后性肝硬化的病理形态鉴别，门脉性肝硬化属小结节性肝硬化，结节大小相仿。\n\n解析：门脉性肝硬化早期肝体积可正常或略增大，后期缩小，表面呈弥漫性小结节，结节直径较小且大小相仿，纤维间隔较窄且均匀，故又称小结节性肝硬化。坏死后性肝硬化多由亚急性重型肝炎等发展而来，肝表面结节大小不等、形态不规则，纤维间隔宽窄不一，属大结节性或大小结节混合性肝硬化。本题题眼是“与坏死后肝硬化相比”的鉴别特点，最符合的是结节大小相仿这种形态学差异。\n\n选项分析：\nA. 错误：肝功能障碍在两型肝硬化均可出现，坏死后性肝硬化因肝细胞破坏较重，肝功能障碍常更早、更明显，因此不是门脉性肝硬化相对坏死后性肝硬化的特征。\nB. 错误：上消化道大出血是门脉高压的常见并发症，两型肝硬化均可发生；门脉性肝硬化门脉高压可出现较早，但上消化道大出血不是本题所问的形态学鉴别点。\nC. 错误：合并胆管上皮癌不是门脉性肝硬化的常见特点。胆管上皮癌多与肝内胆管结石、反复胆管炎、华支睾吸虫感染、原发性硬化性胆管炎等关系较密切，不能作为门脉性肝硬化与坏死后性肝硬化鉴别的依据。\nD. 错误：合并肝细胞肝癌在坏死后性肝硬化更常见，尤其与病毒性肝炎相关的大结节性肝硬化；门脉性肝硬化也可合并肝癌，但这不是其相对常见的鉴别特点。\nE. 正确：门脉性肝硬化典型为小结节性肝硬化，肉眼见肝表面结节细小、大小相仿，纤维间隔较窄且均匀；坏死后性肝硬化结节大小不一、纤维间隔宽窄不等，故“结节大小相仿”是门脉性肝硬化的常见特点。\n\n易混点：门脉性肝硬化记忆为“小结节、大小均匀、间隔窄”；坏死后性肝硬化记忆为“大结节、大小不一、间隔宽”，且更易合并肝细胞肝癌、肝功能损害较重。两型均可有门脉高压、上消化道出血和肝功能障碍，不能仅凭这些临床表现鉴别。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-a-single-0130","type":"single","typeLabel":"单选题","number":130,"question":"地方性甲状腺肿的主要病因是","options":[{"key":"A","text":"遗传因素"},{"key":"B","text":"机体对碘或甲状腺素需求量增加"},{"key":"C","text":"长期摄入大量钙"},{"key":"D","text":"缺碘"},{"key":"E","text":"吃海产品过多"}],"answerKeys":["D"],"answerText":["缺碘"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：地方性甲状腺肿的主要病因是环境缺碘导致甲状腺素合成不足，继而TSH长期刺激甲状腺增生。\n解析：地方性甲状腺肿多流行于土壤、饮水和食物中碘含量低的地区，长期碘摄入不足使甲状腺素合成减少，反馈性引起垂体TSH分泌增多，刺激甲状腺滤泡上皮增生、滤泡扩大并胶质蓄积，形成甲状腺弥漫性肿大，后期可发展为结节性甲状腺肿。病变早期以增生为主，后期以胶质贮积、结节形成、出血、钙化及囊性变为特征；多数患者甲状腺功能基本正常，严重者可有压迫症状。本题题眼是“地方性”和“主要病因”，故应选缺碘。\n选项分析：\nA. 错误：遗传因素可见于家族性甲状腺肿或某些先天性甲状腺激素合成障碍，但不是地方性甲状腺肿的主要病因，不能解释地区流行性。\nB. 错误：机体对碘或甲状腺素需求量增加可见于青春期、妊娠、哺乳期等，属于散发性甲状腺肿的常见诱因之一，但不是地方性甲状腺肿的主要病因。\nC. 错误：长期摄入大量钙并非地方性甲状腺肿的主要病因，钙摄入过多可能影响某些矿物质吸收，但不能替代“环境缺碘”这一核心机制。\nD. 正确：缺碘使甲状腺素合成减少，TSH升高，刺激甲状腺代偿性增生和胶质贮积，是地方性甲状腺肿最主要的病因。\nE. 错误：海产品含碘丰富，吃海产品过多通常增加碘摄入，不会造成缺碘性地方性甲状腺肿；高碘亦可能引起甲状腺肿，但本题问的是地方性甲状腺肿的主要病因。\n易混点：地方性甲状腺肿主要与缺碘有关，散发性甲状腺肿常与青春期、妊娠等需求增加或致甲状腺肿物质有关；高碘性甲状腺肿属于另一种病因，不要与地方性缺碘性甲状腺肿混淆。记忆要点是“地方性缺碘，TSH刺激，滤泡胶质贮积”。","chapter":15,"chapterName":"内分泌系统疾病","chapterTitle":"第15章 内分泌系统疾病"},{"id":"pathology-a-single-0131","type":"single","typeLabel":"单选题","number":131,"question":"坏死的结局不包括","options":[{"key":"A","text":"溶解吸收"},{"key":"B","text":"分离排出"},{"key":"C","text":"化生"},{"key":"D","text":"钙化"},{"key":"E","text":"机化包裹"}],"answerKeys":["C"],"answerText":["化生"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：坏死的结局包括溶解吸收、分离排出、机化包裹和钙化等，化生属于细胞和组织的适应性改变，不是坏死的结局。\n解析：坏死组织最终可被酶溶解并经淋巴管、血管吸收；也可与周围健康组织分离后排出，形成溃疡、空洞等；较大坏死灶可由肉芽组织机化，或由纤维结缔组织包裹，并可发生营养不良性钙化。化生是已分化成熟的组织转化为另一种成熟组织，属于适应反应，常与慢性刺激有关，并非坏死组织的转归。本题题眼是“坏死的结局”，应将坏死转归与适应性改变区分开。\n选项分析：\nA. 正确：溶解吸收是坏死结局之一。坏死组织被蛋白溶解酶等溶解后，由淋巴管、血管吸收，多见于小范围坏死。\nB. 正确：分离排出是坏死结局之一。坏死组织与周围健康组织分离，经自然管道排出或脱落，可形成溃疡、空洞等。\nC. 错误：化生是细胞和组织的适应性改变，指一种已分化成熟组织转化为另一种成熟组织，不是坏死组织的结局。\nD. 正确：钙化是坏死结局之一。坏死物可发生营养不良性钙化，尤其见于干酪样坏死、脂肪坏死等。\nE. 正确：机化包裹是坏死结局之一。较小坏死灶可由肉芽组织机化；较大或不能完全机化者可由纤维结缔组织包裹。\n易混点：化生属于“适应”，坏死属于“不可逆性损伤”，二者不是同一层面概念；记忆坏死结局可用“溶解吸收、分离排出、机化包裹、钙化”。","chapter":1,"chapterName":"细胞和组织的适应与损伤","chapterTitle":"第1章 细胞和组织的适应与损伤"},{"id":"pathology-a-single-0132","type":"single","typeLabel":"单选题","number":132,"question":"以下哪点与高分化恶性肿瘤不符","options":[{"key":"A","text":"异型性较小"},{"key":"B","text":"常见于老年人"},{"key":"C","text":"侵袭性较小"},{"key":"D","text":"不发生转移"},{"key":"E","text":"肿瘤体积较小"}],"answerKeys":["D"],"answerText":["不发生转移"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：高分化恶性肿瘤仍具有恶性肿瘤的浸润和转移本质，分化程度高不等于不发生转移。\n解析：高分化指肿瘤细胞形态和功能接近起源组织，异型性较小、核分裂象较少、生长较慢，侵袭性相对较低，但恶性本质不变，仍可浸润和转移。“不发生转移”是良性肿瘤的重要特点，不能用来描述恶性肿瘤；转移是否发生与分化程度无绝对平行关系，题眼在“恶性肿瘤”与“不发生转移”的矛盾。\n选项分析：\nA. 正确：高分化时肿瘤细胞与起源组织相似，异型性较小，符合高分化恶性肿瘤的形态特点。\nB. 正确（一般倾向）：高分化恶性肿瘤多生长缓慢、潜伏期较长，临床发现时常年龄偏大，故题目以此作为一般规律可成立。\nC. 正确：高分化者生长较慢、异型性较小，侵袭性相对较低，但仍可呈浸润性生长。\nD. 错误：恶性肿瘤均具有转移潜能，高分化癌或肉瘤也可能发生转移；“不发生转移”是良性肿瘤的特点，不是高分化恶性肿瘤的特点。\nE. 正确（相对而言）：高分化肿瘤生长较慢，在相近病程下体积可相对较小；但体积不能作为判断良恶性或分化程度的可靠标准。\n易混点：良性肿瘤与高分化恶性肿瘤的关键区别不在“像不像正常组织”，而在有无浸润和转移能力；高分化只说明异型性小、恶性程度相对低，不能据此排除转移。","chapter":6,"chapterName":"肿瘤","chapterTitle":"第6章 肿瘤"},{"id":"pathology-a-single-0133","type":"single","typeLabel":"单选题","number":133,"question":"高血压失代偿期心脏变为","options":[{"key":"A","text":"左心室向心性肥大"},{"key":"B","text":"左心室明显扩张"},{"key":"C","text":"左心室乳头肌明显增粗"},{"key":"D","text":"左心室肌收缩力加强"},{"key":"E","text":"心肌出现弥漫性纤维化"}],"answerKeys":["B"],"answerText":["左心室明显扩张"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：高血压性心脏病的代偿期与失代偿期心脏形态学转变，重点是左心室由向心性肥大转为心腔扩张。\n解析：高血压时外周阻力增加，左心室长期承受压力负荷，代偿期表现为左心室心肌肥大、室壁增厚而心腔不扩张，即向心性肥大。随着心肌负荷持续加重，心肌细胞肥大但血供相对不足，可发生心肌收缩力下降和心腔扩张，进入失代偿期，因此心脏变为左心室明显扩张。本题题眼是“失代偿期”，对应心腔扩张、收缩力降低，而不是代偿性肥厚。\n\n选项分析：\nA. 错误：左心室向心性肥大是高血压心脏病的代偿期表现，室壁增厚、心腔相对缩小，不符合“失代偿期”。\nB. 正确：高血压失代偿期左心室收缩力下降，心室腔扩大，可发展为离心性肥大/扩张，故左心室明显扩张。\nC. 错误：左心室乳头肌明显增粗属于左心室肥厚的一部分，多见于压力负荷导致的心肌代偿性肥大，不是失代偿期的核心形态改变。\nD. 错误：左心室肌收缩力加强见于代偿期；失代偿期心肌收缩力减弱，不能维持正常泵血功能。\nE. 错误：高血压性心脏病晚期可有心肌间质纤维化，但“弥漫性纤维化”不是失代偿期心脏改变的典型概括，且本题标准答案为左心室扩张。\n\n易混点：高血压心脏代偿期记“向心性肥大”——壁厚、腔小；失代偿期记“心腔扩张、收缩力下降”。与扩张型心肌病均可出现心腔扩张，但后者以心肌弥漫性变性、萎缩和纤维化导致扩张为主，高血压性心脏病有明确长期压力负荷和左室肥厚病史。","chapter":9,"chapterName":"心血管系统疾病","chapterTitle":"第9章 心血管系统疾病"},{"id":"pathology-a-single-0134","type":"single","typeLabel":"单选题","number":134,"question":"常发生机化的病灶，下列哪项除外","options":[{"key":"A","text":"风湿性小体"},{"key":"B","text":"心肌梗死"},{"key":"C","text":"脑梗死"},{"key":"D","text":"肠上皮细胞化生"},{"key":"E","text":"干酪样坏死"}],"answerKeys":["D"],"answerText":["肠上皮细胞化生"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：机化是肉芽组织取代坏死组织、血栓、渗出物或异物等不能完全溶解吸收的病灶，最终形成瘢痕的过程；化生是已分化成熟的组织转化为另一种分化成熟组织。\n解析：机化针对的是“病灶”，即坏死组织、血栓、渗出物、异物等由肉芽组织长入并逐渐取代，最终纤维化。风湿性小体、心肌梗死、脑梗死、干酪样坏死均属于可发生机化或纤维化修复的病变。肠上皮细胞化生属于上皮组织的适应性分化改变，不是肉芽组织取代病灶的过程，因此除外。题眼是区分“机化”与“化生”：前者是修复方式，后者是细胞适应性改变。\n\n选项分析：\nA. 正确：风湿性小体即风湿小体，属肉芽肿性病变，后期可纤维化、机化形成瘢痕，故可发生机化。\nB. 正确：心肌梗死后坏死心肌不能再生，由肉芽组织长入机化，最终形成瘢痕，是机化的典型例子。\nC. 正确：脑梗死坏死组织可被吞噬清除，周围胶质细胞增生，小范围可机化/瘢痕修复，较大范围可形成囊腔；本题按“可发生机化”处理。\nD. 错误：肠上皮细胞化生是胃或食管黏膜上皮被肠型上皮取代，属于化生，不是坏死、血栓、渗出物等病灶被肉芽组织取代的机化过程。\nE. 正确：干酪样坏死不易溶解吸收，常由肉芽组织包绕、机化，最后可纤维包裹或钙化，故可发生机化。\n\n易混点：机化是“肉芽组织取代病灶”，结局多为瘢痕；化生是“一种成熟组织变为另一种成熟组织”，如肠上皮化生、鳞状上皮化生。记忆要点：机化修复病灶，化生改变表型。","chapter":2,"chapterName":"损伤的修复","chapterTitle":"第2章 损伤的修复"},{"id":"pathology-a-single-0135","type":"single","typeLabel":"单选题","number":135,"question":"急性肺淤血时最典型的症状是","options":[{"key":"A","text":"心悸"},{"key":"B","text":"胸闷"},{"key":"C","text":"呼吸困难"},{"key":"D","text":"粉红色泡沫痰"},{"key":"E","text":"铁锈色痰"}],"answerKeys":["D"],"answerText":["粉红色泡沫痰"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：急性肺淤血进展为急性肺水肿时，肺泡内浆液与红细胞漏出形成粉红色泡沫痰，是急性左心衰肺淤血的特征性表现。\n解析：急性左心衰时肺静脉压升高，肺毛细血管扩张淤血、通透性增高，血浆和红细胞漏入肺泡腔；液体与空气混合形成泡沫，混有红细胞及含铁血黄素而呈粉红色，故咳粉红色泡沫痰是急性肺淤血、肺水肿最典型的症状。镜下可见肺泡壁毛细血管扩张充血，肺泡腔内水肿液、红细胞及心衰细胞；肉眼肺体积增大、暗红、湿润，切面可有泡沫样液体溢出。本题题眼是“急性肺淤血最典型”，应选能提示肺泡内泡沫样渗出的粉红色泡沫痰。\n\n选项分析：\nA. 错误：心悸可见于左心衰、心律失常等，是心功能不全的常见症状，但不是急性肺淤血最典型的肺部表现。\nB. 错误：胸闷为非特异性症状，可见于肺淤血、冠心病、胸膜病变等多种情况，不能作为最典型表现。\nC. 错误：呼吸困难是肺淤血的常见症状，但相对缺乏特征性；题目所问最典型表现应选粉红色泡沫痰。若进展为急性肺水肿，呼吸困难可加重并伴泡沫痰。\nD. 正确：粉红色泡沫痰提示肺淤血基础上发生急性肺水肿，肺泡腔内大量浆液、红细胞漏出并形成泡沫，是急性左心衰肺淤血的典型临床联系。\nE. 错误：铁锈色痰是大叶性肺炎的典型表现，因肺泡内红细胞破坏、含铁血黄素形成所致，并非急性肺淤血的表现。\n\
