性增生性肾小球肾炎，肾表面及切面可见点状出血，形似蚤咬，并非膜性肾小球肾炎的典型表现。\nD. 错误：多囊肾是先天性遗传性肾囊性疾病，双肾布满大小不等的囊肿，肾体积增大但形态呈多囊状，不属于膜性肾小球肾炎的大体改变。\nE. 错误：“固缩肾”主要见于慢性硬化性肾小球肾炎，双肾对称性缩小、质地变硬、表面呈颗粒状，称继发性颗粒性固缩肾，与膜性肾小球肾炎的肾肿大苍白相反。\n易混点：大白肾并非膜性肾小球肾炎所独有，微小病变性肾小球病（脂性肾病）、新月体性肾小球肾炎等也可表现为肾肿大苍白；但考试中最常将“大白肾”与膜性肾小球肾炎对应。大红肾、蚤咬肾记急性弥漫性增生性肾小球肾炎，固缩肾记慢性硬化性肾小球肾炎。","chapter":13,"chapterName":"泌尿系统疾病","chapterTitle":"第13章 泌尿系统疾病"},{"id":"pathology-2a-single-0288","type":"single","typeLabel":"单选题","number":288,"question":"不符合小叶性肺炎的是","options":[{"key":"A","text":"属化脓性炎症"},{"key":"B","text":"病变从细支气管开始"},{"key":"C","text":"常咳黏液脓性痰"},{"key":"D","text":"肺组织化脓性炎"},{"key":"E","text":"常见于青壮年"}],"answerKeys":["E"],"answerText":["常见于青壮年"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n核心考点：小叶性肺炎的病变性质、发生机制、好发人群及与大叶性肺炎的鉴别。\n解析：小叶性肺炎又称支气管肺炎，是细支气管及其周围肺泡的化脓性炎症，病变常以细支气管为中心，沿支气管树向周围肺泡蔓延，形成散在的灶状化脓性病灶。患者常咳黏液脓性痰，好发于小儿、老年人及体弱久病者，而不是青壮年。青壮年常见的是大叶性肺炎，因此本题题眼在“好发年龄”，不符合项为E。\n选项分析：\nA. 正确：小叶性肺炎属于化脓性炎症，中性粒细胞渗出明显，可形成脓性渗出物，符合其病理本质。\nB. 正确：病变多从细支气管开始，细支气管壁及周围肺泡发生化脓性炎，故又称支气管肺炎。\nC. 正确：因支气管及肺泡内有脓性渗出，临床常咳黏液脓性痰，听诊可闻及湿啰音。\nD. 正确：肺组织内可见以细支气管为中心的化脓性炎灶，病灶大小不一、散在分布，多位于两肺下叶后部。\nE. 错误：小叶性肺炎常见于小儿、老年人和体弱久病者，青壮年相对少见；青壮年常见的是大叶性肺炎，而非小叶性肺炎。\n易混点：大叶性肺炎多见于青壮年，典型为肺泡内纤维素性炎，病变累及肺大叶，咳铁锈色痰；小叶性肺炎多见于小儿和年老体弱者，为以细支气管为中心的化脓性炎，咳黏液脓性痰，病灶散在。记忆要点：青壮年大叶，老弱小叶；纤维素性对大叶，化脓性对小叶。","chapter":10,"chapterName":"呼吸系统疾病","chapterTitle":"第10章 呼吸系统疾病"},{"id":"pathology-2a-single-0289","type":"single","typeLabel":"单选题","number":289,"question":"下述组织或器官的体积增大，仅由肥大引起的是","options":[{"key":"A","text":"哺乳期的乳腺"},{"key":"B","text":"功能亢进的甲状腺"},{"key":"C","text":"健美运动员的骨骼肌"},{"key":"D","text":"妊娠期的子宫"},{"key":"E","text":"垂体ACTH细胞腺瘤患者的肾上腺"}],"answerKeys":["C"],"answerText":["健美运动员的骨骼肌"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：组织或器官体积增大的机制——单纯肥大与肥大伴增生的鉴别。\n解析：肥大是指细胞体积增大导致组织器官体积增大，不伴细胞数目增多。健美运动员的骨骼肌属于生理性肥大，因骨骼肌细胞基本不再分裂，训练负荷使肌纤维增粗、细胞内结构蛋白合成增加，故其体积增大主要由肥大引起。本题题眼是“仅由肥大引起”，需排除同时存在细胞增生或腺体分泌扩张等改变的情况。\n\n选项分析：\nA. 错误：哺乳期乳腺增大包括腺泡上皮增生、腺小叶增多以及腺泡分泌和细胞肥大，属于增生伴肥大，并非仅由肥大引起。\nB. 错误：功能亢进的甲状腺常见滤泡上皮增生、滤泡变小、胶质减少等改变，组织增大有增生参与。\nC. 正确：骨骼肌细胞属永久细胞，健美训练主要引起肌纤维横截面积增大，即单纯细胞肥大，符合题意。\nD. 错误：妊娠期子宫增大由平滑肌细胞肥大和平滑肌细胞增生共同造成，还伴血供增加等改变。\nE. 错误：垂体ACTH细胞腺瘤分泌过多ACTH，刺激双侧肾上腺皮质细胞增生，导致肾上腺体积增大，主要机制是增生而非单纯肥大。\n\n易混点：肥大是“细胞变大”，增生是“细胞变多”；妊娠子宫、哺乳乳腺、功能亢进甲状腺多为肥大伴增生。骨骼肌、心肌等永久细胞不能有效增生，负荷增加时以肥大为主，是“单纯肥大”的典型记忆点。","chapter":1,"chapterName":"细胞和组织的适应与损伤","chapterTitle":"第1章 细胞和组织的适应与损伤"},{"id":"pathology-2a-single-0290","type":"single","typeLabel":"单选题","number":290,"question":"心内膜下心肌梗死的并发症是","options":[{"key":"A","text":"心脏破裂"},{"key":"B","text":"附壁血栓形成"},{"key":"C","text":"室壁瘤"},{"key":"D","text":"无菌性纤维素性心包炎"},{"key":"E","text":"心律失常"}],"answerKeys":["B"],"answerText":["附壁血栓形成"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：心内膜下心肌梗死因心内膜受损、局部室壁运动异常和血流淤滞，最易并发附壁血栓形成。\n解析：心内膜下心肌梗死的坏死灶局限于心室壁内层，可累及心内膜，使心内膜面粗糙并损伤内皮；同时梗死区收缩减弱、血流缓慢，血小板和纤维蛋白易沉积，形成附壁血栓。血栓可脱落引起体循环栓塞，是本题的题眼。心脏破裂、室壁瘤、纤维素性心包炎主要见于透壁性心肌梗死，心律失常虽可发生但缺乏心内膜下梗死相对特异的联系。\n\n选项分析：\nA. 错误：心脏破裂是透壁性心肌梗死的严重并发症，多发生于梗死后1～3天，常见游离壁破裂，因坏死累及心室壁全层。\nB. 正确：心内膜下心肌梗死可损伤心内膜并造成局部血流淤滞，易在心腔内形成附壁血栓，血栓脱落可导致脑、肾、脾等体循环器官栓塞。\nC. 错误：室壁瘤是透壁性心肌梗死愈合期或后期并发症，梗死区心室壁变薄、薄弱，在腔内压力下向外膨出。\nD. 错误：无菌性纤维素性心包炎多见于透壁性心肌梗死累及心外膜，或发生于心梗后Dressler综合征；心内膜下梗死一般不累及心外膜。\nE. 错误：心律失常可发生于各型心肌梗死，尤其累及传导系统或透壁性梗死时常见，但不是心内膜下心肌梗死最具特征性的并发症。\n\n易混点：记忆要点是“心内膜下→附壁血栓；透壁性→心脏破裂、室壁瘤、心包炎”。附壁血栓位于心腔内、附着于受损心内膜面，需与室壁瘤的室壁膨出及心包炎的纤维素性渗出相区别。","chapter":9,"chapterName":"心血管系统疾病","chapterTitle":"第9章 心血管系统疾病"},{"id":"pathology-2a-single-0291","type":"single","typeLabel":"单选题","number":291,"question":"食管肿瘤在显微镜下如图可见肿瘤细胞排列呈腺样结构，这种肿瘤最可能是","options":[{"key":"A","text":"未分化癌"},{"key":"B","text":"腺癌"},{"key":"C","text":"鳞癌Ⅰ级"},{"key":"D","text":"鳞癌Ⅲ级"},{"key":"E","text":"鳞状上皮乳头状瘤"}],"answerKeys":["B"],"answerText":["腺癌"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n\n核心考点：食管肿瘤组织学类型判断——镜下呈腺样结构提示腺癌。\n\n解析：题目图片未提供，仅依据文字“肿瘤细胞排列呈腺样结构”分析。腺样结构即肿瘤细胞形成腺管、腺泡或腺腔样排列，并可伴黏液分泌，是腺癌的组织学依据。食管腺癌多发生于食管下段，常与Barrett食管、慢性反流性食管炎相关，临床可表现为进行性吞咽困难。本题题眼是“腺样结构”，应首先考虑腺癌。需注意我国食管癌以鳞状细胞癌多见，但组织学类型必须以镜下分化结构为准。\n\n选项分析：\nA. 错误：未分化癌表现为癌细胞弥漫成片分布，异型性明显，缺乏明确的鳞状或腺样分化结构，不形成腺管。\nB. 正确：肿瘤细胞排列呈腺样结构，形成腺腔或腺泡，符合腺癌的组织学特征；食管腺癌常源于Barrett食管，好发于下段。\nC. 错误：鳞癌Ⅰ级为高分化鳞癌，癌巢内可见角化珠、细胞间桥，呈鳞状上皮分化，而不是腺样结构。\nD. 错误：鳞癌Ⅲ级为低分化鳞癌，异型性明显、角化珠少或无，但本质仍为鳞状细胞分化，通常不形成腺管。\nE. 错误：鳞状上皮乳头状瘤是良性肿瘤，表现为增生的鳞状上皮围绕纤维血管轴心形成乳头状结构，无恶性腺样浸润。\n\n易混点：低分化鳞癌可因角化不明显而难辨，但免疫组化常表达p40、p63等鳞状标记；腺癌则有腺腔、黏液及腺上皮标记。记忆要点：食管上、中段癌多为鳞癌，下段癌需警惕Barrett相关腺癌；看到“角化珠、细胞间桥”想鳞癌，看到“腺管、黏液”想腺癌。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病","needsImage":true},{"id":"pathology-2a-single-0292","type":"single","typeLabel":"单选题","number":292,"question":"下列不是基底细胞癌的特点的是","options":[{"key":"A","text":"癌细胞似基底细胞"},{"key":"B","text":"多见于老年人面部"},{"key":"C","text":"癌巢中央可见角化珠形成"},{"key":"D","text":"对放射治疗很敏感"},{"key":"E","text":"很少发生转移"}],"answerKeys":["C"],"answerText":["癌巢中央可见角化珠形成"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：基底细胞癌的病理特征及与鳞状细胞癌的鉴别。\n解析：基底细胞癌多起源于表皮基底层或皮肤附件，常见于老年人面部等日光暴露部位，生长缓慢，呈局部浸润性破坏，但极少发生转移，且对放射治疗较敏感。镜下癌细胞形态类似基底细胞，癌巢周边细胞常呈栅栏状排列，中央可发生囊性变或黏液变性，但一般不出现角化珠。角化珠是高分化鳞状细胞癌的典型形态学标志，因此C不是基底细胞癌的特点。本题题眼是“癌巢中央角化珠形成”，应定位到鳞状细胞癌。\n\n选项分析：\nA. 正确：基底细胞癌细胞体积较小，嗜碱性，形态类似表皮基底细胞，这是其基本组织学特点。\nB. 正确：基底细胞癌好发于老年人，面部等曝光部位常见，与长期日晒有关。\nC. 错误：癌巢中央角化珠形成是高分化鳞状细胞癌的特点；基底细胞癌通常不形成角化珠，故此项不是基底细胞癌特点。\nD. 正确：基底细胞癌对放射治疗较敏感，临床对某些不能手术或不宜手术者可考虑放疗。\nE. 正确：基底细胞癌以局部浸润破坏为主，生长缓慢，转移非常少见。\n\n易混点：基底细胞癌与鳞状细胞癌均可发生于老年人面部，但基底细胞癌癌巢周边细胞呈栅栏状排列、很少转移；鳞状细胞癌可见角化珠和细胞间桥，且可发生转移。记住“角化珠—鳞癌”这一高频对应关系。","chapter":6,"chapterName":"肿瘤","chapterTitle":"第6章 肿瘤"},{"id":"pathology-2a-single-0293","type":"single","typeLabel":"单选题","number":293,"question":"肿瘤细胞分化程度越低","options":[{"key":"A","text":"恶性程度越高"},{"key":"B","text":"异型性越小"},{"key":"C","text":"转移越晚"},{"key":"D","text":"预后越好"},{"key":"E","text":"对放射治疗越不敏感"}],"answerKeys":["A"],"answerText":["恶性程度越高"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：A\n核心考点：肿瘤细胞分化程度与恶性程度、异型性、转移及预后的关系。\n解析：肿瘤细胞分化程度越低，说明其与起源正常组织细胞的形态和功能差异越大，异型性越明显，生长增殖越活跃，侵袭和转移能力越强，因而恶性程度越高、预后越差。本题题眼是“分化程度越低”，其直接对应的考试结论是“恶性程度越高”。分化越低并不等于肿瘤越“温和”，而是去分化、幼稚化更明显，生物学行为更凶险。\n选项分析：\nA. 正确：分化程度越低，肿瘤细胞越幼稚，异型性越大，生长和侵袭能力越强，恶性程度越高，这是肿瘤病理学的基本规律。\nB. 错误：异型性应越大而不是越小。异型性指肿瘤组织在细胞形态和组织结构上与其起源正常组织的差异，分化越低，差异越大，异型性越明显。\nC. 错误：分化越低通常侵袭性越强、转移越早或越易发生，而不是转移越晚。转移早晚还受肿瘤类型、部位和宿主因素影响，但总体趋势与低分化、高恶性相关。\nD. 错误：分化越低，恶性程度越高，预后通常越差，而不是越好。预后还与分期、治疗反应等有关，但低分化是预后不良的重要因素。\nE. 错误：分化低的肿瘤生长活跃，通常对放射治疗和化学治疗较敏感，而不是越不敏感；但放疗敏感性还受肿瘤类型、血供、氧合及细胞周期状态等影响，不能绝对化。本题按总论规律判断，E不符合“分化越低恶性越高”的常考结论。\n易混点：分化程度与异型性呈反向关系，即分化越低、异型性越大；与恶性程度、侵袭转移能力和预后不良呈正向关系。记忆要点：低分化、高异型、高恶性、易转移、预后差；未分化癌分化最差、恶性程度高，但不能把所有低分化肿瘤的放疗敏感性简单等同于“不敏感”。","chapter":6,"chapterName":"肿瘤","chapterTitle":"第6章 肿瘤"},{"id":"pathology-2a-single-0294","type":"single","typeLabel":"单选题","number":294,"question":"以下哪项不是亚急性细菌性心内膜炎的特点","options":[{"key":"A","text":"赘生物单个或多个，呈息肉状或菜花状"},{"key":"B","text":"多发生与原有病变的瓣膜上"},{"key":"C","text":"镜下表面有细菌团"},{"key":"D","text":"赘生物脱落引起动脉栓塞和血管炎"},{"key":"E","text":"外观污秽，质松软、灰黄、易脱落"}],"answerKeys":["C"],"answerText":["镜下表面有细菌团"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：亚急性感染性心内膜炎（亚急性细菌性心内膜炎）赘生物的形态、部位、镜下组成及栓塞/血管炎表现。\n解析：亚急性感染性心内膜炎多发生在原有病变的瓣膜上，赘生物单个或多个，呈息肉状或菜花状，外观污秽、灰黄、质松软且易脱落；脱落后可引起动脉栓塞，并因免疫复合物沉积引起血管炎。镜下赘生物由血小板、纤维蛋白、坏死组织、炎细胞及细菌团构成，但其细菌数量较少，常位于赘生物深部，而不是以“表面细菌团”为特点。本题题眼在“不是”及“镜下表面有细菌团”，该描述更符合急性感染性心内膜炎。\n选项分析：\nA. 正确：亚急性感染性心内膜炎的赘生物可单个或多个，呈息肉状或菜花状，属于常考形态特点。\nB. 正确：本病多发生于已有风湿性心内膜炎、先天性心脏病等病变的瓣膜上，这是其重要好发基础。\nC. 错误：亚急性感染性心内膜炎镜下虽可见细菌团，但细菌数量少且多位于赘生物深部；“表面有细菌团”不是其特点，更符合急性感染性心内膜炎。\nD. 正确：赘生物质松软易脱落，可随血流引起动脉栓塞；免疫复合物沉积还可导致血管炎。\nE. 正确：赘生物外观污秽，质松软、灰黄、易脱落，是亚急性感染性心内膜炎的肉眼特点之一。\n易混点：急性感染性心内膜炎赘生物常由大量细菌团、中性粒细胞和坏死组织构成，细菌多在表面且破坏性强；亚急性者细菌少、位于深部，常伴原有瓣膜病变。记忆要点：急性“表面细菌多、破坏重”，亚急性“深部细菌少、易栓塞并血管炎”。","chapter":9,"chapterName":"心血管系统疾病","chapterTitle":"第9章 心血管系统疾病"},{"id":"pathology-2a-single-0295","type":"single","typeLabel":"单选题","number":295,"question":"胃癌的好发部位是","options":[{"key":"A","text":"胃体"},{"key":"B","text":"胃底部"},{"key":"C","text":"胃窦部"},{"key":"D","text":"胃大弯"},{"key":"E","text":"胃小弯"}],"answerKeys":["C"],"answerText":["胃窦部"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n\n核心考点：胃癌的好发部位及胃良恶性溃疡好发部位的鉴别。\n\n解析：胃癌最常发生于胃窦部，尤以胃窦小弯侧多见，约占胃癌的大多数。其发生常与慢性萎缩性胃炎、幽门螺杆菌感染、肠上皮化生及异型增生等密切相关，癌组织多起源于胃黏膜上皮。本题题眼是“胃癌的好发部位”，应选胃窦部，而不是胃溃疡好发的胃小弯近幽门侧。\n\n选项分析：\nA. 错误：胃体可发生胃癌，但并非最常见好发部位；胃体更常与自身免疫性胃炎、胃底腺萎缩等相联系，作为胃癌好发部位不如胃窦部典型。\nB. 错误：胃底部胃癌相对少见，胃底贲门部癌可与Barrett食管、贲门黏膜病变等相关，但不能作为胃癌最常见好发部位。\nC. 正确：胃癌最常见于胃窦部，尤其是胃窦小弯侧，符合慢性胃炎—肠化生—异型增生—癌变的常见路径。\nD. 错误：胃大弯不是胃癌最常见好发部位；胃大弯更多见于胃淋巴瘤、胃间质瘤等病变的鉴别，胃癌总体仍以胃窦部多见。\nE. 错误：胃小弯是胃溃疡的经典好发部位，也是胃癌沿小弯侧浸润和淋巴结转移的常见区域；但本题问胃癌最常见的好发解剖部位，标准答案为胃窦部，不能将“胃小弯侧常见受累”等同于“胃小弯是胃癌最常见好发部位”。\n\n易混点：胃溃疡好发于胃小弯近幽门侧，胃癌好发于胃窦部，尤其胃窦小弯侧。记忆要点：良性溃疡“小弯近幽门”，胃癌“胃窦最多见”；胃小弯既是溃疡好发处，也是胃癌常见累及侧，但选择题问胃癌好发部位应选胃窦部。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-2a-single-0296","type":"single","typeLabel":"单选题","number":296,"question":"关于动脉性充血，下列哪项叙述是错误的","options":[{"key":"A","text":"细动脉扩张"},{"key":"B","text":"见于心力衰竭"},{"key":"C","text":"温度增高"},{"key":"D","text":"见于减压后"},{"key":"E","text":"局部呈鲜红色"}],"answerKeys":["B"],"answerText":["见于心力衰竭"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：动脉性充血是细动脉扩张、局部血流增多所致的主动性充血，关键要与心力衰竭引起的静脉性充血（淤血）鉴别。\n解析：动脉性充血又称主动性充血，因细动脉扩张、毛细血管床开放，局部血流量增加，血液含氧量高，故局部呈鲜红色、温度升高。心力衰竭时静脉回流受阻、静脉压升高，属于静脉性充血（淤血），局部呈暗红色、温度降低并可伴水肿。本题题眼是“错误的叙述”，B项把心力衰竭归为动脉性充血，方向相反。\n选项分析：\nA. 正确：动脉性充血的主要机制是细动脉扩张及毛细血管开放增多，局部动脉血流量增加。\nB. 错误：心力衰竭引起的是静脉性充血（淤血），如左心衰肺淤血、右心衰体循环淤血，并非动脉性充血。\nC. 正确：动脉性充血时局部血流加速、动脉血灌注增多，故局部温度可增高。\nD. 正确：局部压力突然降低后可发生减压后充血，属于动脉性充血的一种。\nE. 正确：动脉性充血时局部血液含氧丰富，肉眼常呈鲜红色。\n易混点：动脉性充血为“主动、鲜红、温度高、细动脉扩张”；静脉性充血为“被动、暗红、温度低、静脉及毛细血管扩张伴淤血水肿”。记忆要点：心衰致淤血，炎症早期可先动脉性充血，随后转为淤血。","chapter":3,"chapterName":"局部血液循环障碍","chapterTitle":"第3章 局部血液循环障碍"},{"id":"pathology-2a-single-0297","type":"single","typeLabel":"单选题","number":297,"question":"膀胱癌的最好发部位是","options":[{"key":"A","text":"膀胱后壁"},{"key":"B","text":"任何部位均可发生"},{"key":"C","text":"膀胱前壁"},{"key":"D","text":"膀胱侧壁和三角区"},{"key":"E","text":"膀胱顶"}],"answerKeys":["D"],"answerText":["膀胱侧壁和三角区"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：膀胱癌的最好发部位为膀胱侧壁和三角区，其中以侧壁尤为常见。\n解析：膀胱癌绝大多数来源于尿路上皮，致癌物随尿液排出后长期作用于膀胱黏膜，故好发于尿液易潴留、黏膜接触较充分的膀胱侧壁和三角区。临床上常以无痛性肉眼血尿为首发表现，可呈乳头状或浸润性生长。本题题眼是“最好发部位”，应选择解剖学上最典型的高发区域，而不是“任何部位均可发生”这种笼统表述。\n\n选项分析：\nA. 错误：膀胱后壁可发生膀胱癌，但不是最好发部位；后壁病变还需与邻近器官肿瘤浸润等鉴别。\nB. 错误：膀胱各部位理论上均可发生癌，但本题问“最好发部位”，该选项没有指出高发区域，不能作为最佳答案。\nC. 错误：膀胱前壁不是膀胱癌的典型好发部位，前壁病变相对少见。\nD. 正确：膀胱癌好发于膀胱侧壁和三角区，符合尿路上皮癌的常见发生部位，是本题标准答案。\nE. 错误：膀胱顶不是膀胱癌的典型好发部位；膀胱顶病变还需注意脐尿管残余相关病变等。\n\n易混点：膀胱三角区既是膀胱癌的好发区域之一，也是膀胱结核的好发部位，但膀胱结核常累及输尿管口，可形成“高尔夫球洞”样改变；记忆时抓住“膀胱癌好发侧壁和三角区，三角区也是结核常累及处”即可。","chapter":13,"chapterName":"泌尿系统疾病","chapterTitle":"第13章 泌尿系统疾病"},{"id":"pathology-2a-single-0298","type":"single","typeLabel":"单选题","number":298,"question":"以下哪项不引起左心室肥大","options":[{"key":"A","text":"二尖瓣关闭不全"},{"key":"B","text":"第三期梅毒"},{"key":"C","text":"二尖瓣狭窄"},{"key":"D","text":"主动脉瓣关闭不全"},{"key":"E","text":"原发性高血压"}],"answerKeys":["C"],"answerText":["二尖瓣狭窄"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：左心室肥大的血流动力学机制，即左心室承受压力负荷或容量负荷增加；二尖瓣狭窄主要引起左心房和右心室改变，一般不引起左心室肥大。\n解析：左心室肥大常见于原发性高血压导致的压力负荷增加，以及主动脉瓣关闭不全、二尖瓣关闭不全等导致的容量负荷增加。二尖瓣狭窄时，舒张期左心房血液进入左心室受阻，左心房压力升高，继而肺淤血、肺动脉高压和右心室肥大；左心室因充盈减少，通常不肥大，甚至可相对缩小。本题题眼是“二尖瓣狭窄的血流动力学障碍位于左心房与左心室之间，主要累及左心房和右心”。\n\n选项分析：\nA. 错误：二尖瓣关闭不全时，收缩期左心室血液反流入左心房，左心室容量负荷增加，可发生左心室肥大、扩张，因此它可引起左心室肥大。\nB. 错误：第三期梅毒可发生心血管梅毒，主要累及升主动脉，引起梅毒性主动脉炎，并可导致主动脉瓣关闭不全；后者使左心室容量负荷增加，可引起左心室肥大。\nC. 正确：二尖瓣狭窄使左心房排血受阻，左心房肥大扩张、肺淤血和右心室肥大，左心室舒张期充盈减少，一般不会引起左心室肥大，故为本题答案。\nD. 错误：主动脉瓣关闭不全时，舒张期主动脉血液反流入左心室，左心室容量负荷明显增加，可引起左心室离心性肥大。\nE. 错误：原发性高血压使外周血管阻力增加，左心室长期承受压力负荷，引起左心室向心性肥大。\n\n易混点：二尖瓣狭窄与二尖瓣关闭不全均可累及左心房，但二尖瓣狭窄以左心房大、肺淤血、右心室肥大为主；二尖瓣关闭不全因收缩期反流使左心室容量负荷增加，常伴左心室肥大扩张。记忆要点：狭窄看“入口受阻”，左室充盈少；关闭不全看“反流”，左室容量负荷增加。","chapter":9,"chapterName":"心血管系统疾病","chapterTitle":"第9章 心血管系统疾病"},{"id":"pathology-2a-single-0299","type":"single","typeLabel":"单选题","number":299,"question":"下列关于冠状动脉粥样硬化性心脏病的叙述，哪一项是错误的","options":[{"key":"A","text":"左心侧壁的梗死常由左前降支阻塞引起"},{"key":"B","text":"透壁性心肌梗死的发生机制常与粥样斑块继发血栓形成有关"},{"key":"C","text":"心内膜下心肌梗死灶常为多发性小灶性"},{"key":"D","text":"心肌梗死时服用硝酸酯类药物不能缓解疼痛"},{"key":"E","text":"冠状动脉病变最常见而严重的分支为左前降支"}],"answerKeys":["A"],"answerText":["左心侧壁的梗死常由左前降支阻塞引起"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：A\n核心考点：冠状动脉各主要分支的供血区域及心肌梗死的病理类型和临床表现。\n解析：左前降支主要供应左心室前壁、心尖部和室间隔前2/3，阻塞后典型引起左心室前壁及心尖部梗死；左心室侧壁主要由左旋支供血，因此A将其归因于左前降支阻塞是错误的。透壁性心肌梗死常因粥样斑块破裂、继发血栓形成或冠状动脉痉挛导致管腔急性闭塞；心内膜下心肌梗死常呈多发性小灶性。心肌梗死时疼痛服用硝酸酯类药物不能缓解，是区别于心绞痛的重要临床特点。本题题眼是“错误的是”并考查冠状动脉分支与梗死部位对应关系。\n\n选项分析：\nA. 正确（即本题应选的错误项）：左心室侧壁主要由左旋支供血，左前降支阻塞主要导致左心室前壁、心尖部和室间隔前2/3梗死，故该叙述错误。\nB. 错误（叙述正确）：透壁性心肌梗死常由粥样斑块破裂、继发血栓形成或血管痉挛引起冠状动脉急性闭塞，导致心肌全层坏死。\nC. 错误（叙述正确）：心内膜下心肌梗死多由冠状动脉供血不足引起，坏死灶常为多发性小灶性，可累及左心室壁内层。\nD. 错误（叙述正确）：心绞痛时硝酸酯类可缓解疼痛，而急性心肌梗死时硝酸酯类通常不能缓解疼痛，可作为临床鉴别点之一。\nE. 错误（叙述正确）：冠状动脉粥样硬化最常见且较严重累及的分支为左前降支，其次为右冠状动脉、左旋支等。\n\n易混点：左前降支对应“前壁、心尖、室间隔前2/3”，左旋支对应“左心室侧壁”；不要将所有左心室梗死都归于左前降支。另需牢记：硝酸酯能缓解心绞痛，但心肌梗死疼痛常不能缓解。","chapter":9,"chapterName":"心血管系统疾病","chapterTitle":"第9章 心血管系统疾病"},{"id":"pathology-2a-single-0300","type":"single","typeLabel":"单选题","number":300,"question":"诊断肿瘤最可靠的方法是","options":[{"key":"A","text":"CT检查"},{"key":"B","text":"X线透视"},{"key":"C","text":"超声波检查"},{"key":"D","text":"脱落细胞学检查"},{"key":"E","text":"活组织检查"}],"answerKeys":["E"],"answerText":["活组织检查"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n核心考点：肿瘤最可靠的诊断方法是活组织检查，即通过病理组织学观察确定病变的性质、类型和分化程度。\n解析：活组织检查通过切取、切除或穿刺获取病变组织，经固定、包埋、切片和染色后在显微镜下观察细胞异型性、组织结构紊乱、间质浸润及血管淋巴管侵犯等，可明确良恶性、组织学类型和分级，是肿瘤诊断的金标准。影像学检查主要用于定位、分期和疗效评估，脱落细胞学可发现癌细胞但难以判断组织结构和浸润，因此不能替代活检。本题题眼是“最可靠”，应选病理组织学诊断。\n选项分析：\nA. 错误：CT检查属于影像学检查，可显示肿块部位、大小、密度及与周围组织关系，有助于肿瘤筛查、分期和随访，但不能从细胞和组织结构水平确定肿瘤性质，不能作为最可靠诊断依据。\nB. 错误：X线透视主要用于观察器官形态和动态功能，对肿瘤的敏感性和特异性有限，不能确定肿瘤的组织学类型和良恶性，不是最可靠方法。\nC. 错误：超声波检查可发现实性或囊性占位并引导穿刺，但图像所见过小病变易漏诊，且不能替代组织病理学诊断。\nD. 错误：脱落细胞学检查是从痰、尿、胸腹水等收集脱落细胞，或经细针穿刺涂片找癌细胞，可提供细胞学证据，但不能观察组织结构、浸润深度和间质关系，存在假阴性和难以分型分级的问题。\nE. 正确：活组织检查能直接观察肿瘤的组织结构和细胞形态，判断良恶性、组织学类型、分化程度及浸润转移情况，并可结合免疫组化、分子检测指导治疗和判断预后，是诊断肿瘤最可靠的方法。\n易混点：脱落细胞学检查与活组织检查均属病理学检查，但前者看“细胞”，后者看“组织结构和细胞”，诊断可靠性以组织学活检更高。记忆要点：影像定位、细胞初筛、活检定诊；确定肿瘤性质和组织学类型首选活组织检查。","chapter":6,"chapterName":"肿瘤","chapterTitle":"第6章 肿瘤"}]},{"id":"pathology-3a","name":"病理学3A","count":300,"questions":[{"id":"pathology-3a-single-0001","type":"single","typeLabel":"单选题","number":1,"question":"左心房内的附壁血栓是","options":[{"key":"A","text":"白色血栓"},{"key":"B","text":"红色血栓"},{"key":"C","text":"透明血栓"},{"key":"D","text":"混合血栓"},{"key":"E","text":"血凝块"}],"answerKeys":["D"],"answerText":["混合血栓"],"topic":"病理学","category":"A1","score":1,"analysis":"","chapter":3,"chapterName":"局部血液循环障碍","chapterTitle":"第3章 局部血液循环障碍"},{"id":"pathology-3a-single-0002","type":"single","typeLabel":"单选题","number":2,"question":"炎症反应中最有防御作用的是","options":[{"key":"A","text":"组织增生"},{"key":"B","text":"动脉充血"},{"key":"C","text":"发热反应"},{"key":"D","text":"吞噬作用"},{"key":"E","text":"液体渗出"}],"answerKeys":["D"],"answerText":["吞噬作用"],"topic":"病理学","category":"A1","score":1,"analysis":"","chapter":4,"chapterName":"炎症","chapterTitle":"第4章 炎症"},{"id":"pathology-3a-single-0003","type":"single","typeLabel":"单选题","number":3,"question":"肿瘤经血道转移的最常累及的器官是","options":[{"key":"A","text":"肺、脑"},{"key":"B","text":"肝、肺"},{"key":"C","text":"肺、骨"},{"key":"D","text":"肝、脑"},{"key":"E","text":"肝、骨"}],"answerKeys":["E"],"answerText":["肝、骨"],"topic":"病理学","category":"A1","score":1,"analysis":"","chapter":6,"chapterName":"肿瘤","chapterTitle":"第6章 肿瘤"},{"id":"pathology-3a-single-0004","type":"single","typeLabel":"单选题","number":4,"question":"食管癌最好发的部位是","options":[{"key":"A","text":"上段"},{"key":"B","text":"下段"},{"key":"C","text":"中段"},{"key":"D","text":"起始部"},{"key":"E","text":"末端"}],"answerKeys":["C"],"answerText":["中段"],"topic":"病理学","category":"A1","score":1,"analysis":"","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-3a-single-0005","type":"single","typeLabel":"单选题","number":5,"question":"关于小叶性肺炎，下列哪一项是错误的","options":[{"key":"A","text":"细支气管和肺泡的化脓性炎"},{"key":"B","text":"可并发肺脓肿和脑脓肿"},{"key":"C","text":"严重者病灶发生融合"},{"key":"D","text":"病灶周围肺组织充血"},{"key":"E","text":"病灶散在于两肺，以上肺多见"}],"answerKeys":["E"],"answerText":["病灶散在于两肺，以上肺多见"],"topic":"病理学","category":"A1","score":1,"analysis":"","chapter":10,"chapterName":"呼吸系统疾病","chapterTitle":"第10章 呼吸系统疾病" el":"单选题","number":297,"question":"符合系膜增生性肾小球肾炎表现的是","options":[{"key":"A","text":"肾小球系膜细胞增生伴基质增多，基底膜增厚呈双轨状"},{"key":"B","text":"肾小球内皮细胞、系膜细胞增生"},{"key":"C","text":"肾小球壁层上皮细胞增生"},{"key":"D","text":"肾小球系膜细胞增生伴基质增多"},{"key":"E","text":"肾小球毛细血管基底膜增厚，基底膜物质呈钉状突起"}],"answerKeys":["D"],"answerText":["肾小球系膜细胞增生伴基质增多"],"topic":"病理学","category":"B1","score":1,"analysis":"","chapter":13,"chapterName":"泌尿系统疾病","chapterTitle":"第13章 泌尿系统疾病"},{"id":"pathology-3a-single-0298","type":"single","typeLabel":"单选题","number":298,"question":"符合急性弥漫性增生性肾小球肾炎表现的是","options":[{"key":"A","text":"肾小球系膜细胞增生伴基质增多，基底膜增厚呈双轨状"},{"key":"B","text":"肾小球内皮细胞、系膜细胞增生"},{"key":"C","text":"肾小球壁层上皮细胞增生"},{"key":"D","text":"肾小球系膜细胞增生伴基质增多"},{"key":"E","text":"肾小球毛细血管基底膜增厚，基底膜物质呈钉状突起"}],"answerKeys":["B"],"answerText":["肾小球内皮细胞、系膜细胞增生"],"topic":"病理学","category":"B1","score":1,"analysis":"","chapter":13,"chapterName":"泌尿系统疾病","chapterTitle":"第13章 泌尿系统疾病"},{"id":"pathology-3a-single-0299","type":"single","typeLabel":"单选题","number":299,"question":"符合膜性肾小球肾炎表现的是","options":[{"key":"A","text":"肾小球系膜细胞增生伴基质增多，基底膜增厚呈双轨状"},{"key":"B","text":"肾小球内皮细胞、系膜细胞增生"},{"key":"C","text":"肾小球壁层上皮细胞增生"},{"key":"D","text":"肾小球系膜细胞增生伴基质增多"},{"key":"E","text":"肾小球毛细血管基底膜增厚，基底膜物质呈钉状突起"}],"answerKeys":["E"],"answerText":["肾小球毛细血管基底膜增厚，基底膜物质呈钉状突起"],"topic":"病理学","category":"B1","score":1,"analysis":"","chapter":13,"chapterName":"泌尿系统疾病","chapterTitle":"第13章 泌尿系统疾病"},{"id":"pathology-3a-single-0300","type":"single","typeLabel":"单选题","number":300,"question":"符合新月体性肾小球肾炎表现的是","options":[{"key":"A","text":"肾小球系膜细胞增生伴基质增多，基底膜增厚呈双轨状"},{"key":"B","text":"肾小球内皮细胞、系膜细胞增生"},{"key":"C","text":"肾小球壁层上皮细胞增生"},{"key":"D","text":"肾小球系膜细胞增生伴基质增多"},{"key":"E","text":"肾小球毛细血管基底膜增厚，基底膜物质呈钉状突起"}],"answerKeys":["C"],"answerText":["肾小球壁层上皮细胞增生"],"topic":"病理学","category":"B1","score":1,"analysis":"","chapter":13,"chapterName":"泌尿系统疾病","chapterTitle":"第13章 泌尿系统疾病"}]},{"id":"pathology-a","name":"病理A","count":300,"questions":[{"id":"pathology-a-single-0001","type":"single","typeLabel":"单选题","number":1,"question":"肺心病时，下列哪种病变最不容易见到","options":[{"key":"A","text":"肺动脉圆锥膨隆"},{"key":"B","text":"心尖钝圆、肥厚，主要由右心室构成"},{"key":"C","text":"心脏横径增大，形成横位心"},{"key":"D","text":"室上嵴增厚、增粗"},{"key":"E","text":"右心室向心性肥大"}],"answerKeys":["E"],"answerText":["右心室向心性肥大"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n\n核心考点：慢性肺源性心脏病时右心室肥厚、扩张及心脏形态改变的病理学特征。\n\n解析：肺心病因肺循环阻力增加、肺动脉高压，导致右心室负荷加重，典型表现为右心室壁肥厚并常伴心腔扩张，心尖钝圆并由右心室构成；同时右心室流出道肥厚扩张，使肺动脉圆锥膨隆、室上嵴增厚，心脏横径增大。向心性肥大一般指压力负荷下室壁增厚而心腔不扩张，常见于高血压时的左心室，肺心病右心室典型改变更偏向肥厚伴扩张（离心性肥大），故本题题眼“最不容易见到”应选E。\n\n选项分析：\nA. 正确：肺动脉圆锥膨隆是肺心病常见改变，因右心室流出道及肺动脉高压相关肥厚、扩张所致。\nB. 正确：肺心病右心室肥大、扩张，心尖可由右心室构成，表现为心尖钝圆、肥厚，是典型形态。\nC. 正确：右心室扩张使心脏横径增大，可形成横位心，属于肺心病常见心脏外形改变。\nD. 正确：室上嵴为右心室流出道的重要结构，肺心病时因右心室压力负荷增加可见增厚、增粗。\nE. 错误：右心室向心性肥大并非肺心病典型改变；肺心病右心室多为肥厚伴扩张，向心性肥大更常用于描述高血压时左心室改变。\n\n易混点：向心性肥大是“壁厚、腔不扩张”，多见于高血压左心室；肺心病右心室常为“壁厚伴腔扩张”的离心性肥大。记忆要点：肺心病看右心，肺动脉圆锥膨隆、心尖钝圆、横位心、室上嵴增厚；向心性肥大主要联想高血压左心室。","chapter":10,"chapterName":"呼吸系统疾病","chapterTitle":"第10章 呼吸系统疾病"},{"id":"pathology-a-single-0002","type":"single","typeLabel":"单选题","number":2,"question":"左心房血栓脱落不会引起","options":[{"key":"A","text":"脑梗死"},{"key":"B","text":"肺梗死"},{"key":"C","text":"肾梗死"},{"key":"D","text":"脾梗死"},{"key":"E","text":"下肢梗死"}],"answerKeys":["B"],"answerText":["肺梗死"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：左心房血栓脱落属于体循环动脉栓塞，栓子随左心室、主动脉进入体循环动脉，不会进入肺动脉引起肺梗死。\n解析：左心房血栓脱落后，栓子经二尖瓣进入左心室，再随主动脉血流进入体循环，可阻塞脑、肾、脾及下肢等器官的动脉，造成相应部位缺血性梗死。肺梗死多由肺动脉栓塞引起，栓子主要来自下肢深静脉、盆腔静脉或右心腔，经右心室进入肺动脉。本题题眼是“左心房血栓”即体循环动脉栓子来源，故不会引起肺梗死。\n\n选项分析：\nA. 正确：左心房栓子可随体循环进入脑动脉，阻塞后引起脑梗死，属于体循环动脉栓塞的常见部位。\nB. 错误：肺梗死由肺动脉栓塞所致，栓子来源于静脉系统或右心，不来自左心房体循环动脉系统，故为本题答案。\nC. 正确：栓子可进入肾动脉分支，引起肾缺血性梗死，肾为体循环动脉栓塞常见受累器官之一。\nD. 正确：栓子可进入脾动脉，引起脾梗死，脾也是体循环动脉栓塞的常见部位。\nE. 正确：栓子可随主动脉进入下肢动脉，阻塞后可导致下肢缺血甚至梗死，属于体循环动脉栓塞的可能表现。\n\n易混点：肺栓塞/肺梗死与体循环动脉栓塞的栓子来源不同。记忆要点：左心、主动脉系统栓子进入体循环，可累及脑、肾、脾、下肢；右心或静脉系统栓子进入肺动脉，引起肺栓塞，肺梗死常在其基础上发生。","chapter":3,"chapterName":"局部血液循环障碍","chapterTitle":"第3章 局部血液循环障碍"},{"id":"pathology-a-single-0003","type":"single","typeLabel":"单选题","number":3,"question":"大叶性肺炎发生肺肉质变是因为","options":[{"key":"A","text":"变态反应剧烈"},{"key":"B","text":"成纤维细胞增生"},{"key":"C","text":"机体抵抗力降低"},{"key":"D","text":"吞噬细胞数量少"},{"key":"E","text":"病变范围过大"}],"answerKeys":["D"],"answerText":["吞噬细胞数量少"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：大叶性肺炎的并发症肺肉质变，本质是肺泡腔内纤维素性渗出物未被充分溶解吸收而发生机化。\n解析：大叶性肺炎时，肺泡腔内大量纤维素性渗出物正常情况下可被中性粒细胞释放的蛋白酶溶解，并由巨噬细胞吞噬清除。若吞噬细胞数量少或功能低下，纤维素不能被完全清除，残留的渗出物刺激肉芽组织从肺泡壁长入，最终机化形成灰白色、质韧的纤维化实变，即肺肉质变。题眼在“肺肉质变”的机制，即吞噬细胞清除能力不足导致纤维素性渗出物机化，而不是病变范围或全身抵抗力本身。\n\n选项分析：\nA. 错误：变态反应剧烈主要见于支气管哮喘、过敏性肺炎等，不是大叶性肺炎肺肉质变的直接机制；大叶性肺炎主要是肺炎链球菌引起的急性纤维素性炎。\nB. 错误：成纤维细胞增生是肺肉质变形成过程中的机化表现，属于结果和形态学过程，不是启动肺肉质变的根本原因；不能把“机化结果”当作“发生原因”。\nC. 错误：机体抵抗力降低可促进感染发生或使病情加重，但肺肉质变的关键是肺泡腔内纤维素性渗出物吸收障碍，抵抗力降低并非特异机制。\nD. 正确：吞噬细胞数量少时，肺泡腔内纤维素性渗出物及坏死物质清除不足，残留物机化，肉芽组织取代渗出物，形成肺肉质变。\nE. 错误：病变范围过大可使病情较重、吸收较慢，但肺肉质变取决于渗出物能否被溶解吞噬清除，范围大不是直接原因。\n\n易混点：肺肉质变是纤维素性渗出物机化，肉眼呈灰白色质韧实变，镜下为肺泡腔被肉芽组织及纤维组织取代；应与肺脓肿、脓胸、感染性休克等大叶性肺炎其他并发症区分。记忆要点：大叶性肺炎“纤维素渗出—溶解吸收—机化”环节中，吞噬细胞少/功能差是肉质变的关键。","chapter":10,"chapterName":"呼吸系统疾病","chapterTitle":"第10章 呼吸系统疾病"},{"id":"pathology-a-single-0004","type":"single","typeLabel":"单选题","number":4,"question":"手术后好发血栓的部位是","options":[{"key":"A","text":"下肢静脉"},{"key":"B","text":"肾动脉"},{"key":"C","text":"颈静脉"},{"key":"D","text":"冠状动脉"},{"key":"E","text":"门静脉"}],"answerKeys":["A"],"answerText":["下肢静脉"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：A\n核心考点：手术后血栓形成的好发部位及静脉血栓形成的机制（血流缓慢、内皮损伤、血液高凝）。\n解析：手术后患者常因卧床、制动、麻醉及创伤后血液高凝状态，使下肢静脉血流明显缓慢，最易形成深静脉血栓，尤其是小腿深静脉、腘静脉和股静脉。下肢深静脉血栓脱落可导致肺栓塞，是术后重要并发症。本题题眼是“手术后好发”，应联系Virchow三要素中的血流缓慢和血液高凝，而不是动脉粥样硬化或栓塞的好发部位。\n选项分析：\nA. 正确：手术后长期卧床、下肢肌肉泵作用减弱，下肢静脉血流缓慢，加之手术创伤使凝血系统激活，故下肢静脉是术后血栓形成的最常见部位，尤以下肢深静脉为主。\nB. 错误：肾动脉属于动脉，肾动脉血栓形成可导致肾梗死，常见于动脉粥样硬化、动脉瘤、房颤栓子脱落等，不是手术后卧床患者的好发血栓部位。\nC. 错误：颈静脉血栓较少见，多与中心静脉置管、局部感染、肿瘤压迫或高凝状态有关，并非手术后最典型的好发部位。\nD. 错误：冠状动脉血栓形成多继发于冠状动脉粥样硬化斑块破裂，引起急性心肌梗死，属于动脉血栓，不是术后卧床状态下的好发部位。\nE. 错误：门静脉血栓多见于肝硬化门静脉高压、腹腔感染、肿瘤侵犯或腹部手术后高凝等，但总体不如下肢静脉血栓在手术后常见，不能作为本题最佳答案。\n易混点：术后血栓以静脉血栓为主，最常发生于下肢深静脉；动脉血栓多与粥样硬化斑块破裂或栓子栓塞有关。记忆要点是“术后卧床—血流缓慢—下肢深静脉血栓—可脱落致肺栓塞”，不要误选为肺栓塞发生部位或动脉粥样硬化好发部位。","chapter":3,"chapterName":"局部血液循环障碍","chapterTitle":"第3章 局部血液循环障碍"},{"id":"pathology-a-single-0005","type":"single","typeLabel":"单选题","number":5,"question":"下列哪项对中性粒细胞无趋化作用","options":[{"key":"A","text":"细菌代谢产物"},{"key":"B","text":"坏死组织"},{"key":"C","text":"阳离子蛋白"},{"key":"D","text":"C3a"},{"key":"E","text":"激肽原酶"}],"answerKeys":["C"],"answerText":["阳离子蛋白"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：急性炎症中中性粒细胞趋化因子的种类及趋化作用机制。\n解析：趋化作用是指白细胞沿化学物质浓度梯度定向移动。中性粒细胞可被细菌产物、坏死组织释放物、补体片段C3a/C5a、白三烯B4、IL-8及激肽原酶等吸引。阳离子蛋白主要来自中性粒细胞颗粒，具有抗菌等作用，不属于对中性粒细胞有趋化作用的物质，故本题题眼是“无趋化作用”。\n选项分析：\nA. 正确：细菌代谢产物属于外源性趋化因子，可吸引中性粒细胞向感染灶聚集。\nB. 正确：坏死组织可释放多种炎症介质和趋化物质，诱导中性粒细胞浸润。\nC. 错误：阳离子蛋白主要是中性粒细胞颗粒中的抗菌蛋白，参与杀菌，不是中性粒细胞的趋化因子；本题选“无趋化作用”者。\nD. 正确：C3a是补体激活产物，具有过敏毒素作用，并对中性粒细胞有较弱趋化作用；C5a趋化作用更强。\nE. 正确：激肽原酶可激活激肽系统，同时对中性粒细胞具有趋化作用。\n易混点：C3a与C5a均属补体片段，C5a趋化作用强，C3a较弱；激肽原酶是趋化因子，而激肽主要与血管扩张、通透性增加和疼痛有关。记忆要点：细菌产物、坏死组织、补体片段、LTB4、IL-8、激肽原酶可趋化中性粒细胞，阳离子蛋白主要管杀菌。","chapter":4,"chapterName":"炎症","chapterTitle":"第4章 炎症"},{"id":"pathology-a-single-0006","type":"single","typeLabel":"单选题","number":6,"question":"病毒性肝炎时，下列哪项罕见","options":[{"key":"A","text":"溶解坏死"},{"key":"B","text":"脂肪变性"},{"key":"C","text":"嗜酸性变"},{"key":"D","text":"胞质疏松化和气球样变"},{"key":"E","text":"肝细胞再生"}],"answerKeys":["B"],"answerText":["脂肪变性"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：病毒性肝炎的基本病理变化以肝细胞变性、坏死和再生为主，脂肪变性相对罕见。\n解析：病毒性肝炎最常见的变性是肝细胞水肿，表现为胞质疏松化和气球样变；也可出现嗜酸性变、嗜酸性小体及溶解坏死，坏死后的肝细胞再生是常见修复反应。脂肪变性主要见于酒精性肝病、非酒精性脂肪性肝病、妊娠急性脂肪肝等，在病毒性肝炎中不属于典型或常见改变，故本题题眼是“罕见”，选B。\n\n选项分析：\nA. 错误：溶解坏死是病毒性肝炎可出现的肝细胞坏死形式，常见于点状坏死、碎片状坏死，重型肝炎可有大片坏死，不属于罕见。\nB. 正确：脂肪变性在病毒性肝炎中相对少见，典型病毒性肝炎以肝细胞水肿、嗜酸性变和坏死再生为主；脂肪变性更常提示酒精性肝病、代谢性脂肪肝等。\nC. 错误：嗜酸性变是病毒性肝炎常见改变，肝细胞胞质水分减少、嗜酸性增强，进一步可形成嗜酸性小体（Councilman小体）。\nD. 错误：胞质疏松化和气球样变是病毒性肝炎最常见的肝细胞变性，属于细胞水肿的表现，镜下肝细胞肿大、胞质淡染。\nE. 错误：肝细胞再生是病毒性肝炎常见修复反应，坏死灶周围可见肝细胞体积增大、核大深染、双核，重型肝炎可呈结节状再生。\n\n易混点：气球样变是细胞水肿导致胞质淡染疏松，不是脂肪变性；脂肪变性镜下为脂滴空泡，常将细胞核挤向一侧。嗜酸性变是胞质嗜酸性增强，进一步浓缩形成嗜酸性小体，属于凋亡样改变，不要与溶解坏死混淆。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-a-single-0007","type":"single","typeLabel":"单选题","number":7,"question":"肺硅沉着病引起慢性肺源性心脏病的原因不包括","options":[{"key":"A","text":"肺毛细血管床减少"},{"key":"B","text":"闭塞性血管内膜炎"},{"key":"C","text":"肺小动脉痉挛"},{"key":"D","text":"阻塞性支气管炎"},{"key":"E","text":"肺间质广泛纤维化"}],"answerKeys":["D"],"answerText":["阻塞性支气管炎"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：肺硅沉着病（矽肺）通过广泛肺纤维化、肺血管床减少及肺小动脉病变和痉挛导致肺动脉高压，进而引起慢性肺源性心脏病；阻塞性支气管炎不是其引起肺心病的直接机制。\n\n解析：矽肺时肺间质广泛纤维化及矽结节形成，使肺毛细血管床减少，肺循环阻力增加；同时肺小动脉可发生闭塞性血管内膜炎、血管壁纤维化，并因缺氧出现肺小动脉痉挛，最终形成肺动脉高压，导致右心室肥大、扩张，即慢性肺源性心脏病。本题题眼是“矽肺引起肺心病的原因不包括”，应选出不属于肺血管床减少或肺血管阻力增加机制的病变。阻塞性支气管炎主要见于慢性支气管炎、慢阻肺等，虽可与矽肺并存，但不是矽肺直接引起肺心病的病理环节。\n\n选项分析：\nA. 正确（属于）：肺间质纤维化和矽结节破坏肺毛细血管床，使肺血管床减少，肺循环阻力增加，是矽肺导致肺心病的重要机制。\nB. 正确（属于）：矽肺可累及肺小动脉，引起闭塞性血管内膜炎及血管壁增厚、管腔狭窄，增加肺循环阻力。\nC. 正确（属于）：矽肺所致缺氧可引起肺小动脉痉挛，使肺动脉压升高，参与肺心病发生。\nD. 错误（不属于）：阻塞性支气管炎是慢性支气管炎/慢阻肺的主要病变，可引起气道阻塞和缺氧，但本题问的是肺硅沉着病引起肺心病的原因，阻塞性支气管炎不是其直接、特异性机制。\nE. 正确（属于）：肺间质广泛纤维化是矽肺的基本病变，可压迫和破坏肺血管，减少肺毛细血管床并增加肺循环阻力。\n\n易混点：矽肺所致肺心病的关键是“肺纤维化+肺血管床减少+肺小动脉病变/痉挛”；慢支、肺气肿所致肺心病的关键是“气道阻塞、通气障碍、缺氧及肺血管床减少”。记忆时抓住：矽肺看肺间质和肺血管，慢支看气道和肺泡。","chapter":10,"chapterName":"呼吸系统疾病","chapterTitle":"第10章 呼吸系统疾病"},{"id":"pathology-a-single-0008","type":"single","typeLabel":"单选题","number":8,"question":"下列哪种恶性瘤属于T细胞型淋巴瘤","options":[{"key":"A","text":"毛细胞淋巴瘤"},{"key":"B","text":"蕈样霉菌病"},{"key":"C","text":"套细胞淋巴瘤"},{"key":"D","text":"滤泡性淋巴瘤"},{"key":"E","text":"淋巴母细胞淋巴瘤"}],"answerKeys":["B"],"answerText":["蕈样霉菌病"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：蕈样霉菌病是原发于皮肤的成熟T细胞淋巴瘤，属于T细胞型淋巴瘤的经典代表。\n解析：蕈样霉菌病并非真菌感染，而是CD4+辅助性T细胞来源的皮肤T细胞淋巴瘤，肿瘤细胞具有亲表皮性，镜下常形成Pautrier微脓肿。临床早期表现为皮肤红斑、斑块，晚期可形成肿瘤，并可累及淋巴结和内脏。本题题眼是“T细胞型淋巴瘤”，应选皮肤T细胞淋巴瘤代表——蕈样霉菌病。\n\n选项分析：\nA. 错误：毛细胞淋巴瘤/毛细胞白血病来源于成熟B细胞，常累及脾红髓及骨髓，免疫表型可见CD11c、CD25、CD103等表达，不属于T细胞型。\nB. 正确：蕈样霉菌病是成熟T细胞淋巴瘤，肿瘤细胞为CD4+ T细胞，具有亲表皮性，镜下Pautrier微脓肿是常考形态学特点。\nC. 错误：套细胞淋巴瘤来源于B细胞，常伴t(11;14)及cyclin D1过表达，好发于老年男性，可累及淋巴结、脾和骨髓。\nD. 错误：滤泡性淋巴瘤来源于生发中心B细胞，常伴t(14;18)及BCL2过表达，形态上呈滤泡样结构，不属于T细胞型。\nE. 错误：淋巴母细胞淋巴瘤是前体淋巴细胞肿瘤，可进一步分为T淋巴母细胞型和B淋巴母细胞型，笼统称“淋巴母细胞淋巴瘤”并非专指T细胞型；T-LBL虽属T细胞肿瘤，但本题经典标准答案为蕈样霉菌病。\n\n易混点：蕈样霉菌病名称中有“霉菌”，但本质是T细胞淋巴瘤，不是真菌感染；Sezary综合征可视为其白血病样表现。淋巴母细胞淋巴瘤需依靠免疫表型区分T系与B系，不能仅凭病名直接判定为T细胞型。","chapter":12,"chapterName":"淋巴造血系统疾病","chapterTitle":"第12章 淋巴造血系统疾病"},{"id":"pathology-a-single-0009","type":"single","typeLabel":"单选题","number":9,"question":"食管癌的最常见的组织学类型是","options":[{"key":"A","text":"鳞状细胞癌"},{"key":"B","text":"腺癌"},{"key":"C","text":"小细胞癌"},{"key":"D","text":"腺棘皮癌"},{"key":"E","text":"腺鳞癌"}],"answerKeys":["A"],"answerText":["鳞状细胞癌"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：A\n核心考点：食管癌最常见的组织学类型是鳞状细胞癌，题眼为“最常见组织学类型”。\n解析：食管黏膜被覆复层扁平上皮，长期吸烟、饮酒、过热饮食、亚硝胺类物质及慢性炎症等刺激可引起鳞状上皮不典型增生，进而发展为原位癌和浸润性鳞状细胞癌。食管鳞癌多发生于食管中段，肉眼可呈蕈伞型、髓质型、缩窄型或溃疡型；镜下可见癌细胞形成角化珠和细胞间桥，是诊断鳞癌的重要依据。虽然近年来西方部分国家食管下段腺癌比例上升，但就总体和我国考试语境而言，食管癌最常见类型仍为鳞状细胞癌。\n\n选项分析：\nA. 正确：鳞状细胞癌来源于食管原有复层扁平上皮，是食管癌最常见的组织学类型，常位于食管中段，镜下可见角化珠、细胞间桥。\nB. 错误：腺癌在食管较少见，多起源于Barrett食管，常位于食管下段，由柱状上皮异型增生恶变而来，不是最常见的食管癌类型。\nC. 错误：小细胞癌属于神经内分泌癌，食管原发者少见，恶性程度高、进展快，可表达神经内分泌标记，但发生率远低于鳞癌。\nD. 错误：腺棘皮癌是腺癌组织中伴良性鳞状上皮化生，恶性成分为腺癌，鳞状成分一般无明显恶性，食管中少见。\nE. 错误：腺鳞癌由腺癌和鳞癌两种恶性成分混合构成，食管中亦少见，不能作为最常见组织学类型。\n\n易混点：食管鳞癌多位于中段，与长期刺激和鳞状上皮不典型增生有关；食管腺癌多位于下段，与Barrett食管相关。腺棘皮癌的鳞状成分是良性化生，腺鳞癌则是腺、鳞两种成分均恶性，注意区分。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-a-single-0010","type":"single","typeLabel":"单选题","number":10,"question":"在大多数类型的组织损伤中血管通透性升高的速发反应主要是下列哪种因素影响","options":[{"key":"A","text":"补体"},{"key":"B","text":"细菌毒素"},{"key":"C","text":"过敏毒素"},{"key":"D","text":"组胺"},{"key":"E","text":"坏死分解产物"}],"answerKeys":["D"],"answerText":["组胺"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：急性炎症中血管通透性升高的速发反应主要由组胺介导，表现为细静脉内皮细胞收缩、内皮间隙增宽。\n解析：组织损伤后，肥大细胞、嗜碱性粒细胞和血小板迅速释放组胺，组胺作用于内皮细胞H1受体，使细静脉内皮细胞收缩，细胞间隙增宽，血浆蛋白和液体外渗，形成速发、短暂的通透性升高。该反应发生快，通常在数分钟内出现，是大多数类型组织损伤急性炎症早期的关键机制。题眼是“速发反应”和“大多数组织损伤”，指向组胺而非补体片段或坏死产物。\n选项分析：\nA. 错误：补体系统参与趋化、调理和吞噬，其中C3a、C5a虽可促进肥大细胞释放组胺，但补体本身不是大多数组织损伤速发通透性升高的主要直接介质。\nB. 错误：细菌毒素在特定感染中可直接损伤内皮或激活炎症，但并非大多数类型组织损伤共有的速发通透性升高因素。\nC. 错误：过敏毒素主要指C3a、C5a，可刺激肥大细胞脱颗粒并间接引起组胺释放，属于上游放大机制，不是本题所问的速发效应分子。\nD. 正确：组胺由肥大细胞等释放，引起细静脉内皮细胞收缩，是急性炎症速发短暂血管通透性升高的主要介质。\nE. 错误：坏死分解产物可促进炎症反应，但多在组织坏死后期出现，作用较持续，不属于速发反应的主要因素。\n易混点：组胺介导的通透性升高发生快、持续时间短；缓激肽、白三烯等作用相对较慢且较持久。过敏毒素是补体片段C3a、C5a，可通过促组胺释放间接起作用，考试中不要将其等同于组胺。","chapter":4,"chapterName":"炎症","chapterTitle":"第4章 炎症"},{"id":"pathology-a-single-0011","type":"single","typeLabel":"单选题","number":11,"question":"革囊胃的形成是指","options":[{"key":"A","text":"范围较大的溃疡型胃癌"},{"key":"B","text":"胃溃疡广泛瘢痕形成"},{"key":"C","text":"胃癌癌细胞弥漫浸润胃壁"},{"key":"D","text":"胃癌伴胃囊性扩张"},{"key":"E","text":"胃黏液腺癌大量黏液潴留"}],"answerKeys":["C"],"answerText":["胃癌癌细胞弥漫浸润胃壁"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：革囊胃的本质是胃癌细胞弥漫浸润胃壁，引起显著纤维组织增生和胃壁弥漫性增厚、变硬，使胃壁僵硬、胃腔缩小。\n解析：革囊胃又称“皮革胃”，属于弥漫浸润型胃癌。癌细胞常呈弥漫性浸润，不形成明显局限性肿块，并刺激间质纤维组织大量增生，导致胃壁全层增厚、僵硬，胃黏膜皱襞变平或消失，胃腔缩小。其肉眼观胃体似皮革囊，故称革囊胃；镜下常见低分化腺癌或印戒细胞癌伴明显纤维化。题眼是“弥漫浸润胃壁”，而不是单纯溃疡、瘢痕或黏液潴留。\n\n选项分析：\nA. 错误：范围较大的溃疡型胃癌主要表现为癌性溃疡，边缘隆起、底部污秽，虽可浸润胃壁，但通常为局限性或溃疡性病变，不以全胃壁弥漫性增厚僵硬为定义性特征。\nB. 错误：胃溃疡广泛瘢痕形成可导致胃变形、狭窄甚至“沙漏胃”，但本质是良性慢性消化性溃疡的纤维瘢痕收缩，并非胃癌细胞弥漫浸润。\nC. 正确：胃癌癌细胞弥漫浸润胃壁并伴明显纤维组织增生，使胃壁弥漫增厚、变硬、胃腔缩小，形成革囊胃，这是弥漫浸润型胃癌的典型表现。\nD. 错误：胃癌伴胃囊性扩张多与肿瘤阻塞、胃内容物潴留或囊性改变有关，并非革囊胃的病理形成机制；革囊胃的关键是胃壁僵硬缩小，不是囊性扩张。\nE. 错误：胃黏液腺癌大量黏液潴留可形成黏液湖、胶冻样外观，属于黏液腺癌的组织学特点；它不等同于癌细胞弥漫浸润胃壁所致革囊胃。\n\n易混点：革囊胃要与慢性消化性溃疡瘢痕所致胃变形鉴别：后者有溃疡病史和纤维瘢痕收缩，胃壁并非癌性弥漫浸润；弥漫浸润型胃癌胃壁僵硬、皱襞消失，常无明显巨大溃疡。记忆要点：革囊胃＝弥漫浸润型胃癌＋明显纤维化＋胃壁“皮革样”僵硬。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-a-single-0012","type":"single","typeLabel":"单选题","number":12,"question":"引起肾盂肾炎最主要的病原菌是","options":[{"key":"A","text":"肺炎杆菌"},{"key":"B","text":"葡萄球菌"},{"key":"C","text":"链球菌"},{"key":"D","text":"副大肠杆菌"},{"key":"E","text":"大肠杆菌"}],"answerKeys":["E"],"answerText":["大肠杆菌"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n核心考点：肾盂肾炎最常见的病原菌是大肠杆菌，感染多经尿路上行。\n解析：肾盂肾炎是主要累及肾盂、肾盏和肾间质的化脓性炎症，最常见致病菌为大肠杆菌，约占多数病例。其机制与尿道口周围大肠杆菌经尿道、膀胱、输尿管上行至肾盂有关，女性因尿道短更易发生，尿路梗阻、尿液潴留可促进感染。题眼是“最主要病原菌”，应首选大肠杆菌。\n\n选项分析：\nA. 错误：肺炎杆菌即克雷伯菌，可引起尿路感染，尤其医院获得性感染，但不是肾盂肾炎最主要的病原菌。\nB. 错误：葡萄球菌可经血行引起肾脓肿、肾周脓肿等，并非肾盂肾炎最常见病原菌。\nC. 错误：链球菌主要与感染后肾小球肾炎等免疫复合物性病变相关，不是肾盂肾炎的主要致病菌。\nD. 错误：副大肠杆菌等少见于尿路感染，属于少数病原菌，不能作为最主要病原菌。\nE. 正确：大肠杆菌是肾盂肾炎最常见病原菌，多由下尿路上行感染，常与尿路梗阻、女性尿道短等因素有关。\n\n易混点：急性肾盂肾炎是化脓性间质性炎症，病变累及肾盂肾盏；急性肾小球肾炎是免疫复合物性变态反应，主要累及肾小球。记忆要点：肾盂肾炎“上行感染、大肠杆菌、化脓性间质炎”。","chapter":13,"chapterName":"泌尿系统疾病","chapterTitle":"第13章 泌尿系统疾病"},{"id":"pathology-a-single-0013","type":"single","typeLabel":"单选题","number":13,"question":"下列哪项属于静脉性充血","options":[{"key":"A","text":"减压后充血"},{"key":"B","text":"妊娠子宫充血"},{"key":"C","text":"炎性充血"},{"key":"D","text":"进食后胃肠道的充血"},{"key":"E","text":"静脉阻塞引起的充血"}],"answerKeys":["E"],"answerText":["静脉阻塞引起的充血"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n核心考点：静脉性充血（被动性充血）是静脉血液回流受阻所致的局部组织血液淤积。\n\n解析：静脉性充血又称被动性充血，常见于静脉受压、静脉腔阻塞或心力衰竭等情况。其发生机制是静脉回流受阻，毛细血管流体静压升高，血液淤积于扩张的小静脉和毛细血管内；局部可呈暗红色、肿胀，体表温度偏低，并可伴水肿、出血甚至血栓形成。本题题眼是“静脉阻塞引起”，直接对应静脉回流受阻这一被动性充血机制。\n\n选项分析：\nA. 错误：减压后充血又称贫血后充血，是局部动脉压突然解除后细动脉扩张、血流增多，属于动脉性充血（主动性充血），不是静脉回流受阻。\nB. 错误：妊娠子宫充血是妊娠期激素作用及子宫血供需求增加引起的生理性动脉性充血，属于主动性充血。\nC. 错误：炎性充血通常指炎症早期细动脉扩张、血流加快所致的动脉性充血；炎症后期虽可伴静脉淤血，但本题所给“炎性充血”一般归为动脉性充血，不能作为静脉阻塞性充血的代表。\nD. 错误：进食后胃肠道充血由副交感神经兴奋和胃肠激素等引起，胃肠道动脉扩张、血流量增加，属于生理性动脉性充血。\nE. 正确：静脉阻塞导致静脉回流受阻，血液淤积于静脉和毛细血管床，是典型的静脉性充血，即被动性充血。\n\n易混点：动脉性充血是“动脉扩张、主动供血增多”，局部红、热；静脉性充血是“静脉回流受阻、被动淤血”，局部暗红、肿胀、温度偏低。炎性充血早期为动脉性，后期可转为静脉性，考试中若题干强调“静脉阻塞”应首选静脉性充血。","chapter":3,"chapterName":"局部血液循环障碍","chapterTitle":"第3章 局部血液循环障碍"},{"id":"pathology-a-single-0014","type":"single","typeLabel":"单选题","number":14,"question":"头皮血肿被肉芽组织所取代，这种现象称为","options":[{"key":"A","text":"肉芽组织形成"},{"key":"B","text":"肉芽肿形成"},{"key":"C","text":"机化"},{"key":"D","text":"纤维化"},{"key":"E","text":"血栓机化"}],"answerKeys":["C"],"answerText":["机化"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n\n核心考点：机化是指坏死组织、血栓、血肿、异物等被肉芽组织取代并最终形成纤维瘢痕的过程。\n\n解析：头皮血肿属于组织内出血形成的血肿，当血肿不能完全吸收时，周围新生肉芽组织长入血肿内，逐渐将其取代，最后转变为纤维瘢痕组织，这一过程称为机化。题眼是“血肿被肉芽组织所取代”，强调的是对无活力物质的取代和修复结局，而不是单纯出现肉芽组织或纤维组织增多。机化可发生于血栓、血肿、坏死组织及异物等，属于损伤修复的重要形式。\n\n选项分析：\nA. 错误：肉芽组织形成只是机化过程中的一个重要环节，肉芽组织由新生毛细血管和成纤维细胞等构成；本题问的是血肿被肉芽组织取代这一完整现象的名称，不能仅称为肉芽组织形成。\nB. 错误：肉芽肿是巨噬细胞及其衍生细胞局限性增生形成的结节状病变，常见于结核、异物等引起的慢性炎症，与血肿机化不是同一概念。\nC. 正确：血肿、血栓、坏死组织或异物被肉芽组织长入取代，最终纤维化形成瘢痕，均称为机化；头皮血肿被肉芽组织取代正是机化的典型表现。\nD. 错误：纤维化指组织或器官内纤维结缔组织增多，可由机化后期瘢痕形成所致，但本题强调血肿被肉芽组织取代的过程，直接命名为机化更准确。\nE. 错误：血栓机化特指血栓被肉芽组织取代并再通或形成瘢痕的过程，发生对象是血管内血栓；本题对象为头皮血肿，不是血栓。\n\n易混点：肉芽组织是修复过程中增生的新生毛细血管和成纤维细胞，肉芽肿是慢性炎症中巨噬细胞增生形成的结节，二者名称相近但本质不同。机化强调无活力物质被肉芽组织取代，纤维化强调纤维结缔组织增多，机化最终可导致纤维化，但血肿被取代的过程应称机化。","chapter":2,"chapterName":"损伤的修复","chapterTitle":"第2章 损伤的修复"},{"id":"pathology-a-single-0015","type":"single","typeLabel":"单选题","number":15,"question":"下列与肝细胞癌发生无关的因素是","options":[{"key":"A","text":"HBV，HCV"},{"key":"B","text":"亚硝胺类化合物"},{"key":"C","text":"黄曲霉毒素"},{"key":"D","text":"某些藻类毒素"},{"key":"E","text":"中华分支睾吸虫"}],"answerKeys":["E"],"answerText":["中华分支睾吸虫"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n核心考点：肝细胞癌的病因及危险因素，尤其是华支睾吸虫感染主要相关肿瘤为胆管癌而非肝细胞癌。\n解析：肝细胞癌的发生与慢性HBV、HCV感染、黄曲霉毒素B1、亚硝胺类化合物以及某些藻类毒素（如微囊藻毒素）等密切相关。其常见机制包括慢性肝炎—肝硬化—肝癌演变、致癌物引起肝细胞DNA损伤和基因突变（如p53突变）等。本题题眼在于区分“肝细胞癌”和“胆管癌”的相关因素：中华分支睾吸虫寄生于胆管，引起胆管炎、胆管上皮增生，最终与胆管癌发生相关，而不是肝细胞癌。\n选项分析：\nA. 正确：HBV、HCV慢性感染是肝细胞癌最重要的危险因素之一，可通过慢性肝炎、肝纤维化、肝硬化及病毒基因整合等机制促进肝细胞癌发生。\nB. 正确：亚硝胺类化合物是实验性肝癌的重要致癌物，可引起肝细胞DNA损伤和突变，与肝细胞癌发生有关。\nC. 正确：黄曲霉毒素B1常见于霉变花生、玉米，是肝细胞癌的重要化学致癌物，可与HBV感染协同致癌，并常涉及p53基因突变。\nD. 正确：某些藻类毒素如微囊藻毒素与饮用水污染相关，是肝细胞癌发生的危险因素之一，可引起肝细胞损伤和促癌作用。\nE. 错误：中华分支睾吸虫主要寄生于胆管系统，导致胆管炎、胆管上皮增生和纤维化，与胆管癌发生密切相关；它不是肝细胞癌的已知相关因素。\n易混点：华支睾吸虫感染相关的是胆管癌，不是肝细胞癌；HBV/HCV、黄曲霉毒素、亚硝胺和藻类毒素则属于肝细胞癌的重要病因或危险因素。记忆要点：寄生虫走胆管，化学/病毒伤肝细胞。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-a-single-0016","type":"single","typeLabel":"单选题","number":16,"question":"一坏死组织肉眼观察呈白色或微黄色、细腻，最有可能的是","options":[{"key":"A","text":"胰腺炎所致的脂肪坏死"},{"key":"B","text":"脓肿所致的液化性坏死"},{"key":"C","text":"缺血所致的凝固性坏死"},{"key":"D","text":"免疫反应所致的纤维蛋白样坏死"},{"key":"E","text":"结核病所致的干酪样坏死"}],"answerKeys":["E"],"answerText":["结核病所致的干酪样坏死"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n核心考点：干酪样坏死的肉眼形态及其与结核病的关系。\n解析：干酪样坏死是凝固性坏死的特殊类型，常见于结核病。坏死组织彻底，镜下为红染、无结构的颗粒状物质；肉眼呈灰白色或微黄色，质地细腻，似奶酪，故称干酪样坏死。本题题眼是“白色或微黄色、细腻”，最符合结核病所致干酪样坏死。\n选项分析：\nA. 错误：胰腺炎所致脂肪坏死多为酶解性脂肪坏死，肉眼常见胰腺周围脂肪内灰白色斑点或斑块，并可因脂肪酸皂化形成白垩样钙化灶，不是均匀细腻的奶酪样坏死。\nB. 错误：脓肿所致液化性坏死是组织被酶分解形成脓液，肉眼多为黄白色或黄绿色浑浊液体及脓腔，坏死组织液化，不是“细腻”的固体坏死物。\nC. 错误：缺血所致凝固性坏死常见于脾、肾梗死，肉眼呈灰白或灰黄色，质地较实，坏死组织轮廓可保留，并非奶酪样细腻。\nD. 错误：免疫反应所致纤维蛋白样坏死主要发生于血管壁和结缔组织，镜下呈强嗜酸性红染的纤维素样物质，肉眼常不明显，不是白色微黄细腻的坏死灶。\nE. 正确：结核病所致干酪样坏死肉眼呈灰白或微黄色、细腻、似奶酪，符合题干描述，是结核病的典型坏死类型。\n易混点：干酪样坏死记忆为“结核奶酪样”；凝固性坏死记忆为“梗死灰白、轮廓保留”；液化性坏死记忆为“脓肿液化”；脂肪坏死记忆为“胰腺周围白斑、皂化”。","chapter":1,"chapterName":"细胞和组织的适应与损伤","chapterTitle":"第1章 细胞和组织的适应与损伤"},{"id":"pathology-a-single-0017","type":"single","typeLabel":"单选题","number":17,"question":"慢性支气管炎伴哮喘的主要因素是","options":[{"key":"A","text":"支气管黏膜内杯状细胞增多"},{"key":"B","text":"支气管黏膜水肿"},{"key":"C","text":"支气管壁平滑肌痉挛"},{"key":"D","text":"支气管腔内黏液增多"},{"key":"E","text":"支气管管壁炎细胞浸润"}],"answerKeys":["C"],"answerText":["支气管壁平滑肌痉挛"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：慢性支气管炎伴哮喘时，气道阻塞的主要病理生理基础是支气管壁平滑肌痉挛。\n解析：慢性支气管炎的基本病变包括黏膜杯状细胞增多、黏液腺肥大增生、黏膜水肿及炎细胞浸润，临床以长期咳嗽、咳痰为主。当患者伴哮喘时，除慢性炎症和黏液分泌增多外，支气管平滑肌发生痉挛性收缩，导致气道广泛狭窄和可逆性阻塞，出现喘息、呼气性呼吸困难及哮鸣音。本题题眼是“伴哮喘的主要因素”，应抓住平滑肌痉挛这一哮喘发作的核心机制。\n\n选项分析：\nA. 错误：支气管黏膜内杯状细胞增多是慢性支气管炎的常见形态学改变，主要引起黏液分泌增加，表现为咳痰，不是伴哮喘时气道痉挛的主要因素。\nB. 错误：支气管黏膜水肿属于慢性炎症表现，可使管腔狭窄并加重气道阻塞，但它是炎症渗出改变，不是哮喘发作的主要动力因素。\nC. 正确：支气管壁平滑肌痉挛使气道口径缩小，是慢性支气管炎患者伴哮喘时出现喘息和呼气性呼吸困难的主要因素，符合标准答案。\nD. 错误：支气管腔内黏液增多是慢性支气管炎黏液分泌亢进的表现，可形成黏液栓并加重阻塞，但本题强调的是“伴哮喘”的主要因素，核心在平滑肌痉挛。\nE. 错误：支气管管壁炎细胞浸润是慢性支气管炎慢性炎症的基础病变，参与黏膜损伤和分泌增多，但不是哮喘样发作的直接主要因素。\n\n易混点：慢性支气管炎以黏液腺增生、杯状细胞增多和黏液分泌增多为突出表现；支气管哮喘以气道慢性变态反应性炎症、平滑肌痉挛和可逆性气流受限为突出表现。记忆要点：慢支“咳痰”重在黏液分泌，伴哮喘“喘息”重在平滑肌痉挛。","chapter":10,"chapterName":"呼吸系统疾病","chapterTitle":"第10章 呼吸系统疾病"},{"id":"pathology-a-single-0018","type":"single","typeLabel":"单选题","number":18,"question":"细胞坏死的主要形态学标志是","options":[{"key":"A","text":"细胞的极性消失"},{"key":"B","text":"无结构的颗粒物质"},{"key":"C","text":"细胞核的变化"},{"key":"D","text":"细胞间质的变化"},{"key":"E","text":"细胞质的改变"}],"answerKeys":["C"],"answerText":["细胞核的变化"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n\n核心考点：细胞坏死的主要形态学标志是细胞核的变化，即核固缩、核碎裂和核溶解。\n\n解析：细胞坏死是不可逆性损伤，光镜下判断细胞坏死最可靠的依据是核的改变。核固缩表现为核体积缩小、染色质凝聚、嗜碱性增强；核碎裂表现为核膜破裂、染色质碎片散开；核溶解表现为染色质被DNA酶分解而淡染、消失。坏死细胞胞质常嗜酸性增强，间质可发生崩解，但这些不如核变化特异，故本题题眼是“主要形态学标志”。\n\n选项分析：\nA. 错误：细胞极性消失多用于描述上皮性恶性肿瘤细胞排列紊乱、极性丧失，属于肿瘤细胞异型性表现，不是细胞坏死的标志。\nB. 错误：无结构的颗粒物质可见于坏死组织，如干酪样坏死、凝固性坏死区，但这是坏死组织的大体或低倍镜下表现，不是判断单个细胞坏死的主要标志。\nC. 正确：坏死细胞最重要的形态学依据是核固缩、核碎裂和核溶解，反映细胞死亡后DNA降解和核蛋白破坏。\nD. 错误：细胞间质变化如胶原纤维肿胀、断裂、红染均可见于坏死，但属于继发或辅助改变，不能作为主要标志。\nE. 错误：细胞质改变如嗜酸性增强、核蛋白体减少可见于坏死，也可见于可逆性损伤，特异性和诊断价值不如核变化。\n\n易混点：坏死与凋亡均可出现核浓缩、核碎裂，但坏死常伴细胞膜破裂、胞质外溢和周围炎症反应；凋亡则形成凋亡小体，通常无明显炎症。记忆要点：判断“坏死”先看核——固缩、碎裂、溶解。","chapter":1,"chapterName":"细胞和组织的适应与损伤","chapterTitle":"第1章 细胞和组织的适应与损伤"},{"id":"pathology-a-single-0019","type":"single","typeLabel":"单选题","number":19,"question":"下面关于慢性支气管炎的描述不正确的是","options":[{"key":"A","text":"是一种由呼吸道过敏引起的以支气管可逆性发作性痉挛为特征的慢性阻塞性炎性疾病"},{"key":"B","text":"支气管壁平滑肌断裂、萎缩"},{"key":"C","text":"黏膜腺体增生肥大"},{"key":"D","text":"黏膜上皮可出现鳞状化生"},{"key":"E","text":"支气管壁充血水肿，淋巴细胞、浆细胞浸润"}],"answerKeys":["A"],"answerText":["是一种由呼吸道过敏引起的以支气管可逆性发作性痉挛为特征的慢性阻塞性炎性疾病"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：A\n核心考点：慢性支气管炎是气管、支气管黏膜及其周围组织的慢性非特异性炎症，而非过敏性、可逆性支气管痉挛性疾病。\n解析：慢性支气管炎的病理基础是气道慢性非特异性炎症，表现为黏膜腺体增生肥大、杯状细胞增多、分泌物增多，支气管壁充血水肿及淋巴细胞、浆细胞浸润，并可有平滑肌断裂萎缩和上皮鳞状化生。A项所述“呼吸道过敏引起、以支气管可逆性发作性痉挛为特征”是支气管哮喘的典型特点，不是慢性支气管炎。本题题眼在于区分慢性支气管炎与支气管哮喘的本质：前者为慢性非特异性炎症，后者为气道慢性炎症伴高反应性和可逆性气流受限。\n选项分析：\nA. 错误：该描述对应支气管哮喘，核心是过敏原等诱发的气道慢性炎症、支气管平滑肌痉挛和可逆性气流受限；慢性支气管炎并非以过敏性可逆性发作性痉挛为特征。\nB. 正确：慢性支气管炎反复发作、病变进展时，支气管壁平滑肌可发生断裂、萎缩，软骨也可变性萎缩，属于慢性炎症破坏和重构表现。\nC. 正确：黏膜腺体增生肥大是慢性支气管炎的重要病理改变，尤其黏液腺增生、浆液腺黏液化，导致痰液分泌增多。\nD. 正确：长期慢性炎症刺激可使支气管黏膜上皮受损，出现鳞状上皮化生，属于适应性改变，也可成为癌变基础之一。\nE. 正确：支气管壁充血水肿，伴淋巴细胞、浆细胞等慢性炎细胞浸润，是慢性非特异性炎症的典型镜下表现。\n易混点：支气管哮喘以气道高反应性、可逆性痉挛和嗜酸性粒细胞等炎症细胞浸润为要点；慢性支气管炎以长期咳嗽咳痰、黏膜腺体增生肥大和慢性非特异性炎症为要点。记忆时可抓“慢支看腺体，哮喘看痉挛”。","chapter":10,"chapterName":"呼吸系统疾病","chapterTitle":"第10章 呼吸系统疾病"},{"id":"pathology-a-single-0020","type":"single","typeLabel":"单选题","number":20,"question":"栓子最确切的定义是","options":[{"key":"A","text":"循环血液内的有形成分"},{"key":"B","text":"循环血液内不溶于血液的异常物质"},{"key":"C","text":"循环血液内脱落的血栓"},{"key":"D","text":"循环血液内脱落的肿瘤团块"},{"key":"E","text":"循环血液内的脂肪滴"}],"answerKeys":["B"],"answerText":["循环血液内不溶于血液的异常物质"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：栓子的定义及栓塞的概念，即进入循环血液并随血流运行、阻塞血管的不溶性异常物质。\n解析：栓子最确切的定义是循环血液内不溶于血液的异常物质。其关键限定有两点：一是“异常物质”，二是不溶于血液，因而可随血流运行并阻塞某处血管腔。栓子可以是脱落的血栓、脂肪滴、气体、羊水成分、肿瘤细胞团块等，因此不能把栓子等同于某一种具体类型。本题题眼是“最确切的定义”，应选涵盖各类栓子的概括性定义。\n选项分析：\nA. 错误：循环血液内的有形成分包括红细胞、白细胞、血小板等正常血液成分，并不等同于栓子；若把正常有形成分都视为栓子，概念过宽。\nB. 正确：该定义既指出栓子位于循环血液内，又强调其为不溶于血液的异常物质，能够涵盖血栓栓子、脂肪栓子、气体栓子、羊水栓子、肿瘤栓子等多种类型，是最确切的定义。\nC. 错误：脱落的血栓是血栓栓子，属于最常见的一类栓子，但不能包括脂肪、气体、羊水、肿瘤等栓子，属于定义过窄。\nD. 错误：脱落的肿瘤团块是肿瘤栓子，可经血流转移，但只是栓子的一种特殊类型，不能作为栓子的普遍定义。\nE. 错误：脂肪滴是脂肪栓子，常见于长骨骨折、脂肪组织严重挫伤等，但仅为栓子的一种类型，不能概括全部栓子。\n易混点：血栓与栓子不同，血栓是在活体心血管内形成的血液凝块，脱落后随血流运行才成为血栓栓子；栓塞是栓子随血流阻塞血管的过程，梗死是阻塞后可能发生的缺血性坏死后果。记忆要点：栓子重在不溶于血液、随血流运行、可阻塞血管，具体成分只是分类依据。","chapter":3,"chapterName":"局部血液循环障碍","chapterTitle":"第3章 局部血液循环障碍"},{"id":"pathology-a-single-0021","type":"single","typeLabel":"单选题","number":21,"question":"黏液癌最常见于","options":[{"key":"A","text":"血管壁"},{"key":"B","text":"腹膜后"},{"key":"C","text":"胃肠道"},{"key":"D","text":"子宫"},{"key":"E","text":"胆囊"}],"answerKeys":["C"],"answerText":["胃肠道"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：黏液癌（胶样癌）的好发部位及其分泌黏液形成黏液湖的病理特征。\n解析：黏液癌是癌细胞分泌大量黏液并聚积在细胞外间质或细胞内，肉眼常呈半透明胶冻状，故又称胶样癌；镜下可见大片黏液湖，其中漂浮癌细胞团或印戒样细胞。胃肠道是黏液癌最常见的发生部位，尤以胃和大肠较多见，胃黏液癌常呈胶冻样外观，可伴印戒细胞成分。本题题眼是“最常见”，应选胃肠道，而不是其他可发生黏液性肿瘤但原发黏液癌较少的部位。\n选项分析：\nA. 错误：血管壁不是黏液癌的常见原发部位；血管壁可发生黏液样变性等改变，但不等同于黏液癌。\nB. 错误：腹膜后可发生黏液性囊性肿瘤或腹膜假黏液瘤等，但原发黏液癌少见，且腹膜假黏液瘤多继发于阑尾、卵巢等黏液性肿瘤。\nC. 正确：胃肠道是黏液癌最常见部位，胃和大肠黏液癌可形成细胞外黏液湖，肉眼呈胶冻状，镜下见黏液湖及漂浮癌细胞团。\nD. 错误：子宫可发生子宫内膜黏液性癌等，但发生率明显低于胃肠道黏液癌，不是“最常见”部位。\nE. 错误：胆囊可发生黏液腺癌，但属少见部位，不能与胃肠道相比。\n易混点：黏液癌要与黏液样变性、黏液瘤区分；前者是恶性肿瘤，镜下以黏液湖和癌细胞为核心。胃印戒细胞癌可产生细胞内黏液，而典型黏液癌以细胞外黏液湖为突出特点，二者可并存但概念不能完全等同。","chapter":6,"chapterName":"肿瘤","chapterTitle":"第6章 肿瘤"},{"id":"pathology-a-single-0022","type":"single","typeLabel":"单选题","number":22,"question":"膀胱癌的最常见转移部位是","options":[{"key":"A","text":"子宫旁、髂动脉旁和主动脉旁淋巴结"},{"key":"B","text":"种植到卵巢"},{"key":"C","text":"局部淋巴结"},{"key":"D","text":"肝"},{"key":"E","text":"肺"}],"answerKeys":["C"],"answerText":["局部淋巴结"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：膀胱癌最常见转移途径为淋巴道转移，首先转移至局部盆腔淋巴结。\n解析：膀胱癌的转移以淋巴道最常见，癌细胞经膀胱壁内淋巴管首先引流至闭孔、髂内、髂外及骶前等局部淋巴结，故“局部淋巴结”是最常见转移部位。血道转移多发生于晚期，可至肝、肺、骨等，但总体发生率低于局部淋巴结转移；直接蔓延和种植转移较少见。本题题眼是“最常见转移部位”，应把握膀胱癌淋巴道转移优先、局部淋巴结为首站的特点。\n选项分析：\nA. 错误：子宫旁、髂动脉旁和主动脉旁淋巴结属于更广泛的腹膜后/主动脉旁淋巴结转移，不是膀胱癌最先且最常见的局部淋巴结部位；该描述更易见于宫颈癌、子宫内膜癌等盆腔恶性肿瘤的淋巴道扩散。\nB. 错误：种植到卵巢属于腹腔种植性转移，典型见于胃癌等胃肠道黏液癌形成的Krukenberg瘤；膀胱癌虽可累及盆腔，但卵巢种植不是其最常见转移部位。\nC. 正确：膀胱癌最常见经淋巴道转移，首先至局部淋巴结，如闭孔、髂内、髂外及骶前淋巴结，故本题选C。\nD. 错误：肝是膀胱癌血道转移的远处部位之一，多见于晚期病例，不是“最常见转移部位”，且不属于区域局部淋巴结。\nE. 错误：肺同样是膀胱癌血道转移的常见远处器官之一，但总体仍不如局部淋巴结转移常见；将其作为最常见转移部位混淆了血道远处转移与淋巴道首站转移。\n易混点：记忆“膀胱癌先淋巴到局部，晚期血道到肝肺骨”。局部淋巴结主要指闭孔、髂内、髂外、骶前等盆腔淋巴结；肝、肺为血道远处转移部位，不能与“最常见转移部位”混同。","chapter":13,"chapterName":"泌尿系统疾病","chapterTitle":"第13章 泌尿系统疾病"},{"id":"pathology-a-single-0023","type":"single","typeLabel":"单选题","number":23,"question":"关于浸润性生长，正确的是","options":[{"key":"A","text":"是恶性肿瘤所独有的生长方式"},{"key":"B","text":"是良性肿瘤所独有的生长方式"},{"key":"C","text":"良、恶性肿瘤均可以呈浸润性生长"},{"key":"D","text":"良、恶性肿瘤均不可以呈浸润性生长"},{"key":"E","text":"多数良性肿瘤的主要生长方式"}],"answerKeys":["C"],"answerText":["良、恶性肿瘤均可以呈浸润性生长"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：肿瘤的生长方式，重点区分浸润性生长、膨胀性生长及良恶性肿瘤的关系。\n解析：浸润性生长是指肿瘤细胞向周围组织间隙、淋巴管、血管或神经束衣等浸润，常无包膜、界限不清、活动度差，是恶性肿瘤常见的生长方式。但浸润性生长并非恶性肿瘤所独有，少数良性肿瘤如血管瘤、淋巴管瘤及韧带样纤维瘤病等也可呈浸润性生长，故“良、恶性肿瘤均可以呈浸润性生长”正确。本题题眼是“浸润性生长”是一种生长方式，不等于恶性肿瘤特有的“转移”。\n选项分析：\nA. 错误：浸润性生长多见于恶性肿瘤，但并非恶性肿瘤独有；少数良性肿瘤也可呈浸润性生长。\nB. 错误：良性肿瘤最常见的生长方式是膨胀性生长，多数有包膜、界限清楚，浸润性生长并非良性肿瘤独有。\nC. 正确：恶性肿瘤常呈浸润性生长，少数良性肿瘤也可浸润周围组织，因此良、恶性肿瘤均可以呈浸润性生长。\nD. 错误：该说法与事实相反，恶性肿瘤普遍可呈浸润性生长，部分良性肿瘤也可呈浸润性生长。\nE. 错误：多数良性肿瘤的主要生长方式是膨胀性生长，常形成包膜、界限清楚；浸润性生长不是多数良性肿瘤的主要方式。\n易混点：恶性肿瘤特有的生物学行为是“转移”，不是“浸润性生长”；浸润性生长强调向周围组织长入，膨胀性生长强调推挤周围组织形成包膜。记忆要点：恶性多见浸润，良性少数可浸润，多数良性呈膨胀性生长。","chapter":6,"chapterName":"肿瘤","chapterTitle":"第6章 肿瘤"},{"id":"pathology-a-single-0024","type":"single","typeLabel":"单选题","number":24,"question":"成人呼吸窘迫综合征发病机制中最关键的因素是","options":[{"key":"A","text":"血氧含量下降"},{"key":"B","text":"微血管内血栓形成"},{"key":"C","text":"呼吸膜损伤"},{"key":"D","text":"肺泡活性物质合成和分泌减少"},{"key":"E","text":"小动脉壁纤维蛋白样坏死"}],"answerKeys":["C"],"answerText":["呼吸膜损伤"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：成人呼吸窘迫综合征（ARDS）发病机制的中心环节是肺泡-毛细血管膜即呼吸膜损伤，导致通透性增加和富含蛋白的肺水肿。\n解析：ARDS的本质是弥漫性肺泡损伤，各种病因（严重感染、休克、创伤、误吸等）首先损伤肺泡上皮和毛细血管内皮，使呼吸膜完整性破坏、通透性显著增高，血浆蛋白和液体渗入肺泡腔，形成肺水肿、纤维蛋白渗出及透明膜形成，进而引起通气/血流比例失调、弥散障碍和顽固性低氧血症。题眼在“发病机制中最关键”，即呼吸膜损伤是起始和中心环节，低氧血症是其结果而非原因。\n选项分析：\nA. 错误：血氧含量下降是ARDS肺气体交换障碍的结果，表现为顽固性低氧血症，并非启动和决定病变的关键机制。\nB. 错误：微血管内血栓形成可见于DIC或重症ARDS继发改变，可加重肺循环障碍，但属于继发或参与因素，不是最关键的发病环节。\nC. 正确：呼吸膜由肺泡表面液层、肺泡上皮、基底膜、间质和毛细血管内皮构成；其损伤使肺泡-毛细血管屏障破坏、通透性增高，是ARDS肺水肿和透明膜形成的病理基础。\nD. 错误：肺泡表面活性物质合成和分泌减少主要见于新生儿呼吸窘迫综合征，也可因ARDS时Ⅱ型肺泡上皮损伤而继发减少，但不是成人ARDS最关键的起始因素。\nE. 错误：小动脉壁纤维蛋白样坏死多见于系统性血管炎、恶性高血压等，并非ARDS的特征性病变；ARDS的关键是肺泡-毛细血管膜损伤而非小动脉坏死。\n易混点：新生儿呼吸窘迫综合征的关键是肺表面活性物质缺乏，而成人ARDS的关键是呼吸膜损伤；两者都可出现呼吸困难、肺水肿和低氧血症，但发病起点不同，记忆时抓住“成人ARDS—弥漫性肺泡损伤—呼吸膜通透性增高”。","chapter":10,"chapterName":"呼吸系统疾病","chapterTitle":"第10章 呼吸系统疾病"},{"id":"pathology-a-single-0025","type":"single","typeLabel":"单选题","number":25,"question":"原位癌与浸润癌的主要区别是","options":[{"key":"A","text":"肿瘤大小"},{"key":"B","text":"基膜是否完整"},{"key":"C","text":"边界是否清楚"},{"key":"D","text":"有无血管浸润"},{"key":"E","text":"有无淋巴管浸润"}],"answerKeys":["B"],"answerText":["基膜是否完整"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：原位癌与浸润癌的区别在于恶性上皮细胞是否突破基底膜侵入间质。\n解析：原位癌的异型上皮细胞占据上皮全层，但基底膜完整，癌细胞未侵入下方间质，因此不发生淋巴管或血管转移。浸润癌则是癌细胞突破基底膜进入间质，获得局部浸润和转移能力。本题题眼是“基底膜是否完整”，这是判断原位癌与浸润癌的形态学关键。\n选项分析：\nA. 错误：肿瘤大小不能区分原位癌与浸润癌，原位癌可范围较大，浸润癌早期也可能较小，关键在于有无突破基底膜。\nB. 正确：基底膜完整者仍属原位癌，基底膜被破坏并由癌细胞侵入间质者为浸润癌，这是两者最本质的区别。\nC. 错误：边界是否清楚更多用于区别良性肿瘤与恶性肿瘤或判断浸润方式，不是原位癌与浸润癌的分界标准。\nD. 错误：有无血管浸润提示肿瘤侵袭和转移能力，但血管浸润多发生于癌细胞突破基底膜进入间质之后，不是主要区别点。\nE. 错误：有无淋巴管浸润同样不是原位癌与浸润癌的核心区别；原位癌因基底膜完整一般不能侵入淋巴管，而浸润癌可发生淋巴管浸润。\n易混点：原位癌与上皮内瘤变/异型增生均强调上皮内病变，但原位癌异型性更重、累及全层；一旦基底膜破坏即为浸润癌。记忆要点是“基底膜完整为原位，突破基底膜为浸润”。","chapter":6,"chapterName":"肿瘤","chapterTitle":"第6章 肿瘤"},{"id":"pathology-a-single-0026","type":"single","typeLabel":"单选题","number":26,"question":"细胞肿胀常发生于下述哪一组脏器","options":[{"key":"A","text":"心、肺、肾"},{"key":"B","text":"心、脑、肾"},{"key":"C","text":"胰、脾、肾"},{"key":"D","text":"心、肝、肾"},{"key":"E","text":"脑、肠、肺"}],"answerKeys":["D"],"answerText":["心、肝、肾"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：细胞肿胀即细胞水肿（水变性），最常发生于代谢旺盛、线粒体丰富且易受缺氧、感染和中毒影响的实质器官，尤其是心、肝、肾。\n解析：细胞肿胀的机制是缺氧、感染、中毒等损伤使线粒体氧化磷酸化受抑，ATP生成减少，细胞膜钠钾泵功能障碍，细胞内钠离子和水潴留，同时胞质内水分增多。好发部位为心、肝、肾等实质器官，因为这些器官代谢活跃、对缺氧敏感。肉眼可见器官体积增大、色泽苍白、边缘圆钝、切面隆起；镜下细胞肿大、胞质疏松淡染、呈颗粒状或空泡状。本题题眼是“细胞肿胀常发生于哪一组脏器”，应选心、肝、肾。\n\n选项分析：\nA. 错误：心和肾属于细胞肿胀好发器官，但肺不是传统意义上细胞水肿最典型的实质器官；肺水肿多与血管内外液体交换障碍有关，属于水肿而非本题所指的可逆性细胞损伤。\nB. 错误：心和肾正确，但脑细胞水肿通常归入脑水肿的细胞毒性水肿范畴，临床和病理机制与一般实质器官的细胞肿胀不同，不是本题最佳组合。\nC. 错误：肾可发生细胞肿胀，但胰、脾不是细胞水肿最常累及和考试中最强调的实质器官，且该组合不能体现心、肝、肾的典型好发部位。\nD. 正确：心、肝、肾均为代谢活跃的实质器官，对缺氧、感染、中毒敏感，是细胞水肿最常发生的部位；心肌细胞、肝细胞和肾小管上皮细胞均可出现细胞肿大、胞质疏松淡染。\nE. 错误：脑、肠、肺均不是细胞肿胀最典型的好发器官组合；脑多涉及脑水肿，肺多涉及肺水肿，肠更常表现为黏液样变性或坏死等，与本题概念不符。\n\n易混点：细胞肿胀需与脂肪变性鉴别。二者均可发生于肝、心、肾，但细胞肿胀是胞质内水分增多，细胞肿大、淡染；脂肪变性是胞质内出现脂滴空泡，冰冻切片脂肪染色阳性。肝细胞严重水变性可呈气球样变，是病毒性肝炎的常见改变；不要将其与脂肪变或脑水肿混为一谈。","chapter":1,"chapterName":"细胞和组织的适应与损伤","chapterTitle":"第1章 细胞和组织的适应与损伤"},{"id":"pathology-a-single-0027","type":"single","typeLabel":"单选题","number":27,"question":"下列哪项不是化生","options":[{"key":"A","text":"成纤维细胞变为纤维细胞"},{"key":"B","text":"成纤维细胞变为骨母细胞"},{"key":"C","text":"膀胱黏膜出现了鳞状上皮"},{"key":"D","text":"柱状上皮转变为移行上皮"},{"key":"E","text":"胃黏膜上皮转变为肠上皮"}],"answerKeys":["A"],"answerText":["成纤维细胞变为纤维细胞"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：A\n核心考点：化生是一种分化成熟的细胞类型被另一种分化成熟的细胞类型取代的适应性改变。\n解析：化生常由局部干细胞在慢性刺激下向另一方向分化所致，多见于上皮组织，也可见于间叶组织。其本质是“成熟细胞类型被另一种成熟细胞类型替代”，而不是同一细胞由功能活跃状态转为静止状态。A项中成纤维细胞与纤维细胞属于同一细胞谱系的不同功能状态，纤维细胞可视为静止状态的成纤维细胞，并非一种成熟细胞被另一种成熟细胞取代，因此不是化生。本题题眼是区分真正的细胞类型转化与同一细胞的功能状态变化。\n选项分析：\nA. 正确：成纤维细胞变为纤维细胞是同一类间叶细胞由功能活跃状态向静止状态转变，不构成一种成熟细胞类型被另一种成熟细胞类型替代，不属于化生。\nB. 错误：成纤维细胞变为骨母细胞属于间叶组织化生，可见于损伤修复、骨化性肌炎等，是成纤维细胞在局部刺激下向成骨方向分化。\nC. 错误：膀胱黏膜正常为移行上皮，慢性刺激下可被鳞状上皮取代，称为鳞状上皮化生，属于上皮性化生。\nD. 错误：柱状上皮在慢性刺激下可转变为移行上皮，属于上皮组织化生，即一种成熟上皮被另一种成熟上皮替代。\nE. 错误：胃黏膜上皮转变为肠上皮为肠上皮化生，常见于慢性萎缩性胃炎，是胃黏膜对慢性损伤的适应性改变。\n易混点：化生强调“成熟细胞类型改变”，增生强调细胞数量增多，变性强调细胞内或细胞间质物质异常沉积。成纤维细胞与纤维细胞是同一细胞的不同功能状态，不能误认为化生；而胃的肠上皮化生、膀胱的鳞状上皮化生均属于典型化生。","chapter":1,"chapterName":"细胞和组织的适应与损伤","chapterTitle":"第1章 细胞和组织的适应与损伤"},{"id":"pathology-a-single-0028","type":"single","typeLabel":"单选题","number":28,"question":"大肠癌的病因与下列哪些因素无关","options":[{"key":"A","text":"家族高发的遗传因素"},{"key":"B","text":"p53基因点突变"},{"key":"C","text":"富于刺激性纤维质多的食物"},{"key":"D","text":"MSH2基因点突变"},{"key":"E","text":"高营养低纤维质的食物"}],"answerKeys":["C"],"answerText":["富于刺激性纤维质多的食物"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C  \n核心考点：大肠癌的环境与遗传病因，尤其是饮食因素和分子遗传学改变。  \n解析：大肠癌的发生与遗传因素、癌基因激活、抑癌基因失活及错配修复基因异常密切相关。高营养、低纤维质饮食是较明确的危险因素，而富于纤维质的饮食通常具有保护作用，并非大肠癌的致病因素。本题题眼是“无关”，C项既不是已确认危险因素，其“纤维质多”还与保护作用相悖。  \n选项分析：  \nA. 正确：家族高发提示遗传易感性，如家族性腺瘤性息肉病与APC基因种系突变、遗传性非息肉病性结直肠癌与错配修复基因突变有关，属于大肠癌相关因素。  \nB. 正确：p53为抑癌基因，其点突变导致抑癌功能丧失，常见于腺瘤癌变过程的晚期，与大肠癌发生相关。  \nC. 错误：富于刺激性、纤维质多的食物不是大肠癌的明确危险因素；纤维质多通常促进肠蠕动、缩短粪便停留时间，倾向保护作用。本题所问“无关”，故为标准答案。  \nD. 正确：MSH2属于错配修复基因，其突变可导致微卫星不稳定，与遗传性非息肉病性结直肠癌密切相关。  \nE. 正确：高营养、低纤维质饮食可致粪便停留时间延长、胆酸和致癌物浓度增高等，是大肠癌的危险因素。  \n易混点：膳食纤维多一般保护，低纤维、高脂肪高蛋白饮食才增加大肠癌风险；分子事件中APC突变较早，p53突变较晚，MSH2异常与微卫星不稳定相关。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-a-single-0029","type":"single","typeLabel":"单选题","number":29,"question":"原发性肝癌的肉眼分型不包括","options":[{"key":"A","text":"结节型"},{"key":"B","text":"弥漫型"},{"key":"C","text":"巨块型"},{"key":"D","text":"混合型"},{"key":"E","text":"小肝癌"}],"answerKeys":["D"],"answerText":["混合型"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：原发性肝癌的肉眼分型及“小肝癌”的特殊地位。\n解析：原发性肝癌肉眼类型主要包括巨块型、多结节型（结节型）、弥漫型；小肝癌属于早期肝癌的特殊类型，通常指单个癌结节直径≤3cm，或两个癌结节直径之和≤3cm。混合型不是原发性肝癌的肉眼分型，而是组织学分型中可出现的“混合细胞型肝癌”（兼有肝细胞癌和胆管细胞癌成分）。本题题眼是“肉眼分型”，应把大体形态类型与组织学类型区分开。\n选项分析：\nA. 正确（属于）：结节型/多结节型为肝癌常见肉眼类型，肝内多发大小不等的癌结节，常伴肝硬化。\nB. 正确（属于）：弥漫型为癌组织弥漫浸润肝组织，无明显结节或结节细小弥漫，易致肝功能衰竭。\nC. 正确（属于）：巨块型为肝内单发巨大癌块，多见于右叶，可伴卫星结节。\nD. 错误（不属于）：混合型不是原发性肝癌肉眼分型；若说“混合型肝癌”多指组织学上肝细胞癌与胆管细胞癌成分混合。\nE. 正确（属于）：小肝癌是早期肝癌的特殊肉眼类型，强调癌结节小、常无明显症状，及时切除预后较好。\n易混点：肉眼分型记“巨块、结节、弥漫”，小肝癌为特殊早期类型；组织学分型才记“肝细胞癌、胆管细胞癌、混合细胞型肝癌”，不要把组织学“混合型”误作肉眼分型。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-a-single-0030","type":"single","typeLabel":"单选题","number":30,"question":"原发性颗粒性固缩肾表现为","options":[{"key":"A","text":"表面呈颗粒状"},{"key":"B","text":"两肾肿大，颜色苍白"},{"key":"C","text":"肾脏表面可见凹陷瘢痕"},{"key":"D","text":"肾内形成多发性栓塞小脓肿"},{"key":"E","text":"两肾肿大充血，呈“大红肾”"}],"answerKeys":["A"],"answerText":["表面呈颗粒状"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：A\n核心考点：原发性颗粒性固缩肾是良性高血压引起的肾脏细动脉硬化性病变，特征为双肾对称性缩小、表面呈均匀细颗粒状。\n解析：良性高血压时，入球小动脉玻璃样变、小叶间动脉及弓形动脉内膜纤维化，造成肾小球缺血性硬化；残存肾单位代偿性肥大，使肾脏表面呈细颗粒状。肉眼观双肾对称性缩小、质地变硬，皮质变薄。题眼是“原发性”，即原发性高血压所致，而非慢性肾小球肾炎所致的继发性颗粒性固缩肾。\n选项分析：\nA. 正确：表面呈颗粒状是原发性颗粒性固缩肾的典型肉眼表现，颗粒细小且分布较均匀，由硬化肾小球萎缩与代偿肥大肾单位相间形成。\nB. 错误：两肾肿大、颜色苍白多见于肾病综合征相关病变（如脂性肾病、膜性肾病）等“大白肾”改变，不是高血压所致固缩肾的萎缩表现。\nC. 错误：肾脏表面可见凹陷瘢痕是慢性肾盂肾炎的典型表现，瘢痕常不对称并伴肾盂肾盏变形，不属于原发性颗粒性固缩肾。\nD. 错误：肾内多发性栓塞小脓肿见于感染性心内膜炎等脓毒栓塞，属于感染性栓塞性病变，与良性高血压肾硬化无关。\nE. 错误：两肾肿大充血、呈“大红肾”是急性弥漫性增生性肾小球肾炎的典型表现，可伴点状出血，不是颗粒性固缩肾。\n易混点：原发性颗粒性固缩肾由良性高血压引起，记忆为“双肾对称缩小、细颗粒”；慢性肾小球肾炎所致为继发性颗粒性固缩肾，颗粒常较粗且不均匀；慢性肾盂肾炎则表现为不对称的凹陷性瘢痕。","chapter":9,"chapterName":"心血管系统疾病","chapterTitle":"第9章 心血管系统疾病"},{"id":"pathology-a-single-0031","type":"single","typeLabel":"单选题","number":31,"question":"下列关于肝癌肉眼类型及组织类型均为多见的叙述中，哪项是正确的","options":[{"key":"A","text":"多结节型与胆管上皮癌多见"},{"key":"B","text":"巨块型与肝细胞癌多见"},{"key":"C","text":"多结节型与肝细胞癌多见"},{"key":"D","text":"巨块型与混合性肝癌多见"},{"key":"E","text":"弥漫型与混合性肝癌多见"}],"answerKeys":["C"],"answerText":["多结节型与肝细胞癌多见"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：原发性肝癌最常见的肉眼类型为多结节型，最常见的组织学类型为肝细胞癌。\n解析：原发性肝癌肉眼可分为巨块型、多结节型和弥漫型，其中多结节型最多见，常发生于肝硬化基础上，肝内出现大小不等的散在结节；组织学上以肝细胞癌最多见，癌细胞可呈梁索状、假腺管状排列，常伴AFP升高。本题题眼是“肉眼类型及组织类型均为多见”，应将两个“最常见”同时对应，即多结节型加肝细胞癌。\n选项分析：\nA. 错误：多结节型确为最常见肉眼类型，但胆管上皮癌（胆管细胞癌）不是最常见组织学类型，肝细胞癌才最常见。\nB. 错误：肝细胞癌是最常见组织学类型，但巨块型不是最常见肉眼类型，多结节型更多见；巨块型表现为肝内巨大肿块，常为单发。\nC. 正确：多结节型是肝癌最常见肉眼类型，肝细胞癌是肝癌最常见组织学类型，二者均符合“多见”。\nD. 错误：巨块型不是最常见肉眼类型，混合性肝癌更不是最常见组织学类型，混合型由肝细胞癌和胆管细胞癌成分混合而成，较少见。\nE. 错误：弥漫型为全肝弥漫分布的小结节，较少见且易与肝硬化结节混淆；混合性肝癌亦少见，不能作为“均多见”。\n易混点：记忆时抓住“肉眼多结节、镜下肝细胞”。巨块型体积大但发生率不及多结节型；胆管细胞癌和混合性肝癌均属较少见组织学类型，不要因名称熟悉而误选。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-a-single-0032","type":"single","typeLabel":"单选题","number":32,"question":"伤寒带菌者细菌一般居留于","options":[{"key":"A","text":"结肠"},{"key":"B","text":"胆囊"},{"key":"C","text":"小肠"},{"key":"D","text":"肝脏"},{"key":"E","text":"直肠"}],"answerKeys":["B"],"answerText":["胆囊"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：伤寒慢性带菌者的细菌主要长期居留于胆囊，并可随胆汁排入肠道成为重要传染源。\n解析：伤寒由伤寒沙门菌经口感染，细菌侵入肠黏膜后发生菌血症，可累及肝、脾、骨髓及胆囊等器官。胆囊是伤寒沙门菌常见的长期居留部位，尤其慢性带菌者，细菌可在胆汁中存活繁殖，并随胆汁间歇排入肠腔，再随粪便排出体外。题眼在“带菌者”和“一般居留部位”，并非问伤寒急性期肠道病变的好发部位；急性期肠道病变主要位于回肠末段淋巴组织。胆囊带菌与胆结石、胆道慢性炎症等局部因素有关，是伤寒传播的重要环节。\n选项分析：\nA. 错误：结肠不是伤寒沙门菌慢性带菌的主要居留部位。伤寒急性期肠道病变好发于回肠末段，结肠一般不形成典型伤寒溃疡。\nB. 正确：胆囊是伤寒慢性带菌者最常见的细菌居留部位，细菌可在胆汁中长期存活并随胆汁排入肠道，符合题意。\nC. 错误：小肠尤其是回肠末段是伤寒急性期病变和溃疡的好发部位，但“带菌者长期居留部位”一般指胆囊，而不是小肠。\nD. 错误：肝脏在伤寒菌血症期可受累，形成伤寒小结等病变，但肝脏不是慢性带菌者细菌一般长期居留的主要部位。\nE. 错误：直肠不是伤寒带菌者的主要居留部位，也不属于伤寒典型肠道病变的好发部位。\n易混点：注意区分“伤寒急性期病变部位”和“伤寒带菌者居留部位”：前者主要累及回肠末段淋巴组织，后者主要居留于胆囊。记忆要点可概括为“伤寒病变在回肠，慢性带菌在胆囊”。","chapter":18,"chapterName":"传染病","chapterTitle":"第18章 传染病"},{"id":"pathology-a-single-0033","type":"single","typeLabel":"单选题","number":33,"question":"动脉性充血的主要病理变化是","options":[{"key":"A","text":"器官体积肿大"},{"key":"B","text":"器官重量增加"},{"key":"C","text":"局部呈红色"},{"key":"D","text":"小动脉和毛细血管扩张，充满红细胞"},{"key":"E","text":"局部温度升高"}],"answerKeys":["D"],"answerText":["小动脉和毛细血管扩张，充满红细胞"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：动脉性充血的本质是小动脉和毛细血管扩张、含红细胞增多，属于主动性充血。\n解析：动脉性充血又称主动性充血，因局部小动脉扩张、血流加快，使小动脉和毛细血管内充满红细胞，组织呈鲜红色。其后续可表现为局部温度升高、轻度肿胀、器官体积和重量轻度增加，但最基本、最具有定义意义的病理变化是血管扩张并充满红细胞。题眼在“主要病理变化”，应选血管和血液含量改变，而不是继发的体积、重量、颜色或温度表现。\n选项分析：\nA. 错误：器官体积肿大可见于充血、水肿、炎症等多种病变，是动脉性充血的继发表现之一，不是其最主要的病理变化。\nB. 错误：器官重量增加与体积肿大类似，缺乏特异性，可见于水肿、淤血、炎症渗出等，不能作为动脉性充血的主要病理依据。\nC. 错误：局部呈红色是动脉性充血的肉眼表现之一，因动脉血含氧血红蛋白增多而呈鲜红，但它是由小动脉和毛细血管扩张、充满红细胞所导致的结果。\nD. 正确：动脉性充血时小动脉和毛细血管扩张，血管内红细胞增多，这是其核心病理变化，也是局部红、热、胀等表现的形态学基础。\nE. 错误：局部温度升高是动脉性充血的临床局部表现，因血流加快、动脉血温度较高所致，但不是最基本的病理变化。\n易混点：动脉性充血与静脉性充血（淤血）要区分：前者为主动性充血，表现为红、热、轻度肿胀，核心是动脉及毛细血管扩张充血；后者为被动性充血，因静脉回流受阻，局部多紫蓝、温度降低、水肿明显，核心是静脉和毛细血管淤血。记忆要点：动脉充血“红热胀，动脉扩张”，静脉淤血“紫凉肿，静脉回流受阻”。","chapter":3,"chapterName":"局部血液循环障碍","chapterTitle":"第3章 局部血液循环障碍"},{"id":"pathology-a-single-0034","type":"single","typeLabel":"单选题","number":34,"question":"如图显示肿瘤的转移方式是","options":[{"key":"A","text":"淋巴道转移"},{"key":"B","text":"血道转移"},{"key":"C","text":"种植转移"},{"key":"D","text":"直接蔓延"},{"key":"E","text":"广泛转移"}],"answerKeys":["C"],"answerText":["种植转移"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：肿瘤种植性转移的概念及常见部位，即瘤细胞脱落后在体腔或器官表面种植生长。\n解析：种植转移是指肿瘤细胞从原发灶脱落，进入胸腹腔等体腔，或沿自然腔道到达其他部位，在浆膜面或器官表面种植并继续生长。常见于胃癌侵透胃浆膜后种植至腹膜、大网膜及卵巢，形成Krukenberg瘤；也可见于腹腔、盆腔直肠子宫陷凹等处的种植结节。题目提到图片但未提供，故仅依据文字和标准答案分析，不编造图像细节；本题题眼是“转移方式”按标准答案为种植转移。\n选项分析：\nA. 错误：淋巴道转移是癌细胞侵入淋巴管后随淋巴流至局部淋巴结，常见于癌，表现为淋巴结肿大、质硬，镜下可见淋巴结内转移癌巢；本题不是淋巴道转移。\nB. 错误：血道转移是瘤细胞侵入血管后随血流到达远处器官，常见于肉瘤，也可见于癌，常转移至肺、肝、骨、脑等，形成多发边界较清楚的转移结节；本题不是血道转移。\nC. 正确：种植转移的关键是瘤细胞脱落并种植于体腔或器官表面，如胃癌细胞种植于卵巢、腹膜等，符合本题标准答案。\nD. 错误：直接蔓延是肿瘤沿组织间隙、神经束或器官表面连续浸润生长，与原发灶保持连续性；种植转移是瘤细胞脱落后非连续性种植，二者不同。\nE. 错误：广泛转移是描述转移范围广泛的临床状态，不是病理学上规范的转移途径；不能替代种植转移这一方式。\n易混点：记忆“癌多经淋巴道，肉瘤多经血道”；但胃癌等可经种植转移至卵巢。直接蔓延强调“连续浸润”，种植转移强调“脱落—体腔—种植”，本题应抓“体腔/浆膜面种植”这一题眼。","chapter":6,"chapterName":"肿瘤","chapterTitle":"第6章 肿瘤","needsImage":true},{"id":"pathology-a-single-0035","type":"single","typeLabel":"单选题","number":35,"question":"最常引起卵巢Krukenberg瘤的为","options":[{"key":"A","text":"宫颈癌"},{"key":"B","text":"乳腺癌"},{"key":"C","text":"胃癌"},{"key":"D","text":"肺癌"},{"key":"E","text":"肝癌"}],"answerKeys":["C"],"answerText":["胃癌"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：卵巢Krukenberg瘤的常见原发灶及转移机制。\n解析：Krukenberg瘤又称卵巢印戒细胞癌或卵巢黏液细胞癌，属于转移性肿瘤，最常见原发灶是胃癌。胃癌细胞可经淋巴道、血行或腹膜种植转移至卵巢，常累及双侧卵巢，镜下见富含黏液并含印戒细胞，间质可伴纤维组织增生。本题题眼是“最常引起卵巢Krukenberg瘤”，应直接联系胃印戒细胞癌的卵巢转移。\n选项分析：\nA. 错误：宫颈癌可直接蔓延或经淋巴道转移至卵巢，但并非Krukenberg瘤最常见来源；其典型表现为宫颈肿物及盆腔浸润。\nB. 错误：乳腺癌可经血行或淋巴道转移至卵巢，但Krukenberg瘤仍以胃肠道来源最常见，尤其胃癌；乳腺癌卵巢转移不作为首选答案。\nC. 正确：胃癌是卵巢Krukenberg瘤最常见原发灶，尤其胃印戒细胞癌，转移至卵巢后形成双侧、富含黏液和印戒细胞的转移性黏液癌。\nD. 错误：肺癌可经血行转移至卵巢，但发生率低，且不属于Krukenberg瘤的典型常见来源；肺癌卵巢转移常为其他组织学类型。\nE. 错误：肝癌转移至卵巢较少见，通常经血行或腹膜种植，不能解释“最常引起Krukenberg瘤”的原发肿瘤。\n易混点：Krukenberg瘤不是卵巢原发癌，而是转移性癌，关键记忆点为“胃印戒细胞癌→双侧卵巢→含黏液印戒细胞”。乳腺癌、宫颈癌等虽可转移至卵巢，但典型Krukenberg瘤首先想到胃癌。","chapter":14,"chapterName":"生殖系统和乳腺疾病","chapterTitle":"第14章 生殖系统和乳腺疾病"},{"id":"pathology-a-single-0036","type":"single","typeLabel":"单选题","number":36,"question":"既有肝细胞的大片坏死，又有肝细胞的结节状再生，是哪种肝炎","options":[{"key":"A","text":"慢性轻度肝炎"},{"key":"B","text":"急性重型肝炎"},{"key":"C","text":"亚急性重型肝炎"},{"key":"D","text":"急性普通型肝炎"},{"key":"E","text":"慢性中度肝炎"}],"answerKeys":["C"],"answerText":["亚急性重型肝炎"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：亚急性重型肝炎的病理学特征是肝细胞大片坏死与结节状再生并存。\n解析：亚急性重型肝炎（亚急性肝坏死）病程较长，肝细胞发生大片坏死的同时，残存肝细胞可明显再生并形成不规则结节，同时伴有纤维组织增生，故镜下可见“坏死—再生—纤维化”三者并存。由于坏死范围大、再生结节不规则，肝内结构破坏明显，后期易发展为坏死后性肝硬化。本题题眼是“大片坏死”与“结节状再生”同时出现，这是亚急性重型肝炎区别于急性重型肝炎和普通型肝炎的关键。\n选项分析：\nA. 错误：慢性轻度肝炎以汇管区炎症和肝细胞点状、灶状坏死为主，无大片坏死，也无明显结节状再生，病情轻，一般不形成明显纤维间隔。\nB. 错误：急性重型肝炎虽有肝细胞大片、大块坏死，但病程短、坏死广泛，肝细胞再生不明显，肝脏体积显著缩小，临床多表现为急性肝衰竭，并非以结节状再生为特点。\nC. 正确：亚急性重型肝炎兼具肝细胞大片坏死和肝细胞结节状再生，并伴纤维组织增生，可形成坏死后性肝硬化，符合题干两项特征。\nD. 错误：急性普通型肝炎以肝细胞广泛气球样变（水肿）和点状坏死为主，坏死轻微且局限，无大片坏死和结节状再生，多数可完全恢复。\nE. 错误：慢性中度肝炎主要见碎片状坏死和桥接坏死，伴纤维间隔形成，但尚未达到大片坏死并出现结节状再生的程度，属于慢性肝炎活动期表现。\n易混点：急性重型肝炎与亚急性重型肝炎最易混淆。记忆要点：急性重型为“大片坏死、再生不明显、肝明显缩小”；亚急性重型为“大片坏死＋结节状再生＋纤维增生”，可过渡为坏死后性肝硬化。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-a-single-0037","type":"single","typeLabel":"单选题","number":37,"question":"如图所示，诊断为","options":[{"key":"A","text":"脑的卡他性炎"},{"key":"B","text":"脑的纤维素性炎"},{"key":"C","text":"脑的浆液性炎"},{"key":"D","text":"脑表面化脓与积脓"},{"key":"E","text":"脑脓肿"}],"answerKeys":["D"],"answerText":["脑表面化脓与积脓"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：化脓性炎按发生部位可分为表面化脓与积脓、脓肿等，积脓位于体腔或腔隙，脓肿位于组织内。\n解析：脑表面化脓与积脓属于化脓性炎，病变累及脑表面（如软脑膜、蛛网膜下腔等腔隙），以大量中性粒细胞渗出、脓性渗出物积聚为特征，肉眼可见脑表面脓性渗出物或脓液积聚。本题题眼是“脑表面”和“积脓”，强调脓性病变位于脑表面腔隙而非脑实质内形成局限性脓腔。题目图片未提供，依据文字信息和标准答案分析。\n选项分析：\nA. 错误：卡他性炎是黏膜的浅表渗出性炎，以黏液分泌增多和浆液渗出为主，多见于呼吸道、消化道黏膜；脑表面无黏膜结构，不符合卡他性炎。\nB. 错误：纤维素性炎以纤维蛋白渗出为主，典型见于黏膜假膜性炎、浆膜纤维素性炎（如绒毛心）；虽脑膜炎症可有纤维素渗出，但本题标准诊断为化脓并积脓，不是以纤维素性渗出为主。\nC. 错误：浆液性炎以浆液渗出为主，渗出液清亮、细胞成分少，常见于水疱、浆膜腔积液和脑水肿等；不能解释脓性渗出和积脓。\nD. 正确：脑表面化脓与积脓为化脓性炎累及脑表面腔隙，大量中性粒细胞及脓性渗出物积聚，符合“表面化脓与积脓”的病理诊断。\nE. 错误：脑脓肿是脑实质内局限性化脓性炎，中心为脓腔，周围可有坏死层、炎性肉芽组织和纤维包膜；本题强调病变在脑表面并积脓，不是脑实质内脓肿。\n易混点：积脓是脓液积聚于体腔或腔隙，脓肿是脓液局限积聚于组织内；脑表面化脓性病变类似脑膜炎，脑脓肿则位于脑实质。记忆要点：看部位——表面/腔隙为积脓，实质内脓腔为脓肿。","chapter":4,"chapterName":"炎症","chapterTitle":"第4章 炎症","needsImage":true},{"id":"pathology-a-single-0038","type":"single","typeLabel":"单选题","number":38,"question":"流行性乙型脑炎最具特征性的病变是","options":[{"key":"A","text":"噬神经细胞现象"},{"key":"B","text":"卫星现象"},{"key":"C","text":"筛网状软化灶"},{"key":"D","text":"淋巴细胞袖口状浸润"},{"key":"E","text":"胶质结节"}],"answerKeys":["C"],"answerText":["筛网状软化灶"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：流行性乙型脑炎最具特征性的病理改变是神经组织局灶性坏死、液化形成的筛网状软化灶。\n解析：流行性乙型脑炎由乙型脑炎病毒感染引起，病变主要累及大脑皮质、基底核、丘脑及脑干等灰质区域。基本病变包括血管充血水肿、淋巴细胞袖口状浸润、神经细胞变性坏死、噬神经细胞现象、卫星现象及胶质结节等，但这些多为病毒性脑炎的共同表现。最具特征性的是筛网状软化灶，即局部神经组织坏死液化，形成疏松、筛孔状病灶，是本题题眼。\n选项分析：\nA. 错误：噬神经细胞现象指小胶质细胞吞噬变性坏死的神经元，可见于乙脑，也可见于其他病毒性脑炎、缺血缺氧性脑病等，缺乏特异性。\nB. 错误：卫星现象指少突胶质细胞围绕变性神经元，常见于乙脑等病毒性脑炎，但属于非特异性神经元损伤反应。\nC. 正确：筛网状软化灶由局灶性神经组织坏死、液化形成，呈疏松筛网状，是流行性乙型脑炎最具特征性的病变。\nD. 错误：淋巴细胞袖口状浸润指血管周围淋巴细胞聚集，是病毒性脑炎常见的炎症反应，并非乙脑最具特征性改变。\nE. 错误：胶质结节由小胶质细胞增生聚集形成，可见于多种病毒性脑炎，不能作为乙脑的特征性诊断依据。\n易混点：乙脑的筛网状软化灶要与脑梗死液化性坏死软化灶区分，前者位于灰质并伴病毒性脑炎炎症背景；噬神经细胞现象、卫星现象和胶质结节虽常考，但均是病毒性脑炎的共同表现，不是乙脑“最具特征性”的病变。","chapter":16,"chapterName":"神经系统疾病","chapterTitle":"第16章 神经系统疾病"},{"id":"pathology-a-single-0039","type":"single","typeLabel":"单选题","number":39,"question":"下面疾病中，低度恶性的肿瘤是","options":[{"key":"A","text":"鳞状细胞癌"},{"key":"B","text":"鳞状细胞乳头状瘤"},{"key":"C","text":"疣状癌"},{"key":"D","text":"牙龈瘤"},{"key":"E","text":"黏膜白斑"}],"answerKeys":["C"],"answerText":["疣状癌"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：疣状癌是鳞状细胞癌的高分化、低度恶性变异型，局部呈推进式浸润而转移少。\n解析：疣状癌好发于口腔、喉、外阴等黏膜部位，肉眼呈外生性疣状或乳头状肿块，镜下鳞状上皮高度分化、细胞异型性轻，基底部呈宽钝的推进式浸润，故归为低度恶性肿瘤。题眼是“低度恶性”，应与普通鳞状细胞癌、良性乳头状瘤及癌前病变区分。\n选项分析：\nA. 错误：鳞状细胞癌是来源于鳞状上皮的恶性肿瘤，具有浸润和转移能力，虽可分级，但普通鳞癌不属于“低度恶性肿瘤”这一特定病变。\nB. 错误：鳞状细胞乳头状瘤是良性上皮性肿瘤，呈外生性乳头状生长，有纤维血管轴心，被覆分化良好的鳞状上皮，不发生浸润转移。\nC. 正确：疣状癌为高分化鳞癌的特殊低度恶性类型，呈疣状外生性生长，基底推进式局部浸润，细胞异型轻，淋巴结转移少见。\nD. 错误：牙龈瘤并非真性肿瘤，多为局部刺激或激素相关的反应性、炎性增生，易复发但无恶性生物学行为。\nE. 错误：黏膜白斑是临床诊断，指不能擦去的白色斑块，组织学可伴上皮增生和非典型增生，属于癌前病变，不是低度恶性肿瘤。\n易混点：疣状癌要与高分化鳞癌、鳞状细胞乳头状瘤鉴别：前者低度恶性并有基底推进式浸润，乳头状瘤为良性无浸润，普通高分化鳞癌仍有明显浸润转移潜能。黏膜白斑是癌前病变，牙龈瘤不是肿瘤。","chapter":6,"chapterName":"肿瘤","chapterTitle":"第6章 肿瘤"},{"id":"pathology-a-single-0040","type":"single","typeLabel":"单选题","number":40,"question":"良性高血压最具特征性的动脉病变是","options":[{"key":"A","text":"细动脉的玻璃样变"},{"key":"B","text":"细动脉的纤维素样坏死"},{"key":"C","text":"细小动脉内膜炎"},{"key":"D","text":"动脉粥样硬化"},{"key":"E","text":"动脉中层钙化"}],"answerKeys":["A"],"answerText":["细动脉的玻璃样变"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：A\n核心考点：良性高血压最具特征性的血管病变是细动脉玻璃样变（细动脉硬化）。\n解析：良性高血压长期作用下，细动脉内皮受损，血浆蛋白渗入管壁，并伴平滑肌细胞合成细胞外基质增多，使管壁出现均质红染、无结构的玻璃样物质沉积，导致管壁增厚、管腔狭窄。该病变最常累及肾入球小动脉、视网膜动脉和脾中央动脉等，是良性高血压的特征性形态学改变。本题题眼在“良性高血压”和“最具特征性”，应选细动脉玻璃样变。\n选项分析：\nA. 正确：细动脉玻璃样变即细动脉硬化，是良性高血压最基本的特征性动脉病变，表现为细动脉壁均质红染增厚、管腔狭窄。\nB. 错误：细动脉纤维素样坏死是恶性高血压的特征性病变，提示血管壁坏死、通透性增高，常伴视网膜出血、渗出和肾损害，不是良性高血压最具特征性的改变。\nC. 错误：细小动脉内膜炎主要提示感染、免疫炎症或局部血栓性血管炎等过程，并非良性高血压的特征性病变；良性高血压主要表现为细动脉壁玻璃样变，而非以炎症性内膜炎为主。\nD. 错误：动脉粥样硬化是累及大中动脉的病变，高血压可促进其发生，但它不是良性高血压最具特征性的细动脉病变，也不能替代细动脉玻璃样变这一答案。\nE. 错误：动脉中层钙化主要累及肌型动脉中膜，常见于老年退行性变、糖尿病等，表现为中膜钙盐沉积，并非良性高血压的特征性病变。\n易混点：良性高血压记“细动脉玻璃样变”，恶性高血压记“细动脉纤维素样坏死及增生性小动脉硬化（洋葱皮样）”。同时注意高血压可并发动脉粥样硬化，但题目问的是良性高血压本身最具特征性的动脉病变，应选细动脉玻璃样变。","chapter":9,"chapterName":"心血管系统疾病","chapterTitle":"第9章 心血管系统疾病"},{"id":"pathology-a-single-0041","type":"single","typeLabel":"单选题","number":41,"question":"槟榔肝可发展为","options":[{"key":"A","text":"坏死后肝硬化"},{"key":"B","text":"门脉性肝硬化"},{"key":"C","text":"淤血性肝硬化"},{"key":"D","text":"胆汁性肝硬化"},{"key":"E","text":"寄生虫性肝硬化"}],"answerKeys":["C"],"answerText":["淤血性肝硬化"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：慢性肝淤血（槟榔肝）长期反复可致淤血性肝硬化，又称心源性肝硬化。\n解析：槟榔肝是慢性肝淤血的典型表现，切面呈红黄相间：红色为中央静脉及肝窦淤血区，黄色为中央区周围肝细胞脂肪变。长期淤血、缺氧可刺激中央静脉周围及汇管区纤维组织增生，纤维间隔相互连接，最终形成淤血性肝硬化。本题题眼是“槟榔肝”所代表的慢性肝淤血，其直接结局是淤血性肝硬化。\n选项分析：\nA. 错误：坏死后肝硬化多由亚急性重型肝炎、药物或毒物所致广泛肝细胞坏死引起，常呈大结节性，与单纯慢性肝淤血无直接对应关系。\nB. 错误：门脉性肝硬化常见于病毒性肝炎、酒精中毒等，典型为小结节性肝硬化；槟榔肝虽可有门脉高压，但其直接病因学结局应称淤血性肝硬化。\nC. 正确：慢性肝淤血导致中央静脉周围纤维化，进而形成淤血性（心源性）肝硬化，是槟榔肝的进展结局。\nD. 错误：胆汁性肝硬化由长期胆道梗阻或自身免疫性胆管病变引起，突出胆汁淤积、汇管区纤维化，与槟榔肝的淤血机制不同。\nE. 错误：寄生虫性肝硬化如血吸虫病性肝硬化，由虫卵沉积于门管区引起纤维化，与慢性肝淤血无关。\n易混点：槟榔肝的核心是慢性肝淤血，进展为淤血性肝硬化；门脉性肝硬化强调病毒、酒精等病因及小结节改变。记忆要点：槟榔肝红黄相间——红为淤血、黄为脂肪变；长期淤血最终成“心源性/淤血性肝硬化”。","chapter":3,"chapterName":"局部血液循环障碍","chapterTitle":"第3章 局部血液循环障碍"},{"id":"pathology-a-single-0042","type":"single","typeLabel":"单选题","number":42,"question":"诊断肺心病主要诊断标准是","options":[{"key":"A","text":"肺动脉下2cm处，右室壁厚大于5mm"},{"key":"B","text":"肺动脉圆锥膨隆"},{"key":"C","text":"右心室扩张"},{"key":"D","text":"心脏增大"},{"key":"E","text":"心尖钝圆"}],"answerKeys":["A"],"answerText":["肺动脉下2cm处，右室壁厚大于5mm"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：A\n核心考点：肺心病的病理诊断主要依据右心室壁肥厚，尤其肺动脉瓣下2cm处右心室壁厚度大于5mm。\n解析：肺源性心脏病由慢性肺疾病、肺血管疾病等引起肺动脉高压，进而导致右心室负荷增加和右心室肥大。病理诊断的关键是右心室壁增厚，常以肺动脉瓣下2cm处右心室前壁厚度大于5mm作为右心室肥厚的客观指标，因此A为主要诊断标准。肺心病可见肺动脉圆锥膨隆、右心室扩张、心脏增大及心尖钝圆等，但这些多为继发形态改变或影像学表现，特异性和诊断权重不如右心室壁厚度。本题题眼是“主要诊断标准”，应选能直接反映右心室肥厚的指标。\n选项分析：\nA. 正确：肺动脉瓣下2cm处右心室壁厚度大于5mm是判断右心室肥厚的重要病理标准，直接支持肺心病诊断。\nB. 错误：肺动脉圆锥膨隆可见于肺心病，提示右心室流出道增厚或扩张，但并非主要诊断标准，也可见于其他右心负荷增加情况。\nC. 错误：右心室扩张是肺心病失代偿期或较晚期表现，不能作为主要诊断依据；肺心病早期诊断更强调右心室肥厚。\nD. 错误：心脏增大原因很多，如高血压性心脏病、心肌病、瓣膜病等，缺乏病因和部位特异性，不能作为肺心病主要标准。\nE. 错误：心尖钝圆常由右心室增大、心脏顺时针转位等引起，是体征或影像表现，特异性不足。\n易混点：肺心病诊断要抓住“右心室肥厚”，而不是单纯“右心扩张”或“心脏增大”；记忆要点为肺动脉瓣下2cm处右室壁厚度大于5mm。肺动脉圆锥膨隆、心尖钝圆等属于支持性形态表现，不能替代主要标准。","chapter":10,"chapterName":"呼吸系统疾病","chapterTitle":"第10章 呼吸系统疾病"},{"id":"pathology-a-single-0043","type":"single","typeLabel":"单选题","number":43,"question":"细胞在生长过程中，如果互相接触，则生长停止，这种现象叫","options":[{"key":"A","text":"再生性增生"},{"key":"B","text":"生长的接触抑制"},{"key":"C","text":"修复"},{"key":"D","text":"完全再生"},{"key":"E","text":"二期愈合"}],"answerKeys":["B"],"answerText":["生长的接触抑制"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：正常细胞在生长过程中相互接触后停止增殖的现象称为接触抑制，是细胞增殖调控的重要表现。\n解析：接触抑制是正常细胞在体外培养或组织生长中，当细胞相互接触、形成单层融合时，增殖活动受到抑制而停止继续生长的现象，体现正常细胞对增殖的接触依赖性调控。该现象依赖细胞间接触信号，正常上皮细胞等表现明显；肿瘤细胞常失去接触抑制，可重叠生长并持续增殖。本题题眼是“互相接触则生长停止”，直接指向接触抑制。\n选项分析：\nA. 错误：再生性增生指组织损伤后由同种实质细胞增生以修复缺损，如肝细胞、上皮细胞增生，强调的是损伤后的代偿性增殖，不是细胞接触后停止生长的调控现象。\nB. 正确：细胞互相接触后生长停止，正是接触抑制的定义，属于正常细胞增殖调控机制；若该机制丧失，常与肿瘤性增生有关。\nC. 错误：修复是组织损伤后通过再生和/或纤维性修复恢复组织结构和功能的总过程，包含多种机制，不能等同于接触抑制这一细胞增殖调控现象。\nD. 错误：完全再生指损伤组织由邻近同种细胞再生修复，最终恢复原有结构和功能，如轻度表皮损伤修复；其描述的是修复结果和方式，不是细胞接触后停止生长。\nE. 错误：二期愈合指创口较大、伴感染或坏死较多时，先清除坏死组织再由肉芽组织填充并形成瘢痕的愈合方式，属于创伤愈合类型，与接触抑制概念无关。\n易混点：接触抑制是正常细胞增殖受接触调控的现象，丧失后提示肿瘤性生长；再生性增生强调损伤后同种细胞增生，完全再生强调恢复原结构与功能。记忆要点：接触即停为接触抑制，损伤后长回为再生，长不回而留疤为纤维性修复。","chapter":2,"chapterName":"损伤的修复","chapterTitle":"第2章 损伤的修复"},{"id":"pathology-a-single-0044","type":"single","typeLabel":"单选题","number":44,"question":"新生的毛细血管、成纤维细胞长入血肿内的过程为","options":[{"key":"A","text":"化生"},{"key":"B","text":"栓塞"},{"key":"C","text":"机化"},{"key":"D","text":"再通"},{"key":"E","text":"血栓形成"}],"answerKeys":["C"],"answerText":["机化"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：机化是指坏死组织、血栓、血肿或异物等被新生肉芽组织长入、取代或包裹的过程。\n解析：新生的毛细血管和成纤维细胞构成肉芽组织，肉芽组织长入血肿内并逐渐取代血肿，正是机化的典型表现。题眼是“新生毛细血管、成纤维细胞长入血肿内”，即肉芽组织长入并处理血肿，故为机化。机化可使血肿、血栓或坏死灶最终形成纤维瘢痕，也可能引起局部粘连等后果。\n选项分析：\nA. 错误：化生是指一种分化成熟的组织转化为另一种分化成熟组织，如支气管柱状上皮发生鳞状上皮化生；本题不是组织类型转化，而是肉芽组织长入血肿。\nB. 错误：栓塞是指循环血液中的异常物质随血流运行并阻塞血管腔的过程，如血栓栓塞、脂肪栓塞；与血肿内肉芽组织长入无关。\nC. 正确：机化由新生毛细血管、成纤维细胞及炎细胞等构成的肉芽组织长入坏死组织、血栓、血肿或异物，并逐渐将其取代或包裹，符合题干描述。\nD. 错误：再通是血栓机化过程中血栓内部形成裂隙，内皮细胞覆盖后使血流重新沟通，属于血栓机化后的继发改变；本题对象是血肿，且描述的是肉芽组织长入。\nE. 错误：血栓形成是活体心血管内血液发生凝固或血液成分凝集形成固体质块的过程；本题血肿已存在，重点是血肿被肉芽组织处理，而非形成血栓。\n易混点：机化强调肉芽组织长入并取代或包裹病变物质；再通强调血栓机化后内部裂隙重建血流。记忆要点：血肿、血栓、坏死灶被肉芽组织“长进去”就是机化；血栓内“重新通血”才是再通。","chapter":3,"chapterName":"局部血液循环障碍","chapterTitle":"第3章 局部血液循环障碍"},{"id":"pathology-a-single-0045","type":"single","typeLabel":"单选题","number":45,"question":"下列哪项不属于细胞异型性","options":[{"key":"A","text":"核数目不一"},{"key":"B","text":"核肿胀，核膜不清"},{"key":"C","text":"核染色质分布不均"},{"key":"D","text":"核大小不等，核畸形"},{"key":"E","text":"病理性核分裂象"}],"answerKeys":["B"],"answerText":["核肿胀，核膜不清"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：细胞异型性是肿瘤细胞在形态、结构和功能上偏离正常的分化表现，重点看细胞核的改变。\n解析：肿瘤细胞异型性常表现为细胞大小形态不一、核大深染、核质比增高、核大小不等和核畸形、核染色质粗糙且分布不均、核仁明显、核分裂象增多并出现病理性核分裂象。B项“核肿胀，核膜不清”更符合细胞损伤、变性或坏死时的核改变，不是肿瘤细胞异型性的典型表现。本题题眼是区分“肿瘤性核异型”与“损伤性核改变”。\n\n选项分析：\nA. 正确：核数目不一可见于多核瘤巨细胞等，属于肿瘤细胞异型性的表现。\nB. 错误：核肿胀、核膜不清属于细胞损伤/坏死相关改变，不能作为细胞异型性的典型依据。\nC. 正确：核染色质分布不均是恶性肿瘤细胞核异型性的常见表现，常伴核深染。\nD. 正确：核大小不等、核畸形是细胞异型性最常考的表现之一。\nE. 正确：病理性核分裂象提示恶性肿瘤性增生，是重要异型性标志。\n\n易混点：细胞异型性主要强调肿瘤细胞核的“大、深、怪、不均、病理性核分裂”；细胞水肿、坏死等损伤性改变可出现核肿胀、核膜不清、核溶解等，不要与肿瘤性异型性混淆。记忆要点：异型性看核，损伤看变性坏死。","chapter":6,"chapterName":"肿瘤","chapterTitle":"第6章 肿瘤"},{"id":"pathology-a-single-0046","type":"single","typeLabel":"单选题","number":46,"question":"下列关于栓塞的叙述，哪项是正确的","options":[{"key":"A","text":"进入血液的癌细胞均可形成栓塞"},{"key":"B","text":"脂肪栓塞均由创伤引起"},{"key":"C","text":"羊水栓塞不会引起死亡"},{"key":"D","text":"肺动脉血栓栓塞的栓子多来自于下肢深静脉"},{"key":"E","text":"减压病是氧气栓塞"}],"answerKeys":["D"],"answerText":["肺动脉血栓栓塞的栓子多来自于下肢深静脉"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：肺动脉血栓栓塞的栓子来源，以下肢深静脉血栓脱落最常见。\n解析：肺动脉血栓栓塞是血栓栓塞最常见的类型，其栓子约95%来自下肢深静脉，尤其是股静脉、腘静脉和髂静脉。深静脉血栓形成后，血栓可部分或全部脱落，随静脉血流经右心进入肺动脉，造成肺动脉分支阻塞。题眼是“肺动脉血栓栓塞”的栓子多来自“下肢深静脉”，这是考试常考来源规律。\n选项分析：\nA. 错误：进入血液的癌细胞并非均可形成栓塞。癌细胞入血后多数可被机体免疫及血流机械作用破坏，只有存活并形成癌栓者才可能引起栓塞；且栓塞形成不等于一定发生转移。\nB. 错误：脂肪栓塞最常见于长骨骨折等创伤，但并非均由创伤引起。非创伤因素如脂肪肝、骨髓破坏、烧伤及脂质代谢紊乱等也可引起脂肪栓塞。\nC. 错误：羊水栓塞是产科严重急症，羊水成分进入母体血液循环可引起过敏性休克、弥散性血管内凝血和肺血管机械性阻塞，病死率高，可引起猝死。\nD. 正确：肺动脉血栓栓塞的栓子绝大多数来自下肢深静脉，尤其是股静脉、腘静脉和髂静脉，属于静脉血栓脱落后随血流进入右心和肺动脉所致。\nE. 错误：减压病属于气体栓塞，是溶解于血液和组织中的氮气在减压时迅速逸出形成气泡所致，不是氧气栓塞。\n易混点：肺动脉栓塞以血栓栓塞最常见，栓子主要来自下肢深静脉；体循环动脉栓塞栓子多来自左心或主动脉粥样硬化斑块。脂肪栓塞常见于长骨骨折，减压病为氮气栓塞，羊水栓塞可致死，三者不要混淆。","chapter":3,"chapterName":"局部血液循环障碍","chapterTitle":"第3章 局部血液循环障碍"},{"id":"pathology-a-single-0047","type":"single","typeLabel":"单选题","number":47,"question":"下列与肝硬化形成最为密切的是","options":[{"key":"A","text":"急性重型肝炎"},{"key":"B","text":"轻度慢性肝炎"},{"key":"C","text":"重度慢性肝炎"},{"key":"D","text":"急性普通型肝炎"},{"key":"E","text":"急性甲型肝炎"}],"answerKeys":["C"],"answerText":["重度慢性肝炎"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：肝硬化是反复肝细胞损伤、坏死、纤维组织增生和肝细胞结节状再生，最终形成假小叶的弥漫性慢性肝病；慢性病毒性肝炎（尤其重度慢性肝炎）是最重要的前驱病变。\n\n解析：重度慢性肝炎时肝细胞坏死范围较广，常见桥接坏死、融合坏死，并伴明显纤维化及纤维间隔形成，肝小叶结构反复破坏和改建，最易进展为肝硬化。其题眼是“与肝硬化形成最为密切”，应选能长期反复造成肝细胞坏死和纤维化的慢性肝炎类型。我国肝硬化常见病因是慢性乙型、丙型病毒性肝炎，病理上以假小叶形成为标志。\n\n选项分析：\nA. 错误：急性重型肝炎表现为大片状肝细胞坏死，临床多急骤进展为急性肝衰竭，主要危险是肝性脑病、出血等，并非以缓慢反复纤维化形成肝硬化为主。\nB. 错误：轻度慢性肝炎病变较轻，坏死和纤维化程度有限，经治疗多可稳定或恢复，进展为肝硬化的危险性明显低于重度慢性肝炎。\nC. 正确：重度慢性肝炎有明显肝细胞坏死、桥接坏死和纤维化，肝小叶结构反复受损，最易发展为肝硬化。\nD. 错误：急性普通型肝炎以肝细胞广泛变性、点状坏死为主，病程自限，通常不发展为肝硬化。\nE. 错误：急性甲型肝炎主要经消化道传播，多为自限性急性肝炎，一般不转为慢性，也不以肝硬化形成为主要后果。\n\n易混点：急性重型肝炎强调“大片状坏死、急性肝衰竭”，重度慢性肝炎强调“桥接坏死、纤维化、反复改建”，后者才是肝硬化最密切的前驱病变。记忆要点：肝硬化看“慢性、反复坏死、纤维化、假小叶”；甲型肝炎不慢性化。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-a-single-0048","type":"single","typeLabel":"单选题","number":48,"question":"肝硬化晚期腹水的形成原因中，哪项是错误的","options":[{"key":"A","text":"肝细胞合成凝血酶原减少"},{"key":"B","text":"肝淋巴液外溢"},{"key":"C","text":"肝细胞合成蛋白功能低下"},{"key":"D","text":"抗利尿激素、醛固酮在血内水平增高"},{"key":"E","text":"门静脉高压"}],"answerKeys":["A"],"answerText":["肝细胞合成凝血酶原减少"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：A\n核心考点：肝硬化晚期腹水形成的机制包括门静脉高压、低白蛋白血症、肝淋巴液外溢及水钠潴留，凝血因子减少不是腹水形成的直接原因。\n解析：肝硬化晚期腹水形成主要与门静脉高压使毛细血管静水压升高、肝细胞合成白蛋白减少使血浆胶体渗透压降低、肝淋巴液生成增多并外溢，以及有效循环血量减少激活肾素-血管紧张素-醛固酮系统，使抗利尿激素和醛固酮水平增高、水钠潴留有关。凝血酶原属于凝血因子，其合成减少反映肝细胞蛋白合成功能受损，但主要导致凝血障碍，并非腹水形成的直接机制。本题题眼是“晚期腹水形成原因”，应区分低白蛋白血症与凝血因子减少的不同后果。\n选项分析：\nA. 正确：肝细胞合成凝血酶原减少主要引起凝血酶原时间延长和出血倾向，不是腹水形成的直接原因，故为本题错误项。\nB. 错误：肝硬化时肝内血流受阻、肝淋巴液生成增多，可自肝表面外溢进入腹腔，是腹水形成机制之一。\nC. 错误：肝细胞合成蛋白功能低下导致白蛋白减少，血浆胶体渗透压下降，液体外渗形成腹水，是重要原因。\nD. 错误：肝硬化晚期有效循环血量减少可激活RAAS，抗利尿激素和醛固酮水平增高，促进水钠潴留，加重腹水。\nE. 错误：门静脉高压使门静脉系统毛细血管静水压升高，液体漏入腹腔，是腹水形成的重要机制。\n易混点：低白蛋白血症是“蛋白合成功能低下”中与腹水直接相关的部分；凝血酶原减少属于凝血因子合成障碍，主要表现为出血，不用于解释腹水。记忆要点：腹水机制记“门脉高压、低白蛋白、淋巴外溢、水钠潴留”。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-a-single-0049","type":"single","typeLabel":"单选题","number":49,"question":"恶性高血压病病变特点是","options":[{"key":"A","text":"细动脉壁发生纤维素样坏死"},{"key":"B","text":"细动脉壁发生炎症性改变"},{"key":"C","text":"细动脉壁发生黏液变性"},{"key":"D","text":"细动脉壁发生玻璃样变"},{"key":"E","text":"细动脉壁发生痉挛"}],"answerKeys":["A"],"answerText":["细动脉壁发生纤维素样坏死"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：A\n核心考点：恶性高血压的特征性细动脉病变是纤维素样坏死。\n解析：恶性高血压又称急进型高血压，血压急剧升高，导致细动脉壁内皮损伤、血浆蛋白渗入并纤维素沉积，管壁发生纤维素样坏死。镜下见细动脉壁呈均质红染、无结构，可伴坏死性细动脉炎、血栓形成及洋葱皮样增生，肾脏入球小动脉最常受累，临床可出现血尿、蛋白尿及肾功能急剧恶化。本题题眼是“恶性高血压”，应与良性高血压的细动脉玻璃样变严格区分。\n选项分析：\nA. 正确：恶性高血压时细动脉壁发生纤维素样坏死，是急进型高血压的特征性形态学改变，常见于肾入球小动脉等部位。\nB. 错误：细动脉壁的主要病变不是一般炎症性改变；虽然坏死性细动脉炎可伴炎细胞反应，但其本质和题眼是纤维素样坏死，不能以“炎症性改变”概括。\nC. 错误：黏液变性多指结缔组织基质黏液样变性，见于风湿病、甲状腺功能减退等，不是恶性高血压细动脉的特征性病变。\nD. 错误：细动脉壁玻璃样变是良性高血压的典型病变，由于血浆蛋白渗入和基底膜样物质沉积形成均质红染物质，不是恶性高血压的特点。\nE. 错误：细动脉痉挛可见于高血压早期或血压波动时，属于功能性改变，不是恶性高血压的特征性形态学病变。\n易混点：良性高血压细动脉玻璃样变，恶性高血压细动脉纤维素样坏死；恶性高血压还可见增生性小动脉硬化和洋葱皮样改变。记忆要点：“良性玻璃样，恶性纤维素样坏死”。","chapter":9,"chapterName":"心血管系统疾病","chapterTitle":"第9章 心血管系统疾病"},{"id":"pathology-a-single-0050","type":"single","typeLabel":"单选题","number":50,"question":"微小病变病电镜下特征性病变是","options":[{"key":"A","text":"肾小球系膜内见致密沉积物"},{"key":"B","text":"系膜细胞增生"},{"key":"C","text":"肾小球毛细血管壁增厚"},{"key":"D","text":"脏层上皮细胞足突广泛消失"},{"key":"E","text":"肾小球毛细血管基膜上皮细胞侧见致密沉积物"}],"answerKeys":["D"],"answerText":["脏层上皮细胞足突广泛消失"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n\n核心考点：微小病变病的特征性电镜改变是脏层上皮细胞（足细胞）足突广泛融合、消失。\n\n解析：微小病变病是儿童肾病综合征最常见的病理类型，光镜下肾小球基本正常，免疫荧光多为阴性，电镜下最具诊断意义的是脏层上皮细胞足突广泛消失，而肾小球基膜及系膜区一般无电子致密沉积物。其发病与足细胞损伤、肾小球滤过屏障电荷屏障破坏有关，临床表现为大量蛋白尿、低蛋白血症、水肿和高脂血症，且对糖皮质激素敏感。本题题眼是“微小病变病”和“电镜下特征性病变”，应选足突广泛消失。\n\n选项分析：\nA. 错误：肾小球系膜内见致密沉积物常见于IgA肾病、系膜增生性肾小球肾炎等，属于免疫复合物沉积，不是微小病变病的特征。\nB. 错误：系膜细胞增生常见于系膜增生性肾小球肾炎、IgA肾病等，微小病变病光镜下系膜细胞通常不增生。\nC. 错误：肾小球毛细血管壁增厚常见于膜性肾病、糖尿病肾病等，微小病变病毛细血管壁无明显增厚。\nD. 正确：微小病变病电镜下可见脏层上皮细胞足突广泛融合、消失，基膜和系膜区无明确致密沉积物，是本题标准答案。\nE. 错误：肾小球毛细血管基膜上皮细胞侧见致密沉积物即上皮下沉积，常见于膜性肾病，也可见于感染后肾小球肾炎的“驼峰状”沉积，不是微小病变病。\n\n易混点：微小病变病与膜性肾病均可表现为肾病综合征，但微小病变病以足突广泛消失、免疫荧光阴性为特点；膜性肾病则以基膜增厚、上皮下免疫复合物沉积为特点。记忆要点：微小病变病“光镜正常、免疫荧光阴性、电镜足突消失”。","chapter":13,"chapterName":"泌尿系统疾病","chapterTitle":"第13章 泌尿系统疾病"},{"id":"pathology-a-single-0051","type":"single","typeLabel":"单选题","number":51,"question":"膜性肾小球肾炎的病变特点是","options":[{"key":"A","text":"肾小球毛细血管基膜变薄、断裂，通透性增加"},{"key":"B","text":"肾小球毛细血管基膜增厚、滤过率降低"},{"key":"C","text":"肾小球毛细血管基膜变薄、断裂"},{"key":"D","text":"肾小球毛细血管基膜增厚、通透性增加"},{"key":"E","text":"肾小球毛细血管基膜增厚呈双车轨状或分层状"}],"answerKeys":["D"],"answerText":["肾小球毛细血管基膜增厚、通透性增加"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：膜性肾小球肾炎以肾小球毛细血管基膜弥漫增厚、滤过屏障通透性增加为病变特点，临床常表现为肾病综合征。\n解析：膜性肾小球肾炎的典型机制是上皮下免疫复合物沉积，激活补体后损伤基底膜，使毛细血管基膜弥漫性增厚，银染色可见“钉突”形成；电镜下以上皮下电子致密物沉积为特征。基膜增厚的同时滤过屏障完整性受损，通透性增加，出现大量非选择性蛋白尿，故标准答案为D。本题题眼是“膜性肾小球肾炎”的基膜改变及通透性变化。\n选项分析：\nA. 错误：基膜变薄、断裂、通透性增加主要见于薄基底膜肾病、Alport综合征或坏死性肾小球损伤等，不是膜性肾小球肾炎的典型病变。\nB. 错误：膜性肾小球肾炎确有基膜增厚，但早期滤过率多可维持正常，核心表现是通透性增加和大量蛋白尿；“滤过率降低”不是其最突出特点，且未点出通透性增加。\nC. 错误：仅描述基膜变薄、断裂，属于基底膜缺陷或坏死性病变，与膜性肾小球肾炎的免疫复合物沉积和基膜增厚不符。\nD. 正确：膜性肾小球肾炎时上皮下免疫复合物导致毛细血管基膜弥漫增厚，滤过屏障受损、通透性增加，产生大量蛋白尿。\nE. 错误：基膜增厚呈“双车轨状”或分层状是膜增生性肾小球肾炎的典型改变，由系膜细胞和基质插入基底膜所致，不是膜性肾小球肾炎。\n易混点：膜性肾小球肾炎的关键词是“基膜弥漫增厚、钉突、上皮下沉积、通透性增加”；膜增生性肾小球肾炎的关键词是“系膜细胞增生、双轨征”。记忆时抓住“膜性增厚不通透、膜增生双轨伴增生”。","chapter":13,"chapterName":"泌尿系统疾病","chapterTitle":"第13章 泌尿系统疾病"},{"id":"pathology-a-single-0052","type":"single","typeLabel":"单选题","number":52,"question":"较多嗜酸性粒细胞浸润见于","options":[{"key":"A","text":"伤寒杆菌感染"},{"key":"B","text":"变态反应或寄生虫感染"},{"key":"C","text":"乙脑病毒感染"},{"key":"D","text":"溶血性链球菌感染"},{"key":"E","text":"葡萄球菌感染"}],"answerKeys":["B"],"answerText":["变态反应或寄生虫感染"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n\n核心考点：嗜酸性粒细胞浸润主要见于变态反应性疾病和寄生虫感染。\n\n解析：嗜酸性粒细胞具有趋化至过敏反应和寄生虫感染部位的特性，其募集与IL-5、嗜酸性粒细胞趋化因子及IgE介导的免疫反应密切相关。寄生虫感染时，尤其蠕虫感染，嗜酸性粒细胞可参与对虫体的附着和杀伤；变态反应时也可出现较明显的嗜酸性粒细胞浸润。本题题眼是“较多嗜酸性粒细胞浸润”，应首先联系变态反应或寄生虫感染。\n\n选项分析：\nA. 错误：伤寒杆菌感染属急性传染病，基本病变为全身单核巨噬细胞系统增生，回肠末段淋巴组织形成伤寒肉芽肿，浸润细胞以巨噬细胞（伤寒细胞）为主，并非嗜酸性粒细胞。\nB. 正确：变态反应和寄生虫感染是嗜酸性粒细胞浸润的典型原因，考试中常将嗜酸性粒细胞与过敏、寄生虫感染相联系。\nC. 错误：乙脑病毒感染主要引起中枢神经系统病变，浸润细胞以淋巴细胞、单核细胞为主，可见噬神经细胞现象和血管套形成，不以嗜酸性粒细胞为主。\nD. 错误：溶血性链球菌感染常引起化脓性炎，浸润细胞以中性粒细胞为主，可伴坏死和脓液形成，而非嗜酸性粒细胞。\nE. 错误：葡萄球菌感染也属化脓性炎，局部以大量中性粒细胞浸润为特征，易形成脓肿，不是嗜酸性粒细胞浸润的典型病变。\n\n易混点：急性化脓性炎记“中性粒细胞”，病毒感染多“淋巴细胞、单核细胞”，伤寒记“巨噬细胞/伤寒细胞”，变态反应和寄生虫感染记“嗜酸性粒细胞”。需注意寄生虫感染并非所有类型都显著嗜酸性粒细胞增多，但考试中最常考的是蠕虫感染和变态反应。","chapter":4,"chapterName":"炎症","chapterTitle":"第4章 炎症"},{"id":"pathology-a-single-0053","type":"single","typeLabel":"单选题","number":53,"question":"肺气肿是指肺内残气增多，持续扩张性病变，主要累及","options":[{"key":"A","text":"肺内细小支气管"},{"key":"B","text":"终末细支气管"},{"key":"C","text":"左、右支气管"},{"key":"D","text":"呼吸性细支气管及远端肺组织"},{"key":"E","text":"局限于肺泡"}],"answerKeys":["D"],"answerText":["呼吸性细支气管及远端肺组织"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：肺气肿是末梢肺组织含气量增多并伴肺泡间隔破坏的持续性扩张性病变，主要累及呼吸性细支气管及远端肺组织。\n解析：肺气肿时，呼吸性细支气管、肺泡管、肺泡囊和肺泡因残气增多而持续扩张，并伴有肺泡间隔变薄、断裂和弹性回缩力下降，导致肺体积膨大、肺功能受损。题眼是“呼吸性细支气管及远端肺组织”，这是肺气肿累及的部位，而不是单纯终末细支气管或局限于肺泡。临床上常见桶状胸、呼吸困难、呼气延长等表现。\n选项分析：\nA. 错误：肺内细小支气管不是肺气肿的基本定义部位；小气道病变常见于慢性支气管炎等，可继发肺气肿，但不是本题所问的主要累及部位。\nB. 错误：终末细支气管属于传导气道末端，肺气肿的关键累及部位是其远端的呼吸性细支气管及肺泡性肺组织，不能只概括为终末细支气管。\nC. 错误：左、右支气管为主支气管，属于较大的传导气道，肺气肿不是以主支气管扩张为基本病变。\nD. 正确：肺气肿累及呼吸性细支气管、肺泡管、肺泡囊及肺泡，即呼吸性细支气管及远端肺组织，符合肺气肿的病理定义。\nE. 错误：肺气肿并非仅局限于肺泡，还包括呼吸性细支气管及肺泡管、肺泡囊等末梢肺组织，并伴有肺泡间隔破坏。\n易混点：注意“终末细支气管”与“呼吸性细支气管”的区别：终末细支气管是气体传导通道，呼吸性细支气管已有肺泡开口、参与气体交换；肺气肿累及的是后者及其远端肺组织。记忆要点：肺气肿=末梢肺组织含气过多+肺泡间隔破坏，部位在呼吸性细支气管及远端。","chapter":10,"chapterName":"呼吸系统疾病","chapterTitle":"第10章 呼吸系统疾病"},{"id":"pathology-a-single-0054","type":"single","typeLabel":"单选题","number":54,"question":"肝穿刺送检标本，镜下如图所示，箭头所指肝细胞出现何种病变","options":[{"key":"A","text":"细胞水肿"},{"key":"B","text":"脂肪变性"},{"key":"C","text":"玻璃样变性"},{"key":"D","text":"嗜酸性变"},{"key":"E","text":"点状坏死"}],"answerKeys":["D"],"answerText":["嗜酸性变"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：肝细胞嗜酸性变的形态学特点及其与嗜酸性小体、凋亡的关系。\n解析：题目图片未提供，仅依据文字信息和标准答案分析。嗜酸性变常见于病毒性肝炎等，肝细胞胞质水分减少、蛋白质变性，胞质嗜酸性增强而呈深红色，细胞体积缩小，核可固缩或消失；若核完全消失，则形成嗜酸性小体（Councilman小体），本质属于细胞凋亡。本题题眼是箭头所指为单个肝细胞胞质深伊红染、体积缩小，而非成片坏死或脂滴空泡。\n选项分析：\nA. 错误：细胞水肿表现为肝细胞体积增大、胞质淡染疏松，甚至气球样变，是水钠潴留和ATP不足所致，不是胞质浓缩深红。\nB. 错误：脂肪变性表现为胞质内出现脂滴空泡，制片后呈圆形空亮区，可挤压细胞核，与均质深伊红胞质不同。\nC. 错误：玻璃样变性为蛋白质均质红染沉积，肝脏可见Mallory小体等，但多呈不规则胞质内包涵体，常见于酒精性肝病，不能等同于单个肝细胞嗜酸性变。\nD. 正确：嗜酸性变时肝细胞胞质浓缩、嗜酸性增强，核固缩或消失，可形成嗜酸性小体，符合病毒性肝炎中单个肝细胞凋亡性改变。\nE. 错误：点状坏死是肝小叶内小灶性肝细胞坏死伴炎细胞浸润，累及多个肝细胞，不是单个肝细胞胞质嗜酸性增强。\n易混点：嗜酸性小体是嗜酸性变进一步核消失后的凋亡小体；Mallory小体是肝细胞胞质内玻璃样包涵体，常见于酒精性肝病；点状坏死强调小灶性坏死和炎细胞反应。记忆要点：单个深红缩小肝细胞选嗜酸性变，成灶坏死伴炎症选点状坏死。","chapter":1,"chapterName":"细胞和组织的适应与损伤","chapterTitle":"第1章 细胞和组织的适应与损伤","needsImage":true},{"id":"pathology-a-single-0055","type":"single","typeLabel":"单选题","number":55,"question":"碎片状坏死发生的部位是","options":[{"key":"A","text":"肝小叶中央静脉"},{"key":"B","text":"肝小叶周边界板区"},{"key":"C","text":"肝小叶中间区"},{"key":"D","text":"肾皮质区"},{"key":"E","text":"肾髓质区"}],"answerKeys":["B"],"answerText":["肝小叶周边界板区"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：碎片状坏死（界面炎）是慢性活动性肝炎时肝小叶周边界板区肝细胞坏死并伴炎细胞浸润的病变。\n解析：碎片状坏死发生在肝小叶周边界板区，即门管区周围与肝小叶交界处。其机制主要是慢性病毒性肝炎（如乙型、丙型肝炎）时，淋巴细胞等免疫细胞攻击界板处肝细胞，导致界板肝细胞灶状坏死、崩解，并伴淋巴细胞和浆细胞浸润，使界板呈“虫蚀样”破坏。该病变是判断慢性肝炎活动性及进展的重要形态学指标，题眼是“碎片状”即指界板处坏死碎片化。\n选项分析：\nA. 错误：肝小叶中央静脉周围坏死属于小叶中央区坏死，常见于肝淤血、缺血或缺氧及某些药物/毒物损伤，不是碎片状坏死的部位。\nB. 正确：碎片状坏死位于肝小叶周边界板区，是慢性活动性肝炎的典型病变，表现为界板肝细胞灶状坏死和炎细胞浸润。\nC. 错误：肝小叶中间区（中间带）坏死可见于某些毒物或感染性损伤，但不是碎片状坏死的定义部位；碎片状坏死强调界面/界板。\nD. 错误：肾皮质区属于肾脏结构，不是肝小叶的组成部位，与碎片状坏死无关。\nE. 错误：肾髓质区同样属于肾脏结构，与肝小叶界板及碎片状坏死无解剖和病理联系。\n易混点：碎片状坏死与点状坏死、桥接坏死易混。记忆要点：界板破坏呈碎片状为碎片状坏死；小叶内散在单个或数个肝细胞坏死为点状坏死；坏死带连接中央静脉与门管区或相邻门管区等为桥接坏死。碎片状坏死的关键词是“周边界板区、界面炎、慢性肝炎活动性”。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-a-single-0056","type":"single","typeLabel":"单选题","number":56,"question":"吞噬作用最为活跃的炎症细胞是","options":[{"key":"A","text":"淋巴细胞"},{"key":"B","text":"中性粒细胞"},{"key":"C","text":"浆细胞"},{"key":"D","text":"嗜酸性粒细胞"},{"key":"E","text":"肥大细胞"}],"answerKeys":["B"],"answerText":["中性粒细胞"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：中性粒细胞是急性炎症中运动活跃、吞噬作用最活跃的炎症细胞之一。\n解析：中性粒细胞来源于骨髓，是急性炎症早期最先到达炎症灶的白细胞。其胞质含大量溶酶体、髓过氧化物酶和杀菌物质，能伸出伪足吞噬细菌、免疫复合物及坏死组织碎片，并通过氧依赖和非氧依赖机制杀伤病原体。题眼为“吞噬作用最活跃的炎症细胞”，应锁定中性粒细胞；脓液中的脓细胞主要也是变性坏死的中性粒细胞。\n\n选项分析：\nA. 错误：淋巴细胞主要参与特异性免疫识别和细胞免疫、体液免疫调节，吞噬能力很弱，不是吞噬作用最活跃的炎症细胞。\nB. 正确：中性粒细胞具有活跃的趋化、游出和吞噬能力，是急性炎症早期的主要吞噬细胞，常见于化脓性炎。\nC. 错误：浆细胞由B淋巴细胞转化而来，主要功能是合成和分泌抗体，不承担活跃的吞噬作用。\nD. 错误：嗜酸性粒细胞主要见于寄生虫感染和变态反应性炎症，可释放颗粒内容物杀伤寄生虫，吞噬作用相对较弱。\nE. 错误：肥大细胞主要释放组胺、白三烯等炎症介质，参与血管扩张、通透性增加和变态反应，不是主要吞噬细胞。\n\n易混点：中性粒细胞与巨噬细胞均为吞噬细胞，但中性粒细胞是急性炎症早期最活跃的吞噬细胞；巨噬细胞在慢性炎症、组织清除和修复中作用突出。淋巴细胞、浆细胞和肥大细胞不要与吞噬细胞混淆。","chapter":4,"chapterName":"炎症","chapterTitle":"第4章 炎症"},{"id":"pathology-a-single-0057","type":"single","typeLabel":"单选题","number":57,"question":"镜影细胞最主要的特点是","options":[{"key":"A","text":"为多核瘤巨细胞"},{"key":"B","text":"细胞大、胞质丰富、呈双色性"},{"key":"C","text":"有大的嗜酸性核仁"},{"key":"D","text":"核大、核膜厚、核呈空泡状"},{"key":"E","text":"双核并列、有大的嗜酸性核仁、如影随形"}],"answerKeys":["E"],"answerText":["双核并列、有大的嗜酸性核仁、如影随形"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n核心考点：经典型霍奇金淋巴瘤诊断性R-S细胞（镜影细胞）的形态学特征。\n解析：镜影细胞是经典型霍奇金淋巴瘤中最具诊断价值的R-S细胞，典型表现为两个大小、形态相似的核并列，呈“镜像”排列，故称镜影细胞。其核内可见大而嗜酸性的核仁，核膜厚、染色质呈空泡状，整体如“猫头鹰眼”。免疫表型常为CD15+、CD30+、CD45−，背景为小淋巴细胞、嗜酸性粒细胞等炎症细胞。题眼是“双核并列、大嗜酸性核仁、如影随形”。\n\n选项分析：\nA. 错误：R-S细胞可表现为多核瘤巨细胞，但“多核瘤巨细胞”本身缺乏特异性，结核性肉芽肿、异物性肉芽肿、骨巨细胞瘤等也可见多核巨细胞，不能概括镜影细胞最主要特点。\nB. 错误：R-S细胞体积大、胞质丰富，胞质可呈嗜酸性或双染性，但这些属于一般细胞学特征，特异性不足，不是“镜影”得名的关键。\nC. 错误：大的嗜酸性核仁是R-S细胞的重要特征之一，但仅凭大核仁不能确定为镜影细胞；其他大细胞淋巴瘤、转移性癌细胞等也可有明显核仁。\nD. 错误：核大、核膜厚、核呈空泡状是R-S细胞核的常见表现，但也可见于弥漫大B细胞淋巴瘤等大细胞病变，单独出现不能诊断镜影细胞。\nE. 正确：双核并列、核形相似如镜像，伴大的嗜酸性核仁，是镜影细胞最典型、最具诊断意义的形态特点，故为本题答案。\n\n易混点：镜影细胞需与结节硬化型霍奇金淋巴瘤的陷窝细胞、结节淋巴细胞为主型霍奇金淋巴瘤的爆米花细胞及间变性大细胞淋巴瘤的Hallmark细胞鉴别。记忆要点：镜影细胞看“双核镜像+大嗜酸性核仁”，陷窝细胞看“胞质收缩似陷窝”，爆米花细胞看“核仁多而小、CD20+、CD45+”。","chapter":12,"chapterName":"淋巴造血系统疾病","chapterTitle":"第12章 淋巴造血系统疾病"},{"id":"pathology-a-single-0058","type":"single","typeLabel":"单选题","number":58,"question":"下列哪种变性是发生于细胞内","options":[{"key":"A","text":"脂肪变性"},{"key":"B","text":"细动脉玻璃样变"},{"key":"C","text":"淀粉样变性"},{"key":"D","text":"黏液样变性"},{"key":"E","text":"营养不良性钙化"}],"answerKeys":["A"],"answerText":["脂肪变性"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：A\n核心考点：细胞内变性是指变性物质蓄积于实质细胞胞质内，脂肪变性是典型的细胞内脂质蓄积。\n解析：脂肪变性是指除脂肪细胞外的实质细胞胞质内出现甘油三酯蓄积，最常见于肝细胞，也可见于心肌细胞、肾小管上皮细胞。其机制包括脂质摄入过多、合成增多、脂肪酸氧化利用减少、载脂蛋白合成不足及脂蛋白输出障碍等。镜下HE染色胞质内可见空泡，冰冻切片苏丹Ⅲ染色呈橘红色，可证实为脂滴。本题题眼是“发生于细胞内”，即变性产物位于细胞质内，而其余选项多为细胞外间质、血管壁或组织内沉积。\n\n选项分析：\nA. 正确：脂肪变性是实质细胞胞质内脂滴蓄积，属于细胞内变性，好发于肝、心、肾等，心肌脂肪变性可呈“虎斑心”。\nB. 错误：细动脉玻璃样变发生于细动脉壁，是血浆蛋白渗入及基底膜样物质沉积，导致管壁增厚、均质红染、管腔狭窄，属于血管壁细胞外物质沉积，常见于良性高血压、糖尿病。\nC. 错误：淀粉样变性是淀粉样蛋白沉积于细胞外间质，HE染色呈均质红染，刚果红染色阳性，偏振光下呈苹果绿双折光，不是细胞内变性。\nD. 错误：黏液样变性是间质内黏液样物质蓄积，属于细胞外间质病变，可见于风湿病、甲状腺功能低下及某些肿瘤间质等。\nE. 错误：营养不良性钙化是钙盐沉积于坏死组织、血栓、动脉粥样硬化斑块或异物中，血钙通常正常，属于细胞外钙盐沉积，不是细胞内变性。\n\n易混点：细胞内变性包括细胞水肿、脂肪变性及细胞内玻璃样变（如Mallory小体、Russell小体）；细胞外/间质病变包括细动脉玻璃样变、淀粉样变、黏液样变和营养不良性钙化。记忆要点是“脂肪滴在胞质内，淀粉样物在间质中，细动脉玻璃样变在血管壁”。","chapter":1,"chapterName":"细胞和组织的适应与损伤","chapterTitle":"第1章 细胞和组织的适应与损伤"},{"id":"pathology-a-single-0059","type":"single","typeLabel":"单选题","number":59,"question":"关于高血压小动脉病变叙述中，下列错误的是","options":[{"key":"A","text":"中膜平滑肌细胞肥大和增生"},{"key":"B","text":"膜内胶原和弹性纤维增多"},{"key":"C","text":"内膜弹性纤维增多"},{"key":"D","text":"内膜内血浆蛋白渗入，发生玻璃样变"},{"key":"E","text":"内弹力膜分裂"}],"answerKeys":["D"],"answerText":["内膜内血浆蛋白渗入，发生玻璃样变"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：良性高血压小动脉病变与细动脉玻璃样变的区别。\n解析：良性高血压长期压力负荷可使小动脉中膜平滑肌细胞肥大增生，管壁胶原和弹性纤维增多，内膜纤维性增厚并出现内弹力膜分裂。血浆蛋白渗入内膜下并形成均质红染无结构的玻璃样物质，是细动脉玻璃样变（透明变性）的机制。D项把细动脉玻璃样变的表现归入“小动脉病变”，故为错误项。本题题眼是“小动脉”与“细动脉”的区分。\n\n选项分析：\nA. 正确：小动脉中膜平滑肌细胞发生代偿性肥大和增生，使管壁增厚、管腔狭窄。\nB. 正确：长期高血压可刺激小动脉壁结缔组织增生，胶原和弹性纤维增多，促进血管壁硬化。\nC. 正确：小动脉内膜可发生纤维性增厚，弹性纤维增多，属于良性高血压小动脉硬化的形态学改变。\nD. 错误：内膜内血浆蛋白渗入并发生玻璃样变是细动脉玻璃样变的典型机制，不是小动脉病变的主要描述；小动脉病变以纤维性增厚、内弹力膜分裂等为主。\nE. 正确：小动脉长期受压后内弹力膜可发生分裂，是良性高血压小动脉硬化的常见改变之一。\n\n易混点：细动脉玻璃样变表现为血浆蛋白渗入、均质红染玻璃样物质沉积；小动脉硬化表现为中膜平滑肌增生、胶原和弹性纤维增多、内弹力膜分裂。记忆要点：细动脉看“血浆蛋白玻璃样变”，小动脉看“纤维性增厚、内弹力膜分裂”。","chapter":9,"chap
