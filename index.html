n易混点：呼吸困难是肺淤血的常见症状，而粉红色泡沫痰是急性肺水肿的特征性表现；铁锈色痰则见于大叶性肺炎。记忆要点：左心衰肺淤血——粉红色泡沫痰；大叶性肺炎——铁锈色痰。","chapter":3,"chapterName":"局部血液循环障碍","chapterTitle":"第3章 局部血液循环障碍"},{"id":"pathology-a-single-0136","type":"single","typeLabel":"单选题","number":136,"question":"关于甲状腺乳头状癌的叙述，下列不正确的是","options":[{"key":"A","text":"本癌发现时约50%已有颈淋巴结转移，因此预后很差"},{"key":"B","text":"青少年女性多见"},{"key":"C","text":"为最多见的甲状腺癌"},{"key":"D","text":"生长较慢，预后较好"},{"key":"E","text":"肿瘤间质中常见砂粒体"}],"answerKeys":["A"],"answerText":["本癌发现时约50%已有颈淋巴结转移，因此预后很差"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：A\n核心考点：甲状腺乳头状癌虽常见颈淋巴结转移，但分化好、生长慢，总体预后很好。\n解析：甲状腺乳头状癌是甲状腺癌中最常见的类型，镜下具有乳头状结构、毛玻璃样核、核沟及核内假包涵体，间质中可见砂粒体。其颈部淋巴结转移率较高，发现时约半数可有颈淋巴结转移，但转移灶常局限于颈部，生长缓慢，预后仍较好，不能因淋巴结转移而判断为“预后很差”。本题题眼是把“高淋巴结转移率”错误等同于“预后差”。\n\n选项分析：\nA. 错误：甲状腺乳头状癌发现时约50%可有颈淋巴结转移，但该癌分化较好、生长较慢，颈部淋巴结转移并不等于预后很差；本题要求选不正确的叙述，故A为答案。\nB. 正确：甲状腺乳头状癌女性明显多见，好发于中青年，青少年女性亦不少见，符合其流行病学特点。\nC. 正确：甲状腺乳头状癌是甲状腺癌中最常见的组织学类型，约占甲状腺癌的大多数。\nD. 正确：该癌生长较缓慢，虽可发生颈部淋巴结转移，但总体预后较好，生存期长。\nE. 正确：砂粒体是甲状腺乳头状癌较特征性的形态学表现，常见于乳头轴心或肿瘤间质中，为同心圆层状钙化小体。\n\n易混点：甲状腺滤泡癌也属分化型癌，但更易经血道转移，镜下无乳头状结构和砂粒体；髓样癌来源于C细胞，常伴降钙素升高和淀粉样间质；未分化癌生长迅速、预后极差。记忆要点：乳头状癌“淋巴结转移多但预后好”，砂粒体和毛玻璃核是题眼。","chapter":15,"chapterName":"内分泌系统疾病","chapterTitle":"第15章 内分泌系统疾病"},{"id":"pathology-a-single-0137","type":"single","typeLabel":"单选题","number":137,"question":"炎症早期出现炎性充血时，最先累及的血管为","options":[{"key":"A","text":"细动脉"},{"key":"B","text":"小动脉"},{"key":"C","text":"细静脉"},{"key":"D","text":"小静脉"},{"key":"E","text":"毛细血管"}],"answerKeys":["A"],"answerText":["细动脉"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：A\n核心考点：急性炎症早期血流动力学改变中，炎性充血最先由细动脉扩张引起。\n解析：炎症早期，在致炎因子作用下，细动脉先发生短暂痉挛，随后迅速扩张，血流加快，形成动脉性充血，即炎性充血。随后细静脉和毛细血管扩张、血流减慢，血管通透性增加，进入淤血和渗出阶段。本题题眼是“早期炎性充血”和“最先累及”，应锁定微循环入口的细动脉。\n选项分析：\nA. 正确：细动脉是微循环的入口血管，炎症早期最先发生扩张，导致局部血流加快和炎性充血。\nB. 错误：小动脉属于较细动脉更上一级的动脉血管，炎症时也可扩张，但不是最早、最特征性受累的血管；将其作为“最先”不符合炎症早期血流动力学顺序。\nC. 错误：细静脉主要在炎症稍后阶段扩张、血流减慢并伴通透性增加，参与淤血和渗出，不是最早出现炎性充血的血管。\nD. 错误：小静脉不是炎症早期充血的起始血管，更多与后续静脉性充血、血流停滞和白细胞附壁相关。\nE. 错误：毛细血管床在炎症早期可开放增多，但其开放受细动脉扩张和微循环血流增加带动，不是最先累及的血管。\n易混点：记忆顺序为“细动脉短暂痉挛→细动脉扩张充血→毛细血管床开放→细静脉、毛细血管淤血→通透性增加渗出”。细动脉负责早期动脉性充血，细静脉更偏向后续淤血和渗出环节。","chapter":4,"chapterName":"炎症","chapterTitle":"第4章 炎症"},{"id":"pathology-a-single-0138","type":"single","typeLabel":"单选题","number":138,"question":"革囊胃是指","options":[{"key":"A","text":"胃癌伴胃扩张"},{"key":"B","text":"胃黏液癌"},{"key":"C","text":"胃癌弥漫浸润型"},{"key":"D","text":"胃溃疡广泛瘢痕形成"},{"key":"E","text":"范围较大的溃疡型胃癌"}],"answerKeys":["C"],"answerText":["胃癌弥漫浸润型"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：革囊胃即皮革胃，是胃癌弥漫浸润型导致胃壁广泛增厚、僵硬、胃腔缩小的典型大体表现。\n解析：胃癌弥漫浸润型（Borrmann IV型）时，癌细胞在胃壁内弥漫浸润生长，并引起明显纤维结缔组织增生，使胃壁增厚、变硬、弹性消失，胃腔缩小，形似皮革制成的囊袋，故称革囊胃或皮革胃。镜下多为低分化腺癌或印戒细胞癌，癌细胞可弥漫分布于黏膜下层、肌层甚至浆膜层；临床可出现早饱、胃排空障碍、消瘦和恶病质，X线可见胃腔缩小、胃壁僵硬、蠕动消失。本题题眼是“革囊胃”，对应胃癌弥漫浸润型，而不是胃扩张或单纯溃疡瘢痕。\n\n选项分析：\nA. 错误：革囊胃的突出特点是胃壁僵硬、胃腔缩小，并非胃癌伴胃扩张；胃扩张可见于幽门梗阻等，与本病变相反。\nB. 错误：胃黏液癌是组织学类型，特征是癌细胞产生大量黏液，可形成黏液湖或印戒细胞，但“革囊胃”描述的是弥漫浸润型胃癌的大体形态，不能等同于胃黏液癌。\nC. 正确：胃癌弥漫浸润型癌细胞在胃壁内广泛浸润并伴纤维组织增生，使胃壁弥漫增厚变硬、胃腔缩小，形成革囊胃，是最准确的对应关系。\nD. 错误：胃溃疡广泛瘢痕形成可引起胃变形、幽门狭窄等，但瘢痕局限或呈局灶性纤维化，不是癌组织在胃壁内弥漫浸润所致的革囊胃。\nE. 错误：范围较大的溃疡型胃癌主要表现为局限性癌性溃疡，边缘隆起、底部污秽，属于溃疡型胃癌，并非胃壁弥漫浸润、胃腔缩小的革囊胃。\n\n易混点：革囊胃的关键词是“弥漫浸润、胃壁僵硬、胃腔缩小”；溃疡型胃癌的关键词是“癌性溃疡、火山口状边缘”。胃溃疡瘢痕也可致胃变形，但本质是良性纤维瘢痕，不伴癌细胞弥漫浸润。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-a-single-0139","type":"single","typeLabel":"单选题","number":139,"question":"恶性高血压患者死于尿毒症的主要原因是","options":[{"key":"A","text":"肾小管坏死"},{"key":"B","text":"肾间质出血"},{"key":"C","text":"肾动脉血栓形成"},{"key":"D","text":"肾小球纤维化"},{"key":"E","text":"肾细小动脉纤维素样坏死"}],"answerKeys":["E"],"answerText":["肾细小动脉纤维素样坏死"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n核心考点：恶性高血压的特征性肾血管病变是肾细小动脉纤维素样坏死，并因此导致急性肾功能衰竭。\n解析：恶性高血压时，肾入球小动脉及小叶间动脉发生纤维素样坏死，管壁结构破坏、管腔狭窄并常伴微血栓形成，使肾血流灌注急骤下降，肾小球缺血、坏死，肾单位大量破坏，临床可迅速出现恶性肾硬化并死于尿毒症。题眼在于“恶性高血压”与“尿毒症”联系，其病理基础是细小动脉纤维素样坏死，而不是慢性纤维化。\n选项分析：\nA. 错误：肾小管坏死多对应急性缺血或肾毒性损伤，恶性高血压时可继发肾小管缺血性改变，但不是导致尿毒症的主要和特征性原因。\nB. 错误：肾间质出血可见于恶性高血压肾损害，但属于继发性改变，不能解释肾功能急剧衰竭的主要机制。\nC. 错误：肾动脉血栓形成主要引起肾动脉阻塞和肾梗死，属于大中动脉病变；恶性高血压的特征是肾细小动脉受累，而非典型肾动脉血栓形成。\nD. 错误：肾小球纤维化多见于良性高血压肾硬化或慢性肾脏病终末期，进展较慢；恶性高血压虽可后期纤维化，但急性尿毒症的主要基础是细小动脉纤维素样坏死。\nE. 正确：肾细小动脉纤维素样坏死是恶性高血压的标志性病变，可直接造成肾缺血、肾小球坏死和肾功能急骤恶化，是患者死于尿毒症的主要病理原因。\n易混点：良性高血压的肾细动脉病变为玻璃样变，肾小球多呈缺血性皱缩和纤维化；恶性高血压则为细小动脉纤维素样坏死，并可伴增生性小动脉硬化和肾小球节段性坏死。记忆要点：良性高血压“玻璃样变、进展慢”，恶性高血压“纤维素样坏死、进展快”。","chapter":9,"chapterName":"心血管系统疾病","chapterTitle":"第9章 心血管系统疾病"},{"id":"pathology-a-single-0140","type":"single","typeLabel":"单选题","number":140,"question":"良性高血压晚期会引起","options":[{"key":"A","text":"继发性固缩肾"},{"key":"B","text":"肾水变性"},{"key":"C","text":"原发性固缩肾"},{"key":"D","text":"肾凹陷性瘢痕"},{"key":"E","text":"肾盂积水"}],"answerKeys":["C"],"answerText":["原发性固缩肾"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：良性高血压晚期引起原发性颗粒性固缩肾，关键是长期肾小动脉硬化导致肾实质缺血性萎缩与代偿性肥大并存。\n解析：良性高血压晚期，肾入球小动脉玻璃样变，弓状动脉和小叶间动脉内膜增厚、管腔狭窄，肾小球因缺血逐渐纤维化、玻璃样变，所属肾小管萎缩；残存肾单位代偿性肥大，使肾表面呈细颗粒状，双肾对称性缩小，形成原发性颗粒性固缩肾。题眼是“良性高血压晚期”与“固缩肾”的联系，需与慢性肾小球肾炎所致继发性固缩肾区分。\n选项分析：\nA. 错误：继发性固缩肾是慢性肾小球肾炎的结局，由大量肾小球纤维化、玻璃样变引起，不是良性高血压晚期的典型肾脏病变。\nB. 错误：肾水变性指肾小管上皮细胞水肿，常由缺氧、中毒等引起，属于可逆性细胞损伤，不是良性高血压晚期的特征性改变。\nC. 正确：良性高血压晚期因肾小动脉硬化、肾单位缺血性萎缩及代偿性肥大，形成双侧对称、表面细颗粒状的原发性颗粒性固缩肾。\nD. 错误：肾凹陷性瘢痕是慢性肾盂肾炎的典型肉眼表现，瘢痕不规则、常两侧不对称，并伴肾盂肾盏变形，与高血压肾的细颗粒状表面不同。\nE. 错误：肾盂积水由尿路梗阻引起，表现为肾盂肾盏扩张、肾实质受压萎缩，不是良性高血压晚期的直接后果。\n易混点：良性高血压→原发性颗粒性固缩肾；慢性肾小球肾炎→继发性颗粒性固缩肾；慢性肾盂肾炎→不规则凹陷性瘢痕。记忆要点：高血压肾是“小动脉硬化致缺血”，肾炎肾是“肾小球病变致继发固缩”。","chapter":9,"chapterName":"心血管系统疾病","chapterTitle":"第9章 心血管系统疾病"},{"id":"pathology-a-single-0141","type":"single","typeLabel":"单选题","number":141,"question":"关于大肠癌的描述，下列正确的是","options":[{"key":"A","text":"盲肠癌最多见"},{"key":"B","text":"类癌由腺瘤癌变而来"},{"key":"C","text":"少数癌瘤产生CEA"},{"key":"D","text":"Dukes后期向远隔器官远移"},{"key":"E","text":"未分化癌多见"}],"answerKeys":["D"],"answerText":["Dukes后期向远隔器官远移"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n\n核心考点：大肠癌的好发部位、组织学类型、肿瘤标志物及Dukes分期与转移的关系。\n\n解析：大肠癌最常见的好发部位是直肠，其次为乙状结肠，盲肠并非最多见；组织学上以腺癌最多见，未分化癌少见。Dukes分期主要用于评估大肠癌浸润深度、淋巴结转移和远处转移，Dukes后期尤其出现远隔器官转移，常经门静脉转移至肝，也可至肺等。本题题眼是“Dukes后期”与“远隔器官转移”的对应关系。\n\n选项分析：\nA. 错误：大肠癌最好发于直肠，其次乙状结肠，盲肠癌并非最多见，故“盲肠癌最多见”不符合流行病学特点。\nB. 错误：类癌起源于肠黏膜神经内分泌细胞（肠嗜铬细胞），属于神经内分泌肿瘤；腺瘤癌变通常形成腺癌，不是类癌。\nC. 错误：大肠癌患者常可出现CEA升高，CEA可作为监测复发和判断预后的指标之一，并非“少数癌瘤产生CEA”。\nD. 正确：Dukes后期尤其D期表示已有远处转移，可通过血道转移至肝、肺等远隔器官，故该描述正确。\nE. 错误：大肠癌组织学类型以腺癌最多见，未分化癌较少见，故“未分化癌多见”错误。\n\n易混点：Dukes C期强调淋巴结转移，D期强调远处转移，不能把“后期”一律等同于淋巴结转移。另需区分类癌与腺癌：类癌源于神经内分泌细胞，腺瘤癌变多形成腺癌；CEA升高主要用于辅助监测，不是确诊依据。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-a-single-0142","type":"single","typeLabel":"单选题","number":142,"question":"关于急性普通型肝炎的病变，下列哪项是错误的","options":[{"key":"A","text":"气球样变"},{"key":"B","text":"嗜酸性变"},{"key":"C","text":"溶解坏死"},{"key":"D","text":"肝细胞再生"},{"key":"E","text":"结缔组织增生"}],"answerKeys":["E"],"answerText":["结缔组织增生"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n核心考点：急性普通型肝炎以肝细胞广泛变性、坏死轻微为特点，通常无明显结缔组织增生。\n解析：急性普通型肝炎的主要病变是肝细胞水肿（气球样变）和嗜酸性变，坏死多为散在点状或灶状溶解坏死，坏死周围可见肝细胞再生。由于病程急性、坏死轻，一般不会出现明显纤维结缔组织增生；结缔组织增生多见于慢性肝炎或肝硬化。本题题眼是“急性普通型”和“错误”，应选结缔组织增生。\n选项分析：\nA. 正确：气球样变是肝细胞水肿的表现，胞质水分增多、细胞肿胀变圆、胞质淡染，是急性普通型肝炎常见变性。\nB. 正确：嗜酸性变时肝细胞胞质浓缩、嗜酸性增强，严重者可形成嗜酸性小体，属于急性普通型肝炎常见病变。\nC. 正确：急性普通型肝炎可有肝细胞溶解坏死，通常为小叶内散在的点状或灶状坏死，坏死轻微。\nD. 正确：肝细胞坏死后周边肝细胞可发生再生，属于修复性改变，急性普通型肝炎可见。\nE. 错误：结缔组织增生即纤维化，主要见于慢性肝炎、亚急性重型肝炎或肝硬化；急性普通型肝炎一般无明显结缔组织增生。\n易混点：急性普通型肝炎以“变性重、坏死轻、再生有、纤维化无”为记忆要点；慢性肝炎才突出汇管区纤维组织增生，急性重型肝炎则表现为大片坏死，亚急性重型可见结节状再生伴纤维化。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-a-single-0143","type":"single","typeLabel":"单选题","number":143,"question":"双侧卵巢Krukenberg瘤最常来源于","options":[{"key":"A","text":"卵巢"},{"key":"B","text":"肠"},{"key":"C","text":"胆囊"},{"key":"D","text":"胃"},{"key":"E","text":"乳房"}],"answerKeys":["D"],"answerText":["胃"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：Krukenberg瘤是双侧卵巢转移性黏液癌/印戒细胞癌，最常来源于胃。\n解析：Krukenberg瘤本质为卵巢的转移性肿瘤，而非卵巢原发肿瘤，最经典的原发部位是胃，尤其胃印戒细胞癌。胃壁癌细胞可经腹腔种植、淋巴管逆行或血行转移至双侧卵巢，刺激卵巢间质纤维增生。肉眼见卵巢弥漫性增大、切面呈胶冻样，镜下可见黏液池及印戒细胞。题眼是“双侧卵巢Krukenberg瘤”，应直接联系胃印戒细胞癌卵巢转移。\n\n选项分析：\nA. 错误：卵巢是Krukenberg瘤的受累部位，不是其来源；若为卵巢原发黏液性癌或纤维瘤等，不符合Krukenberg瘤的转移性本质。\nB. 错误：肠癌（尤其结直肠癌）可转移至卵巢，但相对胃少见，且不是Krukenberg瘤最经典、最常见的来源。\nC. 错误：胆囊癌可发生腹腔或卵巢转移，但发生率很低，不属于Krukenberg瘤最常见来源。\nD. 正确：胃癌，特别是胃印戒细胞癌，是双侧卵巢Krukenberg瘤最常见的原发灶，符合其转移途径和形态学特征。\nE. 错误：乳腺癌可转移至卵巢，但典型Krukenberg瘤多指胃来源的黏液印戒细胞癌卵巢转移；乳腺癌卵巢转移的组织学多为乳腺导管癌等，不是本题最常来源。\n\n易混点：Krukenberg瘤不是卵巢原发癌，而是转移癌；见到“双侧卵巢、印戒细胞、黏液池、间质纤维化”应首先想到胃印戒细胞癌转移。需与卵巢原发黏液性癌、纤维瘤及乳腺癌卵巢转移相鉴别，记忆要点是“双侧卵巢胶冻样、印戒细胞，追查胃”。","chapter":14,"chapterName":"生殖系统和乳腺疾病","chapterTitle":"第14章 生殖系统和乳腺疾病"},{"id":"pathology-a-single-0144","type":"single","typeLabel":"单选题","number":144,"question":"肝组织呈碎片状坏死或桥接坏死见于","options":[{"key":"A","text":"急性重型肝炎"},{"key":"B","text":"亚急性重症肝炎"},{"key":"C","text":"慢性持续性肝炎"},{"key":"D","text":"慢性活动性肝炎"},{"key":"E","text":"急性普通型肝炎"}],"answerKeys":["D"],"answerText":["慢性活动性肝炎"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：慢性活动性肝炎的典型坏死类型为碎片状坏死和桥接坏死。\n解析：慢性活动性肝炎时，炎症由门管区向肝小叶周边界板扩展，破坏界板肝细胞，形成碎片状坏死；坏死灶相互连接、跨越肝小叶结构时形成桥接坏死。病变常伴纤维组织增生，可进展为肝硬化。本题题眼是“碎片状坏死或桥接坏死”，二者是慢性活动性肝炎活动性、进展性的重要形态学标志。\n\n选项分析：\nA. 错误：急性重型肝炎以肝细胞大片状坏死为特征，坏死范围大、进展迅速，常伴肝功能衰竭，不以碎片状坏死或桥接坏死为主要表现。\nB. 错误：亚急性重症肝炎以亚大块坏死、坏死区网状纤维支架塌陷及肝细胞结节状再生为特征，虽可有桥接坏死，但整体病变为亚大块坏死，不是本题所指的慢性活动性肝炎。\nC. 错误：慢性持续性肝炎（慢性迁延性肝炎）病变较轻，炎症多局限于门管区，肝细胞坏死不明显，一般无碎片状坏死和桥接坏死。\nD. 正确：慢性活动性肝炎典型表现为门管区周围碎片状坏死，并可出现桥接坏死，伴明显炎症和纤维化，是本题标准答案。\nE. 错误：急性普通型肝炎以肝细胞胞质疏松化、气球样变和点状坏死为主，坏死灶小且散在，不出现碎片状坏死或桥接坏死。\n\n易混点：碎片状坏死位于门管区周围界板，是慢性活动性肝炎的标志；点状坏死见于急性普通型肝炎。桥接坏死提示坏死范围连接相邻结构，常见于慢性活动性肝炎活动期，需与重型肝炎的大片状坏死、亚大块坏死区分。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-a-single-0145","type":"single","typeLabel":"单选题","number":145,"question":"粥样斑块最危险的并发症是","options":[{"key":"A","text":"斑块内出血"},{"key":"B","text":"粥样瘤性溃疡"},{"key":"C","text":"斑块破裂"},{"key":"D","text":"钙化"},{"key":"E","text":"动脉瘤形成"}],"answerKeys":["C"],"answerText":["斑块破裂"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：动脉粥样硬化斑块并发症中，斑块破裂继发血栓形成是导致急性心脑血管事件的最危险环节。\n解析：粥样斑块纤维帽破裂后，脂质核心暴露，组织因子等促凝物质释放，血小板黏附聚集并形成血栓，可突然阻塞冠状动脉或脑动脉，引起急性冠脉综合征、心肌梗死、脑梗死甚至猝死。本题题眼是“最危险”，强调可迅速致死、致残的急性血栓性并发症，而不是慢性管腔狭窄或晚期扩张性病变。\n选项分析：\nA. 错误：斑块内出血指斑块内新生血管破裂或管壁损伤出血，可使斑块迅速增大、管腔狭窄加重，也可成为斑块破裂的诱因，但其最严重后果仍多通过破裂和血栓形成实现，故不是最危险并发症。\nB. 错误：粥样瘤性溃疡指斑块表面破溃形成溃疡，可继发血栓形成、栓塞和出血，属于危险病变；但本题标准答案强调纤维帽破裂、脂质核心暴露所触发的急性血栓事件，溃疡多被视为斑块破裂后的形态学表现之一，危险性不如“斑块破裂”这一核心环节直接。\nC. 正确：斑块破裂使纤维帽完整性丧失，脂质核心暴露于血流，激活凝血系统并形成血栓，是急性心肌梗死、脑梗死等猝死性事件的关键机制，故为最危险并发症。\nD. 错误：钙化属于粥样斑块的继发性改变，多为营养不良性钙化，使管壁变硬、顺应性下降，可加重狭窄，但通常为慢性过程，一般不直接引起最危险的急性血栓事件。\nE. 错误：动脉瘤形成见于动脉粥样硬化致中膜萎缩、弹性下降和管壁变薄扩张，可发生破裂出血，属于晚期严重并发症；但其危险多来自动脉瘤破裂，且不是粥样斑块最直接、最常见的急性危险并发症。\n易混点：斑块破裂强调纤维帽撕裂、脂质核心暴露并继发急性血栓；斑块内出血强调斑块突然增大；粥样瘤性溃疡强调斑块表面缺损。记忆要点：破裂暴露促血栓，急性梗死最危险；出血增大，溃疡缺损，钙化变硬，动脉瘤扩张破裂。","chapter":9,"chapterName":"心血管系统疾病","chapterTitle":"第9章 心血管系统疾病"},{"id":"pathology-a-single-0146","type":"single","typeLabel":"单选题","number":146,"question":"非霍奇金淋巴瘤按细胞来源分类，分为","options":[{"key":"A","text":"B细胞性和T细胞性"},{"key":"B","text":"滤泡型和弥漫型"},{"key":"C","text":"低度和高度恶性"},{"key":"D","text":"外周型和中枢型"},{"key":"E","text":"大细胞性和小细胞性"}],"answerKeys":["A"],"answerText":["B细胞性和T细胞性"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：A\n核心考点：非霍奇金淋巴瘤按细胞来源分类，主要分为B细胞性和T细胞性（传统还包括NK细胞性）。\n解析：非霍奇金淋巴瘤是一组异质性淋巴造血系统肿瘤，最基础的免疫表型分类是依据肿瘤细胞来源，即B细胞性、T细胞性及NK细胞性；临床上绝大多数NHL为B细胞来源，T/NK细胞来源相对少见。本题题眼是“按细胞来源分类”，因此应选B细胞性和T细胞性，而不是按生长方式、恶性程度、发生部位或细胞大小分类。\n\n选项分析：\nA. 正确：B细胞性和T细胞性直接反映肿瘤细胞的免疫表型来源，是NHL传统而基本的细胞来源分类；T细胞性可包括NK/T细胞相关肿瘤。\nB. 错误：滤泡型和弥漫型是按肿瘤的生长方式/组织学结构分类，例如滤泡性淋巴瘤呈滤泡样生长，弥漫大B细胞淋巴瘤呈弥漫性生长；它不是细胞来源分类。\nC. 错误：低度和高度恶性是按临床生物学行为、侵袭程度和预后分组，属于恶性程度分类；不能说明肿瘤来自B细胞还是T细胞。\nD. 错误：外周型和中枢型主要涉及发生部位或解剖区域，不是NHL按细胞来源的通用分类；中枢神经系统淋巴瘤多为弥漫大B细胞淋巴瘤，属部位与病理类型的组合。\nE. 错误：大细胞性和小细胞性是按肿瘤细胞体积和形态描述，如大B细胞淋巴瘤、小淋巴细胞淋巴瘤；细胞大小不等于细胞来源。\n\n易混点：滤泡性淋巴瘤虽名称中有“滤泡”，但“滤泡型”是生长模式，其细胞来源仍为B细胞；低度/高度恶性是旧式临床分级，不要与B/T来源分类混淆。记忆要点：来源看“B/T/NK”，结构看“滤泡/弥漫”，恶性度看“低/高”，形态看“大/小”。","chapter":12,"chapterName":"淋巴造血系统疾病","chapterTitle":"第12章 淋巴造血系统疾病"},{"id":"pathology-a-single-0147","type":"single","typeLabel":"单选题","number":147,"question":"下述关于动脉粥样硬化的危险因素中，哪项是错误的","options":[{"key":"A","text":"高脂血症，特别是血浆低密度脂蛋白（LDL）、极低密度脂蛋白（VLDL）水平与动脉粥样硬化的发病率呈正相关"},{"key":"B","text":"吸烟是引起动脉粥样硬化的因素之一"},{"key":"C","text":"高血压患者，动脉粥样硬化发病较早，病变较重"},{"key":"D","text":"遗传因素是动脉粥样硬化的危险因素"},{"key":"E","text":"雌激素可降低血浆胆固醇水平，因此，女性比同年龄男性动脉粥样硬化发病率低"}],"answerKeys":["E"],"answerText":["雌激素可降低血浆胆固醇水平，因此，女性比同年龄男性动脉粥样硬化发病率低"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n核心考点：动脉粥样硬化危险因素及雌激素、性别与发病风险的关系，重点掌握女性绝经前后发病差异。\n解析：动脉粥样硬化的危险因素包括高脂血症、高血压、吸烟、糖尿病和高胰岛素血症、遗传因素及年龄性别等。高脂血症中LDL、VLDL水平升高与发病率正相关，HDL有抗动脉粥样硬化作用；高血压可造成内皮损伤、脂质沉积和平滑肌增生；吸烟可损伤内皮、促进氧化LDL形成和血小板聚集；遗传因素可影响脂质代谢。E项错在将雌激素影响脂质代谢直接扩大为“女性比同年龄男性动脉粥样硬化发病率低”的普遍结论，忽略了女性绝经前风险较低、绝经后风险升高并接近男性的重要特点。\n选项分析：\nA. 正确：高脂血症是核心危险因素，LDL、VLDL可促进脂质沉积和泡沫细胞形成，与发病率呈正相关。\nB. 正确：吸烟可损伤血管内皮、促进氧化LDL生成、增强血小板聚集，是动脉粥样硬化的重要危险因素。\nC. 正确：高血压通过血流剪切力、内皮损伤和血管壁重塑，使动脉粥样硬化发病较早、病变较重。\nD. 正确：遗传因素可影响血脂水平、载脂蛋白和受体功能，是动脉粥样硬化的危险因素之一。\nE. 错误：雌激素虽可改善脂质代谢，但“女性比同年龄男性发病率低”不能泛化；女性绝经前发病风险低于男性，绝经后风险升高并与男性接近。\n易混点：记忆要点是“绝经前女低，绝经后追平男”；不要把所有同年龄女性都简单归为低危，也不要把雌激素的降胆固醇作用等同于终身保护。","chapter":9,"chapterName":"心血管系统疾病","chapterTitle":"第9章 心血管系统疾病"},{"id":"pathology-a-single-0148","type":"single","typeLabel":"单选题","number":148,"question":"原发性肝癌是指","options":[{"key":"A","text":"胆管上皮发生的癌"},{"key":"B","text":"肝细胞和肝内胆管上皮发生的癌"},{"key":"C","text":"肝细胞发生的癌"},{"key":"D","text":"肝细胞和肝外胆管上皮发生的癌"},{"key":"E","text":"来自库普弗细胞的恶性肿瘤"}],"answerKeys":["B"],"answerText":["肝细胞和肝内胆管上皮发生的癌"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：原发性肝癌的起源部位和细胞来源，包括肝细胞癌和肝内胆管癌。\n解析：原发性肝癌是指原发于肝脏的恶性肿瘤，最常考的是由肝细胞发生的肝细胞癌和由肝内胆管上皮发生的肝内胆管癌，二者均属于原发性肝癌。题眼在于“原发”要求肿瘤原发于肝内，且“肝癌”概念应覆盖肝细胞和肝内胆管上皮两类主要来源，不能仅指其中一种。\n选项分析：\nA. 错误：胆管上皮发生的癌若位于肝内，属于肝内胆管癌，是原发性肝癌的一种，但该表述未限定“肝内”，且不能涵盖肝细胞癌，概念不完整。\nB. 正确：肝细胞和肝内胆管上皮均可发生原发性肝癌，分别对应肝细胞癌和肝内胆管癌，符合原发性肝癌的病理学概念。\nC. 错误：肝细胞发生的癌是肝细胞癌，属于原发性肝癌最常见类型，但原发性肝癌还包括肝内胆管癌等，故只说肝细胞来源不全面。\nD. 错误：肝外胆管上皮发生的癌不属于原发性肝癌，而是肝外胆管癌；原发性肝癌强调原发于肝内。\nE. 错误：库普弗细胞是肝内巨噬细胞，非肝细胞或胆管上皮；其恶性病变不属于常见的上皮性“肝癌”，不能作为原发性肝癌的定义。\n易混点：原发性肝癌主要包括肝细胞癌、肝内胆管癌及混合型肝癌；转移性肝癌是肝外恶性肿瘤转移至肝。记忆要点：原发于肝内、来源为肝细胞和肝内胆管上皮，不包含肝外胆管癌。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-a-single-0149","type":"single","typeLabel":"单选题","number":149,"question":"淋巴结转移性肿瘤首先出现于淋巴结的","options":[{"key":"A","text":"副皮质区"},{"key":"B","text":"髓质"},{"key":"C","text":"边缘窦"},{"key":"D","text":"髓窦"},{"key":"E","text":"淋巴滤泡"}],"answerKeys":["C"],"answerText":["边缘窦"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：淋巴结转移性肿瘤经输入淋巴管首先累及淋巴结边缘窦（被膜下窦），再向深部扩展。\n解析：恶性肿瘤细胞脱落后可经淋巴管进入局部淋巴结，输入淋巴管穿过被膜后首先将淋巴液引流至被膜下窦，即边缘窦。因此转移癌细胞常先在边缘窦内停留、增殖，形成癌细胞巢或癌栓，随后可累及皮质、副皮质区及髓质。题眼是“首先出现”，应抓住淋巴结的淋巴引流顺序：输入淋巴管—边缘窦—皮质—髓质—输出淋巴管。\n\n选项分析：\nA. 错误：副皮质区为胸腺依赖区，主要含T细胞，常见于病毒感染等引起的副皮质区增生，不是转移癌最先停留的部位。\nB. 错误：髓质位于淋巴结深部，包括髓索和髓窦，属于淋巴引流较后期经过的区域，转移性肿瘤通常较晚累及。\nC. 正确：边缘窦紧邻被膜下，是输入淋巴管进入淋巴结后首先到达的窦隙，故为淋巴结转移性肿瘤最早出现的部位。\nD. 错误：髓窦位于髓质内，属于深部窦隙，常为转移瘤进展后累及，不是首发部位。\nE. 错误：淋巴滤泡主要位于皮质浅层，是B细胞增生和生发中心形成部位，常见于反应性滤泡增生或滤泡性淋巴瘤等，不是经淋巴管转移的首站。\n\n易混点：边缘窦又称被膜下窦，是输入淋巴管进入淋巴结后的第一站；髓窦位于髓质，靠近输出淋巴管，属于较晚累及部位。记忆要点：转移癌先“边缘”后“深部”，即由被膜下窦向皮质、髓质扩展。","chapter":6,"chapterName":"肿瘤","chapterTitle":"第6章 肿瘤"},{"id":"pathology-a-single-0150","type":"single","typeLabel":"单选题","number":150,"question":"下列关于心内膜下心肌梗死的描述，哪项是错误的","options":[{"key":"A","text":"梗死仅累及心室壁内侧的1/3的心肌"},{"key":"B","text":"梗死波及肉柱及乳头肌"},{"key":"C","text":"梗死灶常表现为小灶状坏死"},{"key":"D","text":"严重者坏死灶融合引起环状梗死"},{"key":"E","text":"梗死灶不规则地分布于左心室四周"}],"answerKeys":["D"],"answerText":["严重者坏死灶融合引起环状梗死"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：心内膜下心肌梗死的受累范围、坏死形态及分布特点。\n解析：心内膜下心肌梗死主要累及左心室壁内侧约1/3心肌，可波及肉柱和乳头肌，常表现为多发性小灶状坏死，并沿左心室四周不规则分布。严重时坏死灶可融合成较大片状，但按本题标准答案，本型典型描述不称为“环状梗死”，故D为错误项。题眼是“仅累及内侧1/3”与“小灶状、不规则分布”。\n选项分析：\nA. 正确：心内膜下梗死范围限于心室壁内侧约1/3，未累及心肌全层或超过2/3，这是其定义性特点。\nB. 正确：内层心肌包括心内膜下及肉柱、乳头肌，故梗死可波及肉柱和乳头肌，甚至引起乳头肌功能不全。\nC. 正确：心内膜下缺血常较广泛而不均，坏死灶多表现为多发性、小灶状。\nD. 错误：严重者坏死灶可融合成大片，但“融合即引起环状梗死”的表述不符合本型标准描述；错在将融合性坏死灶直接等同于环状梗死，属于概念混用。\nE. 正确：心内膜下小灶状坏死可沿左心室四周不规则分布，而非局限于某一冠状动脉供血区。\n易混点：心内膜下心肌梗死记忆为“内1/3、小灶状、不规则分布”；透壁性心肌梗死则强调“全层或超过2/3、区域性供血障碍”。不要把任何融合性坏死都称为环状梗死。","chapter":9,"chapterName":"心血管系统疾病","chapterTitle":"第9章 心血管系统疾病"},{"id":"pathology-a-single-0151","type":"single","typeLabel":"单选题","number":151,"question":"下列不属于坏死后性肝硬变的病变特点的是","options":[{"key":"A","text":"假小叶大小不等"},{"key":"B","text":"纤维间隔较宽"},{"key":"C","text":"炎细胞浸润明显"},{"key":"D","text":"假小叶大小相仿"},{"key":"E","text":"碎片状坏死"}],"answerKeys":["D"],"answerText":["假小叶大小相仿"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：坏死后性肝硬变的病理形态特点，重点是与门脉性肝硬变假小叶大小较一致的鉴别。\n解析：坏死后性肝硬变多由大片或亚大片肝坏死发展而来，常见于较重的病毒性肝炎等。其病变特点是肝体积缩小、表面结节较大且大小不等，纤维间隔较宽、厚薄不均，假小叶大小不等；因坏死和炎症持续存在，纤维间隔及汇管区可见明显炎细胞浸润，并常伴碎片状坏死、小胆管增生等。题眼是“不属于”：假小叶大小相仿是门脉性肝硬变的典型特点，而不是坏死后性肝硬变的特点。\n选项分析：\nA. 正确：坏死后性肝硬变因坏死范围大且不规则，残存肝细胞再生形成的假小叶大小不等，故属于其病变特点。\nB. 正确：坏死后性肝硬变纤维间隔常较宽、厚薄不均，是坏死后纤维化及修复反应较显著的表现。\nC. 正确：坏死后性肝硬变常由活动性病毒性肝炎等发展而来，纤维间隔及汇管区炎细胞浸润明显。\nD. 错误：假小叶大小相仿多见于门脉性肝硬变；坏死后性肝硬变的假小叶应大小不等，因此该项不属于其病变特点。\nE. 正确：坏死后性肝硬变常伴活动性炎症，可出现碎片状坏死，即界面肝炎样改变，属于可观察到的病变。\n易混点：门脉性肝硬变典型为小结节、纤维间隔较薄、假小叶大小较一致；坏死后性肝硬变为大结节或大小结节混合、纤维间隔宽而不规则、假小叶大小不等。记忆要点：坏死后性“大、宽、不均”，门脉性“小、薄、相仿”。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-a-single-0152","type":"single","typeLabel":"单选题","number":152,"question":"符合腺泡中央型肺气肿的病变特点是","options":[{"key":"A","text":"细支气管和肺泡弥漫性扩张"},{"key":"B","text":"呼吸性细支气管扩张"},{"key":"C","text":"肺泡管和肺囊泡扩张"},{"key":"D","text":"呼吸细支气管和肺囊泡扩张"},{"key":"E","text":"呼吸细支气管和肺泡管扩张"}],"answerKeys":["B"],"answerText":["呼吸性细支气管扩张"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：腺泡中央型肺气肿的病变部位是呼吸性细支气管扩张，而肺泡管、肺泡囊和肺泡相对正常。\n解析：腺泡中央型肺气肿又称小叶中央型肺气肿，是肺气肿中最常见的类型，主要累及腺泡中央的呼吸性细支气管，使其扩张甚至破坏，而腺泡远端的肺泡管、肺泡囊和肺泡多不受累。其发生与吸烟关系密切，可能与中性粒细胞弹性蛋白酶增多、α1-抗胰蛋白酶相对不足导致弹性纤维破坏有关。病变常位于双肺上叶，尤其肺尖部；临床可表现为逐渐加重的呼气性呼吸困难、桶状胸及阻塞性通气功能障碍。本题题眼是“腺泡中央型”，即病变位于腺泡中央的呼吸性细支气管。\n选项分析：\nA. 错误：细支气管和肺泡弥漫性扩张更接近全腺泡型肺气肿的弥漫性改变，不是腺泡中央型仅累及呼吸性细支气管的特点。\nB. 正确：腺泡中央型肺气肿的核心病变是呼吸性细支气管扩张，符合“中央型”累及腺泡中央部位的定义。\nC. 错误：肺泡管和肺泡囊扩张主要见于腺泡周围型（隔旁型）肺气肿，病变位于腺泡周边、胸膜下，易并发气胸。\nD. 错误：呼吸性细支气管和肺泡囊同时扩张不符合单纯腺泡中央型；中央型远端肺泡囊一般不受累。\nE. 错误：呼吸性细支气管和肺泡管同时扩张更接近全腺泡型的早期或部分表现；腺泡中央型一般不累及肺泡管。\n易混点：记忆“中央型看呼吸性细支气管，全腺泡型从呼吸性细支气管到肺泡弥漫受累，周围型看肺泡管和肺泡囊”。腺泡中央型好发于上叶且与吸烟相关，全腺泡型好发于下叶且与α1-抗胰蛋白酶缺乏相关。","chapter":10,"chapterName":"呼吸系统疾病","chapterTitle":"第10章 呼吸系统疾病"},{"id":"pathology-a-single-0153","type":"single","typeLabel":"单选题","number":153,"question":"下列哪项不属于大叶性肺炎的特征","options":[{"key":"A","text":"通常一周后病变消散"},{"key":"B","text":"受累肺叶通气良好"},{"key":"C","text":"有时肺发生纤维化"},{"key":"D","text":"常由肺炎球菌引起"},{"key":"E","text":"肺泡内充满纤维蛋白性渗出物"}],"answerKeys":["B"],"answerText":["受累肺叶通气良好"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：大叶性肺炎的病理分期、肺泡内纤维蛋白性渗出、实变及转归。\n解析：大叶性肺炎常由肺炎链球菌引起，典型病变为肺泡内大量纤维蛋白性渗出物及中性粒细胞，导致肺叶实变；因肺泡隔结构多保留，通常在经过充血水肿期、红色及灰色肝样变期后，约1周进入溶解消散期，渗出物可被溶解吸收。少数病例因渗出物机化可发生肺肉质变及纤维化。题眼是“不属于”：病变肺叶因肺泡腔被渗出物充填，通气功能明显下降，而不是“通气良好”。\n\n选项分析：\nA. 正确（属于该病特征，非答案）：大叶性肺炎经典型病程多在约1周后消退，渗出物溶解吸收，肺组织可恢复正常。\nB. 错误（不属于该病特征，为答案）：大叶性肺炎受累肺叶发生实变，肺泡腔被纤维蛋白性渗出物充填，含气量减少，通气功能受损。\nC. 正确（属于该病特征，非答案）：少数病例渗出物不能完全溶解吸收而发生机化，可形成肺肉质变并伴纤维化。\nD. 正确（属于该病特征，非答案）：大叶性肺炎最常见病原体为肺炎链球菌，故常由肺炎球菌引起。\nE. 正确（属于该病特征，非答案）：大叶性肺炎为肺泡内的急性纤维蛋白性炎，镜下肺泡腔内充满纤维蛋白性渗出物、中性粒细胞等。\n\n易混点：大叶性肺炎以肺泡内渗出性炎为主，肺组织支架多保留，故多数可完全吸收；小叶性肺炎以细支气管为中心的化脓性炎，常伴肺组织破坏。记忆要点：大叶性肺炎“肺泡实变、通气血流障碍但结构多可恢复；机化可致肉质变/纤维化”。","chapter":10,"chapterName":"呼吸系统疾病","chapterTitle":"第10章 呼吸系统疾病"},{"id":"pathology-a-single-0154","type":"single","typeLabel":"单选题","number":154,"question":"膀胱上皮发生鳞状上皮化生后恶性变，这时所形成的恶性肿瘤称为","options":[{"key":"A","text":"膀胱移行细胞癌"},{"key":"B","text":"膀胱癌肉瘤"},{"key":"C","text":"膀胱鳞状细胞癌"},{"key":"D","text":"膀胱腺棘皮癌"},{"key":"E","text":"膀胱腺鳞癌"}],"answerKeys":["C"],"answerText":["膀胱鳞状细胞癌"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：膀胱黏膜上皮鳞状化生后发生恶性变，形成的肿瘤为鳞状细胞癌。\n解析：膀胱正常被覆尿路上皮（移行上皮），在结石、慢性炎症、长期导尿或血吸虫感染等慢性刺激下可发生鳞状上皮化生，化生的鳞状上皮进一步异型增生并可恶变为鳞状细胞癌。其病理学依据是肿瘤细胞具有鳞状上皮分化特征，可见细胞间桥、角化珠或角化不全，常伴明显慢性刺激背景。本题题眼是“鳞状上皮化生后恶性变”，因此应命名为鳞状细胞癌，而不是按正常膀胱上皮来源命名为移行细胞癌。\n选项分析：\nA. 错误：膀胱移行细胞癌（尿路上皮癌）来源于正常尿路上皮，是膀胱最常见恶性肿瘤，但并非“鳞状上皮化生后恶变”所形成的肿瘤。\nB. 错误：膀胱癌肉瘤是具有癌成分和肉瘤成分的双相恶性肿瘤，属于特殊类型肿瘤，与单纯鳞状化生恶变不符。\nC. 正确：鳞状上皮化生后恶变形成具有鳞状分化的恶性肿瘤，即膀胱鳞状细胞癌；镜下可见角化珠、细胞间桥等鳞癌特征。\nD. 错误：膀胱腺棘皮癌是腺癌伴鳞状上皮化生，其中鳞状成分通常为良性，不是鳞状上皮恶变形成的鳞癌。\nE. 错误：膀胱腺鳞癌同时具有腺癌和鳞癌两种恶性成分，属于混合性癌，不是单纯由鳞状化生恶变而来。\n易混点：膀胱最常见的是尿路上皮癌，而鳞状细胞癌常继发于慢性刺激导致的鳞状化生；记忆要点为“正常尿路上皮来源——尿路上皮癌，鳞化恶变——鳞癌”。腺棘皮癌强调腺癌中伴良性鳞状化生，腺鳞癌则是腺癌与鳞癌两种恶性成分并存，注意与单纯鳞癌区分。","chapter":13,"chapterName":"泌尿系统疾病","chapterTitle":"第13章 泌尿系统疾病"},{"id":"pathology-a-single-0155","type":"single","typeLabel":"单选题","number":155,"question":"Krukenberg瘤是指","options":[{"key":"A","text":"胃黏液癌种植转移至膀胱上"},{"key":"B","text":"肺癌种植转移至胸膜上"},{"key":"C","text":"胃黏液癌种植转移至腹膜上"},{"key":"D","text":"胃黏液癌种植转移至肠壁上"},{"key":"E","text":"胃黏液癌种植转移至卵巢上"}],"answerKeys":["E"],"answerText":["胃黏液癌种植转移至卵巢上"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n核心考点：Krukenberg瘤是胃黏液癌/印戒细胞癌转移至卵巢形成的卵巢转移性肿瘤。\n解析：Krukenberg瘤最常见原发灶为胃，尤其是胃黏液癌或印戒细胞癌，肿瘤细胞经腹腔种植等途径累及卵巢，常为双侧性，卵巢可呈实性增大，镜下见印戒样细胞浸润于纤维增生性间质中。本题题眼是“胃黏液癌”与“卵巢”之间的转移关系，而不是一般的腹膜、肠壁或胸膜种植。\n选项分析：\nA. 错误：胃黏液癌种植转移至膀胱表面属于盆腔/腹膜种植累及膀胱浆膜，不称为Krukenberg瘤。\nB. 错误：肺癌种植转移至胸膜形成胸膜转移结节或恶性胸腔积液，与Krukenberg瘤的卵巢转移定义无关。\nC. 错误：胃黏液癌种植至腹膜可形成腹膜种植性癌结节，但未特指卵巢，不能诊断为Krukenberg瘤。\nD. 错误：胃黏液癌种植至肠壁或肠表面属于腹腔种植累及肠管，不是Krukenberg瘤。\nE. 正确：胃黏液癌转移至卵巢是Krukenberg瘤的典型代表，常双侧受累，镜下可见印戒细胞和纤维性间质。\n易混点：Krukenberg瘤不是胃原发癌本身，而是卵巢的转移性黏液癌/印戒细胞癌；胃癌腹膜种植很常见，但只有转移到卵巢并形成特定形态时才称Krukenberg瘤。记忆要点：胃黏液癌＋双侧卵巢＋印戒细胞＝Krukenberg瘤。","chapter":14,"chapterName":"生殖系统和乳腺疾病","chapterTitle":"第14章 生殖系统和乳腺疾病"},{"id":"pathology-a-single-0156","type":"single","typeLabel":"单选题","number":156,"question":"下列哪种疾病最不可能发生结缔组织玻璃样变","options":[{"key":"A","text":"结核病的于酪样坏死"},{"key":"B","text":"纤维型星形胶质细胞瘤"},{"key":"C","text":"肺硅沉着病"},{"key":"D","text":"慢性胸膜炎"},{"key":"E","text":"心肌梗死"}],"answerKeys":["B"],"answerText":["纤维型星形胶质细胞瘤"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：结缔组织玻璃样变的常见病因及形态学本质，即胶原纤维变性、融合形成均质红染的玻璃样物质。\n解析：结缔组织玻璃样变常见于纤维瘢痕、慢性纤维化、陈旧性心肌梗死、慢性胸膜炎、肺硅沉着病等，本质是胶原纤维肿胀、融合并伴糖蛋白沉积，HE染色呈均质红染。纤维型星形胶质细胞瘤起源于神经外胚叶，肿瘤细胞产生的是胶质纤维（GFAP阳性），不是胶原纤维；中枢神经组织本身缺乏结缔组织，故最不可能发生结缔组织玻璃样变。本题题眼是“结缔组织”玻璃样变，而非任何均质红染或纤维性病变。\n选项分析：\nA. 错误（非本题答案）：结核病干酪样坏死本身是坏死，不是结缔组织玻璃样变；但结核病灶在慢性修复、纤维化形成瘢痕时可伴结缔组织玻璃样变，故不是“最不可能”。\nB. 正确（本题答案）：纤维型星形胶质细胞瘤由星形胶质细胞构成，产生胶质纤维而非胶原纤维，且中枢神经组织缺乏结缔组织，故最不可能发生结缔组织玻璃样变。\nC. 错误（非本题答案）：肺硅沉着病形成硅结节，结节内胶原纤维增生并可发生玻璃样变，是结缔组织玻璃样变的典型例子。\nD. 错误（非本题答案）：慢性胸膜炎引起胸膜纤维组织增生、增厚和粘连，纤维瘢痕可发生玻璃样变。\nE. 错误（非本题答案）：心肌梗死后形成陈旧性瘢痕，瘢痕内胶原纤维可发生玻璃样变。\n易混点：干酪样坏死镜下也呈均质红染无结构，易与玻璃样变混淆，但前者本质为坏死，后者为胶原纤维变性；星形胶质细胞瘤中的胶质纤维不是胶原纤维，不能据此判断为结缔组织玻璃样变。记忆要点：结缔组织玻璃样变看“胶原纤维瘢痕”，胶质瘤看“胶质纤维”。","chapter":1,"chapterName":"细胞和组织的适应与损伤","chapterTitle":"第1章 细胞和组织的适应与损伤"},{"id":"pathology-a-single-0157","type":"single","typeLabel":"单选题","number":157,"question":"下列疾病或病变中属于化脓性炎的是","options":[{"key":"A","text":"结肠嗜酸性脓肿"},{"key":"B","text":"肝阿米巴脓肿"},{"key":"C","text":"脊柱旁冷脓肿"},{"key":"D","text":"睾丸树胶样肿"},{"key":"E","text":"淋病尿道炎"}],"answerKeys":["E"],"answerText":["淋病尿道炎"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n核心考点：化脓性炎以中性粒细胞大量渗出并伴组织坏死、脓液形成为基本特征，淋病尿道炎是典型的化脓性炎。\n解析：淋病由淋病奈瑟菌引起，主要累及泌尿生殖道黏膜，表现为急性化脓性尿道炎，镜下可见尿道黏膜充血、水肿，大量中性粒细胞浸润并形成脓性分泌物。题眼在于“化脓性炎”强调中性粒细胞渗出和脓液形成，而其他选项虽名称中含“脓肿”或“肿”，本质分别为寄生虫性、阿米巴性、结核性和梅毒性病变。\n\n选项分析：\nA. 错误：结肠嗜酸性脓肿多见于寄生虫感染或变态反应性病变，以嗜酸性粒细胞浸润为主，不属于中性粒细胞渗出为主的化脓性炎。\nB. 错误：肝阿米巴脓肿是溶组织内阿米巴滋养体引起的液化性坏死，局部形成“脓肿”样腔隙，并非真正化脓性炎，脓液成分也不是以中性粒细胞为主。\nC. 错误：脊柱旁冷脓肿属于结核性病变，由干酪样坏死和结核性肉芽肿构成，因缺乏急性化脓性炎的红、热、痛表现而称“冷脓肿”，不是化脓性炎。\nD. 错误：睾丸树胶样肿是三期梅毒的典型病变，本质为凝固性坏死及周围肉芽组织增生，属于梅毒性肉芽肿性炎，不是化脓性炎。\nE. 正确：淋病尿道炎由淋病奈瑟菌感染引起，尿道黏膜急性化脓性炎，大量中性粒细胞渗出并形成脓性分泌物，符合化脓性炎定义。\n\n易混点：名称中有“脓肿”不等于化脓性炎，阿米巴脓肿、冷脓肿均为液化性坏死或干酪样坏死；树胶样肿为梅毒性肉芽肿。记忆要点：真正化脓性炎看“中性粒细胞+脓液”，淋球菌、金黄色葡萄球菌等引起的急性感染最典型。","chapter":4,"chapterName":"炎症","chapterTitle":"第4章 炎症"},{"id":"pathology-a-single-0158","type":"single","typeLabel":"单选题","number":158,"question":"股静脉内较大的血栓完全机化需要","options":[{"key":"A","text":"2天"},{"key":"B","text":"1周"},{"key":"C","text":"2周"},{"key":"D","text":"1个月"},{"key":"E","text":"2个月"}],"answerKeys":["C"],"answerText":["2周"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：血栓机化的基本过程及完全机化所需时间。\n解析：血栓机化是指肉芽组织从血栓附着处血管壁长入血栓，逐渐溶解、吸收并替代血栓的过程。一般血栓形成后第3天左右开始机化，约2周可完全机化，因此股静脉内较大的血栓完全机化常考时间为2周。本题题眼是“完全机化”，不是血栓形成早期变化，也不是再通或钙化。\n选项分析：\nA. 错误：2天处于血栓形成早期，机化尚未充分开始或仅刚刚启动，肉芽组织尚未完全长入并替代血栓，不能达到完全机化。\nB. 错误：1周时血栓机化正在进行，肉芽组织可部分长入，但尚未达到完全机化程度。\nC. 正确：血栓机化约在形成后2周完成，股静脉内较大血栓完全机化按教材常考时间为2周，符合肉芽组织逐渐替代血栓的病理过程。\nD. 错误：1个月不是本题所考查的完全机化标准时间；此时血栓多已机化，但标准答案强调约2周，不能将“已机化”与“完全机化所需时间”混淆。\nE. 错误：2个月时间过长，不是血栓完全机化的常考时限；若长期存在可发生钙化等改变，但不属于本题所问的机化完成时间。\n易混点：机化开始约在血栓形成后3天，完全机化约2周；再通是机化过程中血栓内部裂隙被内皮覆盖形成血流通道；钙化多发生于长期未机化或机化不完全的血栓。记忆要点：血栓“三天开始、两周完全机化”，再通和钙化是后续不同转归。","chapter":3,"chapterName":"局部血液循环障碍","chapterTitle":"第3章 局部血液循环障碍"},{"id":"pathology-a-single-0159","type":"single","typeLabel":"单选题","number":159,"question":"肺硅沉着病的特征性病变是","options":[{"key":"A","text":"玻璃样硅结节形成"},{"key":"B","text":"肺间质纤维化"},{"key":"C","text":"肺间质纤维化玻璃样变"},{"key":"D","text":"硅肺性空洞形成"},{"key":"E","text":"胸膜纤维化"}],"answerKeys":["A"],"answerText":["玻璃样硅结节形成"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：A\n核心考点：硅肺（肺硅沉着病）的特征性病变是硅结节形成，典型表现为同心圆层状排列的胶原纤维玻璃样变。\n解析：硅肺的基本病变包括硅结节形成和肺间质弥漫性纤维化，其中硅结节是特征性、诊断性病变。硅结节早期为巨噬细胞聚集的细胞性结节，随后纤维化并发生玻璃样变，肉眼呈灰白色、质硬、境界清楚的结节，触之有砂粒感；镜下典型为同心圆层状排列的玻璃样变胶原纤维。题眼是“特征性病变”，应选玻璃样硅结节形成。\n\n选项分析：\nA. 正确：玻璃样硅结节是硅肺最具特征性的病理改变，由吞噬硅尘的巨噬细胞聚集、纤维化并玻璃样变形成，常位于肺门淋巴结及肺内淋巴管、肺间质，近肺门处较密集。\nB. 错误：肺间质纤维化是硅肺的基本病变之一，但缺乏特异性，也可见于其他间质性肺病，不如硅结节具有诊断意义。\nC. 错误：此选项把“硅结节内胶原纤维玻璃样变”错误表述为“肺间质纤维化玻璃样变”；玻璃样变主要发生在硅结节内，而不是笼统的肺间质纤维化。\nD. 错误：硅肺性空洞多提示合并肺结核，结核坏死物液化排出后形成空洞；空洞不是硅肺本身的特征性病变。\nE. 错误：胸膜纤维化、胸膜增厚可见于硅肺，也可见于石棉肺等其他尘肺，属于非特征性继发改变。\n\n易混点：硅肺的“特征性病变”是硅结节，而“基本病变”还包括肺间质弥漫性纤维化，答题时要区分“特征性”和“伴随/非特异”改变。硅结节玻璃样变是结节内胶原纤维的玻璃样变，不要误写成肺间质纤维化玻璃样变；出现空洞时应优先想到合并肺结核。","chapter":10,"chapterName":"呼吸系统疾病","chapterTitle":"第10章 呼吸系统疾病"},{"id":"pathology-a-single-0160","type":"single","typeLabel":"单选题","number":160,"question":"出现箭头所指图1、2改变的可能的肾炎是","options":[{"key":"A","text":"急性肾小球肾炎"},{"key":"B","text":"急进性肾小球肾炎"},{"key":"C","text":"急性肾盂肾炎"},{"key":"D","text":"慢性肾盂肾炎"},{"key":"E","text":"肾癌"}],"answerKeys":["B"],"answerText":["急进性肾小球肾炎"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n\n核心考点：急进性肾小球肾炎的病理特征是肾小球囊内新月体形成。\n\n解析：题目图片未提供，不能描述箭头所指的具体图像细节，仅依据文字信息和标准答案分析。急进性肾小球肾炎的关键病变是肾小球囊壁层上皮细胞和单核细胞增生，伴纤维蛋白渗出，形成新月体，压迫肾小球毛细血管丛并使其闭塞，临床多表现为急进性肾炎综合征，短期内发生少尿、无尿和肾功能衰竭。本题题眼是“图1、2改变”对应新月体性肾小球肾炎，即急进性肾小球肾炎。\n\n选项分析：\nA. 错误：急性肾小球肾炎为毛细血管内增生性肾小球肾炎，主要见内皮细胞、系膜细胞增生和中性粒细胞浸润，可有上皮下驼峰状免疫复合物沉积，一般不形成新月体。\nB. 正确：急进性肾小球肾炎以肾小球囊内新月体形成为核心病变，可由抗肾小球基膜抗体、免疫复合物或寡免疫复合物机制引起，病变进展快，肾功能迅速恶化。\nC. 错误：急性肾盂肾炎是肾盂、肾盏和肾间质的化脓性炎，镜下以中性粒细胞浸润和肾小管腔内中性粒细胞管型为特征，不是肾小球新月体性病变。\nD. 错误：慢性肾盂肾炎是慢性间质性炎症伴纤维化，肾盂肾盏变形，镜下可见纤维组织增生、慢性炎细胞浸润及甲状腺样滤泡，并非新月体性肾小球肾炎。\nE. 错误：肾癌是肾脏上皮性恶性肿瘤，常见透明细胞癌，癌细胞呈巢状排列，间质血管丰富，属于肿瘤性病变，不是肾小球炎症。\n\n易混点：急性肾小球肾炎与急进性肾小球肾炎均可有血尿、蛋白尿和肾功能损害，但前者以毛细血管内细胞增生和驼峰状沉积为特点，后者以新月体形成为标志。急性肾盂肾炎为化脓性间质炎，慢性肾盂肾炎为纤维化及肾盂肾盏变形，均不应与肾小球肾炎混淆。","chapter":13,"chapterName":"泌尿系统疾病","chapterTitle":"第13章 泌尿系统疾病","needsImage":true},{"id":"pathology-a-single-0161","type":"single","typeLabel":"单选题","number":161,"question":"葡萄胎患者经彻底刮宫后，连续监测血、尿中hCG，如持续升高，说明","options":[{"key":"A","text":"正常"},{"key":"B","text":"胎儿仍存活"},{"key":"C","text":"恶变"},{"key":"D","text":"怀孕"},{"key":"E","text":"复发"}],"answerKeys":["C"],"answerText":["恶变"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：葡萄胎彻底刮宫后血、尿hCG持续升高，提示滋养细胞肿瘤性增生，即恶变。\n解析：葡萄胎属于妊娠滋养细胞疾病，完全性葡萄胎无胎儿，刮宫后hCG应逐渐下降并转阴。若hCG持续不降、平台或再次升高，说明滋养细胞仍有异常增生和侵袭能力，最常见于侵蚀性葡萄胎，也可为绒毛膜癌，因此提示恶变。本题题眼是“彻底刮宫后”仍“持续升高”，应警惕妊娠滋养细胞肿瘤，而不是正常恢复或单纯妊娠。\n\n选项分析：\nA. 错误：正常葡萄胎清宫后hCG应进行性下降至正常，持续升高不是正常表现。\nB. 错误：完全性葡萄胎无胎儿；即使部分性葡萄胎合并胎儿，彻底刮宫后也不能以hCG持续升高说明胎儿仍存活，且该说法不符合葡萄胎随访的病理意义。\nC. 正确：持续升高的hCG提示残留滋养细胞发生侵袭性增生或肿瘤性转化，即恶变，需结合影像学和病理进一步判断侵蚀性葡萄胎或绒癌。\nD. 错误：再次妊娠可使hCG升高，但本题强调葡萄胎彻底刮宫后连续监测持续升高，考试语境下指向滋养细胞肿瘤恶变；如考虑妊娠需有明确停经、妊娠证据并动态鉴别。\nE. 错误：葡萄胎复发也可表现为hCG再次升高，但“持续升高”更直接提示滋养细胞肿瘤恶变；复发通常指再次发生葡萄胎，需影像、病理及随访综合判断。\n\n易混点：侵蚀性葡萄胎多继发于葡萄胎，镜下可见绒毛结构；绒毛膜癌可继发于葡萄胎、流产或足月产，镜下无绒毛结构。记忆要点：葡萄胎清宫后hCG持续升高首先考虑恶变，区分侵蚀性葡萄胎与绒癌的关键是有无绒毛结构。","chapter":14,"chapterName":"生殖系统和乳腺疾病","chapterTitle":"第14章 生殖系统和乳腺疾病"},{"id":"pathology-a-single-0162","type":"single","typeLabel":"单选题","number":162,"question":"关于慢性硬化性肾小球肾炎的叙述，下列正确的是","options":[{"key":"A","text":"无肾小球肾炎的病史"},{"key":"B","text":"可形成原发性颗粒性固缩肾"},{"key":"C","text":"蛋白尿、管型尿进行性加重"},{"key":"D","text":"常有贫血、持续性高血压和肾功能不全"},{"key":"E","text":"最常见的死亡原因是冠心病"}],"answerKeys":["D"],"answerText":["常有贫血、持续性高血压和肾功能不全"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：慢性硬化性肾小球肾炎（慢性肾小球肾炎）终末期表现为继发性颗粒性固缩肾，并出现慢性肾功能不全的临床综合征。\n解析：慢性硬化性肾小球肾炎由多种肾小球肾炎进展而来，大量肾小球纤维化、玻璃样变，残存肾单位代偿性肥大，最终形成双肾对称性缩小、表面细颗粒状的继发性颗粒性固缩肾。由于肾单位大量破坏，肾素-血管紧张素系统激活引起持续性高血压，促红细胞生成素减少及毒素蓄积导致贫血，肾小球滤过率下降出现肾功能不全。本题题眼是“慢性硬化性肾小球肾炎”的终末期表现，即贫血、持续性高血压和肾功能不全。\n选项分析：\nA. 错误：慢性硬化性肾小球肾炎多数有急性或慢性肾小球肾炎病史，部分可隐匿起病，但不能说“无肾小球肾炎的病史”。\nB. 错误：本病形成的是继发性颗粒性固缩肾；原发性颗粒性固缩肾是良性高血压病的肾脏病变，二者病因和发生机制不同。\nC. 错误：蛋白尿、管型尿在病变早期较明显，晚期因大量肾小球纤维化、滤过率显著下降，蛋白漏出反而可减轻，并非进行性加重。\nD. 正确：大量肾单位破坏致肾功能不全，肾素-血管紧张素系统激活致持续性高血压，促红细胞生成素减少及尿毒症毒素蓄积致贫血，为慢性肾衰竭的典型表现。\nE. 错误：本病最常见死亡原因是尿毒症/慢性肾功能衰竭，而非冠心病；高血压可促进动脉粥样硬化并并发冠心病，但不是最常见死因。\n易混点：继发性颗粒性固缩肾见于慢性硬化性肾小球肾炎，双肾对称缩小、表面细颗粒；原发性颗粒性固缩肾见于良性高血压；慢性肾盂肾炎则表现为双肾不对称性瘢痕收缩。记忆要点： “原发性—高血压，继发性—肾炎”。","chapter":13,"chapterName":"泌尿系统疾病","chapterTitle":"第13章 泌尿系统疾病"},{"id":"pathology-a-single-0163","type":"single","typeLabel":"单选题","number":163,"question":"原发性高血压脑出血最常见的部位是","options":[{"key":"A","text":"大脑皮质"},{"key":"B","text":"豆状核和丘脑"},{"key":"C","text":"蛛网膜下隙"},{"key":"D","text":"内囊和基底核"},{"key":"E","text":"侧脑室"}],"answerKeys":["D"],"answerText":["内囊和基底核"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：原发性高血压脑出血的好发部位及血管病理机制。\n解析：原发性高血压时，脑内细小穿通动脉长期承受高压，发生纤维素样坏死、微动脉瘤形成，血压骤升时破裂出血。最典型的好发部位是内囊和基底核，常由豆纹动脉破裂所致，出血可压迫内囊出现“三偏”症状，也可破入侧脑室。题眼是“原发性高血压脑出血最常见部位”，应锁定内囊-基底核区。\n\n选项分析：\nA. 错误：大脑皮质出血多见于脑淀粉样血管病、动静脉畸形等，不是原发性高血压脑出血的经典最常见部位。\nB. 错误：豆状核属于基底核，丘脑出血在高血压脑出血中也可发生，但本题标准定位为内囊和基底核；该选项把丘脑并列，表述不如D准确。\nC. 错误：蛛网膜下隙出血的典型病因是先天性颅内动脉瘤破裂等；高血压脑出血可破入蛛网膜下隙，但并非原发最常见部位。\nD. 正确：高血压使豆纹动脉等穿通支发生微动脉瘤和纤维素样坏死，破裂后最常形成内囊-基底核区出血，是考试常考的经典定位。\nE. 错误：侧脑室出血多为基底核区出血破入脑室所致，属于继发表现，不是原发性高血压脑出血最常见的原发部位。\n\n易混点：高血压脑出血最常累及基底核区，其中壳核（豆状核的一部分）最常见，内囊常受压或受累；丘脑也可出血，但经典考题答案常表述为内囊和基底核。蛛网膜下隙出血要首先想到先天性动脉瘤破裂，脑室出血多考虑继发破入脑室。","chapter":9,"chapterName":"心血管系统疾病","chapterTitle":"第9章 心血管系统疾病"},{"id":"pathology-a-single-0164","type":"single","typeLabel":"单选题","number":164,"question":"坏死和坏疽的主要区别是","options":[{"key":"A","text":"发生部位不同"},{"key":"B","text":"发生原因不同"},{"key":"C","text":"有无腐败菌感染"},{"key":"D","text":"是否存在淤血"},{"key":"E","text":"动脉阻塞程度不同"}],"answerKeys":["C"],"answerText":["有无腐败菌感染"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：坏疽是坏死组织继发腐败菌感染而形成的一种特殊类型坏死，坏死与坏疽的主要区别在于有无腐败菌感染。\n解析：坏死是活体内局部组织、细胞死亡，可发生于全身多种组织器官，其基本病理变化包括细胞核固缩、核碎裂、核溶解及胞质嗜酸性增强等。坏疽则是在坏死基础上合并腐败菌感染，腐败菌分解坏死组织产生硫化氢，与血红蛋白中的铁结合形成硫化铁，使组织呈黑色、暗绿色等特殊外观，并常伴恶臭。因此，坏疽的本质仍是坏死，但“继发腐败菌感染”是其区别于一般坏死的题眼。\n选项分析：\nA. 错误：坏疽好发于四肢末端或与外界相通的内脏，但一般坏死也可发生于全身各处。发生部位不同不是坏死与坏疽的本质区别。\nB. 错误：坏疽常继发于缺血、动脉阻塞等，也可与感染有关；一般坏死的原因包括缺氧、理化因素、生物因素等。发生原因不能概括二者主要区别。\nC. 正确：坏疽是坏死组织合并腐败菌感染后的特殊表现，有无腐败菌感染是坏死与坏疽的主要区别。\nD. 错误：湿性坏疽常与静脉回流受阻、明显淤血水肿有关，但淤血也可见于其他坏死或循环障碍。是否存在淤血不是坏死与坏疽的主要区别。\nE. 错误：动脉阻塞程度是区分干性坏疽、湿性坏疽等类型的参考因素，但不是坏死与坏疽的主要区别；坏疽的关键仍是腐败菌感染。\n易混点：坏疽不是独立于坏死之外的另一种细胞死亡方式，而是坏死的特殊类型，分为干性、湿性、气性坏疽。干性坏疽多因动脉阻塞而静脉回流尚可，坏死组织干燥皱缩、界线清楚；湿性坏疽多伴静脉回流受阻和明显腐败菌感染，肿胀、恶臭、界线不清；气性坏疽由产气荚膜梭菌等引起，伴大量气体。记忆要点：坏死看“细胞死亡”，坏疽看“坏死＋腐败菌感染”。","chapter":1,"chapterName":"细胞和组织的适应与损伤","chapterTitle":"第1章 细胞和组织的适应与损伤"},{"id":"pathology-a-single-0165","type":"single","typeLabel":"单选题","number":165,"question":"病理诊断肉瘤的主要依据是","options":[{"key":"A","text":"间质稀少"},{"key":"B","text":"血液供应丰富"},{"key":"C","text":"有肺转移"},{"key":"D","text":"瘤细胞呈弥散分布"},{"key":"E","text":"浸润性生长"}],"answerKeys":["D"],"answerText":["瘤细胞呈弥散分布"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n\n核心考点：肉瘤的组织学结构特点是瘤细胞弥漫分布，这是病理诊断肉瘤的主要依据。\n\n解析：肉瘤是来源于间叶组织的恶性肿瘤。镜下典型表现为瘤细胞丰富、间质相对稀少，瘤细胞呈弥漫性分布，不形成癌常见的巢状、索状或腺管状结构，实质与间质分界不清。题眼在于“病理诊断依据”，应抓住组织学结构特点，因此选D。肉瘤虽常血供丰富、易血道转移至肺，但这些不是病理诊断肉瘤的主要依据。\n\n选项分析：\nA. 错误：间质稀少是肉瘤常见的组织学特点之一，但并非诊断肉瘤的主要依据；癌的间质相对较多，但仅凭间质多少不能可靠区分。\nB. 错误：血液供应丰富可见于肉瘤，也可见于其他生长活跃的肿瘤，缺乏诊断特异性，不能作为主要依据。\nC. 错误：肺转移提示肉瘤多经血道转移，属于转移途径和临床特点，不是显微镜下病理诊断肉瘤的主要依据。\nD. 正确：肉瘤细胞多呈弥漫分布，实质与间质分界不清，不形成上皮性肿瘤的巢状、腺管状结构，是病理诊断肉瘤的重要组织学依据。\nE. 错误：浸润性生长是恶性肿瘤的共同特征，癌和肉瘤均可浸润性生长，不能据此诊断肉瘤或区分癌与肉瘤。\n\n易混点：癌与肉瘤的关键鉴别是：癌来源于上皮组织，癌细胞常呈巢状、索状、腺管状排列，实质与间质分界较清，多经淋巴道转移；肉瘤来源于间叶组织，瘤细胞弥漫分布，实质与间质分界不清，多经血道转移。记忆要点：癌“成巢”，肉瘤“弥漫”。","chapter":6,"chapterName":"肿瘤","chapterTitle":"第6章 肿瘤"},{"id":"pathology-a-single-0166","type":"single","typeLabel":"单选题","number":166,"question":"下述哪种病变不会出现冠状动脉粥样硬化","options":[{"key":"A","text":"心肌的变性和坏死"},{"key":"B","text":"心肌内糖原沉积"},{"key":"C","text":"心肌间质出血"},{"key":"D","text":"心肌的代偿性肥大"},{"key":"E","text":"心肌内纤维化"}],"answerKeys":["B"],"answerText":["心肌内糖原沉积"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：冠状动脉粥样硬化引起心肌缺血缺氧后的继发性心肌病理改变，以及心肌糖原沉积的病因归属。\n解析：冠状动脉粥样硬化造成管腔狭窄、供血不足，心肌可发生缺血性变性、坏死；慢性缺血及坏死修复后可出现心肌间质纤维化；残存心肌可代偿性肥大；严重缺血、坏死及血管损伤时可见心肌间质出血。本题题眼是“不会出现”，心肌内糖原沉积主要见于糖原贮积病等代谢性疾病，不是冠状动脉粥样硬化的心肌病变。\n\n选项分析：\nA. 正确：冠状动脉粥样硬化导致心肌缺血缺氧，可引起心肌细胞变性甚至坏死，是缺血性心肌损伤的基本表现。\nB. 错误：心肌内糖原沉积属于糖原贮积病等代谢障碍性疾病，并非冠状动脉粥样硬化的病理改变；本题标准答案即选此项。\nC. 正确：严重心肌缺血、坏死及血管损伤时，可伴心肌间质出血，属于冠状动脉粥样硬化所致心肌损伤的继发改变之一。\nD. 正确：长期冠状动脉供血不足时，残存心肌可发生代偿性肥大，以维持心功能。\nE. 正确：心肌缺血坏死后的修复及慢性缺血刺激可导致心肌间质纤维化，形成缺血性心肌纤维化。\n\n易混点：心肌变性坏死、间质出血多见于急性缺血性损伤；心肌纤维化多为陈旧性梗死或慢性缺血修复结果；代偿性肥大是残存心肌的功能代偿。心肌内糖原沉积应联想到糖原贮积病，尤其 Pompe 病，不要与冠心病心肌病变混淆。","chapter":9,"chapterName":"心血管系统疾病","chapterTitle":"第9章 心血管系统疾病"},{"id":"pathology-a-single-0167","type":"single","typeLabel":"单选题","number":167,"question":"关于浆细胞下列错误的是","options":[{"key":"A","text":"正常时不存在于血液中"},{"key":"B","text":"无吞噬功能"},{"key":"C","text":"来源于T淋巴细胞"},{"key":"D","text":"椭圆形，核位于胞质一端，核染色呈车轮状分布"},{"key":"E","text":"胞质内有丰富的粗面内质网"}],"answerKeys":["C"],"answerText":["来源于T淋巴细胞"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：浆细胞的来源、形态特点及功能，尤其是浆细胞由B淋巴细胞分化而来。\n解析：浆细胞是B淋巴细胞受到抗原刺激后分化而成的终末效应细胞，主要功能是合成和分泌免疫球蛋白（抗体），因此胞质内有丰富的粗面内质网。其形态特点为卵圆形，核偏位，染色质呈车轮状或钟面状分布。浆细胞无吞噬功能，正常情况下不出现于外周血中。本题题眼是“错误的是”，C项将浆细胞来源说成T淋巴细胞，故错误。\n\n选项分析：\nA. 正确：正常情况下浆细胞主要存在于淋巴结、脾、黏膜相关淋巴组织等部位，外周血中通常不见或极少见，因此“正常时不存在于血液中”符合病理学考试表述。\nB. 正确：浆细胞是产生抗体的效应细胞，无吞噬功能；具有吞噬功能的主要是巨噬细胞、中性粒细胞等。\nC. 错误：浆细胞来源于B淋巴细胞，而非T淋巴细胞。B淋巴细胞受抗原刺激后分化为浆细胞；T淋巴细胞主要参与细胞免疫，可分化为效应T细胞和记忆T细胞。\nD. 正确：浆细胞呈椭圆形，核位于胞质一端，染色质呈粗块状、车轮状分布，这是浆细胞典型的形态学特征。\nE. 正确：浆细胞合成大量免疫球蛋白，胞质内有丰富的粗面内质网，光镜下胞质呈嗜碱性，核旁可见淡染区。\n\n易混点：浆细胞与B淋巴细胞要区分：B淋巴细胞是浆细胞的前体，浆细胞是分泌抗体的终末细胞；浆细胞与巨噬细胞要区分：前者无吞噬功能、核偏位呈车轮状，后者有吞噬功能。记忆要点：B细胞分化为浆细胞，浆细胞产抗体，胞质粗面内质网丰富。","chapter":4,"chapterName":"炎症","chapterTitle":"第4章 炎症"},{"id":"pathology-a-single-0168","type":"single","typeLabel":"单选题","number":168,"question":"下列配对哪项是错误的","options":[{"key":"A","text":"皮肤表层水泡－化脓性炎"},{"key":"B","text":"大叶性肺炎－纤维素性炎"},{"key":"C","text":"风湿性关节炎－浆液性炎"},{"key":"D","text":"结核病－肉芽肿性炎"},{"key":"E","text":"皮肤疖－化脓性炎"}],"answerKeys":["A"],"answerText":["皮肤表层水泡－化脓性炎"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：A\n核心考点：炎症类型的病理学配对，重点区分浆液性炎与化脓性炎的渗出物性质及常见病变。\n解析：皮肤表层水泡通常属于浆液性炎，渗出液以浆液为主，清亮或淡黄色，常见于烫伤、病毒感染等；化脓性炎则以大量中性粒细胞渗出、组织坏死和脓液形成为特征，典型病变是疖、痈、化脓性阑尾炎等。本题题眼在“水泡”而非“脓疱”：水泡内容物不是脓液，因此不能配成化脓性炎。大叶性肺炎、风湿性关节炎、结核病和皮肤疖的配对均符合各炎症类型的基本病理特点。\n\n选项分析：\nA. 错误：皮肤表层水泡多为浆液性炎，渗出液主要成分是浆液，可含少量纤维蛋白和炎细胞；化脓性炎应形成脓液，表现为脓疱、脓肿或化脓性渗出，不能仅因皮肤起泡就归为化脓性炎。此为本题正确答案。\nB. 正确：大叶性肺炎属于纤维素性炎，病变累及肺泡，肺泡腔内大量纤维素性渗出，常与肺泡壁毛细血管通透性增高有关。\nC. 正确：风湿性关节炎急性期多表现为浆液性炎或浆液纤维素性炎，滑膜及关节周围组织渗出，关节腔积液，临床呈游走性、多发性关节痛，一般不留关节畸形。\nD. 正确：结核病属于肉芽肿性炎，典型为结核结节，中央常伴干酪样坏死，周围有上皮样细胞、朗汉斯巨细胞及淋巴细胞。\nE. 正确：皮肤疖是毛囊及其周围组织的化脓性炎，主要由金黄色葡萄球菌引起，病灶内大量中性粒细胞浸润并形成脓液。\n\n易混点：浆液性炎与化脓性炎的关键区别在渗出物性质：浆液性炎以清亮浆液渗出为主，水疱是典型表现；化脓性炎以中性粒细胞和脓液为主，常形成脓疱或脓肿。记忆时可抓“清亮水疱属浆液，浑浊脓液属化脓；结核结节属肉芽肿，大叶性肺炎属纤维素性炎”。","chapter":4,"chapterName":"炎症","chapterTitle":"第4章 炎症"},{"id":"pathology-a-single-0169","type":"single","typeLabel":"单选题","number":169,"question":"不符合肿瘤性生长的特点是","options":[{"key":"A","text":"与机体的需要不协调"},{"key":"B","text":"致瘤因素消除后就不继续生长"},{"key":"C","text":"生长旺盛"},{"key":"D","text":"不同程度失去分化成熟能力"},{"key":"E","text":"相对自主性生长"}],"answerKeys":["B"],"answerText":["致瘤因素消除后就不继续生长"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：肿瘤性生长的自主性及其与反应性增生、适应性增生的区别。\n解析：肿瘤性生长是由基因异常驱动的克隆性增生，具有相对自主性，表现为与机体需要不协调、生长较旺盛、不同程度失去分化成熟能力；即使致瘤因素已消除，肿瘤细胞因遗传物质改变仍可继续生长。B项“致瘤因素消除后就不继续生长”描述的是增生、肥大等反应性/适应性过程的特点，不符合肿瘤性生长。本题题眼是“不符合”，应选描述非肿瘤性生长的选项。\n\n选项分析：\nA. 正确：肿瘤性生长与机体需要不协调，不受正常生长调控，属于肿瘤自主性生长的表现之一。\nB. 错误：肿瘤细胞已发生基因水平改变，即使致瘤因素去除，仍常可继续生长；这恰是肿瘤性生长与一般反应性增生的重要区别。\nC. 正确：肿瘤性生长通常增殖较旺盛，可出现接触抑制丧失、持续增殖等表现；但需注意良性肿瘤也可生长缓慢，不能把“旺盛”绝对化为所有肿瘤都快速生长。\nD. 正确：肿瘤细胞不同程度失去分化成熟能力，异型性大小与分化程度相关，是肿瘤性生长的重要形态学特点。\nE. 正确：肿瘤性生长具有相对自主性，即虽可受宿主内分泌、免疫等因素影响，但基本不受机体正常调控。\n\n易混点：反应性增生、代偿性肥大等在去除刺激后多可停止或消退，且分化成熟、排列较规则；肿瘤性增生由基因异常驱动，去除致瘤因素后仍可持续生长，并伴分化不成熟和异型性。记忆要点：肿瘤生长“相对自主、不协调、持续、失分化”。","chapter":6,"chapterName":"肿瘤","chapterTitle":"第6章 肿瘤"},{"id":"pathology-a-single-0170","type":"single","typeLabel":"单选题","number":170,"question":"梅毒的特征性病变是","options":[{"key":"A","text":"明显干酪样坏死"},{"key":"B","text":"玫瑰疹"},{"key":"C","text":"树胶样肿"},{"key":"D","text":"象皮肿"},{"key":"E","text":"异物肉芽肿"}],"answerKeys":["C"],"answerText":["树胶样肿"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：梅毒的特征性病变为树胶样肿（梅毒瘤），属于三期梅毒的肉芽肿性病变。\n解析：树胶样肿由类上皮细胞、淋巴细胞、浆细胞和成纤维细胞构成，中央为凝固性坏死（树胶样坏死），质地坚韧如树胶，故得名；镜下常见浆细胞浸润及闭塞性动脉内膜炎、血管周围炎。题眼是“特征性病变”，应选三期梅毒最具诊断意义的树胶样肿。需注意硬性下疳是一期梅毒典型表现，玫瑰疹是二期梅毒皮疹，均不是本题所问的病理学特征性病变。\n选项分析：\nA. 错误：明显干酪样坏死是结核病的典型病变，中央坏死彻底、呈豆腐渣样；梅毒树胶样肿虽可有坏死，但并非以“明显干酪样坏死”为特征。\nB. 错误：玫瑰疹是二期梅毒常见的皮肤斑疹，属于临床表现而非特征性病理病变，不能作为梅毒的特征性病变。\nC. 正确：树胶样肿是三期梅毒的特征性病变，为感染性肉芽肿，中央凝固性坏死，周围有类上皮细胞、淋巴细胞、浆细胞及成纤维细胞，常伴闭塞性动脉内膜炎。\nD. 错误：象皮肿是淋巴回流受阻所致，典型见于丝虫病，也可见于反复丹毒等；表现为皮肤和皮下组织显著增厚、变硬，不是梅毒特征。\nE. 错误：异物肉芽肿是对异物（如缝线、滑石粉等）的肉芽肿性反应，可见异物巨细胞；梅毒树胶样肿属感染性肉芽肿，并非异物肉芽肿。\n易混点：结核结节中央为干酪样坏死，梅毒树胶样肿中央为凝固性坏死且浆细胞浸润明显；记忆要点是“结核—干酪样坏死，梅毒—树胶样肿，丝虫—象皮肿”。玫瑰疹只是二期梅毒皮疹，不要与特征性病理病变混淆。","chapter":18,"chapterName":"传染病","chapterTitle":"第18章 传染病"},{"id":"pathology-a-single-0171","type":"single","typeLabel":"单选题","number":171,"question":"下列哪项不是慢性肾盂肾炎的主要病变特点","options":[{"key":"A","text":"病变可单侧也可双侧发生，且两侧改变不对称"},{"key":"B","text":"肉眼观表现为肾体积缩小，有瘢痕"},{"key":"C","text":"均由急性肾盂肾炎转变而来"},{"key":"D","text":"代偿扩张的肾小管内可出现甲状腺滤泡样管型"},{"key":"E","text":"肾盂、肾盏变形，黏膜粗糙"}],"answerKeys":["C"],"answerText":["均由急性肾盂肾炎转变而来"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：慢性肾盂肾炎的病理形态特点及其与急性肾盂肾炎的关系。\n解析：慢性肾盂肾炎是肾盂、肾盏和肾间质的慢性化脓性炎症伴纤维化，病变常不对称，可单侧或双侧发生；晚期因纤维瘢痕收缩导致肾脏缩小、表面凹凸不平，肾盂肾盏变形，肾小管可扩张并出现均质红染的胶样管型，形似甲状腺滤泡。其来源并非“均由急性肾盂肾炎转变而来”，部分可反复隐匿感染、尿路梗阻或膀胱输尿管反流等基础上发生；急性肾盂肾炎多数可痊愈。本题题眼在“均”字绝对化。\n\n选项分析：\nA. 正确：慢性肾盂肾炎可单侧或双侧发生，且因感染、梗阻、反流等因素不同，两侧病变常不对称，这是与慢性肾小球肾炎双肾对称性缩小的重要区别。\nB. 正确：晚期慢性肾盂肾炎因间质纤维化、瘢痕收缩，肉眼观肾脏体积缩小、表面有不规则瘢痕，质地变硬。\nC. 错误：慢性肾盂肾炎可由反复急性发作迁延而来，但并非均由急性肾盂肾炎转变；部分病例无明确急性肾盂肾炎病史，可在尿路梗阻、反流等基础上隐匿进展。\nD. 正确：慢性肾盂肾炎时肾小管因间质纤维化、梗阻而扩张，腔内可见均质红染的胶样管型，镜下似甲状腺滤泡，为常考形态学特点。\nE. 正确：慢性炎症和纤维化可致肾盂、肾盏变形，黏膜粗糙、增厚，并可伴有瘢痕牵拉。\n\n易混点：慢性肾盂肾炎与慢性肾小球肾炎均可致肾缩小、瘢痕，但前者病变不对称、累及肾盂肾盏、常有甲状腺滤泡样管型；后者双肾对称性弥漫性颗粒性萎缩。记忆要点：肾盂肾炎是“化脓性间质炎症”，瘢痕不对称；慢性肾小球肾炎是“双肾对称小球硬化”。","chapter":13,"chapterName":"泌尿系统疾病","chapterTitle":"第13章 泌尿系统疾病"},{"id":"pathology-a-single-0172","type":"single","typeLabel":"单选题","number":172,"question":"血管内皮细胞、成纤维细胞、淋巴细胞常见于","options":[{"key":"A","text":"急性炎症"},{"key":"B","text":"炎性肉芽组织"},{"key":"C","text":"伤口愈合处"},{"key":"D","text":"肉芽肿性炎"},{"key":"E","text":"化脓性炎症"}],"answerKeys":["B"],"answerText":["炎性肉芽组织"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n\n核心考点：炎性肉芽组织的组成成分及其在修复中的作用。\n\n解析：炎性肉芽组织是组织损伤后由新生毛细血管、成纤维细胞及炎性细胞（常见中性粒细胞、巨噬细胞、淋巴细胞等）共同构成的幼稚结缔组织。题干中的血管内皮细胞对应新生毛细血管，成纤维细胞负责产生胶原纤维，淋巴细胞属于浸润的炎性细胞，因此三者共同出现最符合炎性肉芽组织。题眼在于“血管内皮细胞＋成纤维细胞＋淋巴细胞”这一组合，提示修复性肉芽组织而非单纯急性渗出或特异性肉芽肿。\n\n选项分析：\nA. 错误：急性炎症以血管扩张、渗出和中性粒细胞浸润为主，虽可有内皮细胞活化，但成纤维细胞和淋巴细胞不是其主要成分，不能概括题干三种细胞。\nB. 正确：炎性肉芽组织由新生毛细血管（内皮细胞增生）、成纤维细胞和炎细胞（包括淋巴细胞）构成，是创伤修复的重要基础。\nC. 错误：伤口愈合处可含有肉芽组织，但“伤口愈合处”范围过宽，还包括坏死组织、渗出物、瘢痕组织等，并非题干三种细胞组合所特指的病变。\nD. 错误：肉芽肿性炎是巨噬细胞及其衍生的上皮样细胞和多核巨细胞增生形成结节，常伴淋巴细胞，但一般不以血管内皮细胞和成纤维细胞增生为定义性成分；应与肉芽组织严格区分。\nE. 错误：化脓性炎症以大量中性粒细胞渗出、组织坏死和脓液形成为特点，主要炎细胞是中性粒细胞，而非以血管内皮细胞和成纤维细胞增生及淋巴细胞浸润为主。\n\n易混点：肉芽组织是修复性幼稚结缔组织，核心是新生毛细血管、成纤维细胞和炎细胞；肉芽肿是慢性炎症形成的巨噬细胞性结节，核心是上皮样细胞和多核巨细胞。记忆要点：“肉芽组织修伤口，内皮成纤维加炎细胞；肉芽肿是巨噬结节，上皮样细胞多核巨细胞。”","chapter":2,"chapterName":"损伤的修复","chapterTitle":"第2章 损伤的修复"},{"id":"pathology-a-single-0173","type":"single","typeLabel":"单选题","number":173,"question":"下列哪种损伤不能发生完全再生","options":[{"key":"A","text":"骨折"},{"key":"B","text":"肝细胞坏死但网状支架未塌陷"},{"key":"C","text":"腺体及基膜都受损"},{"key":"D","text":"腺体仅有腺上皮受损"},{"key":"E","text":"子宫内膜脱落"}],"answerKeys":["C"],"answerText":["腺体及基膜都受损"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：组织损伤后能否完全再生，关键在于再生能力和组织结构支架（如基膜、网状支架）是否完整。\n解析：完全再生是指受损组织由同类细胞再生并恢复原有结构和功能；若支架破坏，再生的细胞不能重建正常结构，只能通过肉芽组织机化形成瘢痕，即不完全再生。腺体及基膜均受损时，腺上皮虽可增生，但失去基膜支架，无法重建正常腺管/腺泡结构，故不能完全再生。本题题眼是“基膜是否完整”。\n\n选项分析：\nA. 错误（不是本题答案）：骨折经血肿、纤维骨痂、骨性骨痂及改建，最终可恢复骨的连续性和结构，通常归为完全愈合，不属于不能完全再生。\nB. 错误（不是本题答案）：肝细胞再生能力强，若肝网状支架未塌陷，残存肝细胞可沿支架增生并恢复肝小叶结构，可发生完全再生；若支架塌陷则转为不完全再生。\nC. 正确（本题答案）：腺体及基膜均受损，基膜支架被破坏，腺上皮不能沿正常支架排列重建腺体，只能形成肉芽组织和瘢痕，故不能完全再生。\nD. 错误（不是本题答案）：腺体仅有腺上皮受损而基膜完整时，残存腺上皮可沿完整基膜增生，恢复腺体结构，属完全再生。\nE. 错误（不是本题答案）：子宫内膜功能层周期性脱落，由基底层腺上皮和间质细胞再生修复，属生理性完全再生。\n\n易混点：完全再生强调“同类细胞+支架完整”，不完全再生强调“支架破坏+瘢痕修复”。记忆要点：基膜、网状支架是腺体和肝细胞再生的“脚手架”，脚手架完好可完全再生，塌陷或破坏则形成瘢痕。骨折愈合虽经过骨痂形成，但最终可改建恢复骨结构，考试中通常视为完全愈合。","chapter":2,"chapterName":"损伤的修复","chapterTitle":"第2章 损伤的修复"},{"id":"pathology-a-single-0174","type":"single","typeLabel":"单选题","number":174,"question":"图中的主要成分是","options":[{"key":"A","text":"增生的肉芽组织"},{"key":"B","text":"纤维蛋白沉积"},{"key":"C","text":"血小板和纤维蛋白"},{"key":"D","text":"红细胞和纤维蛋白"},{"key":"E","text":"纤维蛋白"}],"answerKeys":["C"],"answerText":["血小板和纤维蛋白"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：血栓类型及其主要成分，尤其是白色血栓由血小板和纤维蛋白构成。\n解析：题目图片未提供，以下仅依据文字信息及标准答案分析。白色血栓多见于血栓头部、心瓣膜和动脉内，肉眼呈灰白色、质较硬，常与血管壁紧密粘连；镜下主要由血小板聚集形成梁状结构，并伴纤维蛋白网沉积，故主要成分为血小板和纤维蛋白。本题题眼是“血栓主要成分”，需与红色血栓、透明血栓和机化性肉芽组织区分。\n\n选项分析：\nA. 错误：增生的肉芽组织由新生毛细血管和成纤维细胞构成，常见于血栓机化、组织修复和慢性炎症，不是新鲜血栓的主要成分。\nB. 错误：纤维蛋白沉积可见于DIC时微循环内透明血栓或炎症渗出，但单纯“纤维蛋白沉积”不能概括本题图示主要成分。\nC. 正确：血小板和纤维蛋白是白色血栓的主要成分，符合血栓头部/心瓣膜赘生物等病变的形态学特点。\nD. 错误：红细胞和纤维蛋白是红色血栓的主要成分，多见于静脉血栓尾部或血流缓慢、血液淤滞处，与本题答案不同。\nE. 错误：单纯纤维蛋白主要对应透明血栓（纤维素性血栓），见于DIC时毛细血管等微血管内，不是本题所示主要成分。\n\n易混点：白色血栓以血小板和纤维蛋白为主；红色血栓以红细胞和纤维蛋白为主；透明血栓以纤维蛋白为主；混合血栓可见血小板梁与红细胞交替。记忆要点：白血栓“血小板梁”、红血栓“红细胞多”、透明血栓“纤维蛋白微血栓”。","chapter":3,"chapterName":"局部血液循环障碍","chapterTitle":"第3章 局部血液循环障碍","needsImage":true},{"id":"pathology-a-single-0175","type":"single","typeLabel":"单选题","number":175,"question":"关于细胞外基质表述错误的是","options":[{"key":"A","text":"生成多种细胞因子"},{"key":"B","text":"参与血管新生"},{"key":"C","text":"影响细胞的分化"},{"key":"D","text":"维持组织的结构和弹性"},{"key":"E","text":"参与细胞再生"}],"answerKeys":["A"],"answerText":["生成多种细胞因子"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：A\n核心考点：细胞外基质的组成与功能，尤其要区分“细胞产生细胞因子”和“细胞外基质结合、储存细胞因子”。\n解析：细胞外基质（ECM）由胶原蛋白、弹性蛋白、蛋白多糖、糖蛋白等组成，主要起机械支撑、维持组织结构和弹性、调节细胞黏附与分化、参与血管新生和组织再生等作用。ECM可结合并储存多种生长因子或细胞因子，基质降解时可释放它们，但ECM本身不是活细胞，不能“生成”多种细胞因子。本题题眼是“生成”，细胞因子主要由成纤维细胞、内皮细胞、巨噬细胞等细胞合成分泌。\n选项分析：\nA. 错误（本题选A）：ECM可结合、储存和释放某些生长因子/细胞因子，但不能生成细胞因子；生成细胞因子是细胞的功能。\nB. 正确：ECM参与血管新生，基质重塑、黏附分子和生长因子结合可促进内皮细胞迁移、增殖及毛细血管形成。\nC. 正确：ECM通过整合素等受体影响细胞骨架和信号转导，从而调节细胞分化、增殖和表型。\nD. 正确：胶原蛋白提供抗张强度，弹性蛋白提供弹性，ECM共同维持组织结构和弹性。\nE. 正确：ECM为再生细胞提供支架和适宜微环境，并通过信号分子参与细胞再生和组织修复。\n易混点：ECM能“结合、储存、释放”细胞因子，但不能“生成”细胞因子；看到“生成/分泌细胞因子”应想到成纤维细胞、内皮细胞、巨噬细胞等。ECM在修复中既是支架，也是信号调节者。","chapter":2,"chapterName":"损伤的修复","chapterTitle":"第2章 损伤的修复"},{"id":"pathology-a-single-0176","type":"single","typeLabel":"单选题","number":176,"question":"甲状腺腺瘤与结节性甲状腺肿的主要区别是","options":[{"key":"A","text":"发病年龄和性别不同"},{"key":"B","text":"有无完整的包膜，瘤内组织结构是否一致"},{"key":"C","text":"结节的数目不同"},{"key":"D","text":"滤泡中有无胶质"},{"key":"E","text":"前者肿块为单个，大小不超过3cm"}],"answerKeys":["B"],"answerText":["有无完整的包膜，瘤内组织结构是否一致"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：甲状腺腺瘤与结节性甲状腺肿的病理学鉴别，关键是包膜完整性和瘤内组织结构一致性。\n解析：甲状腺腺瘤通常为单发、有完整纤维包膜，瘤内滤泡大小和结构相对一致，周围甲状腺组织可受压；结节性甲状腺肿为甲状腺弥漫性肿大后形成结节，结节常无完整包膜，结节内滤泡大小不一、胶质储留和纤维间隔并存，组织结构不一致。本题题眼是“主要区别”，应抓住包膜和结构一致性，而不是结节数目、胶质有无或肿块大小。\n选项分析：\nA. 错误：二者均多见于女性，发病年龄和性别分布有重叠，不能作为主要鉴别点；该描述不是病理形态学核心区别。\nB. 正确：甲状腺腺瘤有完整包膜，瘤内组织结构较一致；结节性甲状腺肿结节无完整包膜，结节内滤泡大小、结构不一致，是二者主要区别。\nC. 错误：结节性甲状腺肿常为多结节，甲状腺腺瘤常单发，但结节性甲状腺肿早期可单发，腺瘤也可多发，结节数目不是可靠鉴别标准。\nD. 错误：二者滤泡内均可有胶质，结节性甲状腺肿常见胶质储留，甲状腺腺瘤滤泡也可含胶质，不能据此鉴别。\nE. 错误：甲状腺腺瘤常为单个肿块，但大小不定，可超过3cm；“单个且不超过3cm”不是甲状腺腺瘤的病理诊断标准。\n易混点：记忆要点是“腺瘤有完整包膜、瘤内结构一致；结节性甲状腺肿无完整包膜、结节内结构不一致”。不要用单发/多发、有无胶质、肿块大小作为主要鉴别依据。","chapter":15,"chapterName":"内分泌系统疾病","chapterTitle":"第15章 内分泌系统疾病"},{"id":"pathology-a-single-0177","type":"single","typeLabel":"单选题","number":177,"question":"下列属于T细胞性淋巴瘤的恶性肿瘤是","options":[{"key":"A","text":"淋巴浆细胞型淋巴瘤"},{"key":"B","text":"蕈样霉菌病/Sezary综合征"},{"key":"C","text":"滤泡型淋巴瘤"},{"key":"D","text":"套细胞淋巴瘤"},{"key":"E","text":"绿色瘤"}],"answerKeys":["B"],"answerText":["蕈样霉菌病/Sezary综合征"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：成熟T细胞淋巴瘤的分类及蕈样霉菌病/Sezary综合征的T细胞属性。\n解析：蕈样霉菌病/Sezary综合征属于皮肤成熟T细胞淋巴瘤，肿瘤细胞为CD4+辅助性T细胞，具有亲表皮性，镜下可见核呈脑回状的Sezary细胞；临床常表现为皮肤红斑、斑块、红皮病及瘙痒，晚期可累及淋巴结和血液。本题题眼是“T细胞性淋巴瘤”，应选来源于T细胞的蕈样霉菌病/Sezary综合征，而不是各类B细胞淋巴瘤或髓系肿瘤。\n选项分析：\nA. 错误：淋巴浆细胞淋巴瘤属于B细胞性淋巴瘤，由小淋巴细胞、浆细胞样淋巴细胞和浆细胞组成，常与华氏巨球蛋白血症相关，不是T细胞性淋巴瘤。\nB. 正确：蕈样霉菌病/Sezary综合征是成熟T细胞淋巴瘤，肿瘤性T细胞亲表皮生长，Sezary综合征还有红皮病和外周血Sezary细胞增多，符合题意。\nC. 错误：滤泡型淋巴瘤是B细胞性淋巴瘤，来源于滤泡中心B细胞，常有t(14;18)及BCL2过表达，形成滤泡样结构，不是T细胞性。\nD. 错误：套细胞淋巴瘤是B细胞性淋巴瘤，来源于套区B细胞，常有t(11;14)及cyclin D1过表达，不属于T细胞肿瘤。\nE. 错误：绿色瘤又称粒细胞肉瘤/髓系肉瘤，是髓系白血病细胞在骨外形成的肿块，切面可呈绿色，属于髓系肿瘤，不是T细胞性淋巴瘤。\n易混点：蕈样霉菌病虽名称含“霉菌”，但并非真菌感染，而是皮肤T细胞淋巴瘤；绿色瘤也非淋巴瘤，而是髓系肉瘤。记忆要点：T细胞淋巴瘤抓“皮肤亲表皮、Sezary细胞”，B细胞淋巴瘤抓滤泡、套区及相应分子遗传学改变。","chapter":12,"chapterName":"淋巴造血系统疾病","chapterTitle":"第12章 淋巴造血系统疾病"},{"id":"pathology-a-single-0178","type":"single","typeLabel":"单选题","number":178,"question":"风湿性心内膜炎的特征性病变是","options":[{"key":"A","text":"心瓣膜水肿"},{"key":"B","text":"心瓣膜溃疡、穿孔"},{"key":"C","text":"心瓣膜混合血栓形成"},{"key":"D","text":"心瓣膜闭锁缘上疣状血栓形成"},{"key":"E","text":"心瓣膜增厚变形"}],"answerKeys":["D"],"answerText":["心瓣膜闭锁缘上疣状血栓形成"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：风湿性心内膜炎的特征性病变是心瓣膜闭锁缘形成疣状白色血栓（赘生物）。\n解析：风湿性心内膜炎主要累及二尖瓣，其次为二尖瓣和主动脉瓣同时受累。病变早期瓣膜胶原纤维发生黏液样变性和纤维素样坏死，随后在瓣膜闭锁缘形成单行排列、灰白色、半透明、直径1～3mm的疣状赘生物；赘生物本质为血小板和纤维素构成的白色血栓，附着较牢，不易脱落。题眼是“闭锁缘”“疣状”“血栓形成”，这是急性风湿性心内膜炎最具诊断意义的形态学特征。\n选项分析：\nA. 错误：心瓣膜水肿可见于风湿性心内膜炎早期或非特异性炎症反应，但不是特征性病变，不能作为诊断依据。\nB. 错误：心瓣膜溃疡、穿孔主要见于急性或侵袭性感染性心内膜炎，因瓣膜组织被破坏所致；风湿性心内膜炎的赘生物一般不致瓣膜溃疡穿孔。\nC. 错误：混合血栓多见于血流缓慢或涡流处，如心房颤动时的心房附壁血栓、动脉瘤内血栓等，不是风湿性心内膜炎的特征性瓣膜病变。\nD. 正确：风湿性心内膜炎时，在瓣膜闭锁缘形成疣状、单行排列的白色血栓性赘生物，是本病的特征性病变。\nE. 错误：心瓣膜增厚、变形是慢性风湿性心瓣膜病反复发作后的结局，可导致瓣膜狭窄或关闭不全，但不是风湿性心内膜炎活动期的特征性病变。\n易混点：风湿性心内膜炎的疣状赘生物为白色血栓，附着牢固、不易脱落，栓塞少见；感染性心内膜炎的赘生物常较大、质脆、易脱落，并可造成瓣膜溃疡、穿孔，二者鉴别关键是赘生物性质、部位及瓣膜破坏程度。","chapter":9,"chapterName":"心血管系统疾病","chapterTitle":"第9章 心血管系统疾病"},{"id":"pathology-a-single-0179","type":"single","typeLabel":"单选题","number":179,"question":"肺癌最常见的类型是","options":[{"key":"A","text":"腺癌"},{"key":"B","text":"鳞状细胞癌"},{"key":"C","text":"胶样癌"},{"key":"D","text":"黏液癌"},{"key":"E","text":"未分化癌"}],"answerKeys":["A"],"answerText":["腺癌"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：A\n核心考点：肺癌组织学分类中目前最常见的类型是腺癌。\n解析：肺腺癌多起源于支气管黏膜上皮的黏液腺或Ⅱ型肺泡上皮/Clara细胞，常位于肺周围部，镜下可见腺管样、乳头状或贴壁生长方式，易累及胸膜并发生远处转移。题眼是“最常见类型”，按本题标准答案应选腺癌；在女性及非吸烟人群中腺癌比例更高，这与鳞状细胞癌多为中央型、与吸烟关系密切形成对比。鳞状细胞癌、小细胞癌等虽为重要类型，但总体最常见者为腺癌。\n选项分析：\nA. 正确：肺腺癌是目前肺癌中最常见的组织学类型，多为周围型，镜下形成腺腔或乳头，可伴黏液分泌。\nB. 错误：鳞状细胞癌是肺癌常见类型之一，多为中央型，与吸烟关系密切，镜下可见角化珠和细胞间桥，但不是本题所问的最常见类型。\nC. 错误：胶样癌属于产生大量细胞外黏液的腺癌特殊亚型，较少见，不能作为肺癌总体最常见类型。\nD. 错误：黏液癌是腺癌中伴明显黏液分泌的特殊类型，仍归入腺癌范畴且并非最常见的独立类型。\nE. 错误：未分化癌包括小细胞癌、大细胞癌等，分化差、恶性程度高，但总体发生率不及腺癌，不是最常见类型。\n易混点：记忆要点是“周围型腺癌最多见，中央型鳞癌与吸烟密切相关；小细胞癌属神经内分泌癌、恶性度高”。胶样癌和黏液癌均是腺癌的特殊表现，不能误认为独立的最常见类型。","chapter":10,"chapterName":"呼吸系统疾病","chapterTitle":"第10章 呼吸系统疾病"},{"id":"pathology-a-single-0180","type":"single","typeLabel":"单选题","number":180,"question":"大叶性肺炎患者灰色肝样变期与红色肝样变期的临床表现不同在于","options":[{"key":"A","text":"胸痛消失"},{"key":"B","text":"咳铁锈色痰"},{"key":"C","text":"缺氧状况有所好转"},{"key":"D","text":"重新出现啰音"},{"key":"E","text":"开始出现肺实变体征"}],"answerKeys":["C"],"answerText":["缺氧状况有所好转"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：大叶性肺炎各病理分期的肺泡渗出物变化及其对缺氧和体征的影响。\n解析：红色肝样变期肺泡内充满大量纤维蛋白和红细胞，肺泡通气明显减少而局部血流仍较丰富，通气/血流比例失调，故缺氧、发绀明显；进入灰色肝样变期后，红细胞崩解，渗出物以纤维蛋白和中性粒细胞为主，肺泡毛细血管受压、血流减少，通气/血流比例有所改善，因此缺氧状况可有所好转。本题题眼是“灰色肝样变期较红色肝样变期”，应抓住缺氧症状减轻这一变化。\n选项分析：\nA. 错误：胸痛多与胸膜纤维素性炎有关，红色肝样变期和灰色肝样变期均可存在，不能作为两期的主要鉴别点。\nB. 错误：咳铁锈色痰是红色肝样变期的典型表现，由肺泡内红细胞崩解、含铁血黄素形成所致；题目问灰色期不同于红色期之处，方向不符。\nC. 正确：灰色肝样变期肺泡毛细血管受压、局部血流减少，通气/血流比例较红色肝样变期改善，故缺氧状况有所好转。\nD. 错误：啰音重新出现多见于消散期，因渗出物溶解、液化并经气道排出，不是灰色肝样变期的特征性变化。\nE. 错误：肺实变体征在红色肝样变期已开始出现并明显，灰色肝样变期仍存在，并非“开始出现”。\n易混点：红色肝样变期以明显缺氧、发绀和铁锈色痰为特点；灰色肝样变期实变体征更突出，但缺氧可减轻；消散期才常见湿啰音重新出现。记忆要点：红期“红、缺氧、锈痰”，灰期“灰、实变、缺氧轻”，消散期“液化吸收、啰音再现”。","chapter":10,"chapterName":"呼吸系统疾病","chapterTitle":"第10章 呼吸系统疾病"},{"id":"pathology-a-single-0181","type":"single","typeLabel":"单选题","number":181,"question":"高血压时心脏产生的病变如图所示指的是","options":[{"key":"A","text":"左室心肌肥厚而心腔不扩张"},{"key":"B","text":"左室心肌肥厚而心腔扩张"},{"key":"C","text":"左室壁厚正常而心腔明显扩张"},{"key":"D","text":"左室左房心肌明显增厚"},{"key":"E","text":"左室左房心肌正常"}],"answerKeys":["A"],"answerText":["左室心肌肥厚而心腔不扩张"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：A\n核心考点：高血压时心脏的压力负荷性改变——左心室向心性肥大。\n解析：长期高血压使外周血管阻力增高，左心室承受压力负荷，代偿期心肌细胞肥大、左心室壁增厚而心腔不扩张，形成向心性肥大。本题题眼是“高血压”和“左室心肌肥厚而心腔不扩张”，符合高血压性心脏病代偿期改变。题目图片未提供，仅依据文字信息分析，不推断图像细节。\n选项分析：\nA. 正确：高血压引起左心室压力负荷增加，代偿期表现为左室壁增厚、心肌细胞肥大，心腔不扩张，即向心性肥大。\nB. 错误：左室心肌肥厚而心腔扩张属于离心性肥大，常见于容量负荷增加或高血压性心脏病失代偿期，不是高血压代偿期典型表现。\nC. 错误：左室壁厚正常而心腔明显扩张主要见于扩张型心肌病等，以心腔扩张、室壁变薄或相对正常为特点，不符合高血压所致心脏改变。\nD. 错误：左室、左房心肌明显增厚并非高血压心脏病变的主要描述；高血压主要导致左心室肥厚，左房增厚不是本题所示核心改变。\nE. 错误：左室左房心肌正常不能解释长期高血压造成的压力负荷性心肌肥大和室壁增厚。\n易混点：向心性肥大是压力负荷（如高血压、主动脉瓣狭窄）所致，表现为室壁增厚、心腔不扩张；离心性肥大是容量负荷（如二尖瓣关闭不全）或心衰失代偿所致，表现为心腔扩张。记忆要点：压力负荷“壁厚腔不扩”，容量负荷“腔大壁相对薄”。","chapter":9,"chapterName":"心血管系统疾病","chapterTitle":"第9章 心血管系统疾病","needsImage":true},{"id":"pathology-a-single-0182","type":"single","typeLabel":"单选题","number":182,"question":"风湿性心内膜炎，心瓣膜上的赘生物为","options":[{"key":"A","text":"透明血栓"},{"key":"B","text":"白色血栓"},{"key":"C","text":"红色血栓"},{"key":"D","text":"混合血栓"},{"key":"E","text":"微血栓"}],"answerKeys":["B"],"answerText":["白色血栓"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：风湿性心内膜炎心瓣膜赘生物的性质及形态学特点。\n解析：风湿性心内膜炎时，瓣膜闭锁缘因内皮损伤及血流冲击，局部血小板和纤维蛋白沉积，形成灰白色、粟粒大小、质较硬、与瓣膜附着较牢的疣状赘生物，其本质为白色血栓。病变最常累及二尖瓣，其次为主动脉瓣，赘生物常沿瓣膜闭锁缘单行排列，一般不易脱落引起栓塞，但可机化导致瓣膜增厚、变形和功能障碍。题眼是“风湿性心内膜炎”与“白色血栓”。\n选项分析：\nA. 错误：透明血栓又称纤维素性血栓，主要发生于微循环小血管内，常见于弥散性血管内凝血，不是风湿性心内膜炎瓣膜上的疣状赘生物。\nB. 正确：白色血栓主要由血小板和少量纤维蛋白构成，肉眼呈灰白色，质地较硬；风湿性心内膜炎的疣状赘生物即属白色血栓，位于瓣膜闭锁缘。\nC. 错误：红色血栓主要由纤维蛋白网罗大量红细胞构成，常见于静脉血流停滞时，如深静脉血栓，不符合风湿性心内膜炎瓣膜赘生物。\nD. 错误：混合血栓呈层状结构，常见于动脉瘤、心腔内或静脉血栓的延续部，不是风湿性心内膜炎典型的闭锁缘疣状赘生物。\nE. 错误：微血栓指微循环内形成的微小血栓，常见于DIC等，不是肉眼可见的心瓣膜赘生物。\n易混点：风湿性心内膜炎赘生物为白色血栓，小而硬、单行排列、不易脱落；感染性心内膜炎赘生物常较大、松脆、不规则，含菌且易脱落栓塞。记忆要点：风湿性“闭锁缘、白、小、牢”，感染性“大、脆、易脱落”。","chapter":9,"chapterName":"心血管系统疾病","chapterTitle":"第9章 心血管系统疾病"},{"id":"pathology-a-single-0183","type":"single","typeLabel":"单选题","number":183,"question":"急性普通型病毒性肝炎中具有诊断意义的病变是","options":[{"key":"A","text":"肝细胞脂肪变性"},{"key":"B","text":"肝细胞胞质疏松化和气球样变"},{"key":"C","text":"肝细胞嗜酸性坏死"},{"key":"D","text":"肝细胞水肿"},{"key":"E","text":"肝细胞玻璃样变性"}],"answerKeys":["B"],"answerText":["肝细胞胞质疏松化和气球样变"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：急性普通型病毒性肝炎的肝细胞变性以细胞水肿为主，典型形态为胞质疏松化和气球样变。\n解析：急性普通型病毒性肝炎时，病毒及免疫损伤使肝细胞代谢障碍、细胞内水分增多，形成细胞水肿。光镜下肝细胞体积增大、胞质疏松淡染，进一步发展为气球样变，是本型肝炎最突出、具有诊断意义的病变；同时可伴点状坏死、嗜酸性小体和汇管区淋巴细胞浸润。题眼是“急性普通型”和“具有诊断意义”，应选胞质疏松化和气球样变。\n选项分析：\nA. 错误：肝细胞脂肪变性常见于慢性肝炎、酒精性肝病、代谢性肝病等，表现为胞质内脂滴空泡，不是急性普通型病毒性肝炎的诊断性病变。\nB. 正确：肝细胞胞质疏松化和气球样变属于细胞水肿的典型形态，是急性普通型病毒性肝炎最常见、最有诊断意义的病变，肝细胞增大、胞质淡染疏松。\nC. 错误：嗜酸性坏死可形成嗜酸性小体，急性普通型病毒性肝炎中可见，但属于凋亡样改变，不如广泛的气球样变突出，且也可见于其他肝损伤，不是本题所问的最具诊断意义病变。\nD. 错误：肝细胞水肿是病理机制和概括性描述，可见于多种原因导致的肝细胞损伤；在急性普通型病毒性肝炎中，其典型形态学表现为胞质疏松化和气球样变，故D不如B准确。\nE. 错误：肝细胞玻璃样变性常指Mallory小体，主要见于酒精性肝病等；急性普通型病毒性肝炎虽有嗜酸性小体形成，但不宜笼统称为诊断性的玻璃样变性。\n易混点：气球样变是水变性，胞质疏松淡染、空泡不挤压细胞核；脂肪变性为脂滴空泡，常将细胞核挤向一侧，冰冻切片苏丹III染色阳性。嗜酸性小体是胞质浓缩红染的凋亡小体，Mallory小体多见于酒精性肝病，三者不要混淆。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-a-single-0184","type":"single","typeLabel":"单选题","number":184,"question":"具有高比重，静置凝固，黄色浑浊等性状的腹水见于","options":[{"key":"A","text":"门静脉高压"},{"key":"B","text":"右心衰竭"},{"key":"C","text":"慢性肾炎"},{"key":"D","text":"低蛋白血症"},{"key":"E","text":"腹膜炎"}],"answerKeys":["E"],"answerText":["腹膜炎"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n\n核心考点：腹水渗出液与漏出液的鉴别，炎症性液体为渗出液。\n\n解析：腹膜炎时腹膜发生急性或慢性炎症，血管通透性增高，富含蛋白质和纤维蛋白原的血浆成分及炎细胞渗入腹腔，形成渗出液。渗出液的特点是比重高（常＞1.018）、蛋白质含量高、细胞数多，外观黄色浑浊，因含纤维蛋白原可静置凝固，Rivalta试验常阳性。本题题眼为“高比重、静置凝固、黄色浑浊”，提示炎症性渗出液，故见于腹膜炎。\n\n选项分析：\nA. 错误：门静脉高压引起腹腔内毛细血管流体静压升高，形成漏出液，腹水多清亮、低比重、蛋白少、不易凝固。\nB. 错误：右心衰竭导致体循环淤血和静脉压升高，可引起漏出性腹水，而非高比重、浑浊、易凝固的渗出液。\nC. 错误：慢性肾炎可引起水钠潴留及蛋白尿所致低蛋白血症，形成漏出液，腹水清亮、低比重。\nD. 错误：低蛋白血症使血浆胶体渗透压降低，液体漏入腹腔，为漏出液，蛋白质和细胞少，不出现黄色浑浊和静置凝固。\nE. 正确：腹膜炎为炎症性疾病，腹膜血管通透性增高，产生渗出液，符合高比重、黄色浑浊、静置凝固等特点。\n\n易混点：漏出液常见于门静脉高压、心力衰竭、肾病和低蛋白血症，特点是清亮、低比重、蛋白少、细胞少、不凝固；渗出液常见于感染或炎症如腹膜炎，特点是浑浊、高比重、蛋白和细胞多、易凝固。记忆要点：炎症“渗”出，压力/蛋白“漏”出。","chapter":4,"chapterName":"炎症","chapterTitle":"第4章 炎症"},{"id":"pathology-a-single-0185","type":"single","typeLabel":"单选题","number":185,"question":"大叶性肺炎红色肝样变期属于哪一种炎症","options":[{"key":"A","text":"出血性炎"},{"key":"B","text":"纤维素性炎"},{"key":"C","text":"出血浆液性炎"},{"key":"D","text":"出血纤维素性炎"},{"key":"E","text":"出血化脓性炎"}],"answerKeys":["D"],"answerText":["出血纤维素性炎"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：大叶性肺炎红色肝样变期的炎症性质为出血性纤维素性炎。\n解析：大叶性肺炎主要由肺炎链球菌引起，病变累及肺大叶，基本炎症类型为纤维素性炎。红色肝样变期肺泡壁毛细血管显著扩张充血，肺泡腔内渗出大量纤维素、红细胞及少量中性粒细胞和浆液，肺组织因充血、出血和实变呈暗红色、质地变实如肝，故标准答案为出血性纤维素性炎。题眼是“红色肝样变期”和渗出物中红细胞明显增多。\n\n选项分析：\nA. 错误：出血性炎是以大量红细胞渗出为主的炎症，常见于流行性出血热、鼠疫、钩端螺旋体病等，不能概括本期肺泡腔内大量纤维素渗出的特点。\nB. 错误：纤维素性炎是大叶性肺炎的基本炎症类型，但未突出红色肝样变期明显的充血、出血改变；与D相比不够具体。\nC. 错误：出血浆液性炎以浆液和红细胞渗出为主，纤维素渗出不明显，不符合红色肝样变期肺泡腔内大量纤维素网架形成的特点。\nD. 正确：红色肝样变期肺泡腔内除大量纤维素外，还有明显红细胞漏出，肺组织暗红实变，故为出血性纤维素性炎。\nE. 错误：出血化脓性炎以大量中性粒细胞渗出、化脓和出血为特征，如某些化脓性出血性感染；红色肝样变期并非以化脓性渗出为主。\n\n易混点：大叶性肺炎各期炎症性质不同：充血水肿期以浆液性炎为主，红色肝样变期为出血性纤维素性炎，灰色肝样变期以纤维素和中性粒细胞渗出为主、红细胞减少。记忆要点是“红肝出血纤维素，灰肝纤维素化脓样”，但总属大叶性肺炎的纤维素性炎范畴。","chapter":4,"chapterName":"炎症","chapterTitle":"第4章 炎症"},{"id":"pathology-a-single-0186","type":"single","typeLabel":"单选题","number":186,"question":"哪一型大肠癌多见于青年人，且预后较差","options":[{"key":"A","text":"隆起型"},{"key":"B","text":"溃疡型"},{"key":"C","text":"浸润型"},{"key":"D","text":"胶样型"},{"key":"E","text":"息肉型"}],"answerKeys":["D"],"answerText":["胶样型"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：大肠癌的大体类型及胶样型（黏液癌）的临床病理特点。\n解析：胶样型大肠癌属于产生大量黏液的癌，肉眼呈半透明胶冻状，镜下可见黏液湖及印戒细胞样细胞，恶性程度较高，易浸润和转移，且往往发现较晚，因此预后较差。该型多见于青年人，是本题“青年人多见＋预后差”的题眼。大肠癌大体分为隆起型、溃疡型、浸润型和胶样型，其中溃疡型最常见，浸润型易引起肠腔狭窄和梗阻，而胶样型以黏液分泌和胶冻样外观为特征。\n\n选项分析：\nA. 错误：隆起型肿瘤向肠腔突出，呈息肉状或菜花状，多见于右半结肠，分化常较好，预后相对较好；不是青年人多见且预后差的特征性类型。\nB. 错误：溃疡型是大肠癌最常见的大体类型，癌组织中央坏死脱落形成溃疡，边缘隆起，恶性度较高，但并非特指青年人多见、预后最差的胶样型。\nC. 错误：浸润型癌组织沿肠壁环形浸润生长，使肠壁增厚、肠腔狭窄，易导致肠梗阻，多见于左半结肠；虽然预后较差，但不是本题所指青年人多见的胶样型。\nD. 正确：胶样型即黏液癌，癌组织分泌大量黏液，肉眼呈胶冻状，镜下见黏液湖和印戒细胞，多见于青年人，恶性程度高、侵袭性强、预后较差，符合题意。\nE. 错误：息肉型不是大肠癌标准大体分型中的独立类型，通常可归入隆起型或息肉状隆起型；不能作为“青年人多见、预后差”的代表类型。\n\n易混点：注意区分“大体类型”和“组织学类型”。胶样型强调肉眼胶冻状，对应组织学上的黏液癌/印戒细胞癌；溃疡型是最常见的大体类型，浸润型易致肠腔狭窄和梗阻。记忆要点：青年、胶冻样、黏液湖、预后差——选胶样型。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-a-single-0187","type":"single","typeLabel":"单选题","number":187,"question":"急性弥漫性增生性肾小球肾炎时，肾小球增生的细胞主要是","options":[{"key":"A","text":"球囊壁层上皮及毛细血管内皮细胞"},{"key":"B","text":"球囊脏层上皮及毛细血管内皮细胞"},{"key":"C","text":"系膜细胞及内皮细胞"},{"key":"D","text":"间质细胞及球囊壁层上皮细胞"},{"key":"E","text":"间质细胞及球囊脏层上皮细胞"}],"answerKeys":["C"],"answerText":["系膜细胞及内皮细胞"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：急性弥漫性增生性肾小球肾炎属于毛细血管内增生性肾小球肾炎，增生细胞主要为肾小球内皮细胞和系膜细胞。\n解析：本病多发生于儿童，常在链球菌感染后1～3周起病，机制为免疫复合物沉积于肾小球，激活补体并引起炎症细胞浸润。镜下肾小球体积增大、细胞数目增多，弥漫性内皮细胞和系膜细胞增生，并伴中性粒细胞浸润，使毛细血管腔受压变窄；电镜下可见上皮下“驼峰状”电子致密物沉积。题眼是“急性弥漫性增生性”对应的“毛细血管内增生”，即内皮细胞和系膜细胞增生。\n选项分析：\nA. 错误：球囊壁层上皮细胞增生并形成新月体是急进性肾小球肾炎（新月体性肾小球肾炎）的特征；单纯毛细血管内皮细胞增生不足以概括本题答案。\nB. 错误：球囊脏层上皮细胞即足细胞，主要病变为足突融合等，不是急性弥漫性增生性肾小球肾炎的主要增生细胞；内皮细胞虽参与，但组合不正确。\nC. 正确：急性弥漫性增生性肾小球肾炎的增生细胞主要是毛细血管内皮细胞和系膜细胞，故又称毛细血管内增生性肾小球肾炎。\nD. 错误：间质细胞增生多见于间质性肾炎，球囊壁层上皮细胞增生见于新月体性肾小球肾炎；二者不是本病的典型组合。\nE. 错误：间质细胞及球囊脏层上皮细胞均不是本病主要增生细胞；球囊脏层上皮细胞病变常见足突融合，间质细胞增生提示间质性病变。\n易混点：急性弥漫性增生性肾小球肾炎要与急进性肾小球肾炎区分，前者为内皮细胞和系膜细胞增生，后者以球囊壁层上皮细胞增生形成新月体为特征。记忆要点：毛细血管内增生看“内皮+系膜”，新月体看“壁层上皮”。","chapter":13,"chapterName":"泌尿系统疾病","chapterTitle":"第13章 泌尿系统疾病"},{"id":"pathology-a-single-0188","type":"single","typeLabel":"单选题","number":188,"question":"不符合乳腺癌的描述是","options":[{"key":"A","text":"多来源于导管上皮细胞"},{"key":"B","text":"多发生于外上象限"},{"key":"C","text":"以鳞癌多见"},{"key":"D","text":"多数为实性癌"},{"key":"E","text":"以淋巴道转移多见"}],"answerKeys":["C"],"answerText":["以鳞癌多见"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：乳腺癌的组织来源、好发部位、常见组织学类型及转移途径。\n解析：乳腺癌绝大多数起源于乳腺导管上皮细胞，好发于乳腺外上象限；最常见的组织学类型为浸润性导管癌（非特殊类型），在传统病理分类中常表现为癌巢实性、腺管形成不明显的实性癌/单纯癌结构。乳腺癌转移以淋巴道最常见，尤其腋窝淋巴结。原发乳腺鳞状细胞癌十分罕见，因此“以鳞癌多见”不符合乳腺癌的规律。\n\n选项分析：\nA. 正确：乳腺癌多起源于乳腺导管上皮细胞，尤其是小导管上皮，故导管癌较常见；题眼是“多来源于导管上皮”。\nB. 正确：乳腺癌好发于乳腺外上象限，与该区腺体组织丰富有关，是考试常记的好发部位。\nC. 错误：乳腺癌以浸润性导管癌等腺癌多见，鳞状细胞癌极罕见；虽然少数乳腺癌可伴鳞状化生，但不能说“以鳞癌多见”，这是本题答案。\nD. 正确：在传统病理学描述中，乳腺癌多数为实性癌/浸润性导管癌，癌巢呈实性、腺管结构不明显；现代分类多称浸润性癌非特殊类型。\nE. 正确：乳腺癌以淋巴道转移最多见，常首先转移至同侧腋窝淋巴结，晚期可经血道转移至肺、骨、肝等。\n\n易混点：乳腺癌最常见的是浸润性导管癌，不是鳞癌；淋巴道转移最常见，不要与血道转移混淆。遇到“乳腺鳞癌”应想到极罕见，而导管内癌、小叶原位癌、浸润性小叶癌等均是乳腺不同部位或不同生长方式的癌。","chapter":14,"chapterName":"生殖系统和乳腺疾病","chapterTitle":"第14章 生殖系统和乳腺疾病"},{"id":"pathology-a-single-0189","type":"single","typeLabel":"单选题","number":189,"question":"引起出血性炎的主要原因是","options":[{"key":"A","text":"血管破裂"},{"key":"B","text":"血管壁损伤较重"},{"key":"C","text":"组织缺血缺氧"},{"key":"D","text":"组织内胶体渗透压升高"},{"key":"E","text":"血浆晶体渗透压升高"}],"answerKeys":["B"],"answerText":["血管壁损伤较重"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：出血性炎属于渗出性炎，主要因炎症时血管壁损伤较重、通透性显著增高，红细胞大量漏出至炎性渗出物中。\n解析：炎症时血管壁内皮细胞及基底膜受损，若损伤较轻，渗出物以浆液、纤维素或白细胞为主；若血管壁损伤较重，红细胞可大量漏出，形成出血性炎。其本质是炎性渗出物中含大量红细胞，常见于流行性出血热、钩端螺旋体病、炭疽、鼠疫等严重感染。题眼是“出血性炎”，关键在血管壁损伤较重导致红细胞漏出，而不是单纯血管破裂。\n\n选项分析：\nA. 错误：血管破裂可引起出血或血肿，属于一般性出血机制；出血性炎强调的是炎症时血管壁通透性显著增高、红细胞漏出于炎性渗出物中，不能概括为主要原因。\nB. 正确：血管壁损伤较重时内皮及基底膜破坏明显，红细胞大量漏出，炎性渗出物呈血性，这是出血性炎的主要病理基础。\nC. 错误：组织缺血缺氧可引起变性、坏死，严重时可有继发性出血，但不是出血性炎渗出物含大量红细胞的主要机制。\nD. 错误：组织内胶体渗透压升高主要促进液体渗出，与水肿形成有关，不能直接使红细胞漏出。\nE. 错误：血浆晶体渗透压升高主要影响水在血管内外的分布，可促使组织液回流入血管，不引起炎性红细胞渗出。\n\n易混点：出血性炎与单纯出血不同。单纯血管破裂以血液外流为主；出血性炎是炎症性渗出伴大量红细胞，核心是血管壁损伤重、通透性显著增高。记忆要点：出血性炎＝严重感染等情况下“血管壁损伤重＋炎性渗出物中大量红细胞”。","chapter":4,"chapterName":"炎症","chapterTitle":"第4章 炎症"},{"id":"pathology-a-single-0190","type":"single","typeLabel":"单选题","number":190,"question":"同时累及脑膜、肾、肺、肠及骨的肉芽肿性病变常常是","options":[{"key":"A","text":"风湿小体"},{"key":"B","text":"伤寒小体"},{"key":"C","text":"麻风小结"},{"key":"D","text":"矽结节"},{"key":"E","text":"结核结节"}],"answerKeys":["E"],"answerText":["结核结节"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n核心考点：结核结节是结核病的特征性肉芽肿，结核分枝杆菌可经血行播散累及全身多器官。\n解析：结核结节由类上皮细胞、Langhans巨细胞、淋巴细胞和成纤维细胞构成，中央常伴干酪样坏死，属于感染性肉芽肿。结核病可同时累及脑膜（结核性脑膜炎）、肾（肾结核）、肺（肺结核）、肠（肠结核）及骨（骨结核），题眼是“多器官受累的肉芽肿性病变”，符合全身性结核播散的特点。\n\n选项分析：\nA. 错误：风湿小体是风湿病的特征性病变，属于变态反应性肉芽肿，主要位于心肌间质、心内膜下和关节周围等，不常同时累及脑膜、肾、肺、肠及骨。\nB. 错误：伤寒小体即伤寒小结，由吞噬伤寒杆菌、红细胞和细胞碎片的巨噬细胞构成，主要见于回肠末段淋巴组织、肝、脾和骨髓，不是同时累及题列多器官的结核性肉芽肿。\nC. 错误：麻风小结是麻风病的肉芽肿性病变，主要累及皮肤、周围神经和上呼吸道黏膜，可呈结核样或瘤型改变，不符合题列器官组合。\nD. 错误：矽结节是矽肺的特征性病变，由吞噬硅尘的巨噬细胞聚集并纤维化形成，主要位于肺和肺门淋巴结，不累及脑膜、肾、肠及骨。\nE. 正确：结核结节为结核病的特征性肉芽肿，伴干酪样坏死，结核分枝杆菌血行播散时可形成脑膜、肾、肺、肠及骨等多器官结核病灶。\n\n易混点：结核结节、伤寒小结和风湿小体均可表现为肉芽肿样结构，但结核结节中央为干酪样坏死并见类上皮细胞和Langhans巨细胞；伤寒小结以巨噬细胞吞噬红细胞为特点；风湿小体中央为纤维素样坏死并见风湿细胞。记忆时抓住“干酪样坏死＋多器官结核”对应结核结节。","chapter":18,"chapterName":"传染病","chapterTitle":"第18章 传染病"},{"id":"pathology-a-single-0191","type":"single","typeLabel":"单选题","number":191,"question":"左心室附壁血栓可引起","options":[{"key":"A","text":"心力衰竭"},{"key":"B","text":"肺淤血"},{"key":"C","text":"脑动脉栓塞"},{"key":"D","text":"肺动脉栓塞"},{"key":"E","text":"心壁穿孔"}],"answerKeys":["C"],"answerText":["脑动脉栓塞"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：左心室附壁血栓脱落后可随体循环动脉进入脑动脉，引起脑动脉栓塞。\n解析：左心室附壁血栓多继发于心肌梗死、心内膜炎或心室扩张等，血栓附着于心内膜表面，部分可脱落形成栓子。栓子自左心室经主动脉进入体循环，常栓塞脑、脾、肾及下肢等器官动脉，其中脑动脉栓塞可导致脑梗死。本题题眼是“左心室附壁血栓”，其脱落造成的是体循环动脉栓塞，而不是肺栓塞。\n\n选项分析：\nA. 错误：左心室附壁血栓常见于心肌梗死等基础病变，心力衰竭可由心肌梗死引起，但不是附壁血栓直接造成的后果，属于因果倒置或混淆基础疾病。\nB. 错误：肺淤血是左心衰竭导致肺静脉回流受阻、肺毛细血管压升高的结果，并非左心室附壁血栓脱落直接引起。\nC. 正确：左心室附壁血栓脱落形成栓子，随体循环进入脑动脉，可造成脑动脉栓塞，符合左心来源栓子造成体循环栓塞的规律。\nD. 错误：肺动脉栓塞的栓子主要来自右心或体静脉系统，如深静脉血栓、右心室附壁血栓等；左心室附壁血栓进入的是体循环，不会直接进入肺动脉。\nE. 错误：心壁穿孔是透壁性心肌梗死坏死、心室壁破裂的并发症，与附壁血栓本身无直接关系。\n\n易混点：左心系统血栓脱落引起体循环动脉栓塞，常见脑、脾、肾、下肢；右心或体静脉血栓脱落引起肺动脉栓塞。记忆要点是“左心栓子走体循环，右心栓子走肺循环”，若存在房间隔缺损等右向左分流时，才可能出现交叉性栓塞。","chapter":3,"chapterName":"局部血液循环障碍","chapterTitle":"第3章 局部血液循环障碍"},{"id":"pathology-a-single-0192","type":"single","typeLabel":"单选题","number":192,"question":"引起慢性肺源性心脏病最常见的原因是","options":[{"key":"A","text":"支气管哮喘"},{"key":"B","text":"支气管扩张症"},{"key":"C","text":"慢性支气管炎并发阻塞性肺气肿"},{"key":"D","text":"肺尘埃沉着病"},{"key":"E","text":"慢性纤维空洞型肺结核"}],"answerKeys":["C"],"answerText":["慢性支气管炎并发阻塞性肺气肿"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：慢性肺源性心脏病最常见的病因是慢性支气管炎并发阻塞性肺气肿（COPD）。\n解析：慢性肺源性心脏病是由肺组织、肺血管或胸廓慢性病变引起肺动脉高压，进而导致右心室肥厚、扩张的心病。慢性支气管炎并发阻塞性肺气肿时，长期缺氧引起肺小动脉痉挛，肺血管重构，肺毛细血管床减少，加之二氧化碳潴留和酸中毒，使肺循环阻力增加、肺动脉压升高，最终导致右心室负荷加重。本题题眼是“最常见原因”，考试常将COPD作为肺心病的首位病因。\n\n选项分析：\nA. 错误：支气管哮喘严重、长期反复发作时可引起肺气肿和肺动脉高压，甚至肺心病，但并非最常见原因；其病变以气道慢性炎症、平滑肌痉挛和黏液栓为主，肺结构破坏通常不如COPD广泛。\nB. 错误：支气管扩张症可因反复感染、肺组织破坏和肺血管床减少而并发肺心病，但发生率较低，不是最常见病因；其典型表现为支气管壁破坏、扩张和慢性化脓性炎症。\nC. 正确：慢性支气管炎并发阻塞性肺气肿是最常见原因。其通过慢性缺氧性肺血管收缩、肺血管重构和毛细血管床减少引起肺动脉高压，继而右心室肥厚扩张，符合肺心病发病机制。\nD. 错误：肺尘埃沉着病（尘肺）可因肺纤维化和肺血管床破坏导致肺心病，但属于职业性肺病，总体患病率低于COPD，不是最常见原因。\nE. 错误：慢性纤维空洞型肺结核可造成广泛肺组织毁损、纤维化和肺血管床减少，引起“毁损肺”并继发肺心病，但并非最常见原因。\n\n易混点：肺心病最常见病因是慢性支气管炎并发阻塞性肺气肿，即COPD；肺结核、支气管扩张、尘肺等属于可引起肺心病的其他慢性肺病。记忆要点：慢性气道阻塞性病变→缺氧性肺动脉高压→右心室肥厚扩张。","chapter":10,"chapterName":"呼吸系统疾病","chapterTitle":"第10章 呼吸系统疾病"},{"id":"pathology-a-single-0193","type":"single","typeLabel":"单选题","number":193,"question":"容易转移到脊椎的癌是","options":[{"key":"A","text":"胃癌"},{"key":"B","text":"肾癌"},{"key":"C","text":"前列腺癌"},{"key":"D","text":"卵巢癌"},{"key":"E","text":"膀胱癌"}],"answerKeys":["C"],"answerText":["前列腺癌"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：前列腺癌经Batson静脉丛血行转移至脊椎，是肿瘤血道转移途径的常考知识点。\n解析：前列腺癌容易发生骨转移，尤其常见于腰骶椎、骨盆和股骨近端。其机制是前列腺静脉与椎静脉丛（Batson静脉丛）之间存在吻合，且该静脉丛无瓣膜，腹压增高时癌细胞可直接进入椎静脉系统而转移至脊椎。前列腺癌骨转移多呈成骨性，临床可伴骨痛、碱性磷酸酶升高及PSA升高，题眼是“脊椎转移”与“前列腺癌”的联系。\n选项分析：\nA. 错误：胃癌最常见的转移部位是肝、腹膜和淋巴结，如左锁骨上淋巴结（Virchow淋巴结）；女性胃癌还可转移至卵巢形成Krukenberg瘤。胃癌虽偶可血行转移至骨，但不是容易转移到脊椎的典型癌。\nB. 错误：肾癌可经血行转移至肺、骨、肝等，骨转移中可累及脊柱，但本题标准答案为前列腺癌。肾癌的题眼常为肾静脉内癌栓、肺转移和骨转移，而不是“脊椎转移”的首选。\nC. 正确：前列腺癌经前列腺静脉与Batson静脉丛吻合，容易转移至脊椎，尤其腰骶椎；骨转移常为成骨性，是前列腺癌的重要临床病理特点。\nD. 错误：卵巢癌主要沿腹膜腔种植转移至腹膜、大网膜、肠表面和肝表面，也可经淋巴道转移；并不以脊椎转移为典型。\nE. 错误：膀胱癌以局部浸润和淋巴道转移为主，血行可至肺、肝、骨等，但“容易转移到脊椎”不是其典型描述，且本题标准答案为前列腺癌。\n易混点：Batson静脉丛是前列腺癌、乳腺癌等转移至脊柱的重要途径，记忆为“前列腺癌经椎静脉丛到腰骶椎，常成骨性”。肾癌也可骨转移，但肾癌更常考肾静脉癌栓和肺转移；不要把所有骨转移癌都等同于脊椎转移。","chapter":6,"chapterName":"肿瘤","chapterTitle":"第6章 肿瘤"},{"id":"pathology-a-single-0194","type":"single","typeLabel":"单选题","number":194,"question":"关于风湿性心内膜炎，下列叙述哪项是错误的","options":[{"key":"A","text":"赘生物如粟粒，灰白色，成串珠状、单行排列"},{"key":"B","text":"赘生物附着牢固，易机化"},{"key":"C","text":"赘生物多位于瓣膜闭锁缘"},{"key":"D","text":"受累瓣膜易发生溃疡及穿孔"},{"key":"E","text":"其实质是白色血栓"}],"answerKeys":["D"],"answerText":["受累瓣膜易发生溃疡及穿孔"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：风湿性心内膜炎的赘生物特点及其与感染性心内膜炎的鉴别。\n解析：风湿性心内膜炎本质是变态反应性非化脓性炎症，好发于二尖瓣，其次主动脉瓣。典型病变是在瓣膜闭锁缘形成灰白色、粟粒大小、单行排列的疣状赘生物，实为血小板和纤维蛋白构成的白色血栓，附着牢固、不易脱落，可机化导致瓣膜增厚、粘连和变形。题眼是“易发生溃疡及穿孔”，这是感染性心内膜炎的破坏性病变，而非风湿性心内膜炎的典型表现。\n\n选项分析：\nA. 正确：风湿性心内膜炎的赘生物细小、灰白色，常沿瓣膜闭锁缘呈单行串珠状排列，即疣状心内膜炎。\nB. 正确：赘生物为白色血栓，与瓣膜附着较牢固，不易脱落，可逐渐机化，进而引起瓣膜纤维化、增厚和变形。\nC. 正确：风湿性赘生物多位于瓣膜闭锁缘，因该处血流冲击和机械摩擦较明显，是典型好发部位。\nD. 错误：风湿性心内膜炎较少引起瓣膜明显组织破坏，通常不发生溃疡和穿孔；瓣膜溃疡、穿孔主要见于感染性心内膜炎，尤其急性感染性心内膜炎。\nE. 正确：赘生物实质是血小板和纤维蛋白构成的白色血栓，不是化脓性渗出物或肿瘤性物质。\n\n易混点：风湿性心内膜炎赘生物“小、牢、单行、闭锁缘、少栓塞、易机化”；感染性心内膜炎赘生物“大、松、易脱落、易栓塞、可溃疡穿孔”。记忆时抓住“风湿不穿孔，感染易破坏”这一鉴别点。","chapter":9,"chapterName":"心血管系统疾病","chapterTitle":"第9章 心血管系统疾病"},{"id":"pathology-a-single-0195","type":"single","typeLabel":"单选题","number":195,"question":"腹股沟疝嵌顿后，疝囊内的肠壁可发生","options":[{"key":"A","text":"凝固性坏死"},{"key":"B","text":"湿性坏疽"},{"key":"C","text":"干性坏疽"},{"key":"D","text":"液化性坏死"},{"key":"E","text":"气性坏疽"}],"answerKeys":["B"],"answerText":["湿性坏疽"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：嵌顿疝致肠壁血运障碍并继发肠道细菌感染，形成湿性坏疽。\n解析：腹股沟疝嵌顿后，疝环压迫肠管及肠系膜血管，先引起静脉回流受阻、肠壁淤血水肿，继而动脉供血障碍，肠壁缺血坏死。肠道内细菌大量繁殖并参与腐败性感染，坏死肠壁含水量多、肿胀湿润、呈暗红或紫黑色伴恶臭，故为湿性坏疽。题眼是“嵌顿疝＋肠壁”，即内脏缺血坏死合并细菌感染。\n选项分析：\nA. 错误：凝固性坏死常见于心、肾、脾等缺血性梗死，坏死组织呈灰白、干燥、轮廓保存；肠壁缺血虽可先有凝固性坏死样改变，但在肠道细菌和湿润环境下最终表现为湿性坏疽。\nB. 正确：嵌顿疝使肠壁血运障碍，肠壁坏死并继发肠道腐败菌感染，坏死组织水分多，符合湿性坏疽；好发于肠、阑尾、胆囊、肺、子宫等与外界相通或含菌的内脏。\nC. 错误：干性坏疽多见于四肢动脉闭塞而静脉回流尚可者，如动脉粥样硬化、血栓闭塞性脉管炎，坏死组织干燥皱缩、黑色、界限较清；嵌顿肠壁湿润且含菌，不是干性坏疽。\nD. 错误：液化性坏死多见于脑梗死、急性胰腺炎和脓肿形成，因组织富含脂质或水解酶而变为液态；肠壁嵌顿坏死的主要结局是湿性坏疽，不是单纯液化性坏死。\nE. 错误：气性坏疽由产气荚膜梭菌等厌氧菌感染深部肌肉创伤引起，局部有大量气体、捻发音；嵌顿疝并非典型深部肌肉开放性创伤，不符合气性坏疽。\n易混点：坏疽是坏死组织继发腐败菌感染。干性坏疽“四肢、干燥、界限清”，湿性坏疽“内脏或伴静脉淤血、湿润肿胀、恶臭、界限不清”；气性坏疽强调深部肌肉创伤和产气菌感染。记忆要点：肠管嵌顿坏死＝湿性坏疽。","chapter":1,"chapterName":"细胞和组织的适应与损伤","chapterTitle":"第1章 细胞和组织的适应与损伤"},{"id":"pathology-a-single-0196","type":"single","typeLabel":"单选题","number":196,"question":"属于生理性肥大的组织器官是","options":[{"key":"A","text":"功能亢进的甲状腺"},{"key":"B","text":"运动员的有关肌肉肥大"},{"key":"C","text":"高血压患者的心脏"},{"key":"D","text":"慢性增殖性炎的扁桃体"},{"key":"E","text":"垂体腺瘤患者的肾上腺"}],"answerKeys":["B"],"answerText":["运动员的有关肌肉肥大"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n\n核心考点：生理性肥大与病理性肥大的鉴别，重点掌握肥大是细胞体积增大，而非细胞数量增多。\n\n解析：运动员因长期运动训练使有关骨骼肌细胞体积增大、肌纤维增粗，属于机体对增加的功能负荷产生的生理性适应性肥大，无基础疾病，去除训练后可有不同程度回退。病理性肥大则发生于异常负荷或内分泌刺激，如高血压所致左心室肥大、甲亢所致甲状腺滤泡上皮肥大等。本题题眼是“生理性”，即肥大由生理需要或正常功能负荷增加引起。\n\n选项分析：\nA. 错误：功能亢进的甲状腺表现为甲状腺滤泡上皮增生、肥大，甲状腺激素分泌增多，属于内分泌性病理性肥大/增生，常联系弥漫性毒性甲状腺肿等病变。\nB. 正确：运动员有关肌肉肥大由长期运动训练引起，属于生理性肥大，表现为骨骼肌细胞体积增大、肌纤维增粗，是正常适应性改变。\nC. 错误：高血压患者心脏肥大属于压力负荷增加引起的代偿性病理性肥大，最典型为左心室向心性肥大，继续发展可致心腔扩张、心力衰竭。\nD. 错误：慢性增殖性炎的扁桃体主要是淋巴组织增生伴慢性炎症细胞浸润，属于病理性增生，不是生理性肥大。\nE. 错误：垂体腺瘤患者肾上腺肥大系肿瘤分泌促肾上腺皮质激素等引起的内分泌性病理性增生/肥大，常可导致肾上腺皮质功能亢进。\n\n易混点：肥大是细胞体积增大，增生是细胞数量增多；生理性肥大见于运动员骨骼肌、妊娠子宫、哺乳期乳腺，病理性肥大见于高血压左心室肥大、甲亢甲状腺、垂体腺瘤所致肾上腺改变。慢性炎症所致扁桃体增大本质多为淋巴组织增生，不能误判为生理性肥大。","chapter":1,"chapterName":"细胞和组织的适应与损伤","chapterTitle":"第1章 细胞和组织的适应与损伤"},{"id":"pathology-a-single-0197","type":"single","typeLabel":"单选题","number":197,"question":"慢性支气管炎患者通气障碍是由于","options":[{"key":"A","text":"黏液腺肥大、增生"},{"key":"B","text":"上皮纤毛倒伏、脱落"},{"key":"C","text":"软骨变性萎缩"},{"key":"D","text":"小气道阻塞"},{"key":"E","text":"管壁平滑肌萎缩"}],"answerKeys":["D"],"answerText":["小气道阻塞"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：慢性支气管炎导致阻塞性通气障碍的关键环节是小气道阻塞。\n解析：慢性支气管炎时，支气管黏膜炎症、黏液分泌增多、小气道管壁增厚及分泌物潴留可造成小气道阻塞，使气道阻力增加，出现阻塞性通气障碍。小气道因管径小、缺乏软骨支撑，更易被黏液栓和炎症水肿阻塞，是本题“通气障碍”的题眼。临床上可表现为呼气性呼吸困难、肺残气量增加，久之可并发阻塞性肺气肿和肺源性心脏病。\n选项分析：\nA. 错误：黏液腺肥大、增生是慢性支气管炎的重要病理改变，可导致黏液分泌增多、咳嗽咳痰，但本身不是通气障碍的直接主要原因；其意义更多在于气道分泌物增多和易并发感染。\nB. 错误：上皮纤毛倒伏、脱落会削弱黏液纤毛清除功能，使分泌物潴留、易继发感染，但这是防御功能受损机制，不是“通气障碍”的直接环节。\nC. 错误：软骨变性、萎缩可削弱气道壁支撑，严重时有利于气道塌陷，但慢性支气管炎通气障碍的关键部位是小气道阻塞；该选项不是本题最佳答案。\nD. 正确：小气道阻塞使气道阻力升高，导致阻塞性通气功能障碍，是慢性支气管炎患者出现通气障碍的主要机制，故为标准答案。\nE. 错误：慢性支气管炎时气道平滑肌可发生增生、肥大甚至痉挛，而不是以“平滑肌萎缩”作为通气障碍的机制；平滑肌萎缩不符合其主要病理生理改变。\n易混点：慢性支气管炎的重要病理变化是黏液腺肥大增生和纤毛受损，但“通气障碍”应抓住小气道阻塞；若问“咳嗽咳痰的病理基础”则多选黏液腺增生，若问“阻塞性通气障碍”则选小气道阻塞。","chapter":10,"chapterName":"呼吸系统疾病","chapterTitle":"第10章 呼吸系统疾病"},{"id":"pathology-a-single-0198","type":"single","typeLabel":"单选题","number":198,"question":"淤血不会引起","options":[{"key":"A","text":"水肿"},{"key":"B","text":"脂肪变"},{"key":"C","text":"实质细胞增生"},{"key":"D","text":"局部缺氧"},{"key":"E","text":"胶原纤维增生"}],"answerKeys":["C"],"answerText":["实质细胞增生"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n\n核心考点：慢性淤血可导致水肿、缺氧、实质细胞萎缩/变性及间质纤维增生，但不会引起实质细胞增生。\n\n解析：淤血是静脉回流受阻，血液淤积于小静脉和毛细血管，使局部毛细血管流体静压升高并造成组织缺氧。慢性淤血时实质细胞因缺氧和代谢产物蓄积而萎缩、变性，甚至坏死，同时间质成纤维细胞增生并产生胶原纤维，形成淤血性硬化。题眼是“不会引起”，实质细胞增生不属于淤血的病理后果，故答案为C。\n\n选项分析：\nA. 正确（属于淤血后果）：静脉回流受阻使毛细血管流体静压升高，液体渗出增多，可引起淤血性水肿。\nB. 正确（属于淤血后果）：长期缺氧可致细胞代谢障碍，肝淤血时小叶中央区肝细胞可发生脂肪变。\nC. 错误（不属淤血后果，故为本题答案）：淤血主要引起实质细胞萎缩、变性，间质纤维组织增生，不会直接引起实质细胞增生；实质细胞增生多见于慢性炎症、代偿或激素刺激等。\nD. 正确（属于淤血后果）：淤血时血流缓慢、氧供减少，局部组织缺氧是后续变性、萎缩和纤维化的基础。\nE. 正确（属于淤血后果）：慢性淤血时缺氧刺激成纤维细胞增生并合成胶原，间质胶原纤维增多，可发展为淤血性硬化。\n\n易混点：慢性淤血是“实质细胞萎缩/变性＋间质纤维增生”，不要误记为实质细胞增生。肝淤血典型为中央区肝细胞脂肪变、萎缩及纤维化，长期可致心源性肝硬化。","chapter":3,"chapterName":"局部血液循环障碍","chapterTitle":"第3章 局部血液循环障碍"},{"id":"pathology-a-single-0199","type":"single","typeLabel":"单选题","number":199,"question":"伤寒增生的细胞是","options":[{"key":"A","text":"淋巴细胞"},{"key":"B","text":"单核巨噬细胞"},{"key":"C","text":"中性粒细胞"},{"key":"D","text":"嗜酸性粒细胞"},{"key":"E","text":"浆细胞"}],"answerKeys":["B"],"answerText":["单核巨噬细胞"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：伤寒的基本病变是全身单核巨噬细胞系统增生，回肠末段淋巴组织内巨噬细胞增生并形成伤寒肉芽肿。\n解析：伤寒杆菌感染后，病变以单核巨噬细胞系统增生为特征，尤以回肠末段集合淋巴结和孤立淋巴滤泡最明显。增生的巨噬细胞吞噬红细胞、淋巴细胞及细胞碎片后称为伤寒细胞，聚集成团形成伤寒小结（伤寒肉芽肿），这是伤寒的特征性病变。题眼是“伤寒增生的细胞”，应锁定巨噬细胞而非一般急性化脓性炎的中性粒细胞。\n选项分析：\nA. 错误：淋巴细胞增生常见于病毒感染、慢性炎症及某些淋巴瘤等，不是伤寒特征性增生的主要细胞。\nB. 正确：伤寒时单核巨噬细胞系统显著增生，巨噬细胞吞噬红细胞等形成伤寒细胞，进而构成伤寒小结。\nC. 错误：中性粒细胞主要见于急性化脓性炎，如金黄色葡萄球菌等感染；伤寒外周血常白细胞减少，病变不以中性粒细胞增生为主。\nD. 错误：嗜酸性粒细胞增多常见于寄生虫感染和变态反应性疾病；伤寒时嗜酸性粒细胞常减少甚至消失。\nE. 错误：浆细胞多见于慢性炎症和体液免疫反应，虽伤寒后期可有免疫反应，但特征性增生细胞不是浆细胞。\n易混点：伤寒小结属于感染性肉芽肿，但组成细胞以伤寒细胞（巨噬细胞）为主；结核结节则以上皮样细胞和朗汉斯巨细胞为特征。记忆要点：伤寒“巨噬细胞增生、吞噬现象、回肠末段”，中性粒细胞和嗜酸性粒细胞均不是其病变主体。","chapter":18,"chapterName":"传染病","chapterTitle":"第18章 传染病"},{"id":"pathology-a-single-0200","type":"single","typeLabel":"单选题","number":200,"question":"下列哪一项最能体现宫颈原位癌的特征","options":[{"key":"A","text":"发生于子宫颈黏膜的柱状上皮"},{"key":"B","text":"未发生转移"},{"key":"C","text":"是一种早期癌"},{"key":"D","text":"是一种基底细胞癌"},{"key":"E","text":"癌组织波及上皮全层，但未突破基底膜"}],"answerKeys":["E"],"answerText":["癌组织波及上皮全层，但未突破基底膜"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n核心考点：宫颈原位癌是指异型癌细胞累及宫颈上皮全层，但基底膜完整、无间质浸润的上皮内癌。\n解析：宫颈原位癌的病理学本质是癌变局限于上皮层内，癌细胞极性紊乱、核异型明显，可占据上皮全层，但基底膜未被突破，因此尚无浸润和转移的生物学基础。本题题眼是“波及上皮全层”与“未突破基底膜”同时具备，这正是原位癌区别于浸润癌的关键形态学标准。临床多见于宫颈鳞柱交界区，常与高危型HPV感染相关。\n选项分析：\nA. 错误：宫颈原位癌多发生于宫颈鳞柱交界处的鳞状上皮，而非柱状上皮；累及柱状上皮者应想到宫颈腺上皮异型增生或原位腺癌等病变。\nB. 错误：原位癌因未突破基底膜确实通常不发生转移，但“未转移”也可见于其他早期癌，不能体现原位癌最本质的组织学特征。\nC. 错误：原位癌属于上皮内癌、临床0期癌，严格说不是浸润性早期癌；“早期癌”概念较宽，不能准确表达其基底膜完整的定义。\nD. 错误：宫颈原位癌多为鳞状细胞癌的原位阶段，不是基底细胞癌；基底细胞癌常发生于皮肤等部位，与宫颈原位癌不是同一概念。\nE. 正确：癌组织占据上皮全层而基底膜完整，说明癌变尚未侵入间质，是宫颈原位癌最核心、最具诊断价值的特征。\n易混点：原位癌与浸润癌的鉴别关键是基底膜是否完整；一旦癌细胞突破基底膜侵入间质，即不再称原位癌。宫颈上皮内瘤变CINⅢ包括重度异型增生和原位癌，考试中要抓住“全层异型、基底膜完整”这一记忆要点。","chapter":6,"chapterName":"肿瘤","chapterTitle":"第6章 肿瘤"},{"id":"pathology-a-single-0201","type":"single","typeLabel":"单选题","number":201,"question":"下述支持胃的恶性溃疡的是","options":[{"key":"A","text":"溃疡呈圆形，椭圆形"},{"key":"B","text":"边缘整齐，不隆起"},{"key":"C","text":"底部较平坦"},{"key":"D","text":"火山口状，底部凹凸不平"},{"key":"E","text":"皱襞向溃疡集中"}],"answerKeys":["D"],"answerText":["火山口状，底部凹凸不平"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n\n核心考点：胃良性溃疡与溃疡型胃癌（恶性溃疡）的肉眼形态鉴别，恶性溃疡常呈火山口状、底部凹凸不平。\n\n解析：胃恶性溃疡由癌组织坏死脱落形成，边缘因癌浸润而不规则并呈堤状隆起，底部坏死渗出物多、凹凸不平，整体似火山口，故D支持恶性溃疡。良性溃疡多呈圆形或椭圆形，边缘整齐、不隆起，底部较平坦，周围黏膜皱襞可向溃疡集中。题眼是“支持恶性溃疡的形态学特点”，最终确诊仍需胃镜活检病理。\n\n选项分析：\nA. 错误：溃疡呈圆形、椭圆形是胃良性溃疡的典型肉眼特点，恶性溃疡多不规则，此选项不支持恶性。\nB. 错误：边缘整齐、不隆起符合良性溃疡；恶性溃疡边缘常不规则、隆起呈堤状，并可有癌性浸润。\nC. 错误：底部较平坦多见于良性溃疡；恶性溃疡底部常因坏死组织及渗出物覆盖而凹凸不平。\nD. 正确：火山口状、底部凹凸不平是溃疡型胃癌的典型形态，反映癌组织坏死脱落及边缘癌性隆起，支持恶性溃疡。\nE. 错误：皱襞向溃疡集中多见于良性溃疡，因纤维瘢痕收缩牵拉周围黏膜所致；恶性溃疡常伴皱襞中断、破坏和僵硬。\n\n易混点：良性溃疡记忆为“圆、齐、平、集中”；恶性溃疡记忆为“不规则、堤状隆起、火山口、底部污秽凹凸、皱襞中断”。但肉眼形态仅为倾向性判断，胃溃疡良恶性鉴别必须依靠活检病理。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-a-single-0202","type":"single","typeLabel":"单选题","number":202,"question":"Ⅱ型膜性增生性肾小球肾炎的特征性表现，除外","options":[{"key":"A","text":"GBM中出现不规则的带状电子密度极高的沉积物"},{"key":"B","text":"免疫荧光显示肾小球以C3沉积为主"},{"key":"C","text":"光镜下见肾小球细胞增多，基底膜增厚"},{"key":"D","text":"银染色显示GBM增厚并分离，呈双轨状"},{"key":"E","text":"电镜下见内皮下出现致密沉积物，免疫荧光呈颗粒状"}],"answerKeys":["E"],"answerText":["电镜下见内皮下出现致密沉积物，免疫荧光呈颗粒状"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n核心考点：Ⅱ型膜性增生性肾小球肾炎（致密沉积物病）的病理形态、免疫荧光和电镜特征，并与Ⅰ型膜性增生性肾小球肾炎鉴别。\n解析：Ⅱ型膜性增生性肾小球肾炎又称致密沉积物病，属于C3肾小球病。其题眼是电镜下基底膜致密层内出现带状、均质、电子密度极高的沉积物，免疫荧光以C3沉积为主而免疫球蛋白少；光镜下表现为系膜细胞增生、毛细血管基底膜增厚，银染色可见基底膜增厚并呈双轨状。E项所述“内皮下致密沉积物、免疫荧光呈颗粒状”是Ⅰ型膜性增生性肾小球肾炎的典型表现，不是Ⅱ型特征，故选E。\n\n选项分析：\nA. 正确：Ⅱ型MPGN的特征性电镜表现是GBM致密层内出现不规则、带状、电子密度极高的致密沉积物，故“除外”不选A。\nB. 正确：Ⅱ型MPGN免疫荧光以C3沉积为主，IgG、IgM和C1q通常较少，符合致密沉积物病/C3肾小球病特点。\nC. 正确：光镜下可见肾小球系膜细胞和内皮细胞增生，毛细血管基底膜增厚，呈膜增生性改变。\nD. 正确：银染色显示GBM增厚并因系膜插入而分离，呈双轨状，是膜增生性肾小球肾炎的常考形态。\nE. 错误：内皮下致密沉积物伴免疫荧光颗粒状沉积主要见于Ⅰ型膜性增生性肾小球肾炎；Ⅱ型的沉积物位于GBM致密层内，免疫荧光以C3为主，故选E。\n\n易混点：Ⅰ型MPGN为内皮下沉积物，免疫荧光常见IgG/C3颗粒状；Ⅱ型MPGN即致密沉积物病，沉积物在GBM致密层内呈带状高电子密度，C3强阳性。记忆要点：Ⅰ型“内皮下”，Ⅱ型“基底膜内致密带”。","chapter":13,"chapterName":"泌尿系统疾病","chapterTitle":"第13章 泌尿系统疾病"},{"id":"pathology-a-single-0203","type":"single","typeLabel":"单选题","number":203,"question":"肿瘤对放射治疗和化学治疗的敏感性取决于","options":[{"key":"A","text":"是否有变性坏死"},{"key":"B","text":"是否有包膜"},{"key":"C","text":"瘤细胞的分化程度"},{"key":"D","text":"主、间质的比例"},{"key":"E","text":"发生的部位"}],"answerKeys":["C"],"answerText":["瘤细胞的分化程度"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：肿瘤对放射治疗和化学治疗的敏感性主要取决于瘤细胞的分化程度，分化越低、增殖越活跃者通常越敏感。\n解析：放射治疗和化学治疗主要作用于增殖活跃的肿瘤细胞，因此肿瘤的敏感性与其分化程度、生长比率和血供等密切相关。分化程度越低，瘤细胞越幼稚、异型性越明显、增殖越活跃，对放化疗越敏感；反之，分化程度高、生长缓慢的肿瘤敏感性较低。本题题眼是“敏感性取决于”，应抓住肿瘤细胞自身的分化与增殖状态，而不是包膜、部位等局部因素。\n选项分析：\nA. 错误：变性坏死是肿瘤继发性改变，可因生长过快、血供不足等出现，虽可能影响局部药物递送和放疗反应，但不是决定放化疗敏感性的主要因素。\nB. 错误：有无包膜主要与肿瘤的膨胀性生长、边界及侵袭转移倾向有关，良性肿瘤常有包膜，但包膜不是判断放化疗敏感性的依据。\nC. 正确：瘤细胞分化程度越低，增殖越活跃、生长比率越高，对放疗和化疗越敏感；分化高、增殖慢者敏感性相对低，这是病理学常考机制。\nD. 错误：主、间质比例可影响肿瘤质地、血供和药物渗透等，但不是决定肿瘤对放化疗敏感性的核心因素；实质细胞的分化与增殖状态才是关键。\nE. 错误：发生部位可影响治疗可及性、手术方式和局部并发症，但肿瘤对放化疗的内在敏感性主要取决于瘤细胞分化程度及增殖活性，而不是部位本身。\n易混点：分化程度低不等于恶性程度低，而是异型性大、生长快、对放化疗相对敏感但侵袭转移能力强；分化程度高则恶性度相对低，却可能对放化疗不敏感。记忆要点：放化疗看“细胞幼不幼稚、长不长得快”，包膜和部位不是核心。","chapter":6,"chapterName":"肿瘤","chapterTitle":"第6章 肿瘤"},{"id":"pathology-a-single-0204","type":"single","typeLabel":"单选题","number":204,"question":"创伤一期愈合和二期愈合的差异主要是","options":[{"key":"A","text":"是否为手术切口"},{"key":"B","text":"是否经过扩创术"},{"key":"C","text":"是否有大量肉芽组织形成"},{"key":"D","text":"创面是否有出血"},{"key":"E","text":"创面是否有炎症反应"}],"answerKeys":["C"],"answerText":["是否有大量肉芽组织形成"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：创伤一期愈合与二期愈合的本质区别在于组织缺损大小及所需肉芽组织填充量不同，二期愈合需大量肉芽组织形成。\n\n解析：一期愈合多见于组织缺损小、创缘整齐、对合严密、无感染或异物、经粘合或缝合的伤口，肉芽组织形成少，瘢痕小，愈合快。二期愈合多见于组织缺损大、创缘不整、无法严密对合、伴感染或异物的伤口，需大量肉芽组织填补缺损，随后纤维化形成较大瘢痕。本题题眼是“主要差异”，应抓住肉芽组织形成量这一形态学核心，而不是手术、扩创、出血或有无炎症等非本质因素。\n\n选项分析：\nA. 错误：是否为手术切口不是本质区别。手术切口通常可一期愈合，但若感染、缺损大也可二期愈合；非手术创伤若创缘整齐、无感染也可一期愈合。\nB. 错误：是否经过扩创术是临床处理方式，不是愈合类型划分依据。扩创术可去除坏死组织和异物、促进愈合，但不能决定其必然为一期或二期愈合。\nC. 正确：一期愈合组织缺损小，肉芽组织少；二期愈合缺损大、常伴感染或异物，需大量肉芽组织填充，故肉芽组织形成量是主要差异。\nD. 错误：创面是否有出血不是区分一期、二期愈合的主要标准。两种愈合过程中均可能有出血或渗出，出血量受损伤程度和血管状态影响。\nE. 错误：创面是否有炎症反应不是主要差异。两种愈合均有炎症反应参与，只是二期愈合因感染、坏死物多而炎症反应通常更明显，不能以“有无炎症”区分。\n\n易混点：一期愈合和二期愈合都有炎症反应、肉芽组织和瘢痕形成，区别在于“量”和“程度”，不是“有无”。记忆要点：一期愈合——缺损小、对合好、肉芽少、瘢痕小；二期愈合——缺损大、感染异物、肉芽多、瘢痕大。","chapter":2,"chapterName":"损伤的修复","chapterTitle":"第2章 损伤的修复"},{"id":"pathology-a-single-0205","type":"single","typeLabel":"单选题","number":205,"question":"原发性肺结核的肺内原发病灶常位于","options":[{"key":"A","text":"肺尖"},{"key":"B","text":"脏胸膜面"},{"key":"C","text":"肺门"},{"key":"D","text":"肺膈面"},{"key":"E","text":"肺上叶下部或肺下叶上部靠近胸膜处"}],"answerKeys":["E"],"answerText":["肺上叶下部或肺下叶上部靠近胸膜处"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n核心考点：原发性肺结核的肺内原发病灶好发于肺上叶下部或肺下叶上部靠近胸膜处，并常与结核性淋巴管炎、肺门淋巴结结核共同构成原发综合征。\n解析：原发性肺结核多见于儿童及未感染过结核、结核菌素试验阴性的个体。含菌飞沫吸入后，结核分枝杆菌易在通气较好、血流较丰富且靠近胸膜的肺外周区域定植，形成灰白色渗出性原发病灶。随后沿淋巴管引流至肺门淋巴结，引起肺门淋巴结结核，形成典型的原发综合征。本题题眼是“原发性肺结核的肺内原发病灶部位”，而非继发性肺结核的好发部位。\n选项分析：\nA. 错误：肺尖是继发性肺结核的常见好发部位，与再感染、局部氧分压较高及淋巴引流缓慢等因素有关，不是原发性肺结核肺内原发灶的典型部位。\nB. 错误：原发病灶可靠近胸膜，但并非位于脏胸膜面本身；脏胸膜病变多属于结核性胸膜炎的表现，不能等同于肺内原发病灶。\nC. 错误：肺门是原发综合征中肺门淋巴结结核的部位，属于淋巴道播散受累处，不是“肺内原发病灶”的所在。\nD. 错误：肺膈面不是原发性肺结核原发灶的典型好发部位，缺乏其特征性解剖和通气分布依据。\nE. 正确：肺上叶下部或肺下叶上部靠近胸膜处通气较好，结核菌易于沉积并形成初染灶，是原发性肺结核肺内原发病灶的典型部位。\n易混点：原发灶位于肺上叶下部或下叶上部近胸膜处，继发性肺结核多位于肺尖；原发综合征包括肺内原发病灶、结核性淋巴管炎和肺门淋巴结结核，别把肺门淋巴结误认为肺内原发灶。","chapter":18,"chapterName":"传染病","chapterTitle":"第18章 传染病"},{"id":"pathology-a-single-0206","type":"single","typeLabel":"单选题","number":206,"question":"图为肺淤血镜下表现，箭头所指细胞为","options":[{"key":"A","text":"心力衰竭时某些形态特殊的心肌细胞"},{"key":"B","text":"硅沉着病致右心衰竭时，肺内吞噬硅尘的巨噬细胞"},{"key":"C","text":"褐色硬变肺内含有含铁血黄素的巨噬细胞"},{"key":"D","text":"心力衰竭时肺内吞噬炭末的巨噬细胞"},{"key":"E","text":"心力衰竭时肺泡腔内的泡沫细胞"}],"answerKeys":["C"],"answerText":["褐色硬变肺内含有含铁血黄素的巨噬细胞"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：慢性肺淤血时肺泡腔内出现吞噬含铁血黄素的红细胞崩解产物，形成心衰细胞，常见于褐色硬变肺。\n解析：题目图片未提供，仅依据文字信息分析。慢性左心衰竭导致肺淤血，肺毛细血管压升高，红细胞漏入肺泡腔，被巨噬细胞吞噬；血红蛋白分解后形成棕黄色含铁血黄素颗粒，这种巨噬细胞即心衰细胞。慢性肺淤血长期存在时，肺组织因纤维结缔组织增生并伴含铁血黄素沉积而变硬、呈棕褐色，称褐色硬变肺。本题题眼是“肺淤血镜下”及“含铁血黄素巨噬细胞”，即心衰细胞。\n选项分析：\nA. 错误：心衰细胞是巨噬细胞，不是心肌细胞；且肺淤血时观察的是肺泡壁毛细血管和肺泡腔，不是特殊形态心肌细胞。\nB. 错误：硅沉着病时吞噬硅尘的巨噬细胞称尘细胞，主要与硅结节形成有关，胞质内为硅尘颗粒，不是含铁血黄素颗粒。\nC. 正确：褐色硬变肺为慢性肺淤血后果，肺泡腔及肺间质内可见含棕黄色含铁血黄素的巨噬细胞，即心衰细胞，与题干肺淤血镜下表现相符。\nD. 错误：吞噬炭末的巨噬细胞称炭末沉着细胞，见于肺门淋巴结和肺内炭末沉积，颗粒呈黑色，不是含铁血黄素。\nE. 错误：泡沫细胞是吞噬脂质的巨噬细胞，胞质呈泡沫状，常见于动脉粥样硬化等；心衰时肺泡腔内特征性细胞是含铁血黄素巨噬细胞，而非泡沫细胞。\n易混点：心衰细胞含棕黄色含铁血黄素，普鲁士蓝染色阳性；尘细胞含硅尘或炭末，分别与硅沉着病、炭末沉着有关；泡沫细胞含脂质。记忆要点：左心衰—肺淤血—红细胞漏出—巨噬细胞吞噬—含铁血黄素—心衰细胞—褐色硬变肺。","chapter":3,"chapterName":"局部血液循环障碍","chapterTitle":"第3章 局部血液循环障碍","needsImage":true},{"id":"pathology-a-single-0207","type":"single","typeLabel":"单选题","number":207,"question":"关于肾小球肾炎的发病机制，目前认为关系最密切的是","options":[{"key":"A","text":"抗原抗体复合物形成"},{"key":"B","text":"T淋巴细胞致敏"},{"key":"C","text":"机体免疫功能低下"},{"key":"D","text":"抗体直接损伤"},{"key":"E","text":"B淋巴细胞致敏"}],"answerKeys":["A"],"answerText":["抗原抗体复合物形成"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：A\n核心考点：肾小球肾炎的发病机制以抗原抗体复合物介导的免疫损伤最为重要。\n解析：大多数肾小球肾炎属于免疫复合物介导的疾病。循环免疫复合物可沉积于肾小球，也可由抗原“种植”于肾小球后与原位抗体结合形成原位免疫复合物，进而激活补体，吸引中性粒细胞和单核巨噬细胞，并促进血小板聚集、凝血及炎症介质释放，造成肾小球损伤。本题题眼是“目前认为关系最密切”，应选抗原抗体复合物形成；链球菌感染后肾小球肾炎即为循环免疫复合物沉积的典型例子，但并非所有肾炎都由同一抗原引起。\n\n选项分析：\nA. 正确：抗原抗体复合物形成并沉积于肾小球是多数肾小球肾炎最重要的发病机制，包括循环免疫复合物和原位免疫复合物两条途径。\nB. 错误：T淋巴细胞致敏主要参与细胞免疫反应，在部分新月体性肾炎等病变中有作用，但不是大多数肾小球肾炎最密切、最核心的发病机制。\nC. 错误：机体免疫功能低下主要导致反复感染或肿瘤易感，不是肾小球肾炎发生的主要直接机制；肾小球肾炎多为异常免疫应答所致。\nD. 错误：抗体直接损伤可见于抗肾小球基底膜抗体病，如Goodpasture综合征，但属于特殊类型，不能概括肾小球肾炎的主要发病机制。\nE. 错误：B淋巴细胞致敏后可产生抗体，但真正造成肾小球损伤的关键是抗体与抗原形成免疫复合物并激活补体等炎症反应，单纯“B淋巴细胞致敏”不是直接致病机制。\n\n易混点：抗GBM病是抗体直接结合基底膜，属于直接损伤；而多数肾小球肾炎是抗原抗体复合物沉积或原位形成后致病。记忆要点：肾小球肾炎“免疫复合物沉积、补体激活、炎症细胞浸润”是主线，抗GBM仅属特殊类型。","chapter":13,"chapterName":"泌尿系统疾病","chapterTitle":"第13章 泌尿系统疾病"},{"id":"pathology-a-single-0208","type":"single","typeLabel":"单选题","number":208,"question":"腺泡中央型肺气肿病变主要累及","options":[{"key":"A","text":"肺小叶"},{"key":"B","text":"终末细支气管"},{"key":"C","text":"肺泡囊"},{"key":"D","text":"呼吸性细支气管"},{"key":"E","text":"细支气管"}],"answerKeys":["D"],"answerText":["呼吸性细支气管"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：腺泡中央型肺气肿主要累及呼吸性细支气管，属于以腺泡近端为中心的肺气肿。\n解析：肺腺泡是终末细支气管远端的呼吸性细支气管、肺泡管、肺泡囊和肺泡组成的结构。腺泡中央型肺气肿时，病变自呼吸性细支气管开始，使其扩张并破坏肺泡隔，而腺泡远端肺泡相对保留。该型多见于长期吸烟者，好发于两肺上叶，题眼是“腺泡中央型”对应“呼吸性细支气管”。\n\n选项分析：\nA. 错误：肺小叶是较大的解剖单位，腺泡中央型只累及腺泡中央部，并非整个肺小叶。\nB. 错误：终末细支气管是肺腺泡的起始界标，本身不属于肺腺泡；其病变多见于细支气管炎等。\nC. 错误：肺泡囊位于腺泡远端，腺泡中央型主要保留远端肺泡，肺泡囊并非主要累及部位。\nD. 正确：腺泡中央型肺气肿主要累及呼吸性细支气管，即肺腺泡的近端部分，形成中央性扩张。\nE. 错误：细支气管一般指终末细支气管及其近端气道，不是肺腺泡中央型肺气肿的主要病变部位。\n\n易混点：全腺泡型肺气肿累及整个肺腺泡，多见于α1-抗胰蛋白酶缺乏；腺泡中央型主要累及呼吸性细支气管，多见于吸烟。记忆要点：中央型病在“呼吸性细支气管”，全腺泡型病变“从近端到远端均受累”。","chapter":10,"chapterName":"呼吸系统疾病","chapterTitle":"第10章 呼吸系统疾病"},{"id":"pathology-a-single-0209","type":"single","typeLabel":"单选题","number":209,"question":"肝细胞癌患者最有诊断意义的血清学指标是","options":[{"key":"A","text":"甲胎蛋白"},{"key":"B","text":"癌胚抗原"},{"key":"C","text":"碱性磷酸酶"},{"key":"D","text":"酸性磷酸酶"},{"key":"E","text":"γ-谷氨酰转肽酶"}],"answerKeys":["A"],"answerText":["甲胎蛋白"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：A\n核心考点：肝细胞癌最有诊断价值的血清肿瘤标志物是甲胎蛋白（AFP）。\n解析：肝细胞癌（HCC）癌细胞可重新合成大量甲胎蛋白，故血清AFP明显升高，是HCC最重要的血清学标志物。考试中常强调：在乙型肝炎、肝硬化背景下，AFP持续升高（如>400μg/L）或进行性升高，对肝细胞癌具有重要诊断意义，常与影像学检查联合应用。本题题眼是“肝细胞癌”和“最有诊断意义”，应选AFP；需注意AFP升高并非绝对特异，妊娠、卵黄囊瘤及活动性肝病等也可升高，但结合临床和影像仍以AFP为HCC首选标志物。\n选项分析：\nA. 正确：甲胎蛋白主要由胚胎期肝细胞和卵黄囊细胞产生，肝细胞癌时重新表达，血清AFP升高，是肝细胞癌最有诊断意义的血清学指标。\nB. 错误：癌胚抗原（CEA）主要与结直肠癌、胃癌、胰腺癌等腺癌相关，也可见于吸烟和某些炎症性疾病，不是肝细胞癌的特异性标志物。\nC. 错误：碱性磷酸酶（ALP）升高常见于胆汁淤积性肝病、骨病等，肝癌合并胆道梗阻或骨转移时可升高，但缺乏HCC诊断特异性。\nD. 错误：酸性磷酸酶主要与前列腺癌尤其前列腺癌骨转移相关，肝细胞癌时无特异性诊断价值。\nE. 错误：γ-谷氨酰转肽酶（GGT）在胆道梗阻、酒精性肝病、胆管癌及多种肝病中均可升高，虽肝癌可升高，但特异性和诊断意义远不如AFP。\n易混点：AFP与CEA均属肿瘤标志物，但AFP对应肝细胞癌和卵黄囊瘤，CEA多对应结直肠癌等腺癌；AFP升高也可见于活动性肝病和妊娠，需结合影像学及动态变化判断。记忆要点：肝癌标志物首选AFP，结直肠癌常用CEA。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-a-single-0210","type":"single","typeLabel":"单选题","number":210,"question":"混合血栓见于","options":[{"key":"A","text":"毛细血管内"},{"key":"B","text":"静脉血栓的头部"},{"key":"C","text":"动脉血栓的起始部"},{"key":"D","text":"心瓣膜上的赘生物"},{"key":"E","text":"静脉血栓的体部"}],"answerKeys":["E"],"answerText":["静脉血栓的体部"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n核心考点：混合血栓的组成及其在血栓形成过程中的常见部位。\n解析：混合血栓主要由血小板小梁、纤维蛋白网及网罗的红细胞和白细胞构成，肉眼呈灰白色与红褐色相间的层状结构。静脉血栓形成时，头部多为白色血栓，体部继续形成混合血栓，尾部常为红色血栓，因此混合血栓常见于静脉血栓的体部。本题题眼是“静脉血栓体部”，即血栓类型与发生部位的对应关系。\n\n选项分析：\nA. 错误：毛细血管内血流缓慢、管腔细小，常见的是由纤维蛋白构成的透明血栓，主要见于弥散性血管内凝血（DIC），不是混合血栓。\nB. 错误：静脉血栓的头部由血小板和少量纤维蛋白构成，属于白色血栓，是血栓形成的起始部分，不是混合血栓。\nC. 错误：动脉血栓的起始部通常以血小板黏附聚集为主，形成白色血栓；动脉内也可继续形成混合血栓，但“起始部”不是混合血栓的典型对应部位。\nD. 错误：心瓣膜上的赘生物常见于风湿性心内膜炎或感染性心内膜炎，主要由血小板和纤维蛋白构成，属于白色血栓，而非混合血栓。\nE. 正确：静脉血栓体部由白色血栓向血流方向继续发展而成，镜下可见血小板小梁与纤维蛋白网、红细胞和白细胞交替排列，是混合血栓的典型部位。\n\n易混点：记忆血栓类型与部位对应关系：静脉血栓“头白、体混、尾红”；心瓣膜赘生物和动脉血栓起始部多为白色血栓；毛细血管内透明血栓见于DIC；静脉血栓尾部为红色血栓。混合血栓的关键形态是灰白与红褐相间的层状结构。","chapter":3,"chapterName":"局部血液循环障碍","chapterTitle":"第3章 局部血液循环障碍"},{"id":"pathology-a-single-0211","type":"single","typeLabel":"单选题","number":211,"question":"膀胱癌的最常见组织学类型是","options":[{"key":"A","text":"肉瘤样癌"},{"key":"B","text":"鳞状细胞癌"},{"key":"C","text":"未分化癌"},{"key":"D","text":"腺癌"},{"key":"E","text":"移行细胞癌"}],"answerKeys":["E"],"answerText":["移行细胞癌"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n核心考点：膀胱癌最常见的组织学类型是移行细胞癌（尿路上皮癌）。\n解析：膀胱黏膜被覆移行上皮，膀胱癌绝大多数起源于尿路上皮，因此移行细胞癌约占膀胱癌的90
