炎不留关节畸形。\n解析：风湿病是A组乙型溶血性链球菌感染后引起的全身结缔组织变态反应性疾病，基本病变包括变质渗出、风湿小体形成和纤维化。心脏受累危害最大，风湿性心内膜炎可导致瓣膜增厚、粘连、变形，最终形成慢性心瓣膜病并严重影响心功能。风湿性关节炎为大关节游走性、非化脓性炎症，病变多可完全吸收，不造成关节畸形；导致关节畸形者主要见于类风湿关节炎。本题题眼是“风湿性关节炎是否导致关节畸形”。\n\n选项分析：\nA. 正确：风湿病本质是链球菌感染后的变态反应性全身结缔组织病，可累及心脏、关节、皮肤和中枢神经系统等。\nB. 正确：心脏病变是风湿病最严重的部位，可累及心内膜、心肌和心包，尤其慢性心瓣膜病可导致心力衰竭，对患者危害最大。\nC. 正确：风湿性心内膜炎反复发作后，瓣膜可增厚、纤维化、粘连和变形，形成慢性心瓣膜病，引起血流动力学障碍并影响心脏功能。\nD. 错误：风湿性关节炎常累及膝、踝、肩、腕等大关节，呈游走性、非化脓性炎症，愈后一般不遗留关节畸形；关节畸形是类风湿关节炎的典型表现。\nE. 正确：皮下结节为风湿小体形成的肉芽肿性病变，环形红斑为皮肤渗出性病变，二者虽非特异，但对临床诊断风湿病有提示和辅助意义。\n\n易混点：风湿性关节炎与类风湿关节炎要区分：前者“大关节、游走性、不留畸形”，后者“小关节、对称性、晨僵、易畸形”。风湿性心内膜炎的疣状赘生物位于瓣膜闭锁缘，易致瓣膜变形；风湿小体（Aschoff小体）是风湿病特征性肉芽肿病变。","chapter":9,"chapterName":"心血管系统疾病","chapterTitle":"第9章 心血管系统疾病"},{"id":"pathology-2a-single-0060","type":"single","typeLabel":"单选题","number":60,"question":"大肠癌的好发部位是","options":[{"key":"A","text":"升结肠"},{"key":"B","text":"横结肠"},{"key":"C","text":"降结肠"},{"key":"D","text":"乙状结肠"},{"key":"E","text":"直肠"}],"answerKeys":["E"],"answerText":["直肠"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n核心考点：大肠癌的好发部位及流行病学特点。\n解析：大肠癌最好发于直肠，约占大肠癌的半数左右，其次为乙状结肠，再依次为盲肠、升结肠、横结肠和降结肠。其发生与粪便在肠腔内停留时间较长、致癌物长期刺激肠黏膜有关，直肠和乙状结肠是粪便停留及刺激较明显的部位。临床常出现排便习惯改变、便血、里急后重或肠腔狭窄等表现。本题题眼是“大肠癌好发部位”，应牢记直肠第一、乙状结肠第二。\n选项分析：\nA. 错误：升结肠可以发生大肠癌，但并非最好发部位；升结肠癌常以贫血、腹部包块等右侧大肠癌表现为主，发生率低于直肠和乙状结肠。\nB. 错误：横结肠可发生癌，但属于较少见部位，不是大肠癌的好发部位，不能与直肠、乙状结肠的好发顺序混淆。\nC. 错误：降结肠可发生大肠癌，但发生率较低，多表现为左侧大肠癌的梗阻、便血等，并非本题所问的最常见部位。\nD. 错误：乙状结肠是大肠癌的第二好发部位，仅次于直肠，是本题最易误选的干扰项；考试中若问“最常见”应选直肠，若问“第二好发”则选乙状结肠。\nE. 正确：直肠是大肠癌最常见、最好发的部位，符合病理学及临床流行病学规律；直肠癌可表现为便血、排便习惯改变、里急后重和肠腔狭窄等。\n易混点：大肠癌好发部位顺序记忆为“直肠最多，乙状结肠次之”，不要与胃癌好发部位“胃窦幽门部最多”混淆。直肠癌便血常需与痔疮鉴别，但病理学考试的核心仍是好发部位和序贯顺序。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-2a-single-0061","type":"single","typeLabel":"单选题","number":61,"question":"在门脉性肝硬化与坏死后肝硬化病变的区别中，不包括","options":[{"key":"A","text":"假小叶的大小"},{"key":"B","text":"纤维间隔的厚薄"},{"key":"C","text":"炎细胞浸润的轻重"},{"key":"D","text":"肝内小血管改建的有无"},{"key":"E","text":"肝细胞坏死的多少"}],"answerKeys":["D"],"answerText":["肝内小血管改建的有无"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：门脉性肝硬化与坏死后肝硬化的形态学鉴别及二者共同的血管改建改变。\n解析：二者均属于肝硬化，基本病变都包括假小叶形成、纤维结缔组织增生和肝内血管改建，因此均可引起门脉高压。二者鉴别主要看假小叶大小是否均匀、纤维间隔厚薄、炎症和肝细胞坏死活动程度。题眼是“不包括”及“有无”：肝内小血管改建并非有无之别，而是两者共有的病理基础。\n选项分析：\nA. 正确（属于区别）：门脉性肝硬化假小叶大小较一致；坏死后肝硬化假小叶大小不一，常见较大结节。\nB. 正确（属于区别）：门脉性肝硬化纤维间隔一般较薄；坏死后肝硬化纤维间隔较宽厚，瘢痕收缩明显。\nC. 正确（属于区别）：坏死后肝硬化纤维间隔内炎细胞浸润常较明显；门脉性肝硬化相对较轻。\nD. 错误（不属于区别，为本题答案）：两者均可发生肝内小血管改建，假小叶压迫肝窦、中央静脉及门静脉分支，使血管床减少并形成异常吻合，是门脉高压的重要基础。\nE. 正确（属于区别）：坏死后肝硬化常由大片肝坏死发展而来，肝细胞坏死较多、活动性较明显；门脉性肝硬化坏死相对较少。\n易混点：门脉性肝硬化和坏死后肝硬化都有假小叶、纤维化和肝内血管改建，不能把“血管改建有无”作为鉴别点。记忆要点是：门脉性结节小、较均匀、间隔薄；坏死后结节大小不一、间隔宽厚、坏死炎症更明显。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-2a-single-0062","type":"single","typeLabel":"单选题","number":62,"question":"亚急性细菌性心内膜炎的赘生物脱落后最易引起栓塞的部位是","options":[{"key":"A","text":"皮肤"},{"key":"B","text":"心脏"},{"key":"C","text":"肾"},{"key":"D","text":"脾"},{"key":"E","text":"脑"}],"answerKeys":["E"],"answerText":["脑"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n\n核心考点：亚急性感染性心内膜炎（旧称亚急性细菌性心内膜炎）赘生物质脆易脱落，左心来源的感染性栓子随体循环血流运行，最易栓塞脑。\n\n解析：亚急性感染性心内膜炎多发生在已有风湿性瓣膜病等基础病变的瓣膜，赘生物由血栓、坏死组织和细菌共同构成，呈菜花状、质松软易碎，脱落后形成感染性栓子。病变多累及二尖瓣或主动脉瓣，栓子进入左心室后随体循环动脉血流运行，因此最常栓塞脑，可引起脑梗死、脑膜脑炎、脑脓肿或霉菌性动脉瘤，临床可见偏瘫、失语、意识障碍等。本题题眼是“赘生物脱落后最易引起栓塞”，实质考查左心感染性栓子的体循环栓塞好发部位。\n\n选项分析：\nA. 错误：皮肤可出现瘀点、Osler结节、Janeway损害等，多与微栓塞或免疫反应有关，但不是赘生物脱落后最易形成的大栓塞部位。\nB. 错误：心脏是感染性心内膜炎的原发受累部位，赘生物位于瓣膜；冠状动脉栓塞虽可发生但少见，不是最易栓塞部位。\nC. 错误：肾可发生肾动脉栓塞，引起肾梗死、局灶性肾小球肾炎等，是常见栓塞部位之一，但按标准答案不如脑最易。\nD. 错误：脾可因脾动脉栓塞发生脾梗死，亦为体循环栓塞常见部位，但不是本题“最易”部位。\nE. 正确：左心瓣膜赘生物脱落形成感染性栓子，随体循环进入脑动脉，最易引起脑栓塞，是亚急性感染性心内膜炎的重要致死和致残并发症。\n\n易混点：风湿性心内膜炎的赘生物为白色血栓，附着较牢、不易脱落；感染性心内膜炎赘生物内含细菌、质脆易脱落，左心来源栓子易致脑、脾、肾等体循环栓塞，右心来源栓子易致肺栓塞。记忆要点：左心栓子“入脑”，右心栓子“入肺”。","chapter":9,"chapterName":"心血管系统疾病","chapterTitle":"第9章 心血管系统疾病"},{"id":"pathology-2a-single-0063","type":"single","typeLabel":"单选题","number":63,"question":"关于结节性甲状腺肿的叙述，下列哪项是错误的","options":[{"key":"A","text":"甲状腺滤泡过度扩大，大小差别显著"},{"key":"B","text":"结节内常有出血、坏死、纤维增生等改变"},{"key":"C","text":"结节边界清楚，有完整包膜"},{"key":"D","text":"结节常为多个，大小不等"},{"key":"E","text":"病变后期滤泡上皮增生与复旧不一致，分布不均"}],"answerKeys":["C"],"answerText":["结节边界清楚，有完整包膜"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：结节性甲状腺肿的病理形态特点及其与甲状腺腺瘤的鉴别，关键在“有无完整包膜”。\n解析：结节性甲状腺肿是长期碘缺乏或致甲状腺肿因素作用下，甲状腺滤泡上皮反复增生与复旧不一致，形成多个大小不等的结节。镜下滤泡过度扩大、胶质潴留，滤泡大小差别显著；结节内常继发出血、坏死、纤维组织增生、钙化或囊性变。其结节虽可边界较清楚，但通常无完整包膜，包膜不完整；而“完整包膜”是甲状腺腺瘤的重要鉴别点。本题题眼即结节性甲状腺肿“无完整包膜”，故C错误。\n选项分析：\nA. 正确：结节性甲状腺肿时滤泡可显著扩张，充满胶质，滤泡大小差别明显，符合其增生与复旧不一致的特点。\nB. 正确：结节因血供和生长不均，常发生出血、坏死、纤维增生，甚至钙化和囊性变，是常见继发性改变。\nC. 错误：结节性甲状腺肿的结节通常无完整包膜，包膜可不完整或缺如；“边界清楚并有完整包膜”更符合甲状腺腺瘤。\nD. 正确：本病常为多发性结节，大小不等，可累及双侧甲状腺，呈弥漫多结节状。\nE. 正确：病变后期由于滤泡上皮增生与复旧反复进行且不一致，结节内滤泡分布不均、大小不等，间质纤维化分隔结节。\n易混点：结节性甲状腺肿与甲状腺腺瘤最常混淆。记忆要点：结节性甲状腺肿为多结节、包膜不完整、结节内外滤泡结构相似；甲状腺腺瘤多为单发、包膜完整、周围甲状腺组织受压。","chapter":15,"chapterName":"内分泌系统疾病","chapterTitle":"第15章 内分泌系统疾病"},{"id":"pathology-2a-single-0064","type":"single","typeLabel":"单选题","number":64,"question":"二尖瓣关闭不全与狭窄的病变不同之处是","options":[{"key":"A","text":"左心房肥大"},{"key":"B","text":"右心房肥大"},{"key":"C","text":"左心室肥大"},{"key":"D","text":"右心室肥大"},{"key":"E","text":"体循环淤血"}],"answerKeys":["C"],"answerText":["左心室肥大"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：二尖瓣狭窄与二尖瓣关闭不全所致血流动力学负荷不同，因而心腔肥大的部位不同。\n解析：二尖瓣狭窄时，舒张期左心房血液流入左心室受阻，左心房压力升高并肥大扩张，继而肺淤血、肺动脉高压，引起右心室肥大和右心衰竭；左心室因充盈减少，通常不肥大，甚至缩小。二尖瓣关闭不全时，收缩期部分血液反流入左心房，舒张期左心室又接受更多血液，形成左心室容量负荷过重，故左心室肥大、扩张是其特征性改变。本题题眼是“不同之处”，即二尖瓣关闭不全可出现左心室肥大，而单纯二尖瓣狭窄一般不引起左心室肥大。\n\n选项分析：\nA. 错误：左心房肥大在二尖瓣狭窄时很突出，二尖瓣关闭不全反流也可使左心房扩大，不是二者本质不同点。\nB. 错误：右心房肥大可在二者晚期合并肺动脉高压、右心衰竭时出现，不属于二尖瓣关闭不全与狭窄的特异性差别。\nC. 正确：二尖瓣关闭不全因左心室舒张期容量负荷增加而引起左心室肥大、扩张；单纯二尖瓣狭窄左心室充盈减少，通常无左心室肥大，故为关键不同点。\nD. 错误：右心室肥大主要与肺动脉高压和右心负荷增加有关，二尖瓣狭窄较典型，二尖瓣关闭不全晚期也可发生，不是最有鉴别意义的差异。\nE. 错误：体循环淤血是右心衰竭的表现，二尖瓣狭窄和关闭不全发展至右心衰竭时均可出现。\n\n易混点：二尖瓣狭窄以左心房肥大扩张、肺淤血和右心室肥大为重要表现，左心室不肥大；二尖瓣关闭不全以左心室容量负荷过重、左心室肥大扩张为特点。记忆要点：狭窄是“左房受阻、左室空虚”，关闭不全是“左室容量负荷增加”。","chapter":9,"chapterName":"心血管系统疾病","chapterTitle":"第9章 心血管系统疾病"},{"id":"pathology-2a-single-0065","type":"single","typeLabel":"单选题","number":65,"question":"目前我国死亡率最高的肿瘤是","options":[{"key":"A","text":"肝癌"},{"key":"B","text":"胃癌"},{"key":"C","text":"乳腺癌"},{"key":"D","text":"子宫颈癌"},{"key":"E","text":"肺癌"}],"answerKeys":["E"],"answerText":["肺癌"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n核心考点：本题考查我国恶性肿瘤流行病学中死亡率居首位的肿瘤类型，即肺癌。\n解析：肺癌目前是我国死亡率最高的恶性肿瘤，也是全球范围内发病率和死亡率均较高的恶性肿瘤。其发生与吸烟、大气污染、职业性粉尘/致癌物暴露及遗传易感性等有关，常见病理类型包括鳞状细胞癌、腺癌和小细胞癌；因早期症状隐匿，多数患者确诊时已属中晚期，故死亡率高。本题题眼是“死亡率最高”，应选肺癌。\n选项分析：\nA. 错误：肝癌在我国发病率及死亡率均较高，常与乙型肝炎病毒感染、肝硬化和黄曲霉毒素暴露相关，但其总体死亡率低于肺癌。\nB. 错误：胃癌是我国常见的消化道恶性肿瘤，与幽门螺杆菌感染、慢性萎缩性胃炎及饮食习惯有关，死亡率较高但并非首位。\nC. 错误：乳腺癌是女性常见恶性肿瘤，发病率较高，但死亡率低于肺癌；男性乳腺癌少见。\nD. 错误：子宫颈癌与高危型HPV持续感染密切相关，筛查和疫苗可降低其发生及死亡，死亡率不是最高。\nE. 正确：肺癌为我国死亡率最高的恶性肿瘤，吸烟是最重要危险因素，病理上以鳞癌、腺癌和小细胞癌常见，早期诊断困难是死亡率高的重要原因。\n易混点：注意区分“发病率最高”和“死亡率最高”。乳腺癌常被认为是女性发病率最高的肿瘤，但女性恶性肿瘤死亡首位通常仍为肺癌；我国肝癌、胃癌死亡率也高，但总体均低于肺癌。记忆要点：我国肿瘤死亡谱首位是肺癌。","chapter":6,"chapterName":"肿瘤","chapterTitle":"第6章 肿瘤"},{"id":"pathology-2a-single-0066","type":"single","typeLabel":"单选题","number":66,"question":"心衰细胞见于","options":[{"key":"A","text":"右心衰竭时肺泡腔内"},{"key":"B","text":"肺水肿时肺泡腔内"},{"key":"C","text":"脾淤血时脾脏内"},{"key":"D","text":"左心衰竭时肺泡腔内"},{"key":"E","text":"肝淤血时肝脏内"}],"answerKeys":["D"],"answerText":["左心衰竭时肺泡腔内"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：心衰细胞是左心衰竭引起慢性肺淤血时，肺泡腔内吞噬红细胞并形成含铁血黄素的巨噬细胞。\n解析：左心衰竭时肺静脉回流受阻，肺淤血、肺水肿，红细胞可漏入肺泡腔，被肺泡巨噬细胞吞噬；红细胞崩解后血红蛋白分解为含铁血黄素，巨噬细胞胞质内出现棕黄色颗粒，即心衰细胞。其本质是含铁血黄素巨噬细胞，题眼是“左心衰竭”与“肺泡腔”同时出现。\n\n选项分析：\nA. 错误：右心衰竭主要引起体循环淤血，肺循环一般不受阻，不会形成肺淤血所致的心衰细胞；右心衰可见下肢水肿、肝大等。\nB. 错误：肺水肿时肺泡腔内可有水肿液，但心衰细胞特指左心衰慢性肺淤血时含铁血黄素的巨噬细胞，并非所有肺水肿均出现。\nC. 错误：脾淤血时脾脏内可有含铁血黄素沉着及巨噬细胞，但“心衰细胞”是肺内病变的专称，定位不在脾。\nD. 正确：左心衰竭导致肺淤血，红细胞漏入肺泡腔，巨噬细胞吞噬后形成含铁血黄素，即心衰细胞，位于肺泡腔内。\nE. 错误：肝淤血典型表现为肝窦扩张淤血、肝细胞脂肪变和坏死，形成槟榔肝，不是心衰细胞的所在部位。\n\n易混点：心衰细胞与一般含铁血黄素巨噬细胞概念相近，但考试中心衰细胞特指左心衰肺淤血时肺泡腔内者；脾淤血、陈旧性出血也可有含铁血黄素沉着，但部位和命名不同。记忆要点：左心衰—肺淤血—肺泡腔—含铁血黄素巨噬细胞=心衰细胞。","chapter":3,"chapterName":"局部血液循环障碍","chapterTitle":"第3章 局部血液循环障碍"},{"id":"pathology-2a-single-0067","type":"single","typeLabel":"单选题","number":67,"question":"门脉性肝硬化脾肿大的主要原因是","options":[{"key":"A","text":"脾脏内单核巨噬细胞增生"},{"key":"B","text":"门静脉压力增高"},{"key":"C","text":"肝静脉血栓形成"},{"key":"D","text":"腹水压迫使脾静脉回流障碍"},{"key":"E","text":"脾脏内纤维结缔组织增生"}],"answerKeys":["B"],"answerText":["门静脉压力增高"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：门脉性肝硬化时门静脉高压导致脾慢性淤血，是脾肿大的主要原因。\n解析：门脉性肝硬化时，假小叶形成及纤维组织增生使肝内血管床减少、肝血窦受压，门静脉回流受阻，形成窦后性门静脉高压。门静脉压力增高后，脾静脉回流受阻，脾脏长期慢性淤血，脾窦扩张充血、红髓增生并伴纤维化，故脾脏肿大。本题题眼是“主要原因”，即门静脉压力增高引起的慢性淤血，而非脾内细胞或纤维成分的原发性增生。\n选项分析：\nA. 错误：脾脏内单核巨噬细胞增生可见于慢性淤血及脾功能亢进，是继发改变之一，可引起血细胞减少，但不是脾肿大的主要原因。\nB. 正确：门静脉压力增高使脾静脉回流受阻，脾长期慢性淤血，是门脉性肝硬化脾肿大的主要机制。\nC. 错误：肝静脉血栓形成主要见于布加综合征，可引起肝淤血和门静脉高压，但不是门脉性肝硬化脾肿大的主要直接原因。\nD. 错误：腹水是门静脉高压、低蛋白血症等因素的结果；大量腹水可增加腹压，但并非脾静脉回流障碍和脾肿大的主要原因。\nE. 错误：脾脏内纤维结缔组织增生属于慢性脾淤血后的继发性改变，可致脾质地变硬，但不是脾肿大的主要原因。\n易混点：门脉性肝硬化脾大主要因门静脉高压导致的慢性淤血；脾功能亢进则主要表现为脾大伴单核巨噬细胞增生和血细胞减少。记忆要点：先有门脉高压，后有脾淤血肿大，脾内增生和纤维化多为继发改变。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-2a-single-0068","type":"single","typeLabel":"单选题","number":68,"question":"下列不是恶性肿瘤可以出现的情况的是","options":[{"key":"A","text":"转移"},{"key":"B","text":"可出血、坏死、囊性变"},{"key":"C","text":"可呈膨胀性生长或外生性生长"},{"key":"D","text":"生长快，不浸润"},{"key":"E","text":"浸润性生长"}],"answerKeys":["D"],"answerText":["生长快，不浸润"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：恶性肿瘤的生物学行为包括浸润性生长和转移，生长快且不浸润不符合恶性肿瘤特点。\n解析：恶性肿瘤细胞增殖失控，生长迅速，同时向周围组织呈浸润性生长，并可通过淋巴道、血道或种植等途径转移。因此“生长快，不浸润”将恶性肿瘤的两个重要特征错误对立起来，是本题题眼。恶性肿瘤因生长快、血供不足，常继发出血、坏死、囊性变；其生长方式可表现为浸润性，也可呈外生性或膨胀性生长，但后者常伴基底浸润或包膜不完整。\n选项分析：\nA. 正确：转移是恶性肿瘤最可靠的生物学标志之一，可通过淋巴道、血道、种植等途径发生，故恶性肿瘤可以出现转移。\nB. 正确：恶性肿瘤生长迅速，血供相对不足，易发生出血、坏死，坏死液化后可形成囊性变，故可出现这些继发性改变。\nC. 正确：外生性生长可见于良性肿瘤，也可见于恶性肿瘤，如皮肤、胃肠道黏膜的息肉状或菜花状癌；部分恶性肿瘤可呈膨胀性生长，但常包膜不完整并伴浸润，因此“可呈膨胀性生长或外生性生长”属于可出现的情况。\nD. 错误：恶性肿瘤生长快，但常同时具有浸润性生长，向周围组织浸润是其重要恶性特征；“生长快，不浸润”不符合恶性肿瘤的生物学行为，故为本题答案。\nE. 正确：浸润性生长是恶性肿瘤常见的生长方式，癌细胞可浸润周围间质、血管、淋巴管及邻近组织，是判断恶性的重要依据之一。\n易混点：良性肿瘤多呈膨胀性生长、有完整包膜；恶性肿瘤多呈浸润性生长、包膜不完整或无包膜。外生性生长并非良性肿瘤特有，恶性肿瘤也可外生性生长，但基底部常有浸润；不要将“外生性”或“膨胀性”简单等同于良性。","chapter":6,"chapterName":"肿瘤","chapterTitle":"第6章 肿瘤"},{"id":"pathology-2a-single-0069","type":"single","typeLabel":"单选题","number":69,"question":"食管癌的直接浸润一般不会引起","options":[{"key":"A","text":"食管-气管瘘"},{"key":"B","text":"肺脓肿"},{"key":"C","text":"脓胸"},{"key":"D","text":"大出血"},{"key":"E","text":"颈部淋巴结肿大"}],"answerKeys":["E"],"answerText":["颈部淋巴结肿大"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n核心考点：食管癌直接浸润与淋巴道转移的区别，即癌组织连续蔓延累及邻近器官，而颈部淋巴结肿大主要属于淋巴道转移。\n解析：食管癌可直接穿透食管壁，侵犯气管、支气管、胸膜、纵隔及大血管等邻近结构。侵犯气管或支气管可形成食管-气管瘘，继发吸入性感染引起肺脓肿；侵及胸膜或纵隔并继发感染可形成脓胸；侵犯主动脉等大血管可引起大出血。颈部淋巴结肿大通常是癌细胞经淋巴道转移至颈部淋巴结所致，不属于直接浸润的典型表现，故本题选E。\n选项分析：\nA. 错误：食管癌直接浸润气管或支气管壁可形成食管-气管瘘，属于邻近器官直接蔓延的常见并发症。\nB. 错误：食管-气管瘘形成后，食物和分泌物进入肺内可引起吸入性肺炎，进而形成肺脓肿，因此可与直接浸润及其继发后果相关。\nC. 错误：癌组织穿透食管壁累及胸膜、纵隔，继发感染后可形成脓胸，属于局部蔓延及并发症。\nD. 错误：食管癌侵犯主动脉等大血管时可导致大出血，是直接浸润血管壁的危险并发症。\nE. 正确：颈部淋巴结肿大主要提示淋巴道转移，尤其上段食管癌可转移至颈部淋巴结；它不是食管癌直接浸润的典型结果，题眼在“直接浸润”与“淋巴转移”的鉴别。\n易混点：直接浸润是癌组织连续向周围组织蔓延，常累及气管、支气管、胸膜、纵隔和大血管；淋巴结肿大通常提示淋巴道转移。记忆要点：食管-气管瘘、肺脓肿、脓胸、大出血属局部浸润或继发并发症，颈部淋巴结肿大属转移表现。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-2a-single-0070","type":"single","typeLabel":"单选题","number":70,"question":"下列因素与动脉阻塞无关的是","options":[{"key":"A","text":"血栓形成"},{"key":"B","text":"动脉瘤"},{"key":"C","text":"肿瘤压迫"},{"key":"D","text":"动脉粥样硬化"},{"key":"E","text":"动脉栓塞"}],"answerKeys":["B"],"answerText":["动脉瘤"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：动脉阻塞的常见原因及其病理机制。\n解析：动脉阻塞是指动脉管腔被机械性堵塞或受压变窄，导致血流中断或明显减少。常见原因包括动脉内血栓形成、动脉栓塞、动脉粥样硬化斑块致管腔狭窄，以及肿瘤等外部压迫。动脉瘤是动脉壁局限性异常扩张，本身不是阻塞性病变；虽然动脉瘤可并发附壁血栓、血栓脱落或压迫邻近结构而间接引起阻塞，但“动脉瘤”本身不属于动脉阻塞的直接原因，故本题题眼是区分“动脉壁扩张性病变”与“管腔阻塞性病变”。\n\n选项分析：\nA. 正确：血栓形成可堵塞动脉管腔，常见于动脉粥样硬化、血管炎或血流缓慢、内皮损伤等情况，是动脉阻塞的常见原因。\nB. 正确：动脉瘤是动脉壁局限性扩张，可破裂、形成附壁血栓或压迫邻近组织，但本身不是导致动脉阻塞的直接因素，符合题意。\nC. 错误：肿瘤压迫可从外部压迫动脉，使管腔狭窄甚至闭塞，属于动脉阻塞的机械性原因之一。\nD. 错误：动脉粥样硬化斑块可向管腔内突出造成狭窄，并可继发血栓形成，是动脉阻塞的重要基础病变。\nE. 错误：动脉栓塞是栓子随血流堵塞动脉，如血栓栓子、粥样斑块脱落物等，可直接造成动脉阻塞。\n\n易混点：动脉瘤可合并附壁血栓，进而引起远端栓塞或阻塞，但这是动脉瘤的并发症，不是动脉瘤本身导致阻塞；动脉粥样硬化则既可直接造成管腔狭窄，又可促进血栓形成，是考试中常考的双重机制。","chapter":3,"chapterName":"局部血液循环障碍","chapterTitle":"第3章 局部血液循环障碍"},{"id":"pathology-2a-single-0071","type":"single","typeLabel":"单选题","number":71,"question":"下列哪项属于门脉性肝硬化的病变特点","options":[{"key":"A","text":"假小叶大小不等"},{"key":"B","text":"纤维间隔较宽"},{"key":"C","text":"炎细胞浸润明显"},{"key":"D","text":"假小叶大小相仿"},{"key":"E","text":"碎片状坏死"}],"answerKeys":["D"],"answerText":["假小叶大小相仿"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：门脉性肝硬化属于小结节型肝硬化，其假小叶大小相仿、分布较均匀。\n解析：门脉性肝硬化早期肝脏可稍大，后期缩小、质硬，表面呈弥漫细颗粒状或小结节状；镜下假小叶大小相仿，纤维间隔较窄且较均匀，间隔内炎细胞浸润较轻。题眼是“门脉性肝硬化”，应联系小结节型肝硬化的均匀性病变特点，故选D。\n选项分析：\nA. 错误：假小叶大小不等主要见于坏死后性肝硬化（大结节型），其结节大小悬殊、纤维间隔宽窄不一。\nB. 错误：纤维间隔较宽是坏死后性肝硬化的特点；门脉性肝硬化的纤维间隔一般较窄且较均匀。\nC. 错误：炎细胞浸润明显多见于坏死后性肝硬化或活动性肝炎/活动性肝硬化，门脉性肝硬化纤维间隔内炎细胞浸润相对较轻。\nD. 正确：门脉性肝硬化为小结节型肝硬化，假小叶大小相仿，结节较小且均匀，是本病的典型形态学特点。\nE. 错误：碎片状坏死即界面炎，是慢性活动性肝炎的重要病变和活动度指标，不是门脉性肝硬化的特征性病变；肝硬化可伴活动性炎症，但不能以此作为门脉性肝硬化的病变特点。\n易混点：门脉性肝硬化＝小结节型，假小叶大小相仿、间隔窄而均匀；坏死后性肝硬化＝大结节型，假小叶大小不等、间隔宽大、炎细胞浸润明显。记忆要点：门脉性“小、匀、窄”，坏死后性“大、不等、宽”。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-2a-single-0072","type":"single","typeLabel":"单选题","number":72,"question":"下列哪种癌较早经淋巴道转移","options":[{"key":"A","text":"甲状腺乳头状腺癌"},{"key":"B","text":"食管鳞状细胞癌"},{"key":"C","text":"子宫颈鳞状细胞癌"},{"key":"D","text":"鼻咽低分化鳞状细胞癌"},{"key":"E","text":"胃黏液腺癌"}],"answerKeys":["D"],"answerText":["鼻咽低分化鳞状细胞癌"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：鼻咽低分化鳞状细胞癌侵袭性强，早期即可经淋巴道转移至颈部淋巴结。\n解析：鼻咽黏膜淋巴管丰富，低分化鳞癌（及未分化癌）侵袭性强，癌细胞易早期侵入淋巴管，首先转移至颈深上淋巴结，临床常以无痛性颈部淋巴结肿大为首发症状，原发灶甚至较隐匿。本题题眼是“较早经淋巴道转移”，强调鼻咽低分化鳞癌以早期颈淋巴结转移为突出特点。\n\n选项分析：\nA. 错误：甲状腺乳头状腺癌虽也常见淋巴道转移，但肿瘤生长相对缓慢，临床多先表现为甲状腺结节，淋巴道转移不如鼻咽低分化鳞癌那样早期、以颈部淋巴结肿大为首发表现突出。\nB. 错误：食管鳞状细胞癌可经淋巴道转移，但早期主要沿黏膜及黏膜下层局部浸润，淋巴结转移多随浸润深度和病程进展而出现，并非本题所指“较早”的典型代表。\nC. 错误：子宫颈鳞状细胞癌以直接蔓延为主，可累及宫旁、阴道及邻近器官，淋巴道转移一般随临床分期进展而增多，不属于早期即突出经淋巴道转移的癌。\nD. 正确：鼻咽低分化鳞状细胞癌好发于咽隐窝，黏膜淋巴管丰富、癌细胞分化低而侵袭性强，常早期转移至颈深上淋巴结，颈部肿块可为最早症状，符合“较早经淋巴道转移”。\nE. 错误：胃黏液腺癌（包括印戒细胞癌）易发生腹腔种植转移，如双侧卵巢Krukenberg瘤，也可经淋巴道转移，但“早期、突出经淋巴道转移”不是其典型特点。\n\n易混点：甲状腺乳头状腺癌也常有淋巴道转移，是本题最强干扰项；记忆要点是鼻咽低分化鳞癌常“原发灶小、颈部淋巴结大”，以颈淋巴结转移为首发表现。一般规律为癌多经淋巴道转移、肉瘤多经血道转移，但具体癌种需结合其生物学行为和好发转移部位判断。","chapter":6,"chapterName":"肿瘤","chapterTitle":"第6章 肿瘤"},{"id":"pathology-2a-single-0073","type":"single","typeLabel":"单选题","number":73,"question":"胃溃疡病变最多见的部位是","options":[{"key":"A","text":"大弯近幽门部"},{"key":"B","text":"小弯近幽门部"},{"key":"C","text":"小弯区近贲门部"},{"key":"D","text":"小弯角切迹部"},{"key":"E","text":"贲门"}],"answerKeys":["B"],"answerText":["小弯近幽门部"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：慢性胃溃疡最好发于胃小弯近幽门部，尤其胃窦部小弯侧。\n解析：胃溃疡多发生在胃小弯近幽门部，该处为胃窦黏膜与胃酸、胃蛋白酶接触较多的区域，且幽门螺杆菌感染和黏膜防御修复失衡常较明显。病变常为圆形或椭圆形，直径多小于2cm，边缘整齐，底部平坦，周围黏膜皱襞可呈放射状集中；镜下可见渗出层、坏死层、肉芽组织层和瘢痕层。题眼是“最多见部位”，应选小弯近幽门部，而不是泛泛的小弯任何部位。\n选项分析：\nA. 错误：大弯近幽门部不是消化性溃疡的典型好发部位，大弯侧溃疡较少见，若见较大溃疡需警惕恶性溃疡或其他特殊病因。\nB. 正确：胃溃疡最多见于小弯近幽门部，尤其胃窦小弯侧，是本章最常考的发病部位。\nC. 错误：小弯近贲门部不是胃溃疡好发部位，贲门附近溃疡发生率低，不能作为“最多见”部位。\nD. 错误：小弯角切迹部属于小弯侧，可为溃疡发生部位之一，但更靠胃体侧，不是最多见的近幽门胃窦小弯侧，故不如B准确。\nE. 错误：贲门部溃疡少见，贲门部病变还常需与贲门癌等鉴别，不是胃溃疡最多见部位。\n易混点：胃溃疡好发于小弯近幽门部，胃癌也好发于胃窦小弯侧，但良性溃疡多直径小于2cm、边缘整齐、皱襞向溃疡集中；恶性溃疡常较大、边缘不整、皱襞中断。十二指肠溃疡则好发于球部，疼痛多有饥饿痛或夜间痛，而胃溃疡多为餐后痛。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-2a-single-0074","type":"single","typeLabel":"单选题","number":74,"question":"萎缩的心肌细胞内常可出现","options":[{"key":"A","text":"橙色血质"},{"key":"B","text":"含缺血黄素"},{"key":"C","text":"脂褐素"},{"key":"D","text":"疟色素"},{"key":"E","text":"黑色素"}],"answerKeys":["C"],"answerText":["脂褐素"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：萎缩的心肌细胞常出现脂褐素沉积，脂褐素又称“消耗性色素”或“萎缩性色素”，是细胞萎缩的重要形态学表现之一。\n解析：心肌细胞萎缩时，细胞体积缩小、胞质减少，同时溶酶体对细胞器膜结构进行自噬性降解，膜脂质过氧化后可形成棕黄色、细颗粒状的脂褐素，常聚集于细胞核两端。脂褐素不含铁，普鲁士蓝染色阴性，一般不影响细胞功能，但可使萎缩组织呈棕褐色，称为褐色萎缩。本题题眼是“萎缩的心肌细胞内出现”，应联想到脂褐素沉积。\n\n选项分析：\nA. 错误：橙色血质是血红蛋白在血肿吸收过程中分解形成的色素，多见于陈旧性出血灶周围，并非心肌细胞萎缩时的典型胞内色素。\nB. 错误：含铁血黄素（题中“含缺血黄素”应为笔误）是血红蛋白分解后形成的含铁色素，常见于陈旧性出血、肺淤血时的心力衰竭细胞，普鲁士蓝染色阳性，不属于单纯萎缩的特征性改变。\nC. 正确：萎缩心肌细胞自噬增强，细胞器膜脂质降解后形成脂褐素，呈棕黄色细颗粒，位于核两端，是萎缩性色素沉积的典型表现。\nD. 错误：疟色素是疟原虫分解红细胞内血红蛋白后形成的色素，主要沉积于肝、脾、骨髓等单核巨噬细胞系统，不是心肌萎缩时的胞内色素。\nE. 错误：黑色素由黑素细胞产生，见于皮肤痣、黑色素瘤及某些神经组织，与心肌细胞萎缩无直接关系。\n\n易混点：脂褐素与含铁血黄素均可呈棕黄色颗粒，但脂褐素位于萎缩细胞核两端、无铁、普鲁士蓝阴性，称消耗性色素；含铁血黄素与出血和溶血有关、含铁、普鲁士蓝阳性。记忆：萎缩找脂褐素，出血找含铁血黄素。","chapter":1,"chapterName":"细胞和组织的适应与损伤","chapterTitle":"第1章 细胞和组织的适应与损伤"},{"id":"pathology-2a-single-0075","type":"single","typeLabel":"单选题","number":75,"question":"继发性肺结核的早期病灶多出现在","options":[{"key":"A","text":"肺尖下2～4cm处"},{"key":"B","text":"肺门"},{"key":"C","text":"肺底部"},{"key":"D","text":"右肺上叶背部"},{"key":"E","text":"右肺上叶下部或下叶上部近脏胸膜处"}],"answerKeys":["A"],"answerText":["肺尖下2～4cm处"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：A\n\n核心考点：继发性肺结核的早期病灶好发于肺尖下2～4cm处，即锁骨上下区，是成人肺结核最常见的再感染类型。\n\n解析：继发性肺结核多由内源性再感染或外源性再感染引起，早期病变常位于肺尖下2～4cm处，形成渗出性病变及干酪样坏死，继而可发生纤维化、空洞形成。镜下典型可见结核结节，由上皮样细胞、Langhans巨细胞、淋巴细胞及成纤维细胞构成。\n\n选项分析：\nA. 正确：继发性肺结核早期病灶多位于肺尖下2～4cm处，符合其好发部位，故为标准答案。\nB. 错误：肺门是原发性肺结核原发综合征中肺门淋巴结结核的常见部位，不是继发性肺结核早期病灶的典型起始部位。\nC. 错误：肺底部不是肺结核的好发部位；继发性肺结核好发于上叶尖后段及下叶背段，肺底病变多见于其他疾病或继发播散。\nD. 错误：右肺上叶背部并非继发性肺结核早期病灶的典型描述；继发性肺结核虽可累及上叶，但早期题眼为肺尖下2～4cm处，而非“背部”这一含糊部位。\nE. 错误：右肺上叶下部或下叶上部近脏胸膜处是原发性肺结核原发灶的典型部位，常与结核性淋巴管炎、肺门淋巴结结核共同构成原发综合征，不能误作继发性肺结核早期病灶。\n\n易混点：原发性肺结核原发灶多位于右肺上叶下部或下叶上部近脏胸膜处，并伴肺门淋巴结结核；继发性肺结核早期病灶则多在肺尖下2～4cm处。记忆要点：原发灶靠胸膜、偏下；继发灶在肺尖下、锁骨上下区。","chapter":18,"chapterName":"传染病","chapterTitle":"第18章 传染病"},{"id":"pathology-2a-single-0076","type":"single","typeLabel":"单选题","number":76,"question":"关于炎症的论述，下列正确的是","options":[{"key":"A","text":"炎症反应均对机体有利"},{"key":"B","text":"炎症是一种防御反应"},{"key":"C","text":"任何有机体均可发生炎症"},{"key":"D","text":"损伤必然导致炎症"},{"key":"E","text":"炎症是活体组织的损伤"}],"answerKeys":["B"],"answerText":["炎症是一种防御反应"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：炎症是具有血管系统的活体组织对损伤因子所发生的防御性反应。\n解析：炎症的本质是机体对致炎因子及其造成的损伤所产生的一种以血管反应为中心的防御性反应，包括损伤、抗损伤和修复三个相互关联的过程。其典型表现是局部血管扩张、通透性增加、白细胞渗出及组织增生，临床上常有红、肿、热、痛和功能障碍。本题题眼是“炎症是一种防御反应”，强调其生物学意义在于消除损伤因子、清除坏死组织并促进修复，而不是单纯的组织损伤。\n\n选项分析：\nA. 错误：炎症虽然总体上属于防御反应，但并非“均对机体有利”。过度或失控的炎症可造成组织破坏，如过敏性炎症、自身免疫性炎症可导致严重损伤；化脓性炎也可引起脓肿形成和全身中毒。\nB. 正确：炎症是活体组织对损伤因子的防御性反应，核心环节是血管反应和白细胞渗出，目的是局限和清除损伤因子、修复受损组织。\nC. 错误：并非任何有机体均可发生炎症。典型炎症需要具有血管系统的活体组织参与；单细胞生物和无血管的多细胞生物没有完整的血管反应，不能发生典型炎症。\nD. 错误：损伤不一定必然导致炎症。轻微损伤可通过细胞适应或修复机制处理；某些损伤可表现为变性、坏死或适应反应，只有活体组织对损伤因子产生血管反应性防御时才构成炎症。\nE. 错误：炎症不是“活体组织的损伤”，而是损伤与抗损伤、修复并存的综合病理过程。组织损伤只是炎症的组成部分或诱因，不能概括炎症的本质。\n\n易混点：最易混淆的是“炎症是损伤”与“炎症是防御反应”。记忆要点：炎症＝具有血管系统的活体组织＋对损伤因子的防御反应；无血管系统者不发生典型炎症，损伤也不必然等于炎症。","chapter":4,"chapterName":"炎症","chapterTitle":"第4章 炎症"},{"id":"pathology-2a-single-0077","type":"single","typeLabel":"单选题","number":77,"question":"肝细胞碎片状坏死和桥接坏死最常见于","options":[{"key":"A","text":"急性普通型肝炎"},{"key":"B","text":"重度慢性肝炎"},{"key":"C","text":"急性普通型黄疸性肝炎"},{"key":"D","text":"急性重型肝炎"},{"key":"E","text":"亚急性重型肝炎"}],"answerKeys":["B"],"answerText":["重度慢性肝炎"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：碎片状坏死和桥接坏死是重度慢性肝炎的重要形态学标志，反映肝炎活动度和肝小叶结构破坏程度。\n解析：碎片状坏死又称界面炎，指汇管区周围界板处肝细胞呈灶状坏死，伴淋巴细胞、单核细胞浸润并侵入肝小叶周边；桥接坏死指坏死带连接相邻小叶中央区、中央区与汇管区或汇管区与汇管区。二者均提示慢性肝炎活动明显、程度较重，最常见于重度慢性肝炎。题眼是“碎片状坏死和桥接坏死”，应联系慢性肝炎分级、分期及预后判断。\n选项分析：\nA. 错误：急性普通型肝炎以肝细胞广泛水肿、气球样变和点状坏死为主，可见嗜酸性小体，汇管区炎症较轻，一般不出现明显碎片状坏死和桥接坏死。\nB. 正确：重度慢性肝炎活动明显，界板破坏形成碎片状坏死，坏死可扩展并相互连接形成桥接坏死，常伴纤维组织增生，易发展为肝硬化。\nC. 错误：急性普通型黄疸性肝炎仍属急性普通型肝炎范畴，可有肝细胞肿胀、点状坏死及毛细胆管内胆栓，但碎片状坏死和桥接坏死不是其典型或最常见病变。\nD. 错误：急性重型肝炎表现为大块坏死或广泛大片状坏死，肝体积明显缩小，起病急、肝衰竭明显；其坏死范围远大于碎片状坏死和桥接坏死。\nE. 错误：亚急性重型肝炎以亚大块坏死为主，坏死区可见肝细胞结节状再生、小胆管增生和炎症细胞浸润；虽可出现较广泛坏死连接，但“最常见于”碎片状坏死和桥接坏死的仍是重度慢性肝炎。\n易混点：碎片状坏死即界面炎，是慢性肝炎活动度的重要指标；桥接坏死提示中重度慢性肝炎。亚急性重型肝炎要与重度慢性肝炎鉴别，前者以亚大块坏死、结节状再生和肝功能衰竭为主，后者以碎片状坏死、桥接坏死和纤维化进展为特点。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-2a-single-0078","type":"single","typeLabel":"单选题","number":78,"question":"下列哪项符合慢性肺源性心脏病的演进","options":[{"key":"A","text":"支气管肺炎→代偿性肺气肿→慢性肺心病"},{"key":"B","text":"慢性支气管炎→阻塞性肺气肿→慢性肺心病"},{"key":"C","text":"间质性肺炎→间质性肺气肿→慢性肺心病"},{"key":"D","text":"大叶性肺炎→肺肉质变→慢性肺心病"},{"key":"E","text":"肺癌阻塞、压迫支气管→肺气→慢性肺心病"}],"answerKeys":["B"],"answerText":["慢性支气管炎→阻塞性肺气肿→慢性肺心病"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：慢性肺源性心脏病最常见的演进途径是“慢性支气管炎→阻塞性肺气肿→慢性肺心病”。\n解析：慢性支气管炎长期反复发作可导致气道阻塞、肺泡壁破坏和弹性减退，形成阻塞性肺气肿；肺气肿使肺泡内压增高、肺毛细血管床减少，并引起缺氧性肺血管收缩，逐渐形成肺动脉高压，右心室后负荷增加，最终发生右心室肥厚、扩张，即慢性肺心病。本题题眼是“演进”，即从常见慢性气道病变逐步发展为肺气肿，再经肺动脉高压累及右心。\n\n选项分析：\nA. 错误：支气管肺炎多由细菌感染引起，主要累及小叶，痊愈后一般不留广泛肺气肿；“代偿性肺气肿”多为局部肺组织代偿性膨胀，并非广泛肺泡壁破坏，不足以形成持续肺动脉高压和慢性肺心病。\nB. 正确：慢性支气管炎引起小气道阻塞和阻塞性肺气肿，导致肺毛细血管床减少及缺氧性肺血管收缩，进而肺动脉高压、右心室肥大扩张，是慢性肺心病最经典、最常见的演进过程。\nC. 错误：间质性肺炎主要累及肺间质，可致肺纤维化、限制性通气障碍和弥散障碍，严重间质性肺病可晚期引起肺心病；但“间质性肺气肿”是气体进入肺间质，并非本题所述慢性气道阻塞演变为肺心病的典型链条。\nD. 错误：大叶性肺炎的并发症“肺肉质变”是肺泡腔内渗出物机化、纤维化，属于局限性纤维化改变，不会形成广泛阻塞性肺气肿，也不是慢性肺心病的常见演进途径。\nE. 错误：肺癌阻塞或压迫支气管可引起阻塞性肺气肿、肺不张，严重者晚期可影响肺功能甚至导致肺心病，但属于局限性或继发性改变，不是慢性肺心病最常见、最典型的演进过程；且题干“肺气”表述不完整准确。\n\n易混点：慢性肺心病最常见基础病是慢性阻塞性肺疾病，核心环节是肺动脉高压和右心室肥大；代偿性肺气肿无广泛肺泡壁破坏，间质性肺气肿位于肺间质，均不能等同于慢支并发的阻塞性肺气肿。肺肉质变应联系大叶性肺炎机化，而不是肺气肿。","chapter":10,"chapterName":"呼吸系统疾病","chapterTitle":"第10章 呼吸系统疾病"},{"id":"pathology-2a-single-0079","type":"single","typeLabel":"单选题","number":79,"question":"炎症反应的最重要的特征是","options":[{"key":"A","text":"血清渗出"},{"key":"B","text":"血浆渗出"},{"key":"C","text":"纤维素渗出"},{"key":"D","text":"白细胞渗出"},{"key":"E","text":"红细胞渗出"}],"answerKeys":["D"],"answerText":["白细胞渗出"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：炎症反应最重要的特征是白细胞渗出，并进一步在局部发挥吞噬、免疫和损伤修复作用。\n解析：炎症时血管通透性增高，血浆成分和细胞成分进入组织间隙。其中白细胞从血管内边集、黏附、游出并沿趋化因子定向移动至炎症灶，是机体清除病原体和坏死组织的关键环节，因此白细胞渗出是炎症反应最重要的特征。题眼是“最重要”，强调细胞性防御反应而非单纯液体渗出。\n选项分析：\nA. 错误：血清渗出不是炎症的特征性核心改变。血清是血液凝固后析出的液体成分，炎症时更规范的描述是血浆成分渗出形成渗出液；即使有血清样液体渗出，也不能代表炎症最重要的防御机制。\nB. 错误：血浆渗出是血管通透性增高的表现，形成富含蛋白的渗出液，见于多种炎症，但它主要反映血管改变，不是炎症最重要的特征。\nC. 错误：纤维素渗出是纤维蛋白原渗出并凝固，常见于纤维素性炎，如大叶性肺炎、假膜性炎和“绒毛心”，属于特定类型炎症的表现，不能概括所有炎症最重要的特征。\nD. 正确：白细胞渗出包括边集、黏附、游出和趋化，随后可吞噬病原体、释放炎症介质并参与组织损伤与修复，是炎症反应最重要的细胞学特征。\nE. 错误：红细胞渗出提示血管损伤较重，常见于出血性炎，如流行性出血热、钩端螺旋体病、鼠疫等；它反映损伤严重，不是炎症最重要的防御特征。\n易混点：注意“白细胞渗出”强调主动游出血管进入组织，而“白细胞浸润”强调已聚集于组织内；渗出液富含蛋白和细胞、易凝固，漏出液蛋白少、细胞少，两者机制和意义不同。记忆要点：炎症最重要看白细胞，纤维素性炎看纤维蛋白，出血性炎看红细胞。","chapter":4,"chapterName":"炎症","chapterTitle":"第4章 炎症"},{"id":"pathology-2a-single-0080","type":"single","typeLabel":"单选题","number":80,"question":"肾细胞癌最常发生于","options":[{"key":"A","text":"随机发生"},{"key":"B","text":"肾中部"},{"key":"C","text":"肾下极"},{"key":"D","text":"肾上极"},{"key":"E","text":"肾门"}],"answerKeys":["D"],"answerText":["肾上极"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：肾细胞癌的好发部位及肾实质恶性肿瘤的病理特点。\n解析：肾细胞癌起源于肾小管上皮细胞，是肾脏最常见的恶性肿瘤，多位于肾实质内，传统病理学描述其最常发生于肾上极。肉眼观肿瘤常呈球形，切面淡黄色或灰白色，可伴出血、坏死及囊性变，周围常有假包膜。题眼是“最常发生部位”，应选肾上极而非肾门等部位。\n选项分析：\nA. 错误：肾细胞癌并非随机发生，其发生具有一定部位倾向，最常位于肾上极，故不能选“随机发生”。\nB. 错误：肾中部可发生肾细胞癌，但不是最常发生的部位；该选项混淆了好发部位与可能发生部位。\nC. 错误：肾下极也可发生肾细胞癌，但相较上极并非最常发生部位，故不选。\nD. 正确：肾细胞癌多起源于肾小管上皮，最常发生于肾上极，符合经典病理学好发部位描述。\nE. 错误：肾门不是肾细胞癌最常发生的部位；肾门及肾盂处更应警惕肾盂尿路上皮癌等病变。\n易混点：肾细胞癌位于肾实质，经典好发部位为肾上极；肾盂癌多位于肾盂、肾盏及肾门附近，常表现为无痛性血尿。记忆时抓住“肾细胞癌在肾实质、上极多见；肾盂癌在肾盂肾门”。","chapter":13,"chapterName":"泌尿系统疾病","chapterTitle":"第13章 泌尿系统疾病"},{"id":"pathology-2a-single-0081","type":"single","typeLabel":"单选题","number":81,"question":"下列疾病均能引起门脉高压症，但以哪种疾病的门脉高压最为明显","options":[{"key":"A","text":"血吸虫性肝硬化"},{"key":"B","text":"门脉性肝硬化"},{"key":"C","text":"胆汁性肝硬化"},{"key":"D","text":"淤血性肝硬化"},{"key":"E","text":"坏死后性肝硬化"}],"answerKeys":["A"],"answerText":["血吸虫性肝硬化"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：A\n核心考点：血吸虫性肝硬化因虫卵沉积于门管区引起窦前性门静脉阻塞，门脉高压最显著。\n解析：血吸虫虫卵经门静脉入肝，主要沉积在门管区，形成虫卵结节并继发纤维组织增生，压迫门静脉小分支，造成窦前性门脉高压；病变呈“干线型”纤维化，肝实质破坏相对较轻，故临床常表现为脾大、腹水、食管胃底静脉曲张等门脉高压征象突出，而肝功能损害相对较轻。本题题眼是“门脉高压最为明显”，应选血吸虫性肝硬化。\n\n选项分析：\nA. 正确：虫卵沉积于门管区导致门静脉分支受压和纤维化，属窦前性门脉高压，门脉高压出现早且显著。\nB. 错误：门脉性肝硬化以假小叶形成为特征，可引起门脉高压，但常为窦后/混合性阻塞，且肝功能损害与门脉高压并重，门脉高压程度不如血吸虫性突出。\nC. 错误：胆汁性肝硬化主要因胆道梗阻、胆汁淤积引起门管区炎症和纤维化，门脉高压出现较晚、相对较轻，临床以黄疸、皮肤瘙痒、碱性磷酸酶升高等胆汁淤积表现为主。\nD. 错误：淤血性肝硬化由慢性右心衰竭等引起，纤维化始于中央静脉周围，门脉高压相对不突出，常以肝大、淤血和右心衰表现为主。\nE. 错误：坏死后性肝硬化为大结节性肝硬化，肝实质破坏重，肝功能衰竭较突出，虽可有门脉高压，但不如血吸虫性肝硬化明显。\n\n易混点：记忆“血吸虫—窦前性—门脉高压显著、肝功损害轻”；门脉性肝硬化“假小叶—门脉高压与肝功损害并重”；坏死后性肝硬化“大结节—肝功损害重”。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-2a-single-0082","type":"single","typeLabel":"单选题","number":82,"question":"以下关于家族性肿瘤的描述正确的是","options":[{"key":"A","text":"遗传方式表现为常染色体隐性遗传"},{"key":"B","text":"患者发病早，单侧发病"},{"key":"C","text":"患者携带两个生殖系的突变"},{"key":"D","text":"患者肿瘤组织发生两次体细胞突变"},{"key":"E","text":"患者携带一个生殖系的突变，肿瘤组织再发生一次体细胞突变"}],"answerKeys":["E"],"answerText":["患者携带一个生殖系的突变，肿瘤组织再发生一次体细胞突变"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n核心考点：遗传性肿瘤的“两次打击”学说，即生殖系携带一个突变、肿瘤组织再发生一次体细胞突变。\n解析：家族性肿瘤通常由抑癌基因（如RB、APC等）的生殖系突变所致，患者全身细胞已携带一个突变（第一次打击），但尚不足以形成肿瘤；当某个靶细胞再发生一次体细胞突变（第二次打击）时，两个等位基因均失活，细胞增殖失控而形成肿瘤。因此患者发病年龄早，且常呈多发性、双侧性或多灶性。本题题眼是“家族性肿瘤”与“散发性肿瘤”在突变来源上的区别：家族性为一个生殖系突变加一次体细胞突变，散发性为两次体细胞突变。\n选项分析：\nA. 错误：家族性肿瘤相关遗传易感性通常呈常染色体显性遗传，子代携带一个生殖系突变即可获得易感性；不是常染色体隐性遗传。\nB. 错误：家族性肿瘤因全身细胞已有一个生殖系突变，靶细胞发生第二次打击的机会较多，故常发病早、双侧或多灶性发病，而不是单侧发病。单侧、单发更常见于散发性肿瘤。\nC. 错误：患者并非携带两个生殖系突变，而是携带一个生殖系突变；第二个突变通常发生在肿瘤组织的体细胞中。\nD. 错误：肿瘤组织发生两次体细胞突变是散发性肿瘤的典型机制，不含生殖系突变；家族性肿瘤已有一次生殖系突变。\nE. 正确：符合Knudson两次打击学说。患者生殖系已有一个突变，肿瘤组织再发生一次体细胞突变，使抑癌基因两个等位基因均失活，从而发生肿瘤。\n易混点：散发性肿瘤需在同一细胞发生两次体细胞突变，故发病晚、多为单侧单发；家族性肿瘤为“一次生殖系突变＋一次体细胞突变”，故发病早、常双侧多发或多灶。记忆要点：家族性＝先天带一个、后天再补一刀；散发性＝后天连中两刀。","chapter":6,"chapterName":"肿瘤","chapterTitle":"第6章 肿瘤"},{"id":"pathology-2a-single-0083","type":"single","typeLabel":"单选题","number":83,"question":"假小叶的特征性病变不包括","options":[{"key":"A","text":"纤维组织增生，分割包绕肝小叶形成肝细胞团"},{"key":"B","text":"肝细胞紊乱、脂肪变性"},{"key":"C","text":"肝细胞团内出现汇管区"},{"key":"D","text":"肝细胞团内缺少中央静脉"},{"key":"E","text":"肝细胞团内中央静脉数量偏位或有两个以上"}],"answerKeys":["B"],"answerText":["肝细胞紊乱、脂肪变性"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：假小叶是肝硬化时纤维结缔组织分割、包绕肝细胞形成的结构异常肝细胞团，其形态学标志是中央静脉缺如、偏位或增多，以及汇管区可出现在肝细胞团内。\n解析：肝硬化时，增生的纤维组织分割正常肝小叶，包绕再生的肝细胞形成假小叶。假小叶内肝细胞排列可紊乱，并可伴有变性、坏死，但“脂肪变性”不是假小叶的特征性结构病变；它只是肝细胞损伤的一种表现，常见于脂肪肝、酒精性肝病等。本题题眼在“特征性病变不包括”，故应选B。\n选项分析：\nA. 错误：纤维组织增生并分割、包绕肝小叶形成肝细胞团，正是假小叶形成的基本过程，属于特征性病变。\nB. 正确（本题应选）：假小叶内肝细胞可排列紊乱，也可继发脂肪变性，但脂肪变性并非假小叶的定义性、特征性结构改变，不能作为假小叶的特征性病变。\nC. 错误：正常肝小叶内汇管区位于周边，而假小叶内可出现汇管区，是假小叶结构异常的表现之一。\nD. 错误：假小叶内常缺少中央静脉，或中央静脉位置异常，是重要形态学特征。\nE. 错误：假小叶内中央静脉可偏位，亦可有两个以上，反映肝小叶结构被重建和改造，属于特征性改变。\n易混点：正常肝小叶中央静脉位于中央、汇管区位于周边；假小叶则是纤维组织包绕的异常肝细胞团，中央静脉缺如、偏位或增多，并可含汇管区。记忆要点：假小叶看“纤维包绕＋中央静脉异常＋汇管区错位”，脂肪变性只是肝细胞损伤表现，不是其结构标志。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-2a-single-0084","type":"single","typeLabel":"单选题","number":84,"question":"甲状腺滤泡性腺瘤和滤泡癌的鉴别诊断最重要的是","options":[{"key":"A","text":"滤泡大小"},{"key":"B","text":"被膜是否受侵犯"},{"key":"C","text":"是否有包膜和血管侵犯"},{"key":"D","text":"淋巴结是否有转移"},{"key":"E","text":"远处器官是否有转移"}],"answerKeys":["C"],"answerText":["是否有包膜和血管侵犯"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：甲状腺滤泡性肿瘤良恶性鉴别的关键组织学依据是包膜侵犯和（或）血管侵犯。\n解析：甲状腺滤泡性腺瘤与滤泡癌在滤泡大小、细胞形态和结构上可高度重叠，不能仅凭细胞异型性或滤泡排列方式鉴别。滤泡癌的诊断本质在于肿瘤细胞穿透肿瘤包膜和（或）侵入包膜内或包膜外血管；其中包膜侵犯需判断肿瘤细胞是否全层穿透包膜，血管侵犯需见肿瘤细胞团附着血管壁或与血栓相连。题眼是“最重要的是鉴别诊断”，即寻找区分良恶性滤泡性肿瘤的组织学标准，故选择同时涵盖包膜和血管侵犯的C。\n选项分析：\nA. 错误：滤泡大小、胶质多少和滤泡排列在腺瘤与滤泡癌中均可出现，缺乏鉴别特异性，不能作为最重要依据。\nB. 错误：被膜是否受侵犯是重要指标之一，但表述不完整，未涵盖血管侵犯；且需强调肿瘤细胞穿透包膜，而非仅肿瘤邻近或推挤包膜。\nC. 正确：包膜侵犯和（或）血管侵犯是诊断滤泡癌、区别于滤泡性腺瘤的最重要组织学依据，也是考试常考的鉴别题眼。\nD. 错误：淋巴结转移更常见于甲状腺乳头状癌；滤泡癌以血行转移为主，淋巴结转移较少。发现淋巴结转移可提示恶性，但不是腺瘤与滤泡癌鉴别的首要组织学标准。\nE. 错误：远处器官转移如骨、肺转移提示滤泡癌已发生血行播散，但属于晚期临床证据；早期鉴别仍依赖包膜和血管侵犯的组织学判断。\n易混点：滤泡性腺瘤有完整包膜，滤泡癌则见肿瘤细胞穿透包膜或侵犯血管；不要用核透明、核沟等乳头状癌核特征来鉴别滤泡性肿瘤。记忆要点：滤泡性肿瘤良恶性看“包膜+血管”，乳头状癌看“核”，髓样癌看“淀粉样间质及降钙素”。","chapter":15,"chapterName":"内分泌系统疾病","chapterTitle":"第15章 内分泌系统疾病"},{"id":"pathology-2a-single-0085","type":"single","typeLabel":"单选题","number":85,"question":"流行性脑脊髓膜炎中，病原菌主要侵犯","options":[{"key":"A","text":"大脑皮质"},{"key":"B","text":"额、顶叶及脑干"},{"key":"C","text":"硬脑膜"},{"key":"D","text":"蛛网膜下腔"},{"key":"E","text":"丘脑及基底神经核"}],"answerKeys":["D"],"answerText":["蛛网膜下腔"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：流行性脑脊髓膜炎是脑膜炎奈瑟菌引起的化脓性脑膜炎症，病变主要位于软脑膜和蛛网膜下腔。\n解析：病原菌经上呼吸道入血形成菌血症后侵犯脑膜，主要在蛛网膜下腔引起化脓性炎症，肉眼可见脑膜血管扩张充血、蛛网膜下腔充满灰黄色脓性渗出物，以大脑额顶叶表面脑沟处较明显；镜下为中性粒细胞为主的化脓性渗出。题眼是“主要侵犯”的部位，应选蛛网膜下腔，而不是脑实质核团。\n\n选项分析：\nA. 错误：大脑皮质属于脑实质，主要对应病毒性脑炎等脑实质病变；流脑虽可并发脑膜脑炎，但主要病变不在大脑皮质。\nB. 错误：额、顶叶及脑干常作为病毒性脑炎（如乙型脑炎）病变分布的描述；流脑的脓性渗出物可在额顶叶表面较明显，但并非主要侵犯额顶叶及脑干实质。\nC. 错误：硬脑膜病变多见于硬脑膜炎或硬膜外脓肿等；流脑主要累及软脑膜和蛛网膜下腔，而不是硬脑膜。\nD. 正确：流行性脑脊髓膜炎的化脓性渗出物主要位于蛛网膜下腔，沿脑沟、脑池分布，脑脊液呈化脓性改变。\nE. 错误：丘脑及基底神经核受累常见于乙型脑炎、脑血管病等；流脑的主要病变部位是脑膜和蛛网膜下腔，而非这些深部灰质核团。\n\n易混点：流脑与乙脑要分开记：流脑是细菌性化脓性脑膜炎，病变在蛛网膜下腔，脑脊液中性粒细胞增多；乙脑是病毒性脑炎，病变在脑实质，常累及大脑皮质、基底核、丘脑和脑干，并可见筛状软化灶。记忆要点：流脑“脓在膜下”，乙脑“病在实质”。","chapter":16,"chapterName":"神经系统疾病","chapterTitle":"第16章 神经系统疾病"},{"id":"pathology-2a-single-0086","type":"single","typeLabel":"单选题","number":86,"question":"风湿性心内膜炎的后期病变不包括","options":[{"key":"A","text":"心内膜下纤维化"},{"key":"B","text":"腱索增粗和缩短"},{"key":"C","text":"瓣叶之间发生粘连"},{"key":"D","text":"心室壁肉柱变扁平"},{"key":"E","text":"瓣膜增厚、卷曲、缩短及钙化"}],"answerKeys":["A"],"answerText":["心内膜下纤维化"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：A\n核心考点：风湿性心内膜炎后期即慢性风湿性心瓣膜病的瓣膜、腱索及心腔形态学改变。\n解析：风湿性心内膜炎反复发作后，瓣膜发生纤维化、机化和钙化，导致瓣膜增厚、变硬、卷曲、缩短，瓣叶交界处粘连，腱索增粗缩短，进而引起瓣口狭窄和/或关闭不全。长期血流动力学异常可使心腔扩张，心室壁肉柱被拉平变扁。病变主要累及心瓣膜及腱索，不以“心内膜下纤维化”为后期特征；心内膜下纤维化更多见于心内膜心肌纤维化、心内膜下缺血等。题眼是“后期病变不包括”，应选不属于慢性风湿性心瓣膜病典型形态改变的A。\n\n选项分析：\nA. 正确：心内膜下纤维化不是风湿性心内膜炎后期的典型病变，可见于心内膜心肌纤维化、心内膜下缺血等；风湿性病变主要位于瓣膜。\nB. 错误：反复风湿性心内膜炎致瓣膜纤维化收缩，腱索增粗、缩短，是后期常见改变，可导致瓣膜关闭不全。\nC. 错误：瓣叶交界处发生粘连，使瓣口狭窄，是慢性风湿性心瓣膜病的常见表现。\nD. 错误：长期瓣膜病引起心腔扩张时，心室壁肉柱可被拉平变扁，属于题目所认同的后期改变之一。\nE. 错误：瓣膜增厚、卷曲、缩短及钙化是慢性风湿性心瓣膜病最典型的肉眼改变，常伴狭窄或关闭不全。\n\n易混点：风湿性心内膜炎急性期为瓣膜闭锁缘的白色血栓性疣状赘生物，不易脱落；后期转为慢性心瓣膜病，以瓣膜变形、粘连、钙化和腱索缩短为主。心内膜下纤维化不要与风湿性心肌炎的Aschoff小体或感染性心内膜炎赘生物混淆。","chapter":9,"chapterName":"心血管系统疾病","chapterTitle":"第9章 心血管系统疾病"},{"id":"pathology-2a-single-0087","type":"single","typeLabel":"单选题","number":87,"question":"脾动脉分支完全阻塞可引起脾的","options":[{"key":"A","text":"出血性梗死"},{"key":"B","text":"脓毒性梗死"},{"key":"C","text":"液化性坏死"},{"key":"D","text":"贫血性梗死"},{"key":"E","text":"坏疽"}],"answerKeys":["D"],"answerText":["贫血性梗死"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：脾动脉分支完全阻塞导致脾实质发生贫血性梗死（白色梗死）。\n解析：脾为实质性器官，组织致密，动脉吻合支较少；当脾动脉分支被完全阻塞后，局部组织缺血坏死，梗死灶内血液被挤出或进入量少，形成灰白色、边界清楚的贫血性梗死。典型肉眼形态为楔形梗死灶，尖端指向脾门、底朝向脾包膜，周围可有充血出血带。本题题眼是“脾动脉分支完全阻塞”和“脾”，提示动脉性阻塞引起的实质性器官梗死，故为贫血性梗死。\n\n选项分析：\nA. 错误：出血性梗死多发生于肺、肠等组织疏松、具有双重血供且常伴严重淤血的器官，梗死灶内明显出血，呈暗红色；脾梗死不属于典型出血性梗死。\nB. 错误：脓毒性梗死由含细菌的感染性栓子引起，梗死灶常伴化脓性炎症和脓肿形成，常见于败血症、感染性心内膜炎等；题干仅述动脉分支完全阻塞，未提示感染性栓子。\nC. 错误：液化性坏死常见于脑、胰腺等富含脂质或水解酶的组织，坏死组织被消化成液态；脾缺血性坏死主要呈凝固性坏死并形成梗死灶。\nD. 正确：脾动脉分支完全阻塞后，脾组织缺血发生凝固性坏死，因梗死灶内出血少而呈灰白色，即贫血性梗死；好发部位为脾，常呈楔形。\nE. 错误：坏疽是坏死组织继发腐败菌感染，分为干性、湿性和气性坏疽，多发生于肢体、肠等；单纯脾动脉分支阻塞不首先表现为坏疽。\n\n易混点：贫血性梗死与出血性梗死的鉴别要点是器官结构和血液供应：脾、肾、心等实质性器官动脉阻塞多形成贫血性梗死；肺、肠等疏松、双重血供器官在淤血基础上多形成出血性梗死。记忆：脾梗死“灰白楔形、底朝包膜、尖向脾门”。","chapter":3,"chapterName":"局部血液循环障碍","chapterTitle":"第3章 局部血液循环障碍"},{"id":"pathology-2a-single-0088","type":"single","typeLabel":"单选题","number":88,"question":"在活体内血栓形成过程中的启动因素是","options":[{"key":"A","text":"激活内源性凝血系统"},{"key":"B","text":"血小板的黏集"},{"key":"C","text":"激活外源性凝血系统"},{"key":"D","text":"合成前列环素"},{"key":"E","text":"生成纤溶酶原活化因子"}],"answerKeys":["B"],"answerText":["血小板的黏集"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：活体内血栓形成的启动环节是血小板黏附、活化与黏集。\n解析：内皮损伤后内皮下胶原暴露，血小板借vWF等黏附于损伤处，继而活化、释放ADP和TXA2并相互聚集，形成血小板血栓，这是血栓形成的起始事件。凝血系统激活和纤维蛋白形成主要起放大、加固血栓的作用。本题题眼是“活体内血栓形成过程中的启动因素”，应选血小板黏集。\n选项分析：\nA. 错误：内源性凝血系统激活参与凝血放大和纤维蛋白形成，属于血栓形成的后续环节，不是最初启动因素。\nB. 正确：血小板黏集是血栓形成的启动步骤，常发生于内皮损伤、血流改变或血液高凝状态时，尤其动脉和心腔内血栓以血小板血栓起始。\nC. 错误：外源性凝血系统由组织因子释放启动，参与凝血过程，但本题问活体血栓形成的启动因素，首选血小板黏集；外源性凝血不是该过程的起始环节。\nD. 错误：前列环素由内皮细胞合成，具有抑制血小板聚集和扩张血管作用，是抗血栓因素，不是促血栓启动因素。\nE. 错误：纤溶酶原活化因子促进纤溶酶生成，溶解纤维蛋白，属于抗血栓和溶栓机制，不是血栓形成的启动因素。\n易混点：血栓形成启动与凝血瀑布启动不同；血小板黏集是细胞学起始环节，凝血系统负责放大和形成纤维蛋白网。记忆要点：内皮损伤→血小板黏附聚集为起点，凝血瀑布放大，纤维蛋白网固化。","chapter":3,"chapterName":"局部血液循环障碍","chapterTitle":"第3章 局部血液循环障碍"},{"id":"pathology-2a-single-0089","type":"single","typeLabel":"单选题","number":89,"question":"进展期胃癌最多见的类型是","options":[{"key":"A","text":"息肉型"},{"key":"B","text":"蕈伞型"},{"key":"C","text":"溃疡型"},{"key":"D","text":"浸润型"},{"key":"E","text":"胶样癌"}],"answerKeys":["C"],"answerText":["溃疡型"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：进展期胃癌的肉眼分型及最常见类型。\n解析：进展期胃癌指癌组织已浸润至黏膜下层以下。其肉眼类型中，溃疡型最多见，癌组织坏死脱落后形成较深溃疡，常大于2cm，边缘隆起呈堤状或结节状，底部不平、污秽，周围黏膜皱襞中断。题眼是“进展期胃癌最多见”，应选溃疡型，而不是浸润型或特殊类型胶样癌。\n选项分析：\nA. 错误：息肉型为癌组织向胃腔内呈息肉状或结节状突出，属于隆起型病变，不是进展期胃癌最多见类型。\nB. 错误：蕈伞型为癌组织呈菜花状、蕈伞状向腔内生长，肉眼较明显，但发生率低于溃疡型。\nC. 正确：溃疡型是进展期胃癌最多见的肉眼类型，典型表现为恶性溃疡，边缘隆起不规则、底部不平、周围黏膜皱襞中断，常伴出血、穿孔等。\nD. 错误：浸润型为癌组织向胃壁弥漫浸润，使胃壁增厚僵硬，可形成“革囊胃”，预后较差，但不是最多见类型。\nE. 错误：胶样癌又称黏液癌，切面呈胶冻样，属于特殊形态或组织学类型，并非进展期胃癌最常见类型。\n易混点：良性胃溃疡多较小、边缘整齐、黏膜皱襞向溃疡集中；溃疡型胃癌常较大、边缘结节状隆起、黏膜皱襞中断。记忆要点：进展期胃癌“最多见溃疡型，最怕浸润型形成革囊胃”。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-2a-single-0090","type":"single","typeLabel":"单选题","number":90,"question":"导致肺褐色硬化的疾病是","options":[{"key":"A","text":"肺动脉狭窄"},{"key":"B","text":"三尖瓣狭窄"},{"key":"C","text":"二尖瓣狭窄"},{"key":"D","text":"肺动脉栓塞"},{"key":"E","text":"硅沉着病"}],"answerKeys":["C"],"answerText":["二尖瓣狭窄"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n\n核心考点：慢性肺淤血导致肺褐色硬化，最常见于二尖瓣狭窄。\n\n解析：二尖瓣狭窄时左心房压升高，肺静脉回流受阻，引起长期慢性肺淤血。肺组织内红细胞漏出并被巨噬细胞吞噬，形成含铁血黄素沉积（心衰细胞），同时肺泡壁纤维组织增生，肺质地变硬、切面呈棕褐色，称为肺褐色硬化。本题题眼是“肺褐色硬化”，其本质是慢性肺淤血基础上的含铁血黄素沉积和纤维化。\n\n选项分析：\nA. 错误：肺动脉狭窄主要引起右心室负荷增加和肺血流减少，不造成肺静脉高压和慢性肺淤血，因此不导致肺褐色硬化。\nB. 错误：三尖瓣狭窄使右心房压升高、体循环淤血，进入肺循环的血量减少，主要引起颈静脉怒张、肝大、下肢水肿等，不引起肺褐色硬化。\nC. 正确：二尖瓣狭窄使左房压和肺静脉压升高，长期肺淤血可致肺泡壁纤维化及含铁血黄素沉积，形成肺褐色硬化。\nD. 错误：肺动脉栓塞主要引起肺出血性梗死或急性右心衰竭，属于急性循环障碍，不会形成慢性肺淤血所致的肺褐色硬化。\nE. 错误：硅沉着病是吸入硅尘引起的尘肺，肺内形成硅结节并弥漫纤维化，可致肺硬化，但并非含铁血黄素沉积所致的“褐色硬化”。\n\n易混点：二尖瓣狭窄导致肺淤血，三尖瓣狭窄导致体循环淤血，记忆时可记“左房受阻淤肺，右房受阻淤体”。肺褐色硬化强调慢性肺淤血、含铁血黄素沉积和纤维化；硅沉着病虽可肺纤维化，但无慢性淤血所致棕褐色外观。","chapter":3,"chapterName":"局部血液循环障碍","chapterTitle":"第3章 局部血液循环障碍"},{"id":"pathology-2a-single-0091","type":"single","typeLabel":"单选题","number":91,"question":"下列哪项因素与动脉粥样硬化发生关系最为密切","options":[{"key":"A","text":"吸烟"},{"key":"B","text":"高脂血症"},{"key":"C","text":"高血压"},{"key":"D","text":"肥胖"},{"key":"E","text":"遗传因素"}],"answerKeys":["B"],"answerText":["高脂血症"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：动脉粥样硬化的主要危险因素及其发病机制，尤其是高脂血症在动脉粥样硬化发生中的核心作用。\n解析：高脂血症是动脉粥样硬化最重要、关系最密切的危险因素，尤其是高胆固醇血症和LDL升高。LDL可进入血管内膜并被氧化修饰，引起内皮损伤、单核细胞浸润和巨噬细胞吞噬脂质形成泡沫细胞，进而发展为脂纹、纤维斑块和粥样斑块。题眼是“关系最为密切”，在吸烟、高血压、肥胖、遗传等危险因素中，高脂血症直接参与脂质沉积和斑块形成的核心环节。\n选项分析：\nA. 错误：吸烟是动脉粥样硬化的重要危险因素，可损伤内皮、促进血小板聚集、促进LDL氧化并降低HDL，但其作用多为促进和加重，不如高脂血症与AS发生关系直接密切。\nB. 正确：高脂血症，尤其LDL升高，是动脉粥样硬化最重要的危险因素，直接导致脂质在内膜沉积、泡沫细胞形成和粥样斑块发生。\nC. 错误：高血压可通过血流剪切力增加、内皮损伤促进动脉粥样硬化，是重要危险因素，但主要属于血流动力学促进因素，不是最密切的核心因素。\nD. 错误：肥胖常伴随血脂异常、高血压、胰岛素抵抗和糖尿病，间接增加动脉粥样硬化风险，其作用部分通过高脂血症等机制实现。\nE. 错误：遗传因素与动脉粥样硬化易感性有关，如家族性高胆固醇血症因LDL受体缺陷导致严重高脂血症，但遗传因素在多数情况下仍主要通过脂代谢异常起作用。\n易混点：吸烟、高血压、肥胖、遗传都是动脉粥样硬化的危险因素，但考试中“关系最密切”首选高脂血症，尤其是LDL升高；遗传因素要想到家族性高胆固醇血症，其本质仍归入脂代谢异常。记忆要点：AS发生的关键起始环节是内皮损伤和脂质沉积，高脂血症最直接。","chapter":9,"chapterName":"心血管系统疾病","chapterTitle":"第9章 心血管系统疾病"},{"id":"pathology-2a-single-0092","type":"single","typeLabel":"单选题","number":92,"question":"金黄色葡萄球菌的层粘连蛋白受体能","options":[{"key":"A","text":"使病变易于局限"},{"key":"B","text":"容易形成溃疡"},{"key":"C","text":"容易形成窦道"},{"key":"D","text":"容易形成转移性脓肿"},{"key":"E","text":"使组织容易受损"}],"answerKeys":["D"],"answerText":["容易形成转移性脓肿"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：金黄色葡萄球菌层粘连蛋白受体介导细菌黏附基底膜并促进血行播散，是形成转移性脓肿的重要机制。\n\n解析：金黄色葡萄球菌表面具有层粘连蛋白受体，可黏附于血管内皮基底膜的层粘连蛋白，增强其穿破血管壁进入血流的能力，从而引起菌血症/败血症，并在远处器官形成转移性脓肿。题眼是“层粘连蛋白受体”，其意义在于增强侵袭和播散，而不是使病灶局限或直接造成组织损伤。金葡菌感染常见于皮肤疖、痈，也可引起肺、骨、肾、脑等部位脓肿；当发生血行播散时，可出现多发性转移性脓肿。\n\n选项分析：\nA. 错误：病变易于局限主要与金葡菌产生凝固酶、使纤维蛋白原转变为纤维蛋白并包绕病灶有关；层粘连蛋白受体促进的是黏附和播散，方向相反。\nB. 错误：溃疡指皮肤或黏膜坏死组织脱落后形成的缺损，常见于炎症、缺血、结核、肿瘤等；金葡菌脓肿破溃可形成溃疡，但层粘连蛋白受体并非形成溃疡的主要机制。\nC. 错误：窦道是深部脓肿向体表或自然腔道破溃后形成的盲端通道，多与脓肿迁延、排脓不畅有关；层粘连蛋白受体不直接决定窦道形成。\nD. 正确：层粘连蛋白受体使金葡菌易于黏附血管基底膜并侵入血流，随血流播散至远处器官形成转移性脓肿，符合题意。\nE. 错误：组织受损主要与金葡菌产生的溶血素、杀白细胞素、蛋白酶等毒力因子有关；层粘连蛋白受体的核心作用是介导黏附和侵袭播散，而非直接导致组织损伤。\n\n易混点：记住“凝固酶使病灶局限、易成脓肿；层粘连蛋白受体促血行播散、易成转移性脓肿”。两者分别代表金葡菌局限化和播散化的不同机制，考试中常以“层粘连蛋白受体”作为转移性脓肿的题眼。","chapter":4,"chapterName":"炎症","chapterTitle":"第4章 炎症"},{"id":"pathology-2a-single-0093","type":"single","typeLabel":"单选题","number":93,"question":"下列哪项不属于门脉高压症","options":[{"key":"A","text":"脾大"},{"key":"B","text":"腹水"},{"key":"C","text":"侧支循环形成"},{"key":"D","text":"胃肠道淤血"},{"key":"E","text":"蜘蛛痣"}],"answerKeys":["E"],"answerText":["蜘蛛痣"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n\n核心考点：门脉高压症的三主征及肝功能减退表现的鉴别。\n\n解析：门脉高压症是门静脉系统压力持续升高引起的一组临床综合征，典型表现包括脾大、侧支循环形成和腹水，胃肠道淤血也属于门静脉回流受阻后的淤血性改变。蜘蛛痣的本质是肝细胞功能减退后对雌激素灭活减少，导致皮肤小动脉末端扩张，属于肝功能减退及内分泌紊乱表现，并非门脉高压本身的表现。本题题眼是区分“门脉高压表现”与“肝硬化肝功能减退表现”，虽然蜘蛛痣可见于肝硬化患者，但不应归入门脉高压症。\n\n选项分析：\nA. 正确：脾大属于门脉高压症表现，因脾静脉回流受阻致脾淤血、肿大，长期可伴脾功能亢进。\nB. 正确：腹水属于门脉高压症表现，机制包括门静脉高压、低蛋白血症、醛固酮及抗利尿激素增多等。\nC. 正确：侧支循环形成是门脉高压症特征性表现，常见食管胃底静脉曲张、痔静脉曲张、脐周静脉曲张。\nD. 正确：胃肠道淤血属于门脉高压症表现，胃肠静脉回流受阻致黏膜淤血、水肿，可影响消化吸收。\nE. 错误：蜘蛛痣不属于门脉高压症，而是肝功能减退致雌激素灭活减少、皮肤小动脉扩张的表现。\n\n易混点：门脉高压症记“脾大、腹水、侧支循环、胃肠道淤血”；肝功能减退记“蜘蛛痣、肝掌、黄疸、出血倾向、肝性脑病、低蛋白血症”。蜘蛛痣可见于肝硬化，但属于肝功能减退表现，不等于门脉高压表现。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-2a-single-0094","type":"single","typeLabel":"单选题","number":94,"question":"抑制动脉粥样硬化发病的因素是","options":[{"key":"A","text":"胆固醇"},{"key":"B","text":"高密度脂蛋白"},{"key":"C","text":"低密度脂蛋白"},{"key":"D","text":"极低密度脂蛋白"},{"key":"E","text":"β脂蛋白"}],"answerKeys":["B"],"answerText":["高密度脂蛋白"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：脂蛋白代谢异常与动脉粥样硬化发病的关系，HDL具有抗动脉粥样硬化作用。\n解析：高密度脂蛋白（HDL）可将外周组织包括血管壁内的胆固醇逆向转运至肝脏代谢，减少胆固醇在血管壁沉积，并具有一定抗氧化、抗炎和保护内皮功能，因此是抑制动脉粥样硬化发病的因素。本题题眼是“抑制”，即寻找保护性因素；而胆固醇、LDL、VLDL及β脂蛋白均偏促进动脉粥样硬化。题目无图片信息，依据文字即可判断。\n选项分析：\nA. 错误：胆固醇尤其高胆固醇血症是动脉粥样硬化的重要危险因素，过多胆固醇沉积于动脉内膜并促进泡沫细胞形成，不是抑制因素。\nB. 正确：高密度脂蛋白参与胆固醇逆向转运，减少脂质在血管壁沉积，并保护内皮，故有抗动脉粥样硬化作用。\nC. 错误：低密度脂蛋白是致动脉粥样硬化的主要脂蛋白，易进入内膜并被氧化修饰，被巨噬细胞吞噬形成泡沫细胞。\nD. 错误：极低密度脂蛋白富含甘油三酯，可代谢生成LDL，间接促进动脉粥样硬化，不属于抑制因素。\nE. 错误：β脂蛋白主要对应低密度脂蛋白，是促动脉粥样硬化的脂蛋白，不能抑制病变发生。\n易混点：HDL常称“好胆固醇”，LDL常称“坏胆固醇”；β脂蛋白不是HDL，而是LDL的别称之一。记忆要点：HDL把胆固醇“运回肝脏”，LDL把胆固醇“送进血管壁”。","chapter":9,"chapterName":"心血管系统疾病","chapterTitle":"第9章 心血管系统疾病"},{"id":"pathology-2a-single-0095","type":"single","typeLabel":"单选题","number":95,"question":"高血压的发病与哪项因素关系不大","options":[{"key":"A","text":"遗传因素"},{"key":"B","text":"肾因素"},{"key":"C","text":"社会心理应激"},{"key":"D","text":"每日饮食摄盐量过多"},{"key":"E","text":"患动脉粥样硬化"}],"answerKeys":["E"],"answerText":["患动脉粥样硬化"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n核心考点：原发性高血压是多因素共同作用导致的疾病，遗传、肾性钠水潴留、交感神经兴奋和高盐饮食均为重要发病因素；动脉粥样硬化主要是高血压的后果或伴随病变，不是其发病的主要因素。\n解析：原发性高血压的发病与遗传易感性、肾排钠障碍及肾素-血管紧张素-醛固酮系统激活、社会心理应激引起的交感神经兴奋、长期高盐饮食等关系密切。题眼是“关系不大”，动脉粥样硬化可因高血压而加重，是高血压常见的靶器官损害和并发症；虽然肾动脉粥样硬化狭窄可引起肾血管性继发性高血压，但作为一般高血压发病因素关系不大。因此选E。\n选项分析：\nA. 错误：遗传因素与高血压关系密切，原发性高血压具有明显家族聚集性和多基因遗传倾向，不是“关系不大”的因素。\nB. 错误：肾因素参与高血压发病，肾缺血可激活肾素-血管紧张素-醛固酮系统，肾排钠障碍可致钠水潴留，使血压升高。\nC. 错误：社会心理应激可通过交感神经兴奋、儿茶酚胺释放增多引起血管收缩和心输出量增加，是高血压发病的重要环境因素。\nD. 错误：每日摄盐过多与高血压关系密切，高钠可致钠水潴留、血容量增加，并增强血管对缩血管物质的反应性。\nE. 正确：动脉粥样硬化不是原发性高血压发病的主要因素，更多是高血压长期作用导致的血管病变和并发症；只有累及肾动脉造成肾缺血时才可能引起继发性高血压，属特殊情况。\n易混点：高血压促进动脉粥样硬化，动脉粥样硬化是“后果/并发症”而非主要“病因”；肾动脉粥样硬化狭窄可导致肾血管性高血压，属于继发性高血压，不要与原发性高血压的常见发病因素混淆。","chapter":9,"chapterName":"心血管系统疾病","chapterTitle":"第9章 心血管系统疾病"},{"id":"pathology-2a-single-0096","type":"single","typeLabel":"单选题","number":96,"question":"乳腺癌中最常见的类型是","options":[{"key":"A","text":"小叶原位癌"},{"key":"B","text":"粉刺癌"},{"key":"C","text":"浸润性导管癌"},{"key":"D","text":"浸润性小叶癌"},{"key":"E","text":"伴髓样特征的癌"}],"answerKeys":["C"],"answerText":["浸润性导管癌"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：乳腺癌的常见组织学类型及其侵袭性。\n解析：浸润性导管癌（非特殊类型）是乳腺癌中最常见的类型，占浸润性乳腺癌的大多数。其典型表现为癌组织突破导管基底膜向间质浸润，形成不规则癌巢、条索或腺样结构，并伴明显纤维组织增生，故肉眼常呈质硬、边界不清的肿块。题眼是“最常见类型”，应选浸润性导管癌，而不是各种原位癌或特殊类型癌。\n选项分析：\nA. 错误：小叶原位癌属于原位癌，癌细胞局限于小叶腺泡内，未突破基底膜，常为偶然发现，并非乳腺癌中最常见的类型。\nB. 错误：粉刺癌是导管原位癌的一种亚型，癌组织位于扩张导管内，中央可见坏死和钙化，属于非浸润性病变，不是最常见类型。\nC. 正确：浸润性导管癌是乳腺浸润性癌中最常见的类型，癌组织突破导管基底膜浸润间质，伴促纤维增生，临床触诊质硬、活动度差，符合本题答案。\nD. 错误：浸润性小叶癌是特殊类型浸润性癌，癌细胞常呈单行串珠状浸润，E-cadherin表达缺失，发生率明显低于浸润性导管癌。\nE. 错误：伴髓样特征的癌属于特殊类型乳腺癌，癌细胞呈合体样巢状生长，伴明显淋巴细胞浸润，常与BRCA1相关，但临床较少见。\n易混点：粉刺癌属于导管原位癌，不是浸润性导管癌；浸润性小叶癌虽可浸润，但为特殊类型，发生率低于浸润性导管癌。记忆要点：乳腺癌最常见的是浸润性导管癌；小叶原位癌是“原位、偶然发现”，小叶浸润癌呈“单行串珠”。","chapter":14,"chapterName":"生殖系统和乳腺疾病","chapterTitle":"第14章 生殖系统和乳腺疾病"},{"id":"pathology-2a-single-0097","type":"single","typeLabel":"单选题","number":97,"question":"下列哪项不是急性弥漫性毛细血管内增生性肾小球肾炎的病理变化","options":[{"key":"A","text":"毛细血管内皮细胞增生"},{"key":"B","text":"系膜细胞增生"},{"key":"C","text":"球囊内蛋白渗出"},{"key":"D","text":"上皮下驼峰状沉积物"},{"key":"E","text":"基底膜钉状突起"}],"answerKeys":["E"],"answerText":["基底膜钉状突起"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n核心考点：急性弥漫性毛细血管内增生性肾小球肾炎以毛细血管内皮细胞和系膜细胞增生、中性粒细胞浸润及上皮下驼峰状沉积为特征；基底膜钉状突起属于膜性肾病。\n解析：急性弥漫性毛细血管内增生性肾小球肾炎即毛细血管内增生性肾小球肾炎，多见于链球菌感染后，光镜下肾小球体积增大、细胞增多，以内皮细胞和系膜细胞增生为主，并伴中性粒细胞浸润；电镜下可见上皮下“驼峰状”电子致密物沉积；因肾小球滤过膜损伤，蛋白可渗入球囊腔。题眼是“不是”急性弥漫性毛细血管内增生性肾小球肾炎的病理变化，而“基底膜钉状突起”是膜性肾病时上皮下沉积物之间基底膜物质反应性增生形成的银染钉状突起，故不属于本病。\n选项分析：\nA. 正确：毛细血管内皮细胞增生是毛细血管内增生性肾小球肾炎的典型改变之一，可使毛细血管腔狭窄。\nB. 正确：系膜细胞增生亦为本病常见病理变化，参与肾小球细胞增多。\nC. 正确：肾小球滤过膜受损、通透性增高时，蛋白可渗出至球囊腔内，属于本病可出现的渗出性改变。\nD. 正确：上皮下驼峰状沉积物是本病特征性电镜表现，常位于脏层上皮细胞下。\nE. 错误：基底膜钉状突起是膜性肾病的特征性改变，由上皮下免疫复合物沉积后基底膜反应性增生形成，不是急性弥漫性毛细血管内增生性肾小球肾炎的病变。\n易混点：急性弥漫性毛细血管内增生性肾小球肾炎记“内皮、系膜增生＋中性粒细胞＋上皮下驼峰”；膜性肾病记“上皮下沉积＋基底膜钉状突起”。二者均有上皮下沉积物，但驼峰多见于感染后急性肾炎，钉状突起提示膜性肾病。","chapter":13,"chapterName":"泌尿系统疾病","chapterTitle":"第13章 泌尿系统疾病"},{"id":"pathology-2a-single-0098","type":"single","typeLabel":"单选题","number":98,"question":"慢性支气管炎时，咳黏液泡沫痰的病变基础是","options":[{"key":"A","text":"支气管黏膜上皮损伤"},{"key":"B","text":"黏液腺体肥大，黏膜上皮内杯状细胞增多"},{"key":"C","text":"支气管壁纤维化、管腔狭窄"},{"key":"D","text":"支气管平滑肌破坏"},{"key":"E","text":"支气管扩张"}],"answerKeys":["B"],"answerText":["黏液腺体肥大，黏膜上皮内杯状细胞增多"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n\n核心考点：慢性支气管炎时黏液腺体肥大、杯状细胞增多导致黏液分泌亢进，是咳黏液泡沫痰的病理基础。\n\n解析：慢性支气管炎的重要镜下病变是支气管黏膜腺体肥大、增生，黏膜上皮内杯状细胞增多，黏液分泌明显增加，故临床表现为咳嗽、咳白色黏液泡沫痰，晨起明显。本题题眼是“咳黏液泡沫痰”，其直接基础是黏液分泌增多，而不是气道狭窄、平滑肌破坏或支气管扩张。慢性支气管炎还可伴纤毛柱状上皮损伤、纤毛清除功能下降，使分泌物潴留并易继发感染，但这不是产生黏液泡沫痰的主要形态学基础。\n\n选项分析：\nA. 错误：支气管黏膜上皮损伤可致纤毛倒伏、脱落和清除功能下降，易继发感染，但上皮损伤本身不是黏液泡沫痰产生的主要基础。\nB. 正确：黏液腺体肥大、黏膜上皮内杯状细胞增多使黏液分泌增多，形成慢性支气管炎特征性的白色黏液泡沫痰，是本题正确答案。\nC. 错误：支气管壁纤维化、管腔狭窄主要引起气流受限、呼吸困难等阻塞性通气障碍表现，不是咳黏液泡沫痰的直接病变基础。\nD. 错误：支气管平滑肌破坏使管壁支撑力减弱，可促进支气管扩张，而不是黏液分泌增多的原因。\nE. 错误：支气管扩张是慢性支气管炎的并发症之一，典型表现为大量脓痰、痰液分层和咯血，不是慢性支气管炎咳黏液泡沫痰的基础病变。\n\n易混点：慢性支气管炎咳白色黏液泡沫痰，基础是黏液腺肥大和杯状细胞增多；支气管扩张症则因支气管壁破坏、持久扩张而咳大量脓痰。记忆要点：慢支“分泌多”，支扩“破坏扩张、脓痰分层”。","chapter":10,"chapterName":"呼吸系统疾病","chapterTitle":"第10章 呼吸系统疾病"},{"id":"pathology-2a-single-0099","type":"single","typeLabel":"单选题","number":99,"question":"下列哪项病变不是假小叶的特点","options":[{"key":"A","text":"中央静脉缺失"},{"key":"B","text":"肝细胞广泛凋亡，大量凋亡小体形成"},{"key":"C","text":"可有两个以上中央静脉"},{"key":"D","text":"肝细胞排列紊乱，有不同程度的坏死或脂肪变性"},{"key":"E","text":"出现门管区"}],"answerKeys":["B"],"answerText":["肝细胞广泛凋亡，大量凋亡小体形成"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：肝硬化时假小叶的结构特征及其与肝细胞凋亡小体的区别。\n解析：假小叶是肝硬化时肝脏纤维结缔组织增生分割、包绕再生肝细胞结节所形成的结构异常单位。其关键形态是肝细胞排列紊乱，中央静脉缺如、偏位或两个以上，周围有纤维间隔包绕，间隔内可见炎细胞、小胆管增生及门管区成分。肝细胞广泛凋亡并大量形成凋亡小体不是假小叶的构成特点，题眼在于“假小叶是结构形态单位，不是以凋亡小体为标志”。\n选项分析：\nA. 正确：假小叶内中央静脉可缺如，是肝硬化假小叶的常见特点之一。\nB. 错误：肝细胞广泛凋亡、大量凋亡小体形成主要见于病毒性肝炎等肝细胞损伤，尤其可见嗜酸性小体，但这不是假小叶的结构特征。\nC. 正确：假小叶内中央静脉可偏位，也可出现两个以上中央静脉，属于其形态特点。\nD. 正确：假小叶内肝细胞排列紊乱，并可有不同程度的坏死、脂肪变性等改变。\nE. 正确：假小叶可包绕门管区样结构，纤维间隔内也常见门管区成分、小胆管增生和炎细胞浸润，故出现门管区可作为假小叶相关特点理解。\n易混点：假小叶的核心记忆是“肝细胞结节排列紊乱＋中央静脉缺如/偏位/多个＋纤维间隔包绕”；凋亡小体、嗜酸性小体是肝细胞损伤的表现，不能等同于假小叶。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-2a-single-0100","type":"single","typeLabel":"单选题","number":100,"question":"早期发现胃癌最可靠的方法是","options":[{"key":"A","text":"X线钡餐检查"},{"key":"B","text":"超声检查"},{"key":"C","text":"胃液特异酶检测"},{"key":"D","text":"胃液脱落细胞学检查"},{"key":"E","text":"纤维胃镜活组织检查"}],"answerKeys":["E"],"answerText":["纤维胃镜活组织检查"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n核心考点：早期胃癌最可靠的诊断方法是纤维胃镜直视观察并取活组织做病理检查。\n解析：早期胃癌指癌组织仅浸润黏膜层或黏膜下层，不论病灶大小及有无淋巴结转移，临床上常无明显症状，影像学易漏诊。纤维胃镜可直接观察胃黏膜的微小隆起、凹陷、糜烂、变色等可疑病变，并多点取材行组织病理学检查，从而明确癌的诊断及组织学类型。本题题眼是“早期发现”和“最可靠”，即强调对早期小病灶的直视观察加病理确诊，故答案为E。\n选项分析：\nA. 错误：X线钡餐检查对较大溃疡、肿块或进展期胃癌有辅助诊断价值，但对早期胃癌的小病灶、平坦型病变敏感度低，易漏诊，且不能取得组织学确诊。\nB. 错误：普通超声检查对胃黏膜早期病变显示能力差，主要用于评估胃壁增厚、邻近脏器及淋巴结等；超声内镜可用于判断浸润深度和分期，但不是早期发现胃癌最可靠的首选确诊方法。\nC. 错误：胃液特异酶检测缺乏足够敏感性和特异性，不能作为胃癌早期诊断的可靠依据，也不属于病理学确诊手段。\nD. 错误：胃液脱落细胞学检查可发现部分脱落癌细胞，但受取材、肿瘤部位和分化程度影响，假阴性率较高，且不能准确显示病变部位和进行组织学分型，可靠性不如胃镜活检。\nE. 正确：纤维胃镜可直视胃黏膜病变并取活组织行病理学检查，是确诊胃癌尤其是早期胃癌最可靠的方法，也是考试中“早期胃癌诊断首选/最可靠”的标准答案。\n易混点：胃镜加活检是“确诊”手段，X线钡餐和胃液脱落细胞学属于辅助检查；超声内镜主要用于判断胃癌浸润深度和淋巴结转移，属于“分期”评估，不能与早期诊断的最可靠方法混淆。记忆要点：早期胃癌——胃镜直视加活检病理确诊。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-2a-single-0101","type":"single","typeLabel":"单选题","number":101,"question":"关于大叶性肺炎下列哪项是错误的","options":[{"key":"A","text":"由细菌感染引起"},{"key":"B","text":"病变多从肺泡开始"},{"key":"C","text":"炎症不破坏肺泡壁结构"},{"key":"D","text":"患者常有胸痛及咳铁锈色痰"},{"key":"E","text":"以中性粒细胞渗出为主的炎症"}],"answerKeys":["E"],"answerText":["以中性粒细胞渗出为主的炎症"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n核心考点：大叶性肺炎的病理性质是肺泡内纤维素性渗出性炎，而非以中性粒细胞渗出为主的化脓性炎。\n解析：大叶性肺炎多由肺炎链球菌等细菌感染引起，病变起始于肺泡，经肺泡孔迅速蔓延而累及肺段甚至大叶。其基本病变为肺泡腔内纤维素性渗出，渗出物含纤维素、红细胞、中性粒细胞及巨噬细胞等，但炎症性质归属纤维素性炎。因肺泡壁毛细血管和肺泡壁结构通常不受破坏，故愈合后肺组织可恢复正常。患者累及胸膜可有胸痛，肺泡内红细胞破坏、血红蛋白分解可咳铁锈色痰。本题题眼是“大叶性肺炎的炎症性质”，E将其概括为“以中性粒细胞渗出为主的炎症”，易与小叶性肺炎的化脓性炎混淆。\n\n选项分析：\nA. 正确：大叶性肺炎常由肺炎链球菌感染引起，也可由肺炎克雷伯菌等细菌引起，属于细菌性肺炎。\nB. 正确：大叶性肺炎的渗出性病变主要从肺泡开始，并通过肺泡间孔向邻近肺泡蔓延，故可累及肺段或大叶。\nC. 正确：大叶性肺炎主要累及肺泡腔，肺泡壁结构一般不被破坏，故消散后肺组织多能恢复正常。\nD. 正确：病变累及胸膜可引起胸痛；肺泡内红细胞被破坏、血红蛋白分解后可形成含铁血黄素，随痰咳出呈铁锈色痰。\nE. 错误：大叶性肺炎属于纤维素性渗出性炎，虽然渗出物中可见中性粒细胞，但不能概括为“以中性粒细胞渗出为主的炎症”；后者更符合小叶性肺炎等化脓性炎。\n\n易混点：大叶性肺炎与小叶性肺炎的鉴别记忆点为“大叶纤维素、肺泡壁不破坏、铁锈色痰；小叶化脓性、中性粒细胞为主、破坏细支气管及肺泡、无铁锈色痰”。注意大叶性肺炎灰色肝样变期虽有较多中性粒细胞，但整体病变性质仍为纤维素性炎。","chapter":10,"chapterName":"呼吸系统疾病","chapterTitle":"第10章 呼吸系统疾病"},{"id":"pathology-2a-single-0102","type":"single","typeLabel":"单选题","number":102,"question":"亚急性感染性心内膜炎皮肤表现为","options":[{"key":"A","text":"Osler结节"},{"key":"B","text":"Negri小体"},{"key":"C","text":"Aschoff小体"},{"key":"D","text":"环形红斑"},{"key":"E","text":"McCallum斑"}],"answerKeys":["A"],"answerText":["Osler结节"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：A\n核心考点：亚急性感染性心内膜炎的免疫性皮肤损害——Osler结节。\n解析：亚急性感染性心内膜炎常由草绿色链球菌引起，心内膜赘生物形成后可持续释放抗原，形成免疫复合物并沉积于小血管，引起微血管炎。Osler结节好发于手指、足趾腹侧及掌面，呈紫红色、略隆起的小结节，有明显疼痛，是亚急性感染性心内膜炎较有提示意义的皮肤表现。本题题眼是“亚急性感染性心内膜炎”与“皮肤表现”的组合，应选Osler结节。\n\n选项分析：\nA. 正确：Osler结节为免疫复合物性微血管炎所致，常见于指（趾）腹、掌面，紫红色、痛性小结节，是亚急性感染性心内膜炎的典型皮肤表现之一。\nB. 错误：Negri小体是狂犬病时神经元胞质内嗜酸性包涵体，属于中枢神经病变，不是心内膜炎的皮肤表现。\nC. 错误：Aschoff小体是风湿热时心肌间质内的肉芽肿性病变，由Aschoff细胞等构成，属于风湿性心脏病特征，不表现为皮肤结节。\nD. 错误：环形红斑是急性风湿热的皮肤表现，呈边缘隆起的淡红色环状红斑，与A组链球菌感染后风湿热有关，并非亚急性感染性心内膜炎的典型皮肤损害。\nE. 错误：McCallum斑是风湿性心脏病左心房后壁内膜片状增厚、纤维化，常与二尖瓣病变和左房压力增高有关，属于心内膜病变，不是皮肤表现。\n\n易混点：Osler结节与Janeway损害均可见于感染性心内膜炎，但Osler结节多为痛性、免疫复合物相关，常见于亚急性；Janeway损害多为无痛性出血性斑丘疹，常见于急性。环形红斑属风湿热皮肤表现，Aschoff小体属风湿性心肌炎病变，两者不要与感染性心内膜炎混同。","chapter":9,"chapterName":"心血管系统疾病","chapterTitle":"第9章 心血管系统疾病"},{"id":"pathology-2a-single-0103","type":"single","typeLabel":"单选题","number":103,"question":"流行性乙型脑炎病变最明显的部位在","options":[{"key":"A","text":"脑桥"},{"key":"B","text":"小脑"},{"key":"C","text":"大脑皮质及基底核"},{"key":"D","text":"脊髓"},{"key":"E","text":"丘脑"}],"answerKeys":["C"],"answerText":["大脑皮质及基底核"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：流行性乙型脑炎是经蚊传播的病毒性脑炎，病变主要累及中枢神经系统灰质，以大脑皮质及基底核最明显。\n解析：乙脑病毒侵犯中枢神经系统后，引起脑实质充血、水肿、神经细胞变性坏死及炎症细胞浸润，镜下可见噬神经细胞现象、卫星现象、小胶质细胞结节和血管周围淋巴细胞套。病变最明显的部位是大脑皮质及基底核，可累及丘脑、脑桥、小脑和脊髓，但程度相对较轻。本题题眼是“病变最明显的部位”，应选大脑皮质及基底核，而不是单纯某一个脑干或深部核团。\n选项分析：\nA. 错误：脑桥可受累，尤其重症病例脑干受累时可出现相应症状，但不是乙脑病变最明显、最典型的部位。\nB. 错误：小脑可有充血水肿和部分神经细胞损害，但并非乙脑病变最突出部位，不能作为“最明显”部位。\nC. 正确：乙脑主要累及灰质，大脑皮质及基底核病变最明显，表现为神经细胞变性坏死、炎症细胞浸润和胶质结节形成。\nD. 错误：脊髓可受累，但乙脑不是以脊髓前角运动神经元损害为主的疾病；脊髓前角明显受累主要见于脊髓灰质炎。\nE. 错误：丘脑可被乙脑病毒累及，也属于常见受累部位之一，但标准病变最明显部位为大脑皮质及基底核，单选丘脑不全面。\n易混点：乙脑与流脑鉴别：乙脑为病毒性脑实质炎，以大脑皮质、基底核病变明显；流脑为脑膜化脓性炎，病变主要在蛛网膜下腔。乙脑与脊髓灰质炎鉴别：后者主要累及脊髓前角运动神经元，出现弛缓性瘫痪。记忆要点：乙脑“灰质为主，大脑皮质及基底核最明显”。","chapter":18,"chapterName":"传染病","chapterTitle":"第18章 传染病"},{"id":"pathology-2a-single-0104","type":"single","typeLabel":"单选题","number":104,"question":"骨髓瘤起源于","options":[{"key":"A","text":"淋巴细胞"},{"key":"B","text":"浆细胞"},{"key":"C","text":"粒细胞"},{"key":"D","text":"单核细胞"},{"key":"E","text":"造血干细胞"}],"answerKeys":["B"],"answerText":["浆细胞"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：多发性骨髓瘤是单克隆浆细胞恶性增生形成的浆细胞肿瘤。\n解析：骨髓瘤细胞起源于终末分化的浆细胞，在骨髓内呈克隆性增生，分泌大量单克隆免疫球蛋白（M蛋白），并激活破骨细胞引起溶骨性破坏、高钙血症、肾损害、贫血和反复感染。题眼在“骨髓瘤”，其本质是浆细胞肿瘤，而非淋巴细胞、粒细胞或单核细胞白血病。\n选项分析：\nA. 错误：淋巴细胞是淋巴瘤、淋巴细胞白血病等淋巴造血系统肿瘤的起源细胞；骨髓瘤虽属B细胞谱系，但起病细胞是分化成熟的浆细胞，不是一般淋巴细胞。\nB. 正确：骨髓瘤即多发性骨髓瘤，由单克隆浆细胞增生构成；患者骨髓中可见浆细胞增多，血和尿中可出现单克隆免疫球蛋白或其轻链，并伴溶骨性病变。\nC. 错误：粒细胞属于髓系细胞，其恶性增生对应粒细胞白血病等髓系肿瘤，不以分泌M蛋白和浆细胞骨髓浸润为特征。\nD. 错误：单核细胞起源于髓系，其恶性病变如急性单核细胞白血病，表现为单核细胞增生和组织浸润，不是骨髓瘤的起源细胞。\nE. 错误：造血干细胞是各类血细胞的共同祖先，可发生白血病等干细胞来源肿瘤，但骨髓瘤的肿瘤性成分是终末分化的浆细胞，不能据此把起源直接归为造血干细胞。\n易混点：骨髓瘤与淋巴瘤同属淋巴造血系统肿瘤，但骨髓瘤的关键是浆细胞克隆性增生和M蛋白分泌；淋巴瘤则以淋巴细胞增生形成肿块为特点。记忆要点：骨髓瘤找“浆细胞、M蛋白、溶骨、高钙、肾损害”。","chapter":12,"chapterName":"淋巴造血系统疾病","chapterTitle":"第12章 淋巴造血系统疾病"},{"id":"pathology-2a-single-0105","type":"single","typeLabel":"单选题","number":105,"question":"慢性肺源性心脏病的主要发病因素不包括","options":[{"key":"A","text":"肺循环阻力增加"},{"key":"B","text":"体循环阻力增加"},{"key":"C","text":"肺动脉高压"},{"key":"D","text":"肺组织减少"},{"key":"E","text":"气道阻塞"}],"answerKeys":["B"],"answerText":["体循环阻力增加"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：慢性肺源性心脏病以肺动脉高压为关键发病环节，是肺、胸廓或肺血管慢性病变导致右心负荷增加的心脏病。\n解析：慢性肺源性心脏病的基本发病机制是各种慢性肺疾病引起肺循环阻力增加和肺动脉高压，使右心室负荷加重，继而右心室肥厚、扩张，严重时发生右心衰竭。常见基础病变包括慢性阻塞性肺疾病、肺气肿、肺纤维化、胸廓畸形及肺血管病变等；缺氧引起的肺小动脉痉挛、肺血管床减少和慢性炎症是重要机制。本题题眼是“不包括”，体循环阻力增加主要引起左心室后负荷增加，不是慢性肺源性心脏病的主要发病因素。\n选项分析：\nA. 正确：肺循环阻力增加是慢性肺心病发病的中心环节之一，可因缺氧性肺血管收缩、肺血管床减少及血管重塑等引起。\nB. 错误：体循环阻力增加主要见于原发性高血压等，增加左心室后负荷，引起左心室肥厚，不是慢性肺心病的发病因素。\nC. 正确：肺动脉高压是慢性肺心病形成的关键，持续肺动脉高压导致右心室代偿性肥厚和扩张。\nD. 正确：肺组织减少见于肺气肿、肺纤维化、肺切除等，可使肺血管床减少，增加肺循环阻力。\nE. 正确：气道阻塞如慢支、COPD等可致通气障碍、缺氧和二氧化碳潴留，引起肺小动脉收缩及肺动脉高压。\n易混点：慢性肺心病是右心受累，关键桥梁是肺动脉高压；体循环阻力增加和体循环高血压主要累及左心，二者不能混淆。记忆要点：肺病→肺循环阻力↑/肺动脉高压→右心室肥厚扩张→右心衰。","chapter":10,"chapterName":"呼吸系统疾病","chapterTitle":"第10章 呼吸系统疾病"},{"id":"pathology-2a-single-0106","type":"single","typeLabel":"单选题","number":106,"question":"组织损伤的修复过程起始于","options":[{"key":"A","text":"损伤早期"},{"key":"B","text":"损伤后期"},{"key":"C","text":"炎症起始期"},{"key":"D","text":"炎症后期"},{"key":"E","text":"炎症静止期"}],"answerKeys":["C"],"answerText":["炎症起始期"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：组织损伤后的修复过程由炎症起始期启动，炎症与修复相互重叠、紧密相连。\n解析：组织损伤后，炎症起始期即出现血管反应和炎症细胞渗出，巨噬细胞等释放生长因子、细胞因子和趋化因子，招募修复细胞并启动再生与纤维性修复。因此修复并非等到炎症结束才发生，而是在炎症起始期即被启动。本题题眼是“修复过程的起始”，应选炎症起始期，而不是笼统的损伤早期或炎症后期。\n选项分析：\nA. 错误：损伤早期虽可同时存在变性、坏死和炎症反应，但该表述过于笼统，未点明修复启动的关键病理环节，标准答案强调炎症起始期。\nB. 错误：损伤后期多指修复后期或瘢痕形成、重塑阶段，此时修复早已进行，不是修复的起始。\nC. 正确：炎症起始期释放炎症介质和生长因子，激活巨噬细胞、成纤维细胞和内皮细胞，启动肉芽组织形成及再生修复，是修复过程的起点。\nD. 错误：炎症后期常已进入肉芽组织成熟、纤维化和瘢痕形成阶段，属于修复的进展或收尾，不是起始。\nE. 错误：炎症静止期表示炎症反应趋于消退，缺乏启动修复所需的炎症细胞和介质活动，不能作为修复起点。\n易混点：损伤后炎症与修复不是截然分开的两个阶段，而是相互重叠；炎症起始期既启动炎症，也启动修复。记忆要点：修复“起于炎症、成于肉芽、终于瘢痕”，巨噬细胞是连接炎症与修复的关键细胞。","chapter":2,"chapterName":"损伤的修复","chapterTitle":"第2章 损伤的修复"},{"id":"pathology-2a-single-0107","type":"single","typeLabel":"单选题","number":107,"question":"门脉性肝硬化形成过程中的基本病理变化为","options":[{"key":"A","text":"肝细胞变性、坏死，肝纤维化"},{"key":"B","text":"肝内胆管上皮增生，肝纤维化"},{"key":"C","text":"肝细胞变性、坏死，肝细胞再生，肝弥漫性纤维化"},{"key":"D","text":"肝细胞再生，肝纤维化"},{"key":"E","text":"肝细胞变性、坏死，Kuffer细胞增生"}],"answerKeys":["C"],"answerText":["肝细胞变性、坏死，肝细胞再生，肝弥漫性纤维化"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n\n核心考点：门脉性肝硬化的基本病理变化是肝细胞变性坏死、肝细胞再生和肝弥漫性纤维化，最终形成假小叶。\n\n解析：门脉性肝硬化是在多种病因长期反复损伤肝细胞的基础上发生的。肝细胞变性、坏死可刺激肝细胞再生，同时导致纤维结缔组织弥漫性增生；增生的纤维组织分割肝小叶并包绕再生肝细胞团，形成假小叶，这是肝硬化的重要形态学标志。本题题眼是“形成过程中的基本病理变化”，必须同时包含损伤、再生和弥漫性纤维化三个环节。\n\n选项分析：\nA. 错误：肝细胞变性、坏死和肝纤维化只是肝硬化形成的一部分，缺少肝细胞再生及纤维组织分割肝小叶形成假小叶的关键环节，表述不完整。\nB. 错误：肝内胆管上皮增生并非门脉性肝硬化的核心病变，更常见于胆汁淤积性肝病或胆汁性肝硬化相关改变。\nC. 正确：肝细胞变性、坏死可启动损伤修复，肝细胞再生形成再生肝细胞团，肝弥漫性纤维化进一步分割肝小叶，三者共同构成门脉性肝硬化形成的基本病理过程。\nD. 错误：仅有肝细胞再生和肝纤维化，缺少肝细胞变性、坏死这一始动性损伤，不能完整概括肝硬化发生机制。\nE. 错误：Kupffer细胞增生属于肝内单核吞噬细胞系统的反应性改变，可见于多种肝损伤，但不是门脉性肝硬化的基本病理变化组合，且缺少再生和弥漫性纤维化。\n\n易混点：肝硬化最特征性的形态学改变是假小叶形成，而“假小叶”形成的前提是肝细胞变性坏死、再生和弥漫性纤维化共同作用。不要把单纯的肝纤维化或库普弗细胞增生等同于肝硬化。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-2a-single-0108","type":"single","typeLabel":"单选题","number":108,"question":"皮肤纤维组织细胞瘤的病变特点中，不包括","options":[{"key":"A","text":"病变呈漩涡状排列"},{"key":"B","text":"病变多位于真皮和皮下"},{"key":"C","text":"常见图顿巨细胞"},{"key":"D","text":"瘤周呈高度浸润性生长，呈长条索状向周围脂肪伸展"},{"key":"E","text":"有时可见泡沫样细胞"}],"answerKeys":["D"],"answerText":["瘤周呈高度浸润性生长，呈长条索状向周围脂肪伸展"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n\n核心考点：皮肤纤维组织细胞瘤（良性纤维组织细胞瘤/皮肤纤维瘤）的病理形态特点及其与隆突性皮肤纤维肉瘤的鉴别。\n\n解析：皮肤纤维组织细胞瘤多位于真皮，可累及皮下浅层，由梭形纤维母细胞样细胞和组织细胞样细胞组成，常呈车辐状或漩涡状排列，并可见多核巨细胞、泡沫样细胞等。题眼是“不包括”：D项所描述的“高度浸润性生长、呈长条索状向周围脂肪伸展”是隆突性皮肤纤维肉瘤的典型局部侵袭方式，不属于皮肤纤维组织细胞瘤的病变特点。皮肤纤维组织细胞瘤虽可边界不清，但通常局限，不表现为高度浸润性脂肪内长条索状生长。\n\n选项分析：\nA. 正确：皮肤纤维组织细胞瘤的梭形细胞常呈车辐状、漩涡状排列，间有胶原纤维，属于其常见镜下特点。\nB. 正确：病变主要位于真皮，可向皮下浅层延伸，因此“多位于真皮和皮下”符合其好发部位。\nC. 正确：病变内可见多核巨细胞，包括图顿巨细胞样细胞，故可列为可见的组织学特点。\nD. 错误：高度浸润性生长并呈长条索状向周围脂肪伸展，是隆突性皮肤纤维肉瘤的典型表现；皮肤纤维组织细胞瘤一般不作此种高度浸润性生长。\nE. 正确：组织细胞样细胞可吞噬脂质形成泡沫样细胞，故病变中有时可见泡沫样细胞。\n\n易混点：皮肤纤维组织细胞瘤与隆突性皮肤纤维肉瘤均可位于真皮/皮下并呈车辐状排列，但前者多为良性局限病变，常伴表皮增生和境界带；后者呈局部侵袭性生长，皮下脂肪内可见“蜂窝状”或“长条索状”浸润，CD34常阳性。记忆要点：长条索状浸润脂肪要想到隆突性皮肤纤维肉瘤，而不是皮肤纤维组织细胞瘤。","chapter":17,"chapterName":"骨关节和软组织疾病","chapterTitle":"第17章 骨关节和软组织疾病"},{"id":"pathology-2a-single-0109","type":"single","typeLabel":"单选题","number":109,"question":"冠状动脉粥样硬化最常受累的动脉分支是","options":[{"key":"A","text":"右冠状动脉主干"},{"key":"B","text":"左冠状动脉主干"},{"key":"C","text":"左冠状动脉回旋支"},{"key":"D","text":"右冠状动脉后降支"},{"key":"E","text":"左冠状动脉前降支"}],"answerKeys":["E"],"answerText":["左冠状动脉前降支"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n核心考点：冠状动脉粥样硬化的好发部位及冠状动脉分支供血范围。\n解析：冠状动脉粥样硬化最常累及左冠状动脉前降支，其次为右冠状动脉、左冠状动脉回旋支和左冠状动脉主干。前降支主要供应左心室前壁、前室间隔及心尖部，因此该支狭窄或闭塞时常引起前壁及室间隔前部心肌缺血或梗死。本题题眼是“最常受累的动脉分支”，应选左冠状动脉前降支。\n选项分析：\nA. 错误：右冠状动脉主干可发生粥样硬化，但发生率低于左冠状动脉前降支，并非最常受累分支。\nB. 错误：左冠状动脉主干病变后果严重，但粥样硬化发生率不如前降支高，不是最常见部位。\nC. 错误：左冠状动脉回旋支也属冠状动脉粥样硬化好发分支之一，但少于前降支，常与左心室侧壁供血相关。\nD. 错误：右冠状动脉后降支是右冠状动脉的分支，可受累，但不是冠状动脉粥样硬化最常累及的分支。\nE. 正确：左冠状动脉前降支为冠状动脉粥样硬化最常受累的分支，病变可导致左室前壁、前室间隔和心尖部缺血，是考试常考好发部位。\n易混点：冠状动脉粥样硬化最常累及左冠状动脉前降支；而心肌梗死最常发生在左心室前壁及室间隔前部，二者通过前降支供血范围相联系。记忆要点：前降支最常受累，前壁梗死最常见。","chapter":9,"chapterName":"心血管系统疾病","chapterTitle":"第9章 心血管系统疾病"},{"id":"pathology-2a-single-0110","type":"single","typeLabel":"单选题","number":110,"question":"长管状骨骨折时可能引起的栓塞是","options":[{"key":"A","text":"空气栓塞"},{"key":"B","text":"脂肪栓塞"},{"key":"C","text":"血栓栓塞"},{"key":"D","text":"细胞栓塞"},{"key":"E","text":"细菌栓塞"}],"answerKeys":["B"],"answerText":["脂肪栓塞"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：长管状骨骨折后骨髓脂肪滴进入血流所引起的脂肪栓塞。\n解析：长管状骨（如股骨、胫骨）骨折时，骨髓内脂肪组织受损，脂肪滴可经破裂的骨内静脉窦进入静脉血流，随血流到达右心并进入肺动脉及其分支，造成肺脂肪栓塞。临床上可表现为突发呼吸困难、低氧血症、意识障碍及皮肤瘀点等；镜下肺毛细血管内可见脂滴，较小脂滴还可通过肺毛细血管进入体循环，引起脑、肾等处栓塞。本题题眼是“长管状骨骨折”，这是脂肪栓塞最典型的临床诱因之一。\n选项分析：\nA. 错误：空气栓塞多与静脉损伤、颈胸部手术、潜水或输液时空气进入血液循环有关，空气随血流阻塞右心或肺动脉。长管状骨骨折的主要栓塞物是骨髓脂肪，不是空气。\nB. 正确：长管状骨骨折可破坏骨髓和骨内静脉窦，使脂肪滴进入静脉系统，形成脂肪栓塞，符合题目所述诱因和栓塞类型。\nC. 错误：血栓栓塞是血栓脱落后随血流运行并阻塞血管，常见于下肢深静脉血栓脱落引起肺动脉栓塞、左心附壁血栓脱落引起体循环栓塞等。骨折本身并非以血栓脱落为主要机制。\nD. 错误：细胞栓塞常指肿瘤细胞、羊水中有形成分等进入血流造成栓塞，并非长管状骨骨折后最常见的栓塞类型。长骨骨折的核心是脂肪滴入血，而不是细胞成分栓塞。\nE. 错误：细菌栓塞见于脓毒血症、感染性心内膜炎等，含细菌的栓子可阻塞血管并形成转移性脓肿。长管状骨骨折本身不直接导致细菌栓塞。\n易混点：脂肪栓塞与血栓栓塞均可使肺动脉阻塞，但前者栓子为脂肪滴，典型诱因为长骨骨折、脂肪组织严重挫伤；后者栓子为脱落的血栓，典型来源为下肢深静脉。记忆要点：长骨骨折先想到脂肪栓塞，下肢深静脉血栓脱落先想到血栓栓塞，静脉损伤或潜水先想到空气栓塞。","chapter":3,"chapterName":"局部血液循环障碍","chapterTitle":"第3章 局部血液循环障碍"},{"id":"pathology-2a-single-0111","type":"single","typeLabel":"单选题","number":111,"question":"流行性乙型脑炎的病原体是","options":[{"key":"A","text":"乙型链球菌"},{"key":"B","text":"α-溶血性链球菌"},{"key":"C","text":"脑膜炎双球菌"},{"key":"D","text":"乙型脑炎病毒"},{"key":"E","text":"柯萨奇病毒"}],"answerKeys":["D"],"answerText":["乙型脑炎病毒"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：流行性乙型脑炎是由乙型脑炎病毒引起的急性中枢神经系统传染病。\n解析：流行性乙型脑炎（乙脑）的病原体为乙型脑炎病毒，属于黄病毒科黄病毒属，主要通过蚊虫叮咬传播。病变主要累及脑实质，尤以大脑皮质、基底核、视丘、脑干等部位明显，镜下可见神经细胞变性坏死、噬神经细胞现象、卫星现象、血管套及胶质结节，严重时形成软化灶。本题题眼是“乙型脑炎的病原体”，应选病毒而非细菌，且名称中“乙型”不能误联为乙型链球菌。\n\n选项分析：\nA. 错误：乙型链球菌即B族链球菌，主要与新生儿肺炎、脑膜炎及败血症等有关，不是流行性乙型脑炎的病原体。\nB. 错误：α-溶血性链球菌多为草绿色链球菌，是亚急性感染性心内膜炎的常见病原体之一，与乙脑无关。\nC. 错误：脑膜炎双球菌是流行性脑脊髓膜炎的病原体，引起化脓性脑膜炎，脑膜病变突出，与乙脑的病毒性脑实质病变不同。\nD. 正确：乙型脑炎病毒经蚊媒传播，侵犯中枢神经系统，引起脑实质的变质性炎，是乙脑的直接病原体。\nE. 错误：柯萨奇病毒属于肠道病毒，可引起病毒性心肌炎、无菌性脑膜炎、手足口病等，但不是流行性乙型脑炎的病原体。\n\n易混点：流行性乙型脑炎与流行性脑脊髓膜炎最易混淆，前者病原体为乙型脑炎病毒，病变以脑实质为主；后者病原体为脑膜炎双球菌，病变以脑膜化脓性炎为主。记忆要点：乙脑是“病毒伤脑实质”，流脑是“细菌化脓脑膜”。","chapter":18,"chapterName":"传染病","chapterTitle":"第18章 传染病"},{"id":"pathology-2a-single-0112","type":"single","typeLabel":"单选题","number":112,"question":"单侧肾切除后，残留肾脏发生的病变为","options":[{"key":"A","text":"适应性肥大"},{"key":"B","text":"替代性肥大"},{"key":"C","text":"生理性增生"},{"key":"D","text":"病理性增生"},{"key":"E","text":"化生"}],"answerKeys":["B"],"answerText":["替代性肥大"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：单侧肾切除后健存肾发生的代偿性肥大，又称替代性肥大。\n解析：单侧肾切除后，机体失去部分肾单位，残存肾脏通过肾小球体积增大、肾小管上皮细胞肥大（并可伴轻度增生）来提高滤过和重吸收能力，从而代偿丢失的肾功能。肉眼见残留肾体积增大、重量增加；镜下以肾小球和肾小管肥大为主。本题题眼是“单侧肾切除后残留肾脏”，属于成对器官因对侧功能丧失而发生的替代性肥大。\n选项分析：\nA. 错误：适应性肥大不是本题所考查的规范病变名称。适应包括萎缩、肥大、增生和化生，但单侧肾切除后残留肾的具体病变应归入代偿性肥大，即替代性肥大。\nB. 正确：一侧肾切除后，对侧健存肾实质细胞体积增大、器官重量增加，以代偿缺失的肾功能，称代偿性肥大或替代性肥大；肾小管上皮和肾小球均可肥大，临床肾功能可长期维持。\nC. 错误：生理性增生是正常生理条件下发生的增生，如妊娠期乳腺、月经周期子宫内膜等。单侧肾切除属于病理状态下的代偿反应，不是生理性增生。\nD. 错误：病理性增生指在致病因子的持续作用下，实质细胞数量增多，如前列腺增生、子宫内膜增生等。残留肾虽可伴轻度增生，但主要和特征性病变是代偿性肥大，不能概括为病理性增生。\nE. 错误：化生是一种分化成熟的细胞类型被另一种分化成熟的细胞类型取代，如支气管柱状上皮鳞状化生、宫颈柱状上皮鳞化。单侧肾切除后残留肾不发生细胞类型转变。\n易混点：代偿性肥大强调实质细胞体积增大以代偿功能，替代性肥大是成对器官一侧功能丧失后对侧发生的代偿性肥大；增生强调细胞数量增多。记忆要点：一侧肾切除—对侧肾代偿性（替代性）肥大。","chapter":1,"chapterName":"细胞和组织的适应与损伤","chapterTitle":"第1章 细胞和组织的适应与损伤"},{"id":"pathology-2a-single-0113","type":"single","typeLabel":"单选题","number":113,"question":"炎症早期局部组织呈鲜红色是因为","options":[{"key":"A","text":"炎性肉芽组织形成"},{"key":"B","text":"静脉淤血"},{"key":"C","text":"动脉性充血"},{"key":"D","text":"红细胞漏出"},{"key":"E","text":"炎细胞渗出"}],"answerKeys":["C"],"answerText":["动脉性充血"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：炎症早期血管反应以细动脉扩张、动脉性充血为主，局部血液含氧血红蛋白增多而呈鲜红色。\n解析：炎症早期，致炎因子通过神经反射和炎症介质作用使细动脉扩张、毛细血管床开放，局部血流量增加，形成动脉性充血。此时血流加快、氧合血红蛋白丰富，故组织呈鲜红色，并伴局部温度升高。题眼是“早期”和“鲜红色”，对应急性炎症的充血期。\n选项分析：\nA. 错误：炎性肉芽组织形成见于炎症修复期或慢性炎症，由新生毛细血管和成纤维细胞构成，虽可呈鲜红颗粒状，但不属于炎症早期颜色改变的主要机制。\nB. 错误：静脉淤血多发生于炎症较后期，血流减慢、还原血红蛋白增多，局部常呈暗红或紫红色，与“鲜红色”不符。\nC. 正确：炎症早期细动脉扩张、血流加快，动脉性充血使局部氧合血红蛋白增多，故呈鲜红色，是本题标准答案。\nD. 错误：红细胞漏出属于红细胞渗出，提示血管损伤较重或渗出性出血，常表现为点状出血，不是炎症早期整体组织鲜红的主要原因。\nE. 错误：炎细胞渗出是白细胞游出血管并聚集于炎区，主要参与防御和吞噬，通常不直接造成组织鲜红色；化脓时可见灰白或黄白色渗出物。\n易混点：动脉性充血为鲜红、温度升高、血流加快；静脉淤血为暗红或紫红、温度可降低、血流缓慢。肉芽组织也呈鲜红色，但属修复期病变，注意与炎症早期充血区分。","chapter":4,"chapterName":"炎症","chapterTitle":"第4章 炎症"},{"id":"pathology-2a-single-0114","type":"single","typeLabel":"单选题","number":114,"question":"伤寒肠道病变的好发部位是","options":[{"key":"A","text":"空肠"},{"key":"B","text":"横结肠"},{"key":"C","text":"乙状结肠"},{"key":"D","text":"回盲部"},{"key":"E","text":"回肠末端"}],"answerKeys":["E"],"answerText":["回肠末端"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n核心考点：伤寒肠道病变好发于回肠末端，主要累及集合淋巴小结（Peyer斑）。\n解析：伤寒由伤寒沙门菌引起，病变以全身单核巨噬细胞系统增生及肠道淋巴组织受累为特征。肠道病变最常位于回肠末端，因该处集合淋巴小结丰富，病原体侵入后引起淋巴组织增生、坏死并形成溃疡；溃疡呈椭圆形，长轴与肠管纵轴平行，溃疡期可并发肠穿孔或肠出血。本题题眼是“伤寒肠道病变好发部位”，应选回肠末端。\n选项分析：\nA. 错误：空肠虽属小肠，但不是伤寒肠道病变的好发部位；伤寒主要累及回肠末端集合淋巴小结。\nB. 错误：横结肠不是伤寒的典型好发部位；结肠病变更多见于细菌性痢疾等疾病。\nC. 错误：乙状结肠不是伤寒肠道病变好发部位；细菌性痢疾常累及乙状结肠和直肠。\nD. 错误：回盲部是肠结核的经典好发部位，表现为回盲部溃疡、增生或狭窄，不能与伤寒回肠末端病变混淆。\nE. 正确：伤寒肠道病变最常发生在回肠末端，主要累及集合淋巴小结，形成增生、坏死及纵行椭圆形溃疡。\n易混点：伤寒溃疡长轴与肠管纵轴平行，好发于回肠末端；肠结核好发于回盲部，溃疡多呈环形，长轴与肠管纵轴垂直。记忆要点：伤寒“回肠末端、纵行溃疡”，肠结核“回盲部、环形溃疡”。","chapter":18,"chapterName":"传染病","chapterTitle":"第18章 传染病"},{"id":"pathology-2a-single-0115","type":"single","typeLabel":"单选题","number":115,"question":"以“满天星”图像为病变特点的疾病是","options":[{"key":"A","text":"皮肤T细胞型淋巴瘤"},{"key":"B","text":"淋巴母细胞型淋巴瘤"},{"key":"C","text":"组织细胞型淋巴瘤"},{"key":"D","text":"Burkitt淋巴瘤"},{"key":"E","text":"霍奇金病"}],"answerKeys":["D"],"answerText":["Burkitt淋巴瘤"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：Burkitt淋巴瘤的组织学特征是“满天星”图像，由高度增殖、凋亡的肿瘤性B细胞与吞噬凋亡碎片的巨噬细胞共同构成。\n解析：Burkitt淋巴瘤为高度侵袭性成熟B细胞淋巴瘤，常与MYC基因易位t(8;14)及EBV感染相关。镜下肿瘤细胞中等大小、形态较一致，核分裂象和凋亡小体多见；散在的巨噬细胞吞噬凋亡碎片后胞质空亮，形成“星空”样背景，即“满天星”图像。题眼是“满天星”对应Burkitt淋巴瘤，而不是霍奇金病的R-S细胞或皮肤T细胞淋巴瘤的亲表皮现象。\n选项分析：\nA. 错误：皮肤T细胞型淋巴瘤主要指蕈样霉菌病等，病变好发于皮肤，镜下可见亲表皮性T细胞及Pautrier微脓肿，细胞核呈脑回状，不以“满天星”为特点。\nB. 错误：淋巴母细胞型淋巴瘤起源于前体T或B淋巴母细胞，常见纵隔肿块、骨髓和中枢神经系统受累，细胞染色质细致、核仁不明显，虽可高增殖，但典型形态不是“满天星”。\nC. 错误：组织细胞型淋巴瘤这一名称已较少使用，真正组织细胞来源的淋巴瘤少见；其诊断需组织细胞标记支持，形态学不以散在吞噬碎片的巨噬细胞形成“满天星”为定义性特征。\nD. 正确：Burkitt淋巴瘤中肿瘤细胞高度增殖并伴大量凋亡，巨噬细胞吞噬凋亡小体后形成明亮的“星”，肿瘤细胞形成深色“天空”，故称“满天星”图像。\nE. 错误：霍奇金病（霍奇金淋巴瘤）的诊断性细胞是R-S细胞及其变异型，背景为反应性炎症细胞，常见结节硬化型胶原纤维束等，不以“满天星”为病变特点。\n易混点：记忆“满天星”要抓住“高增殖+高凋亡+吞噬碎片的巨噬细胞”这一组合，核心是Burkitt淋巴瘤；霍奇金病抓R-S细胞，皮肤T细胞淋巴瘤抓亲表皮性和Pautrier微脓肿。","chapter":12,"chapterName":"淋巴造血系统疾病","chapterTitle":"第12章 淋巴造血系统疾病"},{"id":"pathology-2a-single-0116","type":"single","typeLabel":"单选题","number":116,"question":"下列能反映小叶性肺炎的本质的是","options":[{"key":"A","text":"支气管及肺泡的化脓性炎症"},{"key":"B","text":"支气管及肺泡的纤维素性炎症"},{"key":"C","text":"支气管及肺泡的卡他性炎症"},{"key":"D","text":"支气管及肺泡的出血性炎症"},{"key":"E","text":"支气管及肺泡结构的破坏"}],"answerKeys":["A"],"answerText":["支气管及肺泡的化脓性炎症"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：A\n核心考点：小叶性肺炎的本质是细支气管及其周围肺泡的化脓性炎症，以中性粒细胞渗出为主。\n解析：小叶性肺炎又称支气管肺炎，病变常经支气管播散，以细支气管为中心，向周围肺泡扩展，形成以中性粒细胞渗出为特征的化脓性炎症。镜下可见细支气管壁充血、水肿、中性粒细胞浸润，管腔及周围肺泡内有脓性渗出物，病灶呈小叶性分布，可融合成片。本题题眼是“本质”，即病变的炎症性质，而不是其结局或并发症。\n\n选项分析：\nA. 正确：小叶性肺炎的本质是支气管及肺泡的化脓性炎症，炎性渗出以中性粒细胞为主，故正确答案为A。\nB. 错误：支气管及肺泡的纤维素性炎症是大叶性肺炎的典型病变，肺泡内大量纤维素性渗出导致肺实变，不是小叶性肺炎的本质。\nC. 错误：卡他性炎症是黏膜的浆液性或黏液性渗出性炎，常见于支气管炎等，不能概括小叶性肺炎以中性粒细胞为主的化脓性本质。\nD. 错误：出血性炎症多见于流感病毒性肺炎、钩端螺旋体病等，以小叶性肺炎的典型化脓性病变不符。\nE. 错误：支气管及肺泡结构破坏是小叶性肺炎融合、坏死或并发肺脓肿等时的结局或并发症，不是其炎症本质。\n\n易混点：小叶性肺炎与大叶性肺炎最关键区别是病变性质与分布：小叶性肺炎以细支气管为中心、化脓性炎、小叶性病灶；大叶性肺炎是肺泡内纤维素性炎、累及肺段或肺叶。记忆要点：小叶性肺炎“化脓、中性粒细胞、细支气管为中心”；大叶性肺炎“纤维素性、肺泡实变、支气管常不受累”。","chapter":10,"chapterName":"呼吸系统疾病","chapterTitle":"第10章 呼吸系统疾病"},{"id":"pathology-2a-single-0117","type":"single","typeLabel":"单选题","number":117,"question":"霍奇金淋巴瘤最常发生的部位是","options":[{"key":"A","text":"纵隔淋巴结"},{"key":"B","text":"腋窝淋巴结"},{"key":"C","text":"颈部淋巴结"},{"key":"D","text":"肠系膜淋巴结"},{"key":"E","text":"腹膜后淋巴结"}],"answerKeys":["C"],"answerText":["颈部淋巴结"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：霍奇金淋巴瘤最常首发和累及的部位是颈部淋巴结。\n解析：霍奇金淋巴瘤主要原发于淋巴结，呈连续性、沿淋巴管播散的方式扩散，最常见累及颈部淋巴结，其次为纵隔、腋窝等部位。病变淋巴结常肿大、质硬，晚期可相互粘连；镜下特征性表现为 Reed-Sternberg 细胞及其变异型，背景为反应性炎症细胞。本题题眼是“最常发生部位”，应选颈部淋巴结，而不是某一特殊亚型的好发部位。\n选项分析：\nA. 错误：纵隔淋巴结是霍奇金淋巴瘤常见受累部位之一，尤其结节硬化型常累及纵隔，但总体最常发生的部位不是纵隔。\nB. 错误：腋窝淋巴结可被霍奇金淋巴瘤累及，但发生率低于颈部淋巴结，不是最常见部位。\nC. 正确：霍奇金淋巴瘤最常累及颈部淋巴结，常以无痛性颈部淋巴结肿大为首发表现，是本病的典型临床联系。\nD. 错误：肠系膜淋巴结不是霍奇金淋巴瘤的常见首发部位；肠系膜淋巴结受累更多见于非霍奇金淋巴瘤或其他淋巴增殖性疾病。\nE. 错误：腹膜后淋巴结是淋巴瘤可受累部位之一，但在霍奇金淋巴瘤中不如颈部淋巴结常见；腹膜后淋巴结肿大更常需考虑非霍奇金淋巴瘤等。\n易混点：霍奇金淋巴瘤总体最常见为颈部淋巴结；结节硬化型则常累及纵隔淋巴结。记忆时抓住“总体看颈部，亚型看纵隔”，不要将某一亚型的好发部位误当作总体最常见部位。","chapter":12,"chapterName":"淋巴造血系统疾病","chapterTitle":"第12章 淋巴造血系统疾病"},{"id":"pathology-2a-single-0118","type":"single","typeLabel":"单选题","number":118,"question":"图为休克死亡者，在肺组织切片中可见","options":[{"key":"A","text":"混合血栓"},{"key":"B","text":"红色血栓"},{"key":"C","text":"透明血栓"},{"key":"D","text":"白色血栓"},{"key":"E","text":"附壁血栓"}],"answerKeys":["C"],"answerText":["透明血栓"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：休克导致弥散性血管内凝血（DIC）时，微循环内形成由纤维蛋白构成的透明血栓。\n解析：休克死亡者常并发DIC，肺微循环（肺泡壁毛细血管等）内可形成透明血栓，又称微血栓。透明血栓主要由纤维蛋白构成，也可含少量血小板，HE染色呈嗜酸性均质、透明样改变，体积小，位于小血管或毛细血管内。本题题眼是“休克死亡者”和“肺组织切片”，提示DIC所致的微循环内透明血栓，而不是心腔或较大血管内的血栓。题目图片未提供，仅依据文字信息分析。\n选项分析：\nA. 错误：混合血栓多由白色血栓和红色血栓相间构成，常见于动脉瘤内、心腔内附壁血栓或静脉延续性血栓，并非休克DIC时肺微循环的主要血栓类型。\nB. 错误：红色血栓主要由红细胞和纤维蛋白构成，常见于静脉内，尤其是静脉延续性血栓的尾部，与肺毛细血管内弥漫性微血栓不符。\nC. 正确：透明血栓即微血栓，主要由纤维蛋白构成，常见于DIC、休克等，位于微循环小血管和毛细血管内，肺组织切片可见肺泡壁毛细血管内微血栓。\nD. 错误：白色血栓主要由血小板和纤维蛋白构成，常见于动脉内膜受损处、心瓣膜或静脉血栓头部，如风湿性心内膜炎、动脉粥样硬化溃疡处，不是本题休克肺微循环病变。\nE. 错误：附壁血栓指附着于心腔或大血管壁的血栓，强调血栓与壁附着，未突出DIC时微循环内透明血栓的特点。\n易混点：透明血栓是“微血栓”，在毛细血管内，纤维蛋白为主；白色血栓是“血小板小梁”，多见于心瓣膜和动脉内膜；红色血栓富含红细胞，多见于静脉。记忆要点：休克、DIC想到透明血栓，肺、肾、脑等微循环内可见。","chapter":3,"chapterName":"局部血液循环障碍","chapterTitle":"第3章 局部血液循环障碍","needsImage":true},{"id":"pathology-2a-single-0119","type":"single","typeLabel":"单选题","number":119,"question":"胃肠道的恶性肿瘤经血道首先转移到","options":[{"key":"A","text":"肺"},{"key":"B","text":"淋巴结"},{"key":"C","text":"肝"},{"key":"D","text":"骨"},{"key":"E","text":"脑"}],"answerKeys":["C"],"answerText":["肝"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n\n核心考点：胃肠道恶性肿瘤的血道转移首先经门静脉系统进入肝脏，因此肝是最常见的首发血道转移器官。\n\n解析：胃肠道（胃、小肠、大肠等）的静脉血主要汇入门静脉，肿瘤细胞侵入静脉后随门静脉血流首先到达肝脏，故血道转移首先转移至肝。这是本题的题眼，即“胃肠道恶性肿瘤”“血道转移”“首先”三个限定词共同指向门静脉引流途径。肝转移瘤常为多发性结节，中央可发生坏死；临床上胃肠道癌患者需重点评估肝脏有无转移。\n\n选项分析：\nA. 错误：肺虽是恶性肿瘤血道转移的常见部位，但多经体循环静脉系统到达肺，常见于肾癌、骨肉瘤、绒毛膜癌等；胃肠道肿瘤经门静脉血道转移首先到肝，而非首先到肺。\nB. 错误：淋巴结是癌常见的淋巴道转移部位，但题干明确问“血道”转移；胃肠道癌可首先转移至区域淋巴结，但这不属于血道转移，不能作为本题答案。\nC. 正确：胃肠道静脉回流主要进入门静脉，门静脉入肝，故肿瘤细胞经血道首先被肝脏“截留”，肝是胃肠道恶性肿瘤最常见的血道转移首站。\nD. 错误：骨转移多经体循环血流至骨，常见于前列腺癌、乳腺癌、肺癌等；胃肠道恶性肿瘤虽晚期也可发生骨转移，但不是血道转移的首先部位。\nE. 错误：脑转移常见于肺癌、乳腺癌、黑色素瘤等经体循环转移者；胃肠道肿瘤脑转移较少见，且不是血道转移首先到达的器官。\n\n易混点：淋巴道转移与血道转移要区分，胃肠道癌区域淋巴结转移很常见，但本题限定“血道”，首选肝。记忆要点：门静脉引流器官（胃、肠、胰、脾等）的恶性肿瘤血道转移首站为肝；体循环静脉系统肿瘤血道转移常先到肺。","chapter":6,"chapterName":"肿瘤","chapterTitle":"第6章 肿瘤"},{"id":"pathology-2a-single-0120","type":"single","typeLabel":"单选题","number":120,"question":"下列肿瘤中最容易经血道转移的是","options":[{"key":"A","text":"宫颈鳞状细胞癌"},{"key":"B","text":"肠黏液腺癌"},{"key":"C","text":"乳腺浸润性导管癌"},{"key":"D","text":"绒毛膜癌"},{"key":"E","text":"肺大细胞癌"}],"answerKeys":["D"],"answerText":["绒毛膜癌"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：肿瘤转移途径中，绒毛膜癌最易发生血道转移，常早期经血窦播散至肺。\n解析：绒毛膜癌由滋养层细胞恶变而来，癌细胞侵袭力强，易破坏子宫肌层及血管壁并侵入血窦，因此血道转移发生早而常见，肺是最常见转移部位，也可转移至阴道、脑、肝等。本题题眼是“最容易经血道转移”，应联系绒毛膜癌特殊的血管侵袭性生长方式，而不是按一般癌以淋巴道转移为主来判断。\n选项分析：\nA. 错误：宫颈鳞状细胞癌主要经淋巴道转移，首先至盆腔淋巴结，晚期也可血道转移，但并非最易血道转移。\nB. 错误：肠黏液腺癌属于消化道腺癌，主要经淋巴道转移，也可发生腹膜种植和肝转移，但血道转移不是其最突出的首要途径。\nC. 错误：乳腺浸润性导管癌以淋巴道转移为重要途径，常转移至腋窝淋巴结，晚期可经血道转移至肺、骨、肝等，但不如绒毛膜癌早期血道转移突出。\nD. 正确：绒毛膜癌的癌细胞直接侵入子宫壁血管和血窦，血道转移出现早且发生率高，肺为最常见转移部位，符合“最容易经血道转移”的考点。\nE. 错误：肺大细胞癌为肺癌的一种，可经淋巴道和血道转移，也可直接蔓延，但肺癌总体转移途径并非以“最易血道转移”为特征，且不如绒毛膜癌典型。\n易混点：一般规律是癌多经淋巴道转移、肉瘤多经血道转移；但绒毛膜癌、肝癌、肾癌、甲状腺滤泡癌、前列腺癌等癌也可较易发生血道转移。记忆要点：绒毛膜癌“破坏血管、侵入血窦”，最常血行转移至肺。","chapter":6,"chapterName":"肿瘤","chapterTitle":"第6章 肿瘤"},{"id":"pathology-2a-single-0121","type":"single","typeLabel":"单选题","number":121,"question":"下列哪种细胞不是通过变形运动离开血管的","options":[{"key":"A","text":"中性粒细胞"},{"key":"B","text":"红细胞"},{"key":"C","text":"嗜酸性粒细胞"},{"key":"D","text":"淋巴细胞"},{"key":"E","text":"巨噬细胞"}],"answerKeys":["B"],"answerText":["红细胞"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：炎症时白细胞通过变形运动主动游出血管，红细胞不能主动变形运动，仅被动漏出。\n解析：炎症时，中性粒细胞等白细胞在黏附于内皮后，以阿米巴样变形运动穿过内皮细胞间隙及基底膜，离开血管进入炎区，这一过程称白细胞游出，是主动过程。红细胞缺乏变形运动能力，通常只在血管内皮损伤、间隙显著增大或血流动力学改变时被动漏出血管，常见于出血性炎症。本题题眼是“通过变形运动离开血管”，即考查白细胞游出与红细胞漏出的区别，故不是通过变形运动离开血管的是红细胞。\n选项分析：\nA. 正确：中性粒细胞是急性炎症早期最主要游出细胞，能伸出伪足作变形运动，穿过血管壁进入炎区。\nB. 错误：红细胞无变形运动能力，不能主动游出；其离开血管是血管损伤后的被动漏出，故为本题答案。\nC. 正确：嗜酸性粒细胞属于白细胞，可作变形运动游出血管，常见于寄生虫感染和变态反应性炎症。\nD. 正确：淋巴细胞能变形运动游出血管，常见于慢性炎症、病毒感染及免疫反应。\nE. 正确：巨噬细胞由单核细胞游出后转化而来，具有活跃的变形运动和吞噬能力，也可在组织中移动。\n易混点：白细胞游出是主动变形运动过程，红细胞漏出是被动过程；见到“变形运动离开血管”应选白细胞类，见到“血管损伤、红细胞被动漏出”则考虑出血性炎。记忆要点：白细胞“游出”，红细胞“漏出”。","chapter":4,"chapterName":"炎症","chapterTitle":"第4章 炎症"},{"id":"pathology-2a-single-0122","type":"single","typeLabel":"单选题","number":122,"question":"下列哪项最符合转移性肿瘤的概念","options":[{"key":"A","text":"远隔器官发生的另一种肿瘤"},{"key":"B","text":"血道转移的结果"},{"key":"C","text":"可形成“癌脐”"},{"key":"D","text":"与原发瘤属同一类型"},{"key":"E","text":"可进一步发生转移"}],"answerKeys":["D"],"answerText":["与原发瘤属同一类型"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：转移性肿瘤是原发瘤经淋巴道、血道或种植等途径播散后在远隔部位形成的继发性肿瘤，其组织学类型与原发瘤一致。\n解析：转移性肿瘤的本质是“原发瘤的继发灶”，因此判断某远隔部位肿瘤是否为转移，关键看其组织学类型是否与原发瘤相同。转移性肿瘤与原发瘤通常属同一类型，但分化程度可不同，甚至可更低。题眼是“最符合概念”，应抓住“继发形成、与原发瘤同型”这一本质，而不是转移途径或形态学表现。\n选项分析：\nA. 错误：远隔器官发生的“另一种肿瘤”若组织学类型不同，应属多原发瘤或重复癌，不是转移性肿瘤；若与原发瘤同型，则需结合病史判断是否为转移。\nB. 错误：血道转移只是转移途径之一，转移还可经淋巴道、种植性转移等发生；且“血道转移的结果”不等于转移性肿瘤的概念本身，表述不全面。\nC. 错误：“癌脐”是脐部转移性癌结节伴皮肤牵拉凹陷的表现，可见于部分转移癌，但只是某些转移瘤的形态学征象，不能作为转移性肿瘤的定义。\nD. 正确：转移性肿瘤由原发瘤播散而来，组织学类型与原发瘤相同，这是判断转移和原发的重要依据，也是本题最符合概念的核心特征。\nE. 错误：转移性肿瘤可以进一步发生转移，但原发瘤本身也可发生转移；“可进一步转移”不是转移性肿瘤的定义性特征。\n易混点：多原发瘤是不同组织学类型的独立肿瘤；转移性肿瘤必须与原发瘤同型。记忆要点：转移瘤“来源相同、类型相同、部位继发”，途径和癌脐只是表现或方式，不是概念核心。","chapter":6,"chapterName":"肿瘤","chapterTitle":"第6章 肿瘤"},{"id":"pathology-2a-single-0123","type":"single","typeLabel":"单选题","number":123,"question":"只有一个开口的病理性盲管是","options":[{"key":"A","text":"糜烂"},{"key":"B","text":"溃疡"},{"key":"C","text":"窦道"},{"key":"D","text":"瘘管"},{"key":"E","text":"空洞"}],"answerKeys":["C"],"answerText":["窦道"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：窦道是只有一个开口的病理性盲管，需与瘘管、溃疡、空洞等缺损性病变鉴别。\n解析：窦道是由深部组织通向体表或黏膜面的病理性盲管，仅有一个开口，常由脓肿破溃、异物存留、慢性感染或引流不畅等形成；管壁多由肉芽组织及纤维组织构成，可伴炎性渗出。题干的关键词是“只有一个开口”和“病理性盲管”，这正是窦道的定义。临床上窦道常迁延不愈，需清除异物、感染灶及坏死组织后才能愈合。\n\n选项分析：\nA. 错误：糜烂是黏膜浅表的缺损，深度未超过黏膜肌层，愈合后不留瘢痕，不是盲管。\nB. 错误：溃疡是皮肤或黏膜较深的缺损，可深达黏膜下层甚至肌层，愈后常留瘢痕，但不是只有一个开口的盲管。\nC. 正确：窦道为只有一个开口的病理性盲管，可开口于体表或黏膜面，符合题干定义。\nD. 错误：瘘管是连接两个不同表面或两个腔隙的病理性通道，通常有两个或以上开口，如肠瘘、肛瘘，并非“盲管”。\nE. 错误：空洞是肺、肾等实质器官坏死组织经自然管道排出后形成的空腔，属于空腔性病变，不是盲管。\n\n易混点：记忆要点是“一开口为窦道，两开口为瘘管”；糜烂和溃疡强调缺损深度，空洞强调坏死物排出后的空腔，均不具备“单开口盲管”的结构特征。","chapter":4,"chapterName":"炎症","chapterTitle":"第4章 炎症"},{"id":"pathology-2a-single-0124","type":"single","typeLabel":"单选题","number":124,"question":"与AIDS发病密切的病毒是","options":[{"key":"A","text":"HCV"},{"key":"B","text":"HBV"},{"key":"C","text":"HPV"},{"key":"D","text":"HIV"},{"key":"E","text":"EBV"}],"answerKeys":["D"],"answerText":["HIV"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：AIDS（获得性免疫缺陷综合征）的病原体是人免疫缺陷病毒（HIV）。\n解析：HIV属于逆转录病毒，主要经性接触、血液和母婴传播。病毒包膜糖蛋白gp120与CD4分子及辅助受体结合，主要侵犯CD4+ T淋巴细胞和巨噬细胞，导致CD4+ T细胞进行性减少和细胞免疫功能严重缺陷。患者因此易发生机会性感染和机会性肿瘤，这是AIDS的核心病理生理基础。本题题眼是“与AIDS发病密切的病毒”，即AIDS的直接病原体为HIV。\n\n选项分析：\nA. 错误：HCV为丙型肝炎病毒，主要引起丙型病毒性肝炎，与肝硬化和肝细胞癌密切相关；可经血液传播并与HIV合并感染，但不是AIDS的病原体。\nB. 错误：HBV为乙型肝炎病毒，主要引起乙型病毒性肝炎，与肝硬化和肝细胞癌相关；不是AIDS的致病病毒。\nC. 错误：HPV为人乳头瘤病毒，主要与皮肤黏膜疣及宫颈癌等上皮性肿瘤相关；不是AIDS的病原体。\nD. 正确：HIV感染CD4+ T淋巴细胞，造成免疫功能缺陷，最终发展为AIDS；AIDS是HIV感染的最后阶段。\nE. 错误：EBV为EB病毒，与传染性单核细胞增多症、Burkitt淋巴瘤、鼻咽癌及免疫缺陷相关淋巴增殖性疾病有关；在AIDS患者中可参与机会性肿瘤发生，但不是AIDS的病原体。\n\n易混点：HIV是AIDS的病因，AIDS是HIV感染后的严重临床阶段，不能把“HIV感染”与“AIDS”完全等同。AIDS患者常见的机会性感染病原如卡氏肺孢子菌、巨细胞病毒、结核分枝杆菌等是继发感染，不是AIDS的病因。","chapter":5,"chapterName":"免疫性疾病","chapterTitle":"第5章 免疫性疾病"},{"id":"pathology-2a-single-0125","type":"single","typeLabel":"单选题","number":125,"question":"下列哪项是伤口二期愈合的特点","options":[{"key":"A","text":"创面小"},{"key":"B","text":"创面不洁、伴感染"},{"key":"C","text":"手术切口"},{"key":"D","text":"肉芽组织少"},{"key":"E","text":"形成瘢痕小"}],"answerKeys":["B"],"answerText":["创面不洁、伴感染"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：伤口二期愈合的病理学特点及与一期愈合的鉴别。\n解析：二期愈合多发生于创面较大、创缘不整齐、坏死组织较多，或伴有感染、异物、血凝块等使创面对合不良的伤口。其基本过程为炎症反应明显、坏死组织被清除后，由大量肉芽组织填充缺损，最终瘢痕较大、愈合时间较长。本题题眼是“二期愈合”，其关键条件是伤口不洁、伴感染，导致创缘不能严密对合。\n选项分析：\nA. 错误：创面小、创缘整齐、对合良好是无菌手术切口一期愈合的特点，不是二期愈合的特点。\nB. 正确：创面不洁、伴感染时，坏死物和渗出物多，需先控制感染、清除坏死组织，再由肉芽组织填充，是二期愈合的典型条件和特点。\nC. 错误：手术切口通常无菌、创缘整齐、组织破坏少，多属一期愈合；若手术切口继发感染，才可能转为二期愈合。\nD. 错误：二期愈合时组织缺损较大且炎症明显，肉芽组织增生较多；肉芽组织少不是二期愈合的特点。\nE. 错误：二期愈合因缺损大、肉芽组织填充多，最终形成的瘢痕通常较大，而不是瘢痕小。\n易混点：一期愈合见于创缘整齐、无感染、对合严密的伤口，肉芽组织少、瘢痕小；二期愈合见于创面大、不整齐、伴感染或异物，肉芽组织多、瘢痕大、愈合慢。记忆要点：不洁感染、肉芽多、瘢痕大，指向二期愈合。","chapter":2,"chapterName":"损伤的修复","chapterTitle":"第2章 损伤的修复"},{"id":"pathology-2a-single-0126","type":"single","typeLabel":"单选题","number":126,"question":"下列哪项不属于动脉性充血","options":[{"key":"A","text":"膀胱减压后充血"},{"key":"B","text":"炎性充血"},{"key":"C","text":"肝硬化时，胃肠道和脾脏充血"},{"key":"D","text":"进食后的胃肠道充血"},{"key":"E","text":"运动时骨骼肌充血"}],"answerKeys":["C"],"answerText":["肝硬化时，胃肠道和脾脏充血"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：动脉性充血是局部细动脉扩张、动脉血输入增多所致的主动充血，需与静脉回流受阻引起的静脉性淤血鉴别。\n解析：动脉性充血时局部组织因动脉血输入增多而体积略增大、颜色红润、温度升高，可分为生理性（如运动时骨骼肌、进食后胃肠道）和病理性（如炎性充血、减压后充血）。本题题眼是“不属于动脉性充血”，C项肝硬化时胃肠道和脾脏充血是门静脉高压使静脉回流受阻、侧支循环开放所致的静脉性淤血，属于被动性充血。因此C不属于动脉性充血。\n\n选项分析：\nA. 正确：膀胱快速减压后，局部细动脉反射性扩张、血流增多，属于减压后动脉性充血，是病理性动脉性充血的典型例子。\nB. 正确：炎性充血由炎症介质和轴突反射引起细动脉扩张，局部动脉血输入增多，属于病理性动脉性充血。\nC. 错误：肝硬化时门静脉高压导致胃肠道和脾脏静脉回流受阻、静脉扩张淤血，脾脏可因长期淤血而增大，属于静脉性淤血而非动脉性充血。\nD. 正确：进食后胃肠道黏膜及腺体活动增强，局部细动脉扩张、血流量增加，属于生理性动脉性充血。\nE. 正确：运动时骨骼肌代谢增强，局部细动脉扩张、血流增多，属于生理性动脉性充血。\n\n易混点：动脉性充血是“动脉输入端增多”，局部红、热、体积略增大；静脉性淤血是“静脉输出端受阻”，局部紫红、温度降低，常伴水肿。记忆要点：减压后充血、炎性充血虽为病理性，但仍属动脉性充血；肝硬化门脉高压所致胃肠、脾充血是静脉性淤血。","chapter":3,"chapterName":"局部血液循环障碍","chapterTitle":"第3章 局部血液循环障碍"},{"id":"pathology-2a-single-0127","type":"single","typeLabel":"单选题","number":127,"question":"一般不会出现肉芽组织的病变是","options":[{"key":"A","text":"结核空洞"},{"key":"B","text":"脓肿壁"},{"key":"C","text":"化生病灶"},{"key":"D","text":"动脉粥样硬化"},{"key":"E","text":"陈旧性心肌梗死"}],"answerKeys":["C"],"answerText":["化生病灶"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：肉芽组织的常见出现部位及化生的本质区别。\n解析：肉芽组织由新生毛细血管、成纤维细胞和炎细胞构成，是组织损伤后的修复性组织，常见于溃疡、脓肿壁、空洞壁、梗死灶机化等。化生是已分化成熟的组织在刺激下转变为另一种分化成熟组织，属于细胞适应性改变，不是肉芽组织性修复过程。题眼是“化生病灶”与“肉芽组织”分属不同病理概念。\n\n选项分析：\nA. 错误：结核空洞壁由内层干酪样坏死、中层结核性肉芽组织及外层纤维组织构成，可见肉芽组织参与空洞壁形成。\nB. 错误：脓肿壁即脓肿膜，主要由肉芽组织构成，其中含新生毛细血管、成纤维细胞和炎细胞。\nC. 正确：化生病灶是上皮或间叶组织转化为另一种成熟组织，如支气管鳞状上皮化生、肠上皮化生，通常不形成肉芽组织。\nD. 错误：动脉粥样硬化斑块可发生机化、钙化，斑块表面溃疡或血栓机化时可见肉芽组织参与修复。\nE. 错误：陈旧性心肌梗死机化时，肉芽组织从梗死灶边缘长入并逐渐替代坏死组织，最终形成瘢痕。\n\n易混点：肉芽组织不等于肉芽肿；结核结节属于感染性肉芽肿，而结核空洞壁可含肉芽组织。化生强调细胞类型转变，肉芽组织强调损伤修复，二者不能混淆。","chapter":2,"chapterName":"损伤的修复","chapterTitle":"第2章 损伤的修复"},{"id":"pathology-2a-single-0128","type":"single","typeLabel":"单选题","number":128,"question":"血栓中的纤维蛋白被溶解称为","options":[{"key":"A","text":"血栓再通"},{"key":"B","text":"溶解吸收"},{"key":"C","text":"血栓机化"},{"key":"D","text":"血栓钙化"},{"key":"E","text":"血栓栓塞"}],"answerKeys":["B"],"answerText":["溶解吸收"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：血栓的溶解吸收是纤维蛋白被纤溶系统溶解并由吞噬细胞清除的过程。\n解析：血栓形成后，若纤维蛋白被激活的纤溶酶溶解，并被中性粒细胞、巨噬细胞吞噬清除，称为血栓溶解吸收。较小的血栓可完全溶解吸收；较大血栓常继发机化。本题题眼是“纤维蛋白被溶解”，对应纤溶和吸收，而不是血管再通或钙化。\n选项分析：\nA. 错误：血栓再通是血栓机化后，血栓内出现新生毛细血管并彼此吻合，使阻塞的血管部分恢复血流，属于机化后的改变。\nB. 正确：纤维蛋白被纤溶酶溶解，碎片被吞噬细胞清除，即溶解吸收；这是血栓转归之一。\nC. 错误：血栓机化是肉芽组织长入血栓并逐渐取代血栓的过程，最终形成纤维化瘢痕，并非单纯纤维蛋白溶解。\nD. 错误：血栓钙化是血栓内钙盐沉积，常见于静脉内陈旧血栓，可形成静脉石，与纤维蛋白溶解不同。\nE. 错误：血栓栓塞是血栓脱落随血流运行并阻塞远处血管，属于栓塞，不是溶解吸收。\n易混点：再通发生在机化基础上，机化是肉芽组织取代血栓，溶解吸收是纤溶和吞噬清除；记忆要点为“溶解吸收靠纤溶，机化再通靠肉芽，钙化形成静脉石，脱落则成栓子”。","chapter":3,"chapterName":"局部血液循环障碍","chapterTitle":"第3章 局部血液循环障碍"},{"id":"pathology-2a-single-0129","type":"single","typeLabel":"单选题","number":129,"question":"如图，可能的肾炎类型是","options":[{"key":"A","text":"急性肾小球肾炎"},{"key":"B","text":"急进性肾小球肾炎"},{"key":"C","text":"慢性肾小球肾炎"},{"key":"D","text":"慢性肾盂肾炎"},{"key":"E","text":"急性肾盂肾炎"}],"answerKeys":["C"],"answerText":["慢性肾小球肾炎"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：慢性肾小球肾炎的终末期病理改变为双肾对称性缩小、表面细颗粒状，镜下弥漫性肾小球硬化及间质纤维化。\n解析：题目图片未提供，仅依据题干和标准答案分析。慢性肾小球肾炎是多种肾小球肾炎进展的终末阶段，典型表现为双肾对称性缩小、变硬、表面呈细颗粒状，皮质变薄，镜下可见大量肾小球玻璃样变或硬化、肾小管萎缩、间质纤维化，临床常伴高血压和慢性肾功能衰竭。本题题眼应是慢性硬化性肾小球病变及“颗粒性固缩肾”样改变，故选择慢性肾小球肾炎。\n选项分析：\nA. 错误：急性肾小球肾炎属于感染后毛细血管内增生性肾小球肾炎，双肾轻至中度肿大、充血，镜下为内皮细胞和系膜细胞增生、中性粒细胞浸润及上皮下驼峰状沉积，不呈弥漫性硬化、颗粒状缩小。\nB. 错误：急进性肾小球肾炎为新月体性肾小球肾炎，镜下以肾小球囊壁层上皮细胞增生形成新月体为特征，临床迅速进展至肾衰竭，肾脏常肿大、点状出血，并非慢性硬化性终末改变。\nC. 正确：慢性肾小球肾炎为多种肾小球肾炎的终末阶段，双肾对称性缩小、表面细颗粒状、皮质变薄，镜下大量肾小球硬化、肾小管萎缩和间质纤维化，符合慢性肾小球肾炎的诊断要点。\nD. 错误：慢性肾盂肾炎是反复感染或反流导致的慢性间质性炎症，病变常两侧不对称，肾表面有宽大不规则瘢痕，肾盂肾盏变形，镜下可见间质纤维化、慢性炎细胞浸润及胶样管型，而非弥漫对称的细颗粒性固缩肾。\nE. 错误：急性肾盂肾炎是化脓性感染，主要累及肾盂、肾盏和肾间质，表现为黏膜充血水肿、脓性渗出及肾实质小脓肿，临床有发热、腰痛和膀胱刺激征，不是肾小球弥漫性硬化病变。\n易混点：慢性肾小球肾炎与慢性肾盂肾炎均可致肾缩小、变硬，但前者为双肾对称性细颗粒状固缩肾，后者为不对称性不规则瘢痕；记忆要点是“肾小球肾炎看弥漫硬化颗粒，肾盂肾炎看瘢痕变形不对称”。","chapter":13,"chapterName":"泌尿系统疾病","chapterTitle":"第13章 泌尿系统疾病","needsImage":true},{"id":"pathology-2a-single-0130","type":"single","typeLabel":"单选题","number":130,"question":"下列属于良性肿瘤的是","options":[{"key":"A","text":"纤维腺瘤"},{"key":"B","text":"髓母细胞瘤"},{"key":"C","text":"淋巴瘤"},{"key":"D","text":"肾母细胞瘤"},{"key":"E","text":"白血病"}],"answerKeys":["A"],"answerText":["纤维腺瘤"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：A\n核心考点：肿瘤的命名与良恶性判断，重点识别“母细胞瘤”“淋巴瘤”“白血病”等特殊命名中的恶性病变。\n解析：纤维腺瘤是乳腺常见的良性肿瘤，由增生的腺管和纤维结缔组织两种成分构成，境界清楚、活动度较好，属于良性肿瘤的典型代表。本题题眼是“名称中带‘瘤’不等于一定良性”，但纤维腺瘤确实是良性；而髓母细胞瘤、肾母细胞瘤虽带“母细胞瘤”却均为恶性胚胎性肿瘤，淋巴瘤和白血病则属于造血与淋巴系统恶性肿瘤。\n选项分析：\nA. 正确：纤维腺瘤多发生于乳腺，也可见于卵巢等部位；镜下由腺上皮和纤维结缔组织共同增生形成，包膜完整或边界清楚，生长缓慢，不浸润、不转移，属于良性肿瘤。\nB. 错误：髓母细胞瘤是小脑的恶性胚胎性肿瘤，多见于儿童，呈浸润性生长，可经脑脊液播散；“母细胞瘤”这一命名多提示恶性或胚胎性肿瘤，不能按良性理解。\nC. 错误：淋巴瘤是起源于淋巴造血组织的恶性肿瘤，分为霍奇金淋巴瘤和非霍奇金淋巴瘤，常表现为淋巴结肿大，并可累及结外器官。\nD. 错误：肾母细胞瘤又称Wilms瘤，是儿童肾脏常见的恶性胚胎性肿瘤，可形成包膜但具有恶性生物学行为，可转移。\nE. 错误：白血病是造血干/祖细胞的恶性克隆性疾病，肿瘤性白细胞在骨髓内大量增生并进入外周血，属于血液系统恶性肿瘤，不是良性肿瘤。\n易混点：良性肿瘤通常按“组织来源＋瘤”命名，但“母细胞瘤”多为恶性胚胎性肿瘤；“淋巴瘤”“白血病”虽不带“癌”，却均属恶性肿瘤。记忆要点：纤维腺瘤是良性双相肿瘤；髓母细胞瘤、肾母细胞瘤、淋巴瘤、白血病均为恶性。","chapter":6,"chapterName":"肿瘤","chapterTitle":"第6章 肿瘤"},{"id":"pathology-2a-single-0131","type":"single","typeLabel":"单选题","number":131,"question":"右下肢静脉血栓脱落主要栓塞于","options":[{"key":"A","text":"肺动脉"},{"key":"B","text":"下腔静脉"},{"key":"C","text":"右心房"},{"key":"D","text":"右心室"},{"key":"E","text":"右下肢大静脉"}],"answerKeys":["A"],"answerText":["肺动脉"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：A\n核心考点：静脉系统及右心血栓脱落后栓子的运行途径，即经右心进入肺动脉造成肺动脉栓塞。\n解析：右下肢静脉属于体循环静脉系统，血栓脱落后形成栓子，沿静脉回流方向经髂静脉、下腔静脉进入右心房、右心室，再随血流进入肺动脉。由于肺动脉分支逐渐变细，栓子易嵌顿于相应口径的肺动脉分支，因此主要栓塞于肺动脉。本题题眼是“下肢静脉血栓脱落”，强调栓子来源于体静脉，故首先累及肺循环。\n选项分析：\nA. 正确：右下肢静脉血栓脱落后经下腔静脉、右心进入肺动脉，常嵌顿于肺动脉分支，是体静脉血栓脱落最常见的栓塞部位。\nB. 错误：下腔静脉是栓子回流的通路，不是右下肢静脉栓子主要嵌顿和形成栓塞的部位；下腔静脉本身可发生血栓形成，但本题问的是“血栓脱落后的栓塞部位”。\nC. 错误：右心房是栓子回流途中经过的心腔，除非栓子较大或合并心房内血栓形成，一般不会停留于右心房；本题问的是脱落后主要栓塞部位。\nD. 错误：右心室同样是栓子经右心进入肺动脉的通道，不是右下肢静脉栓子的主要栓塞部位；右心室血栓可导致肺栓塞，但本选项混淆了来源与栓塞部位。\nE. 错误：右下肢大静脉是本题血栓的原始来源部位，而不是栓子脱落后栓塞的靶部位；该选项把“血栓形成部位”与“栓塞部位”混为一谈。\n易混点：动脉系统栓子多来自左心或主动脉，常栓塞脑、脾、肾、下肢等体循环器官；静脉系统及右心栓子则多栓塞肺动脉。若存在卵圆孔未闭，栓子可经缺损进入左心造成“交叉性栓塞”，但常规情况下右下肢静脉血栓脱落首先栓塞肺动脉。","chapter":3,"chapterName":"局部血液循环障碍","chapterTitle":"第3章 局部血液循环障碍"},{"id":"pathology-2a-single-0132","type":"single","typeLabel":"单选题","number":132,"question":"风湿性肉芽肿中的坏死为","options":[{"key":"A","text":"固缩性坏死"},{"key":"B","text":"干酪样坏死"},{"key":"C","text":"纤维素样坏死"},{"key":"D","text":"坏疽"},{"key":"E","text":"液化性坏死"}],"answerKeys":["C"],"answerText":["纤维素样坏死"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：风湿性肉芽肿（Aschoff小体）中心为纤维素样坏死，周围可见淋巴细胞、浆细胞及Anitschkow细胞/Aschoff巨细胞。\n解析：风湿病时，A组乙型溶血性链球菌感染后发生变态反应性炎症，心肌间质小血管旁可形成风湿性肉芽肿，即Aschoff小体。其病理特点是中心为纤维素样坏死，坏死物呈强嗜酸性、均质红染的纤维素样物质，周围有特征性细胞增生。题眼是“风湿性肉芽肿”与“坏死类型”，应直接联系Aschoff小体的中心纤维素样坏死，而不是结核结节的干酪样坏死。\n选项分析：\nA. 错误：固缩性坏死多与细胞凋亡或坏死早期核固缩有关，并非风湿性肉芽肿中心的特征性坏死类型。\nB. 错误：干酪样坏死是结核性肉芽肿的典型中心坏死，肉眼呈淡黄色干酪样，镜下为无结构红染颗粒状物，不是Aschoff小体的中心改变。\nC. 正确：风湿性肉芽肿中心发生纤维素样坏死，是风湿病活动期的特征性病变之一，周围伴Anitschkow细胞和Aschoff巨细胞。\nD. 错误：坏疽是较大范围坏死继发腐败菌感染或特殊缺血环境形成的类型，分干性、湿性和气性坏疽，常见于肢体、肠道等，不符合风湿性肉芽肿。\nE. 错误：液化性坏死多见于脑梗死、脓肿等，坏死组织被酶解液化形成软化灶或脓液，不是风湿性肉芽肿的中心坏死。\n易混点：结核性肉芽肿中心为干酪样坏死，风湿性肉芽肿中心为纤维素样坏死，记忆为“结核干酪、风湿纤维素”。纤维素样坏死还可见于急进性高血压、系统性红斑狼疮、结节性多动脉炎等，本质是血管壁或结缔组织的纤维素样物质沉积。","chapter":9,"chapterName":"心血管系统疾病","chapterTitle":"第9章 心血管系统疾病"},{"id":"pathology-2a-single-0133","type":"single","typeLabel":"单选题","number":133,"question":"膜增生性肾小球肾炎可伴有下列哪种表现","options":[{"key":"A","text":"明显血尿"},{"key":"B","text":"脂滴沉积"},{"key":"C","text":"红细胞增多症"},{"key":"D","text":"IgA沉积"},{"key":"E","text":"低补体血症"}],"answerKeys":["E"],"answerText":["低补体血症"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n核心考点：膜增生性肾小球肾炎（MPGN）的免疫发病机制及低补体血症的临床病理联系。\n解析：膜增生性肾小球肾炎又称系膜毛细血管性肾小球肾炎，其突出特点是补体激活和消耗，故常伴血清补体降低，尤其C3降低。Ⅰ型MPGN多由免疫复合物沉积激活经典途径，C3、C4均可降低；Ⅱ型（致密沉积物病）因C3肾炎因子持续激活替代途径，表现为持续性C3降低而C4多正常。本题题眼是“低补体血症”，它是MPGN，特别是儿童和青少年MPGN的重要实验室线索，并常与肾病综合征、血尿、高血压及肾功能损害并存。\n\n选项分析：\nA. 错误：明显血尿更常见于急性弥漫性增生性肾小球肾炎、IgA肾病、新月体性肾小球肾炎等；MPGN可有血尿，但并非本题所考查的特征性伴随表现。\nB. 错误：脂滴沉积主要见于微小病变性肾小球病及肾病综合征时近曲小管上皮细胞脂质吸收，不是MPGN的特征性病变。\nC. 错误：红细胞增多症常与肾细胞癌、肾母细胞瘤、多囊肾等EPO产生增多有关，MPGN一般不引起红细胞增多。\nD. 错误：IgA沉积是IgA肾病和过敏性紫癜性肾炎的特征，沉积部位多在系膜区；MPGN以C3及免疫复合物沉积、补体消耗为主，并非IgA沉积。\nE. 正确：MPGN因补体途径激活、补体消耗而出现低补体血症，Ⅰ型常C3、C4均低，Ⅱ型以C3持续降低、C4正常为特点，是常考鉴别点。\n\n易混点：低补体血症也可见于链球菌感染后肾小球肾炎，但后者多有明确感染史、补体常在数周内恢复；MPGN的低补体血症常持续存在。IgA肾病以系膜区IgA沉积和反复血尿为特点，一般补体正常；微小病变以足细胞足突融合和脂滴沉积为特点，光镜下肾小球病变不明显。","chapter":13,"chapterName":"泌尿系统疾病","chapterTitle":"第13章 泌尿系统疾病"},{"id":"pathology-2a-single-0134","type":"single","typeLabel":"单选题","number":134,"question":"细菌性痢疾的肠道病变特点是","options":[{"key":"A","text":"浆液性炎"},{"key":"B","text":"纤维素性炎"},{"key":"C","text":"肉芽肿性炎"},{"key":"D","text":"出血性坏死炎"},{"key":"E","text":"蜂窝织炎"}],"answerKeys":["B"],"answerText":["纤维素性炎"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：细菌性痢疾的肠道病变本质是结肠黏膜的纤维素性炎，又称假膜性炎。\n解析：志贺菌主要侵犯结肠，尤以直肠、乙状结肠为著，引起黏膜表层坏死及大量纤维素性渗出，渗出物与坏死组织、中性粒细胞、红细胞等共同形成假膜。假膜脱落后可形成地图状浅表溃疡，临床常伴腹痛、腹泻、黏液脓血便和里急后重。题眼是“肠道病变特点”，应抓住假膜性炎/纤维素性炎这一特征。\n选项分析：\nA. 错误：浆液性炎以浆液渗出为主，常见于早期卡他性炎、病毒感染或浆膜腔炎症，不是细菌性痢疾的典型肠道病变。\nB. 正确：细菌性痢疾为结肠黏膜假膜性炎，病理本质属纤维素性炎，假膜由纤维素、坏死上皮和炎细胞等构成。\nC. 错误：肉芽肿性炎常见于结核病、伤寒、梅毒等，以巨噬细胞衍生细胞形成结节为特点；细菌性痢疾不以肉芽肿形成为主。\nD. 错误：出血性坏死性炎可见于肠出血性坏死、严重缺血感染等病变；细菌性痢疾虽有出血坏死，但核心是纤维素性渗出形成假膜，并非以弥漫出血性坏死炎为命名特点。\nE. 错误：蜂窝织炎是疏松结缔组织的弥漫性化脓性炎，常由溶血性链球菌引起，多见于皮下组织、阑尾等，不符合细菌性痢疾的结肠假膜性炎。\n易混点：细菌性痢疾与阿米巴痢疾鉴别：菌痢好发直肠、乙状结肠，假膜性炎、地图状溃疡；阿米巴痢疾好发盲肠、升结肠，为坏死性炎、烧瓶状溃疡。记忆要点：菌痢“假膜、地图、直肠乙状结肠”。","chapter":18,"chapterName":"传染病","chapterTitle":"第18章 传染病"},{"id":"pathology-2a-single-0135","type":"single","typeLabel":"单选题","number":135,"question":"初次吸入结核杆菌，最早引起的肺内病变是","options":[{"key":"A","text":"原发综合征"},{"key":"B","text":"沿支气管出现广泛渗出"},{"key":"C","text":"结核性淋巴结炎"},{"key":"D","text":"原发灶的渗出及坏死"},{"key":"E","text":"肺门淋巴结结核"}],"answerKeys":["D"],"answerText":["原发灶的渗出及坏死"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：初次感染结核杆菌时，最早形成的肺内病变是结核性原发灶，表现为局部渗出和干酪样坏死。\n解析：结核杆菌初次吸入后，多沉积于上叶下部或下叶上部近胸膜处的肺泡，因机体尚无特异性细胞免疫，巨噬细胞吞噬后不能有效杀灭细菌，局部先出现浆液纤维素性渗出、巨噬细胞聚集，继而发生干酪样坏死，形成原发灶（Ghon灶）。随后细菌经淋巴管引流至肺门淋巴结，才逐渐形成原发综合征。题眼是“初次吸入”“最早”“肺内病变”，故应选原发灶的渗出及坏死，而不是已经包含淋巴管炎和淋巴结结核的原发综合征。\n\n选项分析：\nA. 错误：原发综合征由肺内原发灶、结核性淋巴管炎和肺门淋巴结结核三部分组成，是原发灶形成并沿淋巴道播散后的较完整病变，不是最早肺内病变。\nB. 错误：沿支气管出现广泛渗出属于支气管播散性病变或支气管肺炎样改变，多见于继发性肺结核或病变进展播散，不符合初次感染最早局限性原发灶的特点。\nC. 错误：结核性淋巴结炎是结核杆菌经淋巴道引流后发生的病变，通常累及肺门或纵隔
