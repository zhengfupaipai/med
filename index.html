":288,"question":"下列所有情况均符合肺出血肾炎综合征，除外","options":[{"key":"A","text":"患者可出现咯血和血尿"},{"key":"B","text":"患者常死于肺出血和尿毒症"},{"key":"C","text":"电镜下未发现电子致密物的沉积"},{"key":"D","text":"免疫荧光显示肾小球内颗粒状IgG沉积"},{"key":"E","text":"免疫荧光显示肾小球内线状IgG沉积"}],"answerKeys":["D"],"answerText":["免疫荧光显示肾小球内颗粒状IgG沉积"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：肺出血肾炎综合征（Goodpasture综合征）为抗肾小球基底膜（抗GBM）抗体介导的Ⅱ型超敏反应性疾病，免疫荧光呈线状IgG沉积。\n解析：本病典型表现为反复咯血和血尿，肾小球基底膜和肺泡基底膜共同受累；免疫荧光显示IgG沿肾小球毛细血管基底膜呈线状沉积，电镜下一般无电子致密物沉积。病情常进行性加重，可死于肺大出血或尿毒症。本题题眼是“免疫荧光沉积方式”：抗GBM病为线状，而非颗粒状。\n\n选项分析：\nA. 正确：咯血提示肺出血，血尿提示肾小球肾炎，是肺出血肾炎综合征的典型临床组合。\nB. 正确：本病可因肺大出血致死，也可因急进性肾小球肾炎进展为尿毒症而死亡。\nC. 正确：抗GBM病由抗体直接结合基底膜抗原，电镜下通常无免疫复合物样电子致密物沉积。\nD. 错误：颗粒状IgG沉积提示免疫复合物介导的肾小球肾炎，如狼疮性肾炎、感染后肾小球肾炎等，不符合抗GBM病的线状沉积特点。\nE. 正确：免疫荧光见IgG沿肾小球基底膜线状沉积是抗GBM病的特征性改变。\n\n易混点：线状IgG沉积主要见于抗GBM病，颗粒状沉积见于免疫复合物性肾炎；电镜下有无电子致密物也有助于鉴别。记忆要点：Goodpasture综合征——“线状IgG、无致密物、肺出血加肾炎”。","chapter":13,"chapterName":"泌尿系统疾病","chapterTitle":"第13章 泌尿系统疾病"},{"id":"pathology-a-single-0289","type":"single","typeLabel":"单选题","number":289,"question":"胃癌的最主要转移途径是","options":[{"key":"A","text":"血道转移"},{"key":"B","text":"直接蔓延"},{"key":"C","text":"淋巴道转移"},{"key":"D","text":"消化道内转移"},{"key":"E","text":"腹腔内种植"}],"answerKeys":["C"],"answerText":["淋巴道转移"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：胃癌的转移途径，以淋巴道转移最早、最常见且最重要。\n解析：胃癌细胞侵入黏膜下层后，首先进入丰富的黏膜下淋巴管，沿胃周淋巴引流方向逐站转移，故淋巴道转移是最主要途径。癌细胞常先转移至幽门下、胃小弯和贲门周围等胃周淋巴结，晚期可经胸导管进入左锁骨上淋巴结，形成 Virchow 结节。题眼是“最主要转移途径”，应与“可直接蔓延至邻近器官”和“晚期可血道转移至肝”相区分。\n选项分析：\nA. 错误：血道转移多发生于胃癌晚期，常见经门静脉转移至肝，也可至肺、骨、脑等，但不是最主要、最早的转移途径，本题易将其与肝癌、肺癌等以血道转移为主相混。\nB. 错误：直接蔓延指癌组织向胃壁深层浸润并累及邻近器官，如食管、十二指肠、肝、胰腺、横结肠及大网膜等，属于局部浸润方式，并非最主要转移途径。\nC. 正确：胃癌淋巴管丰富，癌细胞侵入淋巴管后沿淋巴引流逐站转移至胃周淋巴结，是最常见、最重要的转移途径；也可出现跳跃式转移和左锁骨上淋巴结转移。\nD. 错误：消化道内转移指癌细胞脱落并沿消化道播散种植，并非胃癌的经典主要转移途径，概念上也不属于血道、淋巴道、种植性转移的标准分类，本题不选。\nE. 错误：腹腔内种植为胃癌侵透胃浆膜后癌细胞脱落种植于腹膜、大网膜及卵巢等，可形成 Krukenberg 瘤和腹膜种植结节，但发生率及重要性次于淋巴道转移。\n易混点：胃周淋巴结转移属淋巴道转移；侵透浆膜后脱落至腹腔、种植于卵巢形成 Krukenberg 瘤属种植性转移；经门静脉至肝属血道转移。记忆要点：胃癌以淋巴道转移为主，肝癌以肝内及血道转移为突出。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-a-single-0290","type":"single","typeLabel":"单选题","number":290,"question":"关于子宫平滑肌瘤的叙述，下列哪项错误","options":[{"key":"A","text":"女性生殖系统中最常见的肿瘤"},{"key":"B","text":"肿瘤境界清楚，但常无包膜"},{"key":"C","text":"可发生黏液变性"},{"key":"D","text":"常发生恶变"},{"key":"E","text":"瘤组织呈编织状排列"}],"answerKeys":["D"],"answerText":["常发生恶变"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：子宫平滑肌瘤是女性生殖系统最常见的良性肿瘤，恶变率极低。\n解析：子宫平滑肌瘤由平滑肌细胞增生形成，肉眼呈结节状、境界清楚但常无真正包膜，切面灰白、质韧，镜下瘤细胞束纵横交错呈编织状排列。瘤组织可发生玻璃样变、囊性变、红色变性、黏液变性及钙化等继发性改变。子宫平滑肌瘤极少恶变为平滑肌肉瘤，恶变率通常不足1%，因此“常发生恶变”错误，这是本题题眼。\n选项分析：\nA. 正确：子宫平滑肌瘤是女性生殖系统发生率最高的肿瘤，通常强调为最常见的良性肿瘤，考试中该表述可视为正确。\nB. 正确：肌瘤多呈结节状，与周围肌层境界清楚，但缺乏真正纤维性包膜，手术时可沿假包膜剥离。\nC. 正确：肌瘤可发生多种退行性变，包括黏液变性，此外还可见玻璃样变、囊性变、红色变性及钙化等。\nD. 错误：子宫平滑肌瘤绝大多数为良性，恶变为平滑肌肉瘤者极少见；若出现明显核异型、核分裂象增多、凝固性坏死等才需警惕恶性。\nE. 正确：镜下平滑肌细胞束纵横交错、相互编织，是本病的典型组织学形态之一。\n易混点：子宫平滑肌瘤需与子宫平滑肌肉瘤鉴别，后者细胞异型性明显、核分裂象多并常有肿瘤性坏死；肌瘤的“境界清楚、无包膜、编织状排列”是常考形态要点，而“易恶变”是错误记忆点。","chapter":14,"chapterName":"生殖系统和乳腺疾病","chapterTitle":"第14章 生殖系统和乳腺疾病"},{"id":"pathology-a-single-0291","type":"single","typeLabel":"单选题","number":291,"question":"门脉性肝硬化最严重的并发症是","options":[{"key":"A","text":"腹腔积液"},{"key":"B","text":"脾大"},{"key":"C","text":"血小板减少"},{"key":"D","text":"肝性脑病"},{"key":"E","text":"痔静脉曲张"}],"answerKeys":["D"],"answerText":["肝性脑病"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n\n核心考点：门脉性肝硬化失代偿期最严重的并发症是肝性脑病，属于肝功能衰竭导致的中枢神经系统功能障碍。\n\n解析：门脉性肝硬化时，广泛增生的纤维结缔组织分割肝小叶形成假小叶，肝细胞功能严重受损，同时门-体侧支循环形成使肠道吸收的氨等毒性物质绕过肝脏进入体循环，并因肝清除能力下降而蓄积，最终引起肝性脑病。肝性脑病可从性格行为改变、扑翼样震颤发展至意识障碍和昏迷，是肝硬化最严重、可致死的并发症。本题题眼是“最严重并发症”，应选肝功能衰竭相关的肝性脑病，而不是门脉高压的一般表现。\n\n选项分析：\nA. 错误：腹腔积液是门脉高压、低蛋白血症、醛固酮和抗利尿激素灭活减少等引起的失代偿期常见表现，可致腹胀和自发性腹膜炎，但不是最严重并发症。\nB. 错误：脾大是门脉高压导致脾静脉回流受阻、脾脏慢性淤血所致，属于门脉高压的常见表现，并非最严重并发症。\nC. 错误：血小板减少主要因脾大伴脾功能亢进，血小板破坏增多所致，可表现为出血倾向，但通常不是肝硬化最严重并发症。\nD. 正确：肝性脑病是肝功能严重障碍和门-体分流共同作用引起的中枢神经系统功能紊乱，是门脉性肝硬化最严重的并发症和重要死亡原因。\nE. 错误：痔静脉曲张是门脉高压时直肠静脉丛侧支循环开放的表现，可发生便血，但严重性一般不及肝性脑病；门脉高压更危险的侧支循环是食管胃底静脉曲张破裂出血。\n\n易混点：门脉高压的并发症包括腹水、脾大及脾功能亢进、侧支循环形成（食管胃底静脉曲张、痔静脉曲张等）；肝功能衰竭的严重表现包括肝性脑病、肝肾综合征和凝血障碍。记忆要点：问“最严重并发症”选肝性脑病；问“门脉高压最常见/危险侧支循环”则想到食管胃底静脉曲张破裂出血。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-a-single-0292","type":"single","typeLabel":"单选题","number":292,"question":"与子宫颈癌发生密切相关的病毒是","options":[{"key":"A","text":"单纯疱疹病毒"},{"key":"B","text":"人乳头瘤病毒"},{"key":"C","text":"EB病毒"},{"key":"D","text":"腺病毒"},{"key":"E","text":"巨细胞病毒"}],"answerKeys":["B"],"answerText":["人乳头瘤病毒"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：B\n核心考点：高危型人乳头瘤病毒（HPV）持续感染是子宫颈癌发生的最重要病因。\n解析：子宫颈癌的发生与高危型HPV（尤其是HPV16、18型）持续感染密切相关。HPV的E6、E7癌蛋白可分别使p53和Rb失活，导致细胞周期失控、凋亡受抑，并随病毒DNA整合引起宫颈上皮异型增生，最终可进展为浸润癌。病变好发于宫颈鳞柱交界处的转化区，常经历宫颈上皮内瘤变（CIN）到浸润癌的过程，因此本题题眼是“与子宫颈癌发生密切相关的病毒”。\n\n选项分析：\nA. 错误：单纯疱疹病毒主要与生殖器疱疹、宫颈炎等性传播感染有关，虽可造成宫颈黏膜损伤，但不是子宫颈癌发生的主要致癌病毒。\nB. 正确：人乳头瘤病毒，特别是高危型HPV16、18型，是子宫颈癌最重要的致病因素；其E6、E7蛋白灭活p53、Rb，促进宫颈上皮恶性转化。\nC. 错误：EB病毒主要与鼻咽癌、Burkitt淋巴瘤、霍奇金淋巴瘤及部分胃癌等相关，不是子宫颈癌的主要相关病毒。\nD. 错误：腺病毒主要引起呼吸道、结膜等部位感染，部分型别在实验中有转化作用，但与人类子宫颈癌发生无明确主要病因关系。\nE. 错误：巨细胞病毒主要与先天性感染、免疫抑制患者肺炎和视网膜炎等相关，不是子宫颈癌的主要致癌病毒。\n\n易混点：HPV低危型6、11型主要引起尖锐湿疣，高危型16、18型才与宫颈癌关系最密切；HSV-2主要引起生殖器疱疹，也属性传播疾病，但不要与HPV的致癌作用混淆。记忆要点：宫颈癌“高危HPV16、18”，E6灭p53、E7灭Rb。","chapter":14,"chapterName":"生殖系统和乳腺疾病","chapterTitle":"第14章 生殖系统和乳腺疾病"},{"id":"pathology-a-single-0293","type":"single","typeLabel":"单选题","number":293,"question":"下列属于病理性再生的是","options":[{"key":"A","text":"消化道黏膜上皮细胞的更新"},{"key":"B","text":"子宫内膜周期性脱落、增生、修复"},{"key":"C","text":"鳞状上皮表层角化细胞脱落、基底细胞增生"},{"key":"D","text":"血细胞的更新"},{"key":"E","text":"皮肤缺损后由周围的被覆上皮增生、修复"}],"answerKeys":["E"],"answerText":["皮肤缺损后由周围的被覆上皮增生、修复"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n核心考点：病理性再生是指在病理状态下组织细胞缺损后由邻近存活细胞增生修复的过程，需与正常生理性更新区分。\n解析：病理性再生的题眼是“组织缺损后修复”。皮肤缺损后，由周围残存的被覆上皮细胞增生、迁移覆盖缺损面，属于创伤修复中的再生过程，因此为病理性再生。若仅累及表皮，可由上皮完全再生恢复；若缺损深达真皮，则常伴肉芽组织和纤维瘢痕形成，但上皮增生修复仍属病理性再生范畴。其余选项均为正常生理条件下的细胞更新，不属于病理性再生。\n\n选项分析：\nA. 错误：消化道黏膜上皮细胞的更新属于生理性再生，是正常黏膜上皮不断脱落并由基底部干细胞增生补充的过程，发生于无组织缺损的生理状态。\nB. 错误：子宫内膜周期性脱落、增生、修复属于生理性再生，受卵巢激素周期性调节，是月经周期中的正常变化，不是病理状态下的缺损修复。\nC. 错误：鳞状上皮表层角化细胞脱落、基底细胞增生属于生理性再生，见于正常表皮更新，基底细胞持续增生并向表层分化以补充脱落细胞。\nD. 错误：血细胞的更新属于生理性再生，由骨髓造血干细胞持续增殖分化补充外周血细胞，维持正常血细胞数量。\nE. 正确：皮肤缺损后由周围被覆上皮增生、修复，是在组织缺损这一病理条件下发生的再生，属于病理性再生；若缺损较浅可完全再生，较深则常合并纤维性修复。\n\n易混点：生理性再生是正常组织更新，如黏膜、子宫内膜、表皮和血细胞更新；病理性再生是“缺损后修复”。另需区分完全再生与不完全再生：上皮缺损表浅时可完全再生，深达真皮或实质器官广泛损伤时常以纤维瘢痕修复为主。","chapter":2,"chapterName":"损伤的修复","chapterTitle":"第2章 损伤的修复"},{"id":"pathology-a-single-0294","type":"single","typeLabel":"单选题","number":294,"question":"下列哪种疾病不会引起肺气肿","options":[{"key":"A","text":"慢性支气管炎"},{"key":"B","text":"支气管扩张症"},{"key":"C","text":"支气管哮喘"},{"key":"D","text":"大叶性肺炎"},{"key":"E","text":"小叶性肺炎"}],"answerKeys":["D"],"answerText":["大叶性肺炎"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：肺气肿的病因及发病机制，即小气道不全阻塞、肺泡内压升高并伴肺泡间隔破坏。\n解析：肺气肿的本质是末梢肺组织含气量增多、肺泡间隔破坏、肺组织弹性减弱。凡能造成小气道不全阻塞或慢性炎症破坏者，均可导致气体潴留和肺泡过度膨胀。大叶性肺炎是肺泡内纤维素性渗出性炎，病变通常经消散完全吸收，不破坏肺泡间隔，也不造成持续性小气道阻塞，故一般不会引起肺气肿。题眼是“不会引起”。\n\n选项分析：\nA. 错误（指选A错误；该病会引起肺气肿）：慢性支气管炎使小气道狭窄、黏液栓阻塞，导致呼气性困难、气体潴留，并破坏肺泡间隔，是阻塞性肺气肿的常见原因。\nB. 错误（指选B错误；该病可引起肺气肿）：支气管扩张症伴慢性化脓性炎症和分泌物潴留，可造成远端小气道不全阻塞、肺泡过度充气，并常与慢性支气管炎、肺气肿并存。\nC. 错误（指选C错误；该病可引起肺气肿）：支气管哮喘反复发作时支气管痉挛、黏液栓形成和气道重塑，造成呼气性气流受限和肺过度充气，可参与肺气肿形成。\nD. 正确（本题答案）：大叶性肺炎为肺泡内纤维素性渗出，肺泡壁结构一般不受破坏，消散后肺组织可恢复正常，不引起肺气肿。\nE. 错误（指选E错误；该病可引起局限性肺气肿）：小叶性肺炎以细支气管为中心，炎性渗出物和黏液可阻塞小气道，形成活瓣样通气障碍，导致病变周围局限性肺气肿，也可伴肺不张。\n易混点：大叶性肺炎与小叶性肺炎的关键区别是，大叶性肺炎不破坏肺泡壁、消散完全，一般不引起肺气肿；小叶性肺炎以细支气管为中心，可阻塞小气道而继发局限性肺气肿或肺不张。记忆要点：大叶不毁壁、不气肿；小叶可阻塞、可气肿。","chapter":10,"chapterName":"呼吸系统疾病","chapterTitle":"第10章 呼吸系统疾病"},{"id":"pathology-a-single-0295","type":"single","typeLabel":"单选题","number":295,"question":"关于风湿性肉芽肿的叙述，下列哪项是错误的","options":[{"key":"A","text":"中心部位有较多纤维蛋白"},{"key":"B","text":"多发生于心肌间质血管旁"},{"key":"C","text":"常伴有淋巴细胞、浆细胞浸润"},{"key":"D","text":"特征性细胞是Aschoff细胞"},{"key":"E","text":"是风湿病的特征性病变，具有诊断意义"}],"answerKeys":["A"],"answerText":["中心部位有较多纤维蛋白"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：A\n核心考点：风湿性肉芽肿（Aschoff小体）的组成、部位及诊断意义。\n解析：风湿性肉芽肿又称Aschoff小体，是风湿病增生期的特征性病变，具有诊断意义。其中心为纤维素样坏死，周围可见成团的风湿细胞（Aschoff细胞、Anitschkow细胞，多核者称Aschoff巨细胞），并伴少量淋巴细胞、浆细胞浸润；常位于心肌间质小血管旁。题眼是“错误的是”，A项把中心病变说成“较多纤维蛋白”，混淆了纤维素样坏死与纤维蛋白性渗出，故为错误叙述。\n\n选项分析：\nA. 错误：风湿性肉芽肿中心是纤维素样坏死，周围为Aschoff细胞及炎细胞；大量纤维蛋白渗出主要见于纤维素性炎，如风湿性心外膜炎的纤维素性渗出，不是Aschoff小体中心的典型描述。\nB. 正确：风湿性肉芽肿多发生于心肌间质小血管旁，尤其左心室壁、室间隔等处，这是其好发部位。\nC. 正确：Aschoff小体周围常伴有淋巴细胞、浆细胞等慢性炎细胞浸润，符合肉芽肿性炎的一般特点。\nD. 正确：Aschoff细胞是风湿性肉芽肿的特征性细胞，体积大、胞质丰富，核染色质呈毛虫状，可形成多核的Aschoff巨细胞。\nE. 正确：风湿性肉芽肿是风湿病的特征性病变，对风湿病的病理诊断具有重要意义。\n\n易混点：Aschoff小体中心为纤维素样坏死，不是“纤维蛋白性渗出”；后者多见于风湿性心外膜炎，形成绒毛心。记忆要点：Aschoff小体＝中心纤维素样坏死＋周围Aschoff细胞＋小血管旁＋诊断意义。","chapter":9,"chapterName":"心血管系统疾病","chapterTitle":"第9章 心血管系统疾病"},{"id":"pathology-a-single-0296","type":"single","typeLabel":"单选题","number":296,"question":"下列不属于肉芽肿性炎的是","options":[{"key":"A","text":"风湿病"},{"key":"B","text":"伤寒"},{"key":"C","text":"矽肺"},{"key":"D","text":"乙脑"},{"key":"E","text":"麻风"}],"answerKeys":["D"],"answerText":["乙脑"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：肉芽肿性炎是以巨噬细胞及其衍生细胞（上皮样细胞、多核巨细胞）局限性增生形成结节状病灶为特征的慢性炎症。\n解析：肉芽肿性炎常见于结核、伤寒、麻风、风湿病、矽肺及异物反应等。乙型脑炎是乙脑病毒引起的病毒性脑炎，主要病变为神经元变性坏死、噬神经细胞现象、血管周围淋巴细胞套和胶质结节形成，并非巨噬细胞来源的肉芽肿，故不属于肉芽肿性炎。本题题眼是“乙脑的胶质结节不是真正肉芽肿”。\n\n选项分析：\nA. 错误：风湿病增生期形成风湿小体（Aschoff小体），中央为纤维素样坏死，周围有风湿细胞、巨噬细胞及多核Aschoff巨细胞，属于肉芽肿性炎。\nB. 错误：伤寒杆菌可引起伤寒小结，即伤寒肉芽肿，由吞噬伤寒杆菌、红细胞和细胞碎片的伤寒细胞构成，属于感染性肉芽肿。\nC. 错误：矽肺时硅尘被巨噬细胞吞噬形成尘细胞，刺激纤维组织增生并形成硅结节，属于异物性/慢性肉芽肿性反应范畴。\nD. 正确：乙脑为病毒性脑炎，病变为神经元坏死、噬神经细胞现象、淋巴细胞血管套及胶质结节；胶质结节由胶质细胞增生形成，不是巨噬细胞衍生的上皮样细胞肉芽肿。\nE. 错误：麻风由麻风分枝杆菌引起，结核样型麻风可见上皮样细胞肉芽肿，可伴Langhans巨细胞，属于肉芽肿性炎。\n\n易混点：乙脑的“胶质结节”最易被误认为肉芽肿，但胶质结节是神经胶质细胞增生，不是巨噬细胞/上皮样细胞结节；肉芽肿的关键是巨噬细胞及其衍生细胞局限性增生。风湿小体、伤寒小结、硅结节名称不同，但考试中均归入肉芽肿性炎相关病变。","chapter":4,"chapterName":"炎症","chapterTitle":"第4章 炎症"},{"id":"pathology-a-single-0297","type":"single","typeLabel":"单选题","number":297,"question":"在机化的血栓中形成与原血管腔相沟通的毛细血管，使部分血流得以恢复，这种现象称为","options":[{"key":"A","text":"血栓脱落"},{"key":"B","text":"侧支循环形成"},{"key":"C","text":"血栓机化"},{"key":"D","text":"血栓硬化"},{"key":"E","text":"再通"}],"answerKeys":["E"],"answerText":["再通"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n核心考点：机化血栓内形成与原血管腔相通的毛细血管、使部分血流恢复，称为血栓再通。\n解析：血栓形成后，肉芽组织从血管壁长入血栓并使其机化；在机化过程中，血栓内可形成由内皮细胞衬覆的毛细血管或小通道，并与原血管腔相通，使阻塞血管恢复部分血流，这一现象称为再通。题眼是“机化血栓内形成与原血管腔相沟通的毛细血管并恢复部分血流”，强调的是原血管腔内血栓内部的通道重建，而不是血栓溶解或血管外代偿。\n\n选项分析：\nA. 错误：血栓脱落指血栓与血管壁脱离形成栓子，随血流运行引起栓塞；题干没有栓子脱落和栓塞表现。\nB. 错误：侧支循环形成指原血管阻塞后，血管外吻合支或小血管扩张开放以代偿供血；其通路位于原阻塞血管之外，不是在机化血栓内部形成与原血管腔相通的毛细血管。\nC. 错误：血栓机化指肉芽组织从血管壁长入血栓并逐渐取代血栓，使血栓与血管壁粘连机化；它是再通发生的基础，但本题所问是机化后形成沟通性毛细血管并恢复血流的特定现象。\nD. 错误：血栓硬化多指血栓机化后纤维化、变硬，常持续阻塞血管；重点在纤维性修复和瘢痕化，并不强调形成与原血管腔相通并恢复血流的通道。\nE. 正确：再通是在机化血栓内形成内皮衬覆的毛细血管通道，并与原血管腔相通，使部分血流得以恢复，符合题干定义。\n\n易混点：机化是“肉芽组织取代血栓”，再通是机化过程中“血栓内形成新通道”；侧支循环是“原血管外的代偿通路开放”。记忆要点：机化生通道、部分复通即再通；脱落成栓子，侧支在血管外。","chapter":3,"chapterName":"局部血液循环障碍","chapterTitle":"第3章 局部血液循环障碍"},{"id":"pathology-a-single-0298","type":"single","typeLabel":"单选题","number":298,"question":"下列关于纤维素性炎症的叙述中，哪项是正确的","options":[{"key":"A","text":"合并有少量中性粒细胞浸润时应称为化脓性纤维素性炎"},{"key":"B","text":"当出现机化以后便引起纤维素性粘连"},{"key":"C","text":"其好发部位为黏膜、浆膜和肺"},{"key":"D","text":"假膜的必有成分是纤维素、白细胞、浆膜间皮细胞和细菌"},{"key":"E","text":"咽部假膜常与其下方的黏膜疏松粘连，易剥脱而引发严重后果"}],"answerKeys":["C"],"answerText":["其好发部位为黏膜、浆膜和肺"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：C\n核心考点：纤维素性炎是以纤维素渗出为主的渗出性炎，好发于黏膜、浆膜和肺。\n解析：纤维素性炎时，血管壁损伤较重，通透性明显增高，大量纤维蛋白原渗出后在组织内形成纤维素。病变常发生于黏膜（如白喉、细菌性痢疾，形成假膜性炎）、浆膜（如心包、胸膜，形成纤维素性渗出）和肺（如大叶性肺炎）。题眼是“好发部位”，C项准确概括了其典型分布。\n\n选项分析：\nA. 错误：纤维素性炎中出现少量中性粒细胞浸润是常见现象，不能据此称为化脓性纤维素性炎；化脓性炎的关键是大量中性粒细胞浸润并有脓液形成。\nB. 错误：纤维素性渗出物机化后，由肉芽组织取代并最终纤维化，形成的是纤维性粘连，而不是“纤维素性粘连”；且并非所有机化都必然引起临床粘连。\nC. 正确：黏膜、浆膜和肺是纤维素性炎的典型好发部位，分别对应假膜性炎、浆膜纤维素性渗出和肺的纤维素性炎。\nD. 错误：假膜主要见于黏膜的纤维素性炎，由纤维素、坏死上皮细胞、中性粒细胞及细菌等构成；“浆膜间皮细胞”不是假膜的必有成分，且细菌也非绝对必有。\nE. 错误：咽部假膜通常与下方黏膜粘连较紧密，不易剥脱；较疏松、易脱落并引起严重后果（如窒息）的是气管、支气管的假膜。\n\n易混点：黏膜纤维素性炎称假膜性炎，假膜与下方组织粘连程度因部位而异；咽部白喉假膜牢固，气管假膜较易脱落。浆膜纤维素性渗出吸收不全可机化形成纤维性粘连，注意“纤维素性”与机化后“纤维性”的区别。","chapter":4,"chapterName":"炎症","chapterTitle":"第4章 炎症"},{"id":"pathology-a-single-0299","type":"single","typeLabel":"单选题","number":299,"question":"肝硬化患者出现蜘蛛状血管痣是由于","options":[{"key":"A","text":"血管内压增高"},{"key":"B","text":"侧支循环形成"},{"key":"C","text":"凝血机制障碍"},{"key":"D","text":"雌激素增多"},{"key":"E","text":"低蛋白血症"}],"answerKeys":["D"],"answerText":["雌激素增多"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：D\n核心考点：肝硬化时肝功能减退导致雌激素灭活减少，皮肤小动脉扩张形成蜘蛛状血管痣。\n解析：肝硬化患者肝细胞功能受损，肝脏对雌激素的灭活作用减弱，使体内雌激素水平升高。雌激素可促使皮肤小动脉及其分支扩张，形成中心为小动脉、周围呈放射状毛细血管扩张的蜘蛛痣，压之可褪色，好发于面、颈、上胸及上肢。本题题眼是“肝硬化患者出现蜘蛛状血管痣”，其机制属于肝功能减退所致内分泌紊乱，而非门静脉高压本身。\n\n选项分析：\nA. 错误：血管内压增高主要与门静脉高压相关，可导致食管胃底静脉曲张、腹壁静脉曲张等，但不是蜘蛛状血管痣的直接发生机制。\nB. 错误：侧支循环形成是门静脉高压的典型表现，如食管胃底静脉曲张、腹壁静脉曲张和痔静脉扩张；蜘蛛痣属于皮肤小动脉扩张，不是侧支循环。\nC. 错误：凝血机制障碍因肝合成凝血因子减少及脾功能亢进致血小板减少，临床表现为鼻出血、牙龈出血、皮下瘀斑等，不形成蜘蛛痣。\nD. 正确：肝硬化时肝脏灭活雌激素能力下降，雌激素增多引起皮肤小动脉扩张，形成蜘蛛状血管痣，也可伴肝掌、男性乳房发育等。\nE. 错误：低蛋白血症主要因白蛋白合成减少，表现为腹水、水肿等；它不是蜘蛛痣形成的直接原因。\n\n易混点：蜘蛛痣和肝掌均与肝硬化时雌激素增多有关，属于肝功能减退表现；而食管胃底静脉曲张、腹壁静脉曲张属于门静脉高压侧支循环形成。记忆要点：蜘蛛痣“雌激素灭活减少、小动脉扩张”，侧支循环“门脉高压、静脉曲张”。","chapter":11,"chapterName":"消化系统疾病","chapterTitle":"第11章 消化系统疾病"},{"id":"pathology-a-single-0300","type":"single","typeLabel":"单选题","number":300,"question":"纤维素样坏死常发生于","options":[{"key":"A","text":"骨组织、细动脉壁"},{"key":"B","text":"结缔组织、平滑肌组织"},{"key":"C","text":"神经组织、细动脉壁"},{"key":"D","text":"鳞状上皮组织、移行上皮组织"},{"key":"E","text":"结缔组织、细动脉壁"}],"answerKeys":["E"],"answerText":["结缔组织、细动脉壁"],"topic":"病理学","category":"A1","score":1,"analysis":"答案：E\n\n核心考点：纤维素样坏死的好发部位是结缔组织和细动脉壁，本质为血浆蛋白渗入并伴纤维蛋白沉积。\n\n解析：纤维素样坏死又称纤维蛋白样坏死，常发生于结缔组织（如风湿病、系统性红斑狼疮的结缔组织病变）和细动脉壁（如恶性高血压、结节性多动脉炎等）。镜下坏死组织呈强嗜酸性、均质或颗粒状，类似纤维蛋白，并可伴炎症细胞浸润。本题题眼是“常发生部位”，应选结缔组织、细动脉壁。\n\n选项分析：\nA. 错误：细动脉壁是典型部位，但骨组织不是纤维素样坏死的常见发生部位；骨组织缺血时多发生凝固性坏死。  \nB. 错误：结缔组织正确，但平滑肌组织不是纤维素样坏死的标准好发部位；平滑肌可发生凝固性坏死等，概念不符。  \nC. 错误：细动脉壁正确，但神经组织不是典型部位；神经组织坏死常与液化性坏死相关。  \nD. 错误：鳞状上皮、移行上皮属于上皮组织，不是纤维素样坏死的典型部位，上皮坏死不能等同于纤维素样坏死。  \nE. 正确：纤维素样坏死典型发生于结缔组织和细动脉壁，常见于风湿病、系统性红斑狼疮、恶性高血压及结节性多动脉炎等。\n\n易混点：纤维素样坏死要与凝固性坏死、液化性坏死区分：前者突出血浆蛋白和纤维蛋白沉积于结缔组织或血管壁；后者分别多见于缺血性实质器官和脑组织。记忆要点：见到“风湿病、狼疮、恶性高血压、细动脉壁、强嗜酸性均质物质”，优先想到纤维素样坏死。","chapter":1,"chapterName":"细胞和组织的适应与损伤","chapterTitle":"第1章 细胞和组织的适应与损伤"}]}];

    qlistFilters: document.getElementById('qlistFilters'),

  function load(key, fallback) {
    try {
      var raw = localStorage.getItem(key);

    } catch (e) {
      return fallback;
    }
  }

  function save() {
    try {
      localStorage.setItem(LS_STATE, JSON.stringify(state));
      localStorage.setItem(LS_WRONG, JSON.stringify(wrongs));
    } catch (e) {}
  }

  var state = load(LS_STATE, { bankId: null, sessions: {} });
  if (!state || typeof state !== 'object') state = { bankId: null, sessions: {} };
  if (!state.sessions || typeof state.sessions !== 'object') state.sessions = {};
  if (!state.memorize || typeof state.memorize !== 'object') state.memorize = {};
  if (!state.wrongSessions || typeof state.wrongSessions !== 'object') state.wrongSessions = {};
  if (!state.modes || typeof state.modes !== 'object') state.modes = {};
  Object.keys(state.sessions).forEach(function (bankId) {
    var saved = state.sessions[bankId];
    if (!saved || typeof saved !== 'object') return;
    if (saved.mode === 'wrong') {
      if (!state.wrongSessions[bankId]) state.wrongSessions[bankId] = saved;
      delete state.sessions[bankId];
      if (!state.modes[bankId]) state.modes[bankId] = 'wrong';

      state.modes[bankId] = saved.mode;

  });

  var AUTO_NEXT_STORE = 'patho-auto-next-v1';
  var autoNextEnabled = load(AUTO_NEXT_STORE, true);
  if (typeof autoNextEnabled !== 'boolean') autoNextEnabled = true;
  var autoNextTimer = null;

  function clearAutoNext() {
    if (autoNextTimer) {
      clearTimeout(autoNextTimer);
      autoNextTimer = null;
    }
  }

  function scheduleAutoNext(question) {
    clearAutoNext();
    autoNextTimer = setTimeout(function () {
      autoNextTimer = null;
      if (!autoNextEnabled || isMemorize()) return;
      var ctx = currentQuestion();
      if (!ctx || ctx.q.id !== question.id) return;
      var answer = ctx.session.answers[question.id];
      if (answer === undefined || !isCorrect(ctx.q, answer)) return;
      move(1);
    }, 1000);
  }

  var wrongs = load(LS_WRONG, {});
  if (!wrongs || typeof wrongs !== 'object' || Array.isArray(wrongs)) wrongs = {};

  var AI_STORE = 'patho-ai-analysis-v1';
  var aiCache = load(AI_STORE, {});
  if (!aiCache || typeof aiCache !== 'object' || Array.isArray(aiCache)) aiCache = {};
  var aiPending = {};
  var aiErrors = {};

  var AI_SETTINGS_STORE = 'patho-ai-settings-v1';
  var aiSettings = load(AI_SETTINGS_STORE, {});
  if (!aiSettings || typeof aiSettings !== 'object' || Array.isArray(aiSettings)) aiSettings = {};
  aiSettings.baseUrl = aiSettings.baseUrl || 'https://api.deepseek.com';
  aiSettings.model = aiSettings.model || 'deepseek-flash';

  var ANALYSIS_SYSTEM_PROMPT = [
    '你是一名病理学教师，正在为准备考试的中国医学生讲解病理学选择题。请根据题干、选项和标准答案，输出可直接用于复习的详细解析。',
    '',
    '输出格式（纯文本，不要 Markdown，不要表格）：',
    '答案：<正确选项字母>',
    '核心考点：<一句话点明本题考查的病理学概念>',
    '解析：<2-4 句，说明正确答案的病理机制、形态学或临床联系，并点出本题题眼>',
    '选项分析：',
    'A. <正确/错误>：<理由>',
    'B. <正确/错误>：<理由>',
    '（每个选项单独一行，必须全部分析，不得省略）',
    '易混点：<1-3 句，辨析最易混淆的相近病变或概念，给出记忆要点>',
    '',
    '要求：',
    '- 以标准答案为准，不得质疑或修改答案。',
    '- 错误选项要说明它对应什么疾病或病变、错在哪个概念，不能只写“不符合”。',
    '- 正确选项要讲清病理学依据，优先覆盖考试常考机制、肉眼/镜下形态、好发部位和临床联系。',
    '- 题干提到图片但未提供时，注明“题目图片未提供”，仅依据文字信息分析，不编造图像细节。',
    '- 语言准确、条理清楚，避免空话和重复题干，总长度约 500-900 字。'
  ].join('\n');

  function saveAiCache() {
    try { localStorage.setItem(AI_STORE, JSON.stringify(aiCache)); } catch (e) {}
  }

  function saveAiSettings() {
    try { localStorage.setItem(AI_SETTINGS_STORE, JSON.stringify(aiSettings)); } catch (e) {}
  }

  function apiEndpoint() {
    return String(aiSettings.baseUrl || 'https://api.deepseek.com').replace(/\/+$/, '') + '/chat/completions';
  }

  function analysisMessages(q) {
    var optionLines = q.options.map(function (o) {
      return o.key + '. ' + o.text;
    }).join('\n');
    var answer = q.answerKeys.join('、');
    if (q.answerText && q.answerText.length) answer += '（' + q.answerText.join('；') + '）';
    var chapter = q.chapterTitle || (q.chapter ? '第' + q.chapter + '章 ' + (q.chapterName || '') : '');
    var content = [
      chapter ? '章节：' + chapter : '',
      '题目：' + q.question,
      '选项：',
      optionLines,
      '标准答案：' + answer
    ].filter(Boolean).join('\n');
    return [
      { role: 'system', content: ANALYSIS_SYSTEM_PROMPT },
      { role: 'user', content: content }
    ];
  }

  function extractAnalysis(data) {
    var choices = data && data.choices ? data.choices : [];
    if (!choices.length) throw new Error('接口未返回结果');
    var message = choices[0].message || {};
    var text = String(message.content || message.reasoning_content || '').trim();
    if (!text) throw new Error('接口未返回解析内容');
    return { text: text, finish: choices[0].finish_reason };
  }

  function callDeepSeek(q, maxTokens, signal) {
    return fetch(apiEndpoint(), {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + aiSettings.key,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        model: aiSettings.model || 'deepseek-flash',
        messages: analysisMessages(q),
        temperature: 0.2,
        max_tokens: maxTokens,
        stream: false
      }),
      signal: signal
    }).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (data) {
        if (!res.ok) {
          var detail = data && data.error ? (data.error.message || data.error) : ('HTTP ' + res.status);
          throw new Error(typeof detail === 'string' ? detail : JSON.stringify(detail));
        }
        return data;
      });
    });
  }

  function requestAnalysis(q) {
    if (aiPending[q.id]) return;
    if (!aiSettings.key) {
      openAiSettings('请先填写 DeepSeek API Key，保存在本浏览器后即可生成解析。');
      return;
    }
    aiPending[q.id] = true;
    delete aiErrors[q.id];
    render();
    var controller = new AbortController();
    var timer = setTimeout(function () { controller.abort(); }, 120000);
    callDeepSeek(q, 8192, controller.signal)
      .then(function (data) {
        var result = extractAnalysis(data);
        if (result.finish === 'length') {
          return callDeepSeek(q, 16384, controller.signal).then(extractAnalysis);
        }
        return result;
      })
      .then(function (result) {
        clearTimeout(timer);
        aiCache[q.id] = result.text;
        saveAiCache();
        aiPending[q.id] = false;
        render();
      })
      .catch(function (err) {
        clearTimeout(timer);
        aiPending[q.id] = false;
        var message = err && err.name === 'AbortError'
          ? '请求超时（120 秒）'
          : (err && err.message ? err.message : String(err));
        aiErrors[q.id] = message;
        render();
      });
  }

  function setAiModalStatus(text, kind) {
    els.aiModalStatus.textContent = text;
    els.aiModalStatus.className = 'modal-status' + (kind ? ' ' + kind : '');
  }

  function openAiSettings(message) {
    clearAutoNext();
    els.aiKeyInput.value = aiSettings.key || '';
    els.aiModelInput.value = aiSettings.model || 'deepseek-flash';
    els.aiBaseInput.value = aiSettings.baseUrl || 'https://api.deepseek.com';
    els.aiModal.hidden = false;
    setAiModalStatus(message || '', '');
    setTimeout(function () { els.aiKeyInput.focus(); }, 30);
  }

  function closeAiSettings() {
    els.aiModal.hidden = true;
  }

  function settingsFromForm() {
    return {
      key: els.aiKeyInput.value.trim(),
      model: els.aiModelInput.value.trim() || 'deepseek-flash',
      baseUrl: (els.aiBaseInput.value.trim() || 'https://api.deepseek.com').replace(/\/+$/, '')
    };
  }

  function saveSettingsFromForm() {
    aiSettings = settingsFromForm();
    saveAiSettings();
    setAiModalStatus('已保存到本浏览器', 'ok');
  }

  function testAiConnection() {
    var form = settingsFromForm();
    if (!form.key) {
      setAiModalStatus('请先填写 API Key', 'bad');
      return;
    }
    var controller = new AbortController();
    var timer = setTimeout(function () { controller.abort(); }, 60000);
    setAiModalStatus('测试连接中…', '');
    fetch(form.baseUrl + '/chat/completions', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + form.key, 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: form.model,
        messages: [{ role: 'user', content: '只回复：OK' }],
        temperature: 0,
        max_tokens: 64,
        stream: false
      }),
      signal: controller.signal
    }).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (data) {
        if (!res.ok) {
          var detail = data && data.error ? (data.error.message || data.error) : ('HTTP ' + res.status);
          throw new Error(typeof detail === 'string' ? detail : JSON.stringify(detail));
        }
        return data;
      });
    }).then(function (data) {
      clearTimeout(timer);
      setAiModalStatus('连接成功：' + (data.model || form.model), 'ok');
    }).catch(function (err) {
      clearTimeout(timer);
      var message = err && err.name === 'AbortError'
        ? '连接超时'
        : (err && err.message ? err.message : String(err));
      setAiModalStatus('连接失败：' + message, 'bad');
    });
  }

  if (!BANKS.length) {
    document.body.innerHTML = '<div class="app"><main class="card glass"><div class="empty"><div class="empty-title">未找到题库</div><p>题库数据未正确内嵌，请重新生成 index.html。</p></div></main></div>';
    return;
  }

  function getBank(id) {
    for (var i = 0; i < BANKS.length; i++) {
      if (BANKS[i].id === id) return BANKS[i];
    }
    return BANKS[0];
  }

  var bankExists = BANKS.some(function (b) { return b.id === state.bankId; });
  if (!bankExists) state.bankId = BANKS[0].id;

  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  function createSession(bankId, mode, chapter, answers) {
    var bank = getBank(bankId);
    chapter = Number(chapter) || 0;
    var order = [];
    bank.questions.forEach(function (q, i) {
      if (!chapter || Number(q.chapter) === chapter) order.push(i);
    });
    if (mode === 'random') {
      shuffle(order);
    } else if (mode === 'wrong') {
      var set = {};
      (wrongs[bankId] || []).forEach(function (id) { set[id] = true; });
      order = order.filter(function (i) { return set[bank.questions[i].id]; });
    }
    return {
      mode: mode || 'seq',
      chapter: chapter,
      order: order,
      index: 0,
      answers: answers && typeof answers === 'object' ? answers : {}
    };
  }

  function sessionValid(s, bankId) {
    var bank = getBank(bankId);
    return !!s && typeof s === 'object' &&
      Array.isArray(s.order) &&
      typeof s.index === 'number' &&
      s.answers && typeof s.answers === 'object' &&
      !s.order.some(function (i) { return i < 0 || i >= bank.questions.length; });
  }

  function getMainSession(bankId) {
    var s = state.sessions[bankId];
    var wrong = state.wrongSessions[bankId];
    var chapter = s && typeof s.chapter === 'number' ? s.chapter :
      (wrong && typeof wrong.chapter === 'number' ? wrong.chapter : 0);
    if (s && s.mode !== 'wrong' && sessionValid(s, bankId)) {
      s.chapter = Number(s.chapter) || 0;
      state.sessions[bankId] = s;
      return s;
    }
    if (s) chapter = typeof s.chapter === 'number' ? s.chapter : chapter;
    var mode = s && s.mode === 'random' ? 'random' : 'seq';
    var answers = s && s.answers && typeof s.answers === 'object' ? s.answers : {};
    var created = createSession(bankId, mode, chapter, answers);
    state.sessions[bankId] = created;
    return created;
  }

  function getSession(bankId, mode) {
    if (mode === 'seq' || mode === 'random' || mode === 'wrong') {
      state.modes[bankId] = mode;
    }
    var active = state.modes[bankId];
    if (active !== 'seq' && active !== 'random' && active !== 'wrong') {
      var stored = state.sessions[bankId];
      active = stored && stored.mode === 'random' ? 'random' : 'seq';
    }
    var main = getMainSession(bankId);
    if (active === 'wrong') {
      var chapter = main.chapter || 0;
      var ws = state.wrongSessions[bankId];
      if (!sessionValid(ws, bankId) || ws.mode !== 'wrong' || ws.chapter !== chapter) {
        ws = createSession(bankId, 'wrong', chapter);
        state.wrongSessions[bankId] = ws;
      }
      state.modes[bankId] = 'wrong';
      return ws;
    }
    if (main.mode !== active) {
      var next = createSession(bankId, active, main.chapter, main.answers);
      state.sessions[bankId] = next;
      main = next;
    }
    state.modes[bankId] = main.mode;
    return main;
  }

  function isMemorize() {
    return !!state.memorize[state.bankId];
  }

  function toggleMemorize() {
    clearAutoNext();
    state.memorize[state.bankId] = !state.memorize[state.bankId];
    save();
    render();
  }

  function isCorrect(q, key) {
    return q.answerKeys.indexOf(key) !== -1;
  }

  function addWrong(bankId, qid) {
    if (!Array.isArray(wrongs[bankId])) wrongs[bankId] = [];
    if (wrongs[bankId].indexOf(qid) === -1) wrongs[bankId].push(qid);
  }

  function removeWrong(bankId, qid) {
    if (!Array.isArray(wrongs[bankId])) return;
    var i = wrongs[bankId].indexOf(qid);
    if (i !== -1) wrongs[bankId].splice(i, 1);
  }

  function currentQuestion() {
    var bank = getBank(state.bankId);
    var s = getSession(state.bankId, null);
    if (!s.order.length) return null;
    s.index = Math.max(0, Math.min(s.index, s.order.length - 1));
    return { bank: bank, session: s, q: bank.questions[s.order[s.index]] };
  }

  function choose(key) {
    if (isMemorize()) return;
    clearAutoNext();
    var ctx = currentQuestion();
    if (!ctx) return;
    var q = ctx.q;
    var s = ctx.session;
    if (s.answers[q.id] !== undefined) return;
    var correctNow = isCorrect(q, key);
    s.answers[q.id] = key;
    if (correctNow) removeWrong(ctx.bank.id, q.id);
    else addWrong(ctx.bank.id, q.id);
    save();
    render();
    if (correctNow && autoNextEnabled) {
      var session = getSession(state.bankId, null);
      if (session.index < session.order.length - 1) {
        scheduleAutoNext(q);
      }
    }
  }

  function restoreScroll(y) {
    window.scrollTo(0, y);
    if (window.requestAnimationFrame) {
      requestAnimationFrame(function () { window.scrollTo(0, y); });
    }
    setTimeout(function () { window.scrollTo(0, y); }, 40);
  }

  function move(delta) {
    clearAutoNext();
    var ctx = currentQuestion();
    if (!ctx) return;
    var next = ctx.session.index + delta;
    if (next < 0 || next >= ctx.session.order.length) return;
    var scrollY = window.scrollY || window.pageYOffset || 0;
    ctx.session.index = next;
    save();
    render();
    restoreScroll(scrollY);
  }

  var qlistFilter = 'all';
  var qlistOpen = false;

  function qlistStatus(q, s) {
    var answer = s.answers[q.id];
    if (answer === undefined) return 'todo';
    return isCorrect(q, answer) ? 'right' : 'wrong';
  }

  function renderQuestionList() {
    var bank = getBank(state.bankId);
    var s = getSession(state.bankId, null);
    var questions = s.order.map(function (i) { return bank.questions[i]; });
    var answered = 0;
    var right = 0;
    var wrong = 0;
    questions.forEach(function (q) {
      var status = qlistStatus(q, s);
      if (status === 'right') { answered++; right++; }
      else if (status === 'wrong') { answered++; wrong++; }
    });
    var imageCount = questions.filter(function (q) { return q.needsImage; }).length;
    els.qlistStats.textContent = '共 ' + questions.length + ' 题 · 已答 ' + answered +
      ' · 答对 ' + right + ' · 答错 ' + wrong +
      (imageCount ? ' · 缺图 ' + imageCount : '');
    els.qlist.innerHTML = '';
    var currentEl = null;
    var shown = 0;

    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var status = qlistStatus(q, s);
      if (qlistFilter === 'todo' && status !== 'todo') continue;
      if (qlistFilter === 'wrong' && status !== 'wrong') continue;
      if (qlistFilter === 'right' && status !== 'right') continue;
      if (qlistFilter === 'image' && !q.needsImage) continue;
      shown++;

      var item = document.createElement('button');
      item.type = 'button';
      item.className = 'qlist-item' + (status === 'todo' ? '' : ' ' + status) +
        (i === s.index ? ' current' : '');
      item.setAttribute('data-qindex', String(i));

      var num = document.createElement('span');
      num.className = 'qlist-num';
      num.textContent = String(i + 1);

      var body = document.createElement('span');
      var text = document.createElement('span');
      text.className = 'qlist-text';
      text.textContent = q.question;
      var meta = document.createElement('span');
      meta.className = 'qlist-meta';
      var parts = [];
      if (q.chapter) parts.push('第' + q.chapter + '章 ' + (q.chapterName || ''));
      if (q.category) parts.push(q.category);
      meta.textContent = parts.join(' · ');
      body.appendChild(text);
      body.appendChild(meta);

      var stateEl = document.createElement('span');
      stateEl.className = 'qlist-state';
      stateEl.textContent = status === 'right' ? '答对' : status === 'wrong' ? '答错' : '未做';

      item.appendChild(num);
      item.appendChild(body);
      if (q.needsImage) {
        var flag = document.createElement('span');
        flag.className = 'qlist-flag';
        flag.textContent = '缺图';
        item.appendChild(flag);
      }
      item.appendChild(stateEl);
      if (i === s.index) currentEl = item;
      els.qlist.appendChild(item);
    }

    if (!shown) {
      var empty = document.createElement('div');
      empty.className = 'qlist-empty';
      empty.textContent = qlistFilter === 'wrong' ? '还没有答错的题目' :
        qlistFilter === 'right' ? '还没有答对的题目' :
        qlistFilter === 'image' ? '没有缺图题目' : '本组暂无题目';
      els.qlist.appendChild(empty);
    }

    var filterBtns = els.qlistFilters.querySelectorAll('[data-qfilter]');
    for (var f = 0; f < filterBtns.length; f++) {
      filterBtns[f].classList.toggle('active', filterBtns[f].getAttribute('data-qfilter') === qlistFilter);
    }

    if (currentEl) {
      requestAnimationFrame(function () {
        var listRect = els.qlist.getBoundingClientRect();
        var itemRect = currentEl.getBoundingClientRect();
        els.qlist.scrollTop += itemRect.top - listRect.top -
          (els.qlist.clientHeight - itemRect.height) / 2;
      });
    }
  }

  function openQuestionList() {
    if (els.quiz.hidden) return;
    clearAutoNext();
    qlistOpen = true;
    document.body.classList.add('list-open');
    els.qlistOverlay.hidden = false;
    els.qlistPanel.hidden = false;
    els.btnQList.setAttribute('aria-expanded', 'true');
    els.mQList.setAttribute('aria-expanded', 'true');
    renderQuestionList();
  }

  function closeQuestionList() {
    qlistOpen = false;
    document.body.classList.remove('list-open');
    els.qlistOverlay.hidden = true;
    els.qlistPanel.hidden = true;
    els.btnQList.setAttribute('aria-expanded', 'false');
    els.mQList.setAttribute('aria-expanded', 'false');
  }

  function jumpToQuestion(index) {
    var s = getSession(state.bankId, null);
    if (index < 0 || index >= s.order.length) return;
    clearAutoNext();
    var scrollY = window.scrollY || window.pageYOffset || 0;
    s.index = index;
    save();
    closeQuestionList();
    render();
    restoreScroll(scrollY);
  }

  function switchMode(mode) {
    var bankId = state.bankId;
    var active = state.modes[bankId] || 'seq';
    if (mode === active) return;
    clearAutoNext();
    var current = getSession(bankId, null);
    var chapter = current.chapter || 0;
    var bank = getBank(bankId);
    if (mode === 'wrong') {
      var main = getMainSession(bankId);
      var mainNext = main.chapter === chapter ? main :
        createSession(bankId, main.mode === 'random' ? 'random' : 'seq', chapter, main.answers);
      state.sessions[bankId] = mainNext;
      state.wrongSessions[bankId] = createSession(bankId, 'wrong', chapter);
      state.modes[bankId] = 'wrong';
    } else {
      if (mode !== 'seq' && mode !== 'random') mode = 'seq';
      var main2 = getMainSession(bankId);
      var currentQid = null;
      if (current.order && current.order.length) {
        var idx = Math.max(0, Math.min(current.index, current.order.length - 1));
        var q = bank.questions[current.order[idx]];
        if (q) currentQid = q.id;
      }
      var next = createSession(bankId, mode, chapter, main2.answers);
      if (currentQid) {
        for (var i = 0; i < next.order.length; i++) {
          if (bank.questions[next.order[i]].id === currentQid) {
            next.index = i;
            break;
          }
        }
      }
      state.sessions[bankId] = next;
      state.modes[bankId] = mode;
    }
    save();
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function changeChapter(chapter) {
    clearAutoNext();
    var bankId = state.bankId;
    chapter = Number(chapter) || 0;
    var current = getSession(bankId, null);
    var main = getMainSession(bankId);
    var mainMode = main.mode === 'random' ? 'random' : 'seq';
    var nextMain = createSession(bankId, mainMode, chapter, main.answers);
    state.sessions[bankId] = nextMain;
    if (current.mode === 'wrong') {
      state.wrongSessions[bankId] = createSession(bankId, 'wrong', chapter);
      state.modes[bankId] = 'wrong';
    } else {
      state.modes[bankId] = mainMode;
    }
    save();
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function restart() {
    clearAutoNext();
    var bankId = state.bankId;
    var s = getSession(bankId, null);
    var bank = getBank(bankId);
    var answered = s.order.filter(function (i) {
      return s.answers[bank.questions[i].id] !== undefined;
    }).length;
    if (answered && !window.confirm('确定重新开始？本章节的作答记录将清空。')) return;
    var chapter = s.chapter || 0;
    if (s.mode === 'wrong') {
      state.wrongSessions[bankId] = createSession(bankId, 'wrong', chapter);
      state.modes[bankId] = 'wrong';
    } else {
      var remaining = {};
      Object.keys(s.answers).forEach(function (qid) { remaining[qid] = s.answers[qid]; });
      s.order.forEach(function (i) { delete remaining[bank.questions[i].id]; });
      var mode = s.mode === 'random' ? 'random' : 'seq';
      state.sessions[bankId] = createSession(bankId, mode, chapter, remaining);
      state.modes[bankId] = mode;
    }
    save();
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function renderBanks() {
    els.bankTabs.innerHTML = '';
    BANKS.forEach(function (bank) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'bank-tab' + (bank.id === state.bankId ? ' active' : '');
      var name = document.createElement('b');
      name.textContent = bank.name;
      var count = document.createElement('em');
      count.textContent = bank.questions.length + ' 题';
      btn.appendChild(name);
      btn.appendChild(count);
      btn.addEventListener('click', function () {
        if (state.bankId === bank.id) return;
        clearAutoNext();
        state.bankId = bank.id;
        save();
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
      els.bankTabs.appendChild(btn);
    });
  }

  function renderEmpty(title, desc, showAction) {
    els.quiz.hidden = true;
    els.empty.hidden = false;
    els.emptyTitle.textContent = title;
    els.emptyDesc.textContent = desc;
    els.emptyAction.hidden = !showAction;
  }

  function renderChapterSelect(bank, s) {
    els.chapterSelect.innerHTML = '';
    var counts = {};
    bank.questions.forEach(function (q) {
      var c = Number(q.chapter);
      if (c >= 1 && c <= 19) counts[c] = (counts[c] || 0) + 1;
    });
    var all = document.createElement('option');
    all.value = '0';
    all.textContent = '全部章节（' + bank.questions.length + ' 题）';
    els.chapterSelect.appendChild(all);
    for (var n = 1; n <= 19; n++) {
      var opt = document.createElement('option');
      opt.value = String(n);
      opt.textContent = '第' + n + '章 ' + CHAPTER_NAMES[n] + '（' + (counts[n] || 0) + ' 题）';
      els.chapterSelect.appendChild(opt);
    }
    els.chapterSelect.value = String(s.chapter || 0);
  }

  function render() {
    var bank = getBank(state.bankId);
    var s = getSession(state.bankId, null);
    var memorize = isMemorize();

    els.mobileDock.hidden = true;
    renderBanks();
    renderChapterSelect(bank, s);

    var modeBtns = els.modeButtons.querySelectorAll('[data-mode]');
    for (var m = 0; m < modeBtns.length; m++) {
      modeBtns[m].classList.toggle('active', modeBtns[m].getAttribute('data-mode') === s.mode);
    }
    els.btnMemorize.classList.toggle('active', memorize);
    els.btnMemorize.setAttribute('aria-pressed', memorize ? 'true' : 'false');

    var questions = s.order.map(function (i) { return bank.questions[i]; });
    var answeredList = questions.filter(function (q) { return s.answers[q.id] !== undefined; });
    var correctList = answeredList.filter(function (q) { return isCorrect(q, s.answers[q.id]); });
    var answeredCount = answeredList.length;
    var total = questions.length;
    var wrongCount = (wrongs[bank.id] || []).length;

    els.statAnswered.textContent = answeredCount;
    els.statCorrect.textContent = correctList.length;
    els.statRate.textContent = answeredCount ? Math.round(correctList.length / answeredCount * 100) + '%' : '—';
    els.statWrong.textContent = wrongCount;
    var displayIndex = Math.max(0, Math.min(s.index, Math.max(total - 1, 0)));
    els.progressBar.style.width = (total ? (memorize ? (displayIndex + 1) / total * 100 : answeredCount / total * 100) : 0) + '%';

    if (!total) {
      if (s.mode === 'wrong') {
        var wrongTotal = (wrongs[bank.id] || []).length;
        if (s.chapter && wrongTotal) {
          renderEmpty('本章暂无错题', '当前章节在错题本中还没有题目。', true);
          els.emptyAction.textContent = '查看全部错题';
          els.emptyAction.onclick = function () { changeChapter(0); };
        } else {
          renderEmpty('错题本是空的', '在练习中答错的题目会自动收录到这里。', true);
          els.emptyAction.textContent = '去顺序练习';
          els.emptyAction.onclick = function () { switchMode('seq'); };
        }
      } else if (s.chapter) {
        renderEmpty('本章暂无题目', '「第' + s.chapter + '章 ' + CHAPTER_NAMES[s.chapter] + '」在当前题库中没有题目。', true);
        els.emptyAction.textContent = '查看全部章节';
        els.emptyAction.onclick = function () { changeChapter(0); };
      } else {
        renderEmpty('当前题库没有题目', '请检查 data.js 中的题库数据。', false);
      }
      return;
    }

    els.empty.hidden = true;
    els.quiz.hidden = false;

    s.index = Math.max(0, Math.min(s.index, total - 1));
    var q = questions[s.index];
    var selected = s.answers[q.id];
    var done = selected !== undefined;
    var correct = done && isCorrect(q, selected);

    els.qMeta.innerHTML = '';
    var typeBadge = document.createElement('span');
    typeBadge.className = 'badge';
    typeBadge.textContent = q.typeLabel || '单选题';
    els.qMeta.appendChild(typeBadge);
    if (q.chapter) {
      var chapterEl = document.createElement('span');
      chapterEl.className = 'badge chapter-badge';
      chapterEl.textContent = '第' + q.chapter + '章 ' + (q.chapterName || CHAPTER_NAMES[q.chapter] || '');
      els.qMeta.appendChild(chapterEl);
    }
    if (q.needsImage) {
      var imageBadge = document.createElement('span');
      imageBadge.className = 'badge image-badge';
      imageBadge.textContent = '缺图';
      els.qMeta.appendChild(imageBadge);
    }
    var metaParts = [];
    if (q.category) metaParts.push(q.category);
    if (q.number != null && q.number !== '') metaParts.push('原题号 ' + q.number);
    if (metaParts.length) {
      var metaText = document.createElement('span');
      metaText.textContent = metaParts.join(' · ');
      els.qMeta.appendChild(metaText);
    }

    els.qText.textContent = q.question;
    els.qImageWarning.hidden = !q.needsImage;
    if (q.needsImage) {
      els.qImageWarning.textContent = '缺图提示：本题依赖图片，题库未包含原图，答案与解析可能不完整。';
    }

    els.qOptions.innerHTML = '';
    q.options.forEach(function (o) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'option';
      var keyEl = document.createElement('span');
      keyEl.className = 'key';
      keyEl.textContent = o.key;
      var txtEl = document.createElement('span');
      txtEl.className = 'txt';
      txtEl.textContent = o.text;
      btn.appendChild(keyEl);
      btn.appendChild(txtEl);

      if (done || memorize) {
        var isAnswer = isCorrect(q, o.key);
        if (isAnswer) btn.classList.add('correct');
        if (done && o.key === selected) {
          btn.classList.add('selected');
          if (!isAnswer) btn.classList.add('wrong');
        }
        btn.disabled = true;
      } else {
        btn.addEventListener('click', function () { choose(o.key); });
      }
      els.qOptions.appendChild(btn);
    });

    els.feedback.className = 'feedback';
    els.feedback.innerHTML = '';
    if (memorize) {
      els.feedback.classList.add('ok');
      els.feedback.textContent = '背题模式：正确答案 ' + q.answerKeys.join('、') + '（不计入答题统计）';
    } else if (!done) {
      els.feedback.classList.add('hint');
      els.feedback.textContent = '请选择一个答案';
    } else if (correct) {
      els.feedback.classList.add('ok');
      els.feedback.textContent = '回答正确';
    } else {
      els.feedback.classList.add('bad');
      els.feedback.textContent = '回答错误，正确答案：' + q.answerKeys.join('、');
    }
    var reveal = done || memorize;
    var aiText = reveal ? (aiCache[q.id] || q.analysis || '') : '';
    if (aiText) {
      var analysisEl = document.createElement('div');
      analysisEl.className = 'analysis';
      analysisEl.textContent = aiText;
      els.feedback.appendChild(analysisEl);
    }
    if (reveal) {
      var aiRow = document.createElement('div');
      aiRow.className = 'ai-row';
      var aiBtn = document.createElement('button');
      aiBtn.type = 'button';
      aiBtn.className = 'ai-btn';
      aiBtn.disabled = !!aiPending[q.id];
      aiBtn.textContent = aiPending[q.id] ? '生成中…' : (aiText ? '重新生成解析' : '生成 AI 解析');
      aiBtn.addEventListener('click', function () { requestAnalysis(q); });
      aiRow.appendChild(aiBtn);
      var aiStatus = document.createElement('span');
      aiStatus.className = 'ai-status';
      if (aiPending[q.id]) aiStatus.textContent = '正在请求 DeepSeek，请稍候';
      else if (aiErrors[q.id]) aiStatus.textContent = '生成失败：' + aiErrors[q.id] + '，可重试';
      else if (aiText && aiCache[q.id]) aiStatus.textContent = '解析已保存在本浏览器';
      else if (aiText) aiStatus.textContent = '内置解析';
      else if (!aiSettings.key) aiStatus.textContent = '尚未配置 API Key，点击后可设置';
      else aiStatus.textContent = '使用已保存的 API Key 生成';
      aiRow.appendChild(aiStatus);
      els.feedback.appendChild(aiRow);
    }

    var allDone = !memorize && answeredCount === total;
    els.doneBanner.hidden = !allDone;
    if (allDone) {
      var rate = Math.round(correctList.length / total * 100);
      els.doneText.textContent = '本轮完成：答对 ' + correctList.length + ' / ' + total + ' 题（' + rate + '%）';
    }

    els.qPos.textContent = (s.index + 1) + ' / ' + total;
    els.btnPrev.disabled = s.index === 0;
    els.btnNext.disabled = s.index === total - 1;
    els.mobilePos.textContent = (s.index + 1) + ' / ' + total;
    els.mobilePrev.disabled = s.index === 0;
    els.mobileNext.disabled = s.index === total - 1;
    els.mobileDock.hidden = false;
    if (qlistOpen) renderQuestionList();
  }

  els.modeButtons.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-mode]');
    if (!btn) return;
    switchMode(btn.getAttribute('data-mode'));
  });

  els.btnMemorize.addEventListener('click', toggleMemorize);

  els.chapterSelect.addEventListener('change', function () {
    changeChapter(Number(els.chapterSelect.value) || 0);
    els.chapterSelect.blur();
  });

  els.btnPrev.addEventListener('click', function () { move(-1); });
  els.btnNext.addEventListener('click', function () { move(1); });
  els.mobilePrev.addEventListener('click', function () { move(-1); });
  els.mobileNext.addEventListener('click', function () { move(1); });
  els.btnQList.addEventListener('click', openQuestionList);
  els.mQList.addEventListener('click', openQuestionList);
  els.qlistClose.addEventListener('click', closeQuestionList);
  els.qlistOverlay.addEventListener('click', closeQuestionList);
  els.qlistFilters.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-qfilter]');
    if (!btn) return;
    qlistFilter = btn.getAttribute('data-qfilter');
    renderQuestionList();
  });
  els.qlist.addEventListener('click', function (e) {
    var item = e.target.closest('[data-qindex]');
    if (!item) return;
    jumpToQuestion(Number(item.getAttribute('data-qindex')));
  });
  els.btnRestart.addEventListener('click', restart);
  document.getElementById('doneRestart').addEventListener('click', restart);

  els.btnAiSettings.addEventListener('click', function () { openAiSettings(''); });
  els.aiClose.addEventListener('click', closeAiSettings);
  els.aiCancel.addEventListener('click', closeAiSettings);
  els.aiModal.addEventListener('click', function (e) {
    if (e.target === els.aiModal) closeAiSettings();
  });
  els.aiSave.addEventListener('click', saveSettingsFromForm);
  els.aiTest.addEventListener('click', testAiConnection);
  els.aiClear.addEventListener('click', function () {
    aiSettings.key = '';
    saveAiSettings();
    els.aiKeyInput.value = '';
    setAiModalStatus('密钥已清除', 'ok');
  });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (!els.aiModal.hidden) closeAiSettings();
    if (qlistOpen) closeQuestionList();
  });

  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (!els.aiModal.hidden || qlistOpen) return;
    var tag = e.target && e.target.tagName ? e.target.tagName.toLowerCase() : '';
    if (tag === 'input' || tag === 'textarea') return;
    var isSideArrow = e.key === 'ArrowLeft' || e.key === 'ArrowRight';
    if (tag === 'select' && !isSideArrow) return;
    var ctx = currentQuestion();
    if (!ctx) return;
    var q = ctx.q;
    var s = ctx.session;

    if (e.key === 'ArrowLeft') { e.preventDefault(); move(-1); return; }
    if (e.key === 'ArrowRight') { e.preventDefault(); move(1); return; }
    if (e.key === 'Enter') {
      if (isMemorize() || s.answers[q.id] !== undefined) { e.preventDefault(); move(1); }
      return;
    }
    if (isMemorize() || s.answers[q.id] !== undefined) return;

    var letter = e.key.toUpperCase();
    if (/^[A-Z]$/.test(letter)) {
      var match = q.options.filter(function (o) { return o.key === letter; })[0];
      if (match) { e.preventDefault(); choose(match.key); }
      return;
    }
    if (/^[1-9]$/.test(e.key)) {
      var opt = q.options[Number(e.key) - 1];
      if (opt) { e.preventDefault(); choose(opt.key); }
    }
  });

  var THEME_STORE = 'patho-theme-v1';
  function currentTheme() {
    var theme = document.documentElement.getAttribute('data-theme');
    return theme === 'green' || theme === 'dark' ? theme : 'light';
  }
  function applyTheme(theme) {
    if (theme !== 'green' && theme !== 'dark' && theme !== 'light') theme = 'light';
    var root = document.documentElement;
    root.classList.add('theme-switching');
    root.setAttribute('data-theme', theme);
    if (window.requestAnimationFrame) {
      requestAnimationFrame(function () {
        requestAnimationFrame(function () { root.classList.remove('theme-switching'); });
      });
    }
    setTimeout(function () { root.classList.remove('theme-switching'); }, 250);
    try { localStorage.setItem(THEME_STORE, theme); } catch (e) {}
    var meta = document.getElementById('themeColor');
    if (meta) {
      meta.setAttribute('content', theme === 'green' ? '#c7edcc' : theme === 'dark' ? '#151b18' : '#eef3fb');
    }
    var btns = document.querySelectorAll('[data-theme-btn]');
    for (var i = 0; i < btns.length; i++) {
      var on = btns[i].getAttribute('data-theme-btn') === theme;
      btns[i].classList.toggle('active', on);
      btns[i].setAttribute('aria-pressed', on ? 'true' : 'false');
    }
  }
  var themeBtns = document.querySelectorAll('[data-theme-btn]');
  for (var ti = 0; ti < themeBtns.length; ti++) {
    themeBtns[ti].addEventListener('click', function () {
      applyTheme(this.getAttribute('data-theme-btn'));
    });
  }
  applyTheme(currentTheme());

  els.autoNextToggle.checked = autoNextEnabled;
  els.autoNextToggle.addEventListener('change', function () {
    autoNextEnabled = !!els.autoNextToggle.checked;
    try { localStorage.setItem(AUTO_NEXT_STORE, JSON.stringify(autoNextEnabled)); } catch (e) {}
    if (!autoNextEnabled) clearAutoNext();
  });

  save();
  render();
})();
</script>
<script>
(function () {
  var canRegister = location.protocol === 'https:' ||
    location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  if (!canRegister || !('serviceWorker' in navigator)) return;
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').catch(function () {});
  });
})();
</script>
